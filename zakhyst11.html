 ["Не погоджуйтеся — це перше і найважливіше правило!", "Припиніть спілкування: не відповідайте, заблокуйте підозрілих осіб.", "Збережіть докази: скріншоти листування, контакти, номери телефонів.", "Розкажіть дорослим, яким довіряєте: батькам, учителям, поліції чи СБУ.", "Повідомте: чат-бот СБУ «Спали ФСБшника» у Telegram (@Spaly_FSB_bot), гаряча лінія СБУ 0800 501 482, Національна поліція — 102."]}, {"h": "Сила небайдужості", "p": ["Увага до свого оточення допомагає вберегти близьких від впливу вербувальників. Критичне мислення й обізнаність дозволяють робити висновки на основі фактів, а не здогадок. Якщо ви потрапили в складну ситуацію чи вас шантажують — звернутися по допомогу ніколи не пізно."], "ul": []}], "f": "У більшості справ про вербування, які оприлюднює СБУ, контакт із ворогом починався з пошуку «швидкого заробітку» в Telegram-каналах.", "pr": ["На основі фактів із теорії складіть три «портрети» людей, яких можуть спробувати завербувати (вік, ситуація, що могло зробити людину вразливою), і для кожного запишіть, що могло б її захистити.", "Складіть пам’ятку «Червоні прапорці вербування» для молодшого брата, сестри чи друзів (5–7 пунктів) з номерами, куди звертатися.", "Напишіть коротке есе (8–10 речень): «Як критичне мислення захищає від вербування»."], "q": ["Чому портрет завербованої людини часто неочевидний?", "Які п’ять причин роблять підлітків мішенню для вербувальників?", "Які червоні прапорці можуть свідчити про спробу вербування?", "Що робити, якщо вам пропонують «легкий заробіток» за підозріле завдання?", "Куди повідомити про спробу вербування?"]}]}, {"name": "Тренінг 7. Інформаційна війна", "lessons": [{"n": "1", "t": "Роль штучного інтелекту в інформаційній війні", "g": "Зрозуміти, що таке штучний інтелект і як його використовують в інформаційній війні, навчитися розпізнавати ознаки ШІ-контенту та критично оцінювати інформацію.", "k": "", "terms": [["Штучний інтелект (ШІ)", "алгоритми, які можуть обробляти величезні обсяги даних, генерувати текст, зображення, відео та аудіо."], ["Deepfake (діпфейк)", "відео, фото чи аудіо, створене або змінене за допомогою ШІ так, що людина нібито говорить чи робить те, чого насправді не було."], ["ШІ-генерований контент", "тексти, зображення, відео чи голос, повністю або частково створені нейромережею."], ["Інформаційна війна", "протиборство за допомогою інформації, мета якого — вплинути на думки, настрої та рішення людей."], ["Фактчекінг", "перевірка достовірності фактів, цитат, фото і відео за надійними джерелами."]], "th": [{"h": "Що вміє штучний інтелект", "p": ["Штучний інтелект — це алгоритми, які аналізують величезні обсяги даних і на їхній основі створюють новий контент: тексти, зображення, відео, звук. Він може швидко перекладати, узагальнювати, шукати закономірності.", "Ці можливості корисні в навчанні, медицині, обороні. Але ними ж користуються ті, хто веде інформаційні атаки проти України."], "ul": []}, {"h": "Як ШІ використовують в інформаційній війні", "p": ["Центр протидії дезінформації фіксує інформаційні операції росії з використанням ШІ в соцмережах."], "ul": ["Генерація контенту: масове створення фейкових новин, коментарів, постів для ботоферм.", "Deepfake: підроблені відео і аудіо з відомими людьми — політиками, військовими, журналістами.", "Автоматизація аналізу даних: швидкий пошук «больових точок» аудиторії, щоб підлаштувати під них маніпуляцію.", "Швидке поширення: ШІ допомагає створювати тисячі варіантів одного повідомлення для різних соцмереж."]}, {"h": "Як розпізнати ШІ-контент", "p": ["Перевіряй публікацію за кількома критеріями одночасно:"], "ul": ["Джерело: хто першим опублікував матеріал, чи це перевірений акаунт або ЗМІ?", "Якість зображення: неприродні руки й пальці, розмиті краї, дивне світло, «пластикова» шкіра, спотворений текст на вивісках.", "Голос: монотонність, неприродні паузи, невідповідність руху губ і звуку.", "Підписи й анотації: чи є позначка «створено ШІ», чи збігається підпис зі змістом.", "Метадані: дата створення, пристрій, програма, у якій обробляли файл."]}, {"h": "Ризики ШІ-маніпуляцій", "p": [], "ul": ["Зниження довіри до будь-якої інформації: людина перестає вірити навіть правді.", "Маніпуляція настроями: страх, паніка, зневіра, ворожнеча.", "Втручання в особисте життя: підроблені фото й відео з реальними людьми.", "Спотворення фактів і підміна історії подій."]}, {"h": "Як захиститися", "p": [], "ul": ["Розвивай медіаграмотність і критичне мислення.", "Перевіряй джерело та шукай підтвердження в кількох незалежних ЗМІ.", "Будь скептичним до контенту, що викликає сильні емоції — гнів, страх, захват.", "Користуйся фактчекінговими ресурсами.", "Не поширюй сумнівні матеріали, доки не перевіриш їх."]}], "f": "Слово «deepfake» утворене від англійських «deep learning» (глибинне навчання — різновид машинного навчання) і «fake» (підробка).", "pr": ["Склади власний алгоритм (5–7 кроків), як користуватися соцмережами і розпізнавати контент, згенерований ШІ. Обговори його з рідними або друзями.", "Знайди в соцмережах зображення, яке, на твою думку, може бути створене ШІ. Перевір його за критеріями з уроку (джерело, якість, підписи, метадані) та запиши висновок."], "q": ["Що таке штучний інтелект і які його базові можливості?", "Як ШІ використовують в інформаційній війні? Наведи три приклади.", "За якими ознаками можна запідозрити deepfake?", "Які ризики створює поширення ШІ-контенту для суспільства?", "Як зміниться твоя поведінка, коли ти побачиш емоційне відео чи новину?"]}, {"n": "2", "t": "Кібербезпека в умовах інформаційної війни", "g": "Знати основні кіберзагрози, ризики месенджерів і анонімних каналів, правила кібергігієни та безпечних публікацій під час воєнного стану.", "k": "", "terms": [["Кібербезпека", "захищеність людини, її пристроїв, облікових записів і даних від кіберзагроз."], ["Фішинг", "шахрайство, коли через підроблені листи, повідомлення чи сайти людину змушують передати паролі, коди або дані картки."], ["Шкідливе програмне забезпечення", "програми, що крадуть дані, шпигують за користувачем або пошкоджують пристрій."], ["Двофакторна автентифікація", "вхід в обліковий запис за двома підтвердженнями: паролем і додатковим кодом чи підтвердженням на іншому пристрої."], ["Кібергігієна", "набір щоденних звичок, які зменшують ризик стати жертвою кіберзагроз."]], "th": [{"h": "Чому кібербезпека критична під час війни", "p": ["Війна ведеться не лише на фронті, а й у цифровому просторі. Зламаний акаунт, викрадені дані чи необережне фото можуть допомогти ворогу: розкрити розташування людей, інфраструктури, військових або стати інструментом шахрайства і пропаганди."], "ul": []}, {"h": "Основні кіберзагрози", "p": [], "ul": ["Фішинг: листи й повідомлення «від банку», «служби доставки», «друга», який просить позичити гроші чи надіслати код.", "Шкідливе та шпигунське програмне забезпечення, що потрапляє на пристрій через підозрілі файли та посилання.", "Злом облікових записів через слабкі або однакові паролі.", "Витоки даних: особиста інформація потрапляє до сторонніх осіб."]}, {"h": "Чи несуть загрози месенджери", "p": ["Багато людей отримують новини з Telegram-каналів. Проте Telegram — не зовсім надійне джерело новин: значна частина каналів анонімна, невідомо, хто їх веде і хто фінансує. Через такі канали поширюють маніпуляції, «карусель емоцій» і ворожі наративи.", "Для новин краще обирати авторитетні ЗМІ з відомою редакцією, наприклад «Українська правда», «Суспільне», «Громадське», і налаштовувати безпеку в самих месенджерах."], "ul": []}, {"h": "Що не можна знімати й публікувати під час воєнного стану", "p": ["Фото можуть «розповісти», де ти перебуваєш, і цим легко скористається ворог."], "ul": ["Позиції, техніку та переміщення Сил оборони.", "Наслідки обстрілів і місця влучань у режимі реального часу, роботу ППО.", "Об'єкти критичної інфраструктури та блокпости.", "Фото з геолокацією або з деталями, за якими легко визначити місце (вивіски, номери будинків, характерні орієнтири)."]}, {"h": "Правила кібергігієни", "p": [], "ul": ["Складні та різні паролі для кожного сервісу, менеджер паролів.", "Увімкнена двофакторна автентифікація.", "Уважність до посилань і вкладень, ніколи не повідомляти коди з SMS.", "Регулярне оновлення програм і операційної системи, антивірус.", "Обережність із відкритими Wi-Fi-мережами, за потреби — VPN.", "Вимкнене відстеження геолокації в застосунках і фото."]}], "f": "Слово «фішинг» (phishing) походить від англійського «fishing» — риболовля: шахраї ніби закидають «наживку» і чекають, хто на неї клюне.", "pr": ["Склади список із 5–7 правил кібербезпеки для себе і своєї родини. Перевір, які з них ти вже виконуєш.", "Перевір налаштування безпеки у своєму месенджері та соцмережі: двофакторна автентифікація, хто бачить номер телефону, геолокація. Запиши, що змінив(-ла).", "Допиши речення: «Моя перша дія сьогодні для поліпшення власної кібербезпеки — це…»"], "q": ["Що таке кібербезпека і чому вона особливо важлива під час війни?", "Що таке фішинг і як його розпізнати?", "Які ризики споживання новин з анонімних Telegram-каналів?", "Що заборонено знімати й публікувати в умовах воєнного стану?", "Назви п'ять правил кібергігієни."]}, {"n": "3", "t": "Розвідка на основі відкритих джерел (OSINT): цілі та завдання", "g": "Розуміти, що таке OSINT, знати типи відкритих джерел і напрями OSINT-досліджень, уміти застосовувати базові інструменти перевірки зображень і локацій.", "k": "", "terms": [["OSINT (розвідка на основі відкритих джерел)", "процес пошуку, аналізу та інтерпретації відкритих даних, які можна отримати легально й етично для аналітичних або дослідницьких цілей."], ["Верифікація", "перевірка справжності інформації, фото чи відео за кількома незалежними джерелами."], ["Зворотний пошук зображень", "пошук в інтернеті за картинкою, а не за словами, щоб знайти її першоджерело та інші копії."], ["Геолокація", "визначення точного місця, де зроблено фото чи відео."], ["Кросверифікація", "підтвердження висновку кількома незалежними джерелами чи способами."]], "th": [{"h": "Що таке OSINT і навіщо він потрібен", "p": ["OSINT — це робота лише з відкритими, легально доступними даними. Цим він відрізняється від хакінгу (незаконного доступу до закритих систем) і шпигунства. Навички OSINT важливі в кібербезпеці, журналістиці, корпоративних перевірках і роботі правоохоронних органів."], "ul": ["відстежувати потенційні загрози безпеці;", "перевіряти достовірність фактів і підтверджувати або спростовувати інформацію;", "виявляти перші сигнали кібератак;", "фіксувати воєнні злочини та встановлювати причетних;", "оцінювати надійність партнерів і компаній."]}, {"h": "Чим OSINT відрізняється від звичайного пошуку", "p": [], "ul": ["Мета: звичайний пошук дає загальне розуміння теми, OSINT — підтримує конкретне рішення (підтвердження особи, викриття зв'язків).", "Методологія: звичайний пошук довільний, OSINT суворо структурований і спирається на розвідувальний цикл.", "Критичний етап: у звичайному пошуку — збір, в OSINT — верифікація та аналіз джерел.", "Результат: реферат чи набір фактів проти аналітичного звіту з висновком."]}, {"h": "Джерела OSINT", "p": [], "ul": ["Традиційні медіа: газети, телебачення, радіо (BBC, DW, «Суспільне», «Укрінформ»).", "Інтернет-ресурси: офіційні сайти органів влади, організацій, компаній; новинні сайти, блоги, форуми.", "Архіви вебсторінок (наприклад, Wayback Machine).", "Онлайн-бази даних: державні реєстри, тендери, судові рішення (YouControl, Opendatabot, Реєстр судових рішень).", "Соціальні мережі та спеціалізовані спільноти.", "Супутникові знімки, цифрові метадані, deep web — контент, який не індексують пошукові системи."]}, {"h": "Основні напрями OSINT", "p": [], "ul": ["SOCMINT — аналіз публічної активності в соціальних мережах.", "HUMINT — інформація, отримана безпосередньо від людей через відкриту комунікацію: інтерв'ю, опитування, спостереження.", "GEOINT — аналіз геопросторових даних: супутникових знімків, мап, геолокації.", "FININT — аналіз відкритої фінансової інформації; збирати адреси чи телефони приватних осіб заборонено.", "SIGINT — дослідження відкритих сигналів і даних, що легально публікуються."]}, {"h": "Приклади з російсько-української війни", "p": [], "ul": ["SOCMINT: Bellingcat за відкритими даними з соцмереж і рекрутинговими відео встановив учасників підрозділу «Ахмат», причетних до воєнного злочину, і його дислокацію поблизу Попасної.", "Волонтери InformNapalm з відкритих профілів російських військових зібрали дані про переміщення «Буків», причетних до збиття MH17 у 2014 році; докази передано до міжнародних судів.", "GEOINT: «Схеми» першими опублікували супутникові знімки зруйнованої Каховської ГЕС, Texty.org.ua ще до повномасштабного вторгнення візуалізували розгортання російських військ.", "HUMINT: розслідування «Список 31» («Схеми» та «Ти як?») встановило маршрут депортації 31 дитини і причетних осіб, що призвело до санкцій; спецоперація ГУР із переходом російського пілота з гелікоптером Мі-8 на бік України."]}, {"h": "Як перевірити фото: зворотний пошук і геолокація", "p": [], "ul": ["Зроби зворотний пошук зображення щонайменше у двох інструментах (Google Lens, TinEye).", "Знайди найраніше джерело з найвищою роздільною здатністю — найімовірніше, це оригінал; зафіксуй дату публікації.", "Проаналізуй геопідказки: архітектуру, рослинність, транспорт, номерні знаки, вивіски, прапори, логотипи.", "Знайди місце на Google Maps або Street View і зістав унікальні деталі (вікно, дерево, ліхтар).", "Підтвердь висновок іншим фото того ж місця з іншого ракурсу (кросверифікація)."]}], "f": "Європейський суд з прав людини визнав, що автори звітів Atlantic Council, Bellingcat та InformNapalm заслуговують на довіру, тож немає підстав відкидати їхні свідчення як категорію доказів.", "pr": ["Обери нейтральне фото відомої споруди чи пам'ятника. Виконай зворотний пошук у двох інструментах, знайди найраніше джерело та дату публікації, визнач місце на мапі. Запиши, які підказки допомогли найбільше.", "Проведи «OSINT-самоаудит»: спробуй знайти інформацію про себе за власним ім'ям, фото та нікнеймами в соцмережах. Запиши, що знайшлося, і подумай, що варто приховати."], "q": ["Що таке OSINT і чим він відрізняється від хакінгу чи шпигунства?", "Які типи відкритих джерел ти знаєш?", "Назви та поясни п'ять напрямів OSINT.", "Чому найраніше джерело зображення найчастіше є оригіналом?", "У яких сферах, окрім фіксації воєнних злочинів, корисний OSINT?"]}, {"n": "4", "t": "Аналіз соцмереж", "g": "Уміти етично шукати публічні профілі за нікнеймом і застосовувати пошукові оператори Google, розуміти, з чого складається цифровий слід людини.", "k": "", "terms": [["SOCMINT", "збір та аналіз інформації, що є у відкритому доступі на платформах соціальних медіа."], ["Цифровий слід", "сукупність даних про людину в інтернеті: профілі, публікації, коментарі, згадки."], ["Пасивний збір", "збір даних без прямої взаємодії з об'єктом дослідження — лише через загальнодоступні пошукові системи, інструменти та реєстри."], ["Активний збір", "взаємодія з об'єктом (запит у друзі, спроба входу в акаунт), яка залишає сліди і може порушувати правила платформ."], ["Google Dorks", "метод використання спеціальних пошукових операторів Google для дуже точного, цільового пошуку."]], "th": [{"h": "Що таке SOCMINT", "p": ["SOCMINT — один із напрямів OSINT, присвячений публічним даним із Facebook, Instagram, X (Twitter), Telegram та інших платформ. Він допомагає зрозуміти громадську думку, зв'язки та переміщення людей."], "ul": []}, {"h": "Пасивний і активний збір", "p": ["У навчанні ми працюємо виключно з пасивним збором: він етичний і безпечний. Аналітик використовує загальнодоступні пошукові системи та сервіси й не залишає слідів у системі об'єкта — не надсилає запитів, не намагається увійти.", "Активний збір (запити в друзі, спроби авторизації) повністю виключаємо: він залишає сліди і може порушувати умови користування платформами."], "ul": []}, {"h": "Пошук за нікнеймом", "p": ["Люди часто використовують один і той самий нікнейм на різних сайтах. Сервіс WhatsMyName перевіряє, на яких соцмережах, форумах, фото- і відеоплатформах зайнятий певний нік. Так окремі публічні профілі складаються в цілісний «цифровий портрет». Знайдені профілі треба перевіряти, порівнюючи дані з різних джерел: однаковий нік ще не означає ту саму людину."], "ul": []}, {"h": "Пошукові оператори Google", "p": ["Google Dorks — це як замість «де моя книга?» сказати: «Знайди книгу про OSINT, яка лежить на сайті шкільної бібліотеки»."], "ul": ["site: — обмежує пошук одним сайтом: site:facebook.com «Захист України».", "\"\" (лапки) — точна фраза, а не окремі слова: site:facebook.com \"Я люблю OSINT\".", "- (мінус) — виключає небажане слово з результатів.", "OR — шукає альтернативи: новини танки OR БМП site:armyinform.com.ua."]}, {"h": "Етичні межі", "p": [], "ul": ["Навіть публічна інформація вимагає етичної відповідальності.", "Не використовуй знайдені дані для профілювання чи розкриття особистої інформації приватних осіб, якщо це не суспільно важливе розслідування.", "Для тренування працюй із вигаданими нікнеймами, власними даними або публічними організаціями.", "Дотримуйся умов користування платформ: їх порушення може мати юридичні наслідки."]}], "f": "Оператор site: працює для будь-якого домену: наприклад, запит із site:gov.ua обмежить результати лише сайтами українських державних органів.", "pr": ["Перевір у WhatsMyName власний нікнейм: на скількох платформах він зайнятий? Чи всі ці профілі твої?", "За допомогою операторів site: та \"\" знайди фразу «Захист України» лише на site:facebook.com, а потім — на іншому сайті на твій вибір. Порівняй результати зі звичайним пошуком.", "Обери благодійний фонд, спортивну школу чи громадську організацію свого регіону. Використовуючи site: і точну фразу, знайди згадки про неї на неофіційних платформах, фото- чи відеозвіти про її роботу та зроби короткий висновок про її публічну репутацію."], "q": ["Що таке SOCMINT?", "Чим пасивний збір інформації відрізняється від активного і чому ми використовуємо лише пасивний?", "Як один нікнейм допомагає знайти профілі на різних сайтах?", "Як працюють оператори site:, лапки, мінус та OR?", "Які етичні правила слід дотримуватися під час аналізу соцмереж?"]}, {"n": "5", "t": "GEOINT: що нам кажуть знімки та тіні?", "g": "Уміти верифікувати місце за допомогою Google Earth та історичних знімків і перевіряти час зйомки за тінями в SunCalc.", "k": "", "terms": [["GEOINT", "аналіз інформації про об'єкти на Землі з супутникових знімків, мап, 3D-моделей і геолокаційних даних."], ["Геолокація", "порівняння візуальних підказок на фото з картографічними даними, щоб знайти точні координати місця зйомки."], ["Темпоральний аналіз", "визначення дати та часу зйомки за положенням Сонця, тінями або історичними знімками."], ["Історичні знімки", "архівні супутникові зображення, які показують, як місцевість виглядала в минулі роки."], ["SunCalc", "онлайн-інструмент, що показує траєкторію Сонця та напрямок тіней у будь-якій точці Землі на будь-яку дату."]], "th": [{"h": "Що таке GEOINT", "p": ["GEOINT поєднує дані про місцевість, інфраструктуру та природні явища (сонце, тіні), щоб створити цілісну картину події. В OSINT його використовують, щоб підтвердити, де і коли зроблено фото чи відео."], "ul": []}, {"h": "Два ключові методи", "p": [], "ul": ["Геолокація: порівнюємо будівлі, знаки, рослинність, рельєф на фото з Google Maps чи Google Earth і знаходимо точні координати.", "Темпоральний аналіз: за тінями або історичними знімками перевіряємо, чи відповідає заявлена дата і час зйомки дійсності."]}, {"h": "Google Earth: картографічна верифікація", "p": ["Google Earth — безплатна програма з можливостями, ширшими за звичайні Google Карти."], "ul": ["3D-модель місцевості допомагає точно зіставити кут, з якого зроблено фото.", "Функція «історичні знімки» (кнопка з годинником) дає змогу переглянути, як місце виглядало в минулі роки.", "Пересуваючи повзунок між роками, можна визначити, коли саме з'явилася будівля чи сталося руйнування."]}, {"h": "Як історичні знімки викривають фейк", "p": ["Якщо хтось публікує фото будівлі й стверджує, що воно зроблене 15 років тому, а на старих знімках на цьому місці пустир, — твердження неправдиве. І навпаки: якщо будівля була цілою на торішніх знімках, фото з руйнуваннями свіже."], "ul": []}, {"h": "SunCalc: аналіз тіней", "p": ["Положення Сонця залежить від пори року та часу доби. Якщо на фото є чітка тінь від вертикального об'єкта (стовпа, дерева, людини), її напрямок і довжину можна порівняти з тим, що показує SunCalc для цього місця і дати.", "Приклад: якщо на фото в Києві тінь вказує на південь, а SunCalc показує, що о цій годині вона мала б вказувати на північ, — заявлений час або дата зйомки неправдиві."], "ul": []}, {"h": "Безпека власних публікацій", "p": ["Ті самі методи може застосувати й ворог. Тому не публікуй фото з деталями, за якими можна визначити місце (вивіски, номери будинків, характерні орієнтири), особливо поруч з військовими чи інфраструктурними об'єктами."], "ul": []}], "f": "Після підриву Каховської ГЕС «Схеми» першими опублікували супутникові знімки Planet Labs і Maxar, які засвідчили руйнування та підтоплення.", "pr": ["Знайди в Google Earth свою школу або відомий об'єкт свого населеного пункту. Увімкни історичні знімки та визнач, у якому році на цьому місці відбулися помітні зміни.", "Сфотографуй тінь від вертикального об'єкта біля дому, запиши дату і час. Постав позначку в SunCalc і перевір, чи збігається напрямок тіні з тим, що показує інструмент.", "Отримай або знайди безпечне фото будівлі з помітним, але не очевидним орієнтиром і визнач, де його зроблено. Опиши, які деталі допомогли."], "q": ["Що таке GEOINT і для чого його використовують в OSINT?", "Чим геолокація відрізняється від темпорального аналізу?", "Як функція історичних знімків у Google Earth допомагає викрити фейк?", "На чому ґрунтується перевірка часу зйомки за допомогою SunCalc?", "Чому методи GEOINT нагадують нам про обережність із власними фото?"]}, {"n": "6", "t": "Аналіз фінансових даних", "g": "Уміти знаходити базові офіційні дані про компанії та ФОП у ЄДР і декларації публічних службовців у Реєстрі НАЗК, розуміти етичні межі FININT.", "k": "", "terms": [["FININT", "збір та аналіз відкритої офіційної інформації про фінансову та майнову діяльність організацій і публічних осіб."], ["ЄДР", "Єдиний державний реєстр юридичних осіб, фізичних осіб — підприємців та громадських формувань, офіційне джерело даних про будь-яку компанію чи ФОП."], ["Реєстр декларацій НАЗК", "публічний реєстр, у якому публічні службовці декларують доходи, майно та фінансові зобов'язання."], ["Кінцевий бенефіціарний власник", "фізична особа, яка фактично володіє компанією або контролює її."], ["Конфлікт інтересів", "ситуація, коли особисті інтереси посадовця можуть вплинути на його службові рішення."]], "th": [{"h": "Що таке FININT", "p": ["FININT — це не хакерство, не злам і не доступ до банківських рахунків. Це легальна робота лише з тими даними, які держава зобов'язана публікувати для прозорості та боротьби з корупцією."], "ul": ["Чи існує компанія взагалі (статус і реєстрація)?", "Хто її засновник і кінцевий бенефіціарний власник?", "Чи має компанія борги або судові позови?", "Яким майном володіють публічні службовці та їхні родини (за деклараціями)?"]}, {"h": "Інструмент № 1: ЄДР", "p": ["Найважливіше й найнадійніше джерело для перевірки будь-якої юридичної особи в Україні, бо містить офіційні, перевірені державою дані. Жодна легальна компанія чи ФОП не може діяти без реєстрації в ЄДР."], "ul": ["Точна назва і код ЄДРПОУ.", "Статус: зареєстровано, у стані припинення, банкрутство.", "ПІБ керівника, дата реєстрації.", "Основні види діяльності (КВЕД), засновники, бенефіціари."]}, {"h": "Інструмент № 2: Реєстр декларацій НАЗК", "p": ["Реєстр забезпечує прозорість і доброчесність влади. У ньому можна шукати за прізвищем, ім'ям і по батькові декларанта."], "ul": ["Річні доходи.", "Нерухомість, автомобілі, цінне майно.", "Фінансові зобов'язання.", "Інформація про членів сім'ї."]}, {"h": "Навіщо це потрібно", "p": [], "ul": ["Уникати співпраці з фірмами-одноденками або компаніями в процесі ліквідації.", "Виявляти можливі конфлікти інтересів.", "Помічати ознаки незаконного збагачення, порівнюючи офіційні доходи посадовця з його фактичними активами."]}, {"h": "Агрегатори", "p": ["Комерційні платформи, наприклад YouControl та Opendatabot, збирають дані з багатьох державних реєстрів (ЄДР, судові рішення, реєстр боржників) в один звіт. Вони зручні, але важливо розуміти, що першоджерелом є саме державні реєстри."], "ul": []}, {"h": "Етика FININT", "p": ["FININT застосовують лише для справ, що мають суспільний інтерес (публічні службовці, державні кошти), або для перевірки надійності бізнесу. Збирати адреси, телефони чи фінансові дані приватних осіб не можна."], "ul": []}], "f": "Декларації публічних службовців у Реєстрі НАЗК відкриті: переглянути їх може будь-хто, і для цього не потрібна реєстрація.", "pr": ["Обери відому місцеву компанію або ФОП. Знайди її в ЄДР і запиши точну назву, код ЄДРПОУ, статус, дату реєстрації та основний вид діяльності.", "Обери велику українську компанію, про яку нещодавно писали в новинах. Знайди в ЄДР її засновника або кінцевого бенефіціарного власника.", "Знайди в Реєстрі декларацій НАЗК щорічну декларацію депутата місцевої ради або голови громади за останній рік і запиши лише суму задекларованого річного доходу."], "q": ["Що таке FININT і чим він відрізняється від хакерства?", "Які дані про компанію можна знайти в ЄДР?", "Що вказують публічні службовці в декларації НАЗК?", "Як FININT допомагає виявляти конфлікт інтересів?", "Які етичні межі має FININT?"]}, {"n": "7", "t": "Інструменти OSINT", "g": "Повторити типи OSINT та інструменти дослідження і навчитися складати покроковий етично безпечний план розслідування.", "k": "", "terms": [["План розслідування", "послідовність кроків, де для кожного визначено, що шукаємо, який тип OSINT і який інструмент використовуємо."], ["Wayback Machine", "архів вебсторінок, який дозволяє побачити, як сайт виглядав у минулому."], ["Реверсивний (зворотний) пошук", "пошук першоджерела зображення за самим зображенням."], ["Маніпуляція", "прихований вплив на думки людей, наприклад через використання старого фото як нового."]], "th": [{"h": "Як скласти план розслідування", "p": ["Розслідування починають не з хаотичного пошуку, а з плану на 5–6 кроків. Для кожного кроку визнач три речі:"], "ul": ["Що шукаємо? (конкретне запитання)", "Який тип OSINT? (SOCMINT, GEOINT, FININT, верифікація)", "Який інструмент? (ЄДР, Реєстр НАЗК, Google Dorks, Google Earth, SunCalc, Wayback Machine, зворотний пошук)"]}, {"h": "Приклад: «Ненадійний забудовник»", "p": ["Ситуація (вигадана): компанія «ЛідерБуд» зупинила будівництво житлового комплексу, клієнти хвилюються, а з сайту зникли всі відгуки."], "ul": ["1. Юридичний статус: чи не в стані припинення або банкрутства? — FININT, ЄДР.", "2. Попередні публічні заяви про терміни будівництва — SOCMINT, Google Dorks.", "3. Чи справді роботи зупинено? — GEOINT, свіжі супутникові знімки в Google Earth Pro.", "4. Чи були судові позови? — FININT, агрегатори YouControl / Opendatabot.", "5. Що говорять про компанію на сторонніх сторінках? — SOCMINT, Google Dorks (site:facebook.com \"ЛідерБуд\")."]}, {"h": "Старе фото, видане за нове", "p": [], "ul": ["Першоджерело: де і коли фото опубліковано вперше — зворотний пошук.", "Геолокація за унікальним об'єктом — GEOINT, Google Earth.", "Час: чи відповідає тінь заявленій порі року та часу доби — SunCalc.", "Контекст: чи є старіші згадки про цю подію — Google Dorks."]}, {"h": "Перевірка посадовця і компанії", "p": [], "ul": ["Майно і доходи посадовця — FININT, Реєстр декларацій НАЗК.", "Засновники, керівники та бенефіціари компанії; чи була посадовиця засновницею раніше — FININT, ЄДР.", "Публічні спільні згадки, фото, професійні зв'язки — SOCMINT, Google Dorks (site:linkedin.com).", "Чи змінювала компанія назву або інформацію на сайті — Wayback Machine."]}, {"h": "Перевірка постачальника для армії", "p": [], "ul": ["Статус, керівник і засновник компанії — ЄДР.", "Як давно існує сайт і чи змінювалася інформація — Wayback Machine.", "Чи згадується директор у судових реєстрах у зв'язку з податками чи банкрутством — агрегатори, Реєстр боржників.", "Публікації, що підтверджують або спростовують звинувачення, — Google Dorks."]}, {"h": "Етичні правила", "p": ["Плани розслідувань стосуються лише суспільно важливих питань: компаній, державних коштів, публічних посадовців, перевірки фейків. Використовуємо тільки пасивний збір відкритих даних і не збираємо приватну інформацію звичайних людей."], "ul": []}], "f": "Інтернет-архів збирає копії вебсторінок з 1996 року, тому через Wayback Machine можна побачити, як виглядав сайт компанії багато років тому.", "pr": ["Склади план розслідування на 5–6 кроків (таблиця: крок — що шукаємо — тип OSINT — інструмент) для вигаданого кейсу: «Нова ТОВ “Котики” оголосила про випуск 1000 БпЛА для армії, а в соцмережах її називають шахраями».", "Досліди власні цифрові сліди: перевір у WhatsMyName, на скількох платформах зайнятий твій нікнейм; знайди в Google згадки свого імені та міста (з оператором \"\"); пошукай свої старі забуті профілі через site:facebook.com або site:instagram.com. Запиши результати і видали або закрий непотрібне."], "q": ["З яких трьох елементів складається кожен крок плану розслідування?", "Які інструменти належать до FININT, а які — до GEOINT?", "Як довести, що фото протесту старе або зроблене в іншому місці?", "Для чого в розслідуванні використовують Wayback Machine?", "Які етичні межі має навчальне OSINT-розслідування?"]}, {"n": "8", "t": "Військові професії. Особливості професій, пов'язаних із сучасними цифровими технологіями, медіа та аналізом даних", "g": "Знати сучасні військові професії, пов'язані з цифровими технологіями, медіа та аналізом даних, розуміти, які навички для них потрібні.", "k": "", "terms": [["Дешифрувальник", "військовий фахівець, який аналізує зображення та відео (зокрема з безпілотників), щоб виявити й розпізнати об'єкти."], ["Військовий аналітик", "фахівець, який збирає, перевіряє та узагальнює дані, щоб командування могло ухвалювати рішення."], ["Пресофіцер", "військовослужбовець, який відповідає за інформаційну роботу підрозділу та його комунікацію з медіа й суспільством."], ["Стратегічні комунікації", "узгоджена інформаційна діяльність, що формує довіру до війська та протидіє ворожій пропаганді."], ["Інформаційна безпека", "захист інформації, розголошення якої може зашкодити війську і державі."]], "th": [{"h": "Як технології змінили військову справу", "p": ["Сучасна війна — це не лише зброя, а й дані, дрони, супутникові знімки, інформаційний простір. Тому у Силах оборони з'явилися посади, де головне — інтелектуальна праця, технологічні знання та робота з інформацією. Вакансії на такі посади можна переглянути на платформах пошуку роботи у війську, наприклад Lobby X."], "ul": []}, {"h": "Дешифрувальник", "p": ["Дешифрувальник працює з відео та знімками, отриманими з безпілотників та інших джерел: розпізнає об'єкти, порівнює зміни на місцевості, передає перевірені дані. У його роботі використовуються ті самі принципи, що й у GEOINT: уважність до деталей, порівняння зі знімками та мапами, верифікація."], "ul": []}, {"h": "Аналітик", "p": ["Як і в цивільних сферах, військовий аналітик перетворює великий масив даних на зрозумілі висновки. Він поєднує інформацію з різних джерел, зокрема відкритих (OSINT), шукає закономірності та готує звіти для командування."], "ul": []}, {"h": "Пресофіцер", "p": ["Пресофіцер — «голос» і «обличчя» підрозділу. Його завдання — щоб правдива та важлива інформація про бригаду чи батальйон потрапляла до людей через медіа та соцмережі."], "ul": ["Комунікація з журналістами: організація престурів, супровід українських та іноземних медіа, контроль безпеки та інформаційної безпеки.", "Створення контенту: фото, відео, інтерв'ю з бійцями, пресрелізи, статті.", "Ведення офіційних сторінок підрозділу в соцмережах.", "Інформаційний захист: моніторинг інфопростору, протидія фейкам і ворожій пропаганді."]}, {"h": "Які навички потрібні", "p": [], "ul": ["Критичне мислення та уважність до деталей.", "Цифрова грамотність і вміння працювати з OSINT-інструментами.", "Аналітичні навички, вміння узагальнювати та робити висновки.", "Комунікативні навички, грамотне письмо.", "Стресостійкість і дотримання інформаційної безпеки."]}], "f": "Сили безпілотних систем стали окремим родом сил у складі Збройних Сил України у 2024 році.", "pr": ["Досліди біографію військового чи військової, які обіймають посаду, пов'язану з цифровими технологіями, медіа або аналізом даних, і підготуй презентацію на 5–7 слайдів.", "Пройди курс «Школа OSINT» на Дія.Освіта і склади квіз із 5–10 запитань для однокласників.", "Проведи міні-OSINT-розслідування новини про обстріл (на твій вибір) за 7 кроками: зворотний пошук фото / відео; місце (Google Maps); дата (архіви погоди / SunCalc); хто і з якою метою опублікував; чи підтверджують подію інші джерела; висновок (правда / фейк / маніпуляція); звіт на 1–2 сторінки."], "q": ["Як технологічний прогрес змінив класичні військові професії?", "Чим займаються дешифрувальник і військовий аналітик?", "Які основні обов'язки пресофіцера?", "Яку роль відіграє OSINT у сучасній розвідці та війні?", "Які навички потрібні, щоб працювати у військово-технічній чи медійній сфері?"]}]}, {"name": "Тренінг 8. Цивільне населення в кризових умовах", "lessons": [{"n": "1", "t": "Надзвичайні ситуації (причини виникнення, класифікація, ознаки). Воєнний стан", "g": "Знати, що таке надзвичайна ситуація, за якими ознаками визначають її рівень і характер, а також що таке воєнний стан і які обов'язки він покладає на громадян.", "k": "", "terms": [["Надзвичайна ситуація (НС)", "порушення нормальних умов життя та діяльності людей, що виникає внаслідок аварій, катастроф, стихійних лих, епідемій, терористичних актів, воєнних дій тощо."], ["Рівень НС", "масштаб надзвичайної ситуації (державний, регіональний, місцевий, об'єктовий), який визначають за поширенням, людськими втратами, порушенням умов життя та збитками."], ["Характер НС", "походження надзвичайної ситуації: природний, техногенний, соціальний або воєнний."], ["Воєнний стан", "особливий правовий режим, що вводиться в Україні або в окремих її місцевостях у разі збройної агресії чи загрози нападу і передбачає тимчасове обмеження окремих прав і свобод та надання органам влади повноважень для відсічі агресії."], ["Комендантська година", "заборона перебувати на вулицях та в інших громадських місцях у визначений час доби без спеціального дозволу."]], "th": [{"h": "Що враховують, визначаючи рівень НС", "p": [], "ul": ["Територіальне поширення: один об'єкт, район, область, кілька областей чи вся країна.", "Людські втрати: кількість загиблих і постраждалих.", "Умови життєдіяльності: скільки людей тривалий час не можуть нормально жити (немає води, світла, житла).", "Економічні збитки: їх розраховують у мінімальних розмірах заробітної плати (офіційний критерій)."]}, {"h": "Рівні надзвичайних ситуацій", "p": ["Порядок класифікації НС за рівнями затверджено постановою Кабінету Міністрів України від 24 березня 2004 р. № 368."], "ul": ["Державний — наймасштабніші події: охоплюють два і більше регіони або виходять за межі України; загинуло понад 10 осіб, постраждало понад 300, або понад 50 000 осіб більше 3 діб не можуть нормально жити; збитки понад 150 000 мінімальних зарплат. Приклади: аварія на ЧАЕС (1986), ракетні удари по енергетиці восени 2022 р.", "Регіональний — поширюється на два і більше райони однієї області, а ліквідація потребує більших ресурсів, ніж мають райони. Приклад: велика повінь у Карпатах, що зачіпає кілька районів.", "Місцевий — виходить за межі одного об'єкта й загрожує довкіллю чи сусіднім населеним пунктам, впливає на громаду або місто. Приклад: вибух на газопроводі, через який район міста залишився без тепла.", "Об'єктовий — найменший масштаб: подія стосується одного підприємства чи установи, не виходить за межі його території і ліквідовується власними силами. Приклад: пожежа в школі, яку швидко загасили."]}, {"h": "Характер і ознаки НС", "p": [], "ul": ["Природні: землетруси, повені, пожежі, епідемії.", "Техногенні: аварії на виробництві (зокрема вибухи), аварії на транспорті.", "Соціальні: масові заворушення, теракти.", "Воєнні: бойові дії, обстріли, застосування зброї.", "Спільні ознаки будь-якої НС: різке порушення нормального життя, загроза здоров'ю та життю, потреба в спеціальних заходах захисту."]}, {"h": "Приклади з історії України", "p": [], "ul": ["Паводок на заході України влітку 2008 року: через інтенсивні зливи різко піднявся рівень води в річках, під воду пішли понад 15,5 тис. житлових будинків, було пошкоджено сотні мостів і розмито дороги (природна НС).", "Аварія на заводі «Стирол» у Горлівці 6 серпня 2013 року: стався викид аміаку, загинули шестеро людей, ще 26 постраждали; це наймасштабніша аварія в хімічній промисловості України за роки незалежності (техногенна НС).", "Лісова пожежа на Харківщині у вересні 2020 року: площа пожежі зросла з 80 до 500 гектарів, вогонь перекинувся на село, знищено 20 житлових будинків, евакуйовано 52 особи (природна НС з наслідками для населення)."]}, {"h": "Воєнний стан", "p": ["Воєнний стан вводиться Указом Президента України, який затверджує Верховна Рада. Він може на певний час обмежувати окремі права: свободу пересування, проведення мітингів, діяльність партій і ЗМІ. Ці обмеження мають бути зумовлені загрозою і встановлюються із зазначенням строку їх дії."], "ul": ["Дотримуватися комендантської години та встановлених правил.", "Виконувати розпорядження органів влади та військових адміністрацій.", "Брати участь у заходах цивільного захисту (волонтерство, допомога)."]}], "f": "Аварія на Чорнобильській АЕС 1986 року — один із найвідоміших прикладів надзвичайної ситуації, наслідки якої вийшли далеко за межі однієї країни.", "pr": ["Опишіть одну надзвичайну ситуацію, про яку ви знаєте (з новин або з історії вашого населеного пункту): визначте її причини, характер (природна, техногенна, соціальна, воєнна), рівень та ознаки.", "Складіть 5–6 кроків дій цивільної особи для однієї з ситуацій: а) у місті почався обстріл; б) на вулиці виявлено підозрілий предмет; в) у регіоні введено воєнний стан.", "Подумайте, які НС найімовірніші у вашому населеному пункті, і запишіть 3 поради для своєї родини."], "q": ["Що таке надзвичайна ситуація і які її основні ознаки?", "За якими чотирма критеріями визначають рівень НС?", "Чим об'єктовий рівень НС відрізняється від місцевого?", "Хто вводить і хто затверджує воєнний стан в Україні?", "Які обов'язки мають громадяни під час воєнного стану?"]}, {"n": "2", "t": "Поведінка в умовах наближення бойових дій. Евакуація цивільного населення в умовах наближення бойових дій, із зони бойових дій", "g": "Вміти розпізнати ознаки наближення бойових дій, знати порядок дій цивільної людини, види евакуації та як підготувати тривожний наплічник.", "k": "", "terms": [["Евакуація", "організоване виведення або вивезення населення з небезпечних районів у безпечні."], ["Добровільна евакуація", "виїзд, коли людина сама вирішує залишити небезпечну територію, не чекаючи загрози."], ["Обов'язкова евакуація", "евакуація, яку оголошує влада, коли ситуація стає критичною; насамперед вона стосується дітей та вразливих груп населення."], ["Тривожний наплічник", "заздалегідь зібраний набір найнеобхідніших речей, документів і запасів на випадок раптового виїзду."], ["Пункт збору", "визначене владою місце, звідки організовано відправляють людей під час евакуації."]], "th": [{"h": "Ознаки наближення бойових дій", "p": ["Орієнтуйтеся лише на офіційні повідомлення, а не на чутки чи неперевірені телеграм-канали."], "ul": ["Часті повітряні тривоги та повідомлення про бої неподалік, зміни на картах лінії фронту.", "Офіційні оголошення військових адміністрацій чи ДСНС про евакуацію.", "Погіршення інфраструктури: проблеми зі світлом, водою, транспортом, зв'язком.", "Інформація з надійних джерел про те, що лінія фронту наближається."]}, {"h": "Як діяти цивільній людині", "p": [], "ul": ["Заспокоїтися і перевірити інформацію: паніка — найгірший порадник.", "Підготувати тривожний наплічник.", "Знати, де найближче укриття чи пункт збору; скористатися інтерактивними картами укриттів своєї громади.", "Домовитися з рідними про план дій: куди йти і де зустрітися, якщо зник зв'язок.", "Слухати вказівки влади: місцеві органи знають безпечні маршрути.", "У разі оголошення евакуації — підготуватися до неї та дотримуватися правил."]}, {"h": "Оповіщення про евакуацію", "p": ["Організовувати евакуацію можуть обласні військові адміністрації разом із Товариством Червоного Хреста України, поліцією, ДСНС і місцевою владою. Виїжджати власним авто можна, але краще приєднатися до евакуаційної колони і рухатися чітко її маршрутом.", "Повідомлення надходять через радіо й телебачення, мобільний зв'язок, соцмережі й месенджери, а також через рухомі групи з гучномовцями. У ньому зазначають план евакуації, пункти збору, маршрути руху та контакти штабів евакуації. Якщо сумніваєтеся в повідомленні — перевірте його в інших офіційних джерелах."], "ul": []}, {"h": "Добровільна та обов'язкова евакуація", "p": ["Добровільна евакуація завжди безпечніша, бо є час зібратися. Обов'язкову оголошує влада; дітей і вразливі групи вивозять обов'язково. Якщо батьки відмовляються евакуюватися, дитину можуть передати іншим родичам, а дитину-сироту — уповноваженому представнику органу опіки та піклування."], "ul": ["Чому не варто чекати до останнього: зменшується кількість транспорту, дороги можуть бути обстріляні чи перекриті, гуманітарні коридори закриваються.", "Чому люди не хочуть їхати: бояться залишити дім, не хочуть кидати майно чи тварин, не довіряють владі, вірять, що «зі мною нічого не станеться».", "Наслідки відмови від евакуації добре видно на прикладах Маріуполя, Покровська, а також на історії «самоселів» у зоні відчуження після Чорнобильської катастрофи."]}, {"h": "Що покласти в тривожний наплічник", "p": [], "ul": ["Документи (або їхні копії) та гроші.", "Ліки, які ви приймаєте, і базову аптечку.", "Воду й сухі продукти.", "Теплий одяг і засоби гігієни.", "Павербанк, зарядні пристрої або батарейки.", "Наплічник дитини і людини, яка має домашню тварину, доповнюють відповідними речами."]}], "f": "", "pr": ["Складіть список із 10 найнеобхідніших речей для власного тривожного наплічника і позначте, що потрібно взяти в першу чергу, а що можна відкласти.", "Оберіть один випадок (сім'я з маленькою дитиною; група студентів; людина з інвалідністю, яка потребує допомоги в транспортуванні) і пропишіть 5–6 кроків від оголошення евакуації до виїзду: хто допомагає, як зібратися, що взяти.", "Знайдіть на інтерактивній карті найближче до вашого дому укриття та запишіть, як до нього дістатися."], "q": ["Які ознаки свідчать про наближення бойових дій?", "Чому важливо перевіряти інформацію про евакуацію лише в офіційних джерелах?", "Чим добровільна евакуація відрізняється від обов'язкової?", "Чому небезпечно відкладати евакуацію до останнього?", "Що обов'язково має бути в тривожному наплічнику?"]}, {"n": "3", "t": "Порядок дій під час стрілецького обстрілу, авіаційного та ракетного нальоту, та артилерійського обстрілу. Властивості та ознаки застосування ядерної зброї, хімічної атаки і бойових біологічних речовин", "g": "Знати алгоритми дій під час обстрілів і нальотів, вміти обрати найбезпечніше укриття та розпізнавати ознаки застосування ядерної, хімічної та біологічної зброї.", "k": "", "terms": [["Укриття", "споруда або елемент місцевості, що захищає людей від уламків, ударної хвилі та інших факторів ураження."], ["Зброя масового ураження", "ядерна, хімічна та біологічна зброя, здатна одночасно уразити велику кількість людей."], ["Радіоактивне забруднення", "наявність радіоактивних речовин на місцевості, в повітрі, воді чи на предметах, що становить загрозу для здоров'я."], ["Конус Маха", "фізичне явище — конусоподібна ударна хвиля, яку утворює об'єкт, що рухається швидше за звук; через нього звук надзвукової ракети людина може почути вже після її прольоту."], ["Засоби індивідуального захисту", "речі, які захищають конкретну людину: каска, бронежилет, аптечка, рюкзак із необхідним."]], "th": [{"h": "Алгоритми дій під час обстрілів", "p": [], "ul": ["Стрілецький обстріл: впасти, прикрити голову руками, до укриття пересуватися повзком.", "Артилерійський обстріл: впасти ногами в бік вибуху, щоб захистити життєво важливі органи, прикрити голову, відкрити рот і чекати тиші.", "Авіаційний або ракетний наліт: після сигналу сирени — в укриття, відійти від вікон і чекати сигналу «відбій»."]}, {"h": "Які укриття найбезпечніші", "p": ["Якщо людина опинилася під завалом, важливо зберігати спокій, берегти сили та подавати сигнали рятувальникам (стукати по трубах чи стінах), а не кричати безперервно."], "ul": ["Найкраще: сховища, метро, підвали, придатні для захисту.", "Природні: яри, рови, канави.", "Тимчасово: бетонні плити, броньована техніка.", "Небезпечно: балкони, зупинки громадського транспорту, легкі споруди."]}, {"h": "Ядерна зброя", "p": [], "ul": ["Ознаки: дуже яскравий спалах, потужна ударна хвиля, згодом — радіоактивне забруднення.", "Дії: якнайшвидше сховатися в найглибше укриття, не дивитися на спалах, захистити органи дихання (маска, тканина), чекати офіційних вказівок."]}, {"h": "Хімічна атака", "p": [], "ul": ["Ознаки: різкий незвичний запах (хлор — різкий, гірчичний газ — часниковий), утруднене дихання, раптова недієздатність людей поруч, подразнення очей і шкіри.", "Дії: прикрити рот і ніс тканиною (по можливості змоченою водою), сховатися в приміщенні, щільно зачинити вікна й двері, не торкатися підозрілих рідин і предметів, стежити за офіційними повідомленнями."]}, {"h": "Біологічна атака", "p": [], "ul": ["Ознаки: зазвичай непомітна відразу; про неї свідчить раптове захворювання великої кількості людей, інформацію повідомляють офіційні джерела.", "Дії: ретельно дотримуватися гігієни, уникати натовпу, використовувати маску, слухати офіційні повідомлення."]}, {"h": "Саморегуляція під час небезпеки", "p": ["Під час обстрілу чи очікування у сховищі допомагають прості прийоми: «дихання коробочкою» (вдих — 4 рахунки, затримка — 4, видих — 4, затримка — 4) та «заземлення 5-4-3-2-1» (назвати 5 речей, які бачиш, 4 — які чуєш, 3 — яких можеш торкнутися, 2 запахи, 1 смак)."], "ul": []}], "f": "Звук надзвукової ракети часто чути вже після того, як вона пролетіла, — саме тому в укриття потрібно йти за сигналом тривоги, а не чекати, поки щось почуєш.", "pr": ["Намалюйте карту укриттів у своєму районі та позначте шлях до найближчого з дому і зі школи.", "Складіть власну «пам'ятку безпеки» (не більше 10 пунктів) про дії під час обстрілів.", "Підготуйте коротку доповідь «Які природні об'єкти можна використати як захист?» або складіть план дій для однієї ситуації: ви на вулиці під час артобстрілу; вдома відчувається підозрілий запах; у новинах повідомили про небезпеку біологічної атаки."], "q": ["Як діяти під час стрілецького обстрілу та під час артилерійського обстрілу?", "Які укриття найбезпечніші, а які місця небезпечні?", "Які ознаки застосування ядерної зброї і що робити в такому разі?", "За якими ознаками можна запідозрити хімічну атаку?", "Чому біологічну атаку важко помітити одразу і як себе захистити?"]}, {"n": "4", "t": "Попередження ризиків від вибухонебезпечних предметів", "g": "Знати основні види вибухонебезпечних предметів, вміти розпізнати ознаки небезпеки та діяти за правилом «побачив – зупинився – відійшов – повідомив».", "k": "", "terms": [["Вибухонебезпечний предмет (ВНП)", "будь-який предмет, що може вибухнути: міна, снаряд, граната, касетний елемент, ракета чи її частина, саморобний вибуховий пристрій."], ["Розтяжка", "натягнутий дріт або волосінь, з'єднаний із вибуховим пристроєм; часто майже непомітний у траві чи між деревами."], ["Нерозірваний боєприпас", "боєприпас, який після застосування не вибухнув, але залишається смертельно небезпечним."], ["Мінна безпека", "знання та правила поведінки, які допомагають уникнути травм і загибелі від мін та інших вибухонебезпечних предметів."]], "th": [{"h": "Що належить до вибухонебезпечних предметів", "p": [], "ul": ["Міни (протипіхотні та протитанкові).", "Артилерійські снаряди, мінометні міни, ракети та їхні уламки.", "Ручні гранати й касетні суббоєприпаси.", "Розтяжки.", "Саморобні вибухові пристрої, які можуть бути замасковані під звичайні речі: іграшки, телефони, пакети, сумки.", "Будь-який незнайомий предмет може бути небезпечним — навіть якщо він виглядає старим, іржавим або пошкодженим."]}, {"h": "Ознаки небезпеки на місцевості", "p": [], "ul": ["Таблички «Обережно, міни!», червоно-білі стрічки, огородження.", "Залишки боєприпасів, уламки, пошкоджена військова техніка поруч.", "Дроти, волосінь, натягнуті над землею.", "Необроблені поля, зарослі стежки, покинуті будинки й позиції на звільнених територіях.", "Загиблі тварини, вирви від вибухів.", "Предмети, що не відповідають оточенню (підозрілий пакет, коробка, річ без власника)."]}, {"h": "Правило «побачив – зупинився – відійшов – повідомив»", "p": [], "ul": ["Побачив: помітив підозрілий предмет чи ознаки мінування.", "Зупинився: одразу припини рух, не роби різких кроків.", "Відійшов: повертайся тим самим шляхом, яким прийшов, ступаючи по своїх слідах, на безпечну відстань.", "Повідомив: зателефонуй 101 (ДСНС), 102 (поліція) або 112, опиши предмет і точне місце, попередь інших людей."]}, {"h": "Чого робити категорично не можна", "p": [], "ul": ["Торкатися, підіймати, пересувати, розбирати предмет або кидати в нього чимось.", "Наближатися, щоб роздивитися чи сфотографувати.", "Заходити на позначені або підозрілі території, збирати «сувеніри» з місць боїв.", "Намагатися знешкодити предмет самостійно — це роблять лише фахівці-сапери."]}, {"h": "Особиста відповідальність", "p": ["Мінна безпека — це не тільки власна обережність. Розкажіть про правила молодшим братам і сестрам, друзям, рідним. Перед поїздкою на звільнені території чи на природу дізнайтеся, чи перевірена ця місцевість, і рухайтеся лише перевіреними дорогами та стежками."], "ul": []}], "f": "Через повномасштабну війну Україна стала однією з найбільш замінованих країн світу, тому правила мінної безпеки потрібно знати кожному.", "pr": ["Складіть пам'ятку з мінної безпеки для молодшого школяра (5–7 простих правил) і перекажіть її рідним.", "Опишіть, як ви діятимете, якщо під час прогулянки біля лісосмуги помітите дріт, натягнутий над землею: кроки дій і що саме скажете, телефонуючи на 101 або 112.", "Перелічіть, які ознаки на місцевості можуть свідчити про можливе мінування поблизу вашого населеного пункту."], "q": ["Які предмети належать до вибухонебезпечних?", "За якими ознаками можна розпізнати заміновану або небезпечну територію?", "Що означає кожен крок правила «побачив – зупинився – відійшов – повідомив»?", "Чому не можна наближатися до підозрілого предмета навіть для фото?", "За якими номерами треба повідомляти про виявлений вибухонебезпечний предмет?"]}, {"n": "5", "t": "Види терористичних актів та способи дій терористів. Порядок дій під час терористичних актів", "g": "Розуміти різницю між тероризмом, війною та воєнним злочином, вміти аналізувати ситуації та знати базові правила поведінки під час теракту.", "k": "", "terms": [["Тероризм", "дії найчастіше недержавних організацій, спрямовані проти цивільного населення для досягнення політичних цілей через залякування."], ["Війна", "збройний конфлікт між державами або всередині держави, у якому застосовується організована збройна сила."], ["Воєнний злочин", "порушення правил війни, наприклад умисний напад на мирних жителів, тортури полонених, використання забороненої зброї чи руйнування цивільних об'єктів без воєнної потреби."], ["Комбатант", "особа, яка входить до складу збройних сил і має право брати безпосередню участь у бойових діях."], ["Заручник", "людина, яку незаконно утримують, щоб домогтися від когось виконання вимог."]], "th": [{"h": "Війна і тероризм: що спільного", "p": ["І війна, і тероризм — форми політичного насильства. Військовий теоретик Карл фон Клаузевіц писав: «Війна — це продовження політики іншими засобами». В обох випадках можуть гинути мирні жителі, і обидва явища використовують страх і насильство для досягнення політичних цілей. Але будь-які навмисні атаки на цивільних — злочин, незалежно від того, хто їх здійснює."], "ul": []}, {"h": "Чим війна відрізняється від тероризму", "p": [], "ul": ["Хто діє: війну ведуть держави, що мають армію, владу, ресурси; тероризм — тактика груп, які мають значно менше ресурсів.", "Проти кого: у війні мета — перемогти армію супротивника; у тероризмі — вдарити по цивільних, щоб посіяти страх і змусити уряд виконати вимоги.", "Методи: держава має армію і важке озброєння; терористи вдаються до нападів у людних місцях, захоплення заручників, атак на транспорт."]}, {"h": "Воєнні злочини", "p": ["Якщо армія цілеспрямовано атакує цивільних, лікарні, школи, житлові квартали — це вже не бойові дії між комбатантами, а воєнний злочин. Він схожий на теракт, але вчинений державою. Приклади: удар російської ракети Х-22 по багатоповерхівці в Дніпрі 14 січня 2023 року; авіаудар по драмтеатру в Маріуполі в березні 2022 року, біля якого великими літерами було написано «ДІТИ».", "Для порівняння: вибухи в лондонському метро та автобусі 7 липня 2005 року (загинули 52 людини, понад 700 поранено) і захоплення пасажирських літаків у вересні 1970 року з утриманням заручників на летовищі Dawson's Field у Йорданії — це терористичні акти."], "ul": []}, {"h": "Як діяти під час перестрілки", "p": [], "ul": ["На вулиці: негайно ляжте і знайдіть укриття — виступ будинку, бетонний стовп, пам'ятник, канаву. Автомобіль не є надійним укриттям: тонкий метал і пальне небезпечні.", "За можливості сховайтеся в під'їзді чи підземному переході й дочекайтеся завершення стрілянини.", "Якщо поруч діти — прикрийте їх собою.", "У приміщенні найкраще укриття — ванна кімната: лягайте на підлогу, тримайтеся подалі від вікон.", "Якщо почалася пожежа, а стрілянина триває, виходьте в під'їзд і тримайтеся далі від вікон."]}, {"h": "Якщо вас утримують у літаку чи автобусі", "p": [], "ul": ["Не привертайте уваги: сидіть спокійно, не пересувайтеся без дозволу, намагайтеся заспокоїтися.", "Зніміть прикраси, не дивіться нападникам в очі, уникайте провокацій і суперечок.", "Зверніть увагу, де в салоні можна сховатися.", "Якщо почнеться штурм — негайно лягайте на підлогу між кріслами й не рухайтеся до кінця операції.", "Після звільнення якнайшвидше залиште салон: можливий вибух."]}, {"h": "Якщо ви отримали телефонну погрозу", "p": [], "ul": ["З іншого телефону (наприклад, сусідів) повідомте поліцію: причину дзвінка, своє ім'я, адресу й номер.", "Намагайтеся якомога довше говорити з тим, хто погрожує, за можливості запишіть розмову або дайте почути її свідкам.", "Поліція зможе встановити номер телефону та особу того, хто телефонував."]}], "f": "Вислів «Війна — це продовження політики іншими засобами» належить прусському військовому теоретику Карлу фон Клаузевіцу (XIX століття).", "pr": ["Заповніть таблицю «Види терористичних актів» за критеріями: за засобом (методами), за географічним охопленням, за виконавцем, за ідеологією.", "Розробіть алгоритм дій на випадок, якщо в центрі вашого міста скоєно терористичний акт.", "Визначте, що це — тероризм, воєнний злочин чи воєнні дії, і поясніть чому: а) угруповання підриває міський автобус, щоб залякати владу; б) ракети влучають у військову базу, де немає цивільних; в) авіаудар по людному супермаркету, який нападник назвав «військовою базою»."], "q": ["Чим тероризм відрізняється від війни за трьома ознаками: хто діє, проти кого, якими методами?", "Що таке воєнний злочин? Наведіть приклад.", "Чому автомобіль не є надійним укриттям під час стрілянини?", "Як поводитися, якщо вас утримують як заручника в транспорті?", "Що робити, якщо ви отримали телефонну погрозу?"]}, {"n": "6", "t": "Психологічна стійкість та саморегуляція під час надзвичайних ситуацій. Стресові реакції. Прийоми саморегуляції. Само- та взаємодопомога при панічному нападі, тривозі, істериці, ступорі, апатії, проявах гніву, злості, агресії", "g": "Розуміти, як організм реагує на стрес, розпізнавати типові стресові реакції, володіти простими прийомами саморегуляції та знати, як допомогти собі й іншим.", "k": "", "terms": [["Стрес", "природна реакція організму на небезпеку або надмірне навантаження."], ["Стресова реакція", "зміни в емоціях, тілі та поведінці людини у відповідь на загрозу: «бий», «біжи» або «завмри»."], ["Саморегуляція", "вміння свідомо впливати на свій стан, щоб заспокоїтися і повернути контроль над діями."], ["Психологічна стійкість", "здатність зберігати працездатність і відновлюватися після стресу; це навичка, яку можна тренувати."], ["Заземлення", "прийом, що повертає увагу до «тут і зараз» через відчуття: зір, слух, дотик, нюх, смак."]], "th": [{"h": "Як організм реагує на стрес", "p": ["Коли трапляється щось несподіване і страшне, кожен реагує по-своєму — і це нормально. Існують три базові реакції: «бий», «біжи», «завмри»."], "ul": ["Гнів, агресія — викид енергії назовні.", "Паніка, тривога, істерика — надлишок енергії.", "Ступор, апатія — «завмирання»."]}, {"h": "Прийоми саморегуляції", "p": [], "ul": ["«Дихання коробочкою»: вдих на 4 рахунки — затримка на 4 — видих на 4 — затримка на 4; повторити кілька разів.", "«Подовжений видих»: видихати повільніше, ніж вдихати, — це заспокоює нервову систему.", "Когнітивні фрази: «Я зараз у безпеці», «Я знаю, що робити».", "«Заземлення 5-4-3-2-1»: назвати 5 речей, які бачиш, 4 — які чуєш, 3 — яких можеш торкнутися, 2 запахи, 1 смак.", "Вправа «Безпечне місце»: уявити місце, де почуваєшся спокійно, і детально його «роздивитися»."]}, {"h": "Як допомогти при паніці, істериці та тривозі", "p": [], "ul": ["Паніка, істерика: говоріть спокійним голосом, дайте просте завдання («подивись на мене», «дихай разом зі мною»), уникайте криків і фізичного примусу.", "Тривога: допоможіть людині зосередитися на диханні, переключіть увагу на просту дію (наприклад, рахувати кроки)."]}, {"h": "Як допомогти при ступорі та апатії", "p": [], "ul": ["Ступор: легкий дотик до плеча, проста команда («Підніми руку», «Зроби крок»).", "Апатія: підтримка і залучення до простих дій, нагадування «Я з тобою»."]}, {"h": "Як допомогти при гніві та агресії", "p": [], "ul": ["Зберігайте безпечну дистанцію.", "Говоріть короткими спокійними фразами.", "Допоможіть переключити енергію на безпечну дію (наприклад, зім'яти аркуш паперу)."]}, {"h": "Слова підтримки", "p": ["Іноді найважливіше — просто бути поруч. Прості фрази підтримки: «Ти не один», «Я з тобою», «Ми впораємося». Якщо стан людини не покращується або вам самим важко, зверніться по допомогу до дорослих, шкільного психолога чи фахівців."], "ul": []}], "f": "Психологічна стійкість — це не вроджений талант, а навичка: регулярне тренування простих дихальних вправ допомагає швидше заспокоюватися в реальних стресових ситуаціях.", "pr": ["Напишіть «мій список спокою» — 5 речей, які допомагають вам заспокоїтися.", "Вивчіть техніку «дихання коробочкою», виконуйте її вдома щодня протягом тижня й запишіть, чи змінилося ваше самопочуття.", "Опишіть приклад із життя, коли ви чи ваші знайомі впоралися зі стресом, або складіть 3 кроки допомоги для однієї ситуації: однокласник у паніці; хтось у ступорі; людина плаче в істериці; хтось кричить і злиться."], "q": ["Які три базові реакції на стрес існують?", "Як виконати «дихання коробочкою» і «заземлення 5-4-3-2-1»?", "Як допомогти людині в стані паніки?", "Що робити, якщо людина в ступорі?", "Чому під час агресії іншої людини важливо зберігати дистанцію?"]}, {"n": "7–8", "t": "Основи та принципи виживання", "g": "Знати основні фактори та пріоритети виживання, вміти ухвалювати безпечні рішення в екстремальних умовах, добирати одяг і спорядження для різного клімату, знати способи очищення води та безпечного поводження з вогнем.", "k": "", "terms": [["Виживання", "активні дії для збереження життя та здоров'я в автономних (без сторонньої допомоги) умовах."], ["Стресори виживання", "чинники, що виснажують людину в екстремальних умовах: біль, холод, спека, спрага, голод, перевтома."], ["Правило «трійок»", "орієнтовні межі виживання: 3 хвилини без повітря, 3 години без укриття в екстремальних умовах, 3 дні без води, 3 тижні без їжі."], ["Принцип багатошаровості", "спосіб одягатися кількома шарами (базовий, ізоляційний, зовнішній), щоб зберігати тепло і залишатися сухим."], ["Знезараження води", "знищення мікроорганізмів у воді, наприклад кип'ятінням або спеціальними таблетками."]], "th": [{"h": "Основні фактори виживання", "p": ["Якщо порушено хоча б один фактор, ризик для життя різко зростає."], "ul": ["Психологічний стан: керування стресом, страхом, апатією.", "Фізична підготовленість.", "Спорядження та вміння ним користуватися.", "Знання місцевості (вміння орієнтуватися) та клімату.", "Стійкість до стресорів: болю, холоду, спеки, спраги, голоду, перевтоми."]}, {"h": "Пріоритети та алгоритм дій", "p": ["Правило «пріоритетів виживання» підказує, що важливіше: повітря — укриття — вода — їжа. Навіть у найгірших обставинах треба уникати «пастки хаотичних дій» (паніки) і діяти за алгоритмом: оцінка ситуації → план → дії → контроль результатів."], "ul": []}, {"h": "Як ухвалювати рішення в екстримі", "p": ["Оптимальне рішення — не ідеальне, а достатньо безпечне й здійсненне зараз із наявними ресурсами. Спершу визначте найближчу мету (пережити ніч, вийти до води, зменшити ризики), далі — ресурси й обмеження (погода, час доби, сили, спорядження, стан товариша). Оцінюйте варіанти за принципом «користь / ризик / ціна по силах» і дійте малими кроками з частими перевірками. Краще забезпечити 70% потреби в теплі, ніж витратити останні сили на «ідеальне» укриття."], "ul": ["Внутрішній чек-лист: чи не дію я з паніки?", "Чи не ігнорую очевидний ризик?", "Чи не перевищує план мої реальні сили?", "Чи є запасний варіант, якщо щось піде не так?"]}, {"h": "Одяг для холоду", "p": ["Одяг виконує три функції: терморегуляцію, бар'єр (від вітру, вологи, сонця, комах) і зручність руху."], "ul": ["Базовий шар (термобілизна) відводить вологу від тіла; ізоляційний (фліс, светр) зберігає тепло; зовнішній (куртка з мембраною, вітрозахисний плащ) захищає від вітру й опадів.", "Голова й руки: значна частина тепла втрачається через відкриті ділянки тіла, тому потрібні шапка, балаклава, рукавиці.", "Взуття утеплене й сухе, обов'язково запас сухих шкарпеток.", "Корисні засоби: термоковдра, спальник, каремат, плівка чи тент.", "Тримайте одяг сухим, міняйте вологий, захищайте обличчя від морозу."]}, {"h": "Одяг для спеки, вологого та помірного клімату", "p": [], "ul": ["Спека: вільний легкий одяг світлих відтінків із натуральних тканин, головний убір, сонцезахисні окуляри, крем від ультрафіолету, запас води; уникати пересування з 12:00 до 16:00, користуватися тінню.", "Вологий клімат: головне — залишатися сухим; дощовик або мембранна куртка, непромокальні штани й взуття, кілька пар сухих шкарпеток, тент чи плівка.", "Помірний клімат: міцні штани, футболка, куртка з вітрозахистом, зручні черевики; дощовик, термоковдра, ліхтар; запасний комплект одягу в гермомішку."]}, {"h": "Вода і вогонь", "p": ["Без води людина може прожити лише кілька днів, а небезпечна не тільки спрага, а й мікроорганізми у воді. Саморобний фільтр із пляшки, тканини, піску, гравію та деревного вугілля прибирає сміття й частину домішок, але не знезаражує воду. Тому після фільтрування воду обов'язково кип'ятять 5–10 хвилин або використовують спеціальні таблетки.", "Вогонь дає тепло, можливість приготувати їжу та знезаразити воду. Його можна отримати запальничкою, кресалом, а в сонячну погоду — за допомогою лінзи. Головне — безпека: розпалювати лише на негорючій поверхні, щонайменше за 3 метри від кущів, дерев і сухої трави, не використовувати легкозаймисті рідини, тримати поруч воду або пісок, ніколи не залишати вогонь без нагляду і після завершення повністю його загасити."], "ul": []}], "f": "Узимку 2006 року в Алчевську через аварію на системі теплопостачання тисячі людей у сильні морози залишилися без опалення — цей випадок часто наводять як приклад виживання міста в кризових умовах.", "pr": ["Складіть «набір виживання» (одяг і спорядження) для однієї ситуації: засніжений ліс із сильним вітром; кілька діб у підвалі без світла й опалення; сухий степ під пекучим сонцем.", "Прочитайте статтю ВВС «Замерзле місто України. Як це було в Алчевську в 2006-му» і сформуйте особистий план виживання в місті, яке залишилося без світла, тепла та водопостачання.", "Уявіть, що ви загубилися в лісі без води і зв'язку: розставте пріоритети дій (що робити першим, другим, третім) і поясніть свій вибір."], "q": ["Які основні фактори впливають на виживання?", "Що означає правило «трійок» і в якому порядку воно визначає пріоритети?", "З яких шарів складається одяг для холодної погоди і яку функцію виконує кожен шар?", "Чому саморобний фільтр не робить воду безпечною для пиття і що потрібно зробити додатково?", "Яких правил безпеки треба дотримуватися, розпалюючи вогонь?"]}]}, {"name": "Тренінг 9. Планую майбутнє", "lessons": [{"n": "1", "t": "Роль громадянського суспільства у формуванні обороноздатності і національної єдності", "g": "Оцінити внесок волонтерського сектору у зміцнення стійкості громад і Сил оборони України, визначити цінності, які спонукають українців діяти разом, і скласти попередній план власного волонтерського збору.", "k": "", "terms": [["Громадянське суспільство", "сукупність громадських організацій, ініціатив і активних громадян, які самоорганізовуються для розв'язання спільних проблем незалежно від держави."], ["Волонтерство", "добровільна безоплатна діяльність на користь інших людей, громади чи держави."], ["Обороноздатність", "здатність держави та суспільства захистити свою незалежність і територіальну цілісність."], ["Самоорганізація", "уміння людей без зовнішнього керівництва об'єднатися, розподілити обов'язки й досягти спільної мети."], ["Збір (фандрейзинг)", "організоване залучення коштів або ресурсів на конкретну мету у визначений термін."]], "th": [{"h": "Чим українці особливі в цій війні", "p": ["Повномасштабна війна показала, що оборону країни тримає не лише армія, а й усе суспільство. Мільйони людей долучилися до допомоги: збирають кошти, виготовляють спорядження, перевозять гуманітарні вантажі, підтримують переселенців і військових.", "Серед сильних сторін українців, які найчастіше називають, — креативність, самоорганізація, швидкість ухвалення рішень, взаємопідтримка та готовність брати відповідальність на себе."], "ul": []}, {"h": "Сильні сторони в конкретних проєктах", "p": ["Ці риси втілюються у великих і малих волонтерських ініціативах. Серед відомих прикладів:"], "ul": ["фонд «Повернись живим»;", "Фонд Сергія Притули;", "ініціатива Victory Drones;", "«Солом'янські котики»;", "ініціатива «Тиловики Азову»."]}, {"h": "Чому українці донатять", "p": ["Масові пожертви на спільні цілі свідчать про колективні цінності: відповідальність за спільне майбутнє, солідарність, довіру одне до одного та розуміння, що від внеску кожного залежить результат. Волонтерство — це прояв громадянської позиції, а не лише допомога грошима.", "Форми спротиву різноманітні — від масового волонтерства й військової винахідливості до культурного спротиву (збереження мови, традицій, творчості)."], "ul": []}, {"h": "Як спланувати волонтерський збір у громаді", "p": ["Ефективний збір починається з чіткого плану. Скористайтеся шаблоном:"], "ul": ["Мета — що саме потрібно і для кого (наприклад, дрон для підрозділу, де служать земляки).", "Сума — скільки коштів потрібно зібрати.", "Термін — до якої дати збір має бути закрито.", "Цільова аудиторія — хто може долучитися (однокласники, батьки, громада, місцевий бізнес).", "Інструменти — як збирати і як звітувати (благодійна «банка», ярмарок, соціальні мережі, публічний звіт)."]}, {"h": "Довіра і прозорість", "p": ["Люди охоче донатять тим, кому довіряють. Тому важливо публічно повідомляти про хід збору, показувати, на що витрачено кошти, і дякувати кожному, хто долучився. Прозорий звіт після завершення збору — запорука того, що наступного разу вам знову допоможуть."], "ul": []}], "f": "Фонд «Повернись живим» з'явився у 2014 році як волонтерська ініціатива і став однією з найбільших українських організацій, що допомагають Силам оборони.", "pr": ["Дослідіть історію та місію однієї відомої української волонтерської організації (наприклад, «Повернись живим» або Фонд Сергія Притули). Підготуйте коротку доповідь або інфографіку про її найбільший успішний проєкт.", "Розробіть план волонтерського збору у своїй громаді за шаблоном: мета, сума, термін, цільова аудиторія, інструменти. Визначте, яким буде перший крок.", "Проведіть коротке інтерв'ю (можна онлайн) з місцевим волонтером або волонтеркою: запитайте про найбільший виклик і найбільше натхнення в роботі. Напишіть есе-рефлексію."], "q": ["Які сильні сторони українців проявилися під час повномасштабної війни?", "Наведіть приклади волонтерських ініціатив і поясніть, яку сильну сторону суспільства кожна з них демонструє.", "Про які колективні цінності свідчить готовність українців донатити на спільні цілі?", "З яких елементів складається план волонтерського збору?", "Чому прозорість і звітність важливі для успіху збору?"]}, {"n": "2", "t": "Захист України як усвідомлений вибір (кейс-стаді з різними ролями)", "g": "Зрозуміти, що перемога і відбудова потребують співпраці різних цивільних професій, побачити економічну перспективу оборонної сфери та навчитися оцінювати власні навички як внесок у спільну команду.", "k": "", "terms": [["Технології подвійного призначення", "розробки, які можна використовувати як у цивільній, так і у військовій сфері (наприклад, дрон для обприскування поля і для потреб війська)."], ["Defence-Tech (оборонні технології)", "галузь, що створює інноваційні рішення для оборони: дрони, засоби зв'язку, кіберзахист тощо."], ["Нетворкінг", "уміння знаходити потрібних людей, оцінювати їхні компетенції та налагоджувати співпрацю для досягнення мети."], ["Синергія", "ефект спільної роботи, коли результат команди більший, ніж сума внесків окремих людей."], ["Адвокація", "діяльність, спрямована на те, щоб привернути увагу та підтримку до певної справи (наприклад, на міжнародному рівні)."]], "th": [{"h": "Цивільні професії — фундамент оборони", "p": ["Сучасна війна — це змагання не лише армій, а й економік, технологій та інформації. Навички бізнес-планування, дисципліна, знання IT, психології, права, логістики чи комунікацій стають критично важливими для військового успіху та подальшої відбудови країни.", "Оборонна сфера та Defence-Tech створюють інноваційну економіку, конкурентні зарплати й гідні робочі місця. Тому захист України — це також і кар'єрна перспектива."], "ul": []}, {"h": "Три ключові цілі: як професії працюють разом", "p": [], "ul": ["«Перезавантаження» — програма повернення ветеранів і ветеранок до цивільного життя: від психологічної допомоги до відкриття власного бізнесу. Потрібні психологи, HR-фахівці, економісти, юристи, спеціалісти з відновлення інфраструктури.", "«Технологічний стрибок» — масове виробництво дешевих дронів подвійного призначення, яке фінансується цивільними аграрними замовленнями. Потрібні інженери, фахівці з IT-безпеки, економісти, логісти, оператори БПЛА.", "«Міжнародна адвокація» — інформаційна кампанія «Україна — щит Європи» для європейських медіа. Потрібні журналісти та PR-фахівці, спеціалісти з кібербезпеки, економісти, експерти з міжнародної політики, фахівці з грантів."]}, {"h": "Неочевидні поєднання професій", "p": ["Найцікавіші результати дає співпраця людей з різних галузей:"], "ul": ["Інженер-конструктор + агроном-технолог = дешеві надійні дрони, що виконують і аграрні, і військові завдання.", "Економіст-аналітик + спеціаліст із відновлення інфраструктури = обґрунтована відбудова з мінімальними корупційними ризиками.", "Медіаменеджер + військовий психолог = інформаційні кампанії, які підтримують дух суспільства, не травмуючи людей.", "Юрист-міжнародник + фахівець із грантів = прозоре й законне залучення міжнародного фінансування.", "Агроном-технолог + оператор БПЛА = картографування територій для розмінування та відновлення сільського господарства."]}, {"h": "Кейс «Український Тоні Старк»: Роман Шухевич", "p": ["Роман Шухевич до війни мав власне рекламне агентство «Фама», займався спортом, здобував інженерну освіту. Згодом він став командиром, який вибудував цілу систему українського опору.", "Його цивільні навички — стратегічне планування, PR, лідерство, дисципліна, фізична й ментальна стійкість, системність і проєктний менеджмент — стали основою для військової стратегії."], "ul": []}, {"h": "Сучасний приклад: Роберт Бровді («Мадяр»)", "p": ["До війни — власник великої агрокомпанії. Навички управління територіями, логістикою постачання (насіння, пальне) та складним парком техніки він переніс у військову площину: управління підрозділом безпілотників, логістика ремонтних баз, швидке ухвалення рішень.", "Обидва приклади доводять: справжній лідер — це той, хто вміє зібрати найкращий набір талантів і розкрити їхній потенціал задля спільної перемоги."], "ul": []}, {"h": "Чи можна гідно заробляти в Україні", "p": ["За орієнтовними даними 2025 року, фахівці, потрібні оборонній сфері, мають конкурентні зарплати. Наприклад, інженер-конструктор — приблизно 45 000–60 000+ грн, спеціаліст з IT-безпеки — 40 000–80 000+ грн, оператор БПЛА — 60 000–120 000+ грн, менеджер проєктів — 35 000–60 000+ грн. Цифри приблизні й залежать від досвіду та місця роботи."], "ul": []}], "f": "", "pr": ["«Подвійне призначення»: знайдіть 2–3 приклади українських стартапів або бізнесів, які використовують технології подвійного призначення, і коротко опишіть кожен.", "Оберіть одну з трьох цілей («Перезавантаження», «Технологічний стрибок», «Міжнародна адвокація») і складіть бриф: мета операції, ресурси (які навички потрібні), кого шукаєте для підсилення і навіщо, ключове повідомлення (слоган).", "Напишіть есей (близько 150 слів): «Як моя майбутня професія допоможе реалізувати одну з трьох цілей і як це вплине на мій професійний ріст?»"], "q": ["Чому цивільні професії (IT, економіка, PR) критично важливі для оборони та відбудови?", "Що таке технології подвійного призначення? Наведіть приклад.", "Які цивільні навички Романа Шухевича та Роберта Бровді стали в пригоді у військовій справі?", "Що таке синергія в команді і як її досягти?", "Які професії потрібні для реалізації цілі «Перезавантаження» і чому?"]}, {"n": "3", "t": "Способи реалізувати свій талант в обороні України", "g": "Навчитися оцінювати свої результати НМТ, здібності та обмеження щодо вимог цивільних ЗВО і військових навчальних закладів, розрізняти військовий і цивільний шляхи та скласти власну освітню траєкторію.", "k": "", "terms": [["ВВНЗ", "вищий військовий навчальний заклад, що готує офіцерів і фахівців для Збройних Сил та інших військових формувань."], ["НМТ", "національний мультипредметний тест, результати якого використовують для вступу до закладів вищої освіти."], ["ВЛК", "військово-лікарська комісія, яка визначає, чи відповідає стан здоров'я кандидата вимогам до військової служби чи навчання."], ["ППВ", "професійно-психологічний відбір — обстеження, що оцінює психологічну придатність кандидата до військової професії."], ["ОПК", "оборонно-промисловий комплекс — підприємства та організації, що розробляють і виробляють оборонну продукцію."], ["Дуальна освіта", "форма навчання, що поєднує здобуття освіти в закладі з практичною роботою на підприємстві."]], "th": [{"h": "Два шляхи внеску в оборону", "p": ["Внесок у стійкість держави можливий двома взаємопов'язаними шляхами:"], "ul": ["Шлях А — військовий: навчання у ВВНЗ і кар'єра офіцера або військового фахівця.", "Шлях Б — технологічний та цивільний: освіта в цивільному ЗВО і робота в оборонно-промисловому комплексі, Defence-Tech, державних структурах."]}, {"h": "Інтелектуальна оборона", "p": ["Сучасна війна — це змагання технологій, де інженер, айтівець чи хімік так само важливі, як і військовий. Україна розвиває сектор Military Tech, кластер Brave1, програми дуальної освіти в ЗВО — так держава зміщує фокус на мобілізацію інтелекту. Найпотрібніші напрями — дрони, радіоелектронна боротьба, кіберзахист."], "ul": []}, {"h": "Військові навчальні заклади та їхні напрями", "p": [], "ul": ["Національний університет оборони України (Київ) — стратегічний та оперативний рівні військового управління.", "Національна академія сухопутних військ імені гетьмана Петра Сагайдачного (Львів) — офіцери механізованих, танкових, інженерних військ, ракетних військ і артилерії, фахівці морально-психологічного забезпечення.", "Харківський національний університет Повітряних Сил імені Івана Кожедуба — авіаційні спеціальності, протиповітряна оборона, автоматизовані системи управління.", "Військова академія (Одеса) — логістика, розвідувально-інформаційна робота, фахівці для десантно-штурмових військ і ВМС.", "Військовий інститут телекомунікацій та інформатизації імені Героїв Крут (Київ) — зв'язок, IT, кібербезпека, радіоелектронна боротьба.", "Військовий інститут КНУ імені Тараса Шевченка — міжнародна інформація, військове право, фінанси, перекладачі.", "Також: Військовий інститут танкових військ НТУ «ХПІ», Інститут ВМС Одеської морської академії, Національна академія внутрішніх справ, Національна академія СБУ."]}, {"h": "Вимоги до вступу у ВВНЗ", "p": [], "ul": ["Повна загальна середня освіта (або фахова передвища).", "Результати НМТ: як правило, обов'язкові українська мова та математика, а також профільні предмети залежно від спеціальності (історія України, іноземна мова, фізика, хімія, біологія, географія).", "Військово-професійний відбір: медичний огляд (ВЛК), психологічне обстеження (ППВ), перевірка фізичної підготовленості.", "Документи подають через територіальні центри комплектування та соціальної підтримки, де проходять первинний відбір.", "Перелік предметів і мінімальні бали щороку змінюються — завжди перевіряйте інформацію на офіційних сайтах ВВНЗ або Міністерства оборони."]}, {"h": "Цивільний шлях в оборонній сфері", "p": ["Працювати для війська можна й без вступу до ВВНЗ. Затребувані спеціальності: озброєння та військова техніка, електронні комунікації та радіотехніка, хімічні й біотехнології, прикладна механіка та машинобудування, інженерія програмного забезпечення та комп'ютерні науки. З оборонною галуззю співпрацюють, зокрема, Львівська політехніка, ХНУРЕ, КПІ імені Ігоря Сікорського, ДНУ імені Олеся Гончара, Український католицький університет."], "ul": []}, {"h": "Як скласти власну освітню траєкторію", "p": [], "ul": ["Визначте кар'єрну мету (наприклад, інженер-конструктор БПЛА, військовий медик, логіст).", "Оцініть свої сильні та слабкі предмети НМТ і вагові коефіцієнти для обраної спеціальності.", "Чесно оцініть нетехнічні бар'єри: стан здоров'я, психологічну готовність, фізичну форму.", "Порівняйте два варіанти — військовий (ВВНЗ) і цивільний (ЗВО/ОПК) — та оберіть оптимальний.", "Складіть план дій на найближчі 3 місяці."]}], "f": "Brave1 — державна платформа, створена у 2023 році для підтримки розробників оборонних технологій в Україні.", "pr": ["Заповніть для себе «бланк кар'єрного розвитку»: кар'єрна мета; предмети НМТ і ваші сильні та слабкі сторони; можливі бар'єри (здоров'я, психологічна готовність, фізична підготовка); варіант за шляхом А (ВВНЗ) і за шляхом Б (цивільний ЗВО/ОПК); оптимальний шлях і план на 3 місяці.", "Проаналізуйте кейс: Олена, 16 років, сильна в логіці, алгоритмах та англійській, через поганий зір військовий шлях для неї закритий, мріє стати системним архітектором. Запропонуйте їй спеціальність, ЗВО та аргументуйте, як вона може працювати на оборону.", "Знайдіть на офіційному сайті одного ВВНЗ або ЗВО актуальні вимоги до вступу на спеціальність, яка вас цікавить, і випишіть: предмети НМТ, етапи відбору, контакти приймальної комісії."], "q": ["Чим відрізняються шлях А і шлях Б реалізації себе в обороні України?", "Які нетехнічні вимоги є обов'язковими для вступу до ВВНЗ?", "Які інженерно-технічн
