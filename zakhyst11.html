й), навіть «жартома».", "Тримай палець поза спусковим гачком, доки не ухвалив рішення про постріл.", "Будь упевнений у цілі та в тому, що знаходиться за нею і поруч із нею."]}, {"h": "Основні класи стрілецької зброї", "p": ["Стрілецьку зброю поділяють на класи залежно від призначення:"], "ul": ["Пістолети — індивідуальна зброя для самооборони на малих відстанях.", "Автомати — основна індивідуальна зброя військовослужбовця для ведення бою на середніх відстанях.", "Гвинтівки — зброя для влучної стрільби, зокрема на великі відстані (наприклад, снайперські гвинтівки).", "Кулемети — зброя для ведення інтенсивного вогню, підтримки підрозділу та ураження групових цілей."]}, {"h": "Дві базові системи: АК-74 та AR-15", "p": ["У сучасних Силах оборони України найпоширенішими є автомати системи Калашникова (АК-74) і зброя на платформі AR-15 (зокрема українська UAR-15). Обидві системи мають подібні основні частини: ствол, ствольну коробку, затвор, магазин, приклад, прицільні пристрої та газовідвідну систему. Вони відрізняються конструкцією, ергономікою та розташуванням органів керування.", "Для учня важливо знати назви основних частин і їхнє загальне призначення. Практичні дії зі зброєю (зокрема розбирання та збирання) виконують лише під наглядом інструктора чи вчителя, на макетах і з дотриманням правил безпеки."], "ul": []}, {"h": "Зберігання зброї та боєприпасів", "p": [], "ul": ["Зброю зберігають розрядженою, у замкненому місці (сейф, шафа), недоступному для дітей і сторонніх осіб.", "Боєприпаси зберігають окремо від зброї.", "Знайдену зброю чи боєприпаси не можна чіпати — слід відійти й повідомити поліцію (102) або службу порятунку (101, 112)."]}, {"h": "Навіщо доглядати за зброєю", "p": ["Регулярне чищення та змащування потрібні, щоб зброя була справною і безпечною. Перед будь-яким доглядом обов'язково перевіряють, що зброя розряджена. Важливо діяти уважно, щоб не загубити деталей, і обережно чистити ствол, адже його пошкодження погіршує точність."], "ul": []}], "f": "Цифра в назві АК-74 означає рік прийняття автомата на озброєння — 1974.", "pr": ["Запиши з пам'яті 4 золоті правила Кодексу стрільця і для кожного наведи приклад ситуації, у якій його порушення могло б призвести до трагедії.", "Склади таблицю «Клас зброї — призначення — приклад» для пістолетів, автоматів, гвинтівок і кулеметів.", "Склади пам'ятку для родини «Як безпечно зберігати зброю вдома і що робити, якщо знайшов зброю чи боєприпаси»."], "q": ["Які 4 золоті правила Кодексу стрільця ти знаєш?", "Чим відрізняється призначення автомата і кулемета?", "Які основні частини мають АК-74 і AR-15?", "Чому зброю і боєприпаси зберігають окремо?", "Що треба зробити перед будь-якими діями зі зброєю, зокрема перед чищенням?"]}, {"n": "2–4", "t": "Стрілецька справа", "g": "Усвідомити, що робота зі зброєю вимагає відповідальності, дисципліни та уваги; знати правила безпеки на вогневому рубежі, основні положення для стрільби та принцип поступовості в навчанні.", "k": "", "terms": [["Вогневий рубіж", "обладнане місце, з якого ведуть стрільбу і на якому діють суворі правила безпеки та команди керівника стрільби."], ["Пневматична зброя", "зброя, у якій куля (кулька) рухається під дією стисненого повітря чи газу; вона також може бути смертельно небезпечною."], ["Положення для стрільби", "поза стрільця: верхнє (стоячи), середнє (з коліна) та нижнє (лежачи)."], ["Кучність стрільби", "здатність розміщувати влучання близько одне до одного; свідчить про стабільність дій стрільця."], ["Команда «Стоп»", "команда керівника стрільби, після якої будь-яку стрільбу негайно припиняють."]], "th": [{"h": "Урок з трагедії", "p": ["22 листопада 2023 року в Пнівському ліцеї під час занять гуртка «Влучний стрілець» учень, перезаряджаючи пневматичну гвинтівку, з необережності здійснив постріл в іншого учня. Куля калібру 4,5 мм влучила в груди, і 14-річний хлопець помер до приїзду швидкої допомоги.", "Цей випадок показує: пневматична зброя — не іграшка, а порушення правил безпеки навіть на мить може мати непоправні наслідки."], "ul": []}, {"h": "Правила безпеки на вогневому рубежі", "p": [], "ul": ["Діяти лише за командами керівника стрільби, чітко чути та виконувати їх.", "Ствол завжди спрямований у бік мішеней, навіть під час перезаряджання.", "Ніхто не виходить уперед за лінію вогню, доки стрільбу не припинено.", "Після команди «Стоп» стрільбу негайно припиняють.", "Використовувати захисні (стрілецькі) окуляри.", "Під час повітряної тривоги заняття переносять в укриття."]}, {"h": "Положення для стрільби", "p": ["Розрізняють три основні положення: стоячи (верхнє), з коліна (середнє) та лежачи (нижнє). Чим нижче положення, тим стійкіше тіло і тим менше стрілець помітний та вразливий. Стрільба стоячи, а особливо після фізичного навантаження, коли дихання «збите», — найскладніша. Саме тому всі стійки покликані допомогти швидко зайняти зручне й безпечне положення."], "ul": []}, {"h": "Принцип поступовості", "p": ["Навички формуються від простого до складного:"], "ul": ["спочатку — навчитися влучно стріляти;", "далі — стріляти швидко, зберігаючи влучність;", "лише потім — додавати стресові фактори (шум, втома, обмеження часу)."]}, {"h": "Влучність, а не кількість", "p": ["Головне правило стрілецької справи — потрібно ВЛУЧНО стріляти, а не просто стріляти. Кучність влучань у мішені показує, наскільки стабільно і зосереджено діє стрілець. Аналіз власних мішеней після стрільби допомагає побачити помилки й поступово їх виправляти під керівництвом інструктора."], "ul": []}, {"h": "Як навчатися стрілецької справи", "p": ["Практичні навички стрільби набувають лише на обладнаних місцях під наглядом кваліфікованого інструктора чи вчителя. Самостійні «тренування» з будь-якою зброєю, зокрема пневматичною, вдома чи на вулиці неприпустимі."], "ul": []}], "f": "", "pr": ["Проаналізуй випадок у Пнівському ліцеї: які правила безпеки були порушені і що могло б запобігти трагедії? Відповідь оформи письмово (5–7 речень).", "Склади пам'ятку «Правила поведінки на вогневому рубежі» (не менше 6 пунктів).", "Поясни письмово, чому навчання стрільби будують за принципом поступовості «від простого до складного»."], "q": ["Чому пневматична зброя теж становить небезпеку для життя?", "Які три основні положення для стрільби ти знаєш і чим вони відрізняються?", "Що означає команда «Стоп» на вогневому рубежі?", "Чому стріляти після фізичного навантаження складніше?", "Що показує кучність влучань на мішені?"]}, {"n": "5", "t": "Радіозвʼязок на полі бою", "g": "Знати основні поняття військового радіозв'язку, загрози, пов'язані з використанням рації, та алгоритми передачі інформації ACE, SALUTE і 3D; розуміти важливість стислості, чіткості та дисципліни радіообміну.", "k": "", "terms": [["Радіомережа", "група абонентів (рацій), що працюють на одній частоті та підпорядковані одному командирові або диспетчерові."], ["Позивний", "умовна назва або код, що використовується замість імені чи назви підрозділу (наприклад, «Скеля», «Айстра-45»)."], ["Ретранслятор", "пристрій, який приймає слабкий сигнал і передає його далі з більшою потужністю, збільшуючи дальність зв'язку."], ["Пеленгація", "визначення місця розташування джерела радіосигналу за допомогою спеціальних антен."], ["Радіоелектронна боротьба (РЕБ)", "придушення або блокування зв'язку противника, зокрема глушінням і імітацією."], ["Контрольний час", "заздалегідь обумовлений час, коли всі абоненти мережі виходять на зв'язок для перевірки."]], "th": [{"h": "Роль радіозв'язку", "p": ["Радіозв'язок — це нервова система військ. Він забезпечує безперервне та оперативне управління підрозділами. Швидкість передачі інформації часто дорівнює виживанню та успіху операції."], "ul": ["передача наказів, цілевказань і бойових розпоряджень;", "доповіді про обстановку, втрати, виявлення противника;", "координація дій різних підрозділів (піхота, артилерія, дрони)."]}, {"h": "Основні поняття", "p": ["Частота — конкретна хвиля, на якій відбувається передача; її вимірюють у мегагерцах (МГц). Несанкціонована зміна частоти може призвести до втрати зв'язку з підрозділом. Позивні є основою радіодисципліни: вони замінюють імена та назви підрозділів."], "ul": []}, {"h": "Небезпека ефіру: РЕР і РЕБ", "p": ["Користуючись рацією, ви не лише спілкуєтеся, а й видаєте своє місцезнаходження. Радіоелектронна розвідка (РЕР) противника постійно сканує ефір."], "ul": ["Перехоплення: противник записує переговори; згадка про позиції, плани чи імена — пряма допомога ворогу.", "Пеленгація: чим довше і частіше ви говорите, тим точніше противник визначить ваші координати, а це може призвести до вогневого удару.", "Глушіння: потужний шумовий сигнал на вашій частоті унеможливлює передачу інформації.", "Імітація: противник може видавати себе за ваш підрозділ і передавати фальшиві накази чи дезінформацію."]}, {"h": "Радіодисципліна: правильно і неправильно", "p": ["Неправильно: «Привіт, Вова! Це Олег з 3-ї роти. Ми зараз за тим сірим будинком. У нас тут два поранених…» — названо імена, точне місце, кількість втрат і потреби.", "Правильно: «Скеля-11, я Айстра-45. Плюс у мене 300, потреба ACE негайно. Як прийом?» — лише позивні та кодові слова («плюс» — на зв'язку, «300» — поранений), без зайвої інформації."], "ul": []}, {"h": "Доповідь про результати бою (ACE)", "p": [], "ul": ["A — Ammunition (боєприпаси): залишок — достатньо, мало, критично мало.", "C — Casualties (втрати): наявність «200-х» (загиблих) і «300-х» (поранених).", "E — Equipment (спорядження, техніка): справна, пошкоджена, виведена з ладу."]}, {"h": "Доповідь про противника (SALUTE)", "p": [], "ul": ["S — Size (розмір): кількість особового складу противника.", "A — Activity (діяльність): що робить противник (рухається, окопується, веде вогонь).", "L — Location (місце): координати або орієнтири.", "U — Unit (підрозділ): ознаки належності (шеврони, розпізнавальні знаки), рівень підготовки.", "T — Time (час): точний час спостереження.", "E — Equipment (озброєння): яке озброєння та техніка наявні."]}, {"h": "3D і порядок доповіді", "p": ["3D допомагає коротко вказати ціль: D — Direction (напрямок, за годинниковою стрілкою, де 12 — прямо перед собою), D — Distance (відстань до противника), D — Description (короткий опис противника, його кількості та озброєння).", "Порядок доповіді: виклик (позивний командира → свій позивний) → напрямок і дистанція → дані SALUTE (S → A → L → U → T → E) → завершення («Кінець зв'язку. Прийом»)."], "ul": []}], "f": "Алгоритми ACE, SALUTE і 3D використовують у командному курсі тактичного рівня сил територіальної оборони — вони дають змогу передати важливу інформацію за лічені секунди.", "pr": ["Прочитай ситуацію: «На 12:00 за годинниковою стрілкою, на відстані 600 м, близько 7 хвилин тому ви помітили групу з 12 осіб, яка повільно рухається повзком у високій траві вздовж лісосмуги до трансформаторного стовпа посередині поля. Одяг — старий вигорілий камуфляж, озброєння — автомати та два підствольні гранатомети». Склади письмову доповідь за алгоритмом: виклик → 3D → SALUTE → завершення (позивні придумай самостійно).", "Знайди помилки в повідомленні «Привіт, Вова! Це Олег з 3-ї роти. Ми зараз за тим сірим будинком. У нас тут два поранених» і перепиши його з дотриманням радіодисципліни.", "Склади таблицю-пам'ятку з розшифруванням ACE, SALUTE і 3D."], "q": ["Чому радіозв'язок називають «нервовою системою військ»?", "Що таке пеленгація і чому довгі переговори небезпечні?", "Як розшифровується ACE і коли використовують таку доповідь?", "Що означає кожна літера в SALUTE?", "Навіщо замість імен використовують позивні?"]}, {"n": "6–7", "t": "Техніка переміщення у складі бойової групи: пересування двійками на різній місцевості, реакція на контакт", "g": "Знати принципи пересування двійками («вогонь і рух») на відкритій, лісистій та міській місцевості, розуміти значення координації й комунікації та вміти визначати напрямок загрози «за годинником».", "k": "", "terms": [["Бойова двійка", "двоє бійців, які діють разом і забезпечують взаємне прикриття."], ["«Вогонь і рух»", "принцип, за яким один член групи прикриває, а інший у цей час переміщується."], ["Перебіжка", "короткий швидкий рух (5–10 секунд) від укриття до укриття."], ["Реакція на контакт", "негайні скоординовані дії групи після виявлення противника."], ["Визначення напрямку «за годинником»", "спосіб вказати напрямок, де 12 — напрямок руху вперед, 3 — праворуч, 6 — назад, 9 — ліворуч."]], "th": [{"h": "Пересування двійками", "p": ["Пересування двійками — базова техніка в складі бойової групи: двоє рухаються поперемінно, забезпечуючи взаємне прикриття. Поки один переміщується, другий спостерігає та прикриває. Так скорочується час перебування на відкритому просторі й знижується ризик ураження."], "ul": []}, {"h": "Вплив місцевості", "p": [], "ul": ["Відкрита місцевість: короткі перебіжки по 5–10 секунд від укриття до укриття.", "Лісиста місцевість: використання природних укриттів (дерева, кущі), дистанція 5–10 метрів, щоб уникати скупчення.", "Міська місцевість: використання будівель і автомобілів як укриттів, особлива увага до кутів і дверей."]}, {"h": "Команди при русі", "p": ["Рух двійки супроводжується короткими чіткими командами. Наприклад: «Вперед!» — «Йду!»; після зупинки в укритті — «Крию!», і тоді рухається напарник. Під час відходу порядок той самий, лише рух відбувається назад.", "У навчальних вправах можна використовувати рації та кодові слова, наприклад: «Сова» — крию (спостерігаю), «Кріт» — готовий до переміщення, «Контакт [напрямок]!» — виявлено противника."], "ul": []}, {"h": "Реакція на контакт двійки", "p": ["Реакція на контакт починається з негайного сигналу «Контакт!» і визначення напрямку загрози за годинником (наприклад, «Контакт на 3!»). Той, хто ближче до загрози, стримує противника, а напарник займає укриття, підтверджує інформацію («Прийняв!») і разом вони координують подальші дії — відхід або маневр. Важливо використовувати лише встановлені сигнали, щоб уникнути хаосу."], "ul": []}, {"h": "Реакція на контакт групи", "p": ["У групі реакція вимагає ширшої координації: командир дає команду на розгортання та розподіляє сектори відповідальності. Група може застосовувати «відскок» — почергове відходження під взаємним прикриттям. Ефективність дій залежить від тренованості та злагодженої комунікації."], "ul": []}, {"h": "Безпека під час тренувань", "p": ["Вправи з пересування передбачають часті падіння та роботу з коліна, тому під час практичних занять обов'язково використовують наколінники і захисні окуляри, а виконують вправи лише під керівництвом інструктора, на макетах."], "ul": []}], "f": "", "pr": ["Поясни письмово, як змінюється техніка пересування двійкою на відкритій, лісистій і міській місцевості (по 2–3 речення для кожного типу).", "Намалюй циферблат і познач на ньому напрямки 12, 3, 6, 9 відносно напрямку руху. Склади 3 приклади команд «Контакт на …!» для різних ситуацій.", "Запиши послідовність команд двійки під час просування вперед і відходу з використанням слів «Вперед!», «Йду!», «Крию!»."], "q": ["У чому полягає принцип «вогонь і рух»?", "Чому перебіжки на відкритій місцевості мають тривати лише 5–10 секунд?", "Як за допомогою «годинника» вказати, що загроза праворуч?", "Що таке «відскок» під час реакції групи на контакт?", "Чому під час дій у двійці треба користуватися лише встановленими сигналами?"]}, {"n": "8", "t": "Подолання інженерних загороджень. Смуга перешкод", "g": "Знати типи невибухових інженерних загороджень та їхнє призначення, способи їх виявлення та значення командної роботи під час подолання перешкод.", "k": "", "terms": [["Інженерні загородження", "штучні перешкоди на місцевості, що уповільнюють або зупиняють рух противника."], ["Невибухові загородження", "перешкоди без вибухових засобів: дротяні перепони, рови, окопи тощо."], ["Комбіновані загородження", "поєднання різних видів перешкод, що ускладнює їх подолання."], ["Зондування", "спосіб виявлення перешкод, коли поверхню обережно перевіряють спеціальним щупом; застосовують його лише фахівці."], ["Смуга перешкод", "навчальний комплекс перешкод для тренування фізичної витривалості та навичок їх подолання."]], "th": [{"h": "Призначення інженерних загороджень", "p": ["Основне призначення невибухових загороджень — уповільнити рух противника, змусити його зупинитися чи змінити маршрут і таким чином потрапити під спостереження та вогонь. До них належать дротяні перепони, рови, окопи. Часто їх поєднують між собою, створюючи комбіновані загородження."], "ul": []}, {"h": "Виявлення загороджень", "p": ["Основні методи виявлення — уважний візуальний пошук і зондування. Важливо пам'ятати: поруч із невибуховими загородженнями можуть бути вибухонебезпечні предмети."], "ul": ["Якщо помітив підозрілий предмет, дріт-розтяжку чи ознаки мінування — не наближайся і нічого не чіпай.", "Зупинись, повертайся тим самим шляхом, яким прийшов.", "Попередь інших і повідом за номерами 101, 102 або 112."]}, {"h": "Командна робота під час подолання", "p": ["Перешкоди долають злагоджено: поки одні учасники групи проходять перешкоду, інші забезпечують спостереження та прикриття. Під час роботи з дротом (навіть навчальним) потрібні плавні обережні рухи, а після стрибків — правильне приземлення, щоб уникнути травм."], "ul": []}, {"h": "Загальновійськова смуга перешкод (ЗСП)", "p": ["Це стандартизований комплекс, що використовується у військових частинах і навчальних центрах. Він містить високі стіни, зруйновані мости, вертикальні сітки, траншеї, лабіринти та інші перешкоди."], "ul": ["Переваги: висока реалістичність, тренування фізичної витривалості та комплексних навичок.", "Недоліки: потребує значної площі, капітального будівництва і великих витрат."]}, {"h": "Імпровізована смуга перешкод", "p": ["Для шкіл і навчальних осередків з обмеженими ресурсами облаштовують імпровізовану смугу, яка імітує ключові перешкоди. Під час навчального проходження команди долають смугу почергово, а оцінюють не лише швидкість, а й безпечність та злагодженість дій."], "ul": []}], "f": "", "pr": ["Склади таблицю «Вид невибухового загородження — призначення — небезпека під час подолання» (не менше 3 видів).", "Намалюй схему власної імпровізованої смуги перешкод для шкільного подвір'я з 5–6 етапів і коротко опиши правила безпеки для кожного етапу.", "Напиши пам'ятку «Що робити, якщо поруч із перешкодою помітив підозрілий предмет»."], "q": ["Яке основне призначення невибухових інженерних загороджень?", "Які методи виявлення загороджень ти знаєш?", "Що таке комбіновані загородження?", "Чим загальновійськова смуга перешкод відрізняється від імпровізованої?", "Як діяти, якщо помітив підозрілий предмет чи дріт-розтяжку?"]}]}, {"name": "Тренінг 5. Домедична допомога в умовах бою", "lessons": [{"n": "1", "t": "Ознайомлення з протоколами TCCC. Правила саморегулювання. Бойовий стрес та психологія екстремальних ситуацій. Військові професії (бойові медики)", "g": "Знати три фази протоколу TCCC і розуміти, чому безпека — найвищий пріоритет. Уміти розпізнавати власні реакції на стрес, повертати собі контроль за допомогою дихання та «заземлення» і застосовувати протокол ЯАЛОМ.", "k": "", "terms": [["TCCC (Tactical Combat Casualty Care)", "протокол допомоги пораненим в умовах бойових дій, який адаптує стандартні правила першої допомоги до загроз на полі бою; його головна мета — зменшити кількість загиблих."], ["Бойовий медик", "особа, яка не лише володіє медичними знаннями, а й уміє діяти в екстремальних умовах: під вогнем, без належного обладнання, коли не можна втрачати ні секунди; насамперед керує ситуацією і зберігає спокій."], ["Fight / Flight / Freeze", "автоматичні реакції мозку й тіла на загрозу: боротьба, втеча або ступор (завмирання)."], ["«Стоп-кадр»", "перша команда, яку слід дати собі в укритті: зупинитися, оглянути себе й оцінити власний стан перед тим, як допомагати іншим."], ["ЯАЛОМ", "простий протокол первинної психологічної допомоги та оцінки стану постраждалого: Я знаю — А що з тобою? — Лежи — Озирнися — Можеш сам / сама."]], "th": [{"h": "Безпека понад усе", "p": ["Небезпека трапляється не лише на полі бою: це може бути знайоме перехрестя, де сталася ДТП, або під’їзд, де відбулася бійка. Ваша безпека — перший крок до порятунку інших.", "Понад половина смертей від крововтрати — і на полі бою, і в цивільних умовах — настає в перші хвилини, коли швидка допомога фізично не встигає приїхати. Тому ключова ідея TCCC: кожен військовослужбовець і кожна військовослужбовиця, незалежно від спеціальності, — перша особа, яка надає допомогу. В умовах війни це важливо для кожного українця та кожної українки."], "ul": []}, {"h": "Тактичні пріоритети та три фази TCCC", "p": ["Послідовність тактичних пріоритетів: 1) подбайте про безпеку місця події; 2) перемістіть пораненого / поранену в безпечне місце; 3) виявіть і зупиніть загрозливу для життя кровотечу."], "ul": ["Допомога під вогнем / під загрозою (Care Under Fire, «червона зона») — наголос на самозбереженні та швидкому переміщенні в укриття.", "Допомога в польових умовах (Tactical Field Care, «жовта зона») — повноцінна допомога, коли небезпеку мінімізовано.", "Допомога на етапі тактичної евакуації (Tactical Evacuation Care) — допомога під час транспортування."]}, {"h": "Як стрес впливає на мозок", "p": ["Стрес — нормальна реакція на аномальну ситуацію. У критичний момент мозок перемикається в режим виживання і «вимикає» вищі відділи.", "Мета не в тому, щоб позбутися страху, а в тому, щоб підкорити його чіткими діями та командами: «Страх — твій слуга»."], "ul": ["Амигдала (центр страху) реагує на загрозу миттєво й запускає реакції «бий, біжи або завмри»; у паніці вона ніби «захоплює» мозок.", "Префронтальна кора (центр логіки) відповідає за планування й аналіз; у гострому стресі її робота пригнічується, тому довгі пояснення та вмовляння не діють.", "Гіпокамп (пам’ять) під дією гормону стресу кортизолу може працювати гірше, тому травматичні спогади зберігаються уривками."]}, {"h": "Спершу — оглянь себе", "p": ["У стані гострого стресу мозок може ігнорувати сигнали тіла про травми — людина може не відчувати, що поранена, доки не опиниться в безпечному місці. Тому в укритті дайте собі команду «Стоп-кадр», огляньте себе і лише потім допомагайте іншим. Ключова послідовність: безпека — самооцінка — допомога іншим."], "ul": []}, {"h": "Техніки саморегуляції", "p": ["Техніки саморегуляції не замінюють медичних дій, але передують їм: вони повертають контроль над тілом і здатність мислити. Виконуються лише після оцінки безпеки (не під обстрілом). Ключове правило дихання: видих має бути довшим за вдих."], "ul": ["Дихання «Квадрат»: вдих (рахуйте подумки до 4) — затримка (до 4) — видих (до 6) — пауза (до 2–4).", "Дихання «Вуса»: глибокий вдих, а на видиху протяжно, співуче вимовити «Вуууусааа» — допомагає, коли в паніці важко видихнути.", "«М’язовий стоп-кадр»: стиснути кулаки щосили на 5 секунд, потім різко розслабити; повторити кілька разів.", "«Обтрусись»: напружити, а потім потрусити всім тілом, щоб «скинути» нервову напругу.", "«Заземлення» 5–4–3–2–1: назвіть 5 предметів, які бачите, 4 речі, які відчуваєте на дотик, 3 звуки, 2 запахи і 1 смак."]}, {"h": "Як підтримати іншу людину", "p": [], "ul": ["Паніка: говоріть тихо й рівно, давайте короткі прості команди («Сядь. Дихай»), поверніть увагу до тіла (відчути ґрунт ногами). Не кричіть у відповідь і не давайте складних інструкцій.", "Ступор: говоріть тихо, повільно й чітко, нагадайте людині про її завдання; можна вирівняти власне дихання під її ритм. Не шарпайте й не кричіть.", "Нервове тремтіння: це природний спосіб тіла скинути напругу — не намагайтеся його зупинити.", "Мимовільне нетримання від сильного страху — нормальна реакція тіла на загрозу, а не слабкість. Не коментуйте, не соромте, за можливості створіть умови для приватності.", "Апатія, виснаження: дайте просту рутинну справу, забезпечте теплом, їжею та водою; не змушуйте розповідати про почуття."]}, {"h": "Протокол ЯАЛОМ", "p": [], "ul": ["Я — Я знаю: «Я тут, щоб тобі допомогти». Це створює контакт і відчуття безпеки.", "А — А що з тобою?: «Що сталося? Де болить?» — швидка оцінка травм.", "Л — Лежи: «Лежи, не рухайся» — особливо важливо при підозрі на травму хребта.", "О — Озирнися: «Озирнися, ми зараз перемістимося в безпечне місце» — увага перемикається з небезпеки на план дій.", "М — Можеш сам / сама?: «Можеш повзти? Повзи!» — якщо це безпечно, постраждалий переміщується самостійно, і рятівник менше ризикує."]}], "f": "Без повторення навички швидко забуваються: згідно з кривою забування Еббінгауза, уже за кілька днів людина втрачає до половини інформації. Тому алгоритм TCCC, вивчений у 10 класі, повторюють і в 11-му.", "pr": ["Запишіть по пам’яті три тактичні пріоритети та три фази TCCC; для кожної фази коротко поясніть, що в ній головне.", "Відпрацюйте вдома дихання «Квадрат» (3 цикли) і вправу «5–4–3–2–1». Письмово опишіть, як змінився ваш стан після кожної вправи.", "Складіть картку-підказку протоколу ЯАЛОМ: для кожної літери запишіть фразу, яку ви скажете постраждалому, і поясніть, навіщо вона потрібна."], "q": ["Чому перед наданням допомоги іншим потрібно спершу оглянути себе?", "Чим відрізняються «червона» і «жовта» зони?", "Як реакції Fight / Flight / Freeze можуть завадити діяти раціонально?", "Яке правило дихання допомагає повернути контроль у стресі?", "Чого не можна робити, підтримуючи людину в паніці чи ступорі?"]}, {"n": "2", "t": "Правила поводження під час трьох фаз TCCC. Переміщення пораненого / пораненої із зони прямої загрози", "g": "Розуміти, коли і як безпечно переміщати пораненого, знати базові способи евакуації одним і двома рятувальниками та пріоритети транспортування.", "k": "", "terms": [["Евакуація пораненого", "переміщення постраждалої людини із зони загрози в безпечне місце для подальшої допомоги."], ["«Червона зона»", "зона прямої загрози (Care Under Fire), де єдине завдання — переміститися в укриття."], ["«Жовта зона»", "відносно безпечна зона (Tactical Field Care), де складають план і надають повноцінну допомогу."], ["Сортування (triage)", "визначення черговості допомоги та евакуації залежно від тяжкості стану постраждалих."], ["Імпровізовані ноші", "засіб для перенесення пораненого, виготовлений з підручних матеріалів: куртки, плащ-намету, ременів, палиць."]], "th": [{"h": "«Швидко, але обдумано»", "p": ["Швидкість евакуації важлива, але безпека — понад усе. Необдумані дії можуть спричинити появу нових постраждалих. Якщо рятувальник сам буде поранений, він не зможе допомогти ні собі, ні іншим.", "Перед переміщенням оцініть ситуацію: де укриття, якими шляхами можна відходити, чи є інші небезпеки — обстріл, уламки, вибухонебезпечні предмети."], "ul": []}, {"h": "Дії в різних зонах", "p": [], "ul": ["У «червоній зоні» мета одна — перемістити себе й пораненого в укриття.", "У «жовтій зоні» складають план порятунку: роззброїти пораненого (якщо він має зброю), оцінити його стан, надати допомогу.", "Переміщенням бажано займатися щонайменше вдвох; один рятувальник — екстрений варіант."]}, {"h": "Способи переміщення", "p": [], "ul": ["Одним рятувальником: перетягування пораненого лежачи, на собі, за бронезахист — найшвидші способи, але слід берегти голову постраждалого.", "Метод «пожежного»: перенесення людини на плечі — потребує фізичної сили, зате звільняє одну руку рятувальника.", "Двома рятувальниками: «ноші» зі зчеплених рук — дають змогу перенести пораненого на певну відстань.", "Підручні засоби: куртка, ремінь, плащ-намет можуть стати імпровізованими ношами і значно полегшити перенесення."]}, {"h": "Особливі випадки", "p": [], "ul": ["Підозра на травму хребта: будь-який рух вкрай небезпечний; переміщують обережно, не згинаючи тіло, на тверду поверхню (наприклад, двері чи щит).", "Масивна кровотеча: перед евакуацією її треба зупинити, а під час перенесення постійно контролювати, чи не відновилася.", "За можливості переміщення слід мінімізувати, особливо при підозрі на травму хребта, тазу чи внутрішню кровотечу; перед транспортуванням стан стабілізують (турнікет, фіксація кінцівок, перевірка дихальних шляхів)."]}, {"h": "Пріоритети транспортування", "p": [], "ul": ["За загрозою для життя: першими евакуюють тих, чий стан може погіршитися через затримку.", "За зоною ризику: спочатку — тих, хто в найнебезпечніших місцях.", "За можливістю самостійного руху: хто може пересуватися сам, евакуюється власними силами.", "За можливістю допомоги: рятувальник обирає тих, кому може надати ефективну допомогу."]}, {"h": "Психологія евакуації", "p": ["Якщо поранений при тямі, постійно розмовляйте з ним — це важливо для його психологічного стану. Спокій рятувальника передається пораненому і покращує його стан. Евакуація — командна робота, що потребує впевненості та координації."], "ul": []}], "f": "Перенесення людини на плечі називають методом «пожежного»: він вимагає сили, але залишає одну руку рятувальника вільною.", "pr": ["Складіть таблицю «Спосіб переміщення — скільки рятувальників — переваги — обмеження» для чотирьох способів з уроку.", "Уявіть, що на прогулянці людина впала з велосипеда і, ймовірно, травмувала спину. Письмово опишіть свої дії: що ви зробите і чого робити не будете.", "Перелічіть, які речі з вашого звичайного одягу та спорядження можна використати для імпровізованих нош."], "q": ["Чому не можна просто «схопити й побігти» з пораненим?", "Чому власна безпека рятувальника — пріоритет № 1?", "Що потрібно зробити перед евакуацією людини з масивною кровотечею?", "Як діяти, якщо є підозра на травму хребта?", "Назвіть чотири пріоритети транспортування поранених."]}, {"n": "3", "t": "Допомога в польових умовах. Алгоритм MARCH + склад аптечки", "g": "Знати послідовність алгоритму MARCH, склад індивідуальної аптечки IFAK і призначення кожного її компонента.", "k": "", "terms": [["MARCH", "алгоритм надання допомоги в польових умовах: масивна кровотеча, дихальні шляхи, дихання, циркуляція, гіпотермія / травми голови."], ["IFAK (Individual First Aid Kit)", "індивідуальна аптечка першої допомоги для екстреної допомоги в бойових умовах або надзвичайних ситуаціях до прибуття медиків чи евакуації."], ["Турнікет", "засіб для швидкої зупинки сильної кровотечі з кінцівки."], ["Гемостатичний засіб", "бинт (або порошок) з речовиною, що прискорює зсідання крові."], ["Оклюзійна пов’язка", "герметична пов’язка для закриття відкритої рани грудної клітки, що запобігає колапсу легені."], ["Гіпотермія", "небезпечне переохолодження організму."]], "th": [{"h": "Дві зони — різні дії", "p": ["У «червоній зоні» (під вогнем) ваша безпека — пріоритет № 1. Єдине, що можна зробити, не наражаючись на небезпеку, — накласти турнікет на кінцівку з масивною кровотечею. Усі інші дії — лише після переміщення в безпечне місце.", "У «жовтій зоні» (відносно безпечно) допомогу надають за чітким алгоритмом MARCH. В бойових умовах слід максимально знижувати силует: рухатися пригнувшись або плазом."], "ul": []}, {"h": "Алгоритм MARCH", "p": [], "ul": ["M — Massive Hemorrhage (масивна кровотеча): найважливіший крок, адже вона може вбити за лічені хвилини.", "A — Airway (дихальні шляхи): перевірити, чи дихає поранений, і чи не заблоковані дихальні шляхи.", "R — Respiration (дихання): оглянути грудну клітку, знайти відкриті поранення, за потреби закрити їх оклюзійною пов’язкою.", "C — Circulation (циркуляція): знайти інші джерела кровотечі, не зупинені турнікетами; застосувати бандажі та гемостатики.", "H — Hypothermia / Head Injury (гіпотермія / травми голови): зберегти тепло, перевірити голову та свідомість людини."]}, {"h": "Призначення аптечки IFAK", "p": [], "ul": ["Зупинка кровотечі — турнікет, гемостатичні засоби, компресійні пов’язки.", "Прохідність дихальних шляхів — назофарингеальна трубка (застосовують фахівці зі спеціальною підготовкою).", "Допомога при ранах грудної клітки — оклюзійні пов’язки.", "Захист від інфекцій — медичні рукавички."]}, {"h": "Склад аптечки IFAK", "p": [], "ul": ["Турнікет — швидка зупинка сильної кровотечі з кінцівки.", "Компресійний бинт («ізраїльський бандаж») — накладання на рану й зупинка кровотечі.", "Гемостатичний засіб — прискорення зсідання крові.", "Назофарингеальна трубка — підтримка прохідності дихальних шляхів у разі непритомності.", "Оклюзійна пов’язка — закриття відкритих ран грудної клітки.", "Медичні рукавички — захист; жодних дій без рукавичок.", "Медичні ножиці — швидке розрізання одягу без ушкодження шкіри.", "Маркер — фіксація часу накладання турнікета.", "Термоковдра — запобігання гіпотермії."]}, {"h": "Чому аптечка має бути стандартною", "p": ["Усі IFAK мають бути однаково укомплектовані, щоб у стресовій ситуації рятувальник знав, де що лежить, і не втрачав дорогоцінні секунди. Лежачи біля пораненого, не буде часу розбиратися з неправильно складеною аптечкою."], "ul": []}], "f": "Літери MARCH — це перші літери англійських слів, і їхній порядок відображає, що загрожує життю найшвидше: першою завжди стоїть масивна кровотеча.", "pr": ["Запишіть розшифровку MARCH англійською та українською і до кожної літери додайте одне речення: що саме перевіряє або робить рятувальник.", "Складіть перелік складу IFAK у вигляді таблиці «Предмет — для чого — на якому кроці MARCH застосовується».", "Перевірте домашню або автомобільну аптечку вашої родини: запишіть, що в ній є, чого бракує порівняно з IFAK, і що варто докупити."], "q": ["Що можна робити в «червоній зоні», а що — лише в «жовтій»?", "Чому масивна кровотеча стоїть першою в алгоритмі MARCH?", "Для чого в аптечці маркер і термоковдра?", "Чому всі аптечки IFAK повинні бути укомплектовані однаково?"]}, {"n": "4", "t": "Огляд постраждалого / постраждалої. Ознаки критичної кровотечі", "g": "Уміти провести швидкий огляд постраждалого та розпізнати ознаки критичної кровотечі, щоб діяти швидко й рішуче.", "k": "", "terms": [["Швидкий огляд", "оцінка стану постраждалого за 15–30 секунд: дихання, свідомість, видимі травми, плями крові, пошкоджений одяг."], ["Пальпація", "обстеження тіла дотиком рук (у рукавичках) для виявлення прихованих ран і кровотечі."], ["Критична кровотеча", "кровотеча, яка без негайної зупинки може призвести до смерті за лічені хвилини."], ["Нітрилові рукавички", "медичні рукавички, що захищають рятувальника від контакту з кров’ю; найкраще — білого кольору."]], "th": [{"h": "Чому огляд — найважливіше", "p": ["Огляд постраждалого — перший пункт плану дій: якщо не знаєш, що з людиною, не зможеш їй допомогти. Людина з масивною кровотечею може померти за 3 хвилини — часу на роздуми немає.", "Кров лякає, але це лише симптом; справжня небезпека — бездіяльність. Страх перед кров’ю — нормальна реакція, яку можна подолати тренуванням. Небезпечну травму можна отримати будь-де, навіть у мирному житті."], "ul": []}, {"h": "Як проводити швидкий огляд", "p": [], "ul": ["Одягніть рукавички — на кожному етапі. Білі нітрилові краще за чорні: на них видно кров після пальпації.", "Оцініть дихання і чи при тямі людина.", "Пройдіться поглядом і руками по тілу «від голови до ніг»: великі плями крові, пошкоджений одяг, рани.", "Обов’язково перевірте взуття і стопи: взуття діє як «губка», вбирає багато крові і може приховати критичну кровотечу.", "Якщо людина при тямі — розмовляйте з нею під час огляду."]}, {"h": "Ознаки критичної кровотечі", "p": [], "ul": ["Пульсуюча кровотеча: кров б’є струменем у такт серцебиттю.", "Калюжа крові, що швидко збільшується під постраждалим.", "Одяг мокрий, просочений кров’ю.", "Втрата кінцівки або її частини."]}, {"h": "Від виявлення — до рішення", "p": ["Знайшовши критичну кровотечу на кінцівці, рятувальник має миттєво ухвалити рішення про її зупинку — турнікетом або іншим засобом. Як саме зупиняти кровотечу, вивчатимемо на наступних уроках."], "ul": []}], "f": "Звичайне взуття може ввібрати стільки крові, що критична кровотеча на стопі залишиться непомітною, — тому стопи перевіряють завжди, навіть якщо на перший погляд поранень там немає.", "pr": ["Складіть власну послідовність швидкого огляду «від голови до ніг» у вигляді пронумерованого списку (не менше 8 пунктів).", "Запишіть чотири ознаки критичної кровотечі і для кожної — як ви її розпізнаєте візуально.", "Подумки відпрацюйте ситуацію: на зупинці людина лежить на землі, під нею кров. Опишіть усно або письмово свої дії в перші 30 секунд, починаючи з оцінки безпеки."], "q": ["Скільки часу має тривати швидкий огляд і на що звертають увагу?", "Чому краще використовувати білі рукавички?", "Чому обов’язково перевіряють взуття?", "Назвіть ознаки критичної кровотечі.", "Як упоратися зі страхом при вигляді крові?"]}, {"n": "5", "t": "Способи зупинки масивної кровотечі: тампонування та турнікети", "g": "Розуміти принцип дії турнікета, знати види турнікетів і правила їх накладання на руку та ногу, а також коли застосовують турнікет, а коли — тампонування.", "k": "", "terms": [["Турнікет", "засіб для зупинки масивної кровотечі з кінцівки, що створює рівномірний тиск по колу кінцівки."], ["Циркулярний тиск", "рівномірний тиск по колу, за якого турнікет стискає м’язи, а вже вони — судини."], ["«High and Tight»", "правило «високо і туго»: у «червоній зоні» турнікет накладають якнайвище на кінцівку."], ["Вороток", "стрижень турнікета, обертанням якого затягують строп до зупинки кровотечі."], ["Вузлова кровотеча", "кровотеча з ділянки з’єднання кінцівки з тулубом (пах, пахва), де звичайний турнікет неефективний."]], "th": [{"h": "Як працює турнікет", "p": ["При критичній кровотечі людина може втратити смертельний об’єм крові менш ніж за 3 хвилини, тому турнікет — один із найважливіших елементів аптечки: він дає змогу виграти час до прибуття медиків.", "Існує міф, що турнікет притискає судину до кістки. Насправді спеціальна конструкція створює рівномірний тиск по колу, який стискає м’язи, а вони — судини. Турнікет може травмувати, але він рятує життя."], "ul": []}, {"h": "Види турнікетів", "p": [], "ul": ["Механічні для кінцівок: вороткові (сертифіковані TCCC — CAT, SOF, SAM) та храпові із зубчастим механізмом (TX2, TX3, RMT).", "Пневматичні для кінцівок — схожі на манжету тонометра; через громіздкість і вартість рідко входять до індивідуальних аптечок.", "Вузлові (наприклад, SAM-JT, JETT) — для кровотеч у паховій або пахвовій ділянці.", "Абдомінальні — застосовуються медиками при пораненнях живота з внутрішньою кровотечею."]}, {"h": "Сертифіковані засоби", "p": ["Використовуйте лише сертифіковані турнікети, рекомендовані Комітетом TCCC, — без саморобок і підробок. Їхнє виробництво жорстко контролюється: липучка не розклеїться, вороток не зламається, строп не порветься. В Україні державних стандартів для тестування турнікетів поки немає, тому важливо вміти відрізняти якісні засоби."], "ul": []}, {"h": "Правила накладання", "p": [], "ul": ["«Червона зона»: «High and Tight» — якнайвище на кінцівку.", "«Жовта зона»: прицільно — на 5–8 см вище поранення, але ніколи не на суглоб.", "Перед накладанням перевірте кишені: ключі, телефон та інші предмети можуть завадити або спричинити травму.", "Після затягування на стрічці часу фіксують час накладання."]}, {"h": "Основні кроки накладання на руку (навчальний турнікет CAT)", "p": [], "ul": ["Займіть безпечне положення (сядьте або ляжте).", "Розташуйте турнікет максимально високо на кінцівці і зробіть перший затяг — максимально щільний.", "Розташуйте платформу з воротком по центру зовнішнього боку руки, дотягніть строп і закріпіть його липучкою.", "Обертайте вороток, доки не зупиниться кровотеча і не зникне пульс нижче турнікета; зафіксуйте вороток у фіксаторі.", "Закріпіть залишок стропа і запишіть час на стрічці часу."]}, {"h": "Особливості накладання на ногу", "p": [], "ul": ["Перевірте кишені й приберіть сторонні предмети з-під турнікета.", "Розкрийте турнікет повністю, проведіть під ногою і рухами «пиляння» підтягніть якнайвище.", "Вороток розташовують по центру зовнішнього боку стегна (не біля паху й не під сідницею).", "Якщо накладаєте собі — після цього стабілізуйте положення тіла, щоб не впасти в разі непритомності."]}, {"h": "Безпека під час тренувань", "p": ["Турнікет на себе відпрацьовують лише під наглядом учителя і лише навчальним турнікетом. Тим, хто має проблеми із судинами (варикоз, тромбоз), цукровий діабет, свіжі травми чи інші протипоказання, турнікет на себе не накладають — вони тренуються на манекені."], "ul": ["Тривалість накладання — не більше 30 секунд; не затягувати до болю.", "Не більше 2–3 накладань на одну кінцівку за тренування, перерва між ними — не менше 5 хвилин.", "Оніміння, запаморочення, різкий біль, блідість чи синюшність пальців — негайно зняти турнікет і повідомити вчителя."]}], "f": "Від вузлових кровотеч гине кожен п’ятий поранений: такі рани в паху чи пахві неможливо перетиснути звичайним турнікетом для кінцівок, тому для них існують спеціальні вузлові турнікети.", "pr": ["Запишіть по пам’яті основні кроки накладання турнікета на руку та на ногу і підкресліть відмінності між ними.", "Поясніть письмово різницю між правилом «High and Tight» і прицільним накладанням: де, коли і чому застосовують кожне.", "Складіть пам’ятку «Як відрізнити сертифікований турнікет і чому саморобки небезпечні» (5–6 пунктів)."], "q": ["Як насправді турнікет зупиняє кровотечу?", "Чим вороткові турнікети відрізняються від храпових?", "Чому турнікет не можна накладати на суглоб?", "Що потрібно перевірити перед накладанням турнікета на ногу?", "Навіщо записувати час накладання турнікета?"]}, {"n": "6", "t": "Практикум. Відпрацювання огляду та зупинки кровотечі", "g": "Поєднати огляд постраждалого і накладання турнікета в єдиний послідовний алгоритм та довести дії до автоматизму.", "k": "", "terms": [["Протокол", "чітко встановлена послідовність дій, яку виконують неухильно, без імпровізації."], ["Автоматизм", "навичка, доведена тренуванням до рівня, коли її виконують швидко й правильно навіть у стресі."], ["Зворотний зв’язок «бутерброд»", "спосіб оцінки виконання: що вийшло добре — що треба виправити — що вийшло чудово."]], "th": [{"h": "Від окремих навичок — до алгоритму", "p": ["Протоколи, які ми вивчаємо, «написані кров’ю» десятків тисяч людей. Їх виконують послідовно та неухильно — тут немає місця для сумнівів чи імпровізації. Навіть невелика помилка в дотриманні протоколу може мати фатальні наслідки."], "ul": []}, {"h": "Алгоритм дій рятувальника", "p": [], "ul": ["Безпека: займіть безпечне положення, переконайтеся, що вам нічого не загрожує.", "Огляд: швидко оцініть ситуацію та постраждалого «від голови до ніг».", "Пошук кровотечі: знайдіть джерело масивної кровотечі (огляньте й під одягом).", "Рішення: ухваліть рішення про накладання турнікета.", "Дія: накладіть турнікет на руку чи ногу за вивченим алгоритмом і запишіть час."]}, {"h": "Як тренувати навичку", "p": [], "ul": ["Спочатку — спостерігати повну послідовність без коментарів.", "Потім — проговорювати кожен крок уголос (вербалізація допомагає запам’ятати).", "Далі — виконувати самостійно, а згодом — у парі.", "Ускладнення: виконання на час або коли «постраждалий» кричить чи заважає."]}, {"h": "Психологічна готовність", "p": ["Перед дією в стресі допомагають вивчені техніки: «Стоп-кадр», дихання з довгим видихом, короткі чіткі команди. Постійно розмовляйте з постраждалим — це заспокоює і його, і вас."], "ul": []}], "f": "", "pr": ["Складіть блок-схему «від огляду до турнікета» з п’яти кроків і до кожного кроку додайте типову помилку, якої слід уникати.", "Проговоріть уголос увесь алгоритм дій рятувальника, засікаючи час (без накладання турнікета). Повторіть кілька разів і запишіть, як змінювався час.", "Оцініть себе за принципом «бутерброда»: що у вас уже виходить добре, що потрібно покращити, чим ви пишаєтеся."], "q": ["Чому в протоколі недопустима імпровізація?", "Назвіть по порядку кроки дій рятувальника при масивній кровотечі.", "Навіщо проговорювати кожен крок уголос під час тренування?", "Як психологічно підготуватися до дій у стресовій ситуації?"]}, {"n": "7", "t": "Правила тампонування поранення", "g": "Розуміти, коли застосовують тампонування, знати його алгоритм (4Р) та правила особистої безпеки при роботі з кров’ю.", "k": "", "terms": [["Тампонування", "введення гемостатичного або звичайного бинта глибоко в рану для зупинки кровотечі зсередини завдяки тиску та зсіданню крові."], ["Прямий тиск", "сильне притискання рани (джерела кровотечі) руками для тимчасового зменшення чи зупинки кровотечі."], ["Power ball", "кулька, скручена з початку бинта, яку першою вводять у рану і притискають до ушкодженої судини."], ["Алгоритм 4Р", "послідовність тампонування: Peel (дістати), Push (ввести), Pile (залишити «грибочок»), Pressure (тиснути)."], ["Гемостатичний бинт", "одноразовий бинт, просочений речовиною (наприклад, каоліном або хітозаном), що прискорює зсідання крові."]], "th": [{"h": "Турнікет чи тампонування?", "p": ["«Турнікет рятує життя, а тампонування допомагає зберегти кінцівку». Турнікет — засіб екстреної зупинки масивної кровотечі з кінцівки: його накладають миттєво, навіть у «червоній зоні», за принципом «спочатку життя — потім кінцівка».", "Тампонування застосовують там, де турнікет неефективний або неможливий, — у паху, пахвовій ділянці, на шиї, — або коли кровотечу вже контрольовано. Воно зупиняє кровотечу, не припиняючи кровопостачання всієї кінцівки."], "ul": []}, {"h": "Підготовка та безпека", "p": [], "ul": ["За можливості зніміть обручки та інші металеві прикраси.", "Добирайте рукавички свого розміру: завеликі можна випадково затампонувати в рану, замалі — порвуться.", "Якщо маєте довгі рукави, натягуйте рукавички поверх них.", "Перед тампонуванням застосуйте прямий тиск, щоб послабити кровотечу."]}, {"h": "Алгоритм 4Р", "p": [], "ul": ["Peel — дістаньте бинт з упаковки, підготуйте його; скрутіть кінець у кульку (power ball).", "Push — знайдіть джерело кровотечі, введіть бинт у рану, притискаючи судину великими пальцями; щільно заповнюйте весь рановий канал, усі «кишені», не лише центр, а й краї.", "Pile — залиште над раною «грибочок» із бинта заввишки близько 2 см — опору для подальшого тиску.", "Pressure — тисніть на затампоновану рану обома руками: гемостатичний бинт — щонайменше 3 хвилини, звичайний — до 10 хвилин."]}, {"h": "Переоцінка", "p": [], "ul": ["Перевірте, чи зупинилася кровотеча і чи не потрібне додаткове тампонування або турнікет.", "Якщо гемостатичний бинт просочується зверху чи по краях — повністю витягніть його і затампонуйте новим: гемостатик одноразовий і після контакту з кров’ю більше не діє.", "Звичайний бинт можна спробувати дотампонувати.", "Якщо тампонування спрацювало — продовжуйте тиснути й накладіть тиснучу пов’язку («ізраїльський бандаж»)."]}, {"h": "Як безпечно зняти рукавички", "p": [], "ul": ["Знімайте якомога далі від інших людей і тримайте руки подалі від обличчя.", "Візьміться за першу рукавичку в зоні долоні, стягніть її й затисніть у кулаці другої руки.", "Пальцем піддягніть другу рукавичку зсередини й виверніть її, щоб вийшла «рукавичка в рукавичці».", "Викиньте їх у смітник, не торкаючись чужої крові шкірою."]}], "f": "Гемостатичні засоби бувають на основі каоліну (прискорює природне зсідання крові) і хітозану (утворює «клейку» масу, що склеює тканини).", "pr": ["Запишіть алгоритм 4Р: кожен етап англійською, українською та одним реченням — що саме робить рятувальник.", "Поясніть письмово фразу «Турнікет рятує життя, а тампонування допомагає зберегти кінцівку» і наведіть приклади ділянок тіла, де потрібне саме тампонування.", "Відпрацюйте вдома зі звичайними господарськими рукавичками безпечне зняття «рукавичка в рукавичці» і опишіть послідовність дій."], "q": ["Коли застосовують тампонування замість турнікета?", "Чому розмір рукавичок має значення?", "Скільки часу тримають тиск для гемостатичного і для звичайного бинта?", "Що робити, якщо гемостатичний бинт не зупинив кровотечу?", "Чому першим кроком перед тампонуванням є прямий тиск?"]}, {"n": "8", "t": "Бандажування та комплексний сценарій", "g": "Розуміти принцип бандажування, відмінність бандажа від тампонування й турнікета та вміти поєднувати огляд, тампонування і бандажування в одному сценарії.", "k": "", "terms": [["Бандажування", "накладання компресійної пов’язки, що підтримує тиск, створений тампонуванням, фіксує перев’язувальний матеріал і захищає рану."], ["Ізраїльський бандаж (The First Care Bandage)", "компресійна пов’язка з еластичним бинтом, вшитою подушечкою та аплікатором тиску, яку можна накласти однією рукою."], ["Аплікатор тиску", "вбудована дужка ізраїльського бандажа, що створює додатковий тиск безпосередньо над раною."], ["Ішемія", "зниження або припинення кровопостачання тканин, що спричиняє нестачу кисню та поживних речовин."]], "th": [{"h": "Тампонування і бандажування", "p": [], "ul": ["Тампонування — прямий тиск на джерело кровотечі.", "Бандажування — підтримка цього тиску, щоб звільнити руки для інших дій.", "Ніколи не накладайте бандаж замість тампонування, якщо воно необхідне.", "Кожна рана має бути затампонована, якщо це можливо, і забандажована, якщо це можливо.", "Компресійний бандаж підтримує тиск, а турнікет повністю зупиняє кровообіг у кінцівці — це різні засоби."]}, {"h": "Як накладають ізраїльський бандаж", "p": [], "ul": ["Дістаньте бандаж з упаковки.", "Прикладіть подушечку безпосередньо до затампонованої рани, повністю закривши її.", "Оберніть еластичний бинт навколо кінцівки один раз.", "Протягніть бинт через аплікатор і поверніть у протилежний бік, притискаючи аплікатор до подушечки.", "Щільно намотуйте бинт, повністю закриваючи краї подушечки, і закріпіть кінець кріпленням."]}, {"h": "Особливості різних ділянок тіла", "p": [], "ul": ["Кінцівка: бандаж після тампонування — стандартна процедура; при некритичній кровотечі він може бути й основним способом зупинки.", "Шия: потрібна особлива обережність — надмірний тиск може перетиснути дихальні шляхи або судини, що ведуть до мозку.", "Пахова ділянка: це вузлова зона, тут застосовують тампонування, а потім компресійну пов’язку; ортопедичні вироби (наприклад, для гриж) не забезпечують потрібної компресії."]}, {"h": "Перевірка циркуляції", "p": ["Після накладання пов’язки перевірте кровообіг нижче неї. Якщо шкіра холодна, синіє або німіє, а пульс не прощупується — пов’язку затягнуто надто сильно: її слід послабити й перев’язати. Ознаки ефективності: кровотечу зупинено, пульс і чутливість нижче пов’язки збережено (на шиї — дихання вільне)."], "ul": []}, {"h": "Комплексний сценарій", "p": ["Повний цикл допомоги при пораненні: огляд постраждалого — тампонування — накладання бандажа. Виконувати ці дії як частини єдиного протоколу — запорука впевнених дій у реальній стресовій ситуації."], "ul": []}], "f": "Аплікатор ізраїльського бандажа дає змогу створити тиск до 13,6 кг без жодних додаткових предметів.", "pr": ["Складіть порівняльну таблицю «Турнікет — тампонування — бандаж»: мета, коли застосовують, головні ризики.", "Запишіть по пам’яті кроки накладання ізраїльського бандажа і поясніть, навіщо потрібен аплікатор.", "Опишіть письмово, як перевірити, чи не затягнуто пов’язку надто сильно, і що робити в такому разі."], "q": ["Чим бандажування відрізняється від тампонування?", "Чому бандаж не можна накладати замість тампонування, коли воно необхідне?", "Яку небезпеку становить бандажування шиї?", "За якими ознаками визначають надмірне затягування пов’язки?"]}, {"n": "9", "t": "Контроль прохідності дихальних шляхів", "g": "Розуміти причини непрохідності дихальних шляхів, уміти оцінити дихання методом «Бачу — чую — відчуваю», знати техніку виведення щелепи та порядок переведення у стабільне бокове положення.", "k": "", "terms": [["Прохідність дихальних шляхів", "стан, за якого повітря вільно надходить у легені й виходить з них."], ["«Бачу — чую — відчуваю»", "техніка швидкої оцінки дихання: спостерігати рухи грудної клітки, слухати звуки дихання, відчувати рух повітря."], ["Виведення щелепи", "спосіб відкриття дихальних шляхів без руху шиї, який застосовують при підозрі на травму хребта."], ["Стабільне бокове положення", "положення на боці для непритомної людини, яка дихає; запобігає западанню язика й удушенню."], ["Геморагічний шок", "небезпечний для життя стан, що виникає внаслідок масивної та швидкої втрати крові."]], "th": [{"h": "Чому дихальні шляхи — наступний пріоритет", "p": ["Непрохідність дихальних шляхів — одна з найчастіших причин смерті на полі бою. Її можуть спричинити западання язика, кров, уламки, бруд, блювотні маси."], "ul": ["Блювота може бути ознакою тяжкої крововтрати: при геморагічному шоку організм перенаправляє кров до життєво важливих органів, і травна система страждає від нестачі кисню.", "Блювота з кров’ю — дуже серйозний симптом.", "Ознаки геморагічного шоку: бліда, холодна, спітніла шкіра; частий слабкий пульс; спрага, нудота; прискорене дихання; збудження або апатія."]}, {"h": "«Бачу — чую — відчуваю»", "p": [], "ul": ["Бачу: нахиліться над людиною і стежте за рухами грудної клітки та живота.", "Чую: наблизьте вухо до рота й носа, прислухайтеся до дихання; свист, хрипи, булькання вказують на перешкоду (кров, блювоту).", "Відчуваю: щокою або рукою відчуйте рух повітря з рота чи носа."]}, {"h": "Виведення щелепи", "p": ["Ця техніка — кращий вибір, якщо є підозра на травму шийного відділу хребта (після вибуху, ДТП, сильного удару): вона відкриває дихальні шляхи без руху шиї. Закидання голови з підняттям підборіддя теж відкриває дихальні шляхи, але може посилити травму хребта."], "ul": ["Станьте на коліна біля голови постраждалого.", "Розмістіть руки з обох боків нижньої щелепи, біля її кутів, під вухами; великі пальці — на підборідді.", "Обережно виведіть щелепу вперед, відводячи її від шиї; великими пальцями можна трохи опустити нижню губу.", "Утримуйте щелепу, доки не переконаєтеся, що дихальні шляхи прохідні."]}, {"h": "Навіщо стабільне бокове положення", "p": ["Правило: якщо людина знепритомніла, але дихає, — якнайшвидше переведіть її в стабільне бокове положення."], "ul": ["Запобігає западанню язика: у непритомної людини м’язи розслаблюються, і язик може перекрити горло.", "Забезпечує дренаж: кров чи блювотні маси вільно витікають і не потрапляють у дихальні шляхи.", "Стабільність: зігнуті кінцівки створюють опору, і людина не перевертається на спину до прибуття медиків."]}, {"h": "Чому на уроці немає назофарингеальної трубки", "p": ["Назофарингеальна трубка входить до аптечки IFAK, але її використання потребує спеціальних знань: неправильне введення може спричинити кровотечу чи інші тяжкі ушкодження, особливо при травмах голови. Тому учні опановують прості методи, які не зашкодять навіть за неідеального виконання, — оцінку дихання, виведення щелепи і стабільне бокове положення."], "ul": []}], "f": "У непритомної людини, яка лежить на спині, дихальні шляхи може повністю перекрити її власний язик, що западає через розслаблення м’язів, — тому бокове положення таке важливе.", "pr": ["Відпрацюйте з дорослим членом родини оцінку дихання «Бачу — чую — відчуваю» і переведення у стабільне бокове положення; письмово опишіть послідовність дій і що виявилося найскладнішим.", "Уявіть сценарій: людина знепритомніла після ДТП. Подумки прокрутіть і запишіть послідовність дій від оцінки безпеки до стабільного бокового положення, вказавши, коли застосуєте виведення щелепи.", "Складіть пам’ятку «Ознаки геморагічного шоку» (5–6 пунктів) і поясніть, чому блювота може свідчити про тяжку крововтрату."], "q": ["Що може спричинити непрохідність дихальних шляхів?", "Як виконують оцінку дихання «Бачу — чую — відчуваю»?", "Коли виведення щелепи краще за закидання голови?", "Назвіть три причини, чому стабільне бокове положення рятує життя.", "Чому учні не вчаться вводити назофарингеальну трубку?"]}]}, {"name": "Тренінг 6. Домедична допомога в умовах бою. Інформаційна війна", "lessons": [{"n": "1", "t": "Запобігання проблемам з органами дихання", "g": "Зрозуміти будову дихальної системи, що таке пневмоторакс і чому напружений пневмоторакс загрожує життю; знати, як розпізнати проникаюче поранення грудної клітки та як працює оклюзійна наліпка.", "k": "", "terms": [["Плевральна порожнина", "вузький простір між легенями й грудною стінкою, заповнений тонким шаром рідини; у ньому панує негативний тиск, який утримує легені розправленими."], ["Альвеоли", "мільйони крихітних повітряних мішечків, з яких складається легеня; вони не мають власних м’язів і розправляються завдяки роботі діафрагми та міжреберних м’язів."], ["Пневмоторакс", "стан, коли повітря потрапляє у плевральну порожнину, тиск вирівнюється й легеня спадається."], ["Напружений пневмоторакс", "найнебезпечніший вид пневмотораксу, коли рана діє як односторонній клапан: повітря заходить під час вдиху, але не виходить під час видиху."], ["Оклюзійна наліпка", "герметична пов’язка на проникаючу рану грудної клітки, яка не дає повітрю ззовні потрапляти всередину."]], "th": [{"h": "Літера R в алгоритмі MARCH", "p": ["Алгоритм MARCH визначає порядок допомоги пораненому: Massive bleeding (масивна кровотеча) → Airway (дихальні шляхи) → Respiration (дихання) → Circulation (кровообіг) → Hypothermia / Head injury (переохолодження / травма голови). Це заняття присвячене літері R — виявленню та усуненню проблем з диханням, зокрема проникаючих поранень грудної клітки, що можуть призвести до колапсу легень."], "ul": []}, {"h": "Як влаштовані легені та грудна порожнина", "p": ["Уявіть грудну клітку як герметичну коробку, що захищає легені. Легені вкриті оболонкою — плеврою. Між легенями та стінкою грудної клітки є дуже вузький простір — плевральна порожнина. Тиск у ній нижчий за атмосферний (негативний), тому він діє як «присоски»: не дає легеням спадатися і допомагає їм розширюватися під час вдиху.", "Легеня має «губчасту» структуру з альвеол. Вони не можуть розправлятися самостійно — це роблять діафрагма та міжреберні м’язи, які створюють негативний тиск."], "ul": []}, {"h": "Що таке пневмоторакс", "p": ["Під час проникаючого поранення грудної клітки герметичний простір ушкоджується. Повітря ззовні заходить у грудну порожнину і здавлює легеню — вона спадається, як проколотий м’яч. Без допомоги людина може швидко задихнутися."], "ul": ["Відкритий пневмоторакс — повітря вільно заходить і виходить через рану.", "Напружений пневмоторакс — рана працює як односторонній клапан: повітря накопичується, тиск наростає, здавлює легеню, зміщує серце та великі судини. Це спричиняє колапс легені та серцеву недостатність."]}, {"h": "Як виявити поранення грудної клітки", "p": ["Грудну клітку, живіт і спину оглядають дуже уважно, ковзними рухами кінчиків пальців обох рук, злегка розтягуючи й розгладжуючи шкіру. Так можна знайти навіть дрібні рани, які насправді можуть бути глибокими та проникаючими. Шукають і вхідні, і вихідні отвори."], "ul": []}, {"h": "Оклюзійна наліпка: принцип і порядок накладання", "p": ["Оклюзійна наліпка герметизує рану і не дає новому повітрю потрапляти всередину. Вентильована наліпка має клапан, що дозволяє зайвому повітрю виходити назовні."], "ul": ["Безпека: спершу — нітрилові рукавички.", "Огляд: знайти всі вхідні та вихідні отвори поранень.", "Очищення: швидко очистити рану та шкіру навколо.", "Накладання: повністю покрити рану, розгладжуючи наліпку від центру до країв, щоб забезпечити герметичність.", "Контроль: постійно стежити за станом. Якщо дихання погіршується, це може свідчити про напружений пневмоторакс: якщо наліпка звичайна (не вентильована), ненадовго відклеюють її край, щоб випустити повітря, і знову щільно приклеюють; постраждалого переводять у стабільне бокове положення, щоб полегшити дихання."]}, {"h": "Як правильно зняти рукавички", "p": ["Важливо уникнути контакту з кров’ю та іншими біологічними рідинами."], "ul": ["не торкайтеся обличчя;", "однією рукою візьміть рукавичку в зоні долоні й зніміть її, вивертаючи назовні;", "стисніть зняту рукавичку в кулаці;", "мізинцем іншої руки підчепіть другу рукавичку зсередини й зніміть так, щоб перша опинилася всередині другої;", "викиньте у спеціальний контейнер або смітник, обробіть руки антисептиком чи вимийте з милом."]}], "f": "Пневмоторакс буває не лише через поранення: існує й спонтанний пневмоторакс, який виникає без зовнішньої травми.", "pr": ["Намалюйте схему грудної клітки (легені, плевра, плевральна порожнина) і стрілками покажіть, як рухається повітря при відкритому та напруженому пневмотораксі.", "Уявіть стресову ситуацію з пораненням у груди й письмово опишіть по кроках свої дії: від надягання рукавичок до повторного огляду після накладання наліпки.", "Знайдіть інформацію про інші причини пневмотораксу (наприклад, спонтанний пневмоторакс) і підготуйте коротке повідомлення (5–7 речень)."], "q": ["Яку роль відіграє негативний тиск у плевральній порожнині?", "Чим відкритий пневмоторакс відрізняється від напруженого?", "Чому оклюзійну наліпку розгладжують від центру до країв?", "Що робити, якщо після накладання наліпки стан постраждалого погіршується?", "Чому грудну клітку оглядають ковзними рухами пальців, а не лише поглядом?"]}, {"n": "2", "t": "Зняття базових життєвих показників. Запобігання переохолодженню. Картка пораненого", "g": "Навчитися вимірювати пульс і розпізнавати ознаки шоку, розрізняти ступені переохолодження та знати, як його запобігти; розуміти, навіщо потрібна картка пораненого і як її заповнювати.", "k": "", "terms": [["Пульс", "поштовхи артерії, які відображають роботу серця; у дорослої людини в нормі 60–100 ударів за хвилину."], ["Брадикардія", "пульс менше ніж 60 ударів за хвилину."], ["Тахікардія", "пульс понад 100 ударів за хвилину."], ["Шок", "стан, коли тіло не отримує достатньо кисню."], ["Гіпотермія", "переохолодження — небезпечне зниження температури тіла."], ["Картка пораненого", "документ (DD Form 1380), у якому фіксують поранення, надану допомогу та стан людини для передачі медикам."]], "th": [{"h": "Пульс — повідомлення від серця", "p": ["Пульс шукають двома пальцями на зап’ясті (променева артерія) або на шиї (сонна артерія). Щоб швидко порахувати, діє «правило 15»: виміряйте кількість ударів за 15 секунд і помножте на 4. Якщо пульс неритмічний, рахують повну хвилину."], "ul": ["норма для дорослого — 60–100 ударів за хвилину;", "менше ніж 60 — брадикардія, більше ніж 100 — тахікардія."]}, {"h": "Червоні прапорці шоку", "p": ["Якщо ви бачите ці ознаки — негайно повідомляйте медиків."], "ul": ["зміни свідомості без черепно-мозкової травми;", "слабкий або відсутній пульс на зап’ясті (радіальний пульс)."]}, {"h": "Ступені переохолодження", "p": ["Переохолодження може статися навіть улітку, особливо якщо людина мокра."], "ul": ["Легке: людина тремтить, «гусяча шкіра», холодні руки.", "Середнє: мова стає повільною, людина апатична, пальці «дерев’яні».", "Важке: тремтіння зникає, людина може зомліти. Це дуже небезпечно!"]}, {"h": "Як запобігти переохолодженню", "p": ["Ворог № 1 — мокрий одяг. Термоковдру не кладуть на мокрий одяг: його треба зняти, якщо це безпечно. Якщо є підозра на травму голови — не рухайте постраждалого без нагальної потреби."], "ul": ["Підняти: підкласти під постраждалого щось тепле й сухе (каремат, плед, рюкзак) — ізолювати від землі.", "Загорнути: зняти мокрий одяг і повністю загорнути тіло в суху термоковдру, включно з головою та шиєю, залишивши обличчя відкритим; додати зігрівання, якщо є.", "Захистити: прикрити від вітру, дощу, бруду."]}, {"h": "Крововтрата і гіпотермія йдуть «рука в руку»", "p": ["Кров переносить не лише кисень, а й тепло — вона циркулює тілом і розносить його до всіх органів. Під час масивної кровотечі тіло швидко втрачає тепло, що призводить до шоку та гіпотермії навіть у теплу погоду. Тому зупинка кровотечі (літера M) і запобігання переохолодженню (літера H) завжди поруч."], "ul": []}, {"h": "Картка пораненого — «листок-рятівник»", "p": ["Картка — це ваша доповідь для медиків: вона передає всю важливу інформацію, коли вас уже немає поруч. Заповнюйте її просто й зрозуміло за абревіатурою ЧЩС. Під час передачі пораненого додають короткий усний звіт СІТ: Стабільний / Нестабільний, Травми, Лікування."], "ul": ["ЧАС — час поранення та час надання допомоги (зокрема час накладання турнікета);", "ЩО — що сталося і що ви зробили;", "СТАН — пульс, дихання, рівень свідомості."]}, {"h": "MARCH на практиці: приклад «Переохолоджений турист»", "p": ["Людина довго сидить на холодній землі, одяг мокрий, скаржиться на озноб і слабкість. Рятувальник перевіряє безпеку та викликає допомогу, далі: M — масивної кровотечі немає; A — людина розмовляє, дихальні шляхи прохідні; R — дихання рівне; C — пульс 110 (тахікардія); H — ізолює від землі, загортає в термоковдру, перевіряє пальці й обличчя. Наприкінці заповнює картку пораненого (час, що зроблено, стан)."], "ul": []}], "f": "", "pr": ["Виміряйте власний пульс за «правилом 15» у стані спокою та після 20 присідань. Запишіть результати й поясніть, чи вони в межах норми.", "Складіть для сценарію «ДТП на холоді» (сильна кровотеча зі стегна, людина скаржиться на холод і слабкість) послідовність дій за MARCH і заповніть умовну картку пораненого за схемою ЧЩС.", "Складіть перелік речей удома чи в рюкзаку, які можна використати як підручні засоби для ізоляції постраждалого від землі та холоду."], "q": ["Де і як знайти пульс? Що таке «правило 15»?", "Які ознаки свідчать про шок?", "Як відрізнити легке переохолодження від важкого?", "Чому не можна класти термоковдру на мокрий одяг?", "Що означає абревіатура ЧЩС у картці пораненого?"]}, {"n": "3", "t": "Цілі та завдання інформаційної війни", "g": "Зрозуміти, що таке інформаційна війна, які її головні цілі, навчитися розпізнавати приклади інформаційного впливу та критично ставитися до інформації.", "k": "", "terms": [["Інформаційна війна", "боротьба, у якій замість зброї використовують інформацію, щоб впливати на думки, почуття й поведінку людей і послабити противника."], ["Фейк", "неправдиве повідомлення, яке видають за правдиве."], ["Наратив", "історія або пояснення подій, які пропаганда системно нав’язує аудиторії."], ["Деморалізація", "підрив волі до боротьби та віри в перемогу."], ["Гібридна війна", "війна, у якій поєднуються воєнні дії з інформаційними, економічними, політичними та іншими засобами впливу."]], "th": [{"h": "Що таке інформаційна війна", "p": ["Інформаційна війна — це боротьба, у якій замість зброї використовують інформацію. Її мета — послабити противника не через бомби, а через брехню, маніпуляції, страх і сумнів. Вона є складовою гібридної війни, яку росія веде проти України."], "ul": []}, {"h": "Цілі інформаційної війни", "p": [], "ul": ["Послаблення супротивника — зниження його потенціалу.", "Деморалізація — підрив волі до боротьби та віри в перемогу серед військових і цивільних.", "Посилення власної сили — нав’язування вигідних агресору ідей і наративів.", "Зміна системи — у довгостроковій перспективі повна трансформація або зникнення системи супротивника і формування нової."]}, {"h": "Приклад 1. Кампанія «Злочини України проти дітей»", "p": ["Кремль поширює твердження, ніби Україна чинить злочини проти власних дітей. Цей наратив формувався з 2014 року, а особливої інтенсивності набув після того, як Міжнародний кримінальний суд видав ордер на арешт путіна за депортацію українських дітей; пік припав на 2024 рік. Мета — відвернути увагу від задокументованих фактів викрадення дітей, шокувати суспільство, дискредитувати Україну та зменшити міжнародну підтримку."], "ul": []}, {"h": "Приклад 2. Операції проти міжнародної підтримки України", "p": ["Протягом усієї повномасштабної війни росія поширює на міжнародних майданчиках і в медіа дезінформацію, щоб розколоти союзників, підірвати довіру до допомоги Україні та показати її як нестабільного, корумпованого партнера, який «не хоче миру». Мета — зменшити ресурси й допомогу Україні ззовні, посіяти страх, що Україна «залишиться сама», і отримати перевагу в переговорах."], "ul": []}, {"h": "Приклад 3. Наратив «нацизм в Україні» / «денацифікація»", "p": ["Від 2014 року кремль системно стверджує, що в Україні «нацистська» влада, яку треба «денацифікувати». Так агресію подають як «визвольну» операцію. Наприклад, операція Doppelgänger поширювала цей наратив через фальшиві сайти, що копіювали відомі ЗМІ. Мета — виправдати агресію, налякати міжнародну аудиторію, знецінити боротьбу українців і в перспективі витіснити українську ідентичність."], "ul": []}, {"h": "Як захищатися від маніпуляцій", "p": [], "ul": ["перевіряйте джерело: хто автор, чи є посилання на офіційні дані;", "зважайте на емоції: якщо повідомлення викликає сильний страх чи гнів — зупиніться й перевірте;", "шукайте підтвердження в кількох незалежних надійних джерелах;", "будьте обережні з «терміновими» пропозиціями виплат і проханнями ввести особисті дані;", "не поширюйте неперевірене — навіть «про всяк випадок»."]}], "f": "Фейк може вбивати так само, як зброя. Знання — це наша безпека.", "pr": ["Визначте, які з тверджень є фейками, і поясніть чому: 1) «Росіяни атакують енергооб’єкти з 24 лютого 2022 року, а відключення почалися лише в жовтні — отже, це змова енергокомпаній та уряду»; 2) «Електроенергії достатньо для всіх, просто влада продає її за кордон»; 3) «Державна служба України з етнополітики та свободи совісті визнала Київську митрополію УПЦ (МП) залежною від РПЦ»; 4) «До 15 вересня отримайте від Червоного Хреста 9600 грн, якщо не виїжджали з України 6 місяців — встигніть подати заявку». (Відповідь: фейки — 1, 2, 4; правдиве — 3.)", "Складіть «ТОП-5 правил інформаційної безпеки школяра / школярки».", "Знайдіть у соцмережах або новинах приклад повідомлення, яке, на вашу думку, має ознаки маніпуляції. Опишіть, на яку ціль інформаційної війни воно спрямоване."], "q": ["Що таке інформаційна війна і чому її називають складовою гібридної війни?", "Назвіть чотири цілі інформаційної війни.", "Яких цілей прагне росія, поширюючи наратив про «денацифікацію»?", "За якими ознаками можна запідозрити фейк?"]}, {"n": "4", "t": "Учасники інформаційної війни", "g": "Знати, хто бере участь в інформаційній війні, розрізняти офіційні й неофіційні джерела, відрізняти журналістів від пропагандистів та усвідомлювати роль кожного громадянина в протидії інформаційним атакам.", "k": "", "terms": [["Офіційне джерело", "орган влади, установа чи організація, що відповідає за поширену інформацію (наприклад, офіційні сторінки міністерств, Генштабу, СБУ)."], ["Пропагандист", "особа, яка цілеспрямовано поширює вигідні певній стороні ідеї, часто перекручуючи факти."], ["Лідер думок", "людина, до думки якої прислухається велика аудиторія (блогер, публічна особа)."], ["Бот", "автоматизований або фейковий акаунт, що масово поширює повідомлення чи коментарі."], ["Троль", "користувач, який навмисно провокує конфлікти й емоційні суперечки в мережі."]], "th": [{"h": "Основні учасники інформаційної війни", "p": [], "ul": ["держави та їхні спецслужби;", "медіа — офіційні українські та ворожі пропагандистські;", "блогери та лідери думок;", "боти і тролі;", "звичайні громадяни, які поширюють інформацію."]}, {"h": "Журналіст і пропагандист: у чому різниця", "p": ["Професійний журналіст перевіряє факти, посилається на джерела, подає різні точки зору й відокремлює факти від власних коментарів. Пропагандист обслуговує інтереси певної сторони: перекручує або вигадує факти, апелює до емоцій і не дає змоги перевірити інформацію."], "ul": []}, {"h": "Офіційні та неофіційні джерела", "p": ["Офіційні джерела відповідають за свої повідомлення. Анонімні канали, «інсайди» та пересилання без автора можуть бути як помилковими, так і навмисно створеними ворогом. Неофіційну інформацію варто перевіряти через офіційні джерела та якісні медіа."], "ul": []}, {"h": "Звичайна людина як учасник інформаційної війни", "p": ["Кожен користувач соцмереж може стати учасником інформаційної війни — свідомо чи несвідомо. Репост неперевіреної новини посилює фейк. Навіть правдива інформація під час війни не завжди безпечна: фото чи відео з місць влучань, позицій, пересування техніки можуть допомогти ворогу скоригувати удари."], "ul": ["не публікуйте фото й відео з фронту, наслідків обстрілів, роботи ППО;", "не поширюйте неперевірені новини;", "не вступайте в суперечки з ботами й тролями — це посилює їхні дописи."]}], "f": "", "pr": ["Оберіть одну роль (журналіст, бот, ворожий пропагандист, український військовий, пересічний громадянин) і напишіть від її імені коротке повідомлення та пояснення: яку інформацію ця роль поширює і з якою метою.", "Письмово дайте відповіді на питання: Як може вплинути на ситуацію публікація фото чи відео з фронту? Чи можна ненавмисно допомогти ворогу репостом або коментарем?", "Складіть схему «Учасники інформаційної війни» з прикладами для кожної групи."], "q": ["Хто є учасниками інформаційної війни?", "Чим професійний журналіст відрізняється від пропагандиста?", "Як звичайна людина може стати учасником інформаційної війни, навіть не бажаючи цього?", "Чи завжди публікація правдивої інформації є безпечною під час війни? Чому?"]}, {"n": "5–6", "t": "Методи інформаційної війни (пропаганда, дезінформація, кібератаки, психологічні операції, інформаційні операції)", "g": "Зрозуміти різницю між пропагандою та піаром на основі концепцій Е. Бернейса та П. Померанцева, знати шість журналістських стандартів і вміти класифікувати медіаповідомлення як журналістику, пропаганду чи піар.", "k": "", "terms": [["Піар", "за Бернейсом — «інженерія згоди»: формування позитивного ставлення до ідеї, продукту чи особи за допомогою достовірної, хоч і вибіркової інформації."], ["Пропаганда", "у розумінні Померанцева — діяльність, що прагне знищити довіру до будь-яких джерел, крім власних, і створити хаос, у якому люди перестають вірити в об’єктивну істину."], ["Дезінформація", "свідомо неправдива інформація, поширена з метою ввести аудиторію в оману."], ["Журналістські стандарти", "професійні правила, які допомагають відокремити якісну журналістику від маніпуляцій."], ["Інженерія згоди", "концепція Е. Бернейса про цілеспрямоване формування громадської думки."]], "th": [{"h": "Едвард Бернейс — «батько піару»", "p": ["Едварда Бернейса часто називають «батьком піару». Відомий приклад його роботи — просування сигарет серед жінок під гаслами фемінізму. У праці «Пропаганда» (1928) він описав концепцію «інженерії згоди». Бернейс також був залучений до подій, пов’язаних із переворотом у Гватемалі 1954 року, — це показує, що піар і пропаганда використовують ті самі засоби, але з різними мотивами."], "ul": []}, {"h": "Пітер Померанцев і сучасна пропаганда", "p": ["За Померанцевим (книжка «Це не пропаганда», 2019), сучасна пропаганда не намагається переконати в одній істині. Вона прагне створити хаос, розмити межу між правдою і брехнею, щоб люди перестали довіряти будь-кому. Вона продукує фейки, а потім сама ж їх спростовує, створюючи кругообіг брехні."], "ul": []}, {"h": "Піар і пропаганда: схожість і відмінності", "p": ["Схожість: обидва використовують емоції, символи, історії, авторитет і постійне повторення, щоб обійти критичне мислення.", "Відмінність: піар прагне переконати, але не заважає доступу до альтернативної інформації й зазвичай не будується на відкритій брехні. Пропаганда дезорієнтує, блокує критичне мислення і знищує можливість знайти та перевірити правду."], "ul": []}, {"h": "Інші методи інформаційної війни", "p": [], "ul": ["дезінформація — поширення свідомо неправдивих повідомлень;", "кібератаки — атаки на інформаційні системи, сайти, акаунти;", "психологічні операції — вплив на емоції, страхи й поведінку цільових груп;", "інформаційні операції — скоординовані кампанії з просування вигідних агресору наративів."]}, {"h": "Шість журналістських стандартів («Медіакомпас» ІМІ)", "p": ["Ці стандарти — фільтр, що допомагає відрізнити якісну журналістику від маніпуляцій."], "ul": ["достовірність;", "баланс думок;", "оперативність;", "відокремлення фактів від коментарів;", "повнота;", "точність."]}, {"h": "Як розрізнити жанри повідомлень", "p": [], "ul": ["Журналістика: факти з перевіреними джерелами, різні точки зору, точні цифри, факти відокремлені від оцінок.", "Пропаганда: вигадані або перекручені факти, сильні емоції, протиставлення «свої — чужі», узагальнення («усі», «завжди»), немає джерел.", "Піар: рекламний характер, лише позитив, недоліки оминаються, мета — сприятливе ставлення до компанії, фонду чи особи."]}], "f": "Один і той самий факт можна подати як журналістику, піар чи пропаганду — різниця в ставленні до правди та в тому, чи залишає автор вам можливість перевірити інформацію.", "pr": ["Класифікуйте повідомлення як «журналістика», «пропаганда» чи «піар» і обґрунтуйте вибір: а) «ВМС ЗСУ повідомили, що росіяни збили власний Су-30СМ; про це йдеться в офіційному повідомленні ВМС у Facebook»; б) «Усі українські військові вживають наркотики, щоб не відчувати страх — це видно на відео»; в) «Фонд передав позашляховик на фронт: військові дякують волонтерам за важливу допомогу»; г) «ТЦК забирають хворих, щоб виконати план НАТО — кажуть, що план спустили із Заходу».", "Порівняйте піар і пропаганду в таблиці: мета, ставлення до правди, доступ до альтернативної інформації, приклади.", "Сформулюйте власну стратегію свідомого споживання інформації (5–6 правил)."], "q": ["У чому принципова відмінність між піаром і пропагандою?", "Що таке «інженерія згоди»?", "Як Померанцев описує мету сучасної пропаганди?", "Назвіть шість журналістських стандартів.", "Які ознаки вказують, що повідомлення є пропагандою?"]}, {"n": "7–8", "t": "Роль критичного мислення в інформаційній війні. Вербування", "g": "Усвідомити роль медіаграмотності та критичного мислення в протидії вербуванню, знати методи та канали, якими росія вербує людей, зокрема підлітків, і чітко знати, що робити у разі спроби вербування.", "k": "", "terms": [["Вербування", "залучення людини до співпраці зі спецслужбами ворога, часто через обман, гроші чи шантаж."], ["Куратор", "представник ворожої спецслужби, який дистанційно дає завербованому завдання й контролює його."], ["Червоні прапорці", "ознаки в спілкуванні, які свідчать про можливу спробу маніпуляції або вербування."], ["Шантаж", "примушування людини до дій погрозами оприлюднити особисту інформацію чи фото."], ["Критичне мислення", "уміння аналізувати інформацію, перевіряти факти й робити висновки на їх основі, а не на здогадках."]], "th": [{"h": "Хто стає жертвою вербування", "p": ["Реальні справи, оприлюднені СБУ та Національною поліцією, показують: портрет завербованих часто неочевидний. Це не обов’язково маргінальні люди чи прихильники росії — серед них студенти, безробітні, мобілізовані, які залишили частину, і дуже часто неповнолітні. Під загрозою може опинитися кожен."], "ul": []}, {"h": "Типова схема: «легкі гроші» в Telegram", "p": ["У більшості справ людина потрапляла в поле зору ворожих спецслужб, коли шукала «швидкий» або «легкий» заробіток у Telegram-каналах. Спершу пропонують дрібні «завдання», а потім — збирати розвідувальні дані (фото місць влучань, координати енергооб’єктів, аеродромів, позицій ППО), підпалювати залізничне обладнання чи авто військових, доставляти «посилки»."], "ul": []}, {"h": "Ворог не цінує життя своїх агентів", "p": ["Російські спецслужби неодноразово планували дистанційно знищити власних виконавців разом із «посилкою», щоб позбутися свідків. Так, у лютому 2025 року на Харківщині 15-річного підлітка, завербованого через Telegram, використали як «кур’єра»: його вбили разом із військовим. 14-річну дівчину в Тернополі ворог шантажував її фото після злому телефона і також планував убити. Усі виконавці або загинули, або понесли відповідальність за законом."], "ul": []}, {"h": "Чому підлітки стають мішенню", "p": [], "ul": ["Маніпуляція через соцмережі: Telegram, TikTok, Discord; «завдання» подають як гру чи легкий заробіток, обіцяють, що «ніхто не дізнається»; координаторів маскують боти й псевдочати.", "Фінансова мотивація: 2–10 тис. грн можуть здаватися «великими грошима»; оплату часто ділять на частини, щоб тримати людину під контролем.", "Елемент «гри» або челенджу: неусвідомлення масштабу наслідків.", "Довірливість: низька медіаграмотність, переконування, що «об’єкт неважливий» чи «це допоможе Україні».", "Відсутність дорослої підтримки: батьки не знають, що дитина робить онлайн, а маніпулятори «дають увагу» та «значимість»."]}, {"h": "Червоні прапорці в онлайн-спілкуванні", "p": [], "ul": ["незнайомець пропонує легкі гроші за просте «завдання»;", "просять сфотографувати об’єкт, надіслати геолокацію чи щось передати;", "наполягають на анонімності й секретності;", "просять встановити застосунок, надіслати особисті фото чи дані;", "тиснуть, залякують або погрожують."]}, {"h": "Що робити, якщо вас намагаються завербувати", "p": [], "ul":
