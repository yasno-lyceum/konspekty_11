<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конспекти · Захист України · 11 клас</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = [{"id": "zu11", "name": "Захист України · 11 клас", "short": "Захист України 11", "themes": [{"name": "Тренінг 1 (частина 1). Військові технології та їх розвиток", "lessons": [{"n": "3", "t": "Безпілотні (роботизовані) системи. БпЛА: види та призначення. Сфери застосування БпЛА", "g": "Ти дізнаєшся, які бувають безпілотні системи (повітряні, наземні, надводні, підводні), де їх застосовують у військовій і цивільній сферах і чому Україна стала одним із лідерів у розвитку цих технологій.", "k": "", "terms": [["Безпілотна (роботизована) система", "комплекс, що включає безпілотний апарат (повітряний, наземний чи морський) та наземну станцію керування, яка дає змогу керувати ним дистанційно або автономно без людини на борту."], ["Безпілотний апарат (дрон)", "рухомий апарат, що працює без водія чи пілота на борту; може мати дистанційне керування або бути автономним і самостійно орієнтуватися за допомогою сенсорів."], ["БпЛА", "безпілотний літальний апарат — найпоширеніший тип безпілотних систем."], ["UGV (Unmanned Ground Vehicle)", "наземна безпілотна платформа, що рухається по землі."], ["USV / UUV", "надводний (Unmanned Surface Vehicle) та підводний (Unmanned Underwater Vehicle) безпілотні апарати."], ["Сили безпілотних систем (СБС)", "окремий рід сил у Збройних Силах України, створений у 2024 році, що системно об'єднує повітряні, наземні та морські дрони."]], "th": [{"h": "Чому дрони змінили сучасний світ", "p": ["Безпілотні (роботизовані) системи, зокрема безпілотні літальні апарати (БпЛА), або дрони, стали частиною сучасного життя, і їх розвиток сьогодні дуже стрімкий. Їх застосовують і в армії, і в звичайному житті.", "Україна — одна з країн, де ці технології розвиваються найактивніше. Безпілотні системи в Україні змінюють хід сучасної війни, тому їх часто називають «очима та руками» сучасної армії."], "ul": []}, {"h": "Види безпілотних (роботизованих) систем", "p": ["Безпілотні системи можуть діяти в повітрі, на землі, на воді та під водою."], "ul": ["Повітряні (БпЛА) — найпоширеніший тип. Використовуються для розвідки, коригування вогню, спостереження, доставки вантажів. Український приклад — розвідувальний БпЛА «Лелека-100» (компанія DeViRo), створений для аеророзвідки, патрулювання та картографування місцевості з передаванням інформації і координат у режимі реального часу.", "Наземні (UGV) — платформи, що рухаються по землі. Використовуються для евакуації поранених, розмінування, доставки вантажів. Український приклад — гусеничний роботизований комплекс TerMIT, що може перевозити до 300 кг вантажу, евакуювати поранених і працювати автономно або під дистанційним керуванням.", "Надводні (USV) та підводні (UUV) — дистанційно керовані катери, човни чи підводні апарати для морської розвідки та атак. Українські морські дрони Sea Baby (розробка СБУ) та Magura V5 (розробка для ГУР МО України) неодноразово вражали російські кораблі в Чорному морі."]}, {"h": "Історична довідка", "p": ["Ідея створення безпілотних літальних апаратів виникла ще під час Першої світової війни.", "В Україні інтерес до безпілотників значно зріс після 2014 року, а пік розвитку припав на 2022–2024 роки. Шлях пройшов від розрізнених розробок до створення окремого роду сил у ЗСУ — Сил безпілотних систем (2024 рік). Україна стала першою країною у світі, що створила окремий рід сил, який системно інтегрує повітряні, наземні та морські дрони."], "ul": []}, {"h": "Класифікація БпЛА за призначенням", "p": ["Більшість технологій спочатку створювали для військових цілей, але тепер їх широко використовують і в цивільній сфері. Порівняй пари «військове / цивільне» призначення:"], "ul": ["розвідка, спостереження, цілевказання / аерозйомка, відеозйомка;", "ударні операції / логістика, доставка товарів;", "коригування артилерії / сільське господарство (моніторинг полів);", "радіоелектронна боротьба / пошук і порятунок людей;", "розмінування / моніторинг екології та інфраструктури."]}, {"h": "Сфери застосування", "p": [], "ul": ["Кіноіндустрія, телебачення, журналістика — зйомка з повітря.", "Аграрний сектор — обробка полів, контроль посівів.", "Пошуково-рятувальні операції, моніторинг пожеж.", "Логістика — доставка медикаментів і гуманітарних вантажів.", "Військова сфера — розвідка, спостереження, зв'язок, наведення артилерії, логістика, ураження цілей."]}, {"h": "Висновок", "p": ["Технології, які колись здавалися фантастикою, сьогодні рятують життя та допомагають здобувати перемогу. Розвиток роботизованих систем і українські інновації — важливий чинник обороноздатності держави."], "ul": []}], "f": "Україна стала першою країною у світі, що створила окремий рід сил — Сили безпілотних систем, який системно об'єднує повітряні, наземні та морські дрони.", "pr": ["Підготуй коротку довідку (5–6 речень) про один тип безпілотної системи: повітряну, наземну, надводну або підводну.", "Знайди інформацію про один український БпЛА («Лелека-100», «Punisher», «Shark» тощо): для чого його створено і як застосовують.", "Склади таблицю з двох колонок «Військове застосування / Цивільне застосування» і впиши щонайменше по 4 приклади в кожну."], "q": ["Що таке безпілотна (роботизована) система і з яких частин вона складається?", "Назви чотири види безпілотних систем і наведи по одному прикладу.", "Коли виникла ідея створення БпЛА і коли в ЗСУ з'явилися Сили безпілотних систем?", "Наведи три приклади цивільного застосування дронів.", "Чому дрони називають «очима та руками» сучасної армії?"]}, {"n": "4", "t": "Основні складові конструкції та технічні параметри БпЛА", "g": "Ти дізнаєшся, з яких основних частин складається безпілотник, як кожна з них впливає на політ, які технічні параметри важливі для виконання завдань і як безпечно поводитися з Li-Po акумуляторами.", "k": "", "terms": [["Польотний контролер (FC)", "«мозок» дрона: отримує дані від оператора, сенсорів і GPS та відповідно до алгоритмів надсилає команди регуляторам швидкості."], ["ESC (Electronic Speed Controller)", "електронний регулятор швидкості, що контролює оберти двигуна; зв'язок між «мозком» і «м'язами» дрона."], ["Корисне навантаження (Payload)", "максимальна вага, яку дрон може підняти додатково до власної ваги (вантаж, обладнання)."], ["Li-Po акумулятор", "літій-полімерна батарея з високою енергетичною щільністю, що потребує суворих правил заряджання та зберігання."], ["VTOL", "безпілотники, здатні злітати та сідати вертикально (Vertical Take-Off and Landing)."], ["ТТХ", "тактико-технічні характеристики — набір параметрів, що визначають можливості апарата."]], "th": [{"h": "Класифікація БпЛА за конструкцією", "p": [], "ul": ["Літаки (Fixed-Wing): моноплани (один набір крил — найпоширеніший тип), біплани (два набори крил одне над одним), триплани (три набори), дельтоподібні (крила трикутної форми).", "Мультироторні: створюють підйомну силу роторами (пропелерами) — квадрокоптери (4 ротори), гексакоптери (6), октокоптери (8).", "Гібридні: поєднують переваги літаків і мультироторів; наприклад, тейлсіттери мають ротори для вертикального зльоту й посадки та крила для горизонтального польоту.", "VTOL: апарати, що можуть злітати й сідати вертикально; до цієї категорії належать і деякі гібридні."]}, {"h": "Як літають дрони різних типів", "p": ["БпЛА літакового типу працює за принципом аеродинаміки, як звичайний літак: крило має спеціальний профіль, і під час швидкого руху вперед над крилом і під ним виникає різниця тисків, яка створює підйомну силу. Швидкість забезпечують гвинтові або реактивні двигуни. Така конструкція дає змогу здійснювати тривалі польоти на великі відстані.", "Мультироторний дрон має два і більше гвинтів і відносно просте керування. Найпоширеніший — квадрокоптер із хрестоподібним корпусом і роторами на кінцях. Одна пара пропелерів обертається в одному напрямку, інша — у протилежному: це врівноважує обертальний момент, тож дрону не потрібен хвостовий гвинт, як гелікоптеру. Змінюючи швидкість обертання окремих гвинтів, дрон рухається в потрібному напрямку."], "ul": []}, {"h": "Основні компоненти дрона роторного типу", "p": ["Щоб легше запам'ятати, користуйся аналогіями: рама — «скелет», контролер — «мозок», ESC — «нервова система», мотори — «м'язи»."], "ul": ["Рама (Frame) — основа, до якої кріпляться всі елементи; матеріал (карбон, пластик) впливає на вагу та міцність.", "Двигуни / мотори (Motors) — силова установка, що обертає пропелери.", "Пропелери (Propellers) — створюють підйомну силу; мають маркування та визначений напрямок обертання.", "Електронний регулятор швидкості (ESC) — контролює оберти двигунів.", "Польотний контролер (FC) — «мозок» дрона.", "Радіоприймач (RX) — отримує сигнали з пульта і передає їх на польотний контролер.", "Камера та відеопередавач (VTX) — знімають і транслюють відео.", "Антени — щонайменше дві: радіоприймача (RX) і відеопередавача (VTX).", "Акумулятор (Battery) — джерело живлення; характеризується типом (Li-Po, Li-Ion), ємністю (mAh) і напругою (S).", "Додаткове обладнання — GPS-модуль, підвіс-стабілізатор (гімбал)."]}, {"h": "Безпека під час роботи з Li-Po батареями", "p": ["Li-Po батареї небезпечні через ризик загоряння, вибуху та витоку електроліту внаслідок перезаряджання, фізичного пошкодження, перегріву або короткого замикання. Основні правила:"], "ul": ["Ніколи не заряджай і не використовуй пошкоджені батареї.", "Заряджай лише в спеціальному захисному пакеті, далеко від легкозаймистих матеріалів і вогню.", "Не перевищуй максимальну напругу; припиняй заряджання, якщо батарея перегрівається.", "Ніколи не залишай батарею без нагляду під час заряджання і не залишай її підключеною після повного заряджання."]}, {"h": "Критичні технічні характеристики", "p": [], "ul": ["Максимальна дальність зв'язку (Range), км/м — відстань, на якій можливе стабільне керування.", "Час польоту (Flight Time), хв — скільки дрон може провести в повітрі на одному заряді.", "Корисне навантаження (Payload), кг/г — максимальна додаткова вага, яку дрон може підняти.", "Максимальна швидкість, км/год — дає змогу швидко виконати завдання.", "Ємність акумулятора, мА·год (mAh) — запас енергії, що визначає час польоту.", "Напруга акумулятора (S) — кількість комірок (наприклад, 6S), що визначає потужність."]}, {"h": "Приклад аналізу ТТХ: Emax Tiny Hawk", "p": ["Дальність зв'язку — до 200 м; час польоту — до 4 хв; максимальна швидкість — до 56 км/год; ємність акумулятора — 450 мА·год; напруга — 1S (3,7 В).", "Висновок: це компактні FPV-квадрокоптери, призначені для тренувань і гонок. Оператор БпЛА планує завдання, спираючись саме на такі параметри, тому технічна грамотність — обов'язкова навичка."], "ul": []}], "f": "Квадрокоптеру не потрібен хвостовий гвинт, як у гелікоптера: пари його пропелерів обертаються в протилежних напрямках і взаємно врівноважують обертальний момент.", "pr": ["Створи інфографіку або схему «Будова дрона» з підписами основних компонентів і їхніх функцій.", "Розв'яжи кейс «Аналіз місії»: дрон має пролетіти 15 км і повернутися за 25 хвилин. Які мінімальні дальність і час польоту потрібні? Який компонент відповідає за кожен із цих параметрів (дальність — модуль зв'язку, час — акумулятор)?", "Підготуй коротке повідомлення про особливості Li-Po акумуляторів і три ключові правила їхньої безпечної експлуатації та зберігання."], "q": ["Назви чотири типи БпЛА за конструкцією.", "Яку функцію виконує польотний контролер, а яку — ESC?", "Чому в квадрокоптера пропелери обертаються в різних напрямках?", "Які параметри визначають, скільки часу дрон може перебувати в повітрі?", "Назви три правила безпечного поводження з Li-Po батареями."]}, {"n": "5", "t": "Основні властивості та моделі БпЛА (мультиротори, FPV, крила)", "g": "Ти навчишся розрізняти класичні мультиротори, FPV-дрони та дрони літакового типу, розумітимеш їхні переваги й недоліки та зможеш обґрунтувати, який тип дрона підходить для певного завдання; ознайомишся з успішними українськими моделями.", "k": "", "terms": [["Мультиротор", "дрон із кількома роторами (квадрокоптер, гексакоптер), що може вертикально злітати, сідати й «висіти» на місці."], ["FPV (First Person View)", "режим керування «від першої особи»: оператор бачить відео з камери дрона в реальному часі в окулярах або на моніторі."], ["Фікс-вінг (Fixed-Wing)", "дрон літакового типу з нерухомим крилом, призначений для тривалих польотів на великі відстані."], ["Гімбал", "стабілізатор камери, що дає змогу отримувати чітке й плавне відео навіть під час руху дрона."], ["РЕБ", "радіоелектронна боротьба — засоби, які можуть глушити сигнали керування та навігації дронів."]], "th": [{"h": "Правильний інструмент під конкретне завдання", "p": ["Не існує «найкращого дрона взагалі» — кожен тип має свої сильні й слабкі сторони. Квадрокоптер зі швидкістю 60 км/год не підходить для розвідки на відстані 70 км — це завдання для «крила». Знання переваг моделі = правильний вибір інструменту = успіх місії."], "ul": []}, {"h": "Класичний мультиротор (квадрокоптер / гексакоптер)", "p": [], "ul": ["Особливості конструкції: вертикальний зліт і посадка, GPS-стабілізація, часто складана рама, якісна камера на гімбалі.", "Переваги: простота керування, висока стабілізація, можливість «висіти» на місці, оперативна розвідка.", "Застосування: розвідка, коригування вогню, картографування, пошуково-рятувальні роботи.", "Український приклад — Vampire: великий гексакоптер (6 роторів) із корисним навантаженням до 15 кг, дальністю польоту до 20 км і тривалістю польоту до 45 хв. Стійкий до РЕБ, працює вдень і вночі, має режим самостійного повернення в разі втрати зв'язку. Окрім бойових завдань, його використовували для гуманітарних місій — доставки води, їжі та медикаментів людям, відрізаним після російського теракту на дамбі Каховської ГЕС."]}, {"h": "FPV-дрон", "p": ["Оператор керує FPV-дроном через пульт і бачить відеопотік у реальному часі — ніби керує гоночним автомобілем. Завдяки цьому керування дуже точне."], "ul": ["Особливості конструкції: легка мінімалістична карбонова рама, потужні мотори, часто без GPS-стабілізації.", "Переваги: висока швидкість і маневреність, низька вартість.", "Недоліки: короткий час польоту, вразливість до засобів РЕБ, складне керування.", "Застосування: розвідка в складних умовах, коригування вогню, ураження цілей.", "За способом керування бувають FPV-дрони з радіокеруванням (найпоширеніші, вразливі до РЕБ) та з керуванням через оптоволокно (для зон із потужним РЕБ).", "Сучасні системи можуть доповнювати ручне керування елементами автоматизації на основі комп'ютерного зору.", "Серед лідерів українського виробництва FPV-дронів — компанії Vyriy Drone та «Генерал Черешня»."]}, {"h": "Дрон літакового типу (Fixed-Wing)", "p": [], "ul": ["Особливості конструкції: крило (моноплан або «літаюче крило»), запуск із катапульти чи з руки, висока аеродинамічна ефективність.", "Переваги: велика дальність (100 км і більше), тривалість польоту (години), висока крейсерська швидкість.", "Недоліки: потребує запуску, менш маневрений на малій висоті, не може «висіти» на місці.", "Застосування: глибока розвідка, стратегічне спостереження, ретрансляція зв'язку.", "Український приклад — «Лелека-100» (DeViRo), прийнятий на озброєння ЗСУ в травні 2021 року. Має малу візуальну, акустичну та радіолокаційну помітність, перебуває в повітрі до 4 годин, крейсерська швидкість — 60–70 км/год, гарантована довжина маршруту — 100 км, злітна маса — близько 5 кг, приземлення — на парашуті або «на живіт»."]}, {"h": "Як вибрати тип дрона для завдання", "p": [], "ul": ["Тривале спостереження на великій відстані → дрон літакового типу (дальність, тривалість польоту завдяки аеродинаміці крила).", "Швидке завдання на малій відстані, де важливі маневреність і швидкість → FPV-дрон.", "Оперативний огляд місцевості з якісним стабільним зображенням → класичний мультиротор (стабілізація, швидкий зліт і посадка, просте керування)."]}, {"h": "Ключові твердження", "p": [], "ul": ["Мультиротор підходить для оперативної розвідки та коригування, бо може висіти на місці.", "FPV-дрон дає високу швидкість і маневреність, але має короткий час польоту й уразливий до РЕБ.", "Фікс-вінг забезпечує далекі польоти й тривалість, але потребує запуску й має меншу маневреність на малій висоті.", "Li-Po батареї мають високу енергетичну щільність, але потребують суворих правил заряджання та зберігання.", "Технічна грамотність оператора — це не лише вміння керувати, а й розуміння обмежень системи, правил безпеки та морально-правових аспектів її застосування."]}], "f": "Для опанування базових навичок керування гексакоптером Vampire, за даними Міністерства оборони України, достатньо близько трьох годин навчання.", "pr": ["Склади порівняльну таблицю «Мультиротор / FPV / фікс-вінг» за критеріями: ціна, безпека оператора, швидкість, час польоту, дальність, маневреність.", "Розв'яжи кейси «Обери дрон для місії» й обґрунтуй вибір через конструкцію та ТТХ: а) тривале (2 год) спостереження на відстані 50 км; б) швидкий огляд населеного пункту за 5 км із поверненням; в) доставка гуманітарної допомоги в складних умовах.", "Підготуй коротке повідомлення (до 1 хв) про один український БпЛА, наголосивши на його унікальній ролі."], "q": ["Чим відрізняються класичний мультиротор, FPV-дрон і дрон літакового типу за конструкцією?", "Які переваги та недоліки має FPV-дрон?", "Чому для тривалої розвідки на великі відстані обирають дрони-літаки?", "Який параметр (час польоту, дальність, корисне навантаження, стійкість до РЕБ) ти вважаєш найважливішим для розвідки і чому?", "Наведи приклади українських БпЛА та їхнього застосування."]}, {"n": "6", "t": "Симулятори та тренажери для підготовки операторів БпЛА", "g": "Ти зрозумієш, чому навчання пілотування починають із симулятора, ознайомишся з основними симуляторами, дізнаєшся, як підключити й відкалібрувати пульт керування та що означає стандарт керування Mode 2.", "k": "", "terms": [["Симулятор БпЛА", "комп'ютерна програма, що відтворює фізику польоту дрона й дає змогу тренуватися без ризику пошкодити обладнання."], ["М'язова пам'ять", "здатність виконувати правильні рухи (наприклад, стіками пульта) автоматично, не замислюючись, що формується багаторазовим повторенням."], ["Mode 2", "найпоширеніший стандарт розташування функцій на стіках пульта: лівий стік — газ і розвертання, правий — тангаж і крен."], ["Калібрування", "процес, під час якого симулятор «дізнається» мінімальні, максимальні та центральні значення кожного стіка."], ["OSD (On Screen Display)", "інформація, яку пілот бачить на екрані під час польоту: напруга батареї, час польоту, кут нахилу, якість зв'язку."], ["RSSI", "показник якості (сили) радіосигналу між пультом і дроном."]], "th": [{"h": "Навіщо потрібен симулятор", "p": ["Керувати FPV-дроном складніше, ніж класичним квадрокоптером: часто немає GPS-стабілізації, тож потрібне постійне ручне керування. Справжній дрон — дороге обладнання, і кожна помилка в реальному польоті означає втрату грошей і часу.", "Симулятор — це полігон, де помилка нічого не коштує. Краще зробити сотні «крашів» у симуляторі, щоб не допустити жодного в реальному польоті."], "ul": ["Безпека — нульовий ризик пошкодити обладнання чи травмуватися.", "Економія — десятки годин практики без витрат на ремонт і акумулятори.", "Швидкість навчання — можна відпрацьовувати складні маневри, «розбиватися» й миттєво починати знову.", "Формування м'язової пам'яті — руки починають робити правильні рухи автоматично."]}, {"h": "Огляд симуляторів", "p": [], "ul": ["Velocidrone — найбільш реалістичний для FPV-перегонів; точна фізика, підтримка багатьох моделей дронів.", "Liftoff — баланс між реалізмом і зручністю для початківців; гарна графіка, багато віртуальних карт.", "DRL Sim (Drone Racing League) — спортивні перегони, орієнтований на високу швидкість та складні маневри.", "Симулятори для класичних коптерів (DJI) — опанування основних режимів польоту (GPS-режим, Attitude Mode) та орієнтації; фокус на стабільності й простоті."]}, {"h": "Що потрібно для тренувань", "p": [], "ul": ["Комп'ютер або ноутбук зі встановленим симулятором.", "Пульт керування (Transmitter) — основний інструмент оператора.", "Кабель (USB-C, Micro USB або спеціалізований) для підключення пульта до комп'ютера."]}, {"h": "Режим стіків Mode 2", "p": ["Mode 2 — поширений стандарт пілотування, тому його варто опанувати досконало."], "ul": ["Лівий стік: Throttle (газ — висота) і Yaw (розвертання навколо своєї осі).", "Правий стік: Pitch (тангаж — рух уперед/назад) і Roll (крен — рух уліво/вправо)."]}, {"h": "Підключення та налаштування пульта в симуляторі", "p": [], "ul": ["Підключи пульт до комп'ютера USB-кабелем і дочекайся, доки система розпізнає його як ігровий контролер.", "Запусти симулятор і знайди меню налаштувань («Controls», «Settings» або «Controller»); вибери свій пульт зі списку пристроїв.", "Виконай калібрування: за інструкціями на екрані переміщуй усі стіки в повний діапазон руху, щоб симулятор запам'ятав мінімальні, максимальні та центральні значення.", "Признач канали керування: Pitch, Roll, Yaw, Throttle.", "Протестуй: рухи пульта мають збігатися з відображенням на екрані.", "Збережи конфігурацію, щоб не втратити налаштування після закриття програми."]}, {"h": "Інтерфейс симулятора", "p": [], "ul": ["OSD — на екрані відображаються напруга батареї, час польоту, кут нахилу, RSSI (якість зв'язку).", "Кут нахилу камери (Angle / Tilt): що більший кут, то швидший політ.", "Вибір сцени: на початку обирай відкриті сцени без перешкод.", "Перший віртуальний зліт: «увімкнення» моторів дрона (Arming — зазвичай комбінація рухів стіків), плавне збільшення газу лівим стіком, спроба утримати дрон на одній висоті й у одному положенні (найскладніше для новачка), прості рухи вперед/назад і повороти."]}], "f": "Симулятор вимагає такої самої дисципліни, як і реальний політ: головне в ньому — відпрацювати плавний контроль газу (Throttle) і точне центрування стіків.", "pr": ["Схематично намалюй пульт керування та підпиши функції обох стіків у режимі Mode 2.", "Поясни письмово різницю між Arming і Disarming дрона та чому важливо контролювати цей стан.", "Склади власний чек-лист (5–6 пунктів) підключення й налаштування пульта в симуляторі."], "q": ["Чому навчання пілотування не починають одразу з реального дрона?", "Назви три симулятори та їхні особливості.", "Які функції виконують лівий і правий стіки в Mode 2?", "Для чого потрібне калібрування пульта?", "Які параметри OSD, крім часу польоту, найважливіші для пілота і чому?"]}, {"n": "7–8", "t": "Базові вправи на симуляторі для мультироторних БпЛА", "g": "Ти дізнаєшся про режими стабілізації (Angle, Horizon, Acro), опануєш принципи базових вправ у симуляторі — вертикальний зліт і посадку, ховерінг, політ по прямокутнику, розвороти — та навчишся помічати типові помилки початківців.", "k": "", "terms": [["Angle Mode", "стабілізований режим, у якому дрон автоматично вирівнюється після відпускання стіків; рекомендований для початку навчання."], ["Horizon Mode", "режим часткового вирівнювання, що дозволяє невеликі перевороти."], ["Acro Mode", "повністю ручний (акробатичний) режим без автоматичного вирівнювання."], ["Ховерінг", "утримання дрона на сталій висоті та в одній позиції без зміщення."], ["Точка відриву", "положення газу, за якого тяга дорівнює вазі дрона і він починає відриватися від землі."]], "th": [{"h": "Мета тренувань", "p": ["Якщо навчитися точно керувати дроном у симуляторі, то в реальному польоті вже не доведеться думати — лише діяти. Завдання базових вправ — перетворити свідомі рухи на автоматичні рефлекси. Головний принцип: «повільно і точно» — на початку плавність важливіша за швидкість."], "ul": []}, {"h": "Режими стабілізації", "p": [], "ul": ["Angle Mode (Stabilized): дрон сам вирівнюється, щойно відпускаєш стіки.", "Horizon Mode: часткове вирівнювання, дозволяє невеликі перевороти.", "Acro Mode: повністю ручне керування — дрон не вирівнюється самостійно.", "Навчання починають в Angle Mode, а до Acro переходять поступово, після кількох годин практики."]}, {"h": "Вправа 1. Вертикальний зліт і посадка", "p": [], "ul": ["Мета: опанувати газ (Throttle) — плавний рух лівим стіком.", "Завдання: плавно підняти дрон на висоту 2–3 метри, утримати близько 10 секунд і м'яко посадити. Повторити 10 разів.", "Ключ: знайти «точку відриву», коли тяга дорівнює вазі дрона.", "Типові помилки: різкі рухи газом — коливання або «зрив» із висоти."]}, {"h": "Вправа 2. Ховерінг (утримання висоти та позиції)", "p": [], "ul": ["Мета: навчитися центрувати стіки й виконувати мінімальні корекції.", "Завдання: утримувати дрон у межах віртуального квадрата 1×1 м протягом 10 секунд.", "Ключ: робота правого стіка (Pitch / Roll), мікрокорекції замість різких рухів, баланс лівої та правої руки.", "Типова помилка: «качання маятника» — надмірні корекції, що розгойдують дрон."]}, {"h": "Вправа 3. Політ по прямокутнику та розвороти", "p": [], "ul": ["Мета: розвинути просторову орієнтацію та координацію обох стіків (Throttle / Yaw / Pitch / Roll).", "Завдання: пролетіти вперед, уліво, назад і вправо, зберігаючи сталу висоту.", "Ключ: тримати сталу висоту газом; на прямих використовувати Pitch / Roll, у кутах — Yaw; перед кутом зменшувати Pitch.", "Додатково: висіти на місці й плавно розвертатися на 90°, 180°, 360°, не втрачаючи висоти.", "Типові помилки: зміщення висоти, занос по інерції, невчасне гальмування, втрата висоти під час розворотів."]}, {"h": "Головна порада", "p": ["Завжди коригуй рух до того, як дрон почне падати або сильно відхилиться. Реагуй на «намір» дрона, а не на наслідок. Найбільшої концентрації вимагає стік газу (Throttle)."], "ul": []}], "f": "", "pr": ["Склади план-алгоритм із 5 кроків для виконання вправи «Політ по прямокутнику» в Angle Mode.", "Якщо маєш доступ до симулятора (Velocidrone, Liftoff або інший), виконай в Angle Mode вправи «Зліт — ховерінг 10 секунд — посадка» (10 повторів) і запиши, які помилки траплялися найчастіше.", "Порівняй письмово Angle, Horizon та Acro Mode: як поводиться дрон, коли відпускаєш стіки, і для кого підходить кожен режим."], "q": ["Яка головна відмінність у керуванні між Angle Mode та Acro Mode?", "Чому навчання починають саме в стабілізованому режимі?", "Який стік найважливіший для вертикального зльоту, а який — для утримання позиції?", "Яка вправа критично важлива для формування просторової орієнтації пілота?", "Які помилки найчастіше роблять новачки під час зльоту, посадки та ховерінгу?"]}]}, {"name": "Тренінг 1 (частина 2). Військові технології та їх розвиток", "lessons": [{"n": "1–2", "t": "Навігація та орієнтування в симуляторі", "g": "Знати, як координувати три осі керування дроном (Roll, Pitch, Yaw) для плавних маневрів «розворот на місці», «Орбіта» та «Вісімка», і розуміти, як тренування в симуляторі розвиває просторове мислення.", "k": "", "terms": [["Ховерінг", "утримання дрона в повітрі на сталій висоті й у незмінній позиції (стіки в нейтральному положенні)."], ["Roll (крен)", "нахил дрона ліворуч або праворуч навколо поздовжньої осі; керується правим стіком уліво/вправо й відповідає за бічний рух."], ["Pitch (тангаж)", "нахил дрона вперед або назад; керується правим стіком уперед/назад і відповідає за рух уперед чи назад."], ["Yaw (розвертання)", "обертання дрона навколо вертикальної осі; керується лівим стіком уліво/вправо й змінює напрямок «носа» дрона."], ["Throttle (газ)", "керування тягою моторів лівим стіком уперед/назад, від якого залежить висота польоту."], ["Angle Mode", "режим стабілізації, у якому дрон автоматично вирівнюється, коли пілот відпускає стіки; зручний для початківців."]], "th": [{"h": "Від ховерінгу до навігації", "p": ["Уміння стабільно «висіти» на місці — лише перший крок. Навігація — це не просто політ уперед, а вміння рухатися точно й плавно, обходити перешкоди та маневрувати.", "Під час простих вправ (наприклад, політ по прямокутнику) Yaw використовують лише на поворотах. У вправах на навігацію Yaw працює постійно й узгоджено з іншими осями — це і є координований рух."], "ul": []}, {"h": "Розвороти на місці (Yaw Turns)", "p": ["Мета вправи — освоїти керування Yaw, не втрачаючи висоти й позиції."], "ul": ["Дрон піднімають на стабільну висоту (близько 3 м) і утримують у ховерінгу.", "Плавним рухом лівого стіка вбік запускають обертання навколо вертикальної осі; правий стік (Pitch/Roll) залишається точно в центрі.", "Швидке обертання може спричинити невелике просідання висоти, тому потрібні мінімальні корекції газу.", "Розвороти виконують «чвертями» — на 90°, 180°, 270°, 360°, щоразу зупиняючись і фіксуючи нову позицію.", "Типова помилка — різке падіння чи підйом висоти під час розвороту або зміщення дрона замість чистого обертання."]}, {"h": "Вправа «Орбіта»", "p": ["«Орбіта» — політ по колу навколо обраного об'єкта (стовпа, дерева, прапора) зі сталою швидкістю та радіусом. В основі — принцип «постійної точки фокуса»: «ніс» дрона весь час спрямований на центр кола."], "ul": ["Roll (правий стік) відповідає за рух по колу.", "Yaw (лівий стік) одночасно й у тому самому напрямку утримує «ніс» дрона спрямованим до об'єкта.", "Газом підтримують сталу висоту.", "Типова помилка — «занос», коли дрон рухається боком через недостатню компенсацію Yaw.", "Вправу повторюють в обидва боки."]}, {"h": "Політ «Вісімкою»", "p": ["«Вісімка» — це дві «Орбіти» в протилежних напрямках, що перетинаються. Вона вважається однією з найкращих вправ для розвитку координації, бо вимагає постійно перемикатися між протилежними кренами й керувати інерцією."], "ul": ["Після першого півкола в точці перетину дрон вирівнюють (стіки в центр) і плавно ведуть уперед.", "Перед зміною напрямку дрон трохи пригальмовують, а потім синхронно змінюють Roll і Yaw на протилежний бік.", "Типові помилки — «занос» на поворотах і втрата висоти в точці перетину через невчасну корекцію газу."]}, {"h": "Кут нахилу камери та користь симулятора", "p": ["Кут нахилу камери (Angle, або Tilt) впливає на те, як пілот бачить простір: що більший нахил, то сильніше дрон має нахилитися вперед, щоб камера дивилася прямо, — і то швидше він летить.", "Симулятор дає змогу безпечно й без витрат відпрацювати координацію обох рук і просторову орієнтацію, необхідні для реальних польотів у складних умовах. Порада досвідчених пілотів: «Завжди будьте на крок попереду й керуйте наміром, а не наслідком»."], "ul": []}], "f": "FPV означає First Person View — «вид від першої особи»: пілот бачить політ через камеру дрона в окулярах або на екрані, ніби сам перебуває в кабіні.", "pr": ["Склади короткий план-алгоритм (5 кроків) для виконання вправи «Орбіта» в Angle Mode.", "Намалюй схему вправи «Вісімка» і стрілками познач, де і в який бік рухаються лівий та правий стіки, а де дрон вирівнюють.", "Поясни письмово, чому «Орбіта» корисна для спостереження за об'єктом."], "q": ["Які два рухи стіками потрібно синхронізувати для виконання координованого повороту?", "Що означає принцип «постійної точки фокуса» у вправі «Орбіта»?", "Чому «Вісімка» вважається однією з найкращих вправ для розвитку координації?", "Як кут нахилу камери пов'язаний зі швидкістю дрона?", "Які типові помилки виникають під час розвороту на місці та як їх уникнути?"]}, {"n": "3–4", "t": "Основи пілотування FPV-дронів у симуляторі", "g": "Розуміти принцип повного ручного керування в Acro Mode, роль керування газом та інерції, знати техніку проходження воріт, суть базових фігур і алгоритм контрольованої екстреної посадки.", "k": "", "terms": [["Acro Mode", "режим повного ручного керування без автоматичного вирівнювання: дрон зберігає нахил, доки пілот сам його не виправить."], ["Throttle Management", "уміння керувати газом так, щоб компенсувати кут нахилу дрона й силу тяжіння та зберігати потрібну висоту."], ["Гейт (ворота)", "навчальна перешкода-отвір, крізь яку пролітає дрон; у реальних умовах їй відповідають вікна, двері, проміжки між гілками."], ["Фліп і ролл", "базові акробатичні фігури — повний переворот дрона відповідно через «ніс» (за Pitch) або через бік (за Roll)."], ["Екстрена посадка", "швидке, але контрольоване приземлення дрона в критичній ситуації (втрата зв'язку чи відео, низький заряд, відмова мотора)."]], "th": [{"h": "Acro Mode: повна свобода й повна відповідальність", "p": ["В Acro Mode немає жодної автоматики — руки пілота стають «стабілізатором». Якщо дрон нахилився, він залишиться в такому положенні, доки пілот не зробить зворотний рух стіком.", "Під час великого нахилу частина тяги йде на рух уперед чи вбік, тому для збереження висоти газ треба додавати, а не скидати. Через інерцію дрон продовжує рух і після завершення маневру — це треба враховувати під час входу в поворот і виходу з нього."], "ul": []}, {"h": "Проходження воріт", "p": ["Ця вправа тренує точність і контроль швидкості під час прольоту вузьких отворів. Мета — ввести дрон у контрольований нахил перед перешкодою й вирівняти його одразу після прольоту."], "ul": ["Перед воротами зменшують газ, щоб сповільнитися.", "Pitch використовують для руху вперед, Roll — для бічної корекції; нахил має бути мінімальним, але достатнім.", "Дивляться не на самі ворота, а за них — на наступну ціль, щоб мозок заздалегідь планував вирівнювання.", "Типові помилки: надто висока швидкість (пілот не встигає відреагувати) і надто великий нахил (дрон зачіпає раму воріт).", "Правило: спочатку точність, потім швидкість — починати з великих воріт і літати повільно."]}, {"h": "Базові фігури: фліп і ролл", "p": ["Фігури демонструють повну свободу Acro Mode й лежать в основі багатьох маневрів, наприклад швидкого розвороту чи ухилення. Їх виконують на безпечній висоті (5–7 м).", "Головне в обох фігурах — керування газом: якщо не скинути газ на початку перевороту, дрон неконтрольовано «вистрілить» угору; якщо не додати газ після перевороту — впаде. Після повного оберту стік потрібно одразу повернути в центр і вирівняти дрон."], "ul": []}, {"h": "Екстрена посадка", "p": ["Ця вправа тренує рефлекс і дисципліну пілота в критичній ситуації (втрата зв'язку, відмова мотора, радіоелектронне глушіння). Мета — контрольоване приземлення, а не падіння."], "ul": ["Перша реакція — вирівняти дрон горизонтально (стіки Roll/Pitch у центр), щоб отримати максимальну тягу.", "Швидкий спуск: різко зменшити газ, але не до нуля, щоб зберегти контроль над моторами.", "На висоті 1–2 м плавно додати газ для м'якого приземлення."]}, {"h": "Чому важлива багаторазова практика", "p": ["Реакції в екстрених ситуаціях мають бути автоматичними. Їх напрацьовують лише багаторазовим повторенням: кожна аварія в симуляторі — це сигнал повторити вправу, а не привід зупинитися. Типові помилки початківців — різке «кидання» стіків, що спричиняє коливання, і невміння вирівняти дрон після маневру."], "ul": []}], "f": "Симулятор дозволяє «розбити» дрон сотні разів без жодних витрат — тому навіть досвідчені пілоти відпрацьовують нові маневри спершу віртуально.", "pr": ["Порівняй у таблиці Angle Mode та Acro Mode за критеріями: автоматичне вирівнювання, складність, свобода маневру, для кого підходить.", "Запиши алгоритм контрольованої екстреної посадки (3–4 кроки) і поясни, навіщо потрібен кожен крок.", "Поясни письмово, чому під час проходження воріт варто дивитися не на ворота, а за них."], "q": ["Що повинен зробити пілот, коли бачить, що дрон нахилився в Acro Mode?", "Чому під час великого нахилу для збереження висоти потрібно додавати газ?", "Що станеться, якщо під час фліпа не скинути газ? А якщо не додати його після перевороту?", "Чим екстрена посадка відрізняється від планової?", "Що важливіше під час навчання проходженню воріт — швидкість чи точність? Чому?"]}, {"n": "5", "t": "Правила польоту, заборонені зони та юридичні аспекти. Відпрацювання практичних навичок на симуляторі", "g": "Знати, хто регулює використання повітряного простору України, що таке заборонені та обмежені зони, і розуміти юридичну відповідальність оператора дрона, особливо в умовах воєнного стану.", "k": "", "terms": [["Державна авіаційна служба України (ДАСУ)", "державний орган, відповідальний за регулювання використання повітряного простору України."], ["БпЛА", "безпілотний літальний апарат — літальний апарат, яким керують дистанційно або який виконує політ автономно, без пілота на борту."], ["NFZ (No-Fly Zone, заборонена зона)", "територія, польоти над якою суворо заборонені завжди."], ["R-зона (Restricted Zone, зона обмеження)", "територія, польоти в якій можливі лише за попереднього узгодження."], ["Дружній вогонь", "ураження своїми силами (наприклад, ППО) власного чи невпізнаного апарата через відсутність координації."]], "th": [{"h": "Свобода в небі не є абсолютною", "p": ["Навіть у зоні бойових дій діють закони й протоколи. Крім РЕБ і ворожого вогню, для дрона існує ще один серйозний ризик, особливо в тилу, — «дружній вогонь» і юридична відповідальність. Падіння дрона на важливий цивільний чи військовий об'єкт може призвести не до «крашу» в симуляторі, а до кримінальної справи."], "ul": []}, {"h": "Законодавча база", "p": ["В Україні за використання повітряного простору відповідає Державна авіаційна служба України. Основний документ — Повітряний кодекс України."], "ul": ["Наказ ДАСУ та Міністерства оборони України від 11.05.2018 № 430/210 «Про затвердження Авіаційних правил України «Правила використання повітряного простору України»».", "Наказ Міністерства оборони України від 08.12.2016 № 661 «Про затвердження Правил виконання польотів безпілотними авіаційними комплексами державної авіації України».", "Наказ Міністерства оборони України від 02.05.2025 № 282 щодо змін з окремих питань використання безпілотних авіаційних комплексів.", "В умовах воєнного стану, згідно з рішеннями Кабінету Міністрів і Генерального штабу, польоти цивільних БпЛА на більшій частині території України заборонені без спеціального дозволу."]}, {"h": "Заборонені та обмежені зони", "p": ["Заборонені зони (NFZ) і зони обмеження (R-зони) позначають на картах повітряного простору; ДАСУ публікує карту організації повітряного простору України."], "ul": ["Критична інфраструктура: атомні електростанції, ГЕС, об'єкти енергосистеми.", "Державні та військові об'єкти: резиденції вищих посадових осіб, військові частини, полігони, аеропорти й цивільні аеродроми.", "Служби безпеки мають право збивати будь-який несанкціонований об'єкт у забороненій зоні.", "R-зони — наприклад, над масовими заходами або тимчасові обмеження через навчання: польоти лише за узгодженням."]}, {"h": "Правила для військових операторів", "p": ["Оператори дронів у складі ЗСУ та інших сил оборони діють за наказом і спеціальними протоколами. Проте знання загальних обмежень обов'язкове й для них: це допомагає планувати маршрут так, щоб не перешкоджати армійській і цивільній авіації та уникнути інцидентів із власною ППО."], "ul": []}, {"h": "Юридична відповідальність", "p": [], "ul": ["Адміністративна — штрафи за порушення правил використання повітряного простору.", "Кримінальна — якщо дії створили загрозу безпеці, були пов'язані зі збиранням конфіденційної інформації (шпигунством) або спричинили тяжкі наслідки.", "Оператор несе повну відповідальність за апарат, яким керує."]}, {"h": "Планування маршруту з обходом заборонених зон", "p": ["Під час тренування в симуляторі умовні заборонені зони позначають на карті, а маршрут планують так, щоб плавно обійти їх за допомогою навігаційних маневрів (розворотів, «Орбіти», «Вісімки»). У разі порушення діє правило: негайно вирівняти дрон і вийти із зони. Дотримання протоколу зберігає апарат і захищає від юридичних наслідків."], "ul": []}], "f": "", "pr": ["Склади список із 5 найкритичніших об'єктів, які згідно з українським законодавством завжди є забороненими зонами для польотів, і поясни, чому кожен із них потребує захисту.", "Знайди в ЗМІ один приклад юридичної відповідальності (штрафу чи затримання) за порушення правил польоту БпЛА в Україні та коротко опиши його причину.", "Намалюй умовну схему місцевості з двома забороненими зонами та проклади маршрут дрона від старту до точки спостереження й назад, що їх обходить."], "q": ["Який орган в Україні відповідає за регулювання використання повітряного простору?", "Що таке NFZ і які об'єкти до неї належать?", "Чим зона обмеження (R-зона) відрізняється від забороненої зони?", "Які дії оператора дрона можуть призвести до кримінальної відповідальності?", "Чому військовому операторові необхідно знати цивільні обмеження?"]}, {"n": "6", "t": "Безпека експлуатації БпЛА та екстрені ситуації. Метеорологічні фактори та їх вплив на політ. Відпрацювання практичних навичок у симуляторі", "g": "Знати порядок передпольотної перевірки, принцип роботи FailSafe, правила безпечного поводження з LiPo-акумуляторами та вміти оцінювати вплив погоди на рішення про політ.", "k": "", "terms": [["Arming Checklist", "чек-лист передпольотної перевірки дрона, який виконують перед кожним польотом."], ["FailSafe", "запрограмована реакція польотного контролера дрона на втрату сигналу з пульта."], ["LiPo-акумулятор", "літій-полімерний акумулятор — легке й потужне джерело живлення дронів, що потребує обережного поводження."], ["Термічний розгін", "некерований процес самонагрівання пошкодженого акумулятора, що може призвести до займання й виділення токсичного диму."], ["RSSI", "показник рівня (якості) радіосигналу між пультом і приймачем дрона."]], "th": [{"h": "Ціна нехтування безпекою", "p": ["FPV-дрон — швидкий і потужний апарат. Недбале поводження з ним загрожує не лише обладнанню, а й людям поруч (через пожежу акумулятора) та виконанню завдання (через втрату зв'язку). Тому безпека тримається на трьох складових: дисципліні (передпольотна перевірка), рефлексі (FailSafe і контрольована посадка) та аналізі (погода)."], "ul": []}, {"h": "Передпольотна перевірка (Arming Checklist)", "p": ["Перевірку виконують завжди в одній послідовності, у три блоки."], "ul": ["Фізична перевірка: рама без тріщин і люфтів, цілі й правильно встановлені пропелери, мотори обертаються вільно, кабелі не перетерті й не зачіпають пропелери, об'єктив камери чистий, камера закріплена.", "Живлення й електроніка: акумулятор без здуття та пошкоджень (зі здуттям — використання заборонено), напруга відповідає нормі, акумулятор надійно закріплений, відеопередавач не перегрітий, антена приєднана.", "Програмна перевірка й безпека: пульт увімкнений, рівень сигналу (RSSI) в нормі, усі канали реагують, тумблери в правильному положенні, FailSafe працює, погода придатна для польоту.", "Фінальний крок: у зоні старту немає сторонніх людей і тварин; дрон активують лише тоді, коли він на безпечній відстані (від 3 м)."]}, {"h": "FailSafe: що відбувається при втраті зв'язку", "p": ["FailSafe — це заздалегідь налаштована реакція дрона на втрату сигналу з пульта. У військових FPV-дронах його часто налаштовують на миттєве вимкнення двигунів, щоб апарат не полетів неконтрольовано в бік цивільних об'єктів.", "Головне правило — не панікувати. Якщо дрон близько, варто спробувати відновити зв'язок; якщо далеко — прийняти факт втрати. Будь-яка екстрена посадка має бути контрольованою, а не вільним падінням."], "ul": []}, {"h": "Пожежна безпека LiPo-акумуляторів", "p": [], "ul": ["Пошкоджений (проколотий, здутий, перегрітий) акумулятор може загорітися з виділенням токсичного диму.", "Зберігати акумулятори в спеціальному вогнетривкому пакеті (LiPo Bag) або ємності.", "Не заряджати без нагляду й не використовувати пошкоджені акумулятори.", "У разі загоряння: відійти на безпечну відстань, не вдихати дим, викликати рятувальників (101); для гасіння, за рекомендацією джерела, використовують пісок або спеціальний вогнегасник, а не воду."]}, {"h": "Метеорологічні фактори", "p": [], "ul": ["Зустрічний вітер («у ніс») збільшує витрату енергії й зменшує час польоту.", "Попутний вітер («у хвіст») економить енергію, але різко знижує керованість — дрон може «нести».", "Бічний вітер ускладнює навігацію й вимагає постійної корекції креном.", "Дощ — ризик короткого замикання; туман — втрата видимості й погіршення відеосигналу; низькі температури знижують ефективність LiPo-акумулятора.", "Приклад: за вітру 10 м/с летіти на максимальну дальність не варто через підвищену витрату заряду."]}], "f": "Холод помітно зменшує ємність LiPo-акумуляторів, тому взимку час польоту дрона скорочується навіть за ідеальної техніки пілотування.", "pr": ["Створи власний Arming Checklist (щонайменше 10 пунктів) у вигляді таблиці з колонками «Перевірка» та «Статус (ОК / Ні)», поділений на три блоки: фізична перевірка, програмна перевірка, безпека та погода.", "Запиши алгоритм дій оператора (5 кроків) у разі команди «Втрата зв'язку!».", "Знайди прогноз погоди для свого регіону на завтра (12:00): визнач швидкість і напрямок вітру, наявність опадів чи туману та обґрунтуй, чи доцільно летіти на максимальну дальність."], "q": ["Які три блоки входять до передпольотної перевірки?", "Що таке FailSafe і навіщо його налаштовують?", "У чому найбільша небезпека пошкодженого LiPo-акумулятора і як правильно його зберігати?", "Чим попутний вітер відрізняється від зустрічного для FPV-дрона?", "Як дощ, туман і низька температура впливають на політ?"]}, {"n": "7–8", "t": "Відпрацювання практичних навичок на симуляторі. Перевірка навичок пілотування FPV-дронів у симуляторі. Кваліфікаційний забіг", "g": "Узагальнити навички, здобуті на попередніх заняттях, і знати, з яких елементів складається кваліфікаційний забіг та за якими критеріями оцінюють пілотування.", "k": "", "terms": [["Кваліфікаційний забіг", "підсумкова перевірка навичок пілотування на єдиній трасі, що містить усі опрацьовані елементи."], ["Траса", "заздалегідь підготовлений маршрут у симуляторі з воротами, об'єктами для «Орбіти» та простором для фігур."], ["«Краш»", "аварія (зіткнення чи падіння) дрона, за яку в забігу нараховують штрафні бали."], ["Плавність пілотування", "м'які, неривкі рухи стіків, за яких політ не «смиканий»."]], "th": [{"h": "Що перевіряє кваліфікаційний забіг", "p": ["Забіг показує рівень готовності до керування справжнім дроном. Його виконують в Acro Mode, мета — точність і плавність усіх елементів. Кожна аварія — це втрата часу й балів."], "ul": []}, {"h": "Склад траси (≈ 3 хв на учасника)", "p": [], "ul": ["Зліт в Acro Mode і ховерінг (3 с).", "Навігаційний маневр — «Орбіта» або «Вісімка».", "Точність — проліт двох воріт.", "Маневр — фліп або ролл.", "Критичний рефлекс — за командою «Критичне падіння!», яка може прозвучати будь-якої миті, виконати екстрену посадку."]}, {"h": "Критерії оцінювання", "p": [], "ul": ["Зліт і посадка: плавний зліт, м'яка контрольована посадка.", "Ховерінг: утримання позиції (± 1 м) без сильних коливань газу.", "Політ по прямокутнику: збереження висоти, чіткі розвороти.", "«Орбіта» / «Вісімка»: хоча б одна плавна петля (перевірка координації Yaw).", "Проходження воріт: проліт двох воріт без зіткнень.", "Базові фігури: контрольований фліп або ролл із подальшим вирівнюванням.", "Екстрена посадка: миттєва реакція й контрольований спуск — цей елемент має найбільшу вагу.", "Загальна плавність: м'які рухи стіків."]}, {"h": "Типові проблеми та як їх виправляти", "p": ["Найчастіше труднощі виникають із компенсацією газу під час фліпа, втратою висоти в центрі «Вісімки» та «заносом» в «Орбіті». Найважчими зазвичай є маневри, коли дрон летить «на пілота», — тут допомагає регулярне відпрацювання «Орбіти» та «Вісімки».", "Учитися можна й на чужих помилках: спостереження за траєкторією інших пілотів допомагає помітити неточності, які важко побачити у власному польоті."], "ul": []}], "f": "", "pr": ["Склади для себе чек-лист самооцінки за критеріями кваліфікаційного забігу та чесно оціни, які елементи ти вже знаєш добре, а які потребують повторення.", "Опиши послідовність елементів кваліфікаційного забігу і для кожного назви одну типову помилку та спосіб її уникнути.", "Поясни письмово, чому реакції на екстрену посадку присвоюють найбільшу кількість балів."], "q": ["Які елементи входять до кваліфікаційного забігу?", "Який елемент забігу вимагає найбільшої координації стіків?", "Яка вправа перевіряє здатність керувати дроном, коли він летить «на вас»?", "Що потрібно зробити за командою «Критичне падіння!»?"]}]}, {"name": "Тренінг 1 (частина 3). Військові технології та їх розвиток", "lessons": [{"n": "1–6", "t": "Базові вправи на FPV-дронах (практика)", "g": "Знати, чим керування реальним FPV-дроном відрізняється від симулятора, правила безпеки на полігоні та протокол роботи пари «пілот — споттер»; розуміти значення плавного керування газом (Throttle) для стабільного польоту й м'якої посадки.", "k": "", "terms": [["FPV-дрон", "безпілотний літальний апарат, яким пілот керує «від першої особи», бачачи зображення з камери дрона в окулярах або на екрані."], ["Споттер", "напарник-спостерігач пілота, який стежить за реальним повітряним простором, людьми, перешкодами, часом польоту та станом акумулятора."], ["Throttle (газ)", "керування вертикальною тягою дрона; від плавності роботи газом залежать стабільний підйом, утримання висоти та м'яка посадка."], ["Ховерінг", "утримання дрона в одній точці повітряного простору на сталій висоті."], ["Arming / Disarming", "активація двигунів дрона перед польотом / дезактивація двигунів, яку обов'язково виконують до відключення акумулятора та в разі небезпеки."], ["Слот польоту", "визначений, обмежений проміжок часу, який надається оператору безпілотника для виконання польоту."]], "th": [{"h": "Симулятор і реальний дрон: у чому різниця", "p": ["Навички, набуті в симуляторі, — лише база. Реальний дрон має інерцію (продовжує рух після того, як ви відпустили стіки) і реагує на вітер, тому керування ним вимагає значно плавніших і менших рухів. Інструктори наголошують: реальний дрон потребує приблизно в 5 разів менше руху стіками, ніж симулятор.", "Найважливіше вміння на старті — Throttle Management, тобто плавне керування газом. Саме воно забезпечує стабільне утримання висоти без вертикальних ривків і м'яку посадку: перед контактом із землею пілот злегка додає газ, щоб «відбити» падіння."], "ul": []}, {"h": "Перше правило безпеки на полігоні", "p": ["Будь-які дії з дроном (огляд, заміна пропелерів, перенесення) виконують лише після відключення акумулятора. Перед підключенням акумулятора перевіряють, що тумблер ARM вимкнений.", "Після польоту порядок завжди однаковий: спочатку дезактивувати двигуни (Disarm), а вже потім відключати акумулятор. Ніхто не підходить до дрона після падіння, доки споттер не підтвердить, що акумулятор відключено."], "ul": ["зона польотів чітко визначена й обмежена, сторонніх у ній немає;", "інструктор або споттер має право зупинити будь-яку небезпечну дію;", "пошкоджений чи перегрітий акумулятор не використовують."]}, {"h": "Пара «пілот — споттер»", "p": ["Пілот в окулярах бачить лише FPV-картинку, тому не має повного уявлення про довкілля. Споттер — це «очі» пілота в реальному світі. Безпека людей і збереження дрона — спільна відповідальність пари."], "ul": ["Пілот керує дроном, виконує маневри, зосереджений на FPV-каналі та техніці виконання.", "Споттер контролює фізичний простір (перешкоди, інші літальні апарати, людей), час і напругу акумулятора.", "Перед польотом споттер читає вголос пункти передпольотного чек-листа, а пілот підтверджує кожен: «Пропелери встановлені?» — «Підтверджую, затягнуті». «Зона вільна від сторонніх?» — «Підтверджую, периметр чистий».", "Дозвіл на Arming споттер дає лише тоді, коли переконався, що дрон на безпечній відстані й ніщо не заважає руху: «Повітряний простір чистий. Зліт дозволяю»."]}, {"h": "Голосові команди споттера", "p": ["Команди мають бути короткими, однозначними й передаватися голосом."], "ul": ["«Перешкода, ліворуч/праворуч!» — пілот негайно відводить дрон у безпечну зону;", "«Вітер у ніс/хвіст!» — пілот коригує тягу (Throttle);", "«Критична напруга!» — напруга досягла межі (близько 3,5 В на комірку): місію негайно перериваємо й сідаємо;", "«Час вичерпано!» — слот закінчено, починаємо посадку;", "«Посадка дозволена!» — зона посадки вільна;", "«Аварія! Вниз негайно!» — пілот скидає газ і вирівнює дрон для контрольованої посадки;", "«Disarm! Disarm! Disarm!» (тричі) — у разі неконтрольованого руху пілот негайно дезактивує двигуни."]}, {"h": "Навчальні вправи", "p": ["Практичне заняття складається з коротких інтенсивних слотів (≈ 5 хв на один акумулятор), після кожного з яких пілот і споттер міняються ролями. Під час польоту пілот регулярно повідомляє напругу акумулятора — це тренує зосередженість."], "ul": ["Керований підйом на висоту 2 м і ховерінг 15 секунд (3 повтори) — освоєння плавного газу.", "Політ по прямокутнику 10×10 м без різких зупинок, зі зміною напрямку плавним поєднанням Roll і Yaw.", "М'яка посадка в коло діаметром 1 м (5 повторів) — найкритичніший елемент польоту.", "Міні-місія: зліт — проліт між двома конусами — точна посадка на час."]}, {"h": "Після польоту", "p": ["Завершальний етап — технічний огляд: стан пропелерів, температура моторів (чи не перегріті), напруга акумуляторів. Далі — аналіз помилок: що вдалося, що варто виправити (наприклад, «занадто різко скидаю газ при посадці»)."], "ul": []}], "f": "Інструктори з FPV-пілотування наголошують: реальний дрон вимагає приблизно в 5 разів менше руху стіками, ніж симулятор, тому новачки найчастіше помиляються саме через надто різкі рухи.", "pr": ["Складіть власний передпольотний чек-лист у форматі «питання споттера — відповідь пілота» (не менше 6 пунктів, включно з перевіркою пропелерів, тумблера ARM, акумулятора та вільної зони).", "Запишіть у правильному порядку дії пари «пілот — споттер» від підготовки до зльоту до завершення польоту (Arming, політ, посадка, Disarming, відключення акумулятора) і поясніть, чому порядок саме такий.", "Якщо маєте доступ до FPV-симулятора, потренуйте ховерінг і м'яку посадку з мінімальними рухами стіків; опишіть письмово 2–3 власні помилки та як їх виправити. Якщо доступу немає — опишіть, які відмінності між симулятором і реальним дроном варто врахувати новачкові."], "q": ["Що є найскладнішим у стабілізації реального дрона порівняно з симулятором?", "Яке перше правило безпеки для будь-кого, хто підходить до дрона на полігоні?", "Що обов'язково потрібно зробити перед тим, як відключити акумулятор після польоту?", "Чому пілот FPV-дрона мусить покладатися на споттера і які обов'язки має споттер?", "Як за допомогою Throttle «відбити» падіння під час посадки і чому це важливо?"]}, {"n": "7", "t": "Військові інформаційні системи та платформи", "g": "Зрозуміти роль українських військових інформаційних платформ в управлінні операціями, розрізняти призначення систем «Дельта» і «Кропива» та оцінити шлях військового IT від волонтерських ініціатив до державних стандартів.", "k": "", "terms": [["Ситуаційна обізнаність (Situational Awareness)", "здатність командування в реальному часі бачити й розуміти обстановку: розташування своїх і ворожих сил, загрози та зміни на полі бою."], ["«Дельта»", "українська система ситуаційної обізнаності, що об'єднує дані з багатьох джерел на одній цифровій карті й побудована на принципах, сумісних зі стандартами НАТО."], ["«Кропива»", "тактичний програмний комплекс для артилерійських підрозділів, що встановлюється на планшети й ноутбуки та автоматизує розрахунки й координацію."], ["C4ISR", "натівська концепція, що поєднує командування, управління, зв'язок, комп'ютери, розвідку, спостереження та рекогносцировку (Command, Control, Communications, Computers, Intelligence, Surveillance, Reconnaissance)."], ["Взаємосумісність (Interoperability)", "здатність різних систем і армій обмінюватися даними та діяти спільно без затримок і перешкод."]], "th": [{"h": "Війна даних", "p": ["Сучасна війна, яку веде Україна, перетворилася на війну даних. Перевагу здобуває не та сторона, що має більше людей чи техніки, а та, яка швидше збирає, обробляє інформацію й перетворює її на рішення. Тому інформацію часто називають новою зброєю XXI століття, а військові інформаційні системи стали критично важливим елементом Сил оборони України."], "ul": []}, {"h": "Децентралізація: від «IT-хаосу» до стандартів", "p": ["Повномасштабне вторгнення 2022 року показало потребу в негайній модернізації застарілих систем управління. У відповідь виник унікальний феномен — децентралізована розробка військового програмного забезпечення волонтерами, IT-фахівцями та ентузіастами.", "Сотні тисяч військових почали користуватися різним софтом, що призвело до певного «IT-хаосу»: потреби закривалися швидко, але виникали ризики несумісності й безпеки. Водночас такий гнучкий підхід дозволив швидко випробувати найкращі рішення, які згодом інтегрували в офіційні платформи, зокрема «Дельту» та «Кропиву»."], "ul": []}, {"h": "«Дельта» — мозок ситуаційної обізнаності", "p": ["Головне завдання «Дельти» — забезпечити єдину оперативно-тактичну картину бойових дій у реальному часі. Система об'єднує на одній цифровій карті дані з десятків і сотень джерел. Вона працює за принципом хмарного сервісу, що підвищує її живучість і захищеність від фізичного знищення та кібератак."], "ul": ["розвідувальні дані: інформація від дронів (зокрема «Аеророзвідки»), супутників, агентурної розвідки;", "технічні засоби: дані радарів, систем РЕБ/РЕР;", "інші системи: дані, отримані через Starlink, та сумісні платформи, як-от «Кропива»;", "обмін оперативними планами та цілевказуванням між рівнями командування й родами військ."]}, {"h": "«Кропива» — тактичний інструмент артилерії", "p": ["На відміну від «Дельти», яка працює на рівні загальної картини, «Кропива» — польовий інструмент, що став революційним для української артилерії."], "ul": ["автоматизація розрахунків: швидке обчислення поправок з урахуванням метеоданих та інших умов;", "координація: оперативний обмін розвідданими з підрозділами на передовій;", "прискорення: час від виявлення цілі до реакції скорочується з десятків хвилин до лічених секунд чи хвилин."]}, {"h": "Шлях до стандартів НАТО", "p": ["Найуспішніші, перевірені боєм платформи, зокрема «Дельта», інтегруються в державну вертикаль Міністерства оборони. Це передбачає акредитацію відповідно до національних стандартів і стандартів НАТО (STANAG), зокрема стандартів обміну даними.", "Головна мета — взаємосумісність: українські системи мають без затримок «спілкуватися» з західною технікою та штабами країн-партнерів. Це крок до мережевоцентричної армії, де єдина цифрова картина бою — обов'язкова передумова ухвалення рішень."], "ul": []}, {"h": "IT-навички у війську", "p": ["Досвід війни довів, що фахівці з інформаційних систем і технологій у сучасній армії не менш важливі, ніж інженери чи механіки. Уміння працювати з даними, цифровими картами та захищеними системами стає обов'язковим для більшості військових професій."], "ul": []}], "f": "Система «Дельта» працює як хмарний сервіс: це робить її стійкою до фізичного знищення окремих серверів і краще захищеною від кібератак.", "pr": ["Складіть порівняльну таблицю «Дельта» / «Кропива» за критеріями: рівень застосування (стратегічний чи тактичний), головне завдання, основні функції, хто користується.", "Напишіть есе (8–10 речень) на тему «Волонтерський софт на війні: переваги та ризики децентралізації». Запропонуйте, як поєднати гнучкість волонтерських розробок з єдиними стандартами безпеки.", "Дайте письмову відповідь на питання «Чи можна виграти бій лише завдяки даним?», навівши 2–3 аргументи з конспекту."], "q": ["Чим відрізняються «Дельта» і «Кропива» за рівнем застосування та головним завданням?", "Що таке ситуаційна обізнаність і чому вона критична для сучасних операцій?", "Які переваги й ризики мала децентралізована розробка військового ПЗ після 2022 року?", "Навіщо українським системам відповідати стандартам НАТО?", "Які нові навички потрібні військовим для роботи з інформаційними системами?"]}, {"n": "8", "t": "Військові професії. Особливості професій, пов'язаних з аналізом інформації; радіотехнічних засобів електромагнітної (радіоелектронної) боротьби, пілотуванням та розробкою БпЛА", "g": "Знати, що таке військово-облікова спеціальність (ВОС) і навіщо вона потрібна; розуміти особливості технологічних військових професій (аналітик, оператор БпЛА, фахівець РЕБ, технік дронів), їхні вимоги та взаємозв'язок з іншими ролями у війську, зокрема з піхотою.", "k": "", "terms": [["Військово-облікова спеціальність (ВОС)", "військова професія, офіційно записана у військово-обліковому документі; визначає підготовку, навички та рід військ, до якого належить людина."], ["Hard skills", "професійні, технічні навички, які можна перевірити: знання техніки, програм, мов, уміння ремонтувати чи пілотувати."], ["Soft skills", "особисті й міжособистісні якості: стресостійкість, уважність, командна робота, комунікація, відповідальність."], ["Радіоелектронна боротьба (РЕБ)", "комплекс заходів і засобів для придушення, перешкоджання чи захисту радіоелектронних систем і зв'язку."], ["БпЛА", "безпілотний літальний апарат, яким керують дистанційно або який виконує політ автономно."], ["НРК", "наземний роботизований комплекс — безекіпажна наземна платформа з дистанційним керуванням."]], "th": [{"h": "Що таке ВОС", "p": ["Військова професія юридичною мовою називається військово-обліковою спеціальністю (ВОС). Вона записана у військовому квитку чи іншому обліковому документі й чітко визначає, яку підготовку та навички має людина і до якого роду військ належить.", "Існує понад 200 спеціальностей, закодованих шестизначним номером: перші три цифри — ВОС, наступні три — код посади; можуть бути додаткові літери для особливих ознак."], "ul": []}, {"h": "Для чого потрібна ВОС", "p": ["Головна мета ВОС — швидке та ефективне комплектування армії. У мирний час система дозволяє вести облік фахівців, щоб у разі мобілізації швидко знайти потрібних людей на конкретні посади. Під час призову саме ВОС значною мірою визначає, яку посаду отримає людина.", "ВОС не є незмінною: її можна змінити за власним бажанням у ТЦК або під час служби через перепідготовку в навчальному центрі."], "ul": []}, {"h": "Технологічні професії сучасної війни", "p": ["Повномасштабна війна зробила особливо затребуваними інтелектуальні, IT та технічні спеціальності."], "ul": ["Аналітик (розвідки, даних) — збирає, перевіряє й узагальнює інформацію, готує висновки для командування; потрібні уважність, критичне мислення, вміння працювати з великими обсягами даних.", "Оператор / пілот БпЛА — керує безпілотником для розвідки та виконання завдань; потрібні зосередженість, стресостійкість, швидка реакція, командна робота.", "Фахівець РЕБ / РЕР — працює з радіотехнічними засобами, захищає свої системи та протидіє ворожим; потрібні технічна освіта чи знання радіотехніки, аналітичне мислення.", "Технік / інженер майстерні дронів — збирає, ремонтує та налаштовує безпілотники; потрібні технічні навички, акуратність, винахідливість.", "Зв'язківець — забезпечує стабільний і захищений зв'язок між підрозділами."]}, {"h": "Як дізнатися про реальні вимоги", "p": ["Реальні обов'язки й вимоги до військових фахівців можна дослідити за описами вакансій на спеціалізованих ресурсах (наприклад, LobbyX, розділ вакансій ArmyInform, розділ «Військова справа» на DOU), а також за розповідями самих військових про свою службу. Аналізуючи вакансію, варто з'ясувати: хто це і що робить, які навички, освіта чи досвід потрібні, чим ця професія особлива."], "ul": []}, {"h": "Чи є «найважливіша» професія", "p": ["Армія — це єдина система, де технологічні та бойові ролі взаємозалежні. Оператор БпЛА не досягне результату без зв'язківця, техніка, аналітика, а успіх на полі бою неможливий без піхотинця, бойового медика, водія, логіста. Піхота й надалі відіграє значну роль у сучасній війні: саме піхотинці утримують і звільняють територію.", "Війна постійно породжує нові професії: під час повномасштабного вторгнення з'явилися або набули масовості, зокрема, оператори наземних роботизованих комплексів (НРК), техніки дронів, фахівці з військових IT-систем."], "ul": []}], "f": "Номер ВОС шестизначний: перші три цифри позначають саму спеціальність, а наступні три — код посади.", "pr": ["Оберіть одну технологічну військову професію (оператор БпЛА, фахівець РЕБ, аналітик розвідки, технік дронів, зв'язківець), знайдіть 1–2 реальні вакансії на відкритих ресурсах і письмово опишіть за планом: хто це і що робить (4–5 обов'язків); що вимагається (hard і soft skills); що вас здивувало; чи може цю професію в майбутньому замінити робот.", "Складіть таблицю «hard skills / soft skills» для трьох професій: оператор БпЛА, аналітик, піхотинець. Підкресліть спільні якості.", "Напишіть аргументовану відповідь (8–10 речень) на питання «Чи існує “найважливіша” професія у війську?»."], "q": ["Що таке ВОС і навіщо вона потрібна державі та армії?", "Як побудований код ВОС і чи можна змінити військово-облікову спеціальність?", "Чим новітні військові професії (оператор БпЛА, аналітик, фахівець РЕБ) відрізняються від класичних?", "Які навички є ключовими для технологічних спеціальностей, а які — для піхотинців?", "Які нові військові професії виникли під час повномасштабного вторгнення?"]}]}, {"name": "Тренінг 4. Стрілецька підготовка, основи дій та взаємодії в бою", "lessons": [{"n": "1", "t": "Класифікація та будова вогнепальної зброї", "g": "Знати основні класи стрілецької зброї та їхнє призначення, правила безпечного поводження зі зброєю і її зберігання, мати загальне уявлення про системи АК-74 та AR-15.", "k": "", "terms": [["Стрілецька зброя", "вогнепальна зброя, призначена для ураження цілей кулями; до неї належать пістолети, автомати, гвинтівки та кулемети."], ["Кодекс стрільця", "сукупність правил безпечного поводження зі зброєю, основою яких є 4 «золоті» правила."], ["Ефективна дальність", "відстань, на якій зброя здатна виконувати своє призначення з достатньою точністю."], ["Догляд за зброєю", "регулярне чищення, змащування й огляд зброї, що забезпечують її справність і безпеку."], ["Розряджена зброя", "зброя, у якій немає набоїв ні в магазині, ні в патроннику; розрядженість обов'язково перевіряють перед будь-якими діями зі зброєю."]], "th": [{"h": "Зброя — це передусім відповідальність", "p": ["Розмова про зброю завжди починається не з техніки, а з безпеки. Будь-яка необережність зі зброєю може коштувати життя — власного або чужого. Тому кожен, хто бере зброю до рук, навіть навчальну чи пневматичну, зобов'язаний знати й виконувати правила Кодексу стрільця."], "ul": []}, {"h": "4 золоті правила Кодексу стрільця", "p": [], "ul": ["Завжди поводься зі зброєю так, ніби вона заряджена.", "Ніколи не спрямовуй зброю на те, чого не збираєшся знищити (зокрема на люде
