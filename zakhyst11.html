і напрями найбільш потрібні в сучасному оборонно-промисловому комплексі?", "Як працювати для війська без вступу до ВВНЗ?", "Чому інформацію про вступ слід щороку перевіряти на офіційних сайтах?"]}, {"n": "4", "t": "Адаптація суспільства до потреб військовослужбовців, ветеранів та ветеранок війни, зокрема осіб з інвалідністю внаслідок війни", "g": "Зрозуміти фізичні, психологічні та соціальні виклики, з якими стикаються ветерани й особи з інвалідністю внаслідок війни, навчитися етично спілкуватися, розвінчувати стереотипи та придумати власний внесок у їхню підтримку.", "k": "", "terms": [["Реінтеграція", "процес повернення людини після військової служби до цивільного життя: роботи, навчання, громади, родини."], ["Адаптація", "пристосування та звикання до нових умов; щодо ветеранів — також зміна того, як суспільство взаємодіє з людиною."], ["ПТСР", "посттравматичний стресовий розлад — психіатричний діагноз, який можуть встановити лише лікарі."], ["Посттравматичне зростання (ПТЗ)", "позитивні зміни в людині після пережитого складного досвіду: нові цінності, сила, сенси."], ["Ветеранський бізнес", "підприємство, засноване ветераном чи ветеранкою, яке дає робочі місця та сприяє інтеграції в суспільство."]], "th": [{"h": "Що таке адаптація", "p": ["Адаптація — це не лише пандуси і протези. Це також мова, ставлення та можливості. Ветерани й особи з інвалідністю внаслідок війни стикаються з фізичними бар'єрами (недоступний простір), психологічними (наслідки пережитого) та соціальними (стереотипи, складнощі з працевлаштуванням).", "Адаптація — двосторонній процес: змінюється не лише людина, а й суспільство — фізично (доступність) і ментально (повага, етична комунікація). Свою роль відіграють держава, бізнес, громада, школа і кожен із нас."], "ul": []}, {"h": "Розвінчуємо стереотипи", "p": [], "ul": ["«Всі ветерани мають ПТСР» — ні. За даними, які наводять фахівці, ПТСР можуть мати 22–37 % ветеранів. Це діагноз, який ставить лише лікар; не можна називати ПТСР будь-яку поведінку, що нам не подобається.", "«Всі ветерани хочуть повернутися на службу» — ні. З 2022 року до війська пішли люди різних професій, і більшість планують повернутися до цивільної роботи.", "«Військові не здатні адаптуватися» — адаптація в кожного різна і значною мірою залежить від оточення: якщо людину чекають і підтримують, вона минає легше.", "«Ветерани не можуть працювати з цивільними» — навпаки, військові мають розвинені навички командної роботи.", "«Військові завжди готові до насильства» — служба не змінює характер людини; ті, хто воював, навчені, у яких умовах і як застосовувати силу.", "«Військові мають завжди бути сильними» — вони люди, які теж відчувають страх, тривогу, біль."]}, {"h": "Як спілкуватися етично", "p": [], "ul": ["Не ставте дуже особистих питань із цікавості — це може завдати болю.", "Не давайте порад, як краще воювати, якщо вас про це не просять.", "Не кажіть «все буде добре» — це звучить як неправда і не підтримує.", "Не кажіть «я тебе розумію», якщо не мали такого самого досвіду.", "Пам'ятайте про тригери: гучні звуки й крики можуть сприйматися як небезпека.", "Не торкайтеся людини без дозволу: на тілі можуть бути поранення. Запитайте: «Можна потиснути вам руку?»"]}, {"h": "Ветеранський бізнес і програми підтримки", "p": ["Ветеранський бізнес дає роботу іншим ветеранам і показує суспільству, що люди з бойовим досвідом — успішні й корисні. Приклади: мережа піцерій Veterano Pizza, кав'ярні Veterano Coffee та «Кава мілітарі», бізнес «Сушена радість» Сергія Жуковського, який після важкого поранення пройшов реабілітацію, отримав грант і відкрив власну справу.", "Підтримку надають Міністерство у справах ветеранів (реінтеграція, перепідготовка, гранти, психологічна допомога), Український ветеранський фонд (гранти для бізнесу), мережа Veteran Hub (юридичні, кар'єрні, психологічні консультації), програми перекваліфікації в IT. Модель системного супроводу ветеранів розвиває, зокрема, ГО «Азов.Супровід»."], "ul": []}, {"h": "Що можу зробити я", "p": [], "ul": ["Фізичний внесок: провести міні-аудит доступності школи чи вулиці.", "Психологічний внесок: вчитися етичної комунікації і ділитися цими правилами з іншими.", "Соціальний внесок: організувати ярмарок виробів ветеранів, шкільний подкаст, підтримувати ветеранський бізнес у своїй громаді."]}], "f": "Першу піцерію Veterano Pizza відкрив у Києві у 2016 році ветеран Леонід Остальцев, щоб дати роботу побратимам, яким було важко працевлаштуватися.", "pr": ["Завершіть речення (письмово, 3 варіанти — фізичний, психологічний і соціальний внесок): «Я … для підтримки ветеранів, ветеранок чи осіб з інвалідністю внаслідок війни».", "Складіть міні-план проєкту для своєї школи чи громади (наприклад, аудит доступності, ярмарок ветеранських виробів, подкаст): дія, відповідальні, термін, ресурси.", "Підготуйте власний «Перелік етичних фраз» для спілкування з ветеранами та їхніми родинами або напишіть пост про одну ініціативу з адаптації ветеранів."], "q": ["Які фізичні, психологічні й соціальні бар'єри можуть стояти перед ветеранами та особами з інвалідністю?", "Чому неправильно вважати, що всі ветерани мають ПТСР?", "Яких фраз варто уникати в розмові з ветераном і чому?", "Як ветеранський бізнес допомагає адаптації — і ветеранові, і суспільству?", "Чому адаптацію називають двостороннім процесом?"]}, {"n": "5", "t": "Інтеграція знань курсу «Захист України»: від мислення до дії та суспільства Гідності", "g": "Підсумувати знання курсу про волонтерство, ментальне здоров'я та комунікацію, переглянути розвіяні міфи і скласти особистий план, як використати свій талант для підтримки оборони та суспільства Гідності.", "k": "", "terms": [["Громадянський активізм", "свідома участь людини в житті громади й держави через конкретні дії."], ["Мова єдності", "спосіб спілкування з військовими, ветеранами та їхніми родинами, що ґрунтується на повазі, рівності та визнанні досвіду."], ["Гідність", "внутрішня цінність кожної людини, що вимагає поваги, а не жалю."], ["Емоційне вигорання", "стан висн function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = t => t.toLowerCase().replace(/[«»"()]/g, "").trim();

function makeQuiz(l){
  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Який термін відповідає визначенню?", sub: def, opts }
      : { q: "Що означає термін «" + term + "»?", sub: "", opts };
  });
}

}

function renderQuiz(l){
  const Q = makeQuiz(l), box = document.getElementById("quiz");
  const prev = results[l.id];
  let h = '<div class="qhead"><h2>Тест · 5 завдань</h2><p>' + (prev ? "Найкращий результат: " + prev + " з 5" : "Оберіть одну відповідь у кожному завданні") + "</p></div><form id=\"qf\">";
  Q.forEach((q, i) => {
    h += '<div class="q"><div class="qt"><span>' + (i + 1) + ".</span><div>" + esc(q.q) + (q.sub ? "<br><em>" + esc(q.sub) + "</em>" : "") + '</div></div><div class="opts">';
    q.opts.forEach(([t], j) => h += '<label class="opt"><input type="radio" name="q' + i + '" id="q' + i + "o" + j + '" value="' + j + '"><span>' + esc(t) + "</span></label>");
    h += "</div></div>";
  });
  h += '<div class="qfoot"><button class="btn" type="submit" id="chk" disabled>Перевірити</button><button class="btn ghost" type="button" id="again">Інші питання</button><span class="score" id="sc" aria-live="polite"></span></div></form>';
  box.innerHTML = h;
  const f = document.getElementById("qf"), chk = document.getElementById("chk");
  f.addEventListener("change", () => { chk.disabled = Q.some((_, i) => !f["q" + i] || ![...f.querySelectorAll('[name="q' + i + '"]')].some(x => x.checked)); });
  document.getElementById("again").onclick = () => renderQuiz(l);
  f.addEventListener("submit", e => {
    e.preventDefault(); if (f.classList.contains("checked")) return;
    let ok = 0;
    Q.forEach((q, i) => {
      const inputs = [...f.querySelectorAll('[name="q' + i + '"]')];
      inputs.forEach((inp, j) => { inp.disabled = true; const lab = inp.parentElement;
        if (q.opts[j][1]) lab.classList.add("right"); else if (inp.checked) lab.classList.add("wrong"); });
      if (q.why) { const w = document.createElement("p"); w.className = "why"; w.textContent = q.why; inputs[0].closest(".opts").after(w); }
      const sel = inputs.findIndex(x => x.checked); if (sel >= 0 && q.opts[sel][1]) ok++;
    });
    f.classList.add("checked"); chk.disabled = true;
    const sc = document.getElementById("sc");
    sc.className = "score " + (ok >= 4 ? "good" : ok >= 3 ? "mid" : "low");
    sc.textContent = "Результат: " + ok + " з 5. " + (ok === 5 ? "Чудово!" : ok >= 4 ? "Добре засвоєно." : ok >= 3 ? "Повторіть ключові поняття." : "Перечитайте конспект і спробуйте ще раз.");
    if (ok > (results[l.id] || 0)) { results[l.id] = ok; store.set(results); }
    renderToc();
  });
}

function open(id){
  cur = { s: LES[id].subj.id, id };
  try { localStorage.setItem("yasno-last", id); } catch(e){}
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  renderToc(); renderLesson();
  document.getElementById("side").classList.remove("open");
  document.getElementById("tocBtn").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}
document.getElementById("search").addEventListener("input", renderToc);
document.getElementById("tocBtn").onclick = e => { const sd = document.getElementById("side"); const o = sd.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
open(cur.id);
</script>
