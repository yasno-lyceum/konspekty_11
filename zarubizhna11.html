<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зарубіжна література · 11 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
.box h4{font:700 14px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
@media(max-width:640px){.tbl{display:block;overflow-x:auto}}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>

{info:`<p>Епіграф підручника — давньоримське прислів'я <i>«Vox audita perit, littera scripta manet»</i> — «Озвучене голосом щезає, написана літера залишається». Література зберігає досвід людства й допомагає відповідати на виклики сучасності.</p>
<h4>Виклики сучасного світу</h4>
<ul><li><b>війни й насильство</b> (зокрема російська агресія проти України), тоталітарні загрози;</li><li><b>глобалізація</b>, втрата національної самобутності;</li><li><b>цифровізація</b>: «кліпове» мислення, інформаційний шум, фейки, менше часу на читання;</li><li><b>екологічні проблеми</b>, пандемії;</li><li><b>моральна криза</b>: споживацтво, байдужість, самотність людини.</li></ul>
<h4>Література. Мораль. Людяність</h4>
<p>Художня література XX — початку XXI ст. порушує <b>вічні питання</b>: сенс життя, свобода й відповідальність, добро і зло, людина і влада, війна і мир. Вона вчить <b>людяності</b>, співчуття, критичного мислення, умінню протистояти злу.</p>
<p>Світова література доступна українському читачеві завдяки <b>перекладацькій школі</b>: Микола Лукаш («Моцарт українського перекладу», «Фауст»), Григорій Кочур, Борис Тен, Микола Бажан, Дмитро Павличко, Максим Стріха та ін.</p>
<p>Важливими орієнтирами є <b>міжнародні літературні премії</b>: Нобелівська (з 1901 р.), Букерівська, Ґонкурівська, Сервантесівська, Пулітцерівська. Нобелівськими лауреатами стали багато авторів 11 класу: Т. С. Еліот, А. Камю, Е. Гемінґвей, Г. Белль, Ґ. Ґарсіа Маркес.</p>
<p><b>У 11 класі</b>: Ґете, модернізм (Кафка, Камю), європейська лірика XX ст. (Аполлінер, Рільке, Лорка), антиутопія (Орвелл), війна й мир (Брехт, Белль, Целан), пошуки сенсу (Гемінґвей, Маркес), постмодернізм (Павич), сучасна література (Халілов, Зузак).</p>`,

{info:`<p><b>Просвітництво</b> — широка ідейна течія кінця XVII — XVIII ст., що виражала антифеодальні, антиабсолютистські погляди. Просвітники вважали метою суспільства людське щастя, а шлях до нього — <b>розум</b>, освіту, перебудову суспільства на засадах природного права, свободи, рівності.</p>
<h4>Німецьке Просвітництво</h4>
<ul><li>Німеччина була роздроблена на понад 300 князівств, тому просвітники боролися за національне об'єднання, розвиток німецької мови й культури.</li><li>Філософи: Г. В. Лейбніц, І. Кант («Майся мужність користуватися власним розумом!»), Й. Г. Гердер.</li><li>Г. Е. Лессінг — теоретик і драматург («Натан Мудрий», «Емілія Галотті»).</li><li><b>«Буря і натиск»</b> (1770-ті) — рух молодих письменників (Ґете, Шиллер), що утверджував культ почуттів, свободи, генія, природи.</li><li><b>Веймарський класицизм</b> — пізній етап творчості Ґете й Шиллера: гармонія, ідеал античності.</li></ul>
<h4>Йоганн Вольфганг Ґете (1749–1832)</h4>
<ul><li>Народився у Франкфурті-на-Майні в заможній родині; навчався в Лейпцигу й Страсбурзі.</li><li>Роман «Страждання молодого Вертера» (1774) приніс славу всій Європі.</li><li>З 1775 р. жив у Веймарі: міністр, керівник театру, учений-природознавець (оптика, ботаніка, анатомія).</li><li>Дружба з Ф. Шиллером; твори: «Вільгельм Майстер», «Західно-східний диван», лірика, балада «Вільшаний король».</li><li>Головна праця життя — <b>«Фауст»</b> (близько 60 років роботи).</li></ul>
<p>Вплив Просвітництва на Європу: ідеї свободи й рівності, віра в розум і прогрес, розвиток науки, освіти, демократичних інститутів.</p>`,

// 3 Фауст: композиція
{info:`<p><b>Історія створення.</b> Сюжет взято з народної легенди про доктора Фауста (XVI ст.) — чорнокнижника, що продав душу дияволові; відома «Народна книга» (1587), драма К. Марло. Ґете працював над «Фаустом» з 1773 до 1831 р.: «Прафауст», частина I (1808), частина II (опубл. 1832, після смерті автора).</p>
<h4>Композиція</h4>
<ul><li><b>«Присвята»</b> — ліричний вступ.</li><li><b>«Пролог у театрі»</b> — суперечка Директора, Поета й Коміка про призначення мистецтва.</li><li><b>«Пролог на небі»</b> — суперечка Господа й Мефістофеля про людину; «парі» про долю Фауста. Це філософська зав'язка.</li><li><b>Частина I</b> — «малий світ»: особисте життя, пізнання, кохання; «трагедія Маргарити».</li><li><b>Частина II</b> (5 дій) — «великий світ»: держава, історія, мистецтво (Олена), діяльність на благо людей.</li></ul>
<p>Етапи пошуків Фауста: <b>наука → кохання → краса (мистецтво) → державна діяльність → праця на благо людей</b>.</p>
<h4>Жанрова своєрідність</h4>
<p><b>Філософська трагедія</b> (драматична поема): поєднання драми, лірики й епосу; реального й фантастичного; високого й комічного; різних віршових розмірів. Ґете називав твір просто «трагедією».</p>
<p><b>Проблематика</b>: сенс буття й призначення людини, межі пізнання, добро і зло, свобода волі, кохання й відповідальність, мистецтво, праця.</p>`,

// 4 Фауст — Мефістофель
{info:`<p>Конфлікт <b>Фауста</b> й <b>Мефістофеля</b> — центральний рушій сюжету. Вони уособлюють протилежні сили: прагнення до розвитку й духовних пошуків — і спокусу, заперечення, руйнування.</p>

<tr><td>помиляється, але кається й іде вперед</td><td>частина тієї сили, що вічно прагне зла, а чинить благо</td></tr></table>
<h4>Угода</h4>
<p>Мефістофель обіцяє Фаустові всі насолоди світу; той погоджується віддати душу, якщо скаже миті: <b>«Постій, хвилино, гарна ти!»</b> Фауст упевнений, що ніколи не заспокоїться, — бо зупинка означає духовну смерть.</p>
<h4>Значення опозиції</h4>
<ul><li>Мефістофель, бажаючи зла, мимоволі <b>штовхає Фауста до розвитку</b>: заперечення спонукає до пошуку.</li><li>Фауст і Мефістофель — <b>дві сторони людської душі</b>: відчуття «двох душ» у грудях Фауста.</li><li>Фінал: Мефістофель програє — Фауст вимовляє заповітні слова, але про <b>майбутнє</b> вільного народу на вільній землі; ангели рятують його душу.</li></ul>
<p><b>Останній монолог Фауста</b>: «Лиш той життя і волі гідний, / Хто б'ється день у день за них» — сенс життя в діяльності на благо людей.</p>`,

<h4>Світоглядні засади</h4>
<ul><li>Криза віри в розум і прогрес; відчуття <b>абсурдності, хаосу</b> світу (Перша світова війна, революції).</li><li>Вплив філософії Ф. Ніцше, А. Бергсона (інтуїція, «потік життя»), З. Фройда (підсвідоме).</li><li>Увага до <b>внутрішнього світу</b> людини, її підсвідомості, самотності, <b>відчуження</b>.</li></ul>
<h4>Естетичні засади й новаторство</h4>
<ul><li>відмова від «копіювання» дійсності, перевага суб'єктивного бачення;</li><li><b>міф</b>, символ, притча, алегорія, гротеск;</li><li><b>«потік свідомості»</b> — фіксація думок і почуттів у їхньому хаотичному плині;</li><li>фрагментарність, порушення хронології, відкритий фінал;</li><li>експерименти з мовою й формою.</li></ul>

{info:`<p><b>Франц Кафка</b> (1883–1924) — австрійський письменник єврейського походження, що писав німецькою; один із засновників модерністської прози.</p>
<ul><li>Народився в <b>Празі</b> (тоді Австро-Угорщина) у родині заможного купця. Складні стосунки з деспотичним батьком («Лист до батька», 1919) визначили відчуття провини й страху.</li><li>Закінчив юридичний факультет; працював у страховому товаристві — ця бюрократична робота знайшла відображення у творах.</li><li>Тричі заручався, але так і не одружився. Хворів на туберкульоз, помер у санаторії поблизу Відня.</li><li>За життя надрукував мало; перед смертю просив друга <b>Макса Брода</b> спалити рукописи, але той видав їх, і Кафка став світовим класиком.</li></ul>

<h4>Особливості творчості</h4>

// 7 Перевтілення: абсурд
{info:`<p><b>«Перевтілення»</b> (1912, опубл. 1915) — новела про комівояжера Ґреґора Замзу, який прокинувся величезною комахою.</p>
<h4>Композиція</h4>
<p>Три частини — три спроби Ґреґора вийти зі своєї кімнати, і кожна закінчується поразкою: 1) прихід прокуриста, батько заганяє сина палицею; 2) батько кидає яблука, одне застрягає в спині; 3) Ґреґор виходить на звуки скрипки — родина вирішує його позбутися; смерть героя. Кульмінація — <b>не</b> перевтілення (воно в першому реченні), а поступове відчуження родини.</p>
<h4>Функції фантастики</h4>
<ul><li>перевтілення — <b>метафора</b> відчуження, «знеособлення» людини, яку сприймають лише як функцію (годувальника);</li><li>фантастичне подано буденно, без пояснень — і це посилює відчуття <b>абсурду</b>;</li><li>«перевтілюється» і родина: вона виявляє свою справжню, черству суть.</li></ul>
<h4>Образ Ґреґора Замзи</h4>
<p>«Маленька людина», яка жила для інших і не мала власного життя. Навіть ставши комахою, він думає про роботу й родину, зберігає людську душу — любов до матері й сестри, чутливість до музики. Трагедія в тому, що <b>людське</b> в ньому ніхто не бачить.</p>
<h4>Світове буття як абсурд</h4>
<p>Світ у Кафки нелогічний: катастрофа приходить без причини, ніхто не дивується, а людина безсила й самотня. Фінал — родина з полегшенням їде на прогулянку — підкреслює жорстоку буденність зла.</p>`,

// 8 Камю 1
{info:`<p><b>Альбер Камю</b> (1913–1960) — французький письменник, філософ, публіцист; лауреат <b>Нобелівської премії 1957 р.</b></p>
<ul><li>Народився в Алжирі в бідній родині; батько загинув у Першій світовій війні, мати була напівглухою прибиральницею.</li><li>Хворів на туберкульоз; навчався філософії в Алжирському університеті; захоплювався футболом.</li><li>Журналіст; у роки Другої світової війни — учасник <b>Руху Опору</b>, редактор підпільної газети «Комба».</li><li>Загинув в автокатастрофі 1960 р.</li></ul>
<h4>Особливості світогляду</h4>
<ul><li><b>Абсурд</b> — розрив між прагненням людини до сенсу й «мовчанням» байдужого світу («Міф про Сізіфа», 1942): «Треба уявляти Сізіфа щасливим».</li><li><b>Бунт</b> — відповідь на абсурд: людина не скоряється, а діє («Бунтівна людина», 1951): «Я бунтую — отже, ми існуємо».</li><li><b>Солідарність</b>, відповідальність, гуманізм, чесне виконання свого обов'язку.</li><li>Близький до <b>екзистенціалізму</b>, хоча сам від цього терміна відмежовувався.</li></ul>

// 9 Камю 2: Чума
{info:`<p><b>Роман «Чума»</b> (1947) — роман-хроніка й роман-притча про епідемію в алжирському місті Оран.</p>
<h4>Сюжет і композиція</h4>
<p>П'ять частин, як п'ять актів трагедії: весна — поява хвороби й заперечення; літо — карантин і розпал епідемії; осінь — боротьба; зима — спад і відкриття брами. Оповідач — лікар <b>Бернар Ріє</b>, який до кінця приховує своє ім'я, щоб бути об'єктивним «хроністом».</p>
<h4>Проблематика</h4>
<ul><li>людина перед лицем зла й смерті;</li><li>обов'язок і порядність («Єдиний засіб боротися з чумою — чесність»);</li><li>віра й безневинне страждання (смерть дитини, проповіді Панлю);</li><li>особисте щастя чи солідарність (вибір Рамбера);</li><li>самотність і відчуження в «закритому» місті.</li></ul>
<h4>Притчевість і алегоризм</h4>
<ul><li><b>Чума</b> — алегорія фашизму, окупації, війни, будь-якого зла й насильства (епіграф із Д. Дефо: зобразити одне ув'язнення через інше).</li><li>Оран — модель світу; карантин — ув'язнення людства.</li><li>Герої — різні моделі поведінки: боротьба (Ріє, Тарру, Гран, Рамбер), пошук віри (Панлю), пристосуванство й нажива (Коттар).</li></ul>
<p>Фінал-застереження: <b>бацила чуми ніколи не вмирає</b> — зло може повернутися, тому людство мусить бути пильним.</p>`,

// 12 Аполлінер — поет-авангардист
{info:`<p><b>Ґійом Аполлінер</b> (справжнє ім'я — Вільгельм Аполлінарій Костровицький, 1880–1918) — французький поет польського походження, лідер авангарду.</p>
<ul><li>Народився в Римі; мати — польська аристократка; дитинство минуло в Монако, Ніцці.</li><li>У Парижі — друг художників-кубістів <b>П. Пікассо</b>, Ж. Брака, А. Руссо; теоретик кубізму («Художники-кубісти», 1913).</li><li>Уперше вжив термін <b>«сюрреалізм»</b> (п'єса «Груди Тірезія», 1917).</li><li>Добровольцем пішов на Першу світову війну, тяжко поранений у голову (1916). Помер від «іспанки» за два дні до перемир'я, 9 листопада 1918 р.</li></ul>
<h4>Збірки</h4>
<ul><li><b>«Алкоголі. Вірші 1898–1913»</b> (1913) — вірші без розділових знаків, поєднання традиції й новаторства («Міст Мірабо», «Зона»).</li><li><b>«Каліграми. Вірші Миру і Війни»</b> (1918) — вірші-малюнки.</li></ul>
<h4>Новаторство</h4>
<ul><li>зв'язок з естетикою <b>кубізму</b>: «одночасність» різних вражень, монтаж образів;</li><li>відмова від пунктуації (ритм задає сам вірш);</li><li><b>верлібр</b>, розмовна інтонація, образи сучасного міста й техніки;</li><li><b>каліграми</b> — вірші, рядки яких утворюють малюнок, — поєднання поезії й живопису.</li></ul>
<p><b>«Зарізана голубка й водограй»</b> — каліграма: рядки утворюють голубку (мир, кохання), водограй (сльози, плинність) і око; поет згадує коханих жінок і друзів, що пішли на війну, — передчуття загибелі.</p>`,

// 13 Міст Мірабо
{info:`<p><b>«Міст Мірабо»</b> (1912) — найвідоміший вірш Аполлінера зі збірки «Алкоголі». Написаний після розриву з художницею <b>Марі Лорансен</b>. Кожного вечора впродовж п'яти років Аполлінер ішов до коханої через увесь Париж і проходив міст Мірабо. Вірш передає дух народної (давньої нормандської ткацької) пісні.</p>
<h4>Тема кохання й часу</h4>
<ul><li><b>Вода Сени</b> — символ плинності часу й кохання: «Під мостом Мірабо струмує Сена / Так і любов…».</li><li><b>Міст</b> — образ сталості, людини, яка залишається, коли все минає; також міст рук закоханих.</li><li><b>Рефрен</b>: «Хай б'є годинник ніч настає / Минають дні а я ще є» (переклад Миколи Лукаша) — час невблаганний, але ліричний герой зберігає себе.</li><li>Настрій — світлий сум, примирення з плинністю життя.</li></ul>
<h4>Художні особливості</h4>
<ul><li>відсутність розділових знаків — вірш «тече», як вода; паузи задає ритм;</li><li>поєднання традиційної форми (строфи, рефрен, рима) з новаторською;</li><li>повтори, паралелізм, звукопис;</li><li>пісенність — вірш багато разів перекладали й клали на музику.</li></ul>
<h4>Верлібр у творчості Аполлінера</h4>
<p><b>Верлібр</b> — вільний вірш без сталого розміру й обов'язкової рими, ритм якого тримається на інтонації, паузах, повторах. Аполлінер поєднує верлібр («Зона») з класичними формами, створюючи «синтетичну» поезію XX ст.</p>`,

// 14 Рільке
{info:`<p><b>Райнер Марія Рільке</b> (1875–1926) — австрійський поет, що писав німецькою; один із найбільших ліриків XX ст.</p>
<ul><li>Народився в <b>Празі</b>; навчався у військовому училищі, яке ненавидів, потім у Празькому й Мюнхенському університетах.</li><li>Подорожував Європою; 1899–1900 рр. разом з Лу Андреас-Саломе відвідав <b>Україну</b> (Київ, Полтава, Дніпро), захоплювався Шевченком, переклав «Слово о полку Ігоревім».</li><li>Секретар скульптора <b>Огюста Родена</b> в Парижі — навчився «дивитися» на речі.</li><li>Помер у Швейцарії від лейкемії.</li></ul>
<p><b>Збірки:</b> «Часослов» (1905), «Нові поезії» (1907–1908), «Дуїнські елегії», «Сонети до Орфея» (1922); роман «Записки Мальте Лаурідса Бріґґе».</p>
<h4>Своєрідність поглядів і поетики</h4>
<ul><li>пошук Бога не в церкві, а в собі й у світі; Бог — «сусід», що росте разом із людиною;</li><li><b>«вірші-речі»</b>: глибоке споглядання предмета, крізь який відкривається суть буття («Пантера»);</li><li>філософічність, теми самотності, смерті, мистецтва, перетворення;</li><li>переосмислення античних міфів;</li><li>досконалість форми, музичність, складна метафорика.</li></ul>
<h4>«Згаси мій зір…» («Часослов»)</h4>
<p>Діалог ліричного героя з Богом: навіть позбавлений зору, слуху, ніг, вуст, серця — він відчуватиме й нестиме Бога «в крові». Любов до Бога (і до коханої — вірш присвячено Лу Андреас-Саломе) сильніша за будь-які втрати.</p>
<h4>«Орфей, Еврідіка, Гермес» («Нові поезії»)</h4>
<p>У Рільке Еврідіка, яку Орфей виводить з Аїду, вже «повна своєю смертю», байдужа до земного: коли Орфей обертається, вона питає: «Хто?» Міф переосмислено як притчу про межу життя й смерті, мистецтво й неможливість повернути минуле.</p>`,

// 15 Лорка
{info:`<p><b>Федеріко Ґарсіа Лорка</b> (1898–1936) — іспанський поет і драматург.</p>
<ul><li>Народився в селі Фуентевакерос біля <b>Гранади</b> (Андалусія); талановитий музикант і художник, друг С. Далі й Л. Бунюеля.</li><li>Збирав андалузький фольклор, створив студентський театр «Ла Баррака», що мандрував селами Іспанії.</li><li>На початку громадянської війни, у серпні 1936 р., розстріляний франкістами; місце поховання невідоме.</li></ul>
<p><b>Твори:</b> «Поема про канте хондо», «Циганський романсеро» (1928), «Поет у Нью-Йорку»; драми «Криваве весілля», «Йерма», «Дім Бернарди Альби».</p>
<h4>Жанрове розмаїття лірики</h4>
<p><b>Романси</b> (сюжетні вірші на фольклорній основі), <b>касиди й газели</b> (східні форми), пісні, вірші в дусі <b>канте хондо</b> («глибокого співу» андалузьких циган).</p>
<h4>Образи й символи</h4>
<ul><li><b>Місяць</b> — смерть, фатум; <b>гітара</b> — душа Андалусії, плач; <b>кінь</b> — пристрасть, доля, смерть; <b>ніж</b> — насильство; зелений колір — життя й смерть водночас («Зелено, як я люблю, зелено»).</li><li>Сміливі метафори, близькість до сюрреалізму, фольклорна музичність.</li></ul>
<h4>Поезії</h4>
<p><b>«Гітара»</b> («Поема про канте хондо»): гітара плаче, і її неможливо зупинити — вона плаче «за далеким», як вода, як вітер; це образ одвічного смутку. <b>«Про царівну Місяцівну»</b> («Романс про місяць, місяць»): Місяць приходить до кузні й забирає циганську дитину — смерть приходить у красивій подобі. Українською Лорку перекладали <b>Микола Лукаш</b>, <b>Василь Стус</b>.</p>`,

// 17 Антиутопія
{info:`<p><b>Утопія</b> (грец. «місце, якого немає») — твір про ідеальне суспільство (Т. Мор «Утопія», 1516; Т. Кампанелла «Місто Сонця»). <b>Антиутопія</b> — жанр, що зображує суспільство, у якому спроба втілити утопічний ідеал призвела до тоталітаризму й знищення особистості. Антиутопія — твір-<b>застереження</b>.</p>
<h4>Ознаки антиутопії</h4>
<ul><li>дія в майбутньому чи в умовному просторі;</li><li><b>тоталітарна держава</b>, що контролює всі сфери життя й навіть думки;</li><li>знищення особистості, свободи, кохання, родини, пам'яті, культури;</li><li>герой-«бунтар», що прозріває й вступає в конфлікт із системою (і найчастіше зазнає поразки);</li><li>пропаганда, культ вождя, страх, стеження, нова мова;</li><li>фантастика, гротеск, сатира, алегорія.</li></ul>

// 24 Проза 2-ї пол. XX ст. Гемінґвей
{info:`<h4>Провідні тенденції прози другої половини XX ст.</h4>
<ul><li>осмислення досвіду Другої світової війни й тоталітаризму;</li><li><b>екзистенціальні</b> пошуки сенсу існування, гідності, свободи;</li><li>звернення до <b>міфу й притчі</b>, символічність;</li><li><b>магічний реалізм</b> (Латинська Америка);</li><li>поєднання реалізму й модернізму, згодом — <b>постмодернізм</b>;</li><li>розвиток національних літератур Азії, Африки, Латинської Америки.</li></ul>
<h4>Ернест Міллер Гемінґвей (1899–1961)</h4>
<ul><li>Американський письменник; народився в Оук-Парку біля Чикаго; лікар-батько прищепив любов до риболовлі й полювання.</li><li>Перша світова війна — водій санітарної машини в Італії, тяжке поранення. Покоління, скалічене війною, Гертруда Стайн назвала <b>«втраченим поколінням»</b>.</li><li>Кореспондент в Іспанії, учасник Другої світової війни; мисливець на сафарі, рибалка на Кубі.</li><li>Твори: «І сонце сходить», «Прощавай, зброє!», «По кому подзвін», повість <b>«Старий і море»</b> (1952) — Пулітцерівська премія (1953), <b>Нобелівська премія (1954)</b>.</li><li>Наклав на себе руки 1961 р.</li></ul>
<h4>«Кодекс честі» героїв Гемінґвея</h4>
<p>Мужність, стійкість, гідність у боротьбі з обставинами й самим собою; стриманість почуттів; професіоналізм; вірність собі навіть у поразці. Принцип <b>«айсберга»</b>: на поверхні — 1/8 змісту, головне — у підтексті.</p>
<h4>Три плани повісті «Старий і море»</h4>

// 25 Старий і море: символіка, Сантьяго, притча
{info:`<h4>Образ Сантьяго</h4>
<p>Старий кубинський рибалка, худий, з глибокими зморшками, але з <b>веселими, незламними очима</b> кольору моря. Він бідний, самотній, але сповнений гідності, терпіння, любові до моря й усього живого. Сантьяго — «чемпіон» (у юності переміг у двобої на руках), що й у старості доводить свою майстерність і силу духу. Його кредо: <b>«Людина створена не для того, щоб терпіти поразку. Людину можна знищити, але не можна перемогти»</b>.</p>

<tr><td><b>Леви на березі Африки</b></td><td>молодість, сила, мрія, гармонія світу</td></tr>

{info:`<p><b>Ґабріель Ґарсіа Маркес</b> (1927–2014) — колумбійський письменник, журналіст, лауреат <b>Нобелівської премії 1982 р.</b> «за романи й оповідання, у яких фантастичне й реальне поєднуються в багатому світі уяви, що відображає життя й конфлікти континенту».</p>

<h4>Магічний реалізм</h4>
<p><b>Магічний реалізм</b> — художній напрям (особливо в латиноамериканській літературі XX ст.), у якому <b>реальне й фантастичне</b> поєднуються як рівноправні частини буття; диво подається буденно, без подиву оповідача.</p>
<ul><li>опора на міфи, фольклор, вірування;</li><li>гіпербола, гротеск, іронія;</li><li>циклічність часу, мотив самотності;</li><li>соціальна й філософська проблематика.</li></ul>

// 27 Стариган із крилами: образ янгола + РМ
{info:`<h4>Символічний зміст образу янгола</h4>
<ul><li>Янгол — <b>диво, духовне начало</b>, яке з'являється в бідному світі, але люди його не впізнають: бачать лише старого, хворого, брудного чоловіка.</li><li>Він терплячий, мовчазний, страждає від людської жорстокості (його печуть розпеченим тавром, кидають каміння), але не мститься.</li><li>Янгол — дзеркало, у якому видно <b>моральну деградацію</b> людей: прагматизм, жадібність, байдужість, жорстокість, примітивну цікавість.</li><li>Можливо, саме янгол вилікував дитину й приніс достаток — але подяки не дочекався.</li><li>Він злітає навесні: духовне не можна втримати в курнику.</li></ul>
<h4>Відображення моральної деградації</h4>

<h4>Розвиток мовлення №4 (письмово)</h4>
<p><b>Твір-роздум</b> на тему: «Відображення моральних цінностей людства у творчості письменників XX ст.» (на матеріалі Гемінґвея, Маркеса, Камю, Белля та ін.).</p>

// 28 Позакласне читання №1: Еліот
{info:`<p><b>Томас Стернз Еліот</b> (1888–1965) — англо-американський поет, драматург, критик; лауреат <b>Нобелівської премії 1948 р.</b></p>
<ul><li>Народився в Сент-Луїсі (США), навчався в Гарварді, Сорбонні, Оксфорді; з 1914 р. жив в Англії, 1927 р. прийняв британське громадянство.</li><li>Працював у банку, згодом — редактором видавництва «Фабер і Фабер».</li><li>Один із творців англомовного <b>модернізму</b>; поема <b>«Безплідна земля»</b> (1922) — образ духовної кризи Європи після Першої світової війни.</li><li>Збірка віршів для дітей «Котознавство від Старого Опосума» стала основою мюзиклу «Коти».</li></ul>
<h4>Особливості поезії</h4>

<h4>Поезії для читання (1–2 за вибором)</h4>

// 29 Театр абсурду. Постмодернізм
{info:`<h4>Театр абсурду</h4>
<p><b>Театр абсурду</b> — явище театрального авангарду 1950–1960-х рр., що зображує абсурдність людського існування, неможливість спілкування й пошуку сенсу. Термін запровадив критик Мартін Есслін (1961).</p>

{info:`<p><b>Милорад Павич</b> (1929–2009) — сербський письменник, поет, історик літератури, перекладач; один із найяскравіших постмодерністів.</p>
<ul><li>Народився в Белграді; професор, дослідник сербського бароко.</li><li>Світову славу приніс <b>«Хозарський словник»</b> (1984) — «роман-лексикон», який можна читати в будь-якому порядку; існує в «чоловічій» і «жіночій» версіях.</li><li>Інші твори: «Пейзаж, намальований чаєм» (роман-кросворд), «Внутрішній бік вітру» (роман-клепсидра), «Остання любов у Константинополі» (роман-ворожіння на картах Таро).</li><li>Кілька разів висувався на Нобелівську премію.</li></ul>
<h4>«Скляний равлик» (оповідання для комп'ютера й циркуля)</h4>
<ul><li><b>Жанр</b>: авторське визначення — «оповідання для комп'ютера й циркуля»; читати його треба по колу, обираючи шлях.</li><li><b>Герої</b>: самотня панна Хатчепсут і Давид Сенмут (імена з історії Єгипту — цариця Хатшепсут і її архітектор Сенмут).</li><li><b>Сюжет</b>: герої крадуть речі (свічку-равлика й запальничку) і дарують їх одне одному; твір починається й закінчується їхньою зустріччю.</li><li><b>Два фінали</b>: вибух від взаємодії крадених речей (прагматичний світ приречений) — або свічка-равлик горить (любов долає самотність).</li></ul>
<h4>Риси постмодернізму</h4>
<ul><li><b>гра з текстом і читачем</b>, вибір шляхів читання;</li><li>«відмова від монопольного права автора на істину»;</li><li><b>інтертекстуальність</b>: іронічне переосмислення новели О. Генрі «Дари волхвів»;</li><li>центральна метафора <b>скляного равлика</b> — людина, замкнута й крихка, але здатна горіти для інших;</li><li>поєднання реального й фантастичного (сни, знаки).</li></ul>`,

{info:`<p><b>Таїр Халілов</b> (нар. 1940) — сучасний український кримськотатарський письменник.</p>
<ul><li>Народився 6 вересня 1940 р. в селі Карабай (нині Відродження) Старокримського району.</li><li>Дитиною пережив <b>депортацію кримських татар</b> 1944 р.; осиротів на чужині, виховувався в дитячому будинку.</li><li>Закінчив Ташкентський сільськогосподарський інститут (агроном-виноградар). 1971 р. приїхав до Криму, але кримському татарину було важко влаштуватися; остаточно повернувся на батьківщину в травні 1990 р.</li><li>Член Спілки письменників України; дбає про збереження національної пам'яті, мови, культури свого народу.</li><li>Повість «Забрана Батьківщина» — документ геноциду кримських татар; «До останнього подиху» увійшла до збірки «Самотній пілігрим».</li></ul>
<h4>«До останнього подиху»</h4>
<ul><li><b>Сюжет</b>: останній день життя старого, прикутого до ліжка; поки він намагається дістатися дверей, у його пам'яті постає все життя: дитинство біля моря, перше кохання, війна, депортація, Узбекистан, зрада приятеля, каторга, геологічна експедиція, зустріч із коханою з юності, родина, смерть дружини, старість.</li><li><b>Діалог героя-дитини з собою дорослим</b>.</li><li><b>Тема депортації</b>: вигадана радянською ідеологією «національна вина», виселення 1944 р., заселення будинків кримських татар іншими людьми; свавілля влади.</li><li><b>Образ Бекира</b> — людина, що ніколи не здається, зберігає почуття гідності й глибинний зв'язок зі своїм народом.</li></ul>

{info:`<p><b>Маркус Френк Зузак</b> (нар. 1975) — австралійський письменник; народився в Сіднеї в родині емігрантів з Австрії й Німеччини. Твори: «Крадійка книжок» (2005), «Посланець», романи про братів Вулфів, «Міст Клея». Поштовхом до «Крадійки книжок» стали розповіді матері про війну в Німеччині. Роман перекладено 40 мовами; екранізація 2013 р. («Книжковий злодій»). Українською переклала <b>Наталія Гоїн</b>.</p>
<h4>Історія Лізель Мемінгер</h4>
<p>Дівчинка, яку мати віддала прийомним батькам Гансу й Розі Губерманам на Небесній вулиці; брат помер у дорозі. Лізель учиться читати, «краде» книжки (на цвинтарі, з нацистського вогнища, з бібліотеки дружини мера), дружить із Руді Штайнером, переховує разом із прийомними батьками єврея Макса Ванденбурга. Під час бомбардування вона єдина виживає, бо пише в підвалі свою книжку.</p>
<h4>Проблематика</h4>
<ul><li><b>Викриття нацизму</b>: культ фюрера, спалення книжок, переслідування євреїв, колони в'язнів до Дахау, страх і доноси.</li><li><b>«Маленькі люди»</b> в системі: одні сліпо служать нацизму, інші (Губермани, Руді, сусіди) зберігають людяність, ризикуючи життям.</li><li><b>Людяність, добро, порятунок</b>: Ганс дає хліб в'язневі, Губермани переховують Макса, Лізель кидає їжу полоненим.</li><li><b>Книга як символ</b> духовності: слова можуть убивати («Майн кампф») і рятувати (книжки Лізель, книжка Макса «Струшувач слів»).</li></ul>
<h4>Форми оповіді</h4>
<p>Оповідач — <b>Смерть</b> (у чоловічому роді), утомлений і співчутливий; він заздалегідь «видає» фінал, вставляє коментарі, списки, визначення. Яскраві метафори й кольори («небо кольору темного шоколаду»), фрагментарність, книжки-вставки Макса з малюнками.</p>`,

<ul><li>Народився в Дубліні; навчався в єзуїтських школах і Дублінському університеті.</li><li>1904 р. разом із Норою Барнакл назавжди покинув Ірландію; жив у Трієсті, Цюриху, Парижі, але всі його твори — про <b>Дублін</b>.</li><li>Збірка оповідань «Дублінці», роман «Портрет митця замолоду», «<b>Улісс</b>» (1922) — один день із життя Леопольда Блума (16 червня, «Блумсдей»), що відтворює «Одіссею» Гомера; «Поминки за Фіннеґаном».</li><li>Майстер <b>«потоку свідомості»</b>, мовних експериментів.</li><li>Українською Джойса перекладали Ростислав Доценко, Олександр Терех, Олександр Мокровольський та ін.</li></ul>
<h4>«Джакомо Джойс» (1914, опубл. 1968)</h4>

kafka:{name:"«Перевтілення»", author:"Франц Кафка, 1912 (опубл. 1915); укр. переклад Євгена Поповича", genre:"Новела (модерністська, з елементами фантастики й абсурду)",
about:"Новела про комівояжера Ґреґора Замзу, який одного ранку прокидається величезною комахою. Фантастична подія подана буденно, а головне в творі — реакція родини: людина, поки приносить гроші, потрібна, а коли стає безпорадною, — зайва. Це образ відчуження людини у світі.",
plot:["Ґреґор Замза, комівояжер, що утримує батьків і сестру, прокидається перетвореним на величезну комаху. Найбільше він хвилюється, що запізниться на роботу.","До квартири приходить прокурист (управитель) фірми; побачивши Ґреґора, він тікає. Батько палицею заганяє сина до кімнати.","Сестра Грета спочатку доглядає брата, приносить їжу; згодом вона й мати виносять з кімнати меблі.","Родина змушена працювати: батько стає службовцем банку, мати шиє білизну, Грета працює продавчинею; здають кімнату трьом квартирантам.","Батько кидає в Ґреґора яблука; одне застрягає в спині й гниє, рана не загоюється.","Ґреґор виповзає, слухаючи гру Грети на скрипці; квартиранти обурюються. Грета заявляє: «Ми мусимо його позбутися».","Уночі Ґреґор помирає, думаючи про родину з ніжністю. Служниця викидає його тіло, а родина з полегшенням їде за місто й мріє про майбутнє, помічаючи, що Грета стала вродливою дівчиною."],
heroes:[["Ґреґор Замза","«маленька людина», що жила лише для родини й роботи; втілення відчуження"],["Грета","сестра, яка з турботливої стає байдужою й жорстокою"],["Батько","деспотичний, ворожий до сина"],["Мати","любить сина, але слабка й безвольна"],["Прокурист","втілення бездушної системи праці"]]},

plague:{name:"«Чума»", author:"Альбер Камю, 1947", genre:"Роман-притча (філософський роман-хроніка)",
about:"Хроніка епідемії чуми в алжирському місті Оран у 194… році. Місто закрите карантином; кожен герой по-своєму відповідає на зло. Чума — алегорія фашизму, війни й будь-якого зла, що постійно загрожує людству; відповідь на нього — солідарність і чесне виконання свого обов'язку.",
plot:["Навесні в Орані з'являються мертві щури, люди хворіють на дивну гарячку. Лікар Бернар Ріє першим наполягає, що це чума.","Влада неохоче оголошує епідемію; місто закривають. Люди опиняються відрізаними від рідних, панують страх, самотність, звичка.","Жан Тарру організовує санітарні дружини добровольців; до них приєднуються дрібний службовець Жозеф Гран і, згодом, журналіст Раймон Рамбер, який спочатку хотів утекти до коханої.","Єзуїт отець Панлю спершу називає чуму Божою карою, але після болісної смерті дитини переживає кризу віри; він помирає.","Коттар, що нажився на контрабанді, радіє епідемії, бо вона рятує його від арешту.","Узимку епідемія відступає; брама міста відчиняється, люди радіють. Але Тарру помирає від чуми, а дружина Ріє — від хвороби в санаторії.","Оповідач, який виявляється лікарем Ріє, застерігає: бацила чуми ніколи не зникає, вона може прокинутися знову."],
heroes:[["Бернар Ріє","лікар, оповідач; чесно бореться з чумою, бо це його обов'язок"],["Жан Тарру","організатор санітарних дружин, прагне стати «святим без Бога»"],["Раймон Рамбер","журналіст, що обирає солідарність замість особистого щастя"],["Отець Панлю","священик, чия віра проходить випробування"],["Жозеф Гран","скромний службовець, «непомітний герой»"],["Коттар","людина, що наживається на чужому лихові"]]},

apollinaire:{name:"«Міст Мірабо», «Зарізана голубка й водограй»", author:"Ґійом Аполлінер, 1912 / 1914; «Міст Мірабо» — переклад Миколи Лукаша", genre:"Лірика: елегія; каліграма", poem:true,
about:"«Міст Мірабо» (збірка «Алкоголі», 1913) — елегія про кохання, що минає, як вода під паризьким мостом. «Зарізана голубка й водограй» (збірка «Каліграми», 1918) — вірш-малюнок, у якому рядки утворюють зображення голубки й фонтана.",
plotTitle:"Зміст і особливості поезій",
plot:["«Міст Мірабо»: під мостом тече Сена, разом із нею спливає кохання ліричного героя.","Рефрен: «Хай б'є годинник ніч настає / Минають дні а я ще є» (переклад Миколи Лукаша) — час минає, а людина лишається з пам'яттю.","Образ води — символ плинності часу й кохання; міст — символ сталості, людини, що стоїть над потоком.","Вірш написано без розділових знаків — ритм і пауза створюють «текучу» музику.","«Зарізана голубка й водограй»: рядки утворюють голубку (мир), фонтан (сльози за друзями) і вирву.","Поет згадує жінок, яких кохав, і друзів, що пішли на війну; фонтан плаче, «кров» — передчуття загибелі."],
heroes:[["Ліричний герой","самотня людина, що переживає втрату кохання й плинність часу, але знаходить силу жити"]]},

rilke:{name:"«Згаси мій зір…», «Орфей, Еврідіка, Гермес»", author:"Райнер Марія Рільке, 1901 / 1904", genre:"Філософська лірика", poem:true,
about:"«Згаси мій зір…» зі збірки «Часослов» — молитва-освідчення: ліричний герой здатен відчувати Бога всіма почуттями навіть без зору, слуху й мови. «Орфей, Еврідіка, Гермес» — переосмислення античного міфу: Еврідіка вже не належить земному життю, вона «повна своєю смертю».",
plotTitle:"Зміст поезій",
plot:["«Згаси мій зір…»: навіть позбавлений зору й слуху, ліричний герой бачитиме й чутиме Бога; без ніг прийде до нього, без вуст — покличе.","Якщо вирвуть серце — битиметься мозок; якщо запалять мозок — понесе Бога в крові. Любов до Бога — сутність людини.","«Орфей, Еврідіка, Гермес»: співець Орфей виводить дружину з царства мертвих; його супроводжує бог Гермес.","Орфей нетерпляче йде попереду, а Еврідіка, тиха й зосереджена, вже живе «в собі», у новому стані.","Коли Орфей обертається, Гермес каже: «Він обернувся», — а Еврідіка питає: «Хто?» Вона вже не впізнає чоловіка.","Рільке показує межу між життям і смертю, неможливість повернути минуле, самотність людини."],
heroes:[["Ліричний герой","людина, що шукає Бога в собі й у світі"],["Орфей","митець, що прагне подолати смерть"],["Еврідіка","образ людини, яка перейшла межу життя"],["Гермес","провідник душ"]]},

lorca:{name:"«Про царівну Місяцівну», «Гітара»", author:"Федеріко Ґарсіа Лорка, 1924–1928 / 1921", genre:"Лірика: романс, вірш з «Поеми про канте хондо»", poem:true,
about:"Поезії іспанського поета, що поєднують фольклор Андалусії, циганські мотиви й сміливі метафори. «Гітара» відтворює плач циганської гітари, у «Романсі про царівну Місяцівну» (зі збірки «Циганський романсеро») Місяць-смерть забирає циганську дитину.",
plotTitle:"Зміст поезій",
plot:["«Гітара»: починається плач гітари; марно її зупиняти — вона плаче, як вода, як вітер над снігами.","Гітара плаче «за далеким», за стрілою без мети, за вечором без ранку, за першим мертвим птахом на гілці.","Образ гітари — символ душі Андалусії, вічного смутку й пристрасті.","«Про царівну Місяцівну»: Місяць у сукні з тубероз приходить до кузні; хлопчик дивиться на нього.","Хлопчик просить Місяць тікати, бо прийдуть цигани й скують з нього намиста й персні.","Цигани повертаються — а хлопчик уже мертвий: Місяць забрав його на небо. Місяць — символ смерті."],
heroes:[["Гітара","одухотворений образ, голос народної душі"],["Місяць","символ смерті й таємниці"],["Хлопчик","невинна жертва фатуму"],["Цигани","вільний народ, люди пристрасті й долі"]]},

orwell:{name:"«1984»", author:"Джордж Орвелл (Ерік Артур Блер), 1949; укр. переклад Віктора Шовкуна", genre:"Роман-антиутопія",
about:"Роман про тоталітарну державу Океанію, де Партія на чолі зі Старшим Братом контролює кожну думку людини. Вінстон Сміт намагається зберегти свободу й кохання, але система ламає його. Твір став застереженням людству; вирази «Старший Брат», «новомова», «двоєдумство» увійшли в мову.",
plot:["Лондон, головне місто Злітної смуги I в державі Океанія. Скрізь плакати «Старший Брат пильнує за тобою», телекрани стежать за людьми.","Вінстон Сміт працює в Міністерстві Правди: переписує старі газети, щоб минуле відповідало нинішній лінії Партії.","Вінстон починає вести таємний щоденник — «думкозлочин» — і пише: «Геть Старшого Брата!»","Він закохується в Джулію, і вони зустрічаються таємно в кімнатці над крамницею старого Черрінгтона.","Вінстон довіряється високопосадовцю О'Браєну, вважаючи його членом підпільного Братства, і читає книгу Ґолдстейна.","Закоханих заарештовує Поліція думок: Черрінгтон і О'Браєн виявляються агентами.","У Міністерстві Любові Вінстона катують; у кімнаті 101, де на людину чекає найбільший її страх (щури), він зраджує Джулію.","Зламаний Вінстон сидить у кафе «Під каштаном»: «Він любив Старшого Брата»."],
heroes:[["Вінстон Сміт","«останній чоловік у Європі», що намагається зберегти людяність і правду, але зламаний системою"],["Джулія","бунтарка, що протестує проти Партії через особисте життя й кохання"],["О'Браєн","член Внутрішньої партії, кат-ідеолог, втілення влади заради влади"],["Старший Брат","символ тоталітарної влади, можливо, неіснуючий"],["Черрінгтон","крамар — агент Поліції думок"]]},

kurazh:{name:"«Матінка Кураж та її діти»", author:"Бертольт Брехт, 1939 (поставлено 1941); укр. переклад Марка Зісмана", genre:"Драма (хроніка з часів Тридцятилітньої війни), «епічний театр»",
about:"П'єса про маркітантку Анну Фірлінг на прізвисько Матінка Кураж, яка заробляє на війні, торгуючи з фургона, — і втрачає через війну всіх трьох дітей. Брехт попереджає: хто хоче наживатися на війні, той мусить їй заплатити.",
plot:["Тридцятилітня війна (1618–1648). Маркітантка Матінка Кураж із трьома дітьми — Ейліфом, Швейцеркасом і німою Катрін — тягає фургон за військом.","Вербувальник забирає хороброго Ейліфа в солдати, поки мати торгується.","Чесного Швейцеркаса, скарбника полку, захоплюють вороги; мати надто довго торгується за викуп — сина розстрілюють. Вона мусить вдати, що не знає його.","Ейліфа, який грабував селян і вбив людей у мирний час (те, що на війні вважали подвигом), страчують.","Кураж радіє, коли мир зривається: «Війна годує».","Німа Катрін, рятуючи місто Галле від нічного нападу, б'є в барабан на даху й гине від куль.","Матінка Кураж, нічого не зрозумівши, сама впрягається у фургон і йде за військом."],
heroes:[["Матінка Кураж (Анна Фірлінг)","мати й торговка, що намагається жити війною; трагічна й засліплена жагою наживи"],["Ейліф","хоробрий син, жертва «героїзму»"],["Швейцеркас","чесний син, жертва чесності"],["Катрін","німа донька, втілення доброти й самопожертви"],["Священик, Кухар","люди, яких війна позбавила моральних орієнтирів"]]},

boll:{name:"«Подорожній, коли ти прийдеш у Спа…»", author:"Генріх Белль, 1950", genre:"Антивоєнне оповідання (внутрішній монолог)",
about:"Тяжко пораненого юного солдата несуть до шпиталю, облаштованого в гімназії, і він поступово впізнає свою школу, з якої три місяці тому пішов на війну. Назва — обірвана епітафія спартанцям, полеглим біля Фермопіл, яку юнак сам писав на дошці. Оповідання викриває, як нацистська школа готувала дітей до смерті.",
plot:["Пораненого солдата несуть сходами будинку; він бачить знайомі речі: картини, погруддя, дошку з іменами полеглих.","Він сумнівається, чи це його гімназія: так виглядають усі гімназії.","Його кладуть в актовій залі, перетвореній на операційну.","На дошці він бачить свій почерк: «Подорожній, коли ти прийдеш у Спа…» — фраза, яку не вмістив, бо писав надто великими літерами.","Юнак розуміє, що він у своїй школі, і бачить, що в нього немає обох рук і правої ноги.","Він просить молока; пожежник Біргелер, колишній шкільний сторож, упізнає його."],
heroes:[["Юний солдат","безіменна жертва війни, учорашній школяр"],["Біргелер","колишній сторож гімназії, тепер пожежник"]]},

celan:{name:"«Фуга смерті»", author:"Пауль Целан, 1944–1945 (опубл. 1948); укр. переклад Миколи Бажана", genre:"Вірш-реквієм про Голокост", poem:true,
about:"Один із найвідоміших творів про Голокост. Вірш побудований як музична фуга: повторювані мотиви переплітаються, створюючи образ нескінченного жаху концтабору, де в'язні копають собі могилу під музику.",
plotTitle:"Ключові образи й мотиви",
plot:["«Чорне молоко світання» — оксиморон: те, що мало б живити, стає отрутою; щоденне пиття смерті.","«Могила в повітрі де лежати не буде тісно» — дим крематоріїв.","«Один чоловік живе в хаті… він зі зміями грає», пише листа до Німеччини про золотисту косу Маргарити — нацист-кат, освічений і сентиментальний.","В'язні мусять копати могилу й грати до танцю — музика стає знаряддям знущання.","«Смерть це з Німеччини майстер» — рефрен-звинувачення.","Протиставлення: «твоя золотиста коса Маргарито» (німецький ідеал, відсилання до Ґете) і «твоя попеляста коса Суламіф» (єврейська жінка з «Пісні пісень», жертва)."],
heroes:[["«Ми»","в'язні концтабору, приречені на смерть"],["Чоловік у будинку","кат, що поєднує культуру й жорстокість"],["Маргарита і Суламіф","символи двох народів — катів і жертв"]]},

oldman:{name:"«Старий і море»", author:"Ернест Міллер Гемінґвей, 1952; укр. переклад Володимира Митрофанова", genre:"Повість-притча",
about:"Повість про старого кубинського рибалку Сантьяго, який після 84 днів без улову виходить далеко в море, три дні бореться з величезною рибою, перемагає її, але не може вберегти від акул. Твір утверджує: «Людина створена не для того, щоб терпіти поразку. Людину можна знищити, але не можна перемогти».",
plot:["Старий рибалка Сантьяго 84 дні не впіймав жодної риби. Хлопчик Маноліно, якого він навчив рибалити, з волі батьків пішов на інший човен, але допомагає старому.","На 85-й день Сантьяго виходить далеко в море. Велика риба (марлін) бере наживку й тягне човен у відкрите море.","Два дні й дві ночі старий тримає линву, страждаючи від болю, втоми й голоду; він розмовляє з рибою, називаючи її братом, згадує левів на березі Африки й бейсболіста ДіМаджо.","На третій день Сантьяго гарпуном убиває рибу, довшу за його човен, і прив'язує її до борту.","Акули, відчувши кров, нападають на здобич. Старий бореться з ними гарпуном, ножем, веслом, але від риби лишається тільки скелет.","Знесилений Сантьяго повертається, ледве доходить до хатини й засинає. Рибалки дивуються величезному скелету; Маноліно плаче й обіцяє знову рибалити зі старим.","Старий спить, і йому сняться леви."],
heroes:[["Сантьяго","старий рибалка, втілення мужності, стійкості й гідності людини"],["Маноліно","хлопчик, учень і друг Сантьяго; символ продовження життя, любові й віри"],["Риба (марлін)","гідний суперник, символ мрії, мети, сил природи"],["Акули","символ руйнівних, ворожих сил"]]},

angel:{name:"«Стариган із крилами»", author:"Ґабріель Ґарсіа Маркес, 1968; укр. переклад Маргарити Жердинівської", genre:"Оповідання (магічний реалізм)",
about:"Оповідання про старого янгола, який упав у двір бідного подружжя. Замість дива люди бачать у ньому цікавинку: тримають у курнику, показують за гроші. Маркес у буденному тоні розповідає про диво, щоб показати моральне зубожіння людей, які розучилися бачити високе.",
plot:["На третій день дощу Пелайо знаходить у дворі старого з величезними брудними крилами; їхня дитина в цей час хворіє.","Сусідка вирішує, що це янгол, який прилетів по дитину. Пелайо замикає його в курнику.","Отець Гонзага сумнівається, що це янгол, бо той не знає латини, і пише до Рима.","Елісенда й Пелайо беруть з цікавих по п'ять центаво за погляд на янгола й швидко багатіють.","Натовп переключається на нове диво — жінку, яку за непослух батькам перетворено на павука.","Подружжя будує новий будинок, а янгол лишається в старому курнику, мало не помирає від вітряної віспи.","Навесні в янгола виростають нові пір'їни; він злітає й зникає за обрієм. Елісенда з полегшенням дивиться йому вслід."],
heroes:[["Стариган (янгол)","знедолене диво, яке люди не впізнали; символ духовного, що став непотрібним"],["Пелайо й Елісенда","прагматичне подружжя, що наживається на диві"],["Отець Гонзага","священик-догматик"],["Жінка-павук","символ дешевої сенсації, що витісняє справжнє диво"]]},

eliot:{name:"«Любовна пісня Дж. Альфреда Пруфрока», «Порожні люди»", author:"Томас Стернз Еліот, 1915 / 1925", genre:"Модерністська лірика", poem:true,
about:"Т. С. Еліот — англо-американський поет, лауреат Нобелівської премії 1948 р., автор поеми «Безплідна земля» (1922). Його вірші — про спустошеність, нерішучість і духовну кризу людини XX ст.",
plotTitle:"Зміст поезій",
plot:["«Пруфрок»: несміливий герой збирається на світський прийом і хоче освідчитися, але так і не наважується.","Він вимірює життя «кавовими ложечками», боїться осуду, відчуває, що старіє, — образ «маленької людини» модерного міста.","«Порожні люди»: «Ми порожні люди, ми опудала люди» — образ духовно спустошеного покоління після Першої світової війни.","Фінал: «Ось як кінчається світ — не вибухом, а скиглінням»."],
heroes:[["Пруфрок","нерішучий інтелігент, нездатний до вчинку"],["«Порожні люди»","покоління, що втратило віру й сенс"]]},

pavic:{name:"«Скляний равлик»", author:"Милорад Павич, 1998 (оповідання для комп'ютера й циркуля)", genre:"Постмодерністське оповідання з варіативним фіналом",
about:"Оповідання сербського постмодерніста, яке можна читати різними шляхами й обирати один із двох фіналів. Героїня панна Хатчепсут і Давид Сенмут обмінюються краденими подарунками — запальничкою й свічкою у формі скляного равлика. Твір — про самотність, прагматизм і можливість любові.",
plot:["Панна Хатчепсут у Белграді шукає подарунок; у її житті самотність і дивні сни (зокрема про «дзбан із двома шийками»).","Давид Сенмут, самотній чоловік, відвідує курси «Нові методи пошуку роботи»; він краде декоративну свічку-равлика.","Хатчепсут цупить запальничку. Перед Новим роком вони знайомляться й обмінюються краденими речами як подарунками.","Читач обирає фінал. У першому — запальничка, поєднана зі свічкою, вибухає: світ, побудований на прагматизмі, приречений.","У другому — свічка-равлик горить: любов долає замкнутість людини, сон Хатчепсут про два келихи, наповнені одним вином, здійснюється."],
heroes:[["Панна Хатчепсут","самотня жінка, що мріє про любов"],["Давид Сенмут","самотній чоловік, відчужений від світу"],["Скляний равлик","метафора людини: замкнутої, крихкої, але здатної горіти для інших"]]},

khalilov:{name:"«До останнього подиху»", author:"Таїр Халілов (нар. 1940), кримськотатарський письменник", genre:"Повість (оповідання) з елементами екзистенціалізму",
about:"Твір про останній день життя старого кримського татарина Бекира, прикутого до ліжка. Поки він намагається дістатися до дверей, щоб відчинити тому, хто дзвонить, у пам'яті постає все його життя — і трагічна доля кримськотатарського народу, депортованого 1944 р.",
plot:["Старий хворий чоловік лежить сам у квартирі; хтось дзвонить у двері, і він намагається до них дістатися, то втрачаючи свідомість, то приходячи до тями.","Спогади повертають його в дитинство на березі моря, до першого кохання.","Війна, а потім 1944 р. — депортація кримських татар через вигадану радянською владою «національну вину»; у їхні будинки заселяють інших людей.","Життя в Узбекистані, зрада приятеля, радянська каторга, звільнення, робота в геологічній експедиції.","Випадкова зустріч із жінкою, яку кохав у юності, одруження, народження сина, смерть дружини, старість.","У творі є діалог героя-дитини з самим собою дорослим; до останнього подиху він не здається й зберігає гідність і зв'язок зі своїм народом."],
heroes:[["Бекир","людина, що ніколи не здається, зберігає гідність і пам'ять свого народу"],["Кохана дружина","любов і опора героя"],["Кримськотатарський народ","колективний образ, жертва депортації"]]},

thief:{name:"«Крадійка книжок»", author:"Маркус Зузак, 2005; укр. переклад Наталії Гоїн", genre:"Роман (історичний, роман виховання)",
about:"Роман про дівчинку Лізель Мемінгер у нацистській Німеччині, яка, навчившись читати, збагнула силу Слова й вижила завдяки цій силі. Оповідач — Смерть, що збирає людські душі й співчуває людям.",
plot:["Зима 1939 р. Мати везе Лізель і її братика Вернера до прийомних батьків; хлопчик помирає в потязі. На цвинтарі Лізель підбирає свою першу книжку — «Посібник гробаря».","Лізель оселяється в містечку Молькінг на Гіммель-штрассе («Небесній вулиці») у Ганса й Рози Губерманів — маляра й пралі.","Ганс учить дівчинку читати ночами, виписуючи літери фарбою на стіні підвалу. Друг і перше кохання Лізель — сусідський хлопець Руді Штайнер.","Під час спалення «шкідливих» книжок на площі Лізель рятує з вогню книжку «Знизування плечима»; згодом бере книжки з бібліотеки дружини мера.","Губермани переховують у підвалі єврея Макса Ванденбурга; Макс пише для Лізель книжку на зафарбованих сторінках «Майн кампф».","Лізель читає вголос у бомбосховищі, підтримуючи сусідів.","Небесну вулицю бомблять; гинуть Ганс, Роза, Руді. Лізель, яка писала в підвалі свою книжку «Крадійка книжок», виживає. Згодом вона зустрічає Макса, що повернувся з концтабору; в епілозі літня Лізель помирає в Сіднеї, і Смерть повертає їй її книжку."],
heroes:[["Лізель Мемінгер","дівчинка, що через книжки й слова зберігає людяність"],["Ганс Губерман","прийомний батько, добрий, мужній, грає на акордеоні"],["Роза Губерман","прийомна мати, сувора на словах, але з великим серцем"],["Руді Штайнер","друг Лізель, хлопець «з волоссям кольору лимонів»"],["Макс Ванденбург","єврей-утікач, письменник і друг Лізель"],["Смерть","оповідач, утомлений і співчутливий спостерігач людських доль"]]},

joyce:{name:"«Джакомо Джойс»", author:"Джеймс Джойс, 1914 (опубл. 1968)", genre:"Ліричний етюд, прозова поема (потік свідомості)",
about:"Невеликий твір із фрагментів, у якому Джойс записав враження від закоханості вчителя англійської мови в Трієсті в юну учницю. Це «мозаїка» думок, образів і почуттів — приклад модерністської прози «потоку свідомості».",
plotTitle:"Зміст і особливості",
plot:["Оповідач — учитель англійської (alter ego Джойса, італійська форма імені — Джакомо) — дає уроки юній учениці з багатої родини.","Він милується нею, спостерігає, фіксує дрібниці: погляд, голос, рухи, тінь під віями.","Кохання лишається невисловленим і неможливим: він одружений, вона — майже дитина.","Твір складається з коротких фрагментів, розділених пропусками; думки, спогади й почуття перетікають одне в одне.","Наприкінці — визнання власної самотності: «Пиши, хай йому біс, пиши! На що ще ти здатний?»"],
heroes:[["Джакомо","учитель-поет, закоханий і самотній, що аналізує власні почуття"],["Учениця","образ витонченої юності, недосяжного ідеалу"]]}
};
const WORK_OF = {2:"faust",3:"faust",4:"faust",6:"kafka",7:"kafka",8:"plague",9:"plague",12:"apollinaire",13:"apollinaire",14:"rilke",15:"lorca",18:"orwell",19:"kurazh",20:"kurazh",21:"boll",22:"celan",24:"oldman",25:"oldman",26:"angel",27:"angel",28:"eliot",30:"pavic",31:"khalilov",32:"thief",33:"joyce"};


const LESSONS = META.map((m,i)=>Object.assign({}, m, L[i]||{}));

const SEC_STYLE = [
  {c:"#ef8a00", i:"📚", d:"✒️📖🎭🖋️🔤"},
  {c:"#3a6fd8", i:"💡", d:"🕊️🎶🌸⛵🐴"},
  {c:"#1c9aa8", i:"🌉", d:"🌼🏠💬❤️📱"},
  {c:"#7b4fd6", i:"🌙", d:"🏔️🐎⛪🔔🌊"},
  {c:"#8a5a2b", i:"🔎", d:"💰🏰🕯️🔥📜"},
  {c:"#1c9aa8", i:"🌉", d:"🐦⚖️🌳🏡📖"},
  {c:"#d6336c", i:"🎭", d:"🎄💃✉️🚪🎻"},
  {c:"#c0392b", i:"🔥", d:"📚🐕🌆🎧🕰️"},
  {c:"#2e8b57", i:"🌉", d:"📕✈️🎹🌍✨"}
];

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = store.get("zl11_done")||{};

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS[SECTIONS.length-1]; if(s&&s.name!==l.section) s=null; if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function firstPage(p){const m=/(\d+)/.exec(p||"");return m?+m[1]:0;}
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

function renderHome(){
  const total=LESSONS.length, dn=Object.keys(done).length;
  $("#app").innerHTML = `
  <div class="hero">
    <div>
      <div class="kick">Ліцей «Ясно» · 11 клас</div>
      <h1>Зарубіжна література</h1>
      <p>Уроки за календарно-тематичним плануванням: основна інформація, про що твір, сюжет і герої, тест для самоперевірки.</p>
      <div class="stats"><span><b>${SECTIONS.length}</b> розділів</span><span><b>${total}</b> тем</span><span><b>${dn}</b> пройдено</span></div>
    </div>
    <div class="hero-actions"><a class="btn" href="index.html">← Усі предмети</a>${themeBtn()}</div>
  </div>
  ${SECTIONS.map((s,si)=>`
  <section class="sec" style="--c:${s.st.c}">
    <div class="sec-h"><div class="num">${si+1}</div><h2>${esc(s.name)}</h2></div>
    <div class="sec-body">
      <div class="cover"><div class="ci">${s.st.i}</div><div><div class="rz">РОЗДІЛ ${si+1}</div><div class="rn">${esc(s.name)}</div></div><div class="doodles">${[...s.st.d].join("")}</div></div>
      <div class="cards">${s.items.map(i=>{const l=LESSONS[i];return `
        <a class="tcard" href="#${i+1}">${done[i+1]?'<span class="chk">✓</span>':""}
          <div class="tn">Тема ${l.tnum}${l.diag?'<span class="badge">тренувальна</span>':""}</div>
          <div class="tt">${esc(l.title)}</div>
          <div class="tm">${meta(l)}</div>
        </a>`}).join("")}</div>
    </div>
  </section>`).join("")}`;
  document.title="Зарубіжна література · 11 клас";
}

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

function renderLesson(i){
  const l=LESSONS[i], n=i+1, s=l.sec, si=SECTIONS.indexOf(s);
  const chips = `<span class="chip c">Розділ ${si+1}</span>`+(l.codes?l.codes.split(/,\s*/).map(c=>`<span class="chip">${esc(c)}</span>`).join(""):"")+(l.diag?'<span class="chip c">Тренувальна діагностувальна робота</span>':"")+`<span class="chip">${(l.q||[]).length} ${qWord((l.q||[]).length)}</span>`;
  const ktp = l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : "";
  const terms = (l.terms&&l.terms.length) ? `<div class="box"><h3><span class="bi">✎</span>Ключові поняття</h3>${l.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("")}</div>` : "";
  const w = W[WORK_OF[n]];
  const work = w ? `<div class="box work"><h3><span class="bi">📖</span>Про твір: ${esc(w.name)}</h3>
      <div class="wmeta"><span>✍ ${esc(w.author)}</span><span>◆ ${esc(w.genre)}</span></div>
      <h4>Про що твір</h4><p>${esc(w.about)}</p>
      <h4>${esc(w.plotTitle||"Короткий сюжет")}</h4><ol class="plot">${w.plot.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      <h4>${w.poem?"Ліричний герой":"Головні герої"}</h4><div class="heroes">${w.heroes.map(h=>`<div class="hero-c"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></div>`).join("")}</div>
    </div>` : "";
  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${si+1}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("zl11_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Зарубіжна література 11`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("zl11_theme",d.dataset.theme); }
const th=store.get("zl11_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
