."}, {"q": "Що означає символ `-` перед атрибутом на діаграмі класів?", "o": ["Приватний доступ", "Публічний доступ", "Захищений доступ", "Статичний атрибут"], "a": 0, "why": "`+` публічний, `-` приватний, `#` захищений."}]}, {"id": "t43", "topic": 4, "code": "4.3", "title": "Інтерфейс, тестування й архітектура програмних систем", "lessons": [{"n": 155, "title": "Проєктування інтерфейсу користувача", "blocks": [["p", "**Інтерфейс користувача** (UI) — усе, з чим людина взаємодіє: кнопки, форми, меню, повідомлення. **Досвід користувача** (UX) — загальне враження від роботи з продуктом: чи легко досягти мети, чи зрозуміло, що відбувається. Проєктування інтерфейсу починають з питань: хто користувачі, які їхні задачі, на яких пристроях вони працюють."], ["h", "Етапи проєктування"], ["ol", ["Дослідження користувачів, створення **персон** (узагальнених портретів).", "Сценарії використання і карта екранів.", "**Вайрфрейми** — схематичні ескізи розміщення елементів.", "**Прототип** — інтерактивна модель для перевірки з користувачами.", "Візуальний дизайн і передача в розробку."]], ["h", "Евристики Якоба Нільсена (вибрані)"], ["ul", ["**Видимість стану системи** — користувач бачить, що відбувається (індикатор завантаження, «Збережено»).", "**Відповідність реальному світу** — зрозумілі слова, а не технічні коди помилок.", "**Свобода і контроль** — можливість скасувати дію.", "**Узгодженість і стандарти** — однакові елементи поводяться однаково.", "**Запобігання помилкам** — підказки, підтвердження небезпечних дій.", "**Мінімалістичний дизайн** — нічого зайвого на екрані."]], ["h", "Доступність: контраст тексту"], ["p", "Настанови WCAG вимагають для звичайного тексту контрасту не менше **4,5 : 1** (рівень AA). Контраст можна обчислити за формулою відносної яскравості:"], ["code", "def luminance(hex_color):\n    \"\"\"Відносна яскравість кольору за формулою WCAG.\"\"\"\n    rgb = [int(hex_color[i:i + 2], 16) / 255 for i in (1, 3, 5)]\n    lin = [c / 12.92 if c <= 0.03928 else ((c + 0.055) / 1.055) ** 2.4 for c in rgb]\n    return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2]\n\n\ndef contrast(fg, bg):\n    l1, l2 = sorted([luminance(fg), luminance(bg)], reverse=True)\n    return (l1 + 0.05) / (l2 + 0.05)\n\n\nfor fg, bg in [(\"#000000\", \"#FFFFFF\"), (\"#777777\", \"#FFFFFF\"), (\"#1A4D8F\", \"#FFFFFF\")]:\n    ratio = contrast(fg, bg)\n    verdict = \"достатньо\" if ratio >= 4.5 else \"замало\"\n    print(f\"{fg} на {bg}: {ratio:.2f}:1 — {verdict}\")\n# Вивід:\n# #000000 на #FFFFFF: 21.00:1 — достатньо\n# #777777 на #FFFFFF: 4.48:1 — замало\n# #1A4D8F на #FFFFFF: 8.39:1 — достатньо"]]}, {"n": 156, "title": "Тестування програмного забезпечення", "blocks": [["p", "**Тестування** — перевірка відповідності програми вимогам і пошук дефектів. Тестування може показати наявність помилок, але не може довести їх повну відсутність. Чим раніше знайдено помилку, тим дешевше її виправити."], ["table", ["Рівень", "Що перевіряють"], [["Модульне (unit)", "Окремі функції та класи ізольовано"], ["Інтеграційне", "Взаємодію модулів між собою"], ["Системне", "Систему загалом відповідно до вимог"], ["Приймальне", "Чи готовий продукт для замовника (часто за участі користувачів)"]]], ["h", "Підходи і техніки"], ["ul", ["**Чорна скринька** — тестувальник не бачить коду, перевіряє вхід і вихід.", "**Біла скринька** — тести будують з урахуванням коду, щоб пройти всі гілки.", "**Класи еквівалентності** — вхідні дані ділять на групи, що обробляються однаково, і беруть по одному представнику з кожної.", "**Граничні значення** — перевіряють межі діапазонів (для 1–12: 0, 1, 12, 13), бо саме там найчастіше помиляються.", "**Регресійне тестування** — повторний запуск тестів після змін, щоб переконатися, що нічого не зламалося."]], ["h", "Модульні тести в Python"], ["code", "import unittest\n\n\ndef grade_category(points):\n    \"\"\"Рівень навчальних досягнень за 12-бальною шкалою.\"\"\"\n    if not 1 <= points <= 12:\n        raise ValueError(\"Бал має бути від 1 до 12\")\n    if points <= 3:\n        return \"початковий\"\n    if points <= 6:\n        return \"середній\"\n    if points <= 9:\n        return \"достатній\"\n    return \"високий\"\n\n\nclass TestGradeCategory(unittest.TestCase):\n    def test_boundaries(self):            # граничні значення\n        self.assertEqual(grade_category(1), \"початковий\")\n        self.assertEqual(grade_category(3), \"початковий\")\n        self.assertEqual(grade_category(4), \"середній\")\n        self.assertEqual(grade_category(9), \"достатній\")\n        self.assertEqual(grade_category(10), \"високий\")\n        self.assertEqual(grade_category(12), \"високий\")\n\n    def test_invalid(self):               # некоректні дані\n        for bad in (0, 13, -5):\n            with self.assertRaises(ValueError):\n                grade_category(bad)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n# Запуск: python3 test_grades.py\n# Очікуваний результат: Ran 2 tests ... OK"], ["note", "Добрий тест-кейс містить: передумови, вхідні дані, кроки, **очікуваний результат**. Звіт про дефект — кроки відтворення, очікуваний і фактичний результат."]]}, {"n": 157, "title": "Оцінювання програмного забезпечення", "blocks": [["p", "Оцінювання ПЗ відповідає на питання: наскільки програма добра для своїх користувачів і для команди, що її супроводжує. Міжнародний стандарт **ISO/IEC 25010** описує модель якості продукту. У редакції 2011 року вона містить вісім характеристик:"], ["table", ["Характеристика", "Питання для оцінювання"], [["Функціональна придатність", "Чи робить програма все потрібне і правильно?"], ["Продуктивність", "Як швидко працює і скільки ресурсів споживає?"], ["Сумісність", "Чи працює поруч з іншими системами, обмінюється даними?"], ["Зручність використання", "Чи легко навчитися і працювати?"], ["Надійність", "Як часто збоїть, чи відновлюється після збою?"], ["Захищеність", "Чи захищені дані від несанкціонованого доступу?"], ["Супровідність", "Чи легко змінювати і тестувати код?"], ["Переносність", "Чи легко перенести на іншу платформу?"]]], ["h", "Метрики коду"], ["p", "Частину якостей вимірюють метриками: кількість рядків коду, покриття тестами (яка частка коду виконується під час тестів), **цикломатична складність** — кількість незалежних шляхів у програмі. Спрощено її рахують як кількість точок рішення (`if`, `elif`, цикли, логічні `and`/`or`) плюс 1. Функції зі складністю понад 10 зазвичай радять розбивати на менші."], ["code", "import ast\n\nSOURCE = \"\"\"\ndef classify(x):\n    if x < 0:\n        return \"від'ємне\"\n    elif x == 0:\n        return \"нуль\"\n    for d in range(2, x):\n        if x % d == 0:\n            return \"складене\"\n    return \"просте або 1\"\n\"\"\"\n\nDECISIONS = (ast.If, ast.For, ast.While, ast.And, ast.Or, ast.ExceptHandler)\n\ntree = ast.parse(SOURCE)\nfor func in [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)]:\n    decisions = sum(isinstance(n, DECISIONS) for n in ast.walk(func))\n    print(f\"{func.name}: цикломатична складність = {decisions + 1}\")\n# Вивід:\n# classify: цикломатична складність = 5"], ["h", "Інші способи оцінювання"], ["ul", ["Код-рев'ю — перегляд коду колегами.", "Тестування зручності з реальними користувачами.", "Навантажувальне тестування — поведінка під великою кількістю запитів.", "Збирання відгуків і статистики помилок після випуску."]]]}, {"n": 158, "title": "Системна архітектура. Апаратні та програмні рішення", "blocks": [["p", "**Системна архітектура** описує всю інформаційну систему: апаратне забезпечення (сервери, мережі, пристрої користувачів), системне ПЗ (операційні системи, СКБД, вебсервери) і прикладні програми, а також зв'язки між ними. Архітектор обирає рішення з огляду на кількість користувачів, вимоги до надійності, безпеки і бюджет."], ["h", "Архітектурні моделі"], ["table", ["Модель", "Суть", "Переваги / недоліки"], [["Файл-сервер", "Дані на спільному диску, обробка на клієнтах", "Просто; погано масштабується"], ["Клієнт-сервер (дворівнева)", "Клієнт звертається до сервера бази даних", "Централізовані дані; логіка розпорошена по клієнтах"], ["Трирівнева", "Клієнт — сервер застосунку — сервер БД", "Логіка в одному місці, легше оновлювати"], ["Мікросервіси", "Багато незалежних сервісів", "Гнучке масштабування; складніше супроводжувати"]]], ["h", "Хмарні рішення"], ["ul", ["**IaaS** (інфраструктура як послуга) — оренда віртуальних серверів, мереж, сховищ.", "**PaaS** (платформа як послуга) — готове середовище для розгортання застосунків без налаштування серверів.", "**SaaS** (програма як послуга) — готовий застосунок через браузер (поштові сервіси, онлайн-офіс)."]], ["h", "Вибір апаратних і програмних рішень"], ["p", "Для невеликого закладу освіти, як правило, вигідніше використати SaaS-рішення (наприклад, електронний журнал у хмарі), ніж утримувати власний сервер: не потрібно стежити за обладнанням, резервними копіями й оновленнями. Власна інфраструктура доцільна, коли є особливі вимоги до зберігання даних або інтеграції."], ["note", "Для надійності передбачають **резервування** (дублювання серверів, каналів зв'язку) і регулярне **резервне копіювання** даних з перевіркою відновлення."]]}, {"n": 159, "title": "Стандарти та тренди у програмуванні", "blocks": [["p", "Стандарти роблять код зрозумілим для інших і сумісним з іншими системами. Розрізняють стандарти **мов** (специфікація Python, ECMAScript для JavaScript), **оформлення коду** (PEP 8 для Python), **документування** (PEP 257), **процесів і якості** (серії ISO/IEC), **вебу** (HTML, CSS від W3C і WHATWG, доступність WCAG)."], ["h", "Стиль коду: до і після"], ["code", "# Погано: незрозумілі імена, усе в один рядок, немає опису\ndef f(a,b): return [x for x in a if x>=b]\n\n\n# Добре: PEP 8, анотації типів (PEP 484) і рядок документації (PEP 257)\ndef filter_passed(scores: list[int], threshold: int = 4) -> list[int]:\n    \"\"\"Повертає бали, не менші за поріг зарахування.\"\"\"\n    return [score for score in scores if score >= threshold]\n\n\nprint(f([3, 7, 10], 4))\nprint(filter_passed([3, 7, 10]))\n# Вивід:\n# [7, 10]\n# [7, 10]"], ["p", "Обидві функції дають однаковий результат, але другу легко зрозуміти без пояснень: змістовні імена, пробіли навколо операторів, анотації типів і рядок документації. Автоматично перевіряти стиль допомагають **лінтери** (наприклад, flake8, pylint) і форматувальники (black)."], ["h", "Сучасні тренди"], ["ul", ["**Штучний інтелект у розробці** — асистенти, що пропонують код, тести й пояснення; відповідальність за перевірку результату лишається за розробником.", "**DevOps і CI/CD** — автоматична збірка, тестування і розгортання після кожної зміни.", "**Хмарні та контейнерні технології** — Docker, оркестрація контейнерів.", "**Low-code/no-code** — створення застосунків візуальними конструкторами.", "**Безпека з самого початку** (security by design) і захист персональних даних.", "**Семантичне версіонування** `MAJOR.MINOR.PATCH`: зміна першого числа означає несумісні зміни, другого — нову функціональність, третього — виправлення помилок."]], ["note", "Тренди змінюються швидко, а основи — алгоритми, структури даних, проєктування, тестування — залишаються. Саме вони дозволяють швидко опановувати нові інструменти."]]}], "practice": [{"task": "Функція приймає вік учасника олімпіади: допускаються учні віком від 10 до 17 років включно. Визначте класи еквівалентності та граничні значення для тестування.", "answer": "Класи еквівалентності: недопустимий «замалий вік» (< 10), допустимий (10–17), недопустимий «завеликий вік» (> 17), а також некоректні дані (від'ємне число, текст). Граничні значення: 9, 10, 17, 18 (за потреби ще 11 і 16 поруч із межами). Очікування: 9 → відмова, 10 → допуск, 17 → допуск, 18 → відмова.", "code": false}, {"task": "Напишіть функцію `ticket_price(age)` (до 6 років — 0 грн, 6–17 — 50 грн, від 18 — 100 грн, від'ємний вік — помилка `ValueError`) та модульні тести `unittest`, що перевіряють граничні значення.", "answer": "import unittest\n\n\ndef ticket_price(age):\n    \"\"\"Ціна квитка: до 6 років — 0, 6–17 — 50, від 18 — 100 грн.\"\"\"\n    if age < 0:\n        raise ValueError(\"Вік не може бути від'ємним\")\n    if age < 6:\n        return 0\n    if age <= 17:\n        return 50\n    return 100\n\n\nclass TestTicketPrice(unittest.TestCase):\n    def test_free(self):\n        self.assertEqual(ticket_price(0), 0)\n        self.assertEqual(ticket_price(5), 0)\n\n    def test_child(self):\n        self.assertEqual(ticket_price(6), 50)\n        self.assertEqual(ticket_price(17), 50)\n\n    def test_adult(self):\n        self.assertEqual(ticket_price(18), 100)\n\n    def test_negative(self):\n        with self.assertRaises(ValueError):\n            ticket_price(-1)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n", "code": true}, {"task": "Оцініть форму реєстрації за евристиками Нільсена: після натискання «Надіслати» сторінка нічого не показує 5 секунд; помилка виводиться як «Error 0x17»; кнопки «Очистити» і «Надіслати» однакові й розташовані поруч. Запропонуйте виправлення.", "answer": "1) Порушено видимість стану системи — додати індикатор завантаження і повідомлення «Дані надіслано». 2) Порушено відповідність реальному світу — замінити код помилки зрозумілим текстом, наприклад «Поле Email заповнено неправильно», і підсвітити поле. 3) Порушено запобігання помилкам — прибрати кнопку «Очистити» або зробити її візуально другорядною, віддалити від основної кнопки, запитувати підтвердження перед очищенням.", "code": false}, {"task": "Ліцей обирає архітектуру електронного журналу на 300 учнів і 40 учителів, доступ потрібен з дому. Порівняйте два варіанти — власний сервер у ліцеї і хмарний SaaS-сервіс — та дайте рекомендацію.", "answer": "Власний сервер: повний контроль над даними, але потрібні обладнання, захищений доступ ззовні, резервне копіювання, оновлення і фахівець для супроводу; збій сервера зупиняє роботу. SaaS: не потрібне власне обладнання, доступ із будь-якого пристрою через браузер, оновлення і резервні копії забезпечує постачальник; натомість абонентська плата і залежність від постачальника, треба перевірити умови захисту персональних даних. Рекомендація: для закладу такого розміру доцільніше SaaS (трирівнева архітектура на боці постачальника), за умови відповідності вимогам щодо захисту персональних даних.", "code": false}], "quiz": [{"q": "Що таке вайрфрейм?", "o": ["Готовий програмний код інтерфейсу", "Звіт про тестування", "Діаграма розгортання", "Схематичний ескіз розміщення елементів екрана"], "a": 3, "why": "Вайрфрейм створюють до візуального дизайну."}, {"q": "Яку евристику Нільсена реалізує індикатор завантаження?", "o": ["Мінімалістичний дизайн", "Видимість стану системи", "Свобода і контроль", "Узгодженість і стандарти"], "a": 1, "why": "Користувач бачить, що система працює."}, {"q": "Який мінімальний контраст звичайного тексту вимагає WCAG рівня AA?", "o": ["2 : 1", "3 : 1", "4,5 : 1", "21 : 1"], "a": 2, "why": "21 : 1 — максимально можливий контраст (чорне на білому)."}, {"q": "Який рівень тестування перевіряє окремі функції ізольовано?", "o": ["Модульне", "Системне", "Приймальне", "Навантажувальне"], "a": 0, "why": "Модульні (unit) тести перевіряють найменші частини коду."}, {"q": "Допустимі значення — від 1 до 12. Який набір є граничними значеннями?", "o": ["1, 6, 12", "0, 1, 12, 13", "2, 5, 8, 11", "−100, 100"], "a": 1, "why": "Перевіряють значення на межах діапазону і поруч з ними."}, {"q": "Що таке регресійне тестування?", "o": ["Тестування без доступу до коду", "Тестування за участі замовника", "Перевірка швидкодії під навантаженням", "Повторне тестування після змін, щоб виявити зламане раніше працююче"], "a": 3, "why": "Регресія — повернення помилок після змін."}, {"q": "Яка характеристика якості ISO/IEC 25010 описує легкість змінювати й тестувати код?", "o": ["Супровідність", "Переносність", "Сумісність", "Функціональна придатність"], "a": 0, "why": "Супровідність (maintainability)."}, {"q": "Функція містить один `if`, один `elif` і один цикл `for`. Яка її цикломатична складність (без логічних операторів)?", "o": ["3", "2", "4", "5"], "a": 2, "why": "Три точки рішення + 1 = 4."}, {"q": "Яка хмарна модель надає користувачеві готовий застосунок через браузер?", "o": ["IaaS", "PaaS", "DFD", "SaaS"], "a": 3, "why": "IaaS — інфраструктура, PaaS — платформа для розгортання."}, {"q": "Версію бібліотеки змінено з 2.4.1 на 2.5.0. Що це означає за семантичним версіонуванням?", "o": ["Внесено несумісні зміни", "Додано нову функціональність без порушення сумісності", "Лише виправлено помилки", "Випущено першу стабільну версію"], "a": 1, "why": "MINOR (друге число) зростає при сумісному розширенні функціональності."}]}, {"id": "t5", "topic": 5, "code": "5", "title": "Проєкт інформаційної системи. Повторення і систематизація", "lessons": [{"n": 160, "title": "Аналіз інформаційної інфраструктури організації", "blocks": [["p", "У темі 5 ви пройдете повний шлях створення інформаційної системи (ІС): від аналізу організації до захисту готового прототипу. Наскрізний приклад — **ІС шкільної бібліотеки**: облік книжок і читачів, видача та повернення, пошук у каталозі, список боржників. Паралельно ви можете виконувати власний проєкт для іншої організації (гуртка, їдальні, спортивного клубу)."], ["h", "Що таке інформаційна інфраструктура"], ["p", "**Інформаційна інфраструктура організації** — це сукупність апаратних засобів, програмного забезпечення, мереж, даних, людей і процедур, за допомогою яких організація збирає, зберігає, обробляє та передає інформацію. Перш ніж щось проєктувати, треба зрозуміти, як усе працює зараз (стан «як є»)."], ["table", ["Компонент", "Що з'ясовуємо", "Приклад: шкільна бібліотека"], [["Апаратне забезпечення", "Які комп'ютери, принтери, сканери є; їхній стан", "Один комп'ютер бібліотекаря, принтер; сканера штрихкодів немає"], ["Програмне забезпечення", "Операційні системи, офісні та спеціальні програми", "Облік ведеться в електронній таблиці та паперових формулярах"], ["Мережа", "Локальна мережа, Wi-Fi, доступ до інтернету", "Є шкільний Wi-Fi; учні мають смартфони"], ["Дані", "Які дані зберігаються, де, у якому форматі, хто відповідає", "Інвентарна книга, формуляри читачів, список підручників"], ["Люди (ролі)", "Хто працює з інформацією і як", "Бібліотекар, учні, вчителі, адміністрація"], ["Процеси", "Які операції виконуються регулярно", "Видача, повернення, інвентаризація, звіт про фонд"]]], ["h", "Методи збору інформації"], ["ul", ["**Інтерв'ю** — розмова з ключовими користувачами (бібліотекарем, заступником директора); питання готують заздалегідь.", "**Анкетування** — швидкий спосіб дізнатися думку багатьох (учнів, учителів).", "**Спостереження** — як реально виконується робота, скільки часу триває видача книжки.", "**Аналіз документів** — формуляри, інвентарні книги, накази, звіти.", "**Аналіз наявних рішень** — що вже використовується і чим не влаштовує."]], ["h", "Результат аналізу: проблеми, підтверджені фактами"], ["ul", ["невідомо, скільки примірників кожної книжки зараз на руках — це видно лише під час інвентаризації;", "боржників шукають вручну, переглядаючи формуляри;", "учні не можуть дистанційно перевірити, чи є потрібна книжка;", "звіти для адміністрації складаються вручну і забирають кілька годин."]], ["note", "Фіксуйте **факти, а не припущення**. Біля кожної проблеми вкажіть джерело: «з інтерв'ю з бібліотекарем», «зі спостереження 12 видач». Це знадобиться в документі попереднього дослідження."]]}, {"n": 161, "title": "Вибір методології розробки інформаційної системи", "blocks": [["p", "**Методологія розробки** — це набір принципів, етапів, ролей і документів (артефактів), за якими команда створює програмний продукт. Від вибору методології залежить, як планують роботу, як часто показують результат замовнику і як реагують на зміни вимог."], ["h", "Каскадна модель (Waterfall)"], ["p", "Етапи виконуються послідовно, кожен починається після завершення попереднього: аналіз вимог → проєктування → реалізація → тестування → впровадження → супровід. Модель проста й добре документована, але зміни вимог на пізніх етапах дорого коштують, а замовник бачить робочий продукт лише наприкінці."], ["h", "Гнучкі (Agile) підходи"], ["ul", ["**Scrum** — робота короткими ітераціями (спринтами) фіксованої тривалості, зазвичай 1–4 тижні. Ролі: власник продукту (Product Owner), Scrum-майстер, команда розробників. Артефакти: беклог продукту, беклог спринту, інкремент (робоча частина продукту).", "**Kanban** — потік задач на дошці зі стовпцями («Зробити», «В роботі», «Перевірка», «Готово») та обмеженням кількості задач у роботі одночасно (WIP-ліміт).", "**Ітеративне прототипування** — швидко створюють прототип, показують користувачам, уточнюють вимоги і повторюють цикл."]], ["table", ["Критерій", "Каскадна", "Scrum", "Kanban"], [["Вимоги", "Стабільні, відомі наперед", "Можуть змінюватися між спринтами", "Можуть змінюватися будь-коли"], ["Планування", "Один раз на весь проєкт", "На кожен спринт", "Безперервне"], ["Результат для замовника", "Наприкінці", "Після кожного спринту", "Після кожної завершеної задачі"], ["Документація", "Детальна", "Мінімально достатня", "Мінімально достатня"], ["Коли доречна", "Чіткі вимоги, жорсткі регламенти", "Новий продукт, активний замовник", "Супровід, потік дрібних задач"]]], ["h", "Як обрати методологію"], ["ul", ["Наскільки чіткі вимоги і чи будуть вони змінюватися?", "Наскільки доступний замовник для регулярних зустрічей?", "Розмір команди і термін проєкту.", "Ціна помилки (медичні, фінансові системи потребують ретельної документації)."]], ["note", "Для навчального проєкту бібліотеки доречний **ітеративний підхід з Kanban-дошкою**: 3 ітерації по тижню, після кожної — показ прототипу бібліотекарю. Обґрунтування вибору методології є обов'язковим пунктом документа попереднього дослідження."]]}, {"n": 162, "title": "Підготовка документа попереднього дослідження", "blocks": [["p", "**Документ попереднього дослідження** (техніко-економічне обґрунтування) відповідає на запитання: чи варто створювати систему, яку саме і чи вистачить ресурсів. Його готують до початку розробки, щоб не витрачати час на нездійсненну або непотрібну систему."], ["h", "Структура документа"], ["ol", ["Титульна частина: назва проєкту, автори, дата, версія.", "Опис організації та поточного стану (результати аналізу інфраструктури).", "Проблеми та потреби користувачів.", "Мета і цілі проєкту, сформульовані за принципом SMART.", "Межі проєкту: що входить у систему, а що — ні.", "Зацікавлені сторони та їхні очікування.", "Альтернативні рішення та їх порівняння.", "Оцінка здійсненності: технічна, економічна, організаційна, часова.", "Ризики та способи їх зменшення.", "Висновок і рекомендація."]], ["p", "**SMART-мета** — конкретна (Specific), вимірювана (Measurable), досяжна (Achievable), доречна (Relevant), обмежена в часі (Time-bound). Приклад: «До кінця семестру створити прототип ІС, у якому бібліотекар оформлює видачу книжки менш ніж за хвилину, а список боржників формується однією дією»."], ["h", "Порівняння альтернатив"], ["table", ["Варіант", "Переваги", "Недоліки"], [["Удосконалити електронну таблицю", "Безкоштовно, звично", "Немає доступу для учнів, легко пошкодити дані, ручні звіти"], ["Готове бібліотечне програмне забезпечення", "Багато функцій, підтримка", "Можлива плата, надлишкові функції, потрібне навчання"], ["Власна вебсистема (навчальний проєкт)", "Точно під потреби ліцею, досвід для учнів", "Потрібні час і подальший супровід"]]], ["h", "Оцінка здійсненності"], ["table", ["Вид", "Ключове питання", "Висновок для бібліотеки"], [["Технічна", "Чи є обладнання та технології?", "Так: комп'ютер, Wi-Fi, Python і SQLite безкоштовні"], ["Економічна", "Чи переважають вигоди витрати?", "Витрати мінімальні, економія годин роботи бібліотекаря"], ["Організаційна", "Чи готові люди користуватися?", "Бібліотекар зацікавлений, потрібна коротка інструкція"], ["Часова", "Чи встигнемо у визначений термін?", "Так, якщо обмежитися базовими функціями"]]], ["note", "Пишіть стисло: 3–5 сторінок достатньо. Головне — щоб висновок логічно випливав із фактів, а межі проєкту були чітко окреслені: наприклад, облік підручників і електронні книжки **не входять** у першу версію."]]}, {"n": 163, "title": "Визначення функціональних і нефункціональних системних вимог", "blocks": [["p", "**Вимога** — твердження про те, що система повинна робити або якою вона повинна бути. Вимоги — основа для проєктування, оцінювання обсягу робіт і тестування: кожну вимогу потім перевіряють."], ["h", "Функціональні вимоги"], ["p", "Описують **що робить система** — її функції та реакції на дії користувачів. Приклади для бібліотеки:"], ["ul", ["ФВ-1. Система дозволяє бібліотекарю додавати, редагувати та списувати книжки.", "ФВ-2. Система реєструє видачу книжки читачу з датою видачі та терміном повернення (14 днів).", "ФВ-3. Система не дозволяє видати книжку, якщо всі примірники на руках або читач має 3 книжки.", "ФВ-4. Учень може шукати книжку за назвою чи автором і бачити кількість вільних примірників.", "ФВ-5. Система формує список боржників на поточну дату."]], ["h", "Нефункціональні вимоги"], ["p", "Описують **якою має бути система**: продуктивність, зручність, безпека, надійність, сумісність, зручність супроводу."], ["ul", ["НФВ-1 (продуктивність). Пошук у каталозі до 10 000 книжок повертає результат не довше ніж за 1 секунду.", "НФВ-2 (безпека). Змінювати дані може лише авторизований бібліотекар; паролі зберігаються у вигляді хешу.", "НФВ-3 (зручність). Новий користувач оформлює видачу без інструкції не довше ніж за 1 хвилину.", "НФВ-4 (сумісність). Інтерфейс коректно працює в сучасних браузерах на комп'ютері та смартфоні.", "НФВ-5 (надійність). Резервна копія бази даних створюється щодня."]], ["table", ["Погане формулювання", "Чому погане", "Краще"], [["Система має швидко працювати", "Неперевірюване", "Сторінка каталогу завантажується до 2 с"], ["Зручний пошук", "Розмите", "Пошук за частиною назви або автора без урахування регістру"], ["Видача і повернення та звіти", "Кілька вимог в одній", "Розділити на три окремі вимоги"]]], ["note", "Якісна вимога — **однозначна, перевірювана, атомарна, несуперечлива і простежувана** (відомо, хто її висунув). Для пріоритизації зручно використовувати метод **MoSCoW**: Must (обов'язково), Should (бажано), Could (можна), Won't (не цього разу). Вимоги користувачів часто записують як історії: «Як учень, я хочу бачити вільні примірники, щоб не йти до бібліотеки даремно»."]]}, {"n": 164, "title": "Моделювання даних і процесів", "blocks": [["p", "Модель — спрощене подання системи, що зберігає важливе для задачі. Для ІС будують дві взаємопов'язані моделі: **модель даних** (що зберігаємо) і **модель процесів** (що відбувається з даними). У моделі даних «сутність — зв'язок» виділяють **сутності** (об'єкти, про які зберігаємо дані), їхні **атрибути** та **зв'язки** з кратністю (1:1, 1:∞, ∞:∞)."], ["h", "Модель даних «сутність — зв'язок»"], ["code", "ЧИТАЧ  (id, ПІБ, клас, email)\nКНИЖКА (id, назва, автор, ISBN, кількість_примірників)\nВИДАЧА (id, id_книжки, id_читача, дата_видачі, термін, дата_повернення)\n\nЧИТАЧ  1 ──────── ∞  ВИДАЧА  ∞ ──────── 1  КНИЖКА\n(один читач — багато видач; одна книжка — багато видач)"], ["p", "Читач може брати багато книжок, а книжку з часом беруть багато читачів — це зв'язок «багато до багатьох». Його розкладають через проміжну сутність **ВИДАЧА**, яка ще й зберігає власні атрибути: дати видачі, терміну і повернення."], ["h", "Модель процесів"], ["p", "Процеси описують діаграмами діяльностей UML або діаграмами потоків даних. Наприклад, процес «Видача книжки»:"], ["ol", ["Бібліотекар знаходить читача (за прізвищем або номером квитка).", "Знаходить книжку в каталозі.", "Система перевіряє наявність вільного примірника і ліміт читача.", "Якщо перевірки успішні — створюється запис ВИДАЧА, кількість вільних примірників зменшується.", "Інакше — система показує причину відмови."]], ["p", "Життєвий цикл примірника зручно описати **діаграмою станів**, яку легко перетворити на код: словник задає дозволені переходи, а неможлива дія викликає помилку."], ["code", "# Модель процесу: стани примірника книжки та дозволені переходи\nTRANSITIONS = {\n    \"на полиці\": {\"видати\": \"видана\", \"списати\": \"списана\"},\n    \"видана\": {\"повернути\": \"на полиці\", \"прострочити\": \"прострочена\"},\n    \"прострочена\": {\"повернути\": \"на полиці\", \"втратити\": \"списана\"},\n    \"списана\": {},\n}\n\ndef apply(state, action):\n    if action not in TRANSITIONS[state]:\n        raise ValueError(f\"Дія «{action}» неможлива у стані «{state}»\")\n    return TRANSITIONS[state][action]\n\nstate = \"на полиці\"\nfor action in [\"видати\", \"прострочити\", \"повернути\"]:\n    state = apply(state, action)\n    print(action, \"->\", state)\n\ntry:\n    apply(\"списана\", \"видати\")\nexcept ValueError as e:\n    print(\"Помилка:\", e)\n\n# Результат:\n# видати -> видана\n# прострочити -> прострочена\n# повернути -> на полиці\n# Помилка: Дія «видати» неможлива у стані «списана»"], ["note", "Моделі мають бути **узгодженими**: кожен процес працює лише з даними, які є в моделі даних, а кожна сутність використовується хоча б одним процесом."]]}, {"n": 165, "title": "Проєктування вхідних і вихідних інтерфейсів", "blocks": [["p", "**Вхідні інтерфейси** — це способи передати дані в систему: форми, поля пошуку, сканування. **Вихідні інтерфейси** — те, що система повертає користувачу: сторінки каталогу, звіти, повідомлення, сповіщення."], ["h", "Принципи проєктування"], ["ul", ["Мінімум ручного введення: списки вибору, автозаповнення, значення за замовчуванням (термін = сьогодні + 14 днів).", "Перевірка даних одразу й зрозумілі повідомлення про помилки біля відповідного поля.", "Послідовність: однакові кнопки і терміни на всіх екранах.", "Доступність: підпис `label` до кожного поля, достатній контраст, керування з клавіатури.", "Спершу ескіз (wireframe) на папері чи в редакторі макетів, потім код."]], ["h", "Вхідна форма «Новий читач»"], ["code", "<form id=\"reader-form\" novalidate>\n  <label for=\"name\">Прізвище та ім'я<\/label>\n  <input id=\"name\" name=\"name\" autocomplete=\"name\" required>\n\n  <label for=\"class_name\">Клас<\/label>\n  <input id=\"class_name\" name=\"class_name\" placeholder=\"10-А\"\n         pattern=\"(?:[1-9]|1[01])-[А-ЯІЇЄҐ]\" required>\n\n  <label for=\"email\">Електронна пошта (необов'язково)<\/label>\n  <input id=\"email\" name=\"email\" type=\"email\">\n\n  <button type=\"submit\">Зареєструвати читача<\/button>\n  <p id=\"errors\" role=\"alert\"><\/p>\n<\/form>"], ["p", "Атрибути `required`, `pattern`, `type=\"email\"` дають підказки в браузері, але їх легко обійти. Тому ті самі правила **обов'язково перевіряють на сервері**:"], ["code", "import re\n\ndef validate_reader(form):\n    \"\"\"Перевіряє дані форми «Новий читач». Повертає список помилок.\"\"\"\n    errors = []\n    name = form.get(\"name\", \"\").strip()\n    if len(name.split()) < 2:\n        errors.append(\"Вкажіть прізвище та ім'я\")\n    if not re.fullmatch(r\"(?:[1-9]|1[01])-[А-ЯІЇЄҐ]\", form.get(\"class_name\", \"\")):\n        errors.append(\"Клас має бути у форматі 10-А\")\n    email = form.get(\"email\", \"\")\n    if email and not re.fullmatch(r\"[\\w.+-]+@[\\w-]+\\.[\\w.]+\", email):\n        errors.append(\"Некоректна електронна пошта\")\n    return errors\n\nprint(validate_reader({\"name\": \"Коваль Олена\", \"class_name\": \"11-Б\",\n                       \"email\": \"olena@example.com\"}))\nprint(validate_reader({\"name\": \"Олена\", \"class_name\": \"12-Б\",\n                       \"email\": \"olena.example.com\"}))\n\n# Результат:\n# []\n# [\"Вкажіть прізвище та ім'я\", 'Клас має бути у форматі 10-А', 'Некоректна електронна пошта']"], ["h", "Вихідні інтерфейси"], ["table", ["Вихідний документ", "Для кого", "Що містить"], [["Сторінка каталогу", "Учні, вчителі", "Назва, автор, кількість вільних примірників, пошук"], ["Список боржників", "Бібліотекар", "ПІБ, клас, книжка, кількість днів прострочення"], ["Звіт за місяць", "Адміністрація", "Кількість видач, найпопулярніші книжки, активні класи"], ["Нагадування", "Читач", "Назва книжки та термін повернення"]]], ["note", "Покажіть ескізи екранів майбутнім користувачам **до програмування** — змінити малюнок значно дешевше, ніж готовий код."]]}, {"n": 166, "title": "Проєктування даних", "blocks": [["p", "Проєктування даних переводить модель «сутність — зв'язок» у конкретну структуру бази даних: таблиці, поля, типи, ключі та обмеження цілісності."], ["h", "Рівні моделі даних"], ["ol", ["**Концептуальна** — сутності та зв'язки без технічних деталей (ER-діаграма).", "**Логічна** — відношення (таблиці) з первинними та зовнішніми ключами, нормалізовані щонайменше до третьої нормальної форми.", "**Фізична** — конкретна СУБД, типи даних, індекси, обмеження."]], ["p", "**Нормалізація** усуває дублювання. Якщо в таблиці видач зберігати назву та автора книжки, то при виправленні назви доведеться змінювати десятки рядків. Правильно — зберігати лише `book_id`, а назву брати з таблиці `books` через з'єднання (JOIN)."], ["table", ["Поле таблиці loans", "Тип", "Обмеження", "Призначення"], [["id", "INTEGER", "PRIMARY KEY", "Унікальний номер видачі"], ["book_id", "INTEGER", "NOT NULL, REFERENCES books(id)", "Яка книжка"], ["reader_id", "INTEGER", "NOT NULL, REFERENCES readers(id)", "Хто взяв"], ["issued, due", "TEXT (дата РРРР-ММ-ДД)", "NOT NULL", "Дата видачі та термін"], ["returned", "TEXT", "може бути NULL", "NULL — книжка ще на руках"]]], ["h", "Перевірка проєкту бази даних на прототипі"], ["code", "import sqlite3\n\ncon = sqlite3.connect(\":memory:\")\ncon.execute(\"PRAGMA foreign_keys = ON\")\ncon.executescript(\"\"\"\nCREATE TABLE books (\n    id      INTEGER PRIMARY KEY,\n    title   TEXT NOT NULL,\n    author  TEXT NOT NULL,\n    copies  INTEGER NOT NULL DEFAULT 1 CHECK (copies >= 0)\n);\nCREATE TABLE readers (\n    id          INTEGER PRIMARY KEY,\n    name        TEXT NOT NULL,\n    class_name  TEXT NOT NULL\n);\nCREATE TABLE loans (\n    id         INTEGER PRIMARY KEY,\n    book_id    INTEGER NOT NULL REFERENCES books(id),\n    reader_id  INTEGER NOT NULL REFERENCES readers(id),\n    issued     TEXT NOT NULL,\n    due        TEXT NOT NULL,\n    returned   TEXT\n);\n\"\"\")\ncon.executemany(\"INSERT INTO books VALUES (?, ?, ?, ?)\", [\n    (1, \"Тіні забутих предків\", \"Михайло Коцюбинський\", 3),\n    (2, \"Захар Беркут\", \"Іван Франко\", 2),\n    (3, \"Кайдашева сім'я\", \"Іван Нечуй-Левицький\", 4),\n])\ncon.executemany(\"INSERT INTO readers VALUES (?, ?, ?)\", [\n    (1, \"Коваль Олена\", \"11-Б\"),\n    (2, \"Мороз Андрій\", \"10-А\"),\n])\ncon.executemany(\"INSERT INTO loans VALUES (?, ?, ?, ?, ?, ?)\", [\n    (1, 1, 1, \"2026-09-01\", \"2026-09-15\", \"2026-09-14\"),\n    (2, 2, 2, \"2026-09-20\", \"2026-10-04\", None),\n    (3, 3, 1, \"2026-10-01\", \"2026-10-15\", None),\n])\n\ntoday = \"2026-10-10\"\nrows = con.execute(\"\"\"\n    SELECT r.name, b.title, l.due\n    FROM loans AS l\n    JOIN readers AS r ON r.id = l.reader_id\n    JOIN books   AS b ON b.id = l.book_id\n    WHERE l.returned IS NULL AND l.due < ?\n    ORDER BY l.due\n\"\"\", (today,)).fetchall()\nfor name, title, due in rows:\n    print(f\"{name}: «{title}», термін {due}\")\n\ntry:\n    con.execute(\"INSERT INTO loans VALUES (4, 99, 1, '2026-10-10', '2026-10-24', NULL)\")\nexcept sqlite3.IntegrityError as e:\n    print(\"Відхилено:\", e)\n\n# Результат:\n# Мороз Андрій: «Захар Беркут», термін 2026-10-04\n# Відхилено: FOREIGN KEY constraint failed"], ["p", "Зверніть увагу: у SQLite перевірку зовнішніх ключів треба ввімкнути командою `PRAGMA foreign_keys = ON`, тоді видача неіснуючої книжки (id 99) буде відхилена. Умова `returned IS NULL` знаходить книжки на руках — порівняння `= NULL` не працює."], ["note", "Зберігайте дати у форматі **РРРР-ММ-ДД** (ISO 8601): тоді звичайне порівняння рядків дає правильний хронологічний порядок, і запит `due < '2026-10-10'` працює коректно."]]}, {"n": 167, "title": "Проєктування системної архітектури", "blocks": [["p", "**Системна архітектура** описує, з яких компонентів складається система, як вони взаємодіють і на якому обладнанні працюють. Архітектурні рішення важко змінити пізніше, тому їх ухвалюють свідомо та документують."], ["h", "Типові архітектурні стилі"], ["table", ["Стиль", "Суть", "Переваги", "Недоліки"], [["Настільний застосунок", "Програма і дані на одному комп'ютері", "Просто, без мережі", "Немає доступу з інших пристроїв"], ["Клієнт-сервер", "Клієнти надсилають запити серверу", "Спільні дані, централізоване керування", "Залежність від сервера і мережі"], ["Трирівнева", "Представлення, бізнес-логіка, дані — окремо", "Легко змінювати кожен рівень", "Складніше розгортання"], ["Хмарна (SaaS)", "Застосунок працює у постачальника послуг", "Не потрібне власне обладнання", "Залежність від постачальника, абонплата"]]], ["h", "Трирівнева архітектура ІС бібліотеки"], ["code", "┌──────────────────────────────────┐\n│ Рівень представлення             │  браузер: HTML, CSS, JavaScript\n│ (каталог, форми, звіти)          │  \n└───────────────┬──────────────────┘\n                │ HTTPS-запити / відповіді\n┌───────────────▼──────────────────┐\n│ Рівень бізнес-логіки             │  Python: класи Library, Book, Reader,\n│ (правила видачі, ліміти, звіти)  │  перевірка прав доступу\n└───────────────┬──────────────────┘\n                │ SQL-запити\n┌───────────────▼──────────────────┐\n│ Рівень даних                     │  СУБД (SQLite для прототипу),\n│ (books, readers, loans)          │  щоденна резервна копія\n└──────────────────────────────────┘"], ["h", "Апаратні та програмні рішення"], ["ul", ["**Сервер**: для прототипу — шкільний комп'ютер у локальній мережі; для постійної роботи — хостинг або хмарний сервер.", "**Клієнти**: будь-який пристрій з браузером, окрема програма не потрібна.", "**ПЗ**: Python, вебфреймворк, СУБД (SQLite для прототипу, клієнт-серверна СУБД при зростанні навантаження).", "**Безпека**: HTTPS, авторизація з ролями (учень, бібліотекар, адміністратор), хешування паролів.", "**Надійність**: автоматичне резервне копіювання бази даних і перевірка відновлення з копії."]], ["note", "Кожне важливе рішення фіксуйте коротким записом: **контекст → рішення → наслідки**. Наприклад: «Обрали SQLite, бо прототип використовує одна людина; при підключенні учнів перейдемо на клієнт-серверну СУБД»."]]}, {"n": 168, "title": "Створення простих об'єктно-орієнтованих програм на основі візуального моделювання", "blocks": [["p", "Діаграма класів UML — це креслення програми: з неї майже механічно отримують каркас коду. Нижче — спрощена діаграма класів ІС бібліотеки в текстовому вигляді."], ["code", "Book                       Reader                     Library\n─────────────────────      ─────────────────────      ────────────────────────────\n+ isbn: str                + name: str                + catalog: dict[str, Book]\n+ title: str               + class_name: str          ────────────────────────────\n+ author: str              + limit: int = 3           + add_book(book)\n+ copies: int = 1          + books: list[Book]        + issue(isbn, reader)\n─────────────────────      ─────────────────────      + give_back(isbn, reader)\n+ is_available(): bool     + can_borrow(): bool\n\nLibrary ◇──── 0..* Book          (агрегація: каталог містить книжки)\nReader  ────── 0..3 Book         (асоціація: читач тримає взяті книжки)"], ["table", ["Елемент UML", "Відповідник у Python"], [["Клас", "`class Book:`"], ["Атрибут з типом", "поле `title: str` (у dataclass) або `self.title` у `__init__`"], ["Операція", "метод `def is_available(self) -> bool`"], ["Асоціація / агрегація", "поле, що містить посилання на об'єкт або список чи словник об'єктів"], ["Значення за замовчуванням", "`copies: int = 1`"]]], ["h", "Реалізація"], ["code", "from dataclasses import dataclass, field\n\n\n@dataclass\nclass Book:\n    isbn: str\n    title: str\n    author: str\n    copies: int = 1\n\n    def is_available(self) -> bool:\n        return self.copies > 0\n\n\n@dataclass\nclass Reader:\n    name: str\n    class_name: str\n    limit: int = 3\n    books: list = field(default_factory=list)\n\n    def can_borrow(self) -> bool:\n        return len(self.books) < self.limit\n\n\nclass Library:\n    def __init__(self):\n        self.catalog = {}          # isbn -> Book\n\n    def add_book(self, book: Book):\n        self.catalog[book.isbn] = book\n\n    def issue(self, isbn: str, reader: Reader):\n        book = self.catalog.get(isbn)\n        if book is None:\n            raise KeyError(f\"Книжки {isbn} немає в каталозі\")\n        if not book.is_available():\n            raise ValueError(f\"«{book.title}»: усі примірники видано\")\n        if not reader.can_borrow():\n            raise ValueError(f\"{reader.name}: досягнуто ліміту книжок\")\n        book.copies -= 1\n        reader.books.append(book)\n\n    def give_back(self, isbn: str, reader: Reader):\n        book = self.catalog[isbn]\n        reader.books.remove(book)\n        book.copies += 1\n\n\nlib = Library()\nlib.add_book(Book(\"978-1\", \"Захар Беркут\", \"Іван Франко\", copies=1))\nlib.add_book(Book(\"978-2\", \"Тіні забутих предків\", \"Михайло Коцюбинський\"))\n\nolena = Reader(\"Коваль Олена\", \"11-Б\")\nandrii = Reader(\"Мороз Андрій\", \"10-А\")\n\nlib.issue(\"978-1\", olena)\nprint([b.title for b in olena.books])\ntry:\n    lib.issue(\"978-1\", andrii)\nexcept ValueError as e:\n    print(\"Помилка:\", e)\nlib.give_back(\"978-1\", olena)\nlib.issue(\"978-1\", andrii)\nprint(andrii.name, \"->\", [b.title for b in andrii.books])\n\n# Результат:\n# ['Захар Беркут']\n# Помилка: «Захар Беркут»: усі примірники видано\n# Мороз Андрій -> ['Захар Беркут']"], ["p", "Декоратор `@dataclass` автоматично створює `__init__`, `__repr__` і `__eq__` за оголошеними полями. Для списку використано `field(default_factory=list)`, щоб кожен читач мав **власний** список книжок, а не один спільний. Порушення бізнес-правил (немає примірників, ліміт) повідомляються винятками, які обробляє інтерфейс."], ["note", "Дотримуйтеся **інкапсуляції**: кількість примірників змінюйте лише через методи `issue` і `give_back`, а не напряму з інтерфейсу. Тоді правила видачі перевіряються в одному місці, а код відповідає діаграмі."]]}, {"n": 169, "title": "Тестування прототипів", "blocks": [["p", "**Прототип** — ранній робочий варіант системи, який показують користувачам, щоб перевірити ідеї. Тестування прототипу відповідає на два запитання: чи працює він правильно (функціональне тестування) і чи зручно ним користуватися (юзабіліті-тестування)."], ["table", ["Рівень тестування", "Що перевіряють", "Приклад"], [["Модульне", "Окремі функції та класи", "`Library.issue` зменшує кількість примірників"], ["Інтеграційне", "Взаємодію компонентів", "Форма видачі коректно записує дані в БД"], ["Системне", "Систему загалом на відповідність вимогам", "Перевірка ФВ-1…ФВ-5"], ["Приймальне", "Чи готовий продукт для замовника", "Бібліотекар виконує свої щоденні задачі"]]], ["h", "Тест-кейс"], ["p", "Тест-кейс містить: ідентифікатор, передумови, кроки, очікуваний результат, фактичний результат і статус. Приклад: **ТК-07**. Передумова: книжка має 0 вільних примірників. Кроки: оформити видачу. Очікувано: повідомлення «усі примірники видано», запис не створено."], ["h", "Автоматичні модульні тести"], ["code", "# файл test_library.py (поруч лежить library.py з класами Book, Reader, Library)\nfrom library import Book, Reader, Library\n\n\ndef make_library():\n    lib = Library()\n    lib.add_book(Book(\"978-1\", \"Захар Беркут\", \"Іван Франко\", copies=1))\n    return lib\n\n\ndef test_issue_decreases_copies():\n    lib, r = make_library(), Reader(\"Коваль Олена\", \"11-Б\")\n    lib.issue(\"978-1\", r)\n    assert lib.catalog[\"978-1\"].copies == 0\n    assert len(r.books) == 1\n\n\ndef test_cannot_issue_when_no_copies():\n    lib = make_library()\n    lib.issue(\"978-1\", Reader(\"Коваль Олена\", \"11-Б\"))\n    try:\n        lib.issue(\"978-1\", Reader(\"Мороз Андрій\", \"10-А\"))\n        assert False, \"мала бути помилка\"\n    except ValueError:\n        pass\n\n\ndef test_reader_limit():\n    lib, r = make_library(), Reader(\"Коваль Олена\", \"11-Б\", limit=0)\n    try:\n        lib.issue(\"978-1\", r)\n        assert False, \"мала бути помилка\"\n    except ValueError:\n        pass\n\n\ndef test_return_restores_copies():\n    lib, r = make_library(), Reader(\"Коваль Олена\", \"11-Б\")\n    lib.issue(\"978-1\", r)\n    lib.give_back(\"978-1\", r)\n    assert lib.catalog[\"978-1\"].copies == 1 and r.books == []\n\n\ntests = [test_issue_decreases_copies, test_cannot_issue_when_no_copies,\n         test_reader_limit, test_return_restores_copies]\npassed = 0\nfor t in tests:\n    try:\n        t()\n        print(\"OK  \", t.__name__)\n        passed += 1\n    except AssertionError as e:\n        print(\"FAIL\", t.__name__, e)\nprint(f\"Пройдено {passed} з {len(tests)}\")\n\n# Результат:\n# OK   test_issue_decreases_copies\n# OK   test_cannot_issue_when_no_copies\n# OK   test_reader_limit\n# OK   test_return_restores_copies\n# Пройдено 4 з 4"], ["p", "Тут тести запускаються простим циклом, щоб було видно принцип. У реальних проєктах використовують модуль `unittest` або бібліотеку `pytest`, які самі знаходять функції з префіксом `test_` і формують звіт."], ["h", "Юзабіліті-тестування"], ["ol", ["Підготуйте 3–5 типових сценаріїв: «знайдіть книжку Франка», «оформіть повернення».", "Запросіть 4–5 представників різних ролей.", "Попросіть коментувати дії вголос, не підказуйте.", "Фіксуйте час, помилки, місця, де людина вагалася.", "Узагальніть спостереження у протоколі тестування."]], ["note", "Обов'язково тестуйте **граничні випадки**: 0 примірників, досягнутий ліміт, неіснуючий ISBN, порожнє поле, дуже довга назва."]]}, {"n": 170, "title": "Аналіз зворотного зв'язку та вдосконалення продукту", "blocks": [["p", "Зворотний зв'язок перетворює прототип на продукт, яким справді користуються. Робочий цикл такий: **зібрати → проаналізувати → визначити пріоритети → вдосконалити → перевірити знову**."], ["h", "Джерела зворотного зв'язку"], ["ul", ["протоколи юзабіліті-тестування;", "анкети з оцінками за шкалою 1–5 і відкритими запитаннями;", "повідомлення про помилки від користувачів;", "журнали роботи системи (які функції використовують, де виникають помилки)."]], ["h", "Кількісний аналіз відгуків"], ["code", "from collections import Counter\n\n# Відповіді учасників тестування прототипу: (оцінка 1–5, категорія зауваження)\nfeedback = [\n    (5, \"пошук\"), (4, \"інтерфейс\"), (3, \"пошук\"), (2, \"швидкодія\"),\n    (4, \"пошук\"), (5, None), (3, \"інтерфейс\"), (4, \"пошук\"),\n]\n\nscores = [s for s, _ in feedback]\nprint(\"Середня оцінка:\", round(sum(scores) / len(scores), 2))\n\nissues = Counter(c for _, c in feedback if c)\nfor category, count in issues.most_common():\n    print(f\"{category}: {count}\")\n\n# Результат:\n# Середня оцінка: 3.75\n# пошук: 4\n# інтерфейс: 2\n# швидкодія: 1"], ["p", "Клас `Counter` підраховує, скільки разів згадано кожну категорію, а `most_common()` впорядковує їх від найчастішої. Видно, що найбільше зауважень стосуються пошуку — з нього й варто почати."], ["h", "Пріоритизація покращень"], ["table", ["Зауваження", "Частота", "Вплив", "Зусилля", "Рішення"], [["Пошук не знаходить «Франко» за запитом «франко»", "Часто", "Високий", "Мале", "Виправити в наступній ітерації"], ["Незрозуміла кнопка «Обробити»", "Інколи", "Середній", "Мале", "Перейменувати на «Оформити видачу»"], ["Повільне завантаження списку боржників", "Рідко", "Середній", "Середнє", "Додати індекс, перевірити"], ["Хочемо мобільний застосунок", "Рідко", "Низький", "Велике", "Відкласти (Won't)"]]], ["note", "Після кожного виправлення повторно запускайте всі тести (**регресійне тестування**) і ведіть журнал змін: версія, дата, що змінено, на підставі якого відгуку."]]}, {"n": 171, "title": "Підготовка презентаційних матеріалів", "blocks": [["p", "Презентація має за кілька хвилин переконати слухачів, що проблема реальна, рішення продумане, а продукт працює. До комплекту матеріалів входять слайди, демонстрація, коротка документація і, за потреби, буклет або постер."], ["h", "Структура презентації проєкту"], ["ol", ["Назва проєкту, команда, ролі.", "Проблема організації (факти з аналізу).", "Мета і ключові вимоги.", "Обрана методологія і план робіт.", "Моделі: ER-діаграма, діаграма класів, архітектура.", "Демонстрація основних сценаріїв.", "Результати тестування і зворотного зв'язку.", "Висновки та плани розвитку."]], ["h", "Принципи оформлення"], ["ul", ["Одна ідея — один слайд; мінімум тексту, ключові слова замість абзаців.", "Схеми й таблиці замість довгого опису.", "Великий шрифт і контрастні кольори, щоб текст читався з останнього ряду.", "Єдиний стиль усіх слайдів; номери слайдів.", "Скриншоти інтерфейсу з підписами."]], ["table", ["Матеріал", "Призначення"], [["Слайди", "Логіка розповіді та ключові факти"], ["Сценарій демонстрації", "Перелік дій і тестові дані, щоб демо пройшло без збоїв"], ["README / коротка інструкція", "Як встановити і запустити систему"], ["Звіт про тестування", "Доказ якості: тест-кейси, результати, виправлення"]]], ["note", "Підготуйте **запасний план**: запис екрана або скриншоти на випадок, якщо демонстрація не запуститься. Проведіть щонайменше одну репетицію з таймером."]]}, {"n": 172, "title": "Представлення та захист проєктів", "blocks": [["p", "Захист проєкту — це публічний виступ (зазвичай 5–7 хвилин) і відповіді на запитання. За результатами захисту проводиться тематична атестація з теми 5. Для дистанційної форми навчання захист може відбуватися у відеоконференції з демонстрацією екрана."], ["h", "План виступу"], ["ol", ["Привітання і назва проєкту (до 30 с).", "Проблема та мета (1 хв).", "Як проєктували: вимоги, моделі, архітектура (1–2 хв).", "Демонстрація роботи (2 хв).", "Тестування, відгуки, що вдосконалено (1 хв).", "Висновки і подяка (30 с)."]], ["h", "Критерії оцінювання"], ["table", ["Критерій", "Що перевіряють"], [["Аналіз і вимоги", "Чи обґрунтовано проблему, чи вимоги перевірювані"], ["Моделювання і проєктування", "Чи узгоджені моделі даних, процесів, класів і архітектура"], ["Реалізація", "Чи працює прототип, якість коду, обробка помилок"], ["Тестування", "Наявність тест-кейсів, автоматичних тестів, урахування відгуків"], ["Презентація", "Логіка, наочність, дотримання регламенту, відповіді на запитання"]]], ["h", "Як відповідати на запитання"], ["ul", ["Уважно вислухайте запитання до кінця, за потреби уточніть його.", "Відповідайте коротко і по суті, підкріплюйте відповідь фактами з проєкту.", "Якщо не знаєте відповіді — чесно скажіть і запропонуйте, як це можна з'ясувати.", "Типові запитання: «Чому обрали таку архітектуру?», «Як захищено дані?», «Що буде, якщо одночасно працюватимуть 100 учнів?», «Що зробите в наступній версії?»."]], ["note", "Сприймайте критичні запитання як безкоштовну експертизу. Запишіть зауваження комісії — вони стануть беклогом наступної версії."]]}, {"n": 173, "title": "Виконання індивідуальних та колективних проєктів", "blocks": [["p", "**Мета:** реалізувати основні функції власної ІС (або ІС бібліотеки) за спроєктованими моделями."], ["ol", ["Оновіть Kanban-дошку: перенесіть вимоги з пріоритетом Must у стовпець «Зробити».", "Створіть базу даних за фізичною моделлю, заповніть її тестовими даними.", "Реалізуйте класи бізнес-логіки за діаграмою класів.", "Зробіть мінімальний інтерфейс для 2–3 ключових сценаріїв.", "Після кожної функції запускайте тести і фіксуйте зміни в журналі."]], ["ul", ["**Критерії:** реалізовано всі вимоги Must; код запускається без помилок; є щонайменше 4 автоматичні тести; дані зберігаються між запусками.", "У колективному проєкті кожен учасник відповідає за свою частину, а інтеграцію перевіряють спільно."]], ["note", "Не намагайтеся зробити все одразу: краще три функції, що працюють бездоганно, ніж десять напівготових."]]}, {"n": 174, "title": "Виконання індивідуальних та колективних проєктів", "blocks": [["p", "**Мета:** завершити прототип, урахувати відгуки користувачів і підготувати супровідну документацію."], ["ol", ["Проведіть юзабіліті-тестування з 3–5 користувачами та заповніть протокол.", "Пріоритизуйте зауваження та виправте найважливіші.", "Повторно запустіть усі тести (регресійне тестування).", "Напишіть README: призначення, встановлення, запуск, ролі користувачів.", "Підготуйте слайди і сценарій демонстрації до захисту."]], ["ul", ["**Критерії:** виправлено щонайменше 3 зауваження з протоколу; усі тести проходять; README дозволяє сторонній людині запустити систему; презентація відповідає структурі з уроку 171."]], ["note", "Попросіть однокласника запустити систему лише за вашим README — так ви швидко знайдете пропущені кроки."]]}, {"n": 175, "title": "Повторення і систематизація навчального матеріалу за рік", "blocks": [["p", "**Мета:** пов'язати всі теми курсу в цілісну картину. Проєкт ІС бібліотеки — зручна «карта» для повторення: у ньому працюють і бази даних, і алгоритми, і вебтехнології, і парадигми програмування."], ["table", ["Тема курсу", "Ключові поняття", "Де в проєкті"], [["Бази даних", "Таблиці, ключі, зв'язки, нормалізація, SQL: SELECT, JOIN, GROUP BY", "Таблиці books, readers, loans; звіти"], ["Алгоритми", "Складність, сортування, бінарний пошук, рекурсія", "Пошук у каталозі, сортування боржників"], ["Вебтехнології", "HTML-структура, CSS, JavaScript, форми, клієнт-сервер", "Каталог і форми системи"], ["Парадигми і технології", "Імперативна, ООП, функціональна; UML; тестування; методології", "Класи Library, діаграми, тести, Kanban"]]], ["code", "# Повторення: алгоритм бінарного пошуку + різні парадигми\nfrom functools import reduce\ntitles = sorted([\"Захар Беркут\", \"Кайдашева сім'я\", \"Лісова пісня\",\n                 \"Тіні забутих предків\", \"Енеїда\"])\n\n\ndef binary_search(items, target):\n    lo, hi = 0, len(items) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if items[mid] == target:\n            return mid\n        if items[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n\n\nprint(titles)\nprint(binary_search(titles, \"Лісова пісня\"))\nprint(binary_search(titles, \"Маруся\"))\n\ncopies = [3, 2, 4, 1, 5]\ntotal = 0                      # імперативний стиль\nfor c in copies:\n    total += c\nprint(total, reduce(lambda a, b: a + b, copies))   # функціональний стиль\n\n# Результат:\n# ['Енеїда', 'Захар Беркут', \"Кайдашева сім'я\", 'Лісова пісня', 'Тіні забутих предків']\n# 3\n# -1\n# 15 15"], ["code", "-- SQL: скільки книжок на руках у кожного класу\nSELECT r.class_name, COUNT(*) AS on_hands\nFROM loans AS l\nJOIN readers AS r ON r.id = l.reader_id\nWHERE l.returned IS NULL\nGROUP BY r.class_name\nORDER BY on_hands DESC;\n\n<!-- HTML: рядок каталогу з кнопкою -->\n<li class=\"book\">\n  <strong>Захар Беркут<\/strong> — Іван Франко\n  <button data-isbn=\"978-1\">Забронювати<\/button>\n<\/li>"], ["ol", ["Поясніть, чому бінарний пошук потребує впорядкованого списку і яка його складність — O(log n).", "Назвіть чотири принципи ООП і знайдіть приклад кожного в класах бібліотеки.", "Перепишіть SQL-запит так, щоб він показував лише класи, де на руках більше двох книжок (HAVING).", "Поясніть, чим перевірка форми в браузері відрізняється від перевірки на сервері."]], ["note", "Для самоперевірки пройдіть тести всіх підрозділів курсу і поверніться до тем, де помилилися більше ніж у двох запитаннях."]]}], "practice": [{"task": "Сформулюйте для ІС шкільної бібліотеки три функціональні та дві нефункціональні вимоги до нової функції «Бронювання книжки онлайн». Вимоги мають бути перевірюваними.", "answer": "Функціональні: ФВ-Б1. Учень може забронювати книжку, якщо є хоча б один вільний примірник. ФВ-Б2. Бронювання діє 2 робочі дні, після чого автоматично скасовується, а примірник знову стає вільним. ФВ-Б3. Бібліотекар бачить список активних бронювань і може оформити за ним видачу однією дією. Нефункціональні: НФВ-Б1. Підтвердження бронювання з'являється не пізніше ніж через 2 с після натискання кнопк й\", \"due\": date(2026, 9, 25), \"returned\": None},\n    {\"reader\": \"Бондар Ірина\", \"due\": date(2026, 9, 20),\n     \"returned\": date(2026, 9, 19)},\n    {\"reader\": \"Ткач Максим\", \"due\": date(2026, 10, 15), \"returned\": None},\n]\nprint(debtors(loans, date(2026, 10, 10)))\n\n# Результат:\n# [('Мороз Андрій', 15), ('Коваль Олена', 6)]", "code": true}, {"task": "Складіть план 6-хвилинного захисту проєкту ІС бібліотеки: перелічіть слайди та орієнтовний час на кожну частину.", "answer": "1) Титульний слайд: назва, автор — 20 с. 2) Проблема: факти з аналізу (ручний пошук боржників, немає доступу для учнів) — 50 с. 3) Мета (SMART) і ключові вимоги — 40 с. 4) Моделі: ER-діаграма, діаграма класів, трирівнева архітектура — 1 хв. 5) Демонстрація: пошук книжки, видача, список боржників — 2 хв. 6) Тестування та відгуки: кількість тестів, середня оцінка, що виправлено — 40 с. 7) Висновки і плани (бронювання, нагадування) — 30 с. Разом приблизно 6 хв; запасний план — запис екрана демонстрації.", "code": false}], "quiz": [{"q": "Що з переліченого НЕ є компонентом інформаційної інфраструктури організації?", "o": ["Апаратне забезпечення", "Дані та процедури їх обробки", "Люди, які працюють з інформацією", "Колір фасаду будівлі"], "a": 3, "why": "Інфраструктура охоплює обладнання, ПЗ, мережі, дані, людей і процедури."}, {"q": "Яка методологія передбачає роботу спринтами фіксованої тривалості з ролями власника продукту та Scrum-майстра?", "o": ["Каскадна", "Scrum", "Kanban", "V-модель"], "a": 1, "why": "Спринти та ці ролі — характерні ознаки Scrum."}, {"q": "Яка вимога є нефункціональною?", "o": ["Система формує список боржників", "Бібліотекар може списати книжку", "Пошук повертає результат не довше ніж за 1 с", "Учень може шукати книжку за автором"], "a": 2, "why": "Вона описує якість (продуктивність), а не функцію."}, {"q": "Що означає літера M у SMART-меті?", "o": ["Measurable — вимірювана", "Modern — сучасна", "Manual — ручна", "Modular — модульна"], "a": 0}, {"q": "Як у реляційній моделі реалізують зв'язок «багато до багатьох» між читачами і книжками?", "o": ["Додають у таблицю книжок поле зі списком читачів", "Створюють проміжну таблицю (видачі) з двома зовнішніми ключами", "Об'єднують дві таблиці в одну", "Такий зв'язок неможливо реалізувати"], "a": 1}, {"q": "Яка умова SQL правильно знаходить книжки, які ще не повернули (поле returned порожнє)?", "o": ["returned = NULL", "returned == ''", "returned = 0", "returned IS NULL"], "a": 3, "why": "Порівняння з NULL через = завжди дає невизначений результат; потрібно IS NULL."}, {"q": "Навіщо в dataclass для поля-списку використовують `field(default_factory=list)`?", "o": ["Щоб список був незмінним", "Щоб кожен об'єкт отримав власний новий список", "Щоб пришвидшити програму", "Щоб список автоматично сортувався"], "a": 1, "why": "Змінюване значення за замовчуванням було б спільним для всіх об'єктів, тому dataclass вимагає фабрику."}, {"q": "У трирівневій архітектурі правила видачі книжок (ліміт, наявність примірників) розміщують на рівні…", "o": ["представлення", "даних", "бізнес-логіки", "мережі"], "a": 2}, {"q": "Як називається повторний запуск усіх тестів після внесення змін, щоб переконатися, що нічого не зламалося?", "o": ["Регресійне тестування", "Юзабіліті-тестування", "Навантажувальне тестування", "Приймальне тестування"], "a": 0}, {"q": "Чому перевірку даних форми потрібно виконувати також на сервері?", "o": ["Браузер не підтримує атрибут required", "Сервер працює швидше за браузер", "Так вимагає стандарт HTML", "Перевірку в браузері можна обійти, надіславши запит напряму"], "a": 3}]}], "SAFETY": "Перед роботою за комп'ютером: сидіть рівно на відстані 50–70 см від екрана, не торкайтеся дротів і розеток, не їжте й не пийте біля техніки. Кожні 20–30 хвилин робіть коротку перерву для очей.", "TOPICS": {"1": "Бази даних", "2": "Алгоритми", "3": "Веб-технології", "4": "Парадигми та технології програмування", "5": "Проєкт інформаційної системи і повторення"}};
const {SECTIONS, SAFETY, TOPICS} = DATA;
const secLabel = s => s.topic===1 ? `Тема 1 · Підрозділ ${s.code}` : (s.code.includes(".") ? `Тема ${s.topic} · Частина ${s.code.split(".")[1]}` : `Тема ${s.topic}`);
const TOPIC_IDS = [...new Set(SECTIONS.map(s=>s.topic))];
const LETTERS = ["а","б","в","г"];

/* ---------- helpers ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function inline(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
}
const KW = new Set("False None True and as break class continue def elif else except for from if import in is not or pass return try while with lambda print input int float str bool type round abs min max pow divmod help exit".split(" "));
function hl(src){
  // tokenise line by line: comments, strings, numbers, keywords, prompt
  return src.split("\n").map(line=>{
    let out = "", i = 0;
    if (line.startsWith(">>> ")) { out += '<span class="pr">&gt;&gt;&gt; </span>'; i = 4; }
    while (i < line.length){
      const c = line[i], rest = line.slice(i);
      if (c === "#"){ out += `<span class="com">${esc(rest)}</span>`; break; }
      if (c === '"' || c === "'"){
        let j = i + 1; while (j < line.length && line[j] !== c) j++;
        out += `<span class="str">${esc(line.slice(i, j + 1))}</span>`; i = j + 1; continue;
      }
      let m = rest.match(/^\d+(\.\d+)?/);
      if (m && !/[A-Za-z_]/.test(line[i-1]||"")){ out += `<span class="num">${m[0]}</span>`; i += m[0].length; continue; }
      m = rest.match(/^[A-Za-z_][A-Za-z_0-9]*/);
      if (m){ out += KW.has(m[0]) ? `<span class="kw">${m[0]}</span>` : esc(m[0]); i += m[0].length; continue; }
      out += esc(c); i++;
    }
    return out;
  }).join("\n");
}
const codeHTML = s => `<pre class="code"><button class="copy" type="button">Копіювати</button><code-x>${hl(s)}</code-x></pre>`;
function blocksHTML(list){
  return list.map(b=>{
    switch(b[0]){
      case "h": return `<h3>${inline(b[1])}</h3>`;
      case "p": return `<p>${inline(b[1])}</p>`;
      case "ul": return `<ul>${b[1].map(t=>`<li>${inline(t)}</li>`).join("")}</ul>`;
      case "ol": return `<ol>${b[1].map(t=>`<li>${inline(t)}</li>`).join("")}</ol>`;
      case "code": return codeHTML(b[1]);
      case "note": return `<div class="note">${inline(b[1])}</div>`;
      case "table": return `<div class="tbl"><table><thead><tr>${b[1].map(h=>`<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${b[2].map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    return "";
  }).join("");
}

function quizState(id){ return S.quiz[id] || (S.quiz[id] = {answers:{}}); }
function status(sec){
  const st = S.quiz[sec.id]; const total = sec.quiz.length;
  if (st && Object.keys(st.answers).length === total){
    const sc = Object.entries(st.answers).filter(([i,v])=>sec.quiz[i].a===v).length;
    return {text:`${sc}/${total}`, done:true};
  }
  return {text:"тест", done:false};
}

  return `<section class="view">
    <div class="hero">
      <p class="eyebrow">Інформатика · 11 клас · профільний рівень</p>
      <h1>Курс інформатики за КТП</h1>
      <p>175 уроків, 5 тем: бази даних, алгоритми, веб-технології, парадигми та технології програмування, проєкт інформаційної системи. У кожному підрозділі є конспект за уроками, практичні завдання з розв'язками та тест, який перевіряє відповіді одразу.</p>
      ${codeHTML('>>> print("Привіт, 11 клас!")\nПривіт, 11 клас!')}
      <a class="btn primary" href="#${SECTIONS[0].id}">Почати з підрозділу ${SECTIONS[0].code}</a>
    </div>
    ${plans}
    <p class="reset"><span>Результати тестів зберігаються лише у вашому браузері.</span><button class="linkbtn" id="resetBtn" type="button">Скинути результати</button><span id="resetConfirm" hidden>Точно скинути? <button class="linkbtn" id="resetYes" type="button">Так</button> · <button class="linkbtn" id="resetNo" type="button">Ні</button></span></p>
  </section>`;
}
function sectionHTML(sec, idx){
  const l = sec.lessons;
  const prev = SECTIONS[idx-1], next = SECTIONS[idx+1];
  return `<section class="view prose">
    <p class="eyebrow">${secLabel(sec)}</p>
    <h1>${sec.title}</h1>
    <div class="meta"><span class="chip">Уроки ${l[0].n}–${l[l.length-1].n}</span><span class="chip">Практика · ${sec.practice.length} завдання</span><span class="chip">Тест · ${sec.quiz.length} питань</span></div>
    <div class="safety"><span><b>Безпека життєдіяльності.</b> ${inline(SAFETY)}</span></div>
    <div class="lessons-nav">${l.map(x=>`<button type="button" data-jump="L${x.n}">Урок ${x.n}</button>`).join("")}<button type="button" data-jump="practice-${sec.id}">Практика</button><button type="button" data-jump="quiz-${sec.id}">Тест</button></div>
    ${l.map(x=>`<article class="lesson" id="L${x.n}"><div class="lesson-head"><span class="num">Урок ${x.n}</span><h2>${inline(x.title)}</h2></div>${blocksHTML(x.blocks)}</article>`).join("")}
    <div class="block" id="practice-${sec.id}"><h2>Практичні завдання</h2><ol class="tasks">${sec.practice.map(p=>`<li>${inline(p.task)}<details><summary>Показати розв'язок</summary>${p.code?codeHTML(p.answer):`<div class="ans">${inline(p.answer)}</div>`}</details></li>`).join("")}</ol></div>
    <div class="block" id="quiz-${sec.id}"><div class="quiz" data-quiz="${sec.id}"></div></div>
    <div class="pager">${prev?`<a href="#${prev.id}"><small>← ${prev.code}</small><b>${prev.title}</b></a>`:`<a href="#home"><small>← Назад</small><b>Головна</b></a>`}${next?`<a class="next" href="#${next.id}"><small>${next.code} →</small><b>${next.title}</b></a>`:""}</div>
  </section>`;
}
function renderQuiz(box){
  const id = box.dataset.quiz, sec = SECTIONS.find(s=>s.id===id), qs = sec.quiz, st = quizState(id);
  const answered = Object.keys(st.answers).length;
  const score = Object.entries(st.answers).filter(([i,v])=>qs[i].a===v).length;
  let h = `<div class="quiz-head"><h2>Тест для самоперевірки</h2><span class="score">${answered}/${qs.length} відповідей · ${score} правильних</span></div><div class="bar"><i style="width:${answered/qs.length*100}%"></i></div>`;
  qs.forEach((q,i)=>{
    const pick = st.answers[i], done = pick !== undefined;
    h += `<div class="q"><p><span class="qn">${i+1}.</span>${inline(q.q)}</p><div class="opts">`;
    q.o.forEach((o,j)=>{
      let cls = ""; if (done){ cls = j===q.a ? "right" : j===pick ? "wrong" : "dim"; }
      h += `<button type="button" class="opt ${cls}" data-q="${i}" data-o="${j}" ${done?"disabled":""}><span class="l">${LETTERS[j]})</span><span>${inline(o)}</span></button>`;
    });
    h += `</div>`;
    if (done) h += pick===q.a ? `<div class="fb ok">Правильно!${q.why?" "+inline(q.why):""}</div>` : `<div class="fb no">Неправильно. Правильна відповідь: ${LETTERS[q.a]}) ${inline(q.o[q.a])}.${q.why?" "+inline(q.why):""}</div>`;
    h += `</div>`;
  });
  if (answered === qs.length){
    const msg = score===qs.length ? "Чудово, усі відповіді правильні!" : score>=qs.length*0.7 ? "Добрий результат. Перегляньте питання з помилками ще раз." : "Варто ще раз перечитати конспект і пройти тест знову.";
    h += `<div class="result"><b>${score} з ${qs.length}</b><span>${msg}</span><button type="button" class="btn" data-retry>Пройти ще раз</button></div>`;
  }
  box.innerHTML = h;
}
function renderNav(cur){
  let h = `<a href="#home" ${cur==="home"?'aria-current="page"':""}><span class="t">Головна</span></a>`;
  TOPIC_IDS.forEach(t=>{
    h += `<h4>Тема ${t}. ${TOPICS[t]}</h4>`;
    SECTIONS.filter(s=>s.topic===t).forEach(s=>{ const st = status(s); h += `<a href="#${s.id}" ${cur===s.id?'aria-current="page"':""}><span class="n">${s.code}</span><span class="t">${s.title}</span><span class="st ${st.done?"done":""}">${st.text}</span></a>`; });
  });
  document.getElementById("tocList").innerHTML = h;
  const s = SECTIONS.find(x=>x.id===cur);
  document.getElementById("tocCurrent").textContent = s ? `${s.code}. ${s.title}` : "Зміст курсу";
}
/* Routing keeps its own state, so the page also works when embedded (iframe, srcdoc) where #links can't change the address */
const validId = h => SECTIONS.some(s=>s.id===h) ? h : "home";
let CUR = "home";
try { CUR = validId(location.hash.slice(1)); } catch(e) {}
function current(){ return CUR; }
function go(id){
  CUR = validId(id);
  try { if (location.protocol !== "about:") history.replaceState(null, "", "#" + CUR); } catch(e) {}
  show();
}
document.addEventListener("click", e=>{
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  go(a.getAttribute("href").slice(1));
}, true);
function show(){
  const id = current();
  if (id === "home") main.innerHTML = homeHTML();
  else { const i = SECTIONS.findIndex(s=>s.id===id); main.innerHTML = sectionHTML(SECTIONS[i], i); main.querySelectorAll("[data-quiz]").forEach(renderQuiz); }
  renderNav(id);
  const nav = document.getElementById("toc"); nav.classList.remove("open"); if (id === "home") nav.scrollTop = 0;
  document.getElementById("tocToggle").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", ()=>{ try { const h = validId(location.hash.slice(1)); if (h !== CUR){ CUR = h; show(); } } catch(e) {} });
show();

/* ---------- events ---------- */
document.getElementById("tocToggle").addEventListener("click", ()=>{
  const nav = document.getElementById("toc"); const open = nav.classList.toggle("open");
  document.getElementById("tocToggle").setAttribute("aria-expanded", open);
});
document.addEventListener("click", e=>{
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled){
    const box = opt.closest("[data-quiz]");
    quizState(box.dataset.quiz).answers[opt.dataset.q] = +opt.dataset.o;
    save(); renderQuiz(box); renderNav(current()); return;
  }
  const retry = e.target.closest("[data-retry]");
  if (retry){
    const box = retry.closest("[data-quiz]"); S.quiz[box.dataset.quiz] = {answers:{}}; save(); renderQuiz(box); renderNav(current());
    box.scrollIntoView({behavior:"smooth", block:"start"}); return;
  }
  const jump = e.target.closest("[data-jump]");
  if (jump){ const t = document.getElementById(jump.dataset.jump); if (t) t.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const copy = e.target.closest(".copy");
  if (copy){
    const txt = copy.parentElement.querySelector("code-x").textContent;
    const done = ()=>{ copy.textContent = "Скопійовано"; setTimeout(()=>copy.textContent="Копіювати", 1500); };
    try { navigator.clipboard.writeText(txt).then(done, ()=>selectText(copy)); } catch(err){ selectText(copy); }
    return;
  }
  if (e.target.id === "resetBtn") document.getElementById("resetConfirm").hidden = false;
  if (e.target.id === "resetNo") document.getElementById("resetConfirm").hidden = true;
  if (e.target.id === "resetYes"){ S = {quiz:{}}; save(); show(); }
});
function selectText(btn){
  const r = document.createRange(); r.selectNodeContents(btn.parentElement.querySelector("code-x"));
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  btn.textContent = "Натисніть Ctrl+C";
}
</script>

</body></html>
