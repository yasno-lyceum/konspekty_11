ння з `alt`, SVG", "3"], ["Мультимедіа з кількома джерелами", "2"], ["Доречна анімація, що не заважає читанню", "2"], ["Акуратне оформлення, адаптивність", "2"]]], ["note", "Порада: перевірте сумарний розмір сторінки у вкладці Network інструментів розробника (F12). Якщо він перевищує кілька мегабайтів — ще раз стисніть зображення."]]}], "practice": [{"task": "Напишіть HTML-код фігури з фото `team.webp` (розмір 600×400), осмисленим `alt`, відкладеним завантаженням і підписом «Команда ліцею».", "answer": "<figure>\n  <img src=\"team.webp\" alt=\"Вчителі та учні ліцею на подвір'ї\"\n       width=\"600\" height=\"400\" loading=\"lazy\">\n  <figcaption>Команда ліцею<\/figcaption>\n<\/figure>", "code": true}, {"task": "Оберіть формат для кожного файлу: а) логотип, який має бути чітким на будь-якому екрані; б) фото екскурсії; в) скриншот програми з дрібним текстом.", "answer": "а) SVG — векторний, масштабується без втрат; б) JPEG або WebP/AVIF зі стисненням з втратами; в) PNG (або WebP без втрат) — зберігає чіткі краї тексту.", "code": false}, {"task": "Створіть CSS-анімацію `slide`, яка за 1 с плавно переміщує елемент `.card` зліва (зсув −100 px, прозорість 0) на місце (прозорість 1), і вимкніть її для користувачів, що просять менше руху.", "answer": "@keyframes slide {\n  from { transform: translateX(-100px); opacity: 0; }\n  to   { transform: translateX(0);      opacity: 1; }\n}\n.card { animation: slide 1s ease-out; }\n\n@media (prefers-reduced-motion: reduce) {\n  .card { animation: none; }\n}", "code": true}, {"task": "Вставте відео `intro.mp4` із заставкою `intro.jpg`, кнопками керування, українськими субтитрами `intro.vtt` і автозапуском, який не заблокує браузер.", "answer": "<video controls autoplay muted poster=\"intro.jpg\" width=\"640\">\n  <source src=\"intro.mp4\" type=\"video/mp4\">\n  <track src=\"intro.vtt\" kind=\"subtitles\" srclang=\"uk\" label=\"Українська\">\n<\/video>", "code": true}], "quiz": [{"q": "Який формат найкраще підходить для логотипа, що має бути чітким за будь-якого масштабу?", "o": ["SVG", "JPEG", "GIF", "BMP"], "a": 0, "why": "SVG — векторний формат, тому не втрачає якості при масштабуванні."}, {"q": "Для чого призначений атрибут `alt` тегу `<img>`?", "o": ["Задає підказку при наведенні миші", "Текстова альтернатива зображення для екранних дикторів, пошуковиків і випадку, коли картинка не завантажилась", "Вказує альтернативний файл зображення", "Задає вирівнювання зображення"], "a": 1, "why": "Підказку при наведенні задає `title`; `alt` — це текстовий замінник зображення."}, {"q": "Який формат використовує стиснення з втратами і не підтримує прозорість?", "o": ["PNG", "SVG", "JPEG", "WebP"], "a": 2, "why": "PNG і SVG підтримують прозорість, WebP — також."}, {"q": "Яке CSS-правило описує ключові кадри анімації?", "o": ["`@media`", "`@import`", "`@font-face`", "`@keyframes`"], "a": 3}, {"q": "Які властивості браузер анімує найефективніше?", "o": ["`transform` і `opacity`", "`width` і `height`", "`margin` і `padding`", "`top` і `left`"], "a": 0, "why": "Їх зміна не потребує перерахунку розмітки сторінки."}, {"q": "Що потрібно додати до `autoplay`, щоб браузер, найімовірніше, не заблокував автозапуск відео?", "o": ["`loop`", "`muted`", "`controls`", "`preload=\"auto\"`"], "a": 1, "why": "Браузери зазвичай дозволяють автозапуск лише без звуку."}, {"q": "Для чого в `<video>` використовують кілька елементів `<source>`?", "o": ["Щоб відтворити кілька відео одночасно", "Щоб задати субтитри різними мовами", "Щоб запропонувати різні формати: браузер відтворить перший підтримуваний", "Щоб створити плейлист"], "a": 2, "why": "Субтитри задають через `<track>`."}, {"q": "Який елемент дозволяє вбудувати на сторінку карту чи відео з іншого сайту?", "o": ["`<embed-site>`", "`<frameset>`", "`<link>`", "`<iframe>`"], "a": 3, "why": "`<frameset>` застарів і в HTML5 не використовується."}]}, {"id": "t34", "topic": 3, "code": "3.4", "title": "Веб-програмування, хостинг і взаємодія клієнт–сервер", "lessons": [{"n": 123, "title": "Об'єктна модель документа", "blocks": [["h", "Що таке DOM"], ["p", "Завантажуючи HTML, браузер будує **DOM** (Document Object Model) — дерево об'єктів, де кожен тег, атрибут і текст є **вузлом**. JavaScript працює не з текстом файлу, а з цим деревом: може знаходити, змінювати, додавати й видаляти вузли, і сторінка одразу оновлюється."], ["code", "<body>\n  <h1 id=\"title\">Розклад<\/h1>\n  <ul class=\"list\">\n    <li>Алгебра<\/li>\n    <li>Інформатика<\/li>\n  <\/ul>\n<\/body>\n\ndocument\n └─ html\n     └─ body\n         ├─ h1#title ── \"Розклад\"\n         └─ ul.list\n             ├─ li ── \"Алгебра\"\n             └─ li ── \"Інформатика\""], ["h", "Пошук елементів"], ["table", ["Метод", "Повертає"], [["`document.getElementById(\"title\")`", "один елемент за `id`"], ["`document.querySelector(\".list li\")`", "перший елемент за CSS-селектором"], ["`document.querySelectorAll(\"li\")`", "колекцію (NodeList) усіх відповідних елементів"], ["`elem.parentElement`, `elem.children`", "батьківський і дочірні елементи"]]], ["h", "Зміна вмісту і створення елементів"], ["code", "const title = document.getElementById(\"title\");\ntitle.textContent = \"Розклад на понеділок\";   // текст\ntitle.style.color = \"#0057b7\";                 // інлайн-стиль\ntitle.classList.add(\"highlight\");              // клас CSS\n\nconst li = document.createElement(\"li\");       // новий вузол\nli.textContent = \"Фізика\";\ndocument.querySelector(\".list\").append(li);    // додати в кінець\n\ndocument.querySelectorAll(\"li\").forEach((item, i) => {\n  item.textContent = (i + 1) + \". \" + item.textContent;\n});"], ["note", "Для тексту від користувача використовуйте `textContent`, а не `innerHTML`: `innerHTML` розбирає рядок як HTML, і зловмисник може вставити шкідливий код (атака XSS). Скрипт підключайте в кінці `<body>` або з атрибутом `defer`, щоб DOM уже був побудований."]]}, {"n": 124, "title": "Веб-програмування та інтерактивні сторінки", "blocks": [["h", "JavaScript на сторінці"], ["p", "**JavaScript** — мова програмування, яку виконує браузер. Вона робить сторінку інтерактивною: реагує на дії користувача, змінює DOM, обмінюється даними із сервером. Код підключають через `<script src=\"app.js\" defer><\/script>`."], ["code", "// змінні та типи\nlet count = 0;            // можна змінювати\nconst name = \"Олена\";     // константа\nconst marks = [10, 11, 9];\n\n// функція\nfunction average(arr) {\n  let sum = 0;\n  for (const m of arr) sum += m;\n  return sum / arr.length;\n}\nconsole.log(name, average(marks));   // Олена 10"], ["h", "Події"], ["p", "**Подія** — сигнал про те, що щось сталося: клік, натискання клавіші, введення тексту, завантаження сторінки. Обробник призначають методом `addEventListener(тип, функція)`."], ["code", "<button id=\"plus\">+1<\/button>\n<p>Натиснуто: <span id=\"out\">0<\/span><\/p>\n<script>\n  let count = 0;\n  document.getElementById(\"plus\").addEventListener(\"click\", () => {\n    count++;\n    document.getElementById(\"out\").textContent = count;\n  });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Escape\") count = 0;\n  });\n<\/script>"], ["table", ["Подія", "Коли виникає"], [["`click`", "клік мишею або дотик"], ["`input`", "кожна зміна значення поля"], ["`change`", "значення поля змінено й підтверджено"], ["`submit`", "надсилання форми"], ["`keydown`", "натискання клавіші"], ["`DOMContentLoaded`", "DOM побудовано"]]], ["note", "Помилки JavaScript шукайте в **консолі** інструментів розробника (F12 → Console). Там видно текст помилки й рядок, де вона виникла; `console.log()` допомагає відстежувати значення змінних."]]}, {"n": 125, "title": "Хостинг сайта", "blocks": [["h", "Що потрібно, щоб сайт побачили всі"], ["ul", ["**Хостинг** — місце на сервері, підключеному до інтернету цілодобово, де зберігаються файли сайту;", "**доменне ім'я** — зручна адреса (`yasno.example.ua`) замість IP-адреси сервера;", "**DNS** — система, що перетворює доменне ім'я на IP-адресу (запис `A` вказує на IPv4-адресу, `CNAME` — псевдонім іншого імені);", "**SSL/TLS-сертифікат** — для захищеного протоколу HTTPS."]], ["h", "Види хостингу"], ["table", ["Вид", "Суть", "Коли доречний"], [["Статичний хостинг", "лише HTML/CSS/JS-файли, часто безкоштовно (GitHub Pages, Netlify тощо)", "сайт-візитка, портфоліо, документація"], ["Віртуальний (shared)", "один сервер ділять багато клієнтів; є панель керування, PHP, MySQL", "невеликі динамічні сайти, CMS"], ["VPS/VDS", "віртуальний сервер з повним доступом адміністратора", "сайти з особливими налаштуваннями, середнє навантаження"], ["Виділений сервер", "окремий фізичний сервер", "велике навантаження"], ["Хмарний", "ресурси масштабуються за потребою, оплата за використання", "сервіси зі змінним навантаженням"]]], ["h", "Критерії вибору"], ["ul", ["підтримувані технології (статичні файли, PHP, Node.js, Python, бази даних);", "обсяг диска, трафік, кількість сайтів і баз даних;", "надійність (аптайм), резервне копіювання, технічна підтримка;", "наявність безкоштовного сертифіката HTTPS, розташування серверів, ціна."]], ["note", "Безкоштовні піддомени (на кшталт `name.github.io`) підходять для навчальних проєктів. Для офіційного сайту установи краще зареєструвати власний домен."]]}, {"n": 126, "title": "Розміщення сайту на сервері", "blocks": [["p", "**Практична робота 10.** Мета: опублікувати власний статичний сайт в інтернеті та перевірити його роботу."], ["h", "Способи завантаження файлів"], ["ul", ["**файловий менеджер** у панелі керування хостингом;", "**FTP/SFTP**-клієнт (наприклад, FileZilla): адреса сервера, логін, пароль, порт; файли копіюють у кореневу папку сайту (часто `public_html` або `www`);", "**Git**: репозиторій на GitHub + увімкнення GitHub Pages у налаштуваннях (Settings → Pages)."]], ["ol", ["Перевірте, що головна сторінка називається `index.html`, а всі шляхи відносні (`images/logo.svg`, не `C:\\Users\\...`).", "Зверніть увагу на регістр: на серверах з Linux `Logo.png` і `logo.png` — різні файли.", "Завантажте файли на хостинг одним зі способів.", "Відкрийте адресу сайту, перевірте всі сторінки, зображення, посилання, роботу на смартфоні.", "Переконайтеся, що сайт відкривається через `https://`."]], ["table", ["Критерій", "Бали"], [["Сайт доступний за публічною адресою", "4"], ["Усі сторінки, зображення й посилання працюють", "4"], ["Працює HTTPS, сторінка коректна на мобільному", "4"]]], ["note", "Не публікуйте в коді паролі, особисті дані учнів чи службові документи: усе, що лежить на публічному хостингу, може прочитати будь-хто."]]}, {"n": 127, "title": "Веб-сервер і база даних", "blocks": [["h", "Статичні і динамічні сайти"], ["p", "**Статичний** сайт віддає однакові для всіх готові файли. **Динамічний** формує сторінку в момент запиту: серверна програма бере дані з **бази даних** і вставляє їх у шаблон (новини, оцінки, кошик інтернет-магазину)."], ["h", "Складники серверної частини"], ["ul", ["**веб-сервер** (Apache, Nginx тощо) — приймає HTTP-запити, віддає файли або передає запит програмі;", "**серверна мова/платформа** — PHP, Python (Django, Flask), JavaScript (Node.js), Java тощо;", "**СУБД** — MySQL/MariaDB, PostgreSQL, SQLite; дані зберігаються в таблицях і запитуються мовою SQL."]], ["code", "Браузер ──HTTP-запит GET /news──► Веб-сервер\n                                     │\n                          серверна програма\n                                     │  SELECT title, date FROM news\n                                     ▼  ORDER BY date DESC LIMIT 5;\n                                   СУБД\n                                     │\nБраузер ◄──HTML зі свіжими новинами──┘"], ["h", "Приклад: таблиця і запит"], ["code", "CREATE TABLE messages (\n  id      INTEGER PRIMARY KEY,\n  name    VARCHAR(50)  NOT NULL,\n  email   VARCHAR(100) NOT NULL,\n  text    TEXT,\n  created DATE\n);\n\nINSERT INTO messages (name, email, text, created)\nVALUES ('Іван', 'ivan@example.com', 'Коли батьківські збори?', '2026-10-01');\n\nSELECT name, text FROM messages ORDER BY created DESC;"], ["note", "Ніколи не підставляйте введені користувачем дані прямо в рядок SQL — це відкриває шлях до атаки **SQL-ін'єкція**. Серверні бібліотеки мають параметризовані запити, які безпечно передають значення окремо від тексту запиту."]]}, {"n": 128, "title": "Взаємодія клієнт-сервер", "blocks": [["h", "Модель клієнт–сервер"], ["p", "**Клієнт** (браузер, мобільний застосунок) надсилає **запит**, **сервер** обробляє його і повертає **відповідь**. Обмін відбувається за протоколом **HTTP**; у захищеному варіанті **HTTPS** дані шифруються за допомогою TLS."], ["h", "Будова HTTP-запиту і відповіді"], ["code", "GET /schedule?class=11 HTTP/1.1\nHost: yasno.example.ua\nAccept: text/html\n\nHTTP/1.1 200 OK\nContent-Type: text/html; charset=utf-8\nContent-Length: 1532\n\n<!doctype html> ..."], ["table", ["Метод", "Призначення"], [["`GET`", "отримати ресурс; параметри в URL після `?`"], ["`POST`", "надіслати дані (форма, новий запис); дані в тілі запиту"], ["`PUT` / `PATCH`", "замінити / частково змінити ресурс"], ["`DELETE`", "видалити ресурс"]]], ["table", ["Код стану", "Значення"], [["`200 OK`", "успіх"], ["`201 Created`", "ресурс створено"], ["`301` / `302`", "переадресація (постійна / тимчасова)"], ["`400 Bad Request`", "некоректний запит"], ["`403 Forbidden`", "доступ заборонено"], ["`404 Not Found`", "ресурс не знайдено"], ["`500 Internal Server Error`", "помилка на сервері"]]], ["note", "Переглянути реальні запити можна у вкладці **Network** інструментів розробника (F12): там видно метод, адресу, код стану, заголовки та час завантаження кожного файлу. HTTP не зберігає стан між запитами, тому для «запам'ятовування» користувача використовують cookies і сесії."]]}, {"n": 129, "title": "Використання форм. Основні елементи форми", "blocks": [["h", "Елемент form"], ["p", "Форма збирає дані від користувача. Атрибут `action` задає адресу обробника, `method` — метод HTTP (`get` або `post`). Кожне поле повинно мати атрибут `name` — саме під цим іменем значення потрапить на сервер."], ["code", "<form action=\"/register\" method=\"post\">\n  <label for=\"name\">Прізвище та ім'я<\/label>\n  <input id=\"name\" name=\"name\" type=\"text\" required>\n\n  <label for=\"email\">Електронна пошта<\/label>\n  <input id=\"email\" name=\"email\" type=\"email\" required>\n\n  <label for=\"grade\">Клас<\/label>\n  <select id=\"grade\" name=\"grade\">\n    <option value=\"10\">10<\/option>\n    <option value=\"11\" selected>11<\/option>\n  <\/select>\n\n  <fieldset>\n    <legend>Форма навчання<\/legend>\n    <label><input type=\"radio\" name=\"form\" value=\"extern\"> екстернат<\/label>\n    <label><input type=\"radio\" name=\"form\" value=\"distance\"> дистанційна<\/label>\n  <\/fieldset>\n\n  <label><input type=\"checkbox\" name=\"agree\" required> Погоджуюсь з умовами<\/label>\n\n  <textarea name=\"comment\" rows=\"4\" placeholder=\"Коментар\"><\/textarea>\n  <button type=\"submit\">Надіслати<\/button>\n<\/form>"], ["table", ["`type` поля input", "Призначення"], [["`text`, `password`", "текст, прихований текст"], ["`email`, `tel`, `url`", "пошта, телефон, адреса (зручна клавіатура на смартфоні)"], ["`number`, `range`", "число, повзунок"], ["`date`, `time`", "дата, час"], ["`checkbox`, `radio`", "прапорець, перемикач (одна група — однаковий `name`)"], ["`file`", "вибір файлу (форма з `enctype=\"multipart/form-data\"`)"]]], ["note", "Кожне поле зв'язуйте з `<label>` (через `for`/`id` або вкладенням). Тоді клік по підпису фокусує поле, а екранний диктор озвучує, що вводити. `placeholder` не замінює підпис."]]}, {"n": 130, "title": "Валідація та збереження даних форм", "blocks": [["h", "Вбудована валідація HTML"], ["p", "**Валідація** — перевірка правильності введених даних. Браузер сам перевіряє атрибути і не надсилає форму з помилками."], ["ul", ["`required` — поле обов'язкове;", "`minlength`, `maxlength` — довжина тексту;", "`min`, `max`, `step` — межі числа чи дати;", "`pattern` — регулярний вираз, напр. `pattern=\"\\+380\\d{9}\"` для номера `+380XXXXXXXXX`;", "`type=\"email\"`, `type=\"url\"` — перевірка формату."]], ["h", "Перевірка в JavaScript"], ["code", "<form id=\"f\">\n  <input id=\"pass\" type=\"password\" minlength=\"8\" required>\n  <input id=\"pass2\" type=\"password\" required>\n  <button>Зареєструватися<\/button>\n  <p id=\"msg\"><\/p>\n<\/form>\n<script>\n  const f = document.getElementById(\"f\");\n  f.addEventListener(\"submit\", (e) => {\n    e.preventDefault();                 // не перезавантажувати сторінку\n    const p1 = document.getElementById(\"pass\").value;\n    const p2 = document.getElementById(\"pass2\").value;\n    const msg = document.getElementById(\"msg\");\n    if (p1 !== p2) {\n      msg.textContent = \"Паролі не збігаються\";\n      return;\n    }\n    msg.textContent = \"Дані коректні\";\n  });\n<\/script>"], ["h", "Збереження даних"], ["ul", ["**на сервері** — форма надсилається запитом `POST`, серверна програма повторно перевіряє дані й записує їх у базу;", "**у браузері** — `localStorage` зберігає пари «ключ–значення» (лише рядки) між відвідинами; `sessionStorage` — до закриття вкладки."]], ["code", "const draft = { name: \"Олена\", comment: \"Питання щодо розкладу\" };\nlocalStorage.setItem(\"draft\", JSON.stringify(draft));   // зберегти\nconst saved = JSON.parse(localStorage.getItem(\"draft\")); // прочитати\nconsole.log(saved.name);                                 // Олена\nlocalStorage.removeItem(\"draft\");                        // видалити"], ["note", "Клієнтська валідація — лише зручність для користувача: її легко обійти. **Сервер завжди мусить перевіряти дані повторно.** У `localStorage` не зберігайте паролі та інші конфіденційні дані."]]}, {"n": 131, "title": "Прикладний програмний інтерфейс", "blocks": [["h", "Що таке API"], ["p", "**API** (Application Programming Interface) — набір правил, за якими одна програма звертається до іншої. **Веб-API** — це адреси на сервері, які у відповідь на HTTP-запит повертають дані (найчастіше у форматі **JSON**), а не готову сторінку. Так працюють прогнози погоди, курси валют, карти."], ["code", "{\n  \"class\": \"11-А\",\n  \"students\": 24,\n  \"subjects\": [\"Інформатика\", \"Алгебра\"],\n  \"extern\": false\n}"], ["h", "Запит з fetch"], ["p", "Функція `fetch(url)` надсилає запит і повертає **проміс** (Promise) — об'єкт-обіцянку результату в майбутньому. Зручно працювати з ним через `async`/`await`."], ["code", "async function loadUsers() {\n  try {\n    const response = await fetch(\"https://jsonplaceholder.typicode.com/users\");\n    if (!response.ok) throw new Error(\"HTTP \" + response.status);\n    const users = await response.json();          // розбір JSON\n    const list = document.getElementById(\"users\");\n    for (const u of users) {\n      const li = document.createElement(\"li\");\n      li.textContent = u.name + \" — \" + u.email;\n      list.append(li);\n    }\n  } catch (err) {\n    console.error(\"Не вдалося завантажити:\", err.message);\n  }\n}\nloadUsers();"], ["h", "Надсилання даних методом POST"], ["code", "const res = await fetch(\"/api/messages\", {\n  method: \"POST\",\n  headers: { \"Content-Type\": \"application/json\" },\n  body: JSON.stringify({ name: \"Іван\", text: \"Привіт\" })\n});"], ["note", "Браузер дозволяє звертатися до API іншого домену, лише якщо той сервер це явно дозволяє заголовками **CORS**. Ключі доступу до платних API не розміщуйте в клієнтському коді — їх побачить кожен."]]}, {"n": 132, "title": "Створення та налагодження інтерактивної веб-сторінки з використанням форм та веб-програмування", "blocks": [["p", "**Практична робота 11.** Мета: створити сторінку «Запис на консультацію» з формою, валідацією, збереженням чернетки і виведенням даних з API. Урок завершує тематичну атестацію."], ["ol", ["Створіть форму: ім'я, e-mail, клас (`select`), дата (`date`), тема (`textarea`), згода (`checkbox`), кнопка.", "Додайте HTML-валідацію (`required`, `minlength`, `type=\"email\"`, `min` для дати).", "У JavaScript обробіть `submit`: `preventDefault()`, додаткова перевірка, повідомлення про помилку чи успіх під формою.", "Зберігайте чернетку в `localStorage` під час події `input` і відновлюйте її після перезавантаження.", "Після успішного «надсилання» додайте запис до списку на сторінці (через `createElement`).", "Завантажте з будь-якого відкритого API (наприклад, `jsonplaceholder.typicode.com`) кілька записів і виведіть їх.", "Налагодьте сторінку: консоль без помилок, у вкладці Network запит повертає `200`."]], ["table", ["Критерій", "Бали"], [["Повна, доступна форма з підписами", "3"], ["HTML- і JS-валідація з зрозумілими повідомленнями", "3"], ["Робота з DOM і localStorage", "3"], ["Запит до API з обробкою помилок", "3"]]], ["note", "Налагоджуйте поетапно: після кожного кроку перевіряйте консоль. Якщо елемент не знаходиться (`null`), перевірте `id` і те, чи підключено скрипт після розмітки або з `defer`."]]}], "practice": [{"task": "На сторінці є `<ul id=\"list\"><\/ul>`. Напишіть JavaScript, що виводить у список предмети з масиву `[\"Фізика\", \"Хімія\", \"Біологія\"]`, причому кожен пункт при кліку перекреслюється (CSS-клас `done`) і повторним кліком відновлюється.", "answer": "const subjects = [\"Фізика\", \"Хімія\", \"Біологія\"];\nconst list = document.getElementById(\"list\");\nfor (const s of subjects) {\n  const li = document.createElement(\"li\");\n  li.textContent = s;\n  li.addEventListener(\"click\", () => li.classList.toggle(\"done\"));\n  list.append(li);\n}", "code": true}, {"task": "Напишіть поле для українського мобільного номера у форматі `+380XXXXXXXXX` (12 цифр після `+`), обов'язкове, з підказкою формату.", "answer": "<label for=\"phone\">Телефон<\/label>\n<input id=\"phone\" name=\"phone\" type=\"tel\" required\n       pattern=\"\\+380\\d{9}\" placeholder=\"+380671234567\"\n       title=\"Формат: +380 і 9 цифр\">", "code": true}, {"task": "Користувач відкриває `https://site.ua/olimp.html`, а файлу немає на сервері. Який код стану поверне сервер? А якщо в серверній програмі сталася необроблена помилка? Яким методом краще надсилати форму реєстрації з паролем і чому?", "answer": "Немає файлу — `404 Not Found`; помилка на сервері — `500 Internal Server Error`. Форму з паролем надсилають методом `POST`: дані йдуть у тілі запиту, а не в URL, тож не потрапляють в історію браузера і журнали адрес (а шифрування забезпечує HTTPS).", "code": false}, {"task": "Напишіть асинхронну функцію `showTodo(id)`, яка завантажує `https://jsonplaceholder.typicode.com/todos/` + id, і виводить у `<p id=\"todo\">` поле `title`, а у разі помилки — текст «Помилка завантаження».", "answer": "async function showTodo(id) {\n  const out = document.getElementById(\"todo\");\n  try {\n    const res = await fetch(\"https://jsonplaceholder.typicode.com/todos/\" + id);\n    if (!res.ok) throw new Error(res.status);\n    const data = await res.json();\n    out.textContent = data.title;\n  } catch (e) {\n    out.textContent = \"Помилка завантаження\";\n  }\n}\nshowTodo(1);", "code": true}, {"task": "Ви завантажили сайт на хостинг, але замість зображення `Images/Logo.PNG` — «биті» картинки, хоча локально все працювало у Windows. Назвіть ймовірну причину і виправлення.", "answer": "На серверах з Linux імена файлів чутливі до регістру: якщо файл названо `images/logo.png`, а в коді `Images/Logo.PNG`, сервер його не знайде (404). Треба привести назви в коді й на диску до однакового вигляду, краще — лише малими латинськими літерами.", "code": false}], "quiz": [{"q": "Що таке DOM?", "o": ["Деревоподібна об'єктна модель HTML-документа, з якою працює JavaScript", "Мова розмітки веб-сторінок", "Протокол обміну даними між браузером і сервером", "Формат зберігання стилів"], "a": 0}, {"q": "Який метод повертає перший елемент, що відповідає CSS-селектору?", "o": ["`document.getElementsByTagName()`", "`document.querySelector()`", "`document.querySelectorAll()`", "`document.createElement()`"], "a": 1, "why": "`querySelectorAll` повертає всі відповідні елементи."}, {"q": "Чому для виведення тексту, введеного користувачем, безпечніше використовувати `textContent`, а не `innerHTML`?", "o": ["`textContent` працює швидше в усіх браузерах", "`innerHTML` не підтримує кирилицю", "`innerHTML` розбирає рядок як HTML, що дає змогу вставити шкідливий код (XSS)", "`textContent` автоматично зберігає дані на сервері"], "a": 2}, {"q": "Яка подія виникає під час надсилання форми?", "o": ["`send`", "`click`", "`post`", "`submit`"], "a": 3, "why": "`click` виникає на кнопці, але обробляти надсилання слід подією `submit` форми."}, {"q": "Що робить DNS?", "o": ["Перетворює доменне ім'я на IP-адресу сервера", "Шифрує дані між браузером і сервером", "Зберігає файли сайту", "Перевіряє HTML-код на помилки"], "a": 0, "why": "Шифрування забезпечує TLS у протоколі HTTPS."}, {"q": "Який HTTP-метод зазвичай використовують, щоб отримати сторінку чи дані?", "o": ["`POST`", "`GET`", "`DELETE`", "`PUT`"], "a": 1}, {"q": "Що означає код стану `404`?", "o": ["Внутрішня помилка сервера", "Доступ заборонено", "Запитаний ресурс не знайдено", "Запит виконано успішно"], "a": 2, "why": "500 — помилка сервера, 403 — заборонено, 200 — успіх."}, {"q": "Яким атрибутом поле форми робиться обов'язковим?", "o": ["`pattern`", "`placeholder`", "`name`", "`required`"], "a": 3}, {"q": "Чому перевірку даних форми обов'язково повторюють на сервері?", "o": ["Клієнтську валідацію легко обійти, надіславши запит в обхід браузера або змінивши код", "Браузери не вміють перевіряти e-mail", "Без цього форма не надсилається", "Цього вимагає протокол HTTP"], "a": 0}, {"q": "Що повертає функція `fetch()`?", "o": ["Одразу масив даних у форматі JSON", "Проміс (Promise), що завершиться об'єктом відповіді", "HTML-код сторінки як рядок", "Код стану HTTP як число"], "a": 1, "why": "Дані з відповіді отримують окремо, наприклад `await response.json()`."}]}, {"id": "t35", "topic": 3, "code": "3.5", "title": "Ергономіка, пошукова оптимізація і проєкт сайту", "lessons": [{"n": 133, "title": "Правила ергономічного розміщення відомостей на веб-сторінці", "blocks": [["h", "Ергономіка та юзабіліті"], ["p", "**Ергономічний** сайт дозволяє користувачу швидко знайти потрібне, не втомлюючись і не помиляючись. Якість взаємодії називають **юзабіліті** (зручність використання), а придатність для людей з різними можливостями — **доступністю**."], ["h", "Як читають сторінки"], ["ul", ["користувачі не читають, а **переглядають** сторінку, часто за F-подібною траєкторією: заголовки, початки абзаців, ліва частина;", "тому головне розміщують угорі та ліворуч, використовують чіткі заголовки, короткі абзаци, списки, виділення ключових слів;", "логотип зазвичай угорі ліворуч і веде на головну, меню — угорі, контакти — у «підвалі» (footer)."]], ["h", "Правила оформлення"], ["table", ["Аспект", "Рекомендація"], [["Шрифт", "основний текст не дрібніше 16 px, 1–2 гарнітури на сайт, міжрядковий інтервал близько 1,5"], ["Довжина рядка", "приблизно 50–75 символів, тому текстовий блок обмежують `max-width`"], ["Контраст", "за рекомендаціями WCAG — щонайменше 4,5:1 для звичайного тексту і 3:1 для великого"], ["Колір", "обмежена палітра; інформацію не передають лише кольором (додають текст, значок)"], ["Навігація", "однакова на всіх сторінках, поточний пункт виділено, до будь-якої сторінки — кілька кліків"], ["Елементи керування", "посилання й кнопки візуально відрізняються від тексту, мінімальний розмір цілі дотику близько 44×44 px"], ["Порожній простір", "відступи групують пов'язане й відокремлюють різне"]]], ["code", "body {\n  font: 16px/1.5 system-ui, sans-serif;\n  color: #1a1a1a;\n  background: #ffffff;\n}\nmain { max-width: 70ch; margin: 0 auto; padding: 0 16px; }\na:focus-visible, button:focus-visible { outline: 3px solid #0057b7; }"], ["note", "Перевірте свою сторінку «тестом п'яти секунд»: покажіть її людині на 5 секунд і запитайте, про що сайт і що на ньому можна зробити. Якщо відповісти важко — структуру варто спростити."]]}, {"n": 134, "title": "Пошукова оптимізація та просування веб-сайтів", "blocks": [["h", "Що таке SEO"], ["p", "**Пошукова оптимізація (SEO)** — комплекс заходів, щоб пошукові системи правильно розуміли сайт і показували його вище в результатах за релевантними запитами. Пошуковий робот **сканує** сторінки, **індексує** їх вміст, а алгоритм **ранжує** результати."], ["h", "Внутрішня оптимізація"], ["code", "<!doctype html>\n<html lang=\"uk\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Екстернат 11 клас — Ліцей «ЯСНО», Рівне<\/title>\n  <meta name=\"description\" content=\"Як вступити на екстернат: умови, розклад, контакти.\">\n  <link rel=\"canonical\" href=\"https://yasno.example.ua/extern\">\n<\/head>\n<body>\n  <h1>Екстернат для 11 класу<\/h1>\n  ...\n<\/body>\n<\/html>"], ["ul", ["унікальний змістовний `<title>` і `meta description` для кожної сторінки;", "один `<h1>`, логічна ієрархія `h2`–`h6`, семантичні теги (`header`, `nav`, `main`, `article`, `footer`);", "зрозумілі адреси: `/extern/11-klas` краще, ніж `/page?id=372`;", "`alt` у зображень, внутрішні посилання з осмисленим текстом (не «тут»);", "швидке завантаження, адаптивність до мобільних, HTTPS;", "файли `robots.txt` (що можна сканувати) і `sitemap.xml` (перелік сторінок)."]], ["code", "# robots.txt\nUser-agent: *\nDisallow: /admin/\nSitemap: https://yasno.example.ua/sitemap.xml"], ["h", "Зовнішня оптимізація і просування"], ["ul", ["корисний, оригінальний, регулярно оновлюваний контент — головний чинник;", "посилання з авторитетних тематичних сайтів, згадки в каталогах і на картах;", "соціальні мережі, e-mail-розсилки, контекстна реклама (платні оголошення в пошуку)."]], ["note", "Заборонені прийоми (приховування тексту, перенасичення ключовими словами, купівля посилань) пошукові системи виявляють і можуть знизити позиції сайту або виключити його з індексу."]]}, {"n": 135, "title": "Оцінка сайту. Просування сайту", "blocks": [["p", "**Практична робота 12.** Мета: провести аудит власного сайту за технічними, ергономічними і SEO-критеріями та скласти план просування."], ["h", "Інструменти оцінки"], ["table", ["Інструмент", "Що перевіряє"], [["Валідатор W3C (validator.w3.org)", "помилки HTML-розмітки"], ["Lighthouse (F12 у Chrome)", "продуктивність, доступність, найкращі практики, SEO — оцінки від 0 до 100"], ["Режим пристрою в інструментах розробника", "вигляд на різних екранах"], ["Google Search Console та аналогічні сервіси пошуковиків", "індексація, пошукові запити, помилки сканування"], ["Системи веб-аналітики", "відвідуваність, джерела трафіку, поведінка користувачів"]]], ["p", "Важливі показники швидкодії — **Core Web Vitals**: **LCP** (час відображення найбільшого елемента), **INP** (швидкість реакції на дії) і **CLS** (стабільність макета, відсутність «стрибків»)."], ["ol", ["Перевірте HTML валідатором і виправте помилки.", "Запустіть Lighthouse для мобільного режиму, запишіть оцінки за чотирма категоріями.", "Виправте щонайменше три зауваження (наприклад, `alt`, контраст, розміри зображень, `meta description`) і повторіть аудит.", "Оцініть ергономіку за чек-листом уроку 133.", "Складіть план просування: цільова аудиторія, 5 ключових запитів, канали (соцмережі, каталоги, партнерські посилання), спосіб вимірювання результату."]], ["note", "У звіті наведіть оцінки «до» і «після» та коротко поясніть, що саме змінили."]]}, {"n": 136, "title": "Виконання індивідуальних та колективних проєктів", "blocks": [["p", "Мета: розпочати проєкт — багатосторінковий сайт на обрану тему (сайт гуртка, класу, путівник рідним містом, портфоліо, довідник з предмета)."], ["ol", ["Оберіть тему, сформулюйте мету сайту і цільову аудиторію.", "У колективному проєкті розподіліть ролі: керівник, дизайнер, верстальник, автор контенту, тестувальник.", "Складіть карту сайту: 4–6 сторінок і зв'язки між ними.", "Намалюйте ескіз (вайрфрейм) головної та внутрішньої сторінки: шапка, меню, основний вміст, футер.", "Створіть репозиторій або папку проєкту, спільний файл стилів, шаблон сторінки."]], ["table", ["Аспект", "Обов'язкова вимога до проєкту"], [["Структура", "семантична розмітка, єдине меню, адаптивність"], ["Медіа", "оптимізована графіка, хоча б один мультимедійний елемент"], ["Інтерактивність", "форма з валідацією і JavaScript-обробка подій"], ["Якість", "ергономіка, базове SEO, публікація на хостингу"]]], ["note", "Ведіть журнал проєкту: дата, хто що зробив, які проблеми виникли. Це знадобиться для звіту й презентації."]]}, {"n": 137, "title": "Виконання індивідуальних та колективних проєктів (продовження)", "blocks": [["p", "Мета: реалізувати основну частину сайту — верстку, контент і інтерактивність."], ["ol", ["Зверстайте всі сторінки за шаблоном, наповніть їх власним текстом і зображеннями.", "Додайте мультимедіа, анімацію переходів, галерею.", "Реалізуйте форму зворотного зв'язку з валідацією та збереженням чернетки.", "За бажанням — виведення даних з відкритого API або інтерактивний елемент (тест, калькулятор, фільтр).", "Регулярно перевіряйте консоль і вигляд на мобільному."]], ["note", "Не копіюйте чужі тексти й зображення без дозволу: використовуйте власні матеріали або ресурси з відкритими ліцензіями з указанням джерела."]]}, {"n": 138, "title": "Виконання індивідуальних та колективних проєктів. Оформлення результатів проєкту", "blocks": [["p", "Мета: завершити, протестувати й опублікувати сайт та підготувати звіт."], ["ol", ["Проведіть тестування: усі посилання, форма, різні браузери й ширини екрана.", "Виконайте аудит Lighthouse і валідатором, виправте помилки.", "Додайте `title`, `meta description`, `alt`, `robots.txt`.", "Опублікуйте сайт на хостингу й перевірте його за публічною адресою.", "Оформіть звіт: тема і мета, аудиторія, карта сайту, використані технології, розподіл ролей, проблеми та їх розв'язання, посилання на сайт."]], ["table", ["Критерій оцінювання проєкту", "Бали"], [["Відповідність темі й меті, якість контенту", "3"], ["Технічна якість (валідний код, адаптивність, швидкодія)", "3"], ["Інтерактивність і мультимедіа", "3"], ["Ергономіка, доступність, SEO, публікація", "3"]]]]}, {"n": 139, "title": "Презентація результатів проєкту", "blocks": [["p", "Мета: представити проєкт і захистити його. Урок завершує тематичну атестацію з теми 3."], ["ol", ["Підготуйте виступ на 5–7 хвилин: проблема й мета, демонстрація сайту в браузері, технічні рішення, складнощі, висновки.", "Покажіть живу роботу сайту за публічною адресою, а не лише скриншоти.", "Будьте готові відповісти на питання щодо коду: як працює форма, як оптимізовано зображення, які результати аудиту.", "Оцініть проєкти однокласників за спільними критеріями й дайте конструктивні відгуки."]], ["note", "Для дистанційного захисту заздалегідь перевірте демонстрацію екрана й мікрофон та майте запасний варіант — відеозапис демонстрації сайту."]]}], "practice": [{"task": "Напишіть розділ `<head>` для сторінки «Гурток робототехніки» ліцею: українська мова, адаптивність, змістовний заголовок до ~60 символів і опис до ~160 символів.", "answer": "<html lang=\"uk\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Гурток робототехніки — Ліцей «ЯСНО», Рівне<\/title>\n  <meta name=\"description\" content=\"Заняття з робототехніки для 8–11 класів: розклад, програма, запис онлайн.\">\n<\/head>", "code": true}, {"task": "Знайдіть і поясніть ергономічні помилки: світло-сірий текст 12 px на білому тлі, рядки на всю ширину екрана 1920 px, посилання того ж кольору, що й текст, без підкреслення, помилки у формі позначено лише червоною рамкою.", "answer": "1) Дрібний шрифт і низький контраст — збільшити до 16 px і зробити текст темнішим (контраст не менше 4,5:1). 2) Задовгі рядки важко читати — обмежити ширину блоку (`max-width` близько 70ch). 3) Посилання непомітні — виділити кольором і підкресленням. 4) Інформацію передано лише кольором — додати текстове повідомлення про помилку біля поля.", "code": false}, {"task": "Напишіть `robots.txt`, що забороняє всім роботам сканувати папки `/admin/` і `/drafts/` та вказує карту сайту `https://example.ua/sitemap.xml`.", "answer": "User-agent: *\nDisallow: /admin/\nDisallow: /drafts/\nSitemap: https://example.ua/sitemap.xml", "code": true}, {"task": "Lighthouse показав низьку оцінку продуктивності й високий CLS. Назвіть дві ймовірні причини, пов'язані з зображеннями, і способи їх усунення.", "answer": "1) Завеликі зображення (розмір і вага) — зменшити до потрібних розмірів, стиснути, використати WebP/AVIF і `srcset`, `loading=\"lazy\"` для зображень поза першим екраном. 2) Зображенням не задано `width`/`height` (або `aspect-ratio`), через що під час завантаження вміст зсувається — вказати розміри, щоб браузер зарезервував місце.", "code": false}], "quiz": [{"q": "За якою траєкторією користувачі найчастіше переглядають текстові сторінки?", "o": ["F-подібною", "Справа наліво знизу вгору", "По колу від центру", "Лише по діагоналі"], "a": 0}, {"q": "Яке мінімальне співвідношення контрасту WCAG рекомендує для звичайного тексту?", "o": ["1,5:1", "4,5:1", "2:1", "10:1"], "a": 1, "why": "Для великого тексту — 3:1."}, {"q": "Яка оптимальна довжина рядка основного тексту?", "o": ["10–20 символів", "Уся ширина екрана", "Приблизно 50–75 символів", "150–200 символів"], "a": 2}, {"q": "Що означає абревіатура SEO?", "o": ["Захищене шифрування з'єднання", "Система електронного обліку", "Стандарт оформлення електронних документів", "Пошукова оптимізація сайту"], "a": 3}, {"q": "Який тег задає заголовок сторінки, що показується у вкладці браузера і в результатах пошуку?", "o": ["`<title>`", "`<h1>`", "`<header>`", "`<meta name=\"title\">`"], "a": 0, "why": "`<h1>` — головний заголовок у вмісті сторінки."}, {"q": "Для чого потрібен файл `sitemap.xml`?", "o": ["Забороняє індексацію сайту", "Містить перелік сторінок сайту для пошукових роботів", "Зберігає стилі сайту", "Описує структуру бази даних"], "a": 1, "why": "Заборони сканування задають у `robots.txt`."}, {"q": "Який інструмент дозволяє оцінити продуктивність, доступність і SEO сторінки прямо в Chrome?", "o": ["FileZilla", "Inkscape", "Lighthouse", "Notepad"], "a": 2}, {"q": "Який із прийомів може призвести до санкцій пошукових систем?", "o": ["Унікальний `meta description` для кожної сторінки", "Атрибути `alt` у зображень", "Використання HTTPS", "Перенасичення тексту ключовими словами і прихований текст"], "a": 3}]}, {"id": "t41", "topic": 4, "code": "4.1", "title": "Методології розробки і проєктна робота", "lessons": [{"n": 140, "title": "Підходи до системного аналізу, етапи та методології розробки", "blocks": [["p", "**Системний аналіз** — це підхід до розв'язання складних задач, за якого об'єкт розглядають як **систему**: сукупність взаємопов'язаних елементів, що разом виконують певну мету. Перш ніж писати програму, аналітик з'ясовує, яку проблему вона розв'язує, хто нею користуватиметься, з якими іншими системами вона взаємодіє і які існують обмеження (час, бюджет, обладнання, закони)."], ["ul", ["**Декомпозиція** — поділ складної системи на простіші підсистеми (наприклад, електронний журнал → облік учнів, оцінки, розклад, звіти).", "**Цілісність** — властивості системи не зводяться до суми властивостей частин; важливі зв'язки між ними.", "**Ієрархічність** — кожна підсистема сама є системою нижчого рівня.", "**Модельність** — систему вивчають через моделі: схеми, діаграми, таблиці, прототипи."]], ["h", "Життєвий цикл програмного забезпечення"], ["p", "**Життєвий цикл ПЗ** — період від появи ідеї програми до припинення її використання. Незалежно від методології в ньому виокремлюють типові етапи."], ["table", ["Етап", "Що відбувається", "Результат"], [["Аналіз вимог", "Вивчення предметної області, опитування замовника", "Специфікація вимог"], ["Проєктування", "Вибір архітектури, моделювання даних та модулів", "Проєктна документація, діаграми"], ["Реалізація", "Написання коду, код-рев'ю", "Вихідний код, збірка"], ["Тестування", "Пошук і виправлення помилок", "Звіти про тестування"], ["Впровадження", "Встановлення, навчання користувачів", "Робоча система"], ["Супровід", "Виправлення помилок, доопрацювання", "Нові версії"]]], ["h", "Методологія розробки"], ["p", "**Методологія розробки** визначає, у якому порядку виконуються етапи, як часто їх повторюють, хто за що відповідає і які документи створюються. Основні групи: **послідовні** (каскадна, або «водоспад», V-модель), **ітеративні та інкрементні** (уніфікований процес, спіральна модель) і **гнучкі** (Agile: Scrum, Kanban, XP)."], ["note", "Методологія — не догма. Команда обирає її з урахуванням розміру проєкту, стабільності вимог і того, наскільки часто замовник готовий давати зворотний зв'язок."]]}, {"n": 141, "title": "Переваги та недоліки різних методологій розробки програмного забезпечення", "blocks": [["p", "Етапи йдуть строго один за одним: наступний починається лише після завершення попереднього. Повернення назад дороге. Підходить, коли вимоги відомі заздалегідь і майже не змінюються (наприклад, ПЗ для медичного обладнання, де потрібна повна документація)."], ["h", "Agile — гнучкий підхід"], ["p", "**Маніфест Agile** (2001 р.) проголошує чотири цінності: люди та взаємодія важливіші за процеси й інструменти; працюючий продукт важливіший за вичерпну документацію; співпраця із замовником важливіша за узгодження умов контракту; готовність до змін важливіша за дотримання плану. Робота ведеться короткими циклами, після кожного з яких є робоча частина продукту."], ["ul", ["**Scrum** — робота спринтами (не довше одного місяця, найчастіше 1–2 тижні). Ролі: **власник продукту** (Product Owner), **Scrum-майстер**, **розробники**. Події: планування спринту, щоденний Scrum (до 15 хв), огляд спринту, ретроспектива. Артефакти: беклог продукту, беклог спринту, інкремент.", "**Kanban** — безперервний потік задач на дошці з колонками («Зробити», «В роботі», «Готово»). Ключове правило — **ліміт WIP** (Work In Progress): обмеження кількості задач, які одночасно перебувають у роботі.", "**XP** (екстремальне програмування) — парне програмування, розробка через тестування, часті релізи."]], ["table", ["Методологія", "Переваги", "Недоліки"], [["Водоспад", "Чіткий план, повна документація, легко оцінити терміни", "Пізнє виявлення помилок, складно вносити зміни"], ["Scrum", "Швидкий зворотний зв'язок, регулярні робочі версії", "Потрібна дисципліна команди і залученість замовника"], ["Kanban", "Гнучкість, наочність, мало формальних правил", "Без лімітів WIP та пріоритетів легко «розпорошитися»"], ["XP", "Висока якість коду, постійне тестування", "Вимагає досвідченої команди"]]], ["note", "Головна відмінність: у водоспаді замовник бачить результат наприкінці, в Agile — після кожної ітерації. Тому помилки в розумінні вимог Agile виявляє значно раніше."]]}, {"n": 142, "title": "Уніфікований процес розробки програмного забезпечення", "blocks": [["p", "**Уніфікований процес** (Unified Process, UP; найвідоміша реалізація — RUP, Rational Unified Process) — ітеративна та інкрементна методологія, тісно пов'язана з мовою UML. Його основні принципи: розробка керується **прецедентами** (варіантами використання), процес **орієнтований на архітектуру**, робота ведеться **ітераціями**."], ["h", "Чотири фази"], ["table", ["Фаза", "Мета", "Результат фази"], [["Початок (Inception)", "Визначити мету, межі проєкту, оцінити ризики", "Бачення продукту, основні прецеденти"], ["Уточнення (Elaboration)", "Опрацювати вимоги, створити базову архітектуру", "Стабільна архітектура, план"], ["Побудова (Construction)", "Реалізувати функціональність", "Бета-версія продукту"], ["Впровадження (Transition)", "Передати продукт користувачам", "Готовий реліз, навчені користувачі"]]], ["h", "Дисципліни"], ["p", "Усередині кожної фази може бути кілька ітерацій, і в кожній виконуються **дисципліни** (види робіт) — але з різною інтенсивністю: на початку переважає аналіз, у фазі побудови — програмування і тестування."], ["ul", ["Бізнес-моделювання і робота з вимогами", "Аналіз і проєктування", "Реалізація", "Тестування", "Розгортання", "Допоміжні: керування конфігураціями та змінами, керування проєктом, середовище"]], ["note", "Уніфікований процес займає проміжне місце між водоспадом і Agile: він ітеративний, але передбачає більше документації та моделювання, ніж Scrum."]]}, {"n": 143, "title": "Програмні інструменти для проєктної роботи", "blocks": [["p", "Командна розробка неможлива без спільних інструментів: потрібно бачити, хто чим зайнятий, де лежить актуальна версія коду, які помилки знайдено і хто їх виправляє."], ["table", ["Призначення", "Приклади інструментів"], [["Трекери задач і Kanban-дошки", "Jira, Trello, YouTrack, GitHub Projects"], ["Контроль версій і хостинг коду", "Git, GitHub, GitLab, Bitbucket"], ["Середовища розробки (IDE)", "Visual Studio Code, PyCharm, IDLE"], ["Моделювання та діаграми", "draw.io (diagrams.net), PlantUML, StarUML"], ["Документація і спільні нотатки", "Confluence, Notion, Google Документи, вікі репозиторію"], ["Автоматична збірка і тестування (CI)", "GitHub Actions, GitLab CI, Jenkins"]]], ["h", "Модель Kanban-дошки в Python"], ["p", "Щоб зрозуміти правило обмеження WIP, змоделюємо дошку класом. Задачу не можна взяти в роботу, якщо колонка «В роботі» вже заповнена."], ["code", "class KanbanBoard:\n    \"\"\"Проста Kanban-дошка з обмеженням WIP для колонки «В роботі».\"\"\"\n\n    def __init__(self, wip_limit):\n        self.columns = {\"Зробити\": [], \"В роботі\": [], \"Готово\": []}\n        self.wip_limit = wip_limit\n\n    def add(self, task):\n        self.columns[\"Зробити\"].append(task)\n\n    def start(self, task):\n        if len(self.columns[\"В роботі\"]) >= self.wip_limit:\n            print(f\"Не можна взяти «{task}»: ліміт WIP = {self.wip_limit}\")\n            return\n        self.columns[\"Зробити\"].remove(task)\n        self.columns[\"В роботі\"].append(task)\n\n    def finish(self, task):\n        self.columns[\"В роботі\"].remove(task)\n        self.columns[\"Готово\"].append(task)\n\n    def show(self):\n        for name, tasks in self.columns.items():\n            print(f\"{name}: {', '.join(tasks) or '—'}\")\n\n\nboard = KanbanBoard(wip_limit=2)\nfor t in [\"Макет\", \"База даних\", \"Форма входу\"]:\n    board.add(t)\nboard.start(\"Макет\")\nboard.start(\"База даних\")\nboard.start(\"Форма входу\")\nboard.finish(\"Макет\")\nboard.start(\"Форма входу\")\nboard.show()\n# Вивід:\n# Не можна взяти «Форма входу»: ліміт WIP = 2\n# Зробити: —\n# В роботі: База даних, Форма входу\n# Готово: Макет"], ["note", "Ліміт WIP змушує команду спочатку **завершувати** розпочате, а не братися за все одночасно. Це скорочує час проходження задачі від ідеї до результату."]]}, {"n": 144, "title": "Система комунікацій у проєктній роботі", "blocks": [["p", "Більшість проблем у проєктах виникає не через код, а через непорозуміння: замовник мав на увазі одне, розробник зрозумів інше. Тому в команді заздалегідь домовляються, **хто, кому, як і коли** передає інформацію — це називають **планом комунікацій**."], ["h", "Канали комунікації"], ["p", "Якщо в команді n учасників, кількість можливих двосторонніх каналів зв'язку дорівнює **n(n − 1) / 2**. Зі зростанням команди вона росте приблизно як квадрат, тому великі команди ділять на менші групи."], ["code", "def channels(n):\n    \"\"\"Кількість каналів комунікації між n учасниками: n(n-1)/2.\"\"\"\n    return n * (n - 1) // 2\n\n\nfor people in [3, 5, 9, 15]:\n    print(f\"Учасників: {people:2} | каналів: {channels(people)}\")\n# Вивід:\n# Учасників:  3 | каналів: 3\n# Учасників:  5 | каналів: 10\n# Учасників:  9 | каналів: 36\n# Учасників: 15 | каналів: 105"], ["h", "Форми комунікації"], ["table", ["Тип", "Приклади", "Коли доречно"], [["Синхронна", "Зустрічі, щоденний Scrum, відеодзвінок", "Швидке обговорення, вирішення блокерів"], ["Асинхронна", "Месенджер, коментарі в задачах, електронна пошта", "Питання, що не потребують миттєвої відповіді"], ["Документована", "Протоколи, вікі, опис запиту на злиття", "Рішення, які треба пам'ятати і через рік"]]], ["ul", ["Фіксуйте домовленості письмово (протокол зустрічі, коментар у задачі).", "Обговорюйте задачу там, де вона ведеться (у трекері), а не в особистих повідомленнях.", "На ретроспективі обговорюють процес, а не шукають винних.", "Конструктивний відгук: що добре, що покращити, конкретна пропозиція."]], ["note", "Ознака здорової комунікації — будь-який учасник може за кілька хвилин знайти, чому було ухвалено певне рішення."]]}, {"n": 145, "title": "Системи контролю версій у процесі розробки програмного забезпечення", "blocks": [["p", "**Система контролю версій** (СКВ) зберігає історію змін файлів: хто, коли і що змінив. Вона дозволяє повернутися до попередньої версії, паралельно працювати кільком розробникам і об'єднувати їхні зміни. **Git** — розподілена СКВ: кожен розробник має повну копію репозиторію з усією історією."], ["ul", ["**Репозиторій** — сховище проєкту з історією.", "**Коміт** — зафіксований «знімок» змін з описом.", "**Індекс** (staging area) — проміжна зона, куди додають зміни перед комітом.", "**Гілка** — незалежна лінія розробки.", "**Злиття** (merge) — об'єднання змін з різних гілок; **конфлікт** виникає, коли той самий рядок змінено по-різному."]], ["h", "Базові команди Git"], ["code", "git init -b main                  # створити репозиторій із гілкою main\ngit config user.name \"Olena Koval\"\ngit config user.email \"olena@example.com\"\n\ngit status                        # що змінено?\ngit add main.py README.md         # додати файли до індексу\ngit commit -m \"Початкова версія\"  # зафіксувати зміни\ngit log --oneline                 # коротка історія комітів\ngit diff                          # що змінено, але ще не додано"], ["h", "Робота з гілками і віддаленим репозиторієм"], ["code", "git switch -c feature/login       # створити гілку і перейти в неї\n# ... редагуємо login.py ...\ngit add login.py\ngit commit -m \"Додано форму входу\"\n\ngit switch main                   # повернутися в main\ngit merge feature/login           # злити гілку функції\ngit branch -d feature/login       # видалити злиту гілку\n\ngit remote add origin https://github.com/user/project.git\ngit push -u origin main           # надіслати на сервер\ngit pull                          # отримати зміни колег"], ["p", "Типовий командний процес: для кожної функції створюють окрему гілку, після завершення відкривають **запит на злиття** (pull request / merge request), колеги переглядають код, і лише потім гілку зливають у `main`. Файл `.gitignore` перелічує файли, які не треба відстежувати (наприклад, `__pycache__/`, `.venv/`)."], ["note", "Пишіть змістовні повідомлення комітів: «Виправлено ділення на нуль у середньому балі» значно корисніше, ніж «fix»."]]}, {"n": 146, "title": "Аналіз та документація вимог проєкту", "blocks": [["p", "**Вимога** — опис того, що система повинна робити або якою вона має бути. Помилки у вимогах — найдорожчі, бо їх виправлення зачіпає всі наступні етапи."], ["table", ["Вид", "Опис", "Приклад для електронного журналу"], [["Функціональні", "Що система робить", "Учитель може виставити оцінку за урок"], ["Нефункціональні", "Якою вона має бути: швидкодія, безпека, зручність", "Сторінка оцінок відкривається менш ніж за 2 с"], ["Обмеження", "Зовнішні умови", "Дані зберігаються на серверах закладу"]]], ["h", "Як збирають і записують вимоги"], ["ul", ["Інтерв'ю та анкетування користувачів, спостереження за їхньою роботою, аналіз наявних документів.", "**Історія користувача** (user story): «Як **учень**, я хочу **бачити свої оцінки**, щоб **знати, що підтягнути**».", "**Критерії приймання**: «Дано — Коли — Тоді» (наприклад: дано учня з оцінками, коли він відкриває журнал, тоді бачить оцінки за поточний семестр).", "Документ **специфікації вимог** (SRS) — структурований опис усіх вимог для великих проєктів."]], ["p", "Якісна вимога — однозначна, перевірна, повна, несуперечлива і реалістична. «Система має працювати швидко» — погана вимога, бо її не можна перевірити."], ["h", "Пріоритезація MoSCoW"], ["p", "Must — обов'язково, Should — бажано, Could — можна, якщо буде час, Won't — цього разу не робимо. Відсортуємо беклог за пріоритетом:"], ["code", "PRIORITY = {\"Must\": 0, \"Should\": 1, \"Could\": 2, \"Won't\": 3}\n\nbacklog = [\n    (\"Експорт розкладу в PDF\", \"Could\"),\n    (\"Вхід за логіном і паролем\", \"Must\"),\n    (\"Темна тема\", \"Won't\"),\n    (\"Перегляд оцінок учнем\", \"Must\"),\n    (\"Сповіщення про нові оцінки\", \"Should\"),\n]\n\nbacklog.sort(key=lambda item: PRIORITY[item[1]])\nfor title, prio in backlog:\n    print(f\"[{prio:6}] {title}\")\n# Вивід:\n# [Must  ] Вхід за логіном і паролем\n# [Must  ] Перегляд оцінок учнем\n# [Should] Сповіщення про нові оцінки\n# [Could ] Експорт розкладу в PDF\n# [Won't ] Темна тема"]]}, {"n": 147, "title": "Візуальне моделювання архітектури програмного забезпечення", "blocks": [["p", "**Архітектура ПЗ** — високорівнева структура системи: з яких компонентів вона складається, які в них обов'язки і як вони взаємодіють. Візуальна модель (діаграма) дозволяє обговорити архітектуру з командою і замовником до того, як написано код, і швидко ввести в проєкт нового учасника."], ["h", "Типові архітектурні стилі"], ["ul", ["**Багатошарова** — представлення (інтерфейс), бізнес-логіка, доступ до даних; кожен шар звертається лише до нижчого.", "**Клієнт-сервер** — клієнт надсилає запити, сервер обробляє їх і повертає відповідь.", "**MVC** (Model–View–Controller) — розділення даних, їх відображення і обробки дій користувача.", "**Мікросервісна** — система з багатьох невеликих незалежних сервісів, що спілкуються через мережу."]], ["h", "Шарова архітектура в коді"], ["code", "# Шар даних: лише зберігання і доступ до даних\nclass GradeRepository:\n    def __init__(self):\n        self._grades = {\"Олена\": [10, 11, 9], \"Тарас\": [7, 8]}\n\n    def get(self, student):\n        return self._grades.get(student, [])\n\n\n# Шар бізнес-логіки: правила предметної області\nclass GradeService:\n    def __init__(self, repo):\n        self.repo = repo\n\n    def average(self, student):\n        grades = self.repo.get(student)\n        return round(sum(grades) / len(grades), 1) if grades else None\n\n\n# Шар представлення: лише показ результату користувачеві\ndef show_report(service, student):\n    avg = service.average(student)\n    text = \"немає оцінок\" if avg is None else f\"середній бал {avg}\"\n    print(f\"{student}: {text}\")\n\n\nservice = GradeService(GradeRepository())\nfor name in [\"Олена\", \"Тарас\", \"Ігор\"]:\n    show_report(service, name)\n# Вивід:\n# Олена: середній бал 10.0\n# Тарас: середній бал 7.5\n# Ігор: немає оцінок"], ["p", "Якщо завтра оцінки зберігатимуться в базі даних, а не в словнику, зміниться лише клас `GradeRepository`; логіка і показ залишаться без змін. Це і є перевага розділення на шари."], ["h", "Засоби візуального моделювання"], ["p", "Для архітектури використовують діаграми **компонентів**, **розгортання** і **пакетів** мови UML, а також простіші блок-схеми. Детально UML розглядається в наступному підрозділі."], ["note", "Добра архітектура має **слабку зв'язаність** (модулі мало залежать один від одного) і **високу зчепленість** (кожен модуль відповідає за одну чітку задачу)."]]}], "practice": [{"task": "Обґрунтуйте вибір методології для двох проєктів: а) програма керування рентгенівським апаратом із сертифікацією; б) мобільний застосунок шкільної їдальні, замовник щотижня пропонує нові ідеї.", "answer": "а) Каскадна модель (або V-модель): вимоги стабільні й відомі заздалегідь, потрібні повна документація та формальна перевірка кожного етапу. б) Agile (Scrum або Kanban): вимоги часто змінюються, замовник доступний для зворотного зв'язку, тож короткі ітерації з робочою версією після кожної дозволять швидко враховувати нові ідеї.", "code": false}, {"task": "Запишіть послідовність команд Git: створити гілку `feature/schedule`, зафіксувати в ній файл `schedule.py` з повідомленням «Додано модуль розкладу», повернутися в `main`, злити гілку і переглянути коротку історію.", "answer": "git switch -c feature/schedule\ngit add schedule.py\ngit commit -m \"Додано модуль розкладу\"\ngit switch main\ngit merge feature/schedule\ngit log --oneline", "code": true}, {"task": "Для шкільної бібліотеки сформулюйте дві історії користувача (учень і бібліотекар) з критеріями приймання та одну нефункціональну вимогу.", "answer": "1) Як учень, я хочу шукати книжку за назвою, щоб дізнатися, чи вона є в наявності. Критерій: дано каталог із книжкою «Кобзар»; коли учень вводить «Кобзар», тоді бачить її статус (є / видана). 2) Як бібліотекар, я хочу бачити список прострочених видач, щоб нагадати читачам. Критерій: дано видачу з терміном повернення вчора; коли бібліотекар відкриває звіт, тоді ця видача є у списку. Нефункціональна вимога: результати пошуку з'являються не пізніше ніж за 1 секунду для каталогу до 20 000 книжок.", "code": false}, {"task": "Напишіть програму, яка обчислює кількість каналів комунікації для команди з 6 осіб, після додавання ще 2 осіб і приріст каналів.", "answer": "def channels(n):\n    return n * (n - 1) // 2\n\n\nteam = 6\nprint(\"Канали в команді з 6 осіб:\", channels(team))\nprint(\"Після додавання 2 осіб:\", channels(team + 2))\nprint(\"Приріст:\", channels(team + 2) - channels(team))\n# Вивід:\n# Канали в команді з 6 осіб: 15\n# Після додавання 2 осіб: 28\n# Приріст: 13\n", "code": true}], "quiz": [{"q": "Що з переліченого є основним принципом системного аналізу?", "o": ["Написання коду до збору вимог", "Декомпозиція системи на взаємопов'язані підсистеми", "Розгляд кожної частини окремо без урахування зв'язків", "Відмова від моделювання"], "a": 1, "why": "Системний аналіз розглядає об'єкт як систему і ділить її на підсистеми, зберігаючи зв'язки між ними."}, {"q": "Яка методологія передбачає строго послідовне виконання етапів?", "o": ["Scrum", "Kanban", "Екстремальне програмування", "Каскадна (водоспад)"], "a": 3, "why": "У водоспаді наступний етап починається лише після завершення попереднього."}, {"q": "Хто в Scrum відповідає за пріоритети беклогу продукту?", "o": ["Власник продукту", "Scrum-майстер", "Тестувальник", "Системний адміністратор"], "a": 0, "why": "Product Owner керує беклогом і визначає, що найцінніше для замовника."}, {"q": "Що обмежує ліміт WIP у Kanban?", "o": ["Тривалість спринту", "Кількість учасників команди", "Кількість задач, які одночасно перебувають у роботі", "Кількість комітів на день"], "a": 2, "why": "WIP — Work In Progress, тобто незавершена робота."}, {"q": "Яка фаза уніфікованого процесу має створити стабільну базову архітектуру?", "o": ["Початок (Inception)", "Побудова (Construction)", "Уточнення (Elaboration)", "Впровадження (Transition)"], "a": 2, "why": "Саме у фазі уточнення опрацьовують вимоги й архітектуру."}, {"q": "Скільки двосторонніх каналів комунікації в команді з 5 осіб?", "o": ["10", "5", "20", "25"], "a": 0, "why": "5 · 4 / 2 = 10."}, {"q": "Яка команда Git фіксує зміни з індексу в історії репозиторію?", "o": ["`git add`", "`git status`", "`git push`", "`git commit`"], "a": 3, "why": "`git add` лише додає зміни до індексу, `git commit` створює коміт."}, {"q": "Яка з вимог є нефункціональною?", "o": ["Учитель може виставити оцінку", "Сторінка завантажується менш ніж за 2 секунди", "Учень бачить розклад", "Адміністратор додає новий клас"], "a": 1, "why": "Нефункціональні вимоги описують якості системи (швидкодію, безпеку), а не її функції."}, {"q": "Що означає категорія «Won't» у методі MoSCoW?", "o": ["Цього разу вимогу не реалізують", "Вимога обов'язкова", "Вимогу реалізують, якщо буде час", "Вимога суперечить іншим"], "a": 0, "why": "Won't — свідомо відкладене на майбутнє."}, {"q": "Яка перевага шарової архітектури?", "o": ["Увесь код міститься в одному файлі", "Шари можуть звертатися один до одного довільно", "Не потрібне тестування", "Зміна способу зберігання даних не зачіпає шар представлення"], "a": 3, "why": "Шари слабко зв'язані, тож зміни локалізуються в одному з них."}]}, {"id": "t42", "topic": 4, "code": "4.2", "title": "Мова UML і моделювання", "lessons": [{"n": 148, "title": "Діаграми UML. Діаграми прецедентів", "blocks": [["p", "**UML** (Unified Modeling Language) — уніфікована графічна мова моделювання програмних систем; стандарт підтримує консорціум OMG. UML не є мовою програмування: це набір умовних позначень, зрозумілих аналітикам, розробникам і замовникам. У версії UML 2 виокремлюють **14 типів діаграм** двох груп."], ["table", ["Група", "Що описує", "Приклади діаграм"], [["Структурні", "Статичну будову системи", "Класів, об'єктів, компонентів, розгортання, пакетів"], ["Поведінкові", "Динаміку: дії, взаємодію, стани", "Прецедентів, діяльностей, послідовностей, станів"]]], ["h", "Діаграма прецедентів"], ["p", "**Діаграма прецедентів** (варіантів використання, use case) показує, **хто** користується системою і **що** він може з її допомогою робити. Вона не описує, як саме це реалізовано."], ["ul", ["**Актор** — роль зовнішнього користувача або іншої системи (позначається чоловічком): Учень, Учитель, Платіжна система.", "**Прецедент** — дія, що дає актору корисний результат (овал): «Переглянути оцінки».", "**Межа системи** — прямокутник, усередині якого розміщують прецеденти.", "**Асоціація** — лінія між актором і прецедентом.", "**«include»** — прецедент обов'язково містить інший (оформлення замовлення завжди включає оплату).", "**«extend»** — необов'язкове розширення за певної умови (друк квитанції — за бажанням).", "**Узагальнення** — актор або прецедент успадковує інший (Класний керівник — різновид Учителя)."]], ["p", "Кожен прецедент доповнюють **текстовим сценарієм**: передумови, основний потік кроків, альтернативні потоки, результат."], ["note", "Назву прецедента формулюють дієсловом з погляду актора: «Записатися на гурток», а не «Модуль запису» чи «База гуртків»."]]}, {"n": 149, "title": "Моделювання даних і архітектури програмного забезпечення", "blocks": [["p", "**Модель даних** описує, які сутності зберігає система, їхні атрибути та зв'язки між ними. Розрізняють **концептуальну** модель (сутності предметної області), **логічну** (таблиці, ключі, типи) і **фізичну** (реалізація в конкретній СКБД)."], ["ul", ["**Сутність** — об'єкт, дані про який зберігаються: Учень, Клас, Предмет.", "**Атрибут** — властивість сутності: ім'я, дата народження.", "**Ключ** — атрибут, що однозначно ідентифікує запис.", "**Кратність зв'язку** — 1 : 1, 1 : N, M : N. Зв'язок M : N (учні ↔ гуртки) реалізують через проміжну таблицю."]], ["p", "Для даних використовують **ER-діаграми** (сутність — зв'язок) або діаграми класів UML, де кратність позначають біля кінців лінії: `1`, `0..1`, `*`, `1..*`."], ["h", "Модель даних у коді"], ["code", "from dataclasses import dataclass, field\n\n\n@dataclass\nclass Student:\n    id: int\n    name: str\n\n\n@dataclass\nclass SchoolClass:\n    title: str\n    students: list = field(default_factory=list)  # зв'язок 1 : N\n\n    def enroll(self, student):\n        self.students.append(student)\n\n\ncls = SchoolClass(\"11-А\")\ncls.enroll(Student(1, \"Олена\"))\ncls.enroll(Student(2, \"Тарас\"))\nprint(cls.title, \"->\", [s.name for s in cls.students])\nprint(len(cls.students), \"учні у класі\")\n# Вивід:\n# 11-А -> ['Олена', 'Тарас']\n# 2 учні у класі"], ["h", "Моделювання архітектури засобами UML"], ["table", ["Діаграма", "Що показує"], [["Компонентів", "Модулі системи та інтерфейси, через які вони взаємодіють"], ["Розгортання", "Фізичні вузли (сервер, клієнтський пристрій) і розміщені на них програмні артефакти"], ["Пакетів", "Групування елементів моделі та залежності між групами"]]], ["note", "Спочатку моделюйте предметну область (що зберігаємо), а вже потім обирайте технологію (як зберігаємо)."]]}, {"n": 150, "title": "Моделювання процесів", "blocks": [["p", "**Процес** — послідовність дій, яка перетворює вхідні дані на результат: прийом заяви до ліцею, видача довідки, оформлення замовлення. Моделювання процесів допомагає зрозуміти, як працює організація, знайти зайві кроки і визначити, що саме треба автоматизувати."], ["h", "Нотації моделювання процесів"], ["table", ["Нотація", "Особливості"], [["Блок-схема", "Найпростіша: дії, умови, стрілки"], ["Діаграма діяльностей UML", "Дії, розгалуження, паралельність, доріжки відповідальності"], ["BPMN", "Стандарт моделювання бізнес-процесів: події, задачі, шлюзи, пули й доріжки"], ["DFD", "Діаграма потоків даних: процеси, сховища даних, зовнішні сутності"], ["Діаграма станів UML", "Стани об'єкта і переходи між ними"]]], ["h", "Процес як скінченний автомат"], ["p", "Документ у процесі проходить через стани. Модель станів задає, які переходи дозволені, — і програма може це перевіряти:"], ["code", "# Модель процесу «Заявка на довідку» як скінченний автомат\nTRANSITIONS = {\n    \"Подана\": [\"На розгляді\"],\n    \"На розгляді\": [\"Схвалена\", \"Відхилена\"],\n    \"Схвалена\": [\"Видана\"],\n    \"Відхилена\": [],\n    \"Видана\": [],\n}\n\n\ndef move(state, new_state):\n    if new_state not in TRANSITIONS[state]:\n        print(f\"Помилка: перехід {state} -> {new_state} заборонений\")\n        return state\n    print(f\"{state} -> {new_state}\")\n    return new_state\n\n\ns = \"Подана\"\ns = move(s, \"Видана\")\ns = move(s, \"На розгляді\")\ns = move(s, \"Схвалена\")\ns = move(s, \"Видана\")\n# Вивід:\n# Помилка: перехід Подана -> Видана заборонений\n# Подана -> На розгляді\n# На розгляді -> Схвалена\n# Схвалена -> Видана"], ["h", "Як будувати модель процесу"], ["ol", ["Визначити початкову і кінцеву події процесу.", "Перелічити учасників (ролі) — вони стануть доріжками.", "Записати кроки дієсловами в порядку виконання.", "Додати розгалуження (умови) і можливі помилки.", "Перевірити модель із людьми, які реально виконують процес."]], ["note", "Цей урок завершує тематичну атестацію з моделювання: повторіть види вимог, діаграми прецедентів і моделі даних."]]}, {"n": 151, "title": "Діаграми послідовностей та діяльностей", "blocks": [["p", "Обидві діаграми описують динаміку системи, але з різних боків. **Діаграма діяльностей** відповідає на питання «які дії і в якому порядку виконуються?», а **діаграма послідовностей** — «які об'єкти якими повідомленнями обмінюються і в якому порядку в часі?»."], ["table", ["Ознака", "Діаграма діяльностей", "Діаграма послідовностей"], [["Фокус", "Потік керування, алгоритм", "Взаємодія об'єктів у часі"], ["Основні елементи", "Дії, розгалуження, злиття, розгалужувач паралельності", "Лінії життя, повідомлення, активації"], ["Час", "Неявно, через стрілки", "Явно: згори донизу"], ["Типове застосування", "Бізнес-процеси, логіка методу", "Сценарій прецедента, виклики між класами"]]], ["h", "Позначення діаграми діяльностей"], ["ul", ["Початковий вузол — зафарбоване коло; кінцевий — коло в колі.", "Дія — прямокутник із заокругленими кутами.", "Розгалуження і злиття — ромб, на вихідних стрілках умови в квадратних дужках: `[пароль правильний]`.", "Розгалужувач і з'єднувач паралельних потоків — товста риска.", "Доріжки (swimlanes) — смуги, що показують, хто виконує дію."]], ["h", "Позначення діаграми послідовностей"], ["ul", ["Лінія життя — прямокутник з ім'ям об'єкта і вертикальна пунктирна лінія.", "Синхронне повідомлення — суцільна стрілка із зафарбованим вістрям; відповідь — пунктирна стрілка.", "Активація — вузький прямокутник на лінії життя, поки об'єкт виконує дію.", "Комбіновані фрагменти: `alt` (альтернатива), `opt` (необов'язково), `loop` (цикл)."]], ["note", "Одна діаграма — один сценарій. Не намагайтеся вмістити в діаграму послідовностей усі можливі варіанти — для складних альтернатив зробіть кілька діаграм."]]}, {"n": 152, "title": "Діаграми діяльностей для проєктування програмної логіки", "blocks": [["p", "Діаграма діяльностей зручна для проєктування логіки окремого методу чи функції: кожна дія стає оператором, ромб — умовою `if`, повернення стрілки назад — циклом. Розглянемо діаграму «Вхід у систему»: користувач вводить пароль; якщо він правильний — вхід виконано; інакше лічильник спроб збільшується, і після третьої невдалої спроби обліковий запис блокується."], ["h", "Текстовий опис діаграми"], ["ol", ["Початок.", "Дія «Ввести пароль».", "Розгалуження: `[пароль правильний]` → «Відкрити кабінет» → кінець.", "`[пароль неправильний]` → «Показати повідомлення про помилку».", "Розгалуження: `[спроб < 3]` → повернення до кроку 2; `[спроб = 3]` → «Заблокувати обліковий запис» → кінець."]], ["h", "Реалізація в Python"], ["code", "# Реалізація діаграми діяльностей «Вхід у систему (3 спроби)»\nCORRECT_PASSWORD = \"yasno2026\"\n\n\ndef login(attempts):\n    for i, password in enumerate(attempts[:3], start=1):  # цикл: не більше 3 спроб\n        if password == CORRECT_PASSWORD:                   # розгалуження (ромб)\n            return f\"Вхід виконано зі спроби {i}\"\n        print(f\"Спроба {i}: неправильний пароль\")\n    return \"Обліковий запис заблоковано\"\n\n\nprint(login([\"123\", \"yasno2026\"]))\nprint(login([\"a\", \"b\", \"c\", \"yasno2026\"]))\n# Вивід:\n# Спроба 1: неправильний пароль\n# Вхід виконано зі спроби 2\n# Спроба 1: неправильний пароль\n# Спроба 2: неправильний пароль\n# Спроба 3: неправильний пароль\n# Обліковий запис заблоковано"], ["h", "Паралельні дії"], ["p", "Якщо після оформлення замовлення система одночасно надсилає лист покупцю і передає замовлення на склад, на діаграмі ставлять **розгалужувач** (fork), а далі — **з'єднувач** (join): наступна дія почнеться лише тоді, коли обидві паралельні гілки завершено."], ["note", "Перевірте діаграму: з кожного ромба має виходити щонайменше дві стрілки з умовами, а умови мають охоплювати всі можливі випадки і не перетинатися."]]}, {"n": 153, "title": "Діаграми послідовностей для проєктування об'єктної взаємодії", "blocks": [["p", "Діаграму послідовностей будують за сценарієм прецедента. Кожне повідомлення між об'єктами на діаграмі стає **викликом методу** в коді, тож діаграма підказує, які методи потрібні класам."], ["h", "Сценарій «Оформлення замовлення»"], ["ol", ["Покупець → Сервіс замовлень: `place_order(товар, кількість)`.", "Сервіс замовлень → Склад: `reserve(товар, кількість)`.", "Фрагмент `alt`: якщо товару недостатньо — Сервіс повертає «Немає на складі».", "Інакше Сервіс замовлень → Оплата: `pay(сума)`.", "Сервіс повертає покупцю «Замовлення прийнято»."]], ["p", "На діаграмі буде три лінії життя (`OrderService`, `Warehouse`, `Payment`) і актор Покупець. Нижче — код, де кожен виклик друкує повідомлення; відступ показує вкладеність активацій."], ["code", "# Об'єкти з діаграми послідовностей «Оформлення замовлення»\nclass Warehouse:\n    def __init__(self):\n        self.stock = {\"зошит\": 5}\n\n    def reserve(self, item, qty):\n        print(f\"  Склад: reserve({item}, {qty})\")\n        if self.stock.get(item, 0) >= qty:\n            self.stock[item] -= qty\n            return True\n        return False\n\n\nclass Payment:\n    def pay(self, amount):\n        print(f\"  Оплата: pay({amount})\")\n        return True\n\n\nclass OrderService:\n    def __init__(self, warehouse, payment):\n        self.warehouse = warehouse\n        self.payment = payment\n\n    def place_order(self, item, qty, price):\n        print(f\"Сервіс: place_order({item}, {qty})\")\n        if not self.warehouse.reserve(item, qty):  # фрагмент alt\n            return \"Немає на складі\"\n        self.payment.pay(qty * price)\n        return \"Замовлення прийнято\"\n\n\nservice = OrderService(Warehouse(), Payment())\nprint(service.place_order(\"зошит\", 3, 20))\nprint(service.place_order(\"зошит\", 3, 20))\n# Вивід:\n# Сервіс: place_order(зошит, 3)\n#   Склад: reserve(зошит, 3)\n#   Оплата: pay(60)\n# Замовлення прийнято\n# Сервіс: place_order(зошит, 3)\n#   Склад: reserve(зошит, 3)\n# Немає на складі"], ["h", "Що дає така діаграма"], ["ul", ["Визначає відповідальність класів: склад відповідає за залишки, оплата — за гроші, сервіс — за координацію.", "Показує залежності: `OrderService` знає про `Warehouse` і `Payment`, а не навпаки.", "Допомагає знайти зайві виклики і «перевантажені» об'єкти, які роблять забагато."]], ["note", "Якщо на діаграмі один об'єкт надсилає майже всі повідомлення, а решта лише відповідають, — це сигнал, що відповідальність розподілено погано."]]}, {"n": 154, "title": "Діаграми класів", "blocks": [["p", "**Діаграма класів** — основна структурна діаграма UML. Вона показує класи системи, їхні атрибути, операції (методи) і зв'язки між класами. Саме за нею найчастіше пишуть код в об'єктно-орієнтованих мовах."], ["h", "Позначення класу"], ["p", "Клас зображують прямокутником із трьох секцій: ім'я, атрибути, операції. Перед членом класу вказують видимість: `+` публічний, `-` приватний, `#` захищений. Наприклад, атрибут `- name: str` і операція `+ info(): str`."], ["table", ["Зв'язок", "Позначення", "Значення"], [["Асоціація", "Суцільна лінія", "Об'єкти пов'язані (учень відвідує гурток)"], ["Агрегація", "Лінія з порожнім ромбом біля цілого", "«Ціле — частина», частина може існувати окремо"], ["Композиція", "Лінія із зафарбованим ромбом", "Частина не існує без цілого"], ["Узагальнення", "Лінія з порожнім трикутником до батьківського класу", "Успадкування"], ["Залежність", "Пунктирна стрілка", "Один клас тимчасово використовує інший"]]], ["h", "Від діаграми до коду"], ["code", "class Person:                       # базовий клас\n    def __init__(self, name):\n        self.name = name\n\n    def info(self):\n        return f\"Особа: {self.name}\"\n\n\nclass Teacher(Person):              # успадкування (узагальнення)\n    def __init__(self, name, subject):\n        super().__init__(name)\n        self.subject = subject\n\n    def info(self):                 # перевизначення методу\n        return f\"Вчитель {self.subject}: {self.name}\"\n\n\nclass Lesson:\n    def __init__(self, topic):\n        self.topic = topic\n\n\nclass Course:\n    def __init__(self, title, teacher):\n        self.title = title\n        self.teacher = teacher      # агрегація: вчитель існує і без курсу\n        self.lessons = []           # композиція: уроки належать курсу\n\n    def add_lesson(self, topic):\n        self.lessons.append(Lesson(topic))\n\n\nt = Teacher(\"Ірина Петрівна\", \"інформатики\")\nc = Course(\"Інформатика 11\", t)\nc.add_lesson(\"UML\")\nc.add_lesson(\"Тестування\")\nprint(t.info())\nprint(c.title, \"-\", len(c.lessons), \"уроки\")\n# Вивід:\n# Вчитель інформатики: Ірина Петрівна\n# Інформатика 11 - 2 уроки"], ["p", "Тут `Teacher` успадковує `Person` (узагальнення), `Course` агрегує вчителя (вчитель існує і без курсу) і містить уроки як композицію (уроки створюються всередині курсу і не мають сенсу без нього)."], ["note", "Біля кінців асоціації вказують кратність: курс має `1` вчителя і `0..*` уроків."]]}], "practice": [{"task": "Складіть текстовий опис діаграми прецедентів для шкільної бібліотеки: актори, прецеденти, щонайменше один зв'язок «include» і один «extend».", "answer": "Актори: Учень, Бібліотекар. Прецеденти Учня: «Знайти книжку», «Забронювати книжку». Прецеденти Бібліотекаря: «Видати книжку», «Прийняти книжку», «Додати книжку до каталогу». «Видати книжку» «include» «Перевірити читацький квиток» (перевірка виконується завжди). «Прийняти книжку» «extend» «Нарахувати штраф» (лише якщо термін повернення прострочено). Усі прецеденти розташовані всередині межі системи «Бібліотека», актори — ззовні.", "code": false}, {"task": "За діаграмою класів реалізуйте в Python класи `Book` (назва, автор, доступність), `Reader` (ім'я, список книжок, метод `borrow`) і `Library` (композиція книжок, метод `available_titles`). Продемонструйте, що видану книжку не можна взяти вдруге.", "answer": "class Book:\n    def __init__(self, title, author):\n        self.title = title\n        self.author = author\n        self.available = True\n\n\nclass Reader:\n    def __init__(self, name):\n        self.name = name\n        self.books = []\n\n    def borrow(self, book):\n        if not book.available:\n            return f\"«{book.title}» вже видано\"\n        book.available = False\n        self.books.append(book)\n        return f\"{self.name} взяв(ла) «{book.title}»\"\n\n\nclass Library:\n    def __init__(self):\n        self.books = []          # композиція: каталог бібліотеки\n\n    def add(self, book):\n        self.books.append(book)\n\n    def available_titles(self):\n        return [b.title for b in self.books if b.available]\n\n\nlib = Library()\nlib.add(Book(\"Кобзар\", \"Т. Шевченко\"))\nlib.add(Book(\"Тигролови\", \"І. Багряний\"))\nolena, taras = Reader(\"Олена\"), Reader(\"Тарас\")\nprint(olena.borrow(lib.books[0]))\nprint(taras.borrow(lib.books[0]))\nprint(lib.available_titles())\n# Вивід:\n# Олена взяв(ла) «Кобзар»\n# «Кобзар» вже видано\n# ['Тигролови']\n", "code": true}, {"task": "Опишіть кроки діаграми діяльностей «Зняття готівки в банкоматі» з розгалуженнями та доріжками «Клієнт» і «Банкомат».", "answer": "Початок → Клієнт: вставити картку → Банкомат: запросити PIN → Клієнт: ввести PIN → ромб: [PIN неправильний і спроб < 3] — повернення до введення PIN; [3 невдалі спроби] — Банкомат: затримати картку → кінець; [PIN правильний] → Клієнт: ввести суму → ромб: [коштів недостатньо] — Банкомат: показати помилку → повернення до введення суми; [коштів достатньо] → Банкомат: видати готівку і повернути картку (паралельно можна друкувати чек — розгалужувач і з'єднувач) → кінець.", "code": false}, {"task": "Запишіть послідовність повідомлень для діаграми послідовностей «Учень переглядає оцінки» з об'єктами Інтерфейс, Сервіс оцінок, Сховище даних.", "answer": "1) Учень → Інтерфейс: відкрити сторінку оцінок. 2) Інтерфейс → Сервіс оцінок: get_grades(id_учня). 3) Сервіс оцінок → Сховище даних: find_grades(id_учня). 4) Сховище даних --> Сервіс оцінок: список оцінок (відповідь, пунктирна стрілка). 5) Сервіс оцінок обчислює середній бал (повідомлення самому собі). 6) Сервіс оцінок --> Інтерфейс: оцінки і середній бал. 7) Інтерфейс --> Учень: показати таблицю. Фрагмент alt: якщо оцінок немає, Інтерфейс показує «Оцінок ще немає».", "code": false}], "quiz": [{"q": "Яке твердження про UML правильне?", "o": ["Це мова програмування для вебсерверів", "Це система контролю версій", "Це графічна мова моделювання програмних систем", "Це СКБД"], "a": 2, "why": "UML описує систему діаграмами, але не виконується як програма."}, {"q": "Що на діаграмі прецедентів позначає актор?", "o": ["Роль зовнішнього користувача або системи", "Клас бази даних", "Крок алгоритму", "Фізичний сервер"], "a": 0, "why": "Актор — це роль, а не конкретна людина."}, {"q": "Який зв'язок використовують, якщо прецедент обов'язково містить інший?", "o": ["«extend»", "Узагальнення", "Композиція", "«include»"], "a": 3, "why": "«extend» — необов'язкове розширення за умовою."}, {"q": "Як реалізують зв'язок M : N між учнями й гуртками в реляційній моделі?", "o": ["Додають поле-список у таблицю учнів", "Через проміжну таблицю", "Об'єднують таблиці в одну", "Такий зв'язок неможливий"], "a": 1, "why": "Проміжна таблиця містить пари ключів учень–гурток."}, {"q": "Яка діаграма показує фізичні вузли й розміщені на них програмні артефакти?", "o": ["Розгортання", "Прецедентів", "Послідовностей", "Діяльностей"], "a": 0, "why": "Діаграма розгортання описує апаратну конфігурацію."}, {"q": "Що на діаграмі діяльностей позначає ромб?", "o": ["Початок діяльності", "Паралельний розгалужувач", "Розгалуження або злиття потоків", "Лінію життя об'єкта"], "a": 2, "why": "Паралельність позначається товстою рискою, а не ромбом."}, {"q": "Що є головним на діаграмі послідовностей?", "o": ["Атрибути та методи класів", "Обмін повідомленнями між об'єктами в часі", "Ролі акторів і межа системи", "Стани одного об'єкта"], "a": 1, "why": "Час на діаграмі послідовностей іде згори донизу."}, {"q": "Який комбінований фрагмент описує цикл на діаграмі послідовностей?", "o": ["`alt`", "`opt`", "`ref`", "`loop`"], "a": 3, "why": "`alt` — альтернатива, `opt` — необов'язкова частина."}, {"q": "Як на діаграмі класів позначається композиція?", "o": ["Лінія з порожнім трикутником", "Пунктирна стрілка", "Лінія з порожнім ромбом", "Лінія із зафарбованим ромбом біля цілого"], "a": 3, "why": "Порожній ромб — агрегація, трикутник — узагальнення
