<style>
/* Layout: sticky header, left table of contents (КТП structure), one subsection open at a time; code is the hero material */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E7EAF0; --ink:#1A1F2A; --muted:#596173; --line:#D8DDE6;
  --acc:#2B57B8; --acc-soft:#E3EAFA; --gold:#C98A0B; --gold-soft:#FBF1D9;
  --code-bg:#1E2433; --code-ink:#E6E9F0; --code-com:#8A93A8; --code-str:#F2C46B; --code-kw:#8FB4FF; --code-num:#7FD8B5;
  --ok:#24784A; --ok-soft:#E1F3E8; --bad:#B8362B; --bad-soft:#FBE6E3;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 4px 16px rgba(20,25,40,.05);
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151B; --surface:#1B1F27; --sunk:#252A34; --ink:#E8EBF0; --muted:#A2AAB8; --line:#2E3440;
  --acc:#8CAEFF; --acc-soft:#1F2A45; --gold:#F0BE55; --gold-soft:#3A2F17;
  --code-bg:#0D1017; --ok:#62CF91; --ok-soft:#183324; --bad:#F2806F; --bad-soft:#3A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1B1F27; --sunk:#252A34; --ink:#E8EBF0; --muted:#A2AAB8; --line:#2E3440;
  --acc:#8CAEFF; --acc-soft:#1F2A45; --gold:#F0BE55; --gold-soft:#3A2F17;
  --code-bg:#0D1017; --ok:#62CF91; --ok-soft:#183324; --bad:#F2806F; --bad-soft:#3A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance;line-height:1.25}
code{font-family:var(--mono);font-size:.88em;background:var(--acc-soft);color:var(--acc);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.logo{font-family:var(--mono);font-weight:600;font-size:15px;background:var(--code-bg);color:var(--code-str);padding:5px 9px;border-radius:8px;flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:block}
.brand small{color:var(--muted);font-size:13px;display:block;line-height:1.3}

.shell{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:32px;align-items:start}
nav.toc{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.toc-toggle{display:none}
.toc h4{margin:18px 0 6px;font:600 11px/1.3 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.toc a,.toc .soon{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
.toc a:hover{background:var(--sunk)}
.toc a[aria-current="page"]{background:var(--acc-soft);color:var(--acc);font-weight:600}
.toc .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:26px}
.toc .t{flex:1}
.toc .st{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.toc .st.done{background:var(--ok-soft);color:var(--ok)}
.toc .soon{color:var(--muted)}
.toc .soon .st{background:transparent;border:1px dashed var(--line)}

main{min-width:0}
.view{max-width:800px}
.eyebrow{font:600 12px/1.3 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--acc);margin:0 0 10px}
.view>h1{font-family:var(--display);font-weight:700;font-size:clamp(25px,4vw,34px);letter-spacing:-.02em;margin:0 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.safety{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--gold-soft);font-size:14.5px;margin:0 0 22px}
.safety b{color:var(--gold)}
.lessons-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.lessons-nav button{font:600 13.5px/1.2 var(--body);padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lessons-nav button:hover{border-color:var(--acc);color:var(--acc)}

.lesson{margin-top:40px;scroll-margin-top:84px}
.lesson-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
.lesson-head .num{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.lesson-head h2{margin:0;font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:-.01em}
.prose h3{font-size:17px;margin:24px 0 8px}
.prose p{margin:0 0 14px;max-width:68ch}
.prose ul,.prose ol{margin:0 0 16px;padding-left:22px;max-width:68ch}
.prose li{margin:6px 0}
.prose li::marker{color:var(--acc)}
.note{background:var(--acc-soft);border-radius:12px;padding:12px 16px;margin:16px 0;font-size:15px}
.note code{background:var(--surface)}
pre.code{position:relative;background:var(--code-bg);color:var(--code-ink);font:14px/1.6 var(--mono);padding:40px 18px 16px;border-radius:12px;overflow-x:auto;margin:14px 0 18px;tab-size:4}
pre.code .com{color:var(--code-com)} pre.code .str{color:var(--code-str)} pre.code .kw{color:var(--code-kw)} pre.code .num{color:var(--code-num)} pre.code .pr{color:var(--code-com)}
.copy{position:absolute;top:8px;right:8px;font:600 12px var(--body);padding:4px 9px;border-radius:7px;border:1px solid #3A4256;background:#2A3144;color:#C8CEDB;cursor:pointer}
.copy:hover{color:#fff}
.tbl{overflow-x:auto;margin:12px 0 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px}
.tbl th{text-align:left;background:var(--sunk);font-weight:600;padding:9px 12px;white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl code{white-space:nowrap}

/* practice */
.block{margin-top:44px}
.block>h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0 0 12px}
.tasks{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:t}
.tasks li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 52px;position:relative;margin:0}
.tasks li::before{counter-increment:t;content:counter(t);position:absolute;left:16px;top:14px;width:24px;height:24px;border-radius:7px;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:13px;display:grid;place-items:center}
.tasks details{margin-top:8px}
.tasks summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;width:max-content}
.tasks details pre.code{margin-bottom:4px}
.tasks .ans{margin-top:8px}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px clamp(16px,3vw,28px) 26px;box-shadow:var(--shadow)}
.quiz-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:6px}
.quiz-head h2{margin:0;font-family:var(--display);font-weight:500;font-size:20px;margin-right:auto}
.score{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:4px 0 18px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q p{margin:0 0 10px;font-weight:600}
.q p .qn{color:var(--acc);margin-right:6px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:10px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .l{font-weight:700;color:var(--muted);min-width:18px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .l{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .l{color:var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:8px;font-size:14px;font-weight:600}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.result{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acc-soft);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.result b{font-family:var(--display);font-size:22px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.result span{flex:1;min-width:180px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1.2 var(--body);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--surface)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:48%;min-width:0}
.pager a:hover{border-color:var(--acc)}
.pager a small{color:var(--muted);font-size:12.5px}
.pager a b{font-size:14.5px}
.pager a.next{margin-left:auto;text-align:right}

/* home */
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,42px);letter-spacing:-.025em;margin:0 0 12px}
.hero p{color:var(--muted);max-width:62ch;margin:0 0 18px;font-size:17px}
.hero pre.code{max-width:520px;margin:0 0 22px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 0;margin-top:28px}
.plan h2{font-family:var(--display);font-weight:500;font-size:18px;margin:14px 20px 6px}
.plan a,.plan div.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 20px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.plan a:hover{background:var(--acc-soft)}
.plan .n{font-family:var(--mono);font-weight:600;color:var(--acc)}
.plan .row{color:var(--muted)} .plan .row .n{color:var(--muted)}
.plan .k{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.plan .k.done{color:var(--ok)}
.plan .lsn{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.reset{margin-top:22px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--acc);font:inherit;text-decoration:underline;cursor:pointer}

@media (max-width:860px){
  .top .btn .lbl{display:none}
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 56px}
  nav.toc{position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 10px 10px}
  .toc-toggle{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;padding:10px 4px;font:600 15px var(--body);color:var(--ink);cursor:pointer;text-align:left;gap:8px}
  .toc-toggle svg{width:18px;height:18px;transition:transform .2s;flex:none}
  nav.toc.open .toc-toggle svg{transform:rotate(180deg)}
  nav.toc:not(.open) .toc-list{display:none}
  .brand small{display:none}
  .pager a{max-width:100%;flex:1 1 220px}
  .plan a,.plan div.row{grid-template-columns:36px minmax(0,1fr);padding-inline:14px}
  .plan .k{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DATA = {"SECTIONS": [{"id": "s11", "topic": 1, "code": "1.1", "title": "Бази даних: основні поняття, моделі даних і проєктування", "lessons": [{"n": 1, "title": "Поняття бази даних. Поняття, призначення й основні функції систем управління базами даних", "blocks": [["h", "Що таке база даних"], ["p", "**База даних (БД)** — це впорядкована сукупність взаємопов'язаних даних про певну предметну область, що зберігається в пам'яті комп'ютера й організована так, щоб дані можна було зручно знаходити, змінювати, доповнювати та аналізувати. **Предметна область** — частина реального світу, дані про яку зберігає БД: ліцей, бібліотека, інтернет-магазин, поліклініка."], ["p", "Звичайний текстовий файл зі списком учнів теж містить дані, але це ще не база даних: у ньому немає чіткої структури, правил перевірки й засобів швидкого пошуку. У БД кожен об'єкт описано однаковим набором характеристик, а дані зберігаються без зайвого дублювання."], ["h", "Система управління базами даних"], ["p", "**Система управління базами даних (СУБД, також СКБД)** — програмний комплекс для створення бази даних, наповнення її даними, пошуку, оновлення та захисту даних. Користувач і прикладні програми працюють з даними не напряму, а через СУБД. Приклади СУБД: Microsoft Access, MySQL, PostgreSQL, SQLite, Oracle Database, Microsoft SQL Server."], ["ul", ["**Визначення структури даних** — опис таблиць, полів, типів даних, зв'язків.", "**Маніпулювання даними** — додавання, змінення, вилучення записів.", "**Пошук і вибірка** — запити, сортування, фільтрація.", "**Забезпечення цілісності** — перевірка, щоб дані відповідали встановленим правилам (наприклад, оцінка від 1 до 12).", "**Захист даних** — розмежування прав доступу, паролі, шифрування.", "**Багатокористувацький доступ** — одночасна коректна робота кількох користувачів.", "**Резервне копіювання й відновлення** даних після збоїв."]], ["h", "Переваги використання БД"], ["table", ["Без БД (розрізнені файли)", "З використанням СУБД"], [["Ті самі дані повторюються в різних файлах", "Дані зберігаються один раз, зайве дублювання мінімальне"], ["Легко припуститися суперечностей", "Правила цілісності не дозволяють вводити некоректні дані"], ["Пошук — вручну або простим переглядом", "Швидкий пошук за запитами й індексами"], ["Доступ має той, хто має файл", "Права доступу налаштовуються для кожного користувача"]]], ["note", "Розрізняйте поняття: **база даних** — це самі дані разом з їхньою структурою, а **СУБД** — програма, яка ними керує. Файл `Ліцей.accdb` — це база даних, а Microsoft Access — СУБД."]]}, {"n": 2, "title": "Поняття моделі подання даних, основні моделі подання даних", "blocks": [["h", "Модель даних"], ["p", "**Модель даних (модель подання даних)** — спосіб організації даних у БД: які структури використовуються для зберігання, які операції над ними допустимі та які обмеження цілісності діють. Від моделі залежить, як СУБД зберігає дані й як користувач формулює запити."], ["h", "Ієрархічна модель"], ["p", "Дані організовано у вигляді **дерева**: кожен елемент (крім кореня) має рівно одного «батька» і може мати кілька «нащадків». Приклад: Ліцей → Класи → Учні. Модель проста й наочна, але погано описує випадки, коли об'єкт пов'язаний з кількома «батьками» (учень відвідує кілька гуртків). Подібну структуру мають файлова система комп'ютера та документи XML."], ["h", "Мережева модель"], ["p", "Узагальнення ієрархічної: елемент може мати **кількох «батьків»**, тобто зв'язки утворюють довільний граф. Модель гнучка, але складна для проєктування й змінення: щоб знайти дані, треба знати шляхи переходу між записами."], ["h", "Реляційна модель"], ["p", "Запропонована Е. Коддом у 1970 році. Дані подаються у вигляді **двовимірних таблиць (відношень)**. Кожен рядок таблиці (**запис, кортеж**) описує один об'єкт, кожен стовпець (**поле, атрибут**) — одну його властивість. Таблиці пов'язуються між собою через спільні значення полів (ключі). Сьогодні це найпоширеніша модель; Access, MySQL, PostgreSQL — реляційні СУБД."], ["table", ["Модель", "Структура", "Приклад використання"], [["Ієрархічна", "Дерево", "Каталог файлів, XML-документ"], ["Мережева", "Граф (довільні зв'язки)", "Ранні СУБД для великих підприємств"], ["Реляційна", "Пов'язані таблиці", "Access, MySQL, PostgreSQL, SQLite"], ["Нереляційні (NoSQL)", "Документи, пари «ключ — значення», графи", "Великі вебсервіси, кешування"]]], ["note", "Властивості реляційної таблиці: усі рядки різні; порядок рядків і стовпців не має значення; кожна клітинка містить одне (атомарне) значення; усі значення в стовпці мають один тип."]]}, {"n": 3, "title": "Проєктування баз даних. Поняття сутності, атрибута, ключа, зв'язку. Модель «сутність — зв'язок» предметної області. Класифікація зв'язків за множинністю та обов'язковістю", "blocks": [["h", "Етапи проєктування БД"], ["ol", ["**Аналіз предметної області** — з'ясування, які дані потрібно зберігати і які задачі розв'язуватиме БД.", "**Інфологічне (концептуальне) проєктування** — побудова моделі «сутність — зв'язок» (ER-моделі), незалежної від конкретної СУБД.", "**Логічне проєктування** — перетворення ER-моделі на набір таблиць обраної моделі даних (для реляційної — таблиці, поля, ключі).", "**Фізичне проєктування** — вибір типів даних, індексів, розміщення в конкретній СУБД."]], ["h", "Основні поняття ER-моделі"], ["ul", ["**Сутність** — клас однотипних об'єктів предметної області, про які зберігаються дані: Учень, Клас, Предмет, Книга.", "**Екземпляр сутності** — конкретний об'єкт: учень Петренко Олег.", "**Атрибут** — властивість сутності: прізвище, дата народження, номер телефону.", "**Ключ** — атрибут (або набір атрибутів), значення якого однозначно визначає екземпляр сутності: номер учнівського квитка, ISBN книги.", "**Зв'язок** — асоціація між сутностями: Учень **навчається в** Класі; Читач **бере** Книгу."]], ["p", "Модель «сутність — зв'язок» запропонував П. Чен (1976). На ER-діаграмах сутності зазвичай зображують прямокутниками, атрибути — овалами або списком усередині прямокутника, зв'язки — ромбами чи лініями з позначками множинності."], ["h", "Класифікація зв'язків"], ["table", ["Тип за множинністю", "Зміст", "Приклад"], [["Один до одного (1:1)", "Одному екземпляру A відповідає не більше одного екземпляра B, і навпаки", "Учень — Особова справа"], ["Один до багатьох (1:М)", "Одному екземпляру A — багато екземплярів B, а кожному B — лише один A", "Клас — Учні"], ["Багато до багатьох (М:N)", "Кожному A — багато B, і кожному B — багато A", "Учні — Гуртки"]]], ["p", "За **обов'язковістю** зв'язок для сутності буває **обов'язковим** (кожен екземпляр мусить брати участь у зв'язку: кожен учень обов'язково належить до класу) або **необов'язковим** (участь можлива, але не обов'язкова: учень може не відвідувати жодного гуртка)."], ["note", "У реляційній БД зв'язок «багато до багатьох» реалізують через **проміжну (сполучну) таблицю**: Учні 1:М Відвідування М:1 Гуртки. Таблиця Відвідування містить ключі учня й гуртка."]]}, {"n": 4, "title": "Бази даних в інформаційних системах", "blocks": [["h", "Інформаційна система"], ["p", "**Інформаційна система (ІС)** — сукупність технічних засобів, програм, баз даних і персоналу, що забезпечує збирання, зберігання, оброблення та видачу інформації для певної мети. База даних — ядро більшості ІС: у ній зберігаються всі відомості, з якими працює система."], ["ul", ["Електронний журнал і щоденник: учні, класи, предмети, оцінки, розклад.", "Бібліотечна система: книги, читачі, видачі.", "Системи продажу квитків, інтернет-магазини, банківські системи.", "Медичні системи: пацієнти, лікарі, записи на прийом."]], ["h", "Архітектура роботи з БД"], ["table", ["Архітектура", "Як працює", "Приклад"], [["Локальна", "БД і СУБД на одному комп'ютері, працює один користувач", "Файл Access на домашньому ПК"], ["Файл-сервер", "Файл БД лежить у мережевій папці, обробка відбувається на комп'ютерах користувачів", "Спільний файл Access у локальній мережі"], ["Клієнт-сервер", "Сервер БД виконує запити, клієнти отримують лише результати", "MySQL або PostgreSQL для вебсайту"], ["Розподілена", "Дані зберігаються на кількох серверах, що працюють як одне ціле", "Великі вебсервіси, банківські мережі"]]], ["h", "Вимоги до БД в інформаційних системах"], ["ul", ["**Цілісність і несуперечливість** даних.", "**Захищеність** — розмежування прав доступу, захист персональних даних.", "**Надійність** — резервне копіювання, відновлення після збоїв.", "**Продуктивність** — швидке виконання запитів навіть для великих обсягів даних.", "**Масштабованість** — можливість збільшувати обсяги даних і кількість користувачів."]], ["note", "Бази даних ІС часто містять **персональні дані** (ПІБ, адреси, телефони). Їх обробка регулюється законодавством про захист персональних даних, тому доступ до таких БД має бути обмежений, а дані — захищені."]]}, {"n": 5, "title": "Основні відомості про СУБД Access", "blocks": [["h", "Microsoft Access"], ["p", "**Microsoft Access** — реляційна СУБД, що входить до деяких версій пакета Microsoft Office. Уся база даних (таблиці, запити, форми, звіти тощо) зберігається в **одному файлі** з розширенням `.accdb` (у старих версіях — `.mdb`). Access зручний для невеликих БД: навчальних, офісних, для малого бізнесу."], ["h", "Об'єкти бази даних Access"], ["table", ["Об'єкт", "Призначення"], [["Таблиці", "Зберігання даних; основний об'єкт БД"], ["Запити", "Вибірка, обчислення, змінення даних за певними умовами"], ["Форми", "Зручне введення, перегляд і редагування даних"], ["Звіти", "Підготовка даних до друку у відформатованому вигляді"], ["Макроси", "Автоматизація послідовностей дій без програмування"], ["Модулі", "Програми мовою VBA для складніших задач"]]], ["h", "Інтерфейс і режими роботи"], ["ul", ["**Стрічка** з вкладками (Основне, Створення, Зовнішні дані, Знаряддя бази даних).", "**Область переходів** — список усіх об'єктів БД, згрупованих за типами.", "**Режим таблиці** — перегляд і введення даних.", "**Режим конструктора** — створення та змінення структури об'єкта (полів, типів, властивостей)."]], ["ol", ["Запустіть Access і виберіть **Пуста база даних**.", "Укажіть ім'я файлу та папку для збереження, натисніть **Створити**.", "Access відкриє нову таблицю `Таблиця1` у режимі таблиці — її можна відразу заповнювати або перейти в конструктор."]], ["note", "Access зберігає зміни в даних автоматично під час переходу до іншого запису, а зміни **структури** об'єктів потрібно зберігати командою **Зберегти**. Робіть резервні копії файлу БД перед суттєвими змінами. Цим уроком завершується вивчення підрозділу — підготуйтеся до тематичної атестації: повторіть поняття БД, СУБД, моделей даних, сутностей, ключів і зв'язків."]]}], "practice": [{"task": "Наведіть по одному прикладу ієрархічної та реляційної організації даних у ліцеї. Поясніть, чому для зберігання відомостей «учні — гуртки» ієрархічна модель незручна.", "answer": "Ієрархічна: Ліцей → Класи → Учні (кожен учень належить до одного класу). Реляційна: таблиці Учні, Класи, Гуртки, пов'язані ключами. Учень може відвідувати кілька гуртків, а гурток має багато учнів — це зв'язок «багато до багатьох». У дереві в елемента лише один «батько», тому учня довелося б дублювати в кількох гілках, що спричиняє надлишковість і суперечності.", "code": false}, {"task": "Для предметної області «Шкільна бібліотека» визначте сутності, їхні атрибути та ключі, а також типи зв'язків між сутностями.", "answer": "Сутності: Книга (ISBN або інвентарний номер — ключ, назва, автор, рік видання), Читач (номер читацького квитка — ключ, прізвище, ім'я, клас), Видача (код видачі — ключ, дата видачі, дата повернення). Зв'язки: Читач 1:М Видача (читач може брати багато книжок); Книга 1:М Видача (примірник видається багато разів у різний час). Отже, між Читачем і Книгою — зв'язок М:N, реалізований через сутність Видача.", "code": false}, {"task": "Визначте тип зв'язку за множинністю та обов'язковістю: а) Країна — Столиця; б) Вчитель — Предмет (вчитель викладає кілька предметів, предмет викладають кілька вчителів); в) Клас — Класний керівник.", "answer": "а) 1:1, обов'язковий для обох сторін (кожна країна має одну столицю, кожна столиця належить одній країні). б) М:N; для вчителя зв'язок обов'язковий, для предмета може бути необов'язковим (предмет тимчасово без вчителя). в) 1:1 (один класний керівник на клас); для класу — обов'язковий, для вчителя — необов'язковий (не кожен учитель є класним керівником).", "code": false}, {"task": "Запишіть мовою SQL опис таблиці `Учні` з полями: код учня (ключ, ціле), прізвище (текст до 50 символів, обов'язкове), ім'я (текст до 30 символів), дата народження.", "answer": "CREATE TABLE Учні (\n    КодУчня INTEGER PRIMARY KEY,\n    Прізвище VARCHAR(50) NOT NULL,\n    Імʼя VARCHAR(30),\n    ДатаНародження DATE\n);", "code": true}], "quiz": [{"q": "Що таке СУБД?", "o": ["Сукупність таблиць з даними", "Програмний комплекс для створення бази даних, роботи з даними та їх захисту", "Файл з розширенням `.accdb`", "Мова опису структури вебсторінок"], "a": 1, "why": "База даних — це дані, а СУБД — програма, що ними керує."}, {"q": "Яка модель даних організовує дані у вигляді дерева?", "o": ["Ієрархічна", "Мережева", "Реляційна", "Документна"], "a": 0, "why": "В ієрархічній моделі в кожного елемента, крім кореня, рівно один «батько»."}, {"q": "Як у реляційній моделі називають рядок таблиці?", "o": ["Атрибут", "Домен", "Відношення", "Запис (кортеж)"], "a": 3, "why": "Рядок — запис (кортеж), стовпець — поле (атрибут), таблиця — відношення."}, {"q": "Хто запропонував реляційну модель даних?", "o": ["П. Чен", "Б. Гейтс", "Е. Кодд", "Т. Бернерс-Лі"], "a": 2, "why": "Реляційну модель описав Е. Кодд у 1970 році; П. Чен — автор моделі «сутність — зв'язок»."}, {"q": "Який зв'язок між сутностями Клас і Учень?", "o": ["Один до одного", "Один до багатьох", "Багато до багатьох", "Зв'язку немає"], "a": 1, "why": "У класі багато учнів, а кожен учень належить до одного класу."}, {"q": "Як у реляційній БД реалізують зв'язок «багато до багатьох»?", "o": ["Об'єднують обидві таблиці в одну", "Додають в одну з таблиць кілька однакових полів", "Такий зв'язок реалізувати неможливо", "Через проміжну таблицю, що містить ключі обох таблиць"], "a": 3, "why": "Зв'язок М:N розкладають на два зв'язки 1:М через сполучну таблицю."}, {"q": "Що таке ключ сутності?", "o": ["Атрибут або набір атрибутів, що однозначно визначає екземпляр", "Пароль до бази даних", "Перший стовпець будь-якої таблиці", "Найдовше текстове поле"], "a": 0, "why": "Значення ключа не повторюється для різних екземплярів."}, {"q": "Який об'єкт Access призначений для підготовки даних до друку?", "o": ["Форма", "Запит", "Звіт", "Макрос"], "a": 2, "why": "Звіти форматують дані для друку; форми — для введення й перегляду."}, {"q": "Яке розширення має файл бази даних сучасних версій Access?", "o": ["`.docx`", "`.xlsx`", "`.accdb`", "`.sql`"], "a": 2, "why": "Сучасний формат — `.accdb`, у старих версіях використовувався `.mdb`."}, {"q": "У якій архітектурі сервер виконує запити, а клієнти отримують лише результати?", "o": ["Локальній", "Файл-серверній", "Ієрархічній", "Клієнт-серверній"], "a": 3, "why": "У файл-серверній архітектурі оброблення відбувається на комп'ютерах користувачів, у клієнт-серверній — на сервері."}]}, {"id": "s12", "topic": 1, "code": "1.2", "title": "Таблиці бази даних", "lessons": [{"n": 6, "title": "Створення й уведення структури таблиць. Поняття таблиці, поля, запису. Створення таблиць, означення полів і ключів у середовищі СКБД. Властивості полів, типи даних", "blocks": [["h", "Таблиця, поле, запис"], ["p", "**Таблиця** — основний об'єкт реляційної БД, що зберігає дані про одну сутність. **Поле** (стовпець) містить одну характеристику об'єкта і має ім'я та тип даних. **Запис** (рядок) містить усі дані про один об'єкт. **Структура таблиці** — перелік її полів із типами та властивостями."], ["h", "Типи даних у Access"], ["table", ["Тип даних", "Що зберігає"], [["Короткий текст (у старих версіях — Текст)", "Текст до 255 символів: прізвища, назви, номери телефонів"], ["Довгий текст (у старих версіях — MEMO)", "Довгі тексти: опис, примітки"], ["Число", "Числа, з якими виконують обчислення; розмір задається властивістю (Ціле, Довге ціле, Дійсне тощо)"], ["Дата й час", "Дати й час"], ["Грошова одиниця", "Грошові суми з фіксованою кількістю знаків після коми"], ["Лічильник", "Унікальне число, яке Access автоматично присвоює кожному новому запису"], ["Так/Ні", "Логічні значення: так/ні, істина/хибність"], ["Гіперпосилання, Вкладення, Об'єкт OLE", "Адреси, файли, вбудовані об'єкти"], ["Обчислюваний", "Значення, обчислене за виразом з інших полів"]]], ["h", "Створення таблиці в режимі конструктора"], ["ol", ["Вкладка **Створення** → **Конструктор таблиць**.", "У стовпці **Ім'я поля** введіть назву (до 64 символів, без крапок, знаків оклику й квадратних дужок).", "У стовпці **Тип даних** виберіть тип; за потреби заповніть **Опис**.", "Унизу на вкладці **Загальні** задайте властивості поля.", "Виділіть ключове поле й натисніть **Ключове поле** на стрічці.", "Збережіть таблицю (Ctrl+S) і дайте їй ім'я."]], ["h", "Основні властивості полів"], ["ul", ["**Розмір поля** — максимальна довжина тексту або діапазон числа.", "**Формат** — вигляд відображення (наприклад, короткий формат дати).", "**Маска введення** — шаблон для введення: `000-000-00-00` для телефону.", "**Підпис** — заголовок стовпця, що відображається замість імені поля.", "**Значення за замовчуванням** — підставляється в новий запис автоматично.", "**Умова на значення** і **Повідомлення про помилку** — правило перевірки, наприклад `Between 1 And 12` для оцінки.", "**Обов'язкове поле** — забороняє залишати поле порожнім.", "**Індексоване поле** — створення індексу для пришвидшення пошуку."]], ["note", "Вибирайте тип даних за змістом: номер телефону чи поштовий індекс — це **текст**, а не число (з ними не виконують обчислень, і вони можуть починатися з нуля)."]]}, {"n": 7, "title": "Модифікація структури таблиць", "blocks": [["h", "Які зміни можна вносити"], ["p", "Під час роботи з БД часто доводиться змінювати структуру таблиць: додавати нові поля, перейменовувати або вилучати непотрібні, змінювати типи даних і властивості. Зручніше робити це в **режимі конструктора** (контекстне меню таблиці → **Конструктор**)."], ["table", ["Дія", "Як виконати в конструкторі"], [["Додати поле", "Ввести ім'я в порожньому рядку або вставити рядок командою **Вставити рядки**"], ["Вилучити поле", "Виділити рядок поля → **Видалити рядки**"], ["Перейменувати поле", "Змінити текст у стовпці **Ім'я поля**"], ["Змінити порядок полів", "Перетягнути рядок за маркер виділення ліворуч"], ["Змінити тип або властивості", "Вибрати новий тип і змінити властивості на вкладці **Загальні**"]]], ["h", "Наслідки змін для даних"], ["ul", ["Вилучення поля знищує всі дані цього стовпця — дію не можна скасувати після збереження.", "Зменшення **розміру поля** може обрізати довші тексти або спричинити втрату чисел, що не вміщуються в новий діапазон.", "Змінення типу (наприклад, з тексту на число) може зробити частину значень недійсними — Access попередить про можливу втрату даних.", "Нова **умова на значення** може не виконуватися для вже введених записів — Access запропонує перевірити наявні дані.", "Поле, що бере участь у зв'язку між таблицями, не можна вилучити чи змінити його тип, доки не видалено зв'язок."]], ["note", "Перед модифікацією структури таблиці з даними **зробіть резервну копію** файлу БД (Файл → Зберегти як → Створити резервну копію бази даних)."], ["p", "Деякі зміни можна вносити і в **режимі таблиці**: додати стовпець через заголовок **Клацніть, щоб додати**, перейменувати поле подвійним клацанням на заголовку, вилучити стовпець через контекстне меню. Проте повний набір властивостей доступний лише в конструкторі."]]}, {"n": 8, "title": "Ключові поля, індекси, зв'язування таблиць", "blocks": [["h", "Первинний і зовнішній ключі"], ["p", "**Первинний ключ** — поле (або сукупність полів), значення якого унікально визначає кожен запис таблиці. Значення первинного ключа не можуть повторюватися і не можуть бути порожніми. Часто як ключ використовують поле типу **Лічильник**. **Складений ключ** утворюється з кількох полів (наприклад, `КодУчня` + `КодГуртка` у проміжній таблиці)."], ["p", "**Зовнішній ключ** — поле в підпорядкованій таблиці, що містить значення первинного ключа головної таблиці. Саме через нього встановлюється зв'язок: поле `КодКласу` в таблиці `Учні` посилається на `КодКласу` в таблиці `Класи`."], ["h", "Індекси"], ["p", "**Індекс** — допоміжна структура, яка пришвидшує пошук і сортування за полем (подібно до предметного покажчика в книжці). Для первинного ключа індекс створюється автоматично. Властивість **Індексоване поле** має значення: **Ні**; **Так (допускаються збіги)**; **Так (збіги не допускаються)** — останнє забезпечує унікальність значень."], ["note", "Індекси пришвидшують пошук, але сповільнюють додавання та змінення записів і займають місце. Індексуйте поля, за якими часто шукають або сортують."], ["h", "Зв'язування таблиць"], ["ol", ["Закрийте таблиці, які пов'язуватимете.", "Вкладка **Знаряддя бази даних** → **Схема даних**; додайте потрібні таблиці.", "Перетягніть первинний ключ головної таблиці на відповідне поле підпорядкованої таблиці.", "У вікні **Зміна зв'язків** увімкніть **Забезпечення цілісності даних** і за потреби каскадне оновлення та каскадне видалення пов'язаних записів.", "Натисніть **Створити** — на схемі з'явиться лінія зв'язку з позначками `1` і `∞`."]], ["p", "**Цілісність даних** означає, що в підпорядкованій таблиці не може бути значення зовнішнього ключа, якого немає в головній таблиці (учень не може належати до неіснуючого класу), і не можна вилучити запис головної таблиці, з яким пов'язані записи, якщо не ввімкнено каскадне видалення. Пов'язувані поля мають бути одного типу даних (поле типу Лічильник пов'язують із полем типу Число, розмір — Довге ціле)."], ["code", "-- Те саме мовою SQL\nCREATE TABLE Класи (\n    КодКласу INTEGER PRIMARY KEY,\n    Назва VARCHAR(10) NOT NULL\n);\n\nCREATE TABLE Учні (\n    КодУчня INTEGER PRIMARY KEY,\n    Прізвище VARCHAR(50) NOT NULL,\n    КодКласу INTEGER,\n    FOREIGN KEY (КодКласу) REFERENCES Класи (КодКласу)\n);"]]}, {"n": 9, "title": "Уведення, пошук і редагування даних у таблиці", "blocks": [["h", "Уведення даних"], ["p", "Дані вводять у **режимі таблиці**. Новий запис додається в останній порожній рядок, позначений зірочкою `*`. Перехід між полями — клавішею Tab або Enter. Запис зберігається автоматично, щойно ви переходите до іншого рядка. Поле типу Лічильник заповнюється автоматично."], ["ul", ["Ctrl+' (апостроф) — скопіювати значення з того самого поля попереднього запису.", "Ctrl+; — вставити поточну дату.", "Esc — скасувати зміни в поточному полі; повторне Esc — у всьому записі.", "Якщо значення не відповідає типу, масці чи умові на значення, Access не дозволить зберегти запис і покаже повідомлення."]], ["h", "Редагування й вилучення"], ["p", "Щоб змінити значення, клацніть у клітинці й виправте його. Для вилучення запису виділіть його маркером ліворуч і натисніть Delete (або **Видалити** на вкладці Основне). Вилучення записів **не можна скасувати** командою Скасувати, тому Access запитує підтвердження."], ["h", "Пошук і заміна"], ["ol", ["Установіть курсор у поле, за яким шукатимете.", "Вкладка **Основне** → **Знайти** (Ctrl+F).", "Введіть зразок, виберіть, де шукати (у поточному полі чи в усьому документі) і як зіставляти (з будь-якою частиною поля, поле повністю, з початку поля).", "Для заміни перейдіть на вкладку **Замінити** (Ctrl+H), введіть нове значення і натисніть **Замінити** або **Замінити все**."]], ["table", ["Символ підстановки", "Значення", "Приклад"], [["`*`", "Будь-яка кількість будь-яких символів", "`Кова*` — Коваль, Коваленко"], ["`?`", "Один будь-який символ", "`Ол?г` — Олег"], ["`#`", "Одна цифра", "`20##` — 2007, 2026"], ["`[ ]`", "Один із символів у дужках", "`[АБ]*` — прізвища на А або Б"]]], ["note", "Для зручного перегляду широких таблиць використовуйте **закріплення** стовпців (наприклад, прізвища) і **приховування** непотрібних стовпців — це змінює лише вигляд, а не структуру таблиці."]]}, {"n": 10, "title": "Сортування та фільтрація записів. Операції над таблицями", "blocks": [["h", "Сортування"], ["p", "**Сортування** — упорядкування записів за значеннями одного або кількох полів **за зростанням** (А→Я, 0→9, від ранніх дат до пізніх) або **за спаданням**. Виконується кнопками **За зростанням** / **За спаданням** на вкладці Основне або через контекстне меню заголовка стовпця. Кнопка **Видалити сортування** повертає початковий порядок."], ["p", "Для сортування за кількома полями в режимі таблиці виділіть суміжні стовпці: Access сортує спочатку за крайнім лівим, а за однакових значень — за наступним. Більш гнучко це налаштовується через **Розширений фільтр**, де порядок полів і напрямок сортування задаються в бланку."], ["h", "Фільтрація"], ["p", "**Фільтр** тимчасово приховує записи, що не відповідають умові. Дані при цьому не вилучаються; фільтр вмикають і вимикають кнопкою **Застосувати фільтр**."], ["table", ["Вид фільтра", "Як працює"], [["Фільтр за виділеним", "Відбирає записи з таким самим (або іншим, більшим, меншим) значенням, як у виділеній клітинці"], ["Фільтр у заголовку стовпця", "Список значень із прапорцями, текстові, числові фільтри й фільтри дат"], ["Фільтр за формою", "Умови вводяться в порожній бланк таблиці; умови в одному рядку з'єднуються І, на вкладці «Або» — АБО"], ["Розширений фільтр", "Бланк, схожий на конструктор запиту: кілька полів, умови й сортування одночасно"]]], ["table", ["Умова", "Що відбирає"], [["`>=10`", "Числа, не менші за 10"], ["`Between 7 And 9`", "Значення від 7 до 9 включно"], ["`Like \"К*\"`", "Тексти, що починаються на К"], ["`<>\"10-А\"`", "Усі значення, крім 10-А"], ["`Is Null`", "Порожні значення"], ["`>#01.09.2010#`", "Дати після 1 вересня 2010 р. (дату беруть у символи `#`)"]]], ["h", "Операції над таблицями"], ["ul", ["Як з об'єктами БД: копіювання (лише структури або структури з даними), перейменування, вилучення, імпорт і експорт (наприклад, в Excel).", "Рядок **Підсумки** в режимі таблиці — сума, середнє, кількість, мінімум, максимум за стовпцем.", "Реляційні операції, які виконують за допомогою запитів: **вибірка** (відбір рядків за умовою), **проєкція** (відбір стовпців), **з'єднання** (поєднання пов'язаних таблиць), **об'єднання** записів двох таблиць однакової структури."]], ["note", "Сортування й фільтр, застосовані в режимі таблиці, можна зберегти разом з таблицею, але для постійного використання умов відбору краще створювати **запити** — їх вивчатимемо в наступному підрозділі."]]}, {"n": 11, "title": "Створення структури таблиць і введення вмісту", "blocks": [["p", "**Практична робота 1.** Мета: навчитися створювати таблиці в режимі конструктора, задавати типи даних, властивості полів і ключі, пов'язувати таблиці та вводити дані."], ["ol", ["Створіть пусту БД `Ліцей_Прізвище.accdb`.", "Створіть таблицю `Класи`: `КодКласу` (Лічильник, ключ), `Назва` (Короткий текст, 10), `Класний_керівник` (Короткий текст, 60).", "Створіть таблицю `Учні`: `КодУчня` (Лічильник, ключ), `Прізвище` (Короткий текст, 50, обов'язкове), `Імʼя` (Короткий текст, 30), `ДатаНародження` (Дата й час, короткий формат), `Телефон` (Короткий текст, маска `000-000-00-00`), `КодКласу` (Число, Довге ціле).", "Створіть таблицю `Оцінки`: `КодОцінки` (Лічильник, ключ), `КодУчня` (Число, Довге ціле), `Предмет` (Короткий текст, 40), `Оцінка` (Число, Байт, умова на значення `Between 1 And 12` з повідомленням про помилку), `Дата` (Дата й час, значення за замовчуванням `Date()`).", "У **Схемі даних** зв'яжіть `Класи`–`Учні` і `Учні`–`Оцінки` (1:М) із забезпеченням цілісності даних.", "Введіть 3 класи, щонайменше 10 учнів і 20 оцінок. Перевірте, що Access не приймає оцінку 13 і учня з неіснуючим кодом класу."]], ["ul", ["Критерії: правильні типи даних і ключі в усіх таблицях — 4 бали; властивості полів (розмір, маска, умова, значення за замовчуванням) — 3 бали; зв'язки з цілісністю — 3 бали; дані введено коректно — 2 бали.", "Збережіть файл і зробіть знімок вікна **Схема даних** для звіту."]], ["note", "Спочатку заповнюйте головні таблиці (`Класи`), потім підпорядковані (`Учні`, `Оцінки`) — інакше цілісність даних не дозволить ввести записи з посиланням на ще не існуючий ключ."]]}, {"n": 12, "title": "Пошук, сортування і фільтрація даних у таблицях", "blocks": [["p", "**Практична робота 2.** Мета: закріпити навички пошуку, заміни, сортування та фільтрації записів. Використайте БД, створену на практичній роботі 1."], ["ol", ["Знайдіть усіх учнів, прізвище яких починається на «Ко» (пошук зі зразком `Ко*`).", "Замініть у таблиці `Оцінки` назву предмета «Інформатика» на «Інформатика (профільний рівень)».", "Відсортуйте учнів за прізвищем за зростанням, а потім за датою народження від наймолодших.", "За допомогою фільтра за виділеним відберіть учнів одного класу.", "Фільтром за формою відберіть оцінки з інформатики, вищі або рівні 10.", "Розширеним фільтром відберіть учнів, народжених після 1 січня 2009 року, і відсортуйте їх за прізвищем.", "Увімкніть рядок **Підсумки** в таблиці `Оцінки` і обчисліть середню оцінку."]], ["ul", ["Критерії: кожне правильно виконане завдання 1–6 — 1,5 бала, завдання 7 — 3 бали.", "Для кожного завдання запишіть у звіт використану умову відбору або параметри пошуку."]], ["note", "Після кожного фільтра вимикайте його кнопкою **Застосувати фільтр** (або **Очистити всі фільтри**), щоб наступне завдання виконувалося з усіма записами. Це урок тематичної атестації з теми «Бази даних. Таблиці»: повторіть типи даних, властивості полів, ключі, зв'язки, сортування й фільтри."]]}], "practice": [{"task": "Для таблиці `Книги` шкільної бібліотеки доберіть тип даних для полів: інвентарний номер, назва, автор, рік видання, ціна, наявність у бібліотеці, ISBN, анотація.", "answer": "Інвентарний номер — Лічильник або Короткий текст (ключ); назва, автор — Короткий текст; рік видання — Число (Ціле); ціна — Грошова одиниця; наявність — Так/Ні; ISBN — Короткий текст (містить дефіси й може починатися з нуля, обчислень з ним не виконують); анотація — Довгий текст.", "code": false}, {"task": "Запишіть умови на значення для полів: а) оцінка від 1 до 12; б) дата народження не пізніше сьогоднішньої; в) клас — лише 10 або 11.", "answer": "а) `Between 1 And 12` (або `>=1 And <=12`); б) `<=Date()`; в) `10 Or 11` (або `In (10;11)` — роздільник у списку залежить від регіональних налаштувань).", "code": false}, {"task": "Мовою SQL створіть таблиці `Гуртки` (код, назва) та `Відвідування` для зв'язку «багато до багатьох» між учнями й гуртками (таблиця `Учні` з ключем `КодУчня` вже існує).", "answer": "CREATE TABLE Гуртки (\n    КодГуртка INTEGER PRIMARY KEY,\n    Назва VARCHAR(60) NOT NULL\n);\n\nCREATE TABLE Відвідування (\n    КодУчня INTEGER,\n    КодГуртка INTEGER,\n    PRIMARY KEY (КодУчня, КодГуртка),\n    FOREIGN KEY (КодУчня) REFERENCES Учні (КодУчня),\n    FOREIGN KEY (КодГуртка) REFERENCES Гуртки (КодГуртка)\n);", "code": true}, {"task": "Сформулюйте умови відбору для фільтра таблиці `Учні`: а) прізвища на «Ш»; б) учні без вказаного телефону; в) учні 10-А або 10-Б класу (поле `Клас` текстове).", "answer": "а) поле `Прізвище`: `Like \"Ш*\"`; б) поле `Телефон`: `Is Null`; в) поле `Клас`: `\"10-А\" Or \"10-Б\"` (або `Like \"10-[АБ]\"`).", "code": false}, {"task": "Чому не вдається вилучити запис про клас 10-А з таблиці `Класи`, якщо між `Класи` і `Учні` встановлено зв'язок із забезпеченням цілісності даних? Як можна розв'язати проблему?", "answer": "Із записом 10-А пов'язані записи в таблиці `Учні`; вилучення залишило б учнів із посиланням на неіснуючий клас, тому цілісність даних це забороняє. Рішення: спочатку перевести учнів в інший клас або вилучити їхні записи, або (свідомо!) увімкнути в зв'язку каскадне видалення — тоді разом із класом будуть вилучені й усі його учні.", "code": false}], "quiz": [{"q": "Який тип даних найкраще підходить для поля «Номер телефону»?", "o": ["Число", "Короткий текст", "Грошова одиниця", "Лічильник"], "a": 1, "why": "З номером не виконують обчислень, він може містити дефіси й починатися з нуля."}, {"q": "Що відбувається з полем типу Лічильник під час додавання запису?", "o": ["Access автоматично присвоює йому унікальне число", "Користувач обов'язково вводить значення вручну", "Поле залишається порожнім", "У поле записується поточна дата"], "a": 0, "why": "Лічильник генерується автоматично і часто служить первинним ключем."}, {"q": "Яка властивість поля задає шаблон введення, наприклад `000-000-00-00`?", "o": ["Формат", "Підпис", "Значення за замовчуванням", "Маска введення"], "a": 3, "why": "Маска введення визначає, які символи і в якому порядку можна вводити."}, {"q": "Яка вимога до значень первинного ключа?", "o": ["Вони мають бути текстовими", "Вони можуть повторюватися", "Вони унікальні й не можуть бути порожніми", "Вони завжди починаються з 1"], "a": 2, "why": "Первинний ключ однозначно ідентифікує кожен запис."}, {"q": "Як називається поле підпорядкованої таблиці, що містить значення первинного ключа головної таблиці?", "o": ["Індекс", "Обчислюване поле", "Підпис", "Зовнішній ключ"], "a": 3, "why": "Через зовнішній ключ встановлюється зв'язок між таблицями."}, {"q": "Що забезпечує режим «Забезпечення цілісності даних» у зв'язку?", "o": ["Неможливість ввести в підпорядковану таблицю значення ключа, якого немає в головній", "Автоматичне сортування записів", "Шифрування файлу бази даних", "Створення резервної копії"], "a": 0, "why": "Цілісність гарантує, що зв'язані записи посилаються на існуючі записи головної таблиці."}, {"q": "Що відбере умова `Like \"Б*\"` у полі «Прізвище»?", "o": ["Прізвища, що закінчуються на Б", "Прізвища, що починаються на Б", "Прізвища з однієї літери Б", "Прізвища, що містять символ *"], "a": 1, "why": "Символ `*` замінює будь-яку кількість будь-яких символів після Б."}, {"q": "Що відбувається із записами, які не відповідають умові фільтра?", "o": ["Вони вилучаються з таблиці", "Вони переміщуються в кінець таблиці", "Вони тимчасово приховуються", "Вони копіюються в нову таблицю"], "a": 2, "why": "Фільтр лише приховує записи; після його вимкнення видно всі записи."}, {"q": "У якому режимі найзручніше змінювати типи даних і властивості полів?", "o": ["У режимі таблиці", "У режимі конструктора", "У режимі макета звіту", "У вікні «Схема даних»"], "a": 1, "why": "Повний набір властивостей полів доступний у конструкторі."}, {"q": "Що з наведеного є недоліком індексування поля?", "o": ["Пришвидшення пошуку", "Пришвидшення сортування", "Сповільнення додавання та змінення записів", "Неможливість сортування за полем"], "a": 2, "why": "Під час змінення даних СУБД мусить оновлювати й індекс."}]}, {"id": "s13", "topic": 1, "code": "1.3", "title": "Запити в базах даних", "lessons": [{"n": 13, "title": "Загальні відомості про запити", "blocks": [["h", "Що таке запит"], ["p", "**Запит** — це об’єкт бази даних, який дозволяє отримати з однієї або кількох таблиць потрібні дані, обчислити нові значення чи змінити дані за заданими умовами. Запит не зберігає дані сам: у базі зберігається лише його **опис** (інструкція), а результат формується щоразу під час виконання з актуального вмісту таблиць."], ["p", "У прикладах цього підрозділу використовуємо навчальну базу даних **«Канцтовари»** з двома пов’язаними таблицями: `Товари` (КодТовару, Назва, Категорія, Ціна, Залишок) і `Продажі` (КодПродажу, КодТовару, Дата, Кількість, Продавець). Таблиці зв’язані за полем `КодТовару` зв’язком «один-до-багатьох»."], ["h", "Види запитів в Access"], ["table", ["Вид запиту", "Призначення"], [["Вибірка", "Відбирає записи й поля з таблиць за умовами; результат — динамічний набір записів"], ["Запит з параметром", "Під час запуску запитує в користувача значення умови"], ["Перехресний", "Подає підсумкові дані у вигляді зведеної таблиці (рядки × стовпці)"], ["Створення таблиці", "Створює нову таблицю з результатів вибірки"], ["Додавання", "Додає записи з результатів запиту в наявну таблицю"], ["Оновлення", "Змінює значення полів у записах, що задовольняють умову"], ["Видалення", "Видаляє записи, що задовольняють умову"]]], ["note", "Останні чотири види — **запити на змінення даних** (дії). Їх результат не можна скасувати командою «Скасувати», тому перед запуском варто зробити резервну копію бази."], ["h", "Способи створення запитів"], ["ul", ["**Майстер запитів** (вкладка «Створення» → «Майстер запитів»): простий запит, перехресний запит, пошук повторюваних записів, пошук записів без підпорядкованих.", "**Конструктор запитів** (вкладка «Створення» → «Конструктор запитів»): запит складається на бланку QBE (Query By Example — запит за зразком).", "**Режим SQL**: текст запиту пишуть мовою SQL. Будь-який запит, створений у конструкторі, Access також зберігає як інструкцію SQL.", "Між режимами перемикаються кнопкою «Подання»: **подання таблиці** (результат), **конструктор** (бланк), **подання SQL** (текст запиту)."]], ["code", "SELECT Назва, Ціна\nFROM Товари\nWHERE Категорія = \"Зошити\"\nORDER BY Ціна;"], ["p", "Цей запит мовою SQL відбирає назви й ціни всіх зошитів і впорядковує їх за зростанням ціни. Такий самий запит можна скласти в конструкторі, нічого не пишучи вручну."]]}, {"n": 14, "title": "Створення й виконання запитів на вибірку даних", "blocks": [["h", "Бланк запиту в конструкторі"], ["p", "Після команди «Конструктор запитів» додаємо потрібні таблиці (вікно «Додати таблиці»). У верхній частині вікна видно списки полів і зв’язки між таблицями, у нижній — **бланк QBE**. Кожен стовпець бланка відповідає одному полю результату."], ["table", ["Рядок бланка", "Що задає"], [["Поле", "Ім’я поля або вираз"], ["Ім’я таблиці", "З якої таблиці береться поле"], ["Сортування", "За зростанням / за спаданням / без сортування"], ["Відображення", "Чи показувати поле в результаті (прапорець)"], ["Умови", "Умова відбору для цього поля"], ["або", "Альтернативна умова (з’єднується через OR)"]]], ["h", "Умови відбору"], ["ul", ["Порівняння: `>100`, `<=50`, `<>\"Ручки\"`.", "Діапазон: `Between 10 And 50`; дати записують між знаками `#`: `Between #2026-09-01# And #2026-09-30#`.", "Шаблон: `Like \"Зошит*\"` — `*` замінює будь-яку кількість символів, `?` — один символ.", "Список значень: `In (\"Ручки\";\"Олівці\")` (у бланку розділювач залежить від регіональних налаштувань).", "Порожні значення: `Is Null`, `Is Not Null`.", "Умови в **одному рядку** «Умови» з’єднуються через **AND**, у **різних рядках** («Умови» та «або») — через **OR**."]], ["h", "Запит з кількох таблиць"], ["p", "Якщо додати обидві таблиці, Access використає зв’язок між ними і з’єднає записи. Наприклад, виведемо назви товарів і кількість проданого у вересні:"], ["code", "SELECT Товари.Назва, Продажі.Дата, Продажі.Кількість\nFROM Товари INNER JOIN Продажі\n  ON Товари.КодТовару = Продажі.КодТовару\nWHERE Продажі.Дата Between #2026-09-01# And #2026-09-30#\nORDER BY Продажі.Дата;"], ["ol", ["Відкрийте «Конструктор запитів», додайте таблиці `Товари` і `Продажі`.", "Перетягніть на бланк поля `Назва`, `Дата`, `Кількість`.", "У рядку «Умови» для `Дата` введіть умову діапазону, у рядку «Сортування» оберіть «За зростанням».", "Натисніть «Виконати» (знак оклику) і перевірте результат.", "Збережіть запит з назвою, наприклад, `Продажі_вересень`."]], ["note", "Запит на вибірку можна використовувати як джерело даних для інших запитів, форм і звітів — так само, як таблицю."]]}, {"n": 15, "title": "Запити з функціями і з полями, що обчислюються", "blocks": [["h", "Поля, що обчислюються"], ["p", "**Поле, що обчислюється** (обчислюване поле) — поле запиту, значення якого розраховується за виразом з інших полів. У таблиці воно не зберігається. У бланку конструктора в рядку «Поле» записують `Ім’яНовогоПоля: вираз`, а імена полів беруть у квадратні дужки, наприклад `Сума: [Ціна]*[Кількість]` або `ЗПДВ: Round([Ціна]*1.2;2)`."], ["p", "У бланку аргументи функцій розділяють знаком, заданим у регіональних налаштуваннях Windows (для української локалі зазвичай `;`), а в тексті SQL — завжди комою. У SQL обчислюване поле задають через ключове слово `AS`:"], ["code", "SELECT Товари.Назва, Продажі.Кількість, Товари.Ціна,\n       Товари.Ціна * Продажі.Кількість AS Сума\nFROM Товари INNER JOIN Продажі\n  ON Товари.КодТовару = Продажі.КодТовару;"], ["h", "Вбудовані функції"], ["table", ["Функція", "Приклад", "Результат"], [["`Date()`, `Now()`", "`Date()`", "поточна дата (і час)"], ["`Year`, `Month`, `Day`", "`Month([Дата])`", "номер місяця"], ["`DateDiff`", "`DateDiff(\"d\";[Дата];Date())`", "кількість днів між датами"], ["`Left`, `Len`, `UCase`", "`Left([Назва];3)`", "перші 3 символи"], ["`IIf`", "`IIf([Залишок]<10;\"Замовити\";\"Достатньо\")`", "значення залежно від умови"], ["`Round`, `Nz`", "`Nz([Знижка];0)`", "0 замість порожнього значення"]]], ["h", "Групові операції (підсумки)"], ["p", "Кнопка **«Підсумки»** (Σ) додає до бланка рядок «Групова операція». Для поля, за яким групуємо, залишаємо «Групування», для інших обираємо функцію: `Sum`, `Avg`, `Min`, `Max`, `Count`, `First`, `Last`. Значення «Умова» дозволяє задати відбір без виведення поля."], ["code", "SELECT Товари.Категорія,\n       Sum(Товари.Ціна * Продажі.Кількість) AS Виторг,\n       Count(Продажі.КодПродажу) AS КількістьПродажів\nFROM Товари INNER JOIN Продажі\n  ON Товари.КодТовару = Продажі.КодТовару\nGROUP BY Товари.Категорія\nHAVING Sum(Товари.Ціна * Продажі.Кількість) > 1000;"], ["p", "Тут `WHERE` відбирав би записи **до** групування, а `HAVING` відбирає групи **після** обчислення підсумків. Для складних виразів зручно користуватися **Будівником виразів** (контекстне меню поля бланка → «Побудувати»)."]]}, {"n": 16, "title": "Запити з параметрами. Перехресні запити", "blocks": [["h", "Запит з параметром"], ["p", "**Запит з параметром** під час кожного запуску відкриває вікно, у яке користувач вводить значення умови. Так один запит замінює багато однакових запитів з різними умовами. У рядку «Умови» замість конкретного значення пишуть текст підказки у квадратних дужках."], ["code", "[Введіть категорію:]\nBetween [Початкова дата:] And [Кінцева дата:]\nLike [Початок назви:] & \"*\""], ["p", "Текст підказки не повинен збігатися з іменем поля, інакше Access підставить значення поля замість запиту. Тип параметра варто оголосити (кнопка «Параметри»), тоді в SQL з’явиться інструкція `PARAMETERS`:"], ["code", "PARAMETERS [Початкова дата:] DateTime, [Кінцева дата:] DateTime;\nSELECT Продажі.Дата, Товари.Назва, Продажі.Кількість\nFROM Товари INNER JOIN Продажі\n  ON Товари.КодТовару = Продажі.КодТовару\nWHERE Продажі.Дата Between [Початкова дата:] And [Кінцева дата:];"], ["h", "Перехресний запит"], ["p", "**Перехресний запит** групує дані одночасно за двома ознаками й подає підсумки у вигляді таблиці: значення однієї ознаки стають **заголовками рядків**, іншої — **заголовками стовпців**, а на перетині обчислюється підсумкова функція."], ["ul", ["Майстер перехресних запитів працює з **одним** джерелом (таблицею або запитом), тому дані з кількох таблиць спершу об’єднують окремим запитом.", "Заголовків рядків — до трьох, заголовок стовпців — один, значення — одне поле з функцією.", "У конструкторі: тип запиту «Перехресний», у рядку «Перехресна таблиця» обирають «Заголовки рядків», «Заголовки стовпців» або «Значення»."]], ["code", "TRANSFORM Sum(Продажі.Кількість) AS Продано\nSELECT Товари.Назва\nFROM Товари INNER JOIN Продажі\n  ON Товари.КодТовару = Продажі.КодТовару\nGROUP BY Товари.Назва\nPIVOT Продажі.Продавець;"], ["note", "Результат прикладу: для кожного товару (рядок) видно, скільки одиниць продав кожен продавець (стовпці). Якщо в перехресному запиті використовується параметр, його **обов’язково** треба оголосити через «Параметри» (`PARAMETERS`), інакше запит не виконається."]]}, {"n": 17, "title": "Запити на змінення даних", "blocks": [["h", "Навіщо потрібні запити-дії"], ["p", "Запити на змінення даних (запити-дії) за одну операцію змінюють багато записів: створюють таблиці, додають, оновлюють чи видаляють записи. У переліку об’єктів їх позначено значками зі знаком оклику. Тип запиту обирають у конструкторі на вкладці «Конструктор запитів» (група «Тип запиту»)."], ["note", "**Порада:** спершу складіть запит як вибірку і перегляньте результат — переконайтеся, що відбираються саме потрібні записи. Лише потім змініть тип і натисніть «Виконати». Скасувати дію неможливо."], ["table", ["Тип", "SQL (Access)", "Що робить"], [["Створення таблиці", "`SELECT … INTO НоваТаблиця FROM …`", "нова таблиця з результату"], ["Додавання", "`INSERT INTO Таблиця … SELECT …`", "дописує записи до наявної таблиці"], ["Оновлення", "`UPDATE Таблиця SET … WHERE …`", "змінює значення полів"], ["Видалення", "`DELETE FROM Таблиця WHERE …`", "видаляє записи"]]], ["h", "Приклади"], ["code", "-- 1. Підняти ціни на ручки на 10 %\nUPDATE Товари SET Ціна = Round(Ціна * 1.1, 2)\nWHERE Категорія = \"Ручки\";\n\n-- 2. Створити архівну таблицю продажів до 2026 року\nSELECT * INTO АрхівПродажів\nFROM Продажі\nWHERE Дата < #2026-01-01#;\n\n-- 3. Видалити перенесені в архів записи\nDELETE FROM Продажі\nWHERE Дата < #2026-01-01#;\n\n-- 4. Згодом дописати до архіву продажі за січень 2026\nINSERT INTO АрхівПродажів\nSELECT * FROM Продажі\nWHERE Дата Between #2026-01-01# And #2026-01-31#;"], ["p", "У конструкторі запит на оновлення має рядок **«Оновлення»**: у ньому під полем `Ціна` записують новий вираз `[Ціна]*1.1`, а в рядку «Умови» під полем `Категорія` — `\"Ручки\"`. Рядки з `--` тут лише пояснення: у поданні SQL Access коментарі не підтримуються, і кожен запит зберігається як окремий об’єкт."], ["ul", ["Перед виконанням Access попереджає, скільки записів буде змінено, — уважно читайте це повідомлення.", "Запит на видалення з боку «один» зв’язку з увімкненим **каскадним видаленням** видалить і пов’язані записи з боку «багато».", "За умовчанням Access може блокувати запити-дії в базі з ненадійного розташування: потрібно натиснути «Увімкнути вміст» на панелі повідомлень."]]]}, {"n": 18, "title": "Запити з функціями та з полями, що обчислюються", "blocks": [["p", "**Практична робота 3.** Мета: навчитися створювати запити з обчислюваними полями, вбудованими функціями та груповими операціями в базі «Канцтовари»."], ["ol", ["Створіть запит `Продажі_суми`: поля `Дата`, `Назва`, `Кількість`, `Ціна` та обчислюване поле `Сума: [Ціна]*[Кількість]`.", "Додайте поле `Місяць: Month([Дата])` і поле `Стан: IIf([Залишок]<10;\"Замовити\";\"Достатньо\")`.", "Створіть підсумковий запит `Виторг_за_категоріями` (кнопка Σ): групування за `Категорія`, `Sum` для суми продажів, `Count` для кількості продажів.", "Відсортуйте категорії за спаданням виторгу; відкрийте подання SQL і порівняйте текст із бланком.", "Збережіть обидва запити."]], ["ul", ["Критерії: правильні імена обчислюваних полів; результат обчислень збігається з ручною перевіркою 2–3 записів; підсумковий запит не містить зайвих полів у групуванні."]], ["note", "Якщо Access запитує значення поля, якого ви не планували вводити, — найімовірніше, у виразі помилка в імені поля (перевірте квадратні дужки й написання)."]]}, {"n": 19, "title": "Запити з параметрами, перехресні запити і запити на змінення даних", "blocks": [["p", "**Практична робота 4.** Мета: закріпити створення запитів з параметрами, перехресних запитів і запитів-дій. Перед роботою зробіть копію файлу бази даних."], ["ol", ["Запит з параметром `Продажі_за_період`: умова для `Дата` — `Between [Початкова дата:] And [Кінцева дата:]`; оголосіть тип параметрів `Дата й час`.", "Перехресний запит `Продажі_по_місяцях`: рядки — `Назва`, стовпці — `Format([Дата];\"mm\")` (номер місяця), значення — `Sum` від `Кількість`.", "Запит на створення таблиці `Дефіцит` з товарами, у яких `Залишок < 10`.", "Запит на оновлення: знизити на 5 % ціну товарів категорії «Олівці».", "Запит на видалення з таблиці `Дефіцит` записів з `Залишок = 0`."]], ["ul", ["Критерії: кожен запит виконується без помилок; перед запитами-діями перевірено вибірку; у звіті до роботи вказано, скільки записів змінив кожен запит-дія."]], ["note", "Запити-дії не запускайте двічі «для перевірки»: повторне оновлення ще раз змінить ціни, а повторне створення таблиці перезапише її."], ["p", "Урок завершується **тематичною атестацією** з теми «Запити»: повторіть види запитів, умови відбору, функції та відповідні інструкції SQL."]]}], "practice": [{"task": "Напишіть SQL-запит, який виводить назву і ціну всіх товарів категорії «Зошити» з ціною від 20 до 60 грн, упорядкованих за спаданням ціни.", "answer": "SELECT Назва, Ціна\nFROM Товари\nWHERE Категорія = \"Зошити\" AND Ціна Between 20 And 60\nORDER BY Ціна DESC;", "code": true}, {"task": "Напишіть SQL-запит, що для кожного продавця обчислює загальну кількість проданих одиниць і загальну суму продажів (Ціна × Кількість).", "answer": "SELECT Продажі.Продавець,\n       Sum(Продажі.Кількість) AS Одиниць,\n       Sum(Товари.Ціна * Продажі.Кількість) AS СумаПродажів\nFROM Товари INNER JOIN Продажі\n  ON Товари.КодТовару = Продажі.КодТовару\nGROUP BY Продажі.Продавець;", "code": true}, {"task": "Що потрібно записати в рядку «Умови» бланка конструктора, щоб запит під час запуску питав у користувача мінімальну ціну і відбирав товари, дорожчі за неї?", "answer": "У стовпці поля `Ціна` в рядку «Умови» записати `>[Мінімальна ціна:]`. Текст у квадратних дужках не повинен збігатися з іменем жодного поля. Бажано оголосити параметр через кнопку «Параметри» з типом «Грошовий» або «Число».", "code": false}, {"task": "Напишіть запит на оновлення, який для всіх товарів із залишком менше 5 одиниць знижує ціну на 15 %.", "answer": "UPDATE Товари SET Ціна = Round(Ціна * 0.85, 2)\nWHERE Залишок < 5;", "code": true}, {"task": "Напишіть перехресний запит (Access SQL): рядки — категорії товарів, стовпці — продавці, значення — сума продажів у гривнях.", "answer": "TRANSFORM Sum(Товари.Ціна * Продажі.Кількість) AS Сума\nSELECT Товари.Категорія\nFROM Товари INNER JOIN Продажі\n  ON Товари.КодТовару = Продажі.КодТовару\nGROUP BY Товари.Категорія\nPIVOT Продажі.Продавець;", "code": true}], "quiz": [{"q": "Що зберігається в базі даних для запиту на вибірку?", "o": ["Опис (інструкція) запиту", "Копія всіх відібраних записів", "Окрема таблиця з результатом", "Знімок екрана результату"], "a": 0, "why": "Результат формується щоразу під час виконання з актуальних даних таблиць."}, {"q": "Як з’єднуються умови, записані в одному рядку «Умови» для різних полів?", "o": ["Через OR", "Через AND", "Через NOT", "Через XOR"], "a": 1, "why": "Умови в одному рядку мають виконуватися одночасно; різні рядки («або») дають OR."}, {"q": "Яка умова відбере назви, що починаються на «Зош»?", "o": ["`= \"Зош\"`", "`Like \"*Зош\"`", "`Like \"Зош*\"`", "`In (\"Зош\")`"], "a": 2, "why": "Знак `*` у шаблоні замінює будь-яку кількість символів після «Зош»."}, {"q": "Як правильно задати обчислюване поле в рядку «Поле» бланка конструктора?", "o": ["`Сума = Ціна*Кількість`", "`[Сума]: Ціна x Кількість`", "`Ціна*Кількість AS [Сума]:`", "`Сума: [Ціна]*[Кількість]`"], "a": 3, "why": "У бланку пишуть ім’я нового поля, двокрапку і вираз з іменами полів у квадратних дужках."}, {"q": "Чим `HAVING` відрізняється від `WHERE` у підсумковому запиті?", "o": ["`HAVING` відбирає групи після обчислення підсумків", "`HAVING` працює лише з текстовими полями", "`HAVING` сортує результат", "Нічим, це синоніми"], "a": 0, "why": "`WHERE` фільтрує записи до групування, `HAVING` — групи після нього."}, {"q": "Що з’явиться під час запуску запиту з умовою `>[Мінімальна ціна:]`?", "o": ["Повідомлення про помилку", "Вікно для введення значення параметра", "Порожній результат", "Будівник виразів"], "a": 1, "why": "Текст у квадратних дужках, що не є іменем поля, Access сприймає як параметр."}, {"q": "Яка інструкція SQL відповідає перехресному запиту в Access?", "o": ["`SELECT … INTO`", "`UPDATE … SET`", "`TRANSFORM … PIVOT`", "`INSERT INTO`"], "a": 2, "why": "`TRANSFORM` задає функцію для значень, `PIVOT` — поле заголовків стовпців."}, {"q": "Яким запитом можна збільшити ціни всіх товарів однієї категорії?", "o": ["Запитом на створення таблиці", "Перехресним запитом", "Запитом на додавання", "Запитом на оновлення"], "a": 3, "why": "`UPDATE Товари SET Ціна = Ціна*1.1 WHERE …` змінює значення наявних записів."}, {"q": "Чому перед виконанням запиту-дії радять спершу запустити його як вибірку?", "o": ["Щоб переконатися, що відбираються саме потрібні записи", "Бо інакше запит не збережеться", "Щоб пришвидшити виконання", "Бо так вимагає SQL"], "a": 0, "why": "Зміни, внесені запитом-дією, не можна скасувати командою «Скасувати»."}, {"q": "Скільки полів можна обрати як заголовки стовпців у перехресному запиті?", "o": ["До трьох", "Лише одне", "Скільки завгодно", "Жодного, лише рядки"], "a": 1, "why": "Заголовків рядків може бути до трьох, а заголовок стовпців — тільки один."}]}, {"id": "s14", "topic": 1, "code": "1.4", "title": "Форми і звіти", "lessons": [{"n": 20, "title": "Створення форм за допомогою простих засобів", "blocks": [["h", "Що таке форма"], ["p", "**Форма** — об’єкт бази даних для зручного перегляду, введення й редагування даних. Форма не зберігає дані: вона показує записи з **джерела записів** — таблиці або запиту. Користувач працює з формою, не бачачи структури таблиць, тому знижується ризик помилок."], ["h", "Інструменти групи «Форми» (вкладка «Створення»)"], ["table", ["Інструмент", "Результат"], [["Форма", "одна кнопка — форма з усіма полями виділеної таблиці чи запиту, один запис на екрані"], ["Майстер форм", "покроковий вибір таблиць, полів, вигляду (в один стовпець, табличний, таблиця даних, вирівняний)"], ["Кілька елементів", "табличну форму, у якій видно багато записів одночасно"], ["Таблиця даних", "форма, схожа на таблицю"], ["Розділена форма", "у верхній частині — один запис, у нижній — таблиця даних"], ["Пуста форма", "порожня форма в поданні розмітки, поля додають зі списку"], ["Конструктор форм", "порожня форма в режимі конструктора"]]], ["h", "Майстер форм: кроки"], ["ol", ["Оберіть таблицю або запит і перенесіть потрібні поля (можна з кількох пов’язаних таблиць).", "Якщо поля з таблиць «один» і «багато», майстер запропонує **форму з підформою** або **зв’язані форми**.", "Оберіть зовнішній вигляд форми.", "Введіть назву і відкрийте форму для перегляду або змініть її макет."]], ["note", "Якщо при натисканні кнопки «Форма» виділена таблиця `Товари`, пов’язана з `Продажі`, Access може автоматично додати в нижню частину підформу з продажами цього товару."], ["h", "Подання форми"], ["ul", ["**Подання форми** — робота з даними.", "**Подання розмітки** — зміна розмірів і розташування елементів, бачачи реальні дані.", "**Конструктор** — повний контроль над розділами, елементами й властивостями."]]]}, {"n": 21, "title": "Елементи керування та властивості форм", "blocks": [["h", "Елементи керування"], ["p", "**Елемент керування** — об’єкт на формі чи звіті: поле, напис, кнопка тощо. Елементи бувають **приєднані** (пов’язані з полем джерела), **вільні** (не пов’язані з даними, наприклад напис чи лінія) і **обчислювані** (джерелом є вираз, що починається зі знака `=`)."], ["table", ["Елемент", "Призначення"], [["Надпис", "статичний текст: заголовки, підписи полів"], ["Поле (текстове)", "показ і введення значення поля або результату виразу"], ["Поле зі списком", "вибір значення зі списку або введення власного"], ["Список", "вибір лише з наявних варіантів"], ["Прапорець, перемикач", "значення Так/Ні; перемикачі в групі параметрів — вибір одного варіанта"], ["Кнопка", "виконання дії (перехід до запису, відкриття форми, друк)"], ["Підформа/підзвіт", "вбудована форма з пов’язаними записами"], ["Вкладка, лінія, прямокутник, зображення", "оформлення й компонування"]]], ["h", "Аркуш властивостей"], ["p", "Властивості відкривають клавішею `F4` або кнопкою «Аркуш властивостей». Вони згруповані на вкладках «Макет», «Дані», «Подія», «Інше», «Усі». Найважливіші:"], ["ul", ["Для форми: **Джерело записів**, **Подання за замовчуванням**, **Дозволити додавання / редагування / видалення**, **Введення даних** (відкривати лише для нових записів), **Кнопки переходу**.", "Для поля: **Джерело елемента керування**, **Формат**, **Значення за замовчуванням**, **Умова перевірки** і **Текст перевірки**, **Доступ** (Enabled), **Блокування** (Locked).", "Для поля зі списком: **Джерело рядків**, **Кількість стовпців**, **Приєднаний стовпець**, **Ширина стовпців**."]], ["code", "=[Ціна]*[Залишок]\n=IIf([Залишок]<10;\"Потрібно замовити\";\"\")\n=Count(*)"], ["p", "Ці вирази записують у властивість **Джерело елемента керування** вільного поля: перший обчислює вартість залишку, другий показує попередження, третій (у заголовку чи примітці форми) рахує кількість записів."]]}, {"n": 22, "title": "Створення форм за допомогою конструктора форм", "blocks": [["h", "Розділи форми"], ["ul", ["**Заголовок форми** — назва, логотип, кнопки; відображається вгорі.", "**Область даних** — поля записів джерела.", "**Примітка форми** — підсумки, кнопки, пояснення; відображається внизу.", "**Верхній і нижній колонтитули сторінки** — видно лише під час друку."]], ["h", "Послідовність створення форми в конструкторі"], ["ol", ["Вкладка «Створення» → «Конструктор форм».", "У властивості форми **Джерело записів** оберіть таблицю або запит (наприклад, `Товари`).", "Натисніть «Додати наявні поля» і перетягніть поля в область даних — разом з полем створюється напис-підпис.", "Додайте в заголовок форми напис із назвою, у примітку — обчислюване поле `=Count(*)`.", "Для поля `Категорія` замініть текстове поле на **поле зі списком** (контекстне меню → «Змінити на»), джерело рядків — список категорій.", "Вирівняйте елементи (вкладка «Упорядкування»: «Вирівняти», «Розмір/інтервал»).", "Перевірте **послідовність переходу** клавішею `Tab` (команда «Послідовність переходу»)."]], ["h", "Кнопки та підформи"], ["p", "Під час додавання кнопки (за увімкнених майстрів елементів керування) запускається **майстер кнопок**: обирають категорію («Переходи між записами», «Обробка записів», «Робота з формою», «Робота зі звітом») і дію, напр. «Додати новий запис» або «Відкрити звіт»."], ["p", "**Підформа** показує записи з боку «багато». Головна й підпорядкована форми пов’язуються властивостями **Основні поля зв’язку** і **Підпорядковані поля зв’язку** (у прикладі обидві — `КодТовару`). Тоді в підформі видно продажі саме поточного товару."], ["note", "Розміщуйте елементи логічно: поля, які заповнюють першими, — вгорі ліворуч; однакова ширина й вирівнювання підписів значно полегшують роботу з формою."]]}, {"n": 23, "title": "Використання форм для введення й редагування даних", "blocks": [["h", "Навігація записами"], ["p", "Унизу форми розташовано **кнопки переходу**: перший, попередній, наступний, останній запис, новий (порожній) запис і поле з номером поточного запису. Для переходу між полями використовують `Tab` (вперед) і `Shift+Tab` (назад)."], ["h", "Введення та збереження"], ["ul", ["Новий запис додають кнопкою «Новий запис» або комбінацією `Ctrl++`.", "Запис зберігається **автоматично** під час переходу до іншого запису чи закриття форми; примусово — `Shift+Enter`.", "Поки запис редагується, ліворуч на селекторі запису видно значок олівця; `Esc` скасовує незбережені зміни поточного поля, повторне `Esc` — запису.", "Запис видаляють командою «Видалити» → «Видалити запис» (з підтвердженням)."]], ["h", "Контроль правильності даних"], ["table", ["Засіб", "Приклад"], [["Умова перевірки + Текст перевірки", "`>=0` і «Ціна не може бути від’ємною»"], ["Маска вводу", "`00000` — лише п’ять цифр"], ["Значення за замовчуванням", "`=Date()` для поля `Дата`"], ["Поле зі списком з властивістю «Лише зі списку» = Так", "не дозволяє ввести категорію, якої немає у списку"], ["Властивість «Доступ» (Enabled) = Ні або «Блокування» (Locked) = Так", "захист поля від змін"]]], ["h", "Пошук і фільтрація у формі"], ["p", "У формі працюють ті самі засоби, що й у таблиці: пошук (`Ctrl+F`), сортування, **фільтр за виділеним** і **фільтр за формою** (умови вводять у порожній бланк форми). Кнопка «Перемкнути фільтр» вмикає й вимикає застосований фільтр."], ["note", "Щоб форма відкривалася лише для введення нових записів (наприклад, реєстрація продажів), установіть для форми властивість **Введення даних** = Так."]]}, {"n": 24, "title": "Створення форм", "blocks": [["p", "**Практична робота 5.** Мета: створити форми різними способами та налаштувати їх для зручного введення даних у базу «Канцтовари»."], ["ol", ["Інструментом «Форма» створіть форму для таблиці `Товари`; за допомогою «Розділена форма» — ще одну і порівняйте їх.", "Майстром форм створіть форму `Товари_і_продажі` з підформою продажів (поля з обох таблиць).", "У конструкторі додайте заголовок, обчислюване поле `=[Ціна]*[Залишок]` з підписом «Вартість залишку» і кнопки «Попередній запис», «Наступний запис», «Додати запис».", "Для поля `Ціна` задайте умову перевірки `>0` і текст повідомлення; для `Дата` у підформі — значення за замовчуванням `=Date()`.", "Введіть через форму два нові товари і по два продажі для кожного."]], ["ul", ["Критерії: форма відкривається без помилок; підформа показує продажі лише поточного товару; перевірка не дозволяє ввести нульову ціну; елементи вирівняні, порядок переходу `Tab` логічний."]], ["note", "Якщо обчислюване поле показує `#Ім’я?` (або `#Name?`), перевірте написання імен полів у виразі та джерело записів форми."]]}, {"n": 25, "title": "Поняття звіту. Автоматичне створення звіту", "blocks": [["h", "Що таке звіт"], ["p", "**Звіт** — об’єкт бази даних для форматованого виведення даних на екран, друк або у файл (наприклад, PDF). На відміну від форми, звіт **не дозволяє змінювати дані**, зате вміє групувати записи, обчислювати проміжні й загальні підсумки та гарно розміщувати інформацію на сторінках."], ["table", ["Ознака", "Форма", "Звіт"], [["Основне призначення", "введення і редагування", "перегляд і друк"], ["Змінення даних", "так", "ні"], ["Групування з підсумками", "обмежено", "так, багаторівневе"], ["Розбиття на сторінки", "не основне", "так, з колонтитулами"]]], ["h", "Інструменти групи «Звіти» (вкладка «Створення»)"], ["ul", ["**Звіт** — одним натисканням створює табличний звіт з усіма полями виділеної таблиці чи запиту.", "**Майстер звітів** — вибір полів, рівнів групування, порядку сортування, підсумків (кнопка «Параметри підсумків»: Sum, Avg, Min, Max), макета й орієнтації сторінки.", "**Наклейки** — друк етикеток (адрес, цінників) на стандартних аркушах.", "**Пустий звіт** і **Конструктор звітів** — створення вручну."]], ["h", "Подання звіту"], ["ul", ["**Подання звіту** — перегляд на екрані, можна фільтрувати й копіювати дані.", "**Попередній перегляд** — вигляд надрукованих сторінок, експорт у PDF, Excel тощо.", "**Подання розмітки** і **Конструктор** — зміна макета."]], ["note", "Звіт про продажі зручно будувати не на таблиці, а на **запиті** з обчислюваним полем `Сума`: тоді підсумки у звіті рахуються від готових значень."]]}, {"n": 26, "title": "Створення звіту за допомогою конструктора звітів", "blocks": [["h", "Розділи звіту"], ["table", ["Розділ", "Де друкується", "Типовий вміст"], [["Заголовок звіту", "один раз на початку", "назва, дата `=Date()`"], ["Верхній колонтитул", "вгорі кожної сторінки", "підписи стовпців"], ["Заголовок групи", "перед кожною групою", "значення поля групування"], ["Область даних", "для кожного запису", "поля записів"], ["Примітка групи", "після кожної групи", "проміжні підсумки `=Sum([Сума])`"], ["Нижній колонтитул", "внизу кожної сторінки", "номер сторінки"], ["Примітка звіту", "один раз у кінці", "загальні підсумки"]]], ["h", "Групування і сортування"], ["p", "Команда **«Групування й сортування»** відкриває область, де додають рівні групування («Додати групу») і сортування. Для групи можна увімкнути заголовок і примітку, обрати підсумки та спосіб розбиття на сторінки (не розривати групу)."], ["h", "Обчислення у звіті"], ["code", "=Sum([Сума])\n=Count([КодПродажу])\n=\"Сторінка \" & [Page] & \" з \" & [Pages]\n=Format(Date();\"dd.mm.yyyy\")"], ["p", "Функція `Sum` у примітці групи рахує суму для групи, а в примітці звіту — для всього звіту. Властивість поля **Сума з накопиченням** («У межах групи» або «Для всього») дає наростаючий підсумок, наприклад порядкову нумерацію записів, якщо джерело елемента — `=1`."], ["ol", ["«Створення» → «Конструктор звітів», джерело записів — запит `Продажі_суми`.", "Додайте групування за полем `Категорія` із заголовком і приміткою групи.", "Перенесіть поле `Категорія` в заголовок групи, а `Дата`, `Назва`, `Кількість`, `Сума` — в область даних; підписи — у верхній колонтитул.", "У примітку групи додайте `=Sum([Сума])`, у примітку звіту — загальну суму.", "У нижній колонтитул додайте номер сторінки, перегляньте звіт у режимі попереднього перегляду."]]]}, {"n": 27, "title": "Створення звітів", "blocks": [["p", "**Практична робота 6.** Мета: створити звіти автоматично, майстром і в конструкторі, із групуванням та підсумками."], ["ol", ["Інструментом «Звіт» створіть звіт `Товари` і в поданні розмітки змініть ширину стовпців.", "Майстром звітів створіть звіт `Продажі_за_продавцями`: групування за `Продавець`, сортування за `Дата`, підсумок `Sum` для `Сума`.", "У конструкторі доповніть звіт: заголовок із поточною датою, номер сторінки «Сторінка N з M», порядкова нумерація записів у групі.", "Створіть наклейки-цінники для таблиці `Товари` (назва і ціна).", "Збережіть один звіт у форматі PDF."]], ["ul", ["Критерії: підсумки груп і загальний підсумок обчислено правильно (перевірте вручну одну групу); група не розривається між сторінками; оформлення охайне."]], ["note", "Якщо звіт не вміщується за шириною, Access може створювати порожні сторінки: зменште ширину звіту в конструкторі або оберіть альбомну орієнтацію."], ["p", "Урок завершується **тематичною атестацією** з тем «Форми» та «Звіти»."]]}], "practice": [{"task": "Який вираз треба записати у властивість «Джерело елемента керування» вільного поля в примітці форми, щоб показати середню ціну товарів?", "answer": "=Avg([Ціна])", "code": true}, {"task": "Як налаштувати поле зі списком `КодТовару` у формі продажів, щоб користувач бачив назви товарів, а в таблицю записувався код?", "answer": "Джер
