инки. Знайдіть мінімальну вартість підйому на вершину (за останню сходинку).", "Порахуйте кількість способів скласти 50 копійок монетами 1, 2, 5, 10, 25, 50 коп.", "Черепашка рухається праворуч або вниз таблицею 4×4, заповненою випадковими числами від 1 до 9 (модуль `random`). Знайдіть шлях з **мінімальною** сумою і виведіть його.", "Реалізуйте 0-1 рюкзак із відновленням набору предметів і перевірте на власних даних.", "Для набору номіналів {1, 7, 10} знайдіть найменшу суму, для якої жадібна видача решти не оптимальна."]], ["table", ["Критерій", "Бали"], [["Правильно визначено стан і рекурентне співвідношення (записано в коментарі)", "4"], ["Програма працює правильно на прикладах", "5"], ["Відновлено сам розв’язок, а не лише значення", "2"], ["Код охайний: змістовні імена, функції", "1"]]], ["note", "Поради: спочатку розв’яжіть задачу вручну для малих даних і заповніть таблицю на папері; перевіряйте межі масивів (`n + 1` елементів); для перевірки порівнюйте результат ДП з повним перебором на малих вхідних даних."]]}], "practice": [{"task": "Сходи з ціною. На сходинці `i` (нумерація з 0) треба сплатити `cost[i]`. Стартувати можна зі сходинки 0 або 1, стрибати — на 1 або 2 сходинки. Вершина розташована одразу після останньої сходинки. Напишіть функцію, що повертає мінімальну вартість підйому. Перевірте на `[10, 15, 20]` (відповідь 15) і `[1, 100, 1, 1, 1, 100, 1, 1, 100, 1]` (відповідь 6).", "answer": "def min_cost(cost):\n    n = len(cost)\n    dp = [0] * (n + 1)          # dp[i] — мінімальна вартість, щоб стати на позицію i\n    for i in range(2, n + 1):\n        dp[i] = min(dp[i - 1] + cost[i - 1], dp[i - 2] + cost[i - 2])\n    return dp[n]\n\nprint(min_cost([10, 15, 20]))\nprint(min_cost([1, 100, 1, 1, 1, 100, 1, 1, 100, 1]))\n# Вивід:\n# 15\n# 6", "code": true}, {"task": "Скільки існує способів скласти 50 копійок монетами 1, 2, 5, 10, 25 і 50 копійок (порядок монет не важливий)? Напишіть програму.", "answer": "def count_change(amount, coins):\n    ways = [1] + [0] * amount\n    for c in coins:\n        for s in range(c, amount + 1):\n            ways[s] += ways[s - c]\n    return ways[amount]\n\nprint(count_change(50, [1, 2, 5, 10, 25, 50]))\n# Вивід:\n# 407", "code": true}, {"task": "Для номіналів {1, 7, 10} знайдіть найменшу суму, для якої жадібна видача решти дає не мінімальну кількість монет. Поясніть на прикладі.", "answer": "Найменша така сума — **14**. Жадібний алгоритм бере 10 + 1 + 1 + 1 + 1 (5 монет), а оптимально 7 + 7 (2 монети). Для сум 1–13 жадібний результат збігається з оптимальним, що можна перевірити програмою `counterexample([1, 7, 10])` з уроку 92.", "code": false}, {"task": "Напишіть функцію, що повертає довжину найбільшої спільної підпослідовності двох рядків, зберігаючи лише два рядки таблиці (пам’ять `O(m)`). Перевірте на рядках `ДИНАМІКА` і `МЕХАНІКА`.", "answer": "def lcs_len(a, b):\n    prev = [0] * (len(b) + 1)\n    for ch in a:\n        cur = [0] * (len(b) + 1)\n        for j in range(1, len(b) + 1):\n            if ch == b[j - 1]:\n                cur[j] = prev[j - 1] + 1\n            else:\n                cur[j] = max(prev[j], cur[j - 1])\n        prev = cur\n    return prev[-1]\n\nprint(lcs_len(\"ДИНАМІКА\", \"МЕХАНІКА\"))\n# Вивід:\n# 4", "code": true}, {"task": "Чому жадібний алгоритм за питомою цінністю дає оптимум для дробового рюкзака, але не для рюкзака 0-1? Наведіть приклад.", "answer": "У дробовому рюкзаку завжди вигідно заповнити місце найціннішим за одиницю ваги матеріалом: якщо в розв’язку є менш цінний матеріал, а частина ціннішого не взята, їх обмін збільшує цінність. У рюкзаку 0-1 предмет не можна поділити, тому після жадібного вибору може залишитися невикористане місце. Приклад: предмети (вага 10, цінність 60), (20, 100), (30, 120), місткість 50. Жадібний алгоритм бере перші два (160), третій уже не вміщується; оптимум — другий і третій (220).", "code": false}], "quiz": [{"q": "Які дві властивості задачі вказують на доцільність динамічного програмування?", "o": ["Лінійність і детермінованість", "Оптимальна підструктура і перекриття підзадач", "Відсортованість і унікальність даних", "Наявність циклів і рекурсії"], "a": 1, "why": "Оптимальний розв’язок складається з оптимальних розв’язків підзадач, а самі підзадачі повторюються."}, {"q": "Яка складність алгоритму ДП для рюкзака 0-1 з `n` предметами і місткістю `W`?", "o": ["`O(n)`", "`O(n log n)`", "`O(2^n)` завжди", "`O(n·W)`"], "a": 3, "why": "Таблиця має `(n+1)·(W+1)` клітинок, кожна обчислюється за сталий час."}, {"q": "За яким параметром жадібний алгоритм у задачі про заявки впорядковує заявки?", "o": ["За часом закінчення", "За часом початку", "За тривалістю", "За кількістю перетинів з іншими"], "a": 0, "why": "Заявка, що закінчується найраніше, залишає найбільше часу для решти."}, {"q": "Скільки монет видасть жадібний алгоритм для суми 6 і номіналів {1, 3, 4}?", "o": ["2", "1", "3", "4"], "a": 2, "why": "4 + 1 + 1 — три монети, хоча оптимально 3 + 3."}, {"q": "Яка довжина найбільшої спільної підпослідовності рядків `ABCBDAB` і `BDCABA`?", "o": ["2", "3", "4", "5"], "a": 2, "why": "Наприклад, `BCBA` — довжина 4."}, {"q": "Що таке мемоізація?", "o": ["Рекурсивне обчислення згори донизу із запам’ятовуванням уже знайдених результатів", "Заповнення таблиці циклом від менших підзадач", "Сортування даних перед обробкою", "Видалення непотрібних елементів таблиці"], "a": 0, "why": "Табуляція — це підхід знизу догори, а мемоізація — рекурсія з кешем."}, {"q": "Коник стрибає на 1 або 2 сходинки. Скільки способів дістатися зі сходинки 0 на сходинку 4?", "o": ["3", "4", "8", "5"], "a": 3, "why": "`dp`: 1, 1, 2, 3, 5 — числа Фібоначчі."}, {"q": "Скільки різних шляхів у черепашки в таблиці 3×3 з лівого верхнього в правий нижній кут (рух лише праворуч або вниз)?", "o": ["4", "6", "9", "8"], "a": 1, "why": "`C(4, 2) = 6`: потрібно 2 кроки праворуч і 2 вниз у будь-якому порядку."}, {"q": "Навіщо в одновимірній версії рюкзака 0-1 місткість перебирають у зворотному порядку?", "o": ["Так програма працює швидше", "Щоб кожен предмет узяти не більше одного разу", "Щоб уникнути від’ємних індексів", "Щоб відсортувати предмети за вагою"], "a": 1, "why": "У прямому порядку оновлене значення використовувалося б повторно, і предмет брався б кілька разів."}, {"q": "Для якої задачі жадібний алгоритм гарантовано дає оптимальну відповідь?", "o": ["Рюкзак 0-1", "Найбільша спільна підпослідовність", "Видача решти для будь-якого набору номіналів", "Дробовий рюкзак"], "a": 3, "why": "Предмети можна ділити, тому вигідно брати найцінніші за одиницю ваги."}]}, {"id": "s25", "topic": 2, "code": "2.5", "title": "Основи обчислювальної геометрії", "lessons": [{"n": 94, "title": "Базові поняття обчислювальної геометрії", "blocks": [["p", "**Обчислювальна геометрія** — розділ інформатики, що вивчає алгоритми розв’язування геометричних задач: визначення взаємного розташування фігур, обчислення площ, пошук перетинів, побудову опуклих оболонок. Такі алгоритми застосовують у комп’ютерній графіці, іграх (виявлення зіткнень), геоінформаційних системах, робототехніці, системах автоматизованого проєктування."], ["h", "Основні об’єкти та їх подання"], ["table", ["Об’єкт", "Як задати", "Подання в Python"], [["Точка", "Координати `(x, y)`", "кортеж `(x, y)`"], ["Вектор", "Координати `(x, y)` — зміщення від початку до кінця", "кортеж `(x, y)`"], ["Відрізок", "Два кінці `A`, `B`", "пара точок `(A, B)`"], ["Пряма", "Дві точки або рівняння `a·x + b·y + c = 0`", "трійка `(a, b, c)`"], ["Многокутник", "Список вершин у порядку обходу", "список точок"]]], ["ul", ["**Простий многокутник** — сторони не перетинаються, крім сусідніх у спільних вершинах.", "**Опуклий многокутник** — відрізок між будь-якими двома його точками повністю лежить усередині; усі внутрішні кути менші за 180°.", "Обхід вершин буває **проти годинникової стрілки** (додатний) або **за годинниковою стрілкою** (від’ємний)."]], ["h", "Відстань і рівняння прямої"], ["p", "Відстань між точками: `√((x2-x1)² + (y2-y1)²)`. Пряма через точки `P(x1, y1)` і `Q(x2, y2)` має коефіцієнти `a = y1 - y2`, `b = x2 - x1`, `c = x1·y2 - x2·y1`. Відстань від точки до прямої: `|a·x + b·y + c| / √(a² + b²)`."], ["code", "import math\n\ndef line_through(p, q):\n    a = p[1] - q[1]\n    b = q[0] - p[0]\n    c = p[0] * q[1] - q[0] * p[1]\n    return a, b, c\n\ndef dist_to_line(p, a, b, c):\n    return abs(a * p[0] + b * p[1] + c) / math.hypot(a, b)\n\nA, B = (1, 2), (4, 6)\nprint(math.dist(A, B))\na, b, c = line_through(A, B)\nprint(a, b, c)\nprint(dist_to_line((0, 0), a, b, c))\n# Вивід:\n# 5.0\n# -4 3 -2\n# 0.4"], ["h", "Точність обчислень"], ["code", "EPS = 1e-9\nx = 0.1 + 0.2\nprint(x == 0.3)\nprint(abs(x - 0.3) < EPS)\n# Вивід:\n# False\n# True"], ["note", "Дійсні числа (`float`) зберігаються наближено, тому їх не можна порівнювати через `==`. Використовуйте похибку `EPS` або, якщо координати цілі, будуйте алгоритми лише на цілочисельних операціях (додавання, множення) — тоді результат точний."]]}, {"n": 95, "title": "Операції над векторами. Векторний добуток", "blocks": [["p", "Вектор `AB` з початком `A(x1, y1)` і кінцем `B(x2, y2)` має координати `(x2 - x1, y2 - y1)`. Вектори додають і віднімають покоординатно, множать на число — множенням кожної координати. Довжина вектора `a = (x, y)` дорівнює `√(x² + y²)`."], ["table", ["Операція", "Формула", "Результат"], [["Сума", "`(x1 + x2, y1 + y2)`", "вектор"], ["Множення на число", "`(k·x, k·y)`", "вектор"], ["Скалярний добуток", "`x1·x2 + y1·y2 = |a|·|b|·cos φ`", "число"], ["Векторний (косий) добуток", "`x1·y2 - y1·x2 = |a|·|b|·sin φ`", "число"]]], ["h", "Скалярний добуток"], ["ul", ["`dot(a, b) > 0` — кут між векторами гострий;", "`dot(a, b) = 0` — вектори перпендикулярні;", "`dot(a, b) < 0` — кут тупий."]], ["h", "Векторний добуток на площині"], ["p", "У тривимірному просторі векторний добуток — це вектор. Для векторів на площині використовують лише його третю координату `x1·y2 - y1·x2`, тому її часто називають **косим** або **псевдоскалярним** добутком. Модуль цього числа дорівнює **площі паралелограма**, побудованого на векторах, а знак показує напрям: додатний — поворот від `a` до `b` проти годинникової стрілки, від’ємний — за годинниковою, нуль — вектори колінеарні."], ["code", "import math\n\ndef vec(p, q):\n    return (q[0] - p[0], q[1] - p[1])\n\ndef add(a, b):\n    return (a[0] + b[0], a[1] + b[1])\n\ndef dot(a, b):\n    return a[0] * b[0] + a[1] * b[1]\n\ndef cross(a, b):\n    return a[0] * b[1] - a[1] * b[0]\n\na = (3, 0)\nb = (1, 2)\nprint(add(a, b), dot(a, b), cross(a, b), cross(b, a))\nprint(math.hypot(*b))\nprint(vec((2, 5), (7, 1)))\nangle = math.degrees(math.atan2(cross(a, b), dot(a, b)))\nprint(round(angle, 2))\n# Вивід:\n# (4, 2) 3 6 -6\n# 2.23606797749979\n# (5, -4)\n# 63.43"], ["p", "Функція `math.atan2(cross, dot)` повертає орієнтований кут від `a` до `b` (від −180° до 180°) і працює стабільніше, ніж обчислення через `acos`. Площа трикутника, побудованого на векторах `a` і `b`, дорівнює `|cross(a, b)| / 2` — у прикладі 3."], ["note", "Векторний добуток антикомутативний: `cross(a, b) = -cross(b, a)`. Саме ця операція є основою майже всіх алгоритмів наступних уроків."]]}, {"n": 96, "title": "Напрям повороту при переміщенні", "blocks": [["h", "Тест орієнтації"], ["p", "Нехай об’єкт рухається з точки `A` у точку `B`, а потім у `C`. Куди він повертає в точці `B`? Обчислимо векторний добуток векторів `AB` і `AC`: `orient(A, B, C) = (Bx-Ax)·(Cy-Ay) - (By-Ay)·(Cx-Ax)`."], ["table", ["Знак orient(A, B, C)", "Напрям повороту", "Обхід трикутника ABC"], [["`> 0`", "ліворуч", "проти годинникової стрілки"], ["`< 0`", "праворуч", "за годинниковою стрілкою"], ["`= 0`", "точки на одній прямій", "трикутник вироджений"]]], ["code", "def orient(a, b, c):\n    return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])\n\ndef turn(a, b, c):\n    o = orient(a, b, c)\n    if o > 0:\n        return 'ліворуч'\n    if o < 0:\n        return 'праворуч'\n    return 'на одній прямій'\n\nroute = [(0, 0), (4, 0), (4, 3), (6, 5), (8, 7), (5, 9)]\nfor i in range(1, len(route) - 1):\n    print(route[i], turn(route[i - 1], route[i], route[i + 1]))\n# Вивід:\n# (4, 0) ліворуч\n# (4, 3) праворуч\n# (6, 5) на одній прямій\n# (8, 7) ліворуч"], ["p", "Якщо `orient = 0`, об’єкт або продовжує рух прямо, або розвертається назад. Розрізнити ці випадки допомагає скалярний добуток векторів `AB` і `BC`: якщо він додатний — рух прямо, якщо від’ємний — розворот."], ["h", "Чи лежить точка на відрізку"], ["code", "def orient(a, b, c):\n    return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])\n\ndef on_segment(p, a, b):\n    return (orient(a, b, p) == 0\n            and min(a[0], b[0]) <= p[0] <= max(a[0], b[0])\n            and min(a[1], b[1]) <= p[1] <= max(a[1], b[1]))\n\nprint(on_segment((2, 2), (0, 0), (4, 4)))\nprint(on_segment((5, 5), (0, 0), (4, 4)))\nprint(on_segment((2, 3), (0, 0), (4, 4)))\n# Вивід:\n# True\n# False\n# False"], ["note", "Для цілих координат функція `orient` обчислюється точно, без похибок. Тест орієнтації — базова «цеглинка» для перевірки перетину відрізків, опуклості многокутника і побудови опуклої оболонки."]]}, {"n": 97, "title": "Обчислення площі многокутника", "blocks": [["p", "Площу простого многокутника з вершинами `(x1, y1), …, (xn, yn)`, заданими в порядку обходу, обчислюють так: `S = |Σ (xi·y(i+1) - x(i+1)·yi)| / 2`, де після останньої вершини береться перша. Назва «шнурування» походить від того, як перехресно перемножують координати, якщо записати їх стовпчиком. Кожен доданок — це векторний добуток радіус-векторів двох сусідніх вершин, тобто подвоєна орієнтована площа трикутника з вершиною в початку координат. Додавши їх, отримуємо подвоєну площу многокутника зі знаком: **додатну** для обходу проти годинникової стрілки, **від’ємну** — за годинниковою."], ["code", "def area2(poly):\n    s = 0\n    n = len(poly)\n    for i in range(n):\n        x1, y1 = poly[i]\n        x2, y2 = poly[(i + 1) % n]\n        s += x1 * y2 - x2 * y1\n    return s                      # подвоєна орієнтована площа\n\npoly = [(1, 1), (5, 1), (6, 4), (3, 6), (0, 4)]\ns2 = area2(poly)\nprint(s2, abs(s2) / 2)\nprint(area2(poly[::-1]))          # обхід у зворотному напрямку\n# Вивід:\n# 42 21.0\n# -42"], ["table", ["i", "Вершина", "Наступна", "xi·y(i+1) - x(i+1)·yi"], [["1", "(1, 1)", "(5, 1)", "1·1 - 5·1 = -4"], ["2", "(5, 1)", "(6, 4)", "5·4 - 6·1 = 14"], ["3", "(6, 4)", "(3, 6)", "6·6 - 3·4 = 24"], ["4", "(3, 6)", "(0, 4)", "3·4 - 0·6 = 12"], ["5", "(0, 4)", "(1, 1)", "0·1 - 1·4 = -4"]]], ["p", "Сума доданків: −4 + 14 + 24 + 12 − 4 = 42, отже площа дорівнює 42 / 2 = 21. Сума додатна — вершини задано проти годинникової стрілки."], ["h", "Формула Піка"], ["p", "Для многокутника з вершинами в цілих точках справджується **формула Піка**: `S = I + B/2 - 1`, де `I` — кількість цілих точок усередині, `B` — на межі. Кількість цілих точок на відрізку між вершинами (без одного кінця) дорівнює `НСД(|dx|, |dy|)`."], ["code", "from math import gcd\n\ndef area2(poly):\n    n = len(poly)\n    return sum(poly[i][0] * poly[(i + 1) % n][1] - poly[(i + 1) % n][0] * poly[i][1]\n               for i in range(n))\n\ndef boundary(poly):\n    n = len(poly)\n    return sum(gcd(abs(poly[i][0] - poly[(i + 1) % n][0]),\n                   abs(poly[i][1] - poly[(i + 1) % n][1])) for i in range(n))\n\npoly = [(1, 1), (5, 1), (6, 4), (3, 6), (0, 4)]\nS2 = abs(area2(poly))\nB = boundary(poly)\nI = (S2 - B + 2) // 2             # з формули Піка: 2S = 2I + B - 2\nprint(B, I)\n# Вивід:\n# 8 18"], ["note", "Формула шнурування працює лише для **простих** (несамоперетинних) многокутників. Для цілих координат подвоєна площа — ціле число, тому зручно працювати саме з нею і ділити на 2 лише наприкінці."]]}, {"n": 98, "title": "Перетин відрізків", "blocks": [["h", "Умова перетину"], ["p", "Відрізки `P1P2` і `P3P4` перетинаються в загальному випадку тоді, коли кінці кожного відрізка лежать **по різні боки** від прямої, що містить інший відрізок. Це перевіряють чотирма тестами орієнтації: знаки `orient(P3, P4, P1)` і `orient(P3, P4, P2)` протилежні, і знаки `orient(P1, P2, P3)` і `orient(P1, P2, P4)` теж протилежні. Окремо розглядають **особливі випадки**: якщо якась орієнтація дорівнює нулю, точка лежить на прямій іншого відрізка, і треба перевірити, чи вона належить самому відрізку (дотик кінцем або накладання колінеарних відрізків)."], ["code", "def orient(a, b, c):\n    return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])\n\ndef on_segment(p, a, b):\n    return (min(a[0], b[0]) <= p[0] <= max(a[0], b[0])\n            and min(a[1], b[1]) <= p[1] <= max(a[1], b[1]))\n\ndef segments_intersect(p1, p2, p3, p4):\n    d1 = orient(p3, p4, p1)\n    d2 = orient(p3, p4, p2)\n    d3 = orient(p1, p2, p3)\n    d4 = orient(p1, p2, p4)\n    if ((d1 > 0 > d2) or (d1 < 0 < d2)) and ((d3 > 0 > d4) or (d3 < 0 < d4)):\n        return True\n    if d1 == 0 and on_segment(p1, p3, p4): return True\n    if d2 == 0 and on_segment(p2, p3, p4): return True\n    if d3 == 0 and on_segment(p3, p1, p2): return True\n    if d4 == 0 and on_segment(p4, p1, p2): return True\n    return False\n\nprint(segments_intersect((0, 0), (4, 4), (0, 4), (4, 0)))   # хрест\nprint(segments_intersect((0, 0), (2, 2), (3, 3), (5, 5)))   # на одній прямій, не торкаються\nprint(segments_intersect((0, 0), (2, 2), (2, 2), (5, 0)))   # спільний кінець\nprint(segments_intersect((0, 0), (4, 0), (1, 1), (3, 2)))   # не перетинаються\n# Вивід:\n# True\n# False\n# True\n# False"], ["h", "Точка перетину"], ["p", "Запишемо відрізки параметрично: `P1 + t·r`, де `r = P2 - P1`, і `P3 + u·s`, де `s = P4 - P3`. Розв’язавши систему, отримуємо `t = cross(P3 - P1, s) / cross(r, s)` і `u = cross(P3 - P1, r) / cross(r, s)`. Відрізки перетинаються в одній точці, якщо `cross(r, s) ≠ 0` і обидва параметри лежать у межах від 0 до 1."], ["code", "from fractions import Fraction\n\ndef cross(a, b):\n    return a[0] * b[1] - a[1] * b[0]\n\ndef intersection_point(p1, p2, p3, p4):\n    r = (p2[0] - p1[0], p2[1] - p1[1])\n    s = (p4[0] - p3[0], p4[1] - p3[1])\n    qp = (p3[0] - p1[0], p3[1] - p1[1])\n    den = cross(r, s)\n    if den == 0:\n        return None                       # паралельні або на одній прямій\n    t = Fraction(cross(qp, s), den)\n    u = Fraction(cross(qp, r), den)\n    if 0 <= t <= 1 and 0 <= u <= 1:\n        return (p1[0] + t * r[0], p1[1] + t * r[1])\n    return None\n\npt = intersection_point((0, 0), (4, 2), (0, 3), (3, 0))\nprint(pt, float(pt[0]), float(pt[1]))\nprint(intersection_point((0, 0), (1, 1), (2, 0), (3, 1)))\n# Вивід:\n# (Fraction(2, 1), Fraction(1, 1)) 2.0 1.0\n# None"], ["note", "Клас `Fraction` з модуля `fractions` виконує обчислення з раціональними числами точно, без похибок округлення. Це зручно, коли вхідні координати цілі, а точка перетину — дробова."]]}, {"n": 99, "title": "Визначення положення точки відносно багатокутника", "blocks": [["h", "Метод променя"], ["p", "Щоб з’ясувати, чи лежить точка всередині многокутника, з неї проводять промінь (наприклад, горизонтально праворуч) і рахують, скільки сторін він перетинає. **Непарна** кількість перетинів — точка всередині, **парна** — зовні. Метод працює для будь-якого простого многокутника, зокрема неопуклого."], ["ul", ["Спочатку перевіряємо, чи не лежить точка на стороні — тоді відповідь «на межі».", "Сторона перетинає промінь, якщо її кінці лежать по різні боки від горизонталі `y = y0`. Умова `(a.y > y0) != (b.y > y0)` правильно враховує випадок, коли промінь проходить через вершину: кожна вершина рахується лише для однієї з двох сусідніх сторін.", "Знаходимо абсцису точки перетину і враховуємо її, лише якщо вона праворуч від точки."]], ["code", "def orient(a, b, c):\n    return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])\n\ndef locate(pt, poly):\n    x, y = pt\n    inside = False\n    n = len(poly)\n    for i in range(n):\n        a, b = poly[i], poly[(i + 1) % n]\n        if (orient(a, b, pt) == 0 and min(a[0], b[0]) <= x <= max(a[0], b[0])\n                and min(a[1], b[1]) <= y <= max(a[1], b[1])):\n            return 'на межі'\n        if (a[1] > y) != (b[1] > y):\n            xc = a[0] + (y - a[1]) * (b[0] - a[0]) / (b[1] - a[1])\n            if xc > x:\n                inside = not inside\n    return 'всередині' if inside else 'зовні'\n\npoly = [(0, 0), (6, 0), (6, 6), (3, 3), (0, 6)]   # неопуклий п’ятикутник\nfor p in [(1, 1), (3, 5), (3, 3), (6, 2), (1, 4), (7, 1)]:\n    print(p, locate(p, poly))\n# Вивід:\n# (1, 1) всередині\n# (3, 5) зовні\n# (3, 3) на межі\n# (6, 2) на межі\n# (1, 4) всередині\n# (7, 1) зовні"], ["h", "Опуклий многокутник"], ["p", "Для опуклого многокутника є простіший тест: точка всередині, якщо вона лежить по **один бік** від усіх сторін, тобто всі значення `orient(вершина_i, вершина_(i+1), точка)` мають однаковий знак. Так само перевіряють, чи опуклий сам многокутник: усі повороти на вершинах мають бути в один бік."], ["code", "def orient(a, b, c):\n    return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])\n\ndef inside_convex(pt, poly):\n    n = len(poly)\n    signs = [orient(poly[i], poly[(i + 1) % n], pt) for i in range(n)]\n    return all(s > 0 for s in signs) or all(s < 0 for s in signs)\n\nsquare = [(0, 0), (4, 0), (4, 4), (0, 4)]\nprint(inside_convex((2, 1), square), inside_convex((5, 1), square), inside_convex((4, 2), square))\n# Вивід:\n# True False False"], ["note", "Метод променя має складність `O(n)` на одну точку. Ще один відомий метод — **число обертів** (winding number): сумарний кут, на який повертається вектор від точки до вершин під час обходу многокутника; для внутрішньої точки він становить 360°."]]}, {"n": 100, "title": "Побудова опуклої оболонки", "blocks": [["h", "Поняття"], ["p", "**Опукла оболонка** множини точок — найменший опуклий многокутник, що містить усі ці точки. Наочно: якщо в точки вбити цвяхи й натягнути навколо гумку, вона прийме форму опуклої оболонки. Задачу застосовують для виявлення зіткнень, розпізнавання образів, пошуку найвіддаленіших точок."], ["table", ["Алгоритм", "Ідея", "Складність"], [["Джарвіса («загортання подарунка»)", "Від крайньої точки щоразу шукаємо точку, відносно якої всі інші лежать з одного боку", "`O(n·h)`, `h` — кількість вершин оболонки"], ["Грехема", "Сортування точок за полярним кутом і обхід зі стеком", "`O(n log n)`"], ["Ендрю (монотонний ланцюг)", "Сортування за координатами, окремо нижня і верхня частини", "`O(n log n)`"]]], ["h", "Алгоритм Ендрю"], ["ol", ["Відсортувати точки за `x`, а за рівних `x` — за `y`.", "Будувати **нижню** частину: проходячи точки зліва направо, додавати точку в стек; поки останні дві точки стека і нова не утворюють поворот ліворуч, видаляти верхню точку стека.", "Так само побудувати **верхню** частину, проходячи точки справа наліво.", "Об’єднати частини, не повторюючи крайні точки."]], ["code", "def orient(a, b, c):\n    return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])\n\ndef convex_hull(points):\n    pts = sorted(set(points))\n    if len(pts) <= 2:\n        return pts\n    def chain(seq):\n        h = []\n        for p in seq:\n            while len(h) >= 2 and orient(h[-2], h[-1], p) <= 0:\n                h.pop()\n            h.append(p)\n        return h\n    lower = chain(pts)\n    upper = chain(reversed(pts))\n    return lower[:-1] + upper[:-1]\n\npoints = [(0, 0), (2, 1), (4, 0), (3, 2), (4, 4), (1, 3), (0, 4), (2, 2), (2, 4)]\nhull = convex_hull(points)\nprint(hull)\n# Вивід:\n# [(0, 0), (4, 0), (4, 4), (0, 4)]"], ["p", "Оболонку отримуємо в порядку обходу проти годинникової стрілки, починаючи з найлівішої нижньої точки. Умова `<= 0` відкидає точки, що лежать на сторонах оболонки, як `(2, 4)`; якщо їх потрібно залишити, використовують `< 0`."], ["note", "Маючи оболонку, легко обчислити її периметр (сума довжин сторін, `math.dist`) і площу (формула шнурування). Найбільша відстань між двома точками множини завжди досягається між вершинами опуклої оболонки."]]}, {"n": 101, "title": "Розв’язування практичних завдань", "blocks": [["p", "**Мета**: закріпити застосування векторного добутку для розв’язування геометричних задач. Урок завершується тематичною атестацією з підрозділу."], ["ol", ["Дано три точки. Визначте, чи утворюють вони трикутник, і якщо так — знайдіть його площу та напрям обходу.", "Дано многокутник списком вершин. Перевірте, чи він опуклий.", "Дано `n` відрізків. Знайдіть кількість пар відрізків, що перетинаються.", "Дано многокутник і кілька точок. Для кожної точки визначте: всередині, зовні чи на межі.", "Дано множину точок. Побудуйте опуклу оболонку, знайдіть її периметр і площу."]], ["table", ["Критерій", "Бали"], [["Використано цілочисельні обчислення там, де можливо", "2"], ["Розглянуто особливі випадки (колінеарні точки, точки на межі)", "3"], ["Програми дають правильні результати на тестах", "5"], ["Код поділено на функції, є коментарі", "2"]]], ["note", "Поради: малюйте приклади на папері в клітинку; для кожної функції складіть кілька тестів, зокрема вироджених (усі точки на одній прямій, спільні кінці відрізків); не порівнюйте дійсні числа через `==`."]]}], "practice": [{"task": "Напишіть функцію, яка за трьома точками з цілими координатами повертає площу трикутника і напрям обходу («проти годинникової», «за годинниковою» або «вироджений»). Перевірте на точках (0, 0), (4, 0), (0, 3) і (1, 1), (2, 2), (5, 5).", "answer": "def triangle(a, b, c):\n    o = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])\n    if o > 0:\n        d = 'проти годинникової'\n    elif o < 0:\n        d = 'за годинниковою'\n    else:\n        d = 'вироджений'\n    return abs(o) / 2, d\n\nprint(triangle((0, 0), (4, 0), (0, 3)))\nprint(triangle((1, 1), (2, 2), (5, 5)))\n# Вивід:\n# (6.0, 'проти годинникової')\n# (0.0, 'вироджений')", "code": true}, {"task": "Напишіть функцію `is_convex(poly)`, що перевіряє, чи є многокутник (вершини задано в порядку обходу) опуклим. Перевірте на квадраті й на многокутнику `[(0, 0), (6, 0), (6, 6), (3, 3), (0, 6)]`.", "answer": "def is_convex(poly):\n    n = len(poly)\n    pos = neg = False\n    for i in range(n):\n        a, b, c = poly[i], poly[(i + 1) % n], poly[(i + 2) % n]\n        o = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])\n        if o > 0:\n            pos = True\n        elif o < 0:\n            neg = True\n    return not (pos and neg)\n\nprint(is_convex([(0, 0), (4, 0), (4, 4), (0, 4)]))\nprint(is_convex([(0, 0), (6, 0), (6, 6), (3, 3), (0, 6)]))\n# Вивід:\n# True\n# False", "code": true}, {"task": "Обчисліть вручну за формулою шнурування площу чотирикутника з вершинами (0, 0), (4, 0), (4, 3), (0, 5). Перевірте відповідь іншим способом.", "answer": "Доданки `xi·y(i+1) - x(i+1)·yi`: 0·0 − 4·0 = 0; 4·3 − 4·0 = 12; 4·5 − 0·3 = 20; 0·0 − 0·5 = 0. Сума 32, площа 32 / 2 = **16**. Перевірка: це прямокутна трапеція з основами 3 і 5 та висотою 4, її площа (3 + 5) / 2 · 4 = 16.", "code": false}, {"task": "Дано список відрізків. Порахуйте кількість пар відрізків, що мають хоча б одну спільну точку. Відрізки: ((0, 0), (4, 4)), ((0, 4), (4, 0)), ((5, 0), (5, 5)), ((4, 4), (6, 4)).", "answer": "def orient(a, b, c):\n    return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])\n\ndef on_seg(p, a, b):\n    return (min(a[0], b[0]) <= p[0] <= max(a[0], b[0])\n            and min(a[1], b[1]) <= p[1] <= max(a[1], b[1]))\n\ndef intersect(p1, p2, p3, p4):\n    d1, d2 = orient(p3, p4, p1), orient(p3, p4, p2)\n    d3, d4 = orient(p1, p2, p3), orient(p1, p2, p4)\n    if d1 * d2 < 0 and d3 * d4 < 0:\n        return True\n    return ((d1 == 0 and on_seg(p1, p3, p4)) or (d2 == 0 and on_seg(p2, p3, p4))\n            or (d3 == 0 and on_seg(p3, p1, p2)) or (d4 == 0 and on_seg(p4, p1, p2)))\n\nsegs = [((0, 0), (4, 4)), ((0, 4), (4, 0)), ((5, 0), (5, 5)), ((4, 4), (6, 4))]\ncount = 0\nfor i in range(len(segs)):\n    for j in range(i + 1, len(segs)):\n        if intersect(*segs[i], *segs[j]):\n            count += 1\nprint(count)\n# Вивід:\n# 3", "code": true}, {"task": "Побудуйте опуклу оболонку точок (1, 1), (2, 5), (3, 3), (5, 3), (3, 0), (0, 3), (4, 4) і обчисліть її периметр (з точністю до сотих) та площу.", "answer": "import math\n\ndef orient(a, b, c):\n    return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])\n\ndef convex_hull(points):\n    pts = sorted(set(points))\n    if len(pts) <= 2:\n        return pts\n    def chain(seq):\n        h = []\n        for p in seq:\n            while len(h) >= 2 and orient(h[-2], h[-1], p) <= 0:\n                h.pop()\n            h.append(p)\n        return h\n    return chain(pts)[:-1] + chain(reversed(pts))[:-1]\n\nhull = convex_hull([(1, 1), (2, 5), (3, 3), (5, 3), (3, 0), (0, 3), (4, 4)])\nn = len(hull)\nperimeter = sum(math.dist(hull[i], hull[(i + 1) % n]) for i in range(n))\narea = abs(sum(hull[i][0] * hull[(i + 1) % n][1] - hull[(i + 1) % n][0] * hull[i][1]\n               for i in range(n))) / 2\nprint(hull)\nprint(round(perimeter, 2), area)\n# Вивід:\n# [(0, 3), (1, 1), (3, 0), (5, 3), (4, 4), (2, 5)]\n# 14.56 14.5", "code": true}], "quiz": [{"q": "Чому дорівнює векторний (косий) добуток векторів `a = (2, 3)` і `b = (4, 1)`?", "o": ["11", "-10", "10", "14"], "a": 1, "why": "`2·1 - 3·4 = -10`."}, {"q": "Якщо `orient(A, B, C) > 0`, то під час руху з A через B до C в точці B відбувається поворот…", "o": ["праворуч", "неможливо визначити", "ліворуч", "назад"], "a": 2, "why": "Додатний векторний добуток означає поворот проти годинникової стрілки, тобто ліворуч."}, {"q": "Яка площа трикутника з вершинами (0, 0), (4, 0), (0, 3)?", "o": ["12", "7", "3,5", "6"], "a": 3, "why": "`|cross((4, 0), (0, 3))| / 2 = 12 / 2 = 6`."}, {"q": "Коли сума у формулі шнурування (до взяття модуля) від’ємна?", "o": ["Вершини задано за годинниковою стрілкою", "Многокутник неопуклий", "Деякі координати від’ємні", "Многокутник має більше ніж 4 вершини"], "a": 0, "why": "Знак суми визначає напрям обходу вершин."}, {"q": "Чому дорівнює скалярний добуток перпендикулярних векторів?", "o": ["1", "Добутку їхніх довжин", "0", "−1"], "a": 2, "why": "`|a|·|b|·cos 90° = 0`."}, {"q": "За методом променя точка лежить усередині многокутника, якщо кількість перетинів променя зі сторонами…", "o": ["парна", "непарна", "дорівнює кількості вершин", "дорівнює нулю"], "a": 1, "why": "Кожен перетин змінює стан «всередині/зовні» на протилежний."}, {"q": "Яка складність алгоритму Ендрю побудови опуклої оболонки для `n` точок?", "o": ["`O(n)`", "`O(n²)`", "`O(n·h)`", "`O(n log n)`"], "a": 3, "why": "Найдовший етап — сортування точок; самі ланцюги будуються за `O(n)`."}, {"q": "Чому в геометричних алгоритмах бажано працювати з цілими координатами?", "o": ["Обчислення та порівняння виконуються точно, без похибок округлення", "Цілі числа займають менше пам’яті, ніж будь-які інші", "Python не підтримує дійсні числа в множенні", "Інакше не працює функція `sorted`"], "a": 0, "why": "Додавання й множення цілих чисел у Python точні, а `float` зберігається наближено."}, {"q": "Коли відрізки перетинаються в загальному (невиродженому) випадку?", "o": ["Коли їхні довжини рівні", "Коли вони паралельні", "Коли кінці кожного відрізка лежать по різні боки від прямої, що містить інший", "Коли в них однакова сума координат кінців"], "a": 2, "why": "Це перевіряють чотирма тестами орієнтації."}, {"q": "Що таке опукла оболонка множини точок?", "o": ["Многокутник з найбільшою кількістю вершин", "Найменший опуклий многокутник, що містить усі точки", "Коло, що проходить через усі точки", "Прямокутник, сторони якого паралельні осям"], "a": 1, "why": "Її можна уявити як гумку, натягнуту навколо цвяхів."}]}, {"id": "t31", "topic": 3, "code": "3.1", "title": "Веб-дизайн і структура сайту", "lessons": [{"n": 102, "title": "Основні тренди у веб-дизайні", "blocks": [["p", "**Веб-дизайн** — це проєктування зовнішнього вигляду та логіки взаємодії вебсайту: композиції сторінок, кольорів, шрифтів, навігації, поведінки елементів. Добрий дизайн не лише «гарний», а насамперед **зручний** (usability) і **доступний** для всіх користувачів."], ["h", "Складники сучасного веб-дизайну"], ["table", ["Поняття", "Що означає"], [["UI (User Interface)", "Інтерфейс: кнопки, меню, форми, кольори, типографіка"], ["UX (User Experience)", "Досвід користувача: наскільки легко й швидко він досягає мети на сайті"], ["Доступність (a11y)", "Можливість користуватися сайтом людям з порушеннями зору, слуху, моторики"], ["Адаптивність", "Коректне відображення на смартфонах, планшетах і моніторах"]]], ["h", "Стійкі тенденції"], ["ul", ["**Mobile first** — макет спершу проєктують для смартфона, а потім розширюють для більших екранів, бо значна частина відвідувачів заходить із мобільних пристроїв.", "**Мінімалізм і «повітря»** — багато вільного простору, мало декоративних елементів, чітка ієрархія заголовків.", "**Виразна типографіка** — великі заголовки, веб-шрифти, змінні (variable) шрифти.", "**Темна тема** — сайт підлаштовується під налаштування системи користувача (медіазапит `prefers-color-scheme`).", "**Мікроанімації** — короткі анімації наведення, натискання, завантаження, що підказують користувачеві, що відбувається.", "**Карткові та модульні макети** — вміст подають блоками-картками, які легко перебудовуються під різну ширину екрана.", "**Швидкість** — оптимізовані зображення, мінімум зайвих скриптів; повільний сайт відштовхує відвідувачів."]], ["h", "Принципи, які не залежать від моди"], ["ol", ["**Контраст** — текст має добре читатися на фоні.", "**Вирівнювання** — елементи розташовують по спільних лініях (сітці).", "**Повторення** — однакові елементи оформлюють однаково (усі кнопки, усі заголовки).", "**Близькість** — пов'язані елементи групують поруч."]], ["code", ":root {\n  --bg: #ffffff;\n  --text: #1d1d1f;\n}\n@media (prefers-color-scheme: dark) {\n  :root {\n    --bg: #121212;\n    --text: #eaeaea;\n  }\n}\nbody {\n  background: var(--bg);\n  color: var(--text);\n}"], ["note", "Тренди змінюються щороку, тому не копіюйте все підряд. Обирайте те, що допомагає саме вашій аудиторії швидко знайти потрібне."]]}, {"n": 103, "title": "Види і типи сайтів. Цільова аудиторія", "blocks": [["h", "Класифікація сайтів за призначенням"], ["table", ["Тип сайту", "Призначення", "Приклад вмісту"], [["Сайт-візитка", "Коротко представити людину чи організацію", "Контакти, послуги, кілька сторінок"], ["Лендинг (landing page)", "Одна сторінка під одну дію (запис, покупка)", "Опис пропозиції, форма заявки"], ["Корпоративний сайт", "Повна інформація про організацію", "Новини, структура, документи"], ["Інтернет-магазин", "Продаж товарів онлайн", "Каталог, кошик, оплата"], ["Інформаційний портал, блог", "Публікація статей і новин", "Рубрики, архів, коментарі"], ["Освітня платформа", "Навчання онлайн", "Курси, тести, особистий кабінет"], ["Портфоліо", "Демонстрація робіт", "Галерея проєктів"], ["Вебзастосунок", "Виконання дій як у програмі", "Пошта, онлайн-редактор"]]], ["h", "Статичні й динамічні сайти"], ["ul", ["**Статичний сайт** — набір готових HTML-файлів; сервер віддає їх без змін. Простий, швидкий, безпечний (наприклад, сайт на GitHub Pages).", "**Динамічний сайт** — сторінки формуються програмою на сервері (PHP, Python тощо) з даних у базі. Дозволяє реєстрацію, пошук, коментарі, але складніший в обслуговуванні."]], ["h", "Цільова аудиторія"], ["p", "**Цільова аудиторія (ЦА)** — група людей, для яких створюється сайт і чиї потреби він має задовольнити. Від ЦА залежать структура, мова, дизайн і функції сайту."], ["ol", ["Визначте **соціально-демографічні** ознаки: вік, місце проживання, рід занять.", "З'ясуйте **потреби й мотиви**: що людина хоче знайти чи зробити на сайті.", "Врахуйте **пристрої та умови**: смартфон чи комп'ютер, швидкість інтернету.", "Складіть **портрет користувача (персону)** — узагальнений опис типового відвідувача."]], ["note", "Приклад персони для сайту ліцею: «Олена, 38 років, мама учня 7 класу. Заходить зі смартфона ввечері. Хоче швидко знайти розклад, контакти класного керівника і умови навчання». Такий портрет одразу підказує, що меню має бути простим, а контакти — на видноті."]]}, {"n": 104, "title": "Запуск проєкту «Розробка власного сайту»", "blocks": [["p", "Створення сайту — це **проєкт**: робота з чіткою метою, обмеженим часом і запланованим результатом. Без плану легко витратити багато часу на дрібниці й не встигнути головне."], ["h", "Етапи життєвого циклу сайту"], ["ol", ["**Аналіз і постановка мети** — для чого сайт, хто ЦА, які конкуренти.", "**Технічне завдання (ТЗ)** — перелік сторінок, функцій, вимог до дизайну.", "**Проєктування** — інформаційна структура, прототипи (вайрфрейми) сторінок.", "**Дизайн** — кольорова схема, шрифти, макети ключових сторінок.", "**Верстка і програмування** — HTML, CSS, JavaScript, за потреби серверна частина або CMS.", "**Наповнення** — тексти, зображення, документи.", "**Тестування** — перевірка в різних браузерах і на різних пристроях, валідація коду.", "**Публікація** — розміщення на хостингу, підключення домену.", "**Підтримка** — оновлення вмісту, резервні копії, аналіз відвідуваності."]], ["h", "Що містить технічне завдання"], ["table", ["Розділ ТЗ", "Приклад для сайту класу"], [["Мета", "Інформувати учнів і батьків про життя класу"], ["Цільова аудиторія", "Учні 11 класу, батьки, вчителі"], ["Сторінки", "Головна, Новини, Розклад, Галерея, Контакти"], ["Функції", "Меню, адаптивність, форма зворотного зв'язку"], ["Технології", "HTML5, CSS3, хостинг статичних сторінок"], ["Терміни", "Прототип — 1 тиждень, верстка — 2 тижні"]]], ["h", "Інструменти планування"], ["ul", ["Канбан-дошка (колонки «Зробити» — «У роботі» — «Готово»).", "Діаграма Ганта для розподілу етапів у часі.", "Спільна папка з матеріалами та система контролю версій (Git)."]], ["note", "Сформулюйте мету сайту одним реченням. Якщо це не вдається — мета ще недостатньо чітка."]]}, {"n": 105, "title": "Інформаційна структура сайту", "blocks": [["p", "**Інформаційна структура (архітектура) сайту** — це спосіб організації сторінок і зв'язків між ними. Вона визначає, як користувач переходить від однієї сторінки до іншої і як швидко знаходить потрібне."], ["h", "Основні види структур"], ["table", ["Структура", "Опис", "Коли застосовують"], [["Лінійна", "Сторінки йдуть одна за одною (Далі → Далі)", "Покрокові інструкції, онлайн-уроки, анкети"], ["Ієрархічна (деревоподібна)", "Головна → розділи → підрозділи", "Більшість сайтів: магазини, портали, сайти шкіл"], ["Мережева (довільна)", "Кожна сторінка може посилатися на будь-яку іншу", "Вікі-енциклопедії, довідники"], ["Комбінована", "Поєднання кількох видів", "Великі сайти"]]], ["h", "Правила побудови структури"], ["ul", ["**Правило трьох кліків** — будь-яка важлива сторінка має бути досяжною за 2–3 переходи від головної (це орієнтир, а не жорсткий закон).", "Назви розділів меню — короткі й зрозумілі ЦА («Контакти», а не «Комунікаційні канали»).", "Головне меню — до 5–7 пунктів.", "**Хлібні крихти** (Головна › Новини › Стаття) показують, де знаходиться користувач.", "Карта сайту (`sitemap.xml`) допомагає пошуковим системам індексувати сторінки."]], ["h", "Структура файлів і адреси"], ["code", "site/\n├── index.html\n├── news/\n│   ├── index.html\n│   └── olimpiada-2026.html\n├── schedule.html\n├── contacts.html\n├── css/\n│   └── style.css\n└── img/\n    └── logo.svg"], ["p", "Папки на диску часто відповідають адресам сторінок: файл `news/index.html` відкривається за адресою `/news/`. Імена файлів записують латиницею, малими літерами, слова розділяють дефісом."], ["note", "Перш ніж верстати, намалюйте структуру сайту у вигляді схеми-дерева: так легше помітити зайві або «загублені» сторінки."]]}, {"n": 106, "title": "Системи керування вмістом", "blocks": [["p", "**Система керування вмістом (CMS, Content Management System)** — програмне забезпечення, яке дозволяє створювати, редагувати й публікувати матеріали сайту через зручну адміністративну панель, без ручного редагування HTML-коду."], ["h", "Як працює CMS"], ["ol", ["Вміст (тексти, зображення, налаштування) зберігається в **базі даних** або у файлах.", "**Шаблон (тема)** визначає зовнішній вигляд сторінок.", "Коли користувач відкриває сторінку, CMS поєднує вміст із шаблоном і формує HTML.", "Редактор змінює вміст через **адмінпанель** у браузері."]], ["h", "Види платформ"], ["table", ["Вид", "Приклади", "Особливості"], [["Відкриті (open source) CMS", "WordPress, Joomla, Drupal", "Безкоштовні, потребують хостингу, багато тем і плагінів"], ["Конструктори сайтів", "Wix, Tilda, Google Sites", "Хостинг уже включено, візуальний редактор, менша гнучкість"], ["Генератори статичних сайтів", "Jekyll, Hugo", "Сторінки збираються з файлів Markdown у готовий HTML"], ["Спеціалізовані", "Moodle (навчання)", "Розраховані на конкретну задачу"]]], ["h", "Переваги й недоліки CMS"], ["ul", ["**Плюси:** швидкий запуск, редагування без знання HTML, розширення плагінами, розподіл ролей між користувачами.", "**Мінуси:** потреба постійно оновлювати ядро і плагіни, вразливості безпеки, надлишковий код, залежність від можливостей платформи."]], ["p", "**Плагін (модуль, розширення)** — додатковий компонент, що додає функцію: форму зворотного зв'язку, галерею, SEO-налаштування тощо. **Тема** змінює оформлення, не торкаючись вмісту."], ["note", "Обирайте CMS під задачу: для сайту-візитки досить конструктора чи статичного сайту, для новинного порталу з багатьма авторами зручніша повноцінна CMS."]]}, {"n": 107, "title": "Адміністрування сайту", "blocks": [["p", "**Адміністрування сайту** — комплекс робіт, що забезпечують його стабільну, безпечну й актуальну роботу після публікації."], ["h", "Хостинг і домен"], ["ul", ["**Хостинг** — послуга розміщення файлів сайту на сервері, підключеному до інтернету цілодобово.", "**Доменне ім'я** — зручна адреса сайту (наприклад, `school.example`), яку система **DNS** перетворює на IP-адресу сервера.", "**SSL/TLS-сертифікат** вмикає захищений протокол **HTTPS**; без нього браузери позначають сайт як незахищений."]], ["h", "Основні завдання адміністратора"], ["table", ["Завдання", "Зміст"], [["Оновлення", "Встановлення нових версій CMS, тем, плагінів"], ["Резервне копіювання", "Регулярні копії файлів і бази даних, перевірка відновлення"], ["Безпека", "Складні паролі, двофакторна автентифікація, мінімум прав"], ["Керування користувачами", "Створення облікових записів і призначення ролей"], ["Моніторинг", "Доступність сайту, швидкість, помилки"], ["Аналітика", "Статистика відвідувань, популярні сторінки, джерела трафіку"], ["Вміст", "Видалення застарілого, перевірка «битих» посилань"]]], ["h", "Ролі користувачів (на прикладі WordPress)"], ["ul", ["**Адміністратор** — повний доступ до налаштувань.", "**Редактор** — публікує й редагує будь-які матеріали.", "**Автор** — публікує лише власні записи.", "**Учасник** — пише записи, але не публікує їх.", "**Підписник** — лише читає та керує своїм профілем."]], ["p", "Файли на сервер передають через файловий менеджер панелі керування хостингом або протоколом **SFTP** (захищений варіант FTP)."], ["note", "Принцип найменших привілеїв: кожен користувач отримує лише ті права, які йому справді потрібні. Учневі-кореспонденту шкільного сайту не потрібна роль адміністратора."]]}, {"n": 108, "title": "Інструменти веб-розробника", "blocks": [["h", "Редактори коду"], ["p", "Для верстки використовують редактори з підсвічуванням синтаксису, автодоповненням і перевіркою помилок: **Visual Studio Code**, **Sublime Text**, **Notepad++**. Корисні розширення: Live Server (автоматичне оновлення сторінки), Prettier (форматування коду), Emmet (швидке введення розмітки, вбудований у VS Code)."], ["code", "ul>li*3>a\n\n<!-- Emmet розгорне скорочення вище в: -->\n<ul>\n  <li><a href=\"\"><\/a><\/li>\n  <li><a href=\"\"><\/a><\/li>\n  <li><a href=\"\"><\/a><\/li>\n<\/ul>"], ["h", "Інструменти розробника в браузері (DevTools)"], ["p", "Відкриваються клавішею **F12** або через контекстне меню «Переглянути код» / «Дослідити елемент»."], ["table", ["Вкладка", "Для чого"], [["Elements / Інспектор", "Перегляд і тимчасова зміна HTML і CSS, блокова модель елемента"], ["Console / Консоль", "Помилки JavaScript, виконання команд"], ["Network / Мережа", "Які файли завантажуються, їхній розмір і час"], ["Режим пристрою", "Імітація екранів смартфонів і планшетів"], ["Lighthouse (у Chromium-браузерах)", "Аудит швидкодії, доступності, SEO"]]], ["h", "Інші корисні інструменти"], ["ul", ["**Валідатор W3C** (validator.w3.org) — перевіряє HTML на помилки розмітки.", "**Git і GitHub** — контроль версій, спільна робота, безкоштовний хостинг статичних сайтів GitHub Pages.", "**Figma, Penpot** — прототипи й макети дизайну.", "**Can I use** (caniuse.com) — підтримка можливостей HTML/CSS/JS різними браузерами.", "Онлайн-пісочниці (CodePen, JSFiddle) — швидка перевірка фрагментів коду."]], ["note", "Зміни, зроблені в DevTools, діють лише до перезавантаження сторінки. Знайшовши вдале рішення, перенесіть його у свій CSS-файл."]]}, {"n": 109, "title": "Створення макету інформаційної структури сайту", "blocks": [["p", "**Практична робота 7.** Мета: спроєктувати інформаційну структуру власного сайту і створити прототипи його основних сторінок. Урок завершує тематичну атестацію з підрозділу."], ["ol", ["Оберіть тему сайту (сайт класу, гуртка, хобі, портфоліо) і запишіть мету одним реченням.", "Опишіть цільову аудиторію та складіть одну персону.", "Складіть перелік сторінок (6–10) і побудуйте **схему-дерево** структури (на папері, у Figma, draw.io чи текстовому редакторі).", "Для головної та однієї внутрішньої сторінки намалюйте **вайрфрейм**: шапка, меню, основний вміст, бічна панель (за потреби), підвал.", "Спроєктуйте структуру папок і файлів сайту з іменами латиницею.", "Збережіть результат у вигляді зображення або PDF і додайте короткий опис (5–7 речень)."]], ["code", "Головна (index.html)\n├── Про нас (about.html)\n├── Новини (news/)\n│   └── Окрема новина\n├── Розклад (schedule.html)\n├── Галерея (gallery.html)\n└── Контакти (contacts.html)"], ["ul", ["**Критерії оцінювання:** чітка мета і ЦА; логічна структура без «загублених» сторінок; кожна важлива сторінка досяжна за 2–3 переходи; вайрфрейми містять усі основні зони; акуратні імена файлів."]], ["note", "Вайрфрейм — це «скелет» без кольорів і картинок: прямокутники з підписами. Не витрачайте час на оформлення на цьому етапі."]]}], "practice": [{"task": "Для сайту шкільної бібліотеки визначте цільову аудиторію (2–3 групи) і для кожної назвіть дві потреби, які має задовольняти сайт.", "answer": "1) Учні: знайти, чи є потрібна книга (електронний каталог); дізнатися графік роботи. 2) Вчителі: переглянути список методичної літератури; замовити книги для класу. 3) Батьки: дізнатися перелік підручників на рік; знайти контакти бібліотекаря. Висновок: на головній мають бути пошук у каталозі, графік роботи й контакти.", "code": false}, {"task": "Побудуйте ієрархічну структуру сайту кафе (не більше трьох рівнів), щоб меню страв було доступне не далі ніж за 2 кліки від головної.", "answer": "Головна\n├── Меню\n│   ├── Сніданки\n│   ├── Основні страви\n│   ├── Десерти\n│   └── Напої\n├── Бронювання столика\n├── Про нас\n└── Контакти\nБудь-який розділ меню відкривається за 2 переходи: Головна → Меню → Десерти.", "code": false}, {"task": "Учень-кореспондент має писати новини для шкільного сайту на WordPress, але публікувати їх лише після перевірки вчителем. Яку роль надати учневі і яку — вчителю? Поясніть.", "answer": "Учневі — роль **Учасник**: він може створювати й редагувати свої записи, але не публікувати їх. Вчителю — роль **Редактор**: він переглядає, виправляє і публікує записи всіх авторів. Роль Адміністратора нікому з них не потрібна (принцип найменших привілеїв).", "code": false}, {"task": "Напишіть CSS-код, який задає світлу кольорову схему за замовчуванням і темну — для користувачів, у яких у системі ввімкнено темну тему. Використайте CSS-змінні.", "answer": ":root {\n  --bg: #ffffff;\n  --text: #222222;\n  --accent: #0057b8;\n}\n@media (prefers-color-scheme: dark) {\n  :root {\n    --bg: #181818;\n    --text: #e6e6e6;\n    --accent: #6fa8ff;\n  }\n}\nbody {\n  background: var(--bg);\n  color: var(--text);\n}\na {\n  color: var(--accent);\n}", "code": true}], "quiz": [{"q": "Що означає підхід **mobile first**?", "o": ["Макет спершу проєктують для смартфона, потім розширюють для більших екранів", "Сайт відкривається лише на мобільних пристроях", "Спочатку створюють мобільний застосунок, а потім сайт", "Мобільна версія розміщується на окремому домені"], "a": 0, "why": "Mobile first — це порядок проєктування: від найменшого екрана до найбільшого."}, {"q": "Яка структура сайту найкраще підходить для покрокового онлайн-уроку?", "o": ["Мережева", "Ієрархічна", "Лінійна", "Довільна"], "a": 2, "why": "Лінійна структура веде користувача послідовно від кроку до кроку."}, {"q": "Як називається узагальнений опис типового відвідувача сайту?", "o": ["Технічне завдання", "Персона", "Вайрфрейм", "Карта сайту"], "a": 1, "why": "Персона — портрет представника цільової аудиторії."}, {"q": "Чим статичний сайт відрізняється від динамічного?", "o": ["Статичний сайт не можна відкрити на смартфоні", "Статичний сайт не містить зображень", "Статичний сайт завжди створюється в CMS", "Сторінки статичного сайту — готові файли, які сервер віддає без змін"], "a": 3, "why": "Динамічні сторінки формуються програмою на сервері, статичні — вже готові."}, {"q": "Що таке CMS?", "o": ["Мова розмітки веб-сторінок", "Протокол передавання файлів", "Система керування вмістом сайту", "Сервіс реєстрації доменів"], "a": 2, "why": "CMS — Content Management System."}, {"q": "Для чого потрібен SSL/TLS-сертифікат?", "o": ["Щоб сайт працював за захищеним протоколом HTTPS", "Щоб прискорити верстку", "Щоб зареєструвати доменне ім'я", "Щоб створити резервну копію"], "a": 0, "why": "Сертифікат забезпечує шифроване з'єднання між браузером і сервером."}, {"q": "Яка роль у WordPress дозволяє писати записи, але не публікувати їх?", "o": ["Адміністратор", "Учасник", "Редактор", "Автор"], "a": 1, "why": "Учасник (Contributor) надсилає записи на перевірку."}, {"q": "Яка вкладка DevTools показує, які файли завантажує сторінка і скільки часу це триває?", "o": ["Elements", "Console", "Network", "Sources"], "a": 2, "why": "Вкладка Network (Мережа) відображає всі запити сторінки."}, {"q": "Яке ім'я файлу краще для сторінки сайту?", "o": ["Наші Контакти.html", "Contacts Page.HTML", "контакти.html", "contacts.html"], "a": 3, "why": "Імена файлів пишуть латиницею, малими літерами, без пробілів."}, {"q": "Що є першим етапом розроблення сайту?", "o": ["Аналіз і постановка мети", "Верстка", "Публікація на хостингу", "Наповнення вмістом"], "a": 0, "why": "Без визначеної мети та ЦА неможливо спланувати решту етапів."}]}, {"id": "t32", "topic": 3, "code": "3.2", "title": "HTML, CSS і верстка веб-сторінок", "lessons": [{"n": 110, "title": "Мова гіпертекстової розмітки", "blocks": [["p", "**HTML (HyperText Markup Language)** — мова гіпертекстової розмітки, якою описують **структуру й зміст** веб-сторінки: заголовки, абзаци, списки, посилання, зображення, таблиці, форми. Чинна версія мови — **HTML5**, яку розвивають як «живий стандарт» (HTML Living Standard)."], ["h", "Будова HTML-документа"], ["code", "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Мій перший сайт<\/title>\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n<\/head>\n<body>\n  <h1>Вітаю!<\/h1>\n  <p>Це <strong>перша<\/strong> сторінка мого сайту.<\/p>\n<\/body>\n<\/html>"], ["p", "**Тег** записують у кутових дужках: відкривальний `<p>` і закривальний `<\/p>`; разом із вмістом вони утворюють **елемент**. Деякі елементи порожні й не мають закривального тега: `<img>`, `<br>`, `<meta>`, `<input>`. **Атрибути** уточнюють властивості елемента: `<a href=\"contacts.html\">`."], ["h", "Семантичні елементи HTML5"], ["table", ["Елемент", "Призначення"], [["`<header>`", "Шапка сторінки або розділу"], ["`<nav>`", "Блок основної навігації"], ["`<main>`", "Основний унікальний вміст сторінки (один на сторінці)"], ["`<section>`", "Тематичний розділ із заголовком"], ["`<article>`", "Самостійний матеріал: новина, допис, картка"], ["`<aside>`", "Додатковий вміст: бічна панель"], ["`<footer>`", "Підвал: контакти, авторські права"]]], ["h", "Часто вживані елементи"], ["code", "<h2>Розклад гуртків<\/h2>\n<ul>\n  <li>Робототехніка — вівторок<\/li>\n  <li>Дебати — четвер<\/li>\n<\/ul>\n<a href=\"https://example.com\" target=\"_blank\">Зовнішнє посилання<\/a>\n<img src=\"img/team.jpg\" alt=\"Команда ліцею на олімпіаді\" width=\"600\">\n<table>\n  <tr><th>День<\/th><th>Урок<\/th><\/tr>\n  <tr><td>Пн<\/td><td>Інформатика<\/td><\/tr>\n<\/table>\n<form action=\"/send\" method=\"post\">\n  <label for=\"email\">Пошта:<\/label>\n  <input type=\"email\" id=\"email\" name=\"email\" required>\n  <button type=\"submit\">Надіслати<\/button>\n<\/form>"], ["note", "Атрибут `alt` у зображень обов'язковий: його зачитують програми екранного доступу, і він показується, якщо картинка не завантажилася. Семантичні теги замість безликих `<div>` полегшують роботу пошуковим системам і людям з порушеннями зору."]]}, {"n": 111, "title": "Каскадні таблиці стилів", "blocks": [["p", "**CSS (Cascading Style Sheets)** — мова опису зовнішнього вигляду HTML-документа: кольорів, шрифтів, відступів, розташування елементів. HTML відповідає за **зміст**, CSS — за **оформлення**."], ["h", "Способи підключення CSS"], ["ul", ["**Зовнішній файл** (рекомендовано): `<link rel=\"stylesheet\" href=\"style.css\">` у `<head>`.", "**Внутрішня таблиця**: елемент `<style>…<\/style>` у `<head>`.", "**Вбудований стиль**: атрибут `style=\"color: red\"` — лише для винятків."]], ["h", "Синтаксис і селектори"], ["code", "/* селектор { властивість: значення; } */\nh1 { color: #0057b8; }              /* за тегом */\n.card { padding: 16px; }            /* за класом */\n#menu { background: #f2f2f2; }      /* за id */\nnav a { text-decoration: none; }    /* нащадок */\na:hover { text-decoration: underline; } /* псевдоклас */\nbutton, .btn { cursor: pointer; }   /* група */"], ["h", "Каскад, специфічність, успадкування"], ["ul", ["**Каскад** — якщо до елемента застосовано кілька правил, перемагає правило з більшою **специфічністю**; за рівної специфічності — те, що записане пізніше.", "Специфічність зростає в порядку: тег < клас (псевдоклас, атрибут) < id < вбудований стиль. Позначка `!important` перебиває звичайні правила — уживайте її якнайрідше.", "**Успадкування** — частину властивостей (колір, шрифт) елементи отримують від батьківського елемента; відступи, рамки, розміри не успадковуються."]], ["h", "Блокова модель (box model)"], ["p", "Кожен елемент — прямокутник із чотирьох шарів: **content** (вміст) → **padding** (внутрішній відступ) → **border** (рамка) → **margin** (зовнішній відступ). Властивість `box-sizing: border-box` робить так, щоб `width` включала padding і border — так розміри рахувати простіше."], ["code", "*, *::before, *::after { box-sizing: border-box; }\n.card {\n  width: 300px;\n  padding: 16px;\n  border: 2px solid #ccc;\n  margin: 0 auto 24px;   /* центрування по горизонталі */\n  border-radius: 8px;\n  font: 16px/1.5 Arial, sans-serif;\n}"]]}, {"n": 112, "title": "Проєктування та верстка веб-сторінок", "blocks": [["p", "**Верстка** — перетворення дизайн-макета на HTML/CSS-код. Спершу визначають **зони сторінки** (шапка, меню, вміст, бічна панель, підвал), потім розмічають їх семантичними тегами і розташовують засобами CSS. Сучасні способи компонування — **Flexbox** і **CSS Grid**."], ["h", "Flexbox — одновимірне розташування"], ["p", "Flexbox розміщує елементи в **рядок або стовпчик** і керує їхнім вирівнюванням і розподілом вільного місця. Властивості задають **контейнеру**, а він керує дочірніми елементами."], ["code", "nav ul {\n  display: flex;\n  justify-content: space-between; /* вздовж головної осі */\n  align-items: center;            /* вздовж поперечної осі */\n  gap: 12px;\n  list-style: none;\n  padding: 0;\n}\n.cards { display: flex; flex-wrap: wrap; gap: 16px; }\n.cards article { flex: 1 1 250px; } /* росте, стискається, базова ширина 250px */"], ["h", "Grid — двовимірна сітка"], ["p", "CSS Grid ділить контейнер на **рядки й стовпчики** одночасно. Зручний для каркаса всієї сторінки. Одиниця `fr` — частка вільного простору."], ["code", "<body class=\"page\">\n  <header>Шапка<\/header>\n  <nav>Меню<\/nav>\n  <main>Вміст<\/main>\n  <aside>Бічна панель<\/aside>\n  <footer>Підвал<\/footer>\n<\/body>\n\n.page {\n  display: grid;\n  grid-template-columns: 1fr 3fr 1fr;\n  grid-template-areas:\n    \"header header header\"\n    \"nav    main   aside\"\n    \"footer footer footer\";\n  gap: 16px;\n  min-height: 100vh;\n}\nheader { grid-area: header; }\nnav    { grid-area: nav; }\nmain   { grid-area: main; }\naside  { grid-area: aside; }\nfooter { grid-area: footer; }"], ["table", ["", "Flexbox", "Grid"], [["Вимірність", "Один напрямок (рядок або стовпчик)", "Два напрямки одночасно"], ["Типове застосування", "Меню, ряд кнопок, картки", "Каркас сторінки, галерея"], ["Вмикання", "`display: flex`", "`display: grid`"]]], ["note", "Застарілі способи верстки таблицями (`<table>` для макета) і плаваючими блоками (`float`) у нових проєктах не використовують. Таблиці — лише для табличних даних."]]}, {"n": 113, "title": "Адаптивна верстка", "blocks": [["p", "**Адаптивна верстка (responsive design)** — підхід, за якого одна й та сама сторінка зручно відображається на екранах будь-якої ширини: макет перебудовується, зображення масштабуються, шрифти лишаються читабельними."], ["h", "Три складники адаптивності"], ["ol", ["Метатег **viewport**: `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">` — без нього мобільний браузер показує зменшену «настільну» версію.", "**Гнучкі розміри**: відсотки, `fr`, `rem`, `vw`, `max-width` замість жорстких пікселів; `img { max-width: 100%; height: auto; }`.", "**Медіазапити** `@media` — застосування різних стилів залежно від характеристик пристрою."]], ["h", "Медіазапити (mobile first)"], ["code", ".page {\n  display: grid;\n  grid-template-columns: 1fr;   /* смартфон: одна колонка */\n  gap: 16px;\n  padding: 16px;\n}\n@media (min-width: 768px) {    /* планшет */\n  .page { grid-template-columns: 1fr 2fr; }\n}\n@media (min-width: 1200px) {   /* великий екран */\n  .page {\n    grid-template-columns: 1fr 3fr 1fr;\n    max-width: 1200px;\n    margin: 0 auto;\n  }\n}"], ["p", "За підходу mobile first базові стилі пишуть для вузького екрана, а медіазапити з `min-width` додають зміни для ширших. **Точки зламу (breakpoints)** обирають там, де макет починає «ламатися», а не під конкретні моделі телефонів."], ["h", "Корисні прийоми"], ["ul", ["Сітка без медіазапитів: `grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));` — кількість колонок підбирається автоматично.", "Гнучкий розмір шрифту: `font-size: clamp(1.5rem, 4vw, 2.5rem);` — не менше мінімуму і не більше максимуму.", "Різні зображення для різних екранів: елемент `<picture>` або атрибут `srcset`.", "Медіазапити за властивостями пристрою: `(orientation: landscape)`, `(prefers-color-scheme: dark)`, `print`."]], ["note", "Перевіряйте сторінку в режимі пристрою DevTools, поступово змінюючи ширину вікна. Горизонтальна смуга прокручування на смартфоні — ознака помилки верстки."]]}, {"n": 114, "title": "Кросбраузерність", "blocks": [["p", "**Кросбраузерність** — властивість сайту однаково коректно відображатися й працювати в різних браузерах (Chrome, Firefox, Safari, Edge, Opera та інших) і на різних платформах."], ["h", "Чому браузери показують сторінку по-різному"], ["ul", ["Різні **рушії відображення**: Blink (Chrome, Edge, Opera), Gecko (Firefox), WebKit (Safari, а також усі браузери на iOS).", "Нові можливості CSS і JavaScript з'являються в браузерах неодночасно.", "Кожен браузер має власні **стилі за замовчуванням** (відступи, розміри заголовків, вигляд кнопок).", "Користувачі можуть мати застарілі версії браузерів."]], ["h", "Методи забезпечення кросбраузерності"], ["table", ["Метод", "Суть"], [["Валідний код", "Перевірка HTML валідатором W3C; помилки розмітки браузери «виправляють» по-різному"], ["Скидання стилів", "Файли reset.css / normalize.css вирівнюють стилі за замовчуванням"], ["Перевірка підтримки", "Сервіс caniuse.com показує, які браузери підтримують властивість"], ["Вендорні префікси", "`-webkit-`, `-moz-` для експериментальних властивостей; їх додає інструмент Autoprefixer"], ["Запасні значення", "Спочатку просте значення, потім сучасне — браузер ігнорує незрозуміле"], ["`@supports`", "Застосування стилів лише за підтримки властивості"], ["Тестування", "Перевірка в кількох браузерах і на реальних пристроях"]]], ["h", "Приклади"], ["code", "/* запасне значення: старий браузер візьме перший рядок */\n.box {\n  background: #0057b8;\n  background: linear-gradient(90deg, #0057b8, #ffd700);\n}\n\n/* стилі лише для браузерів, що підтримують grid */\n.gallery { display: block; }\n@supports (display: grid) {\n  .gallery {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));\n  }\n}"], ["note", "Підхід **прогресивного покращення**: базовий вміст і функції доступні в будь-якому браузері, а сучасні ефекти додаються там, де їх підтримують."]]}, {"n": 115, "title": "Створення веб-сторінок", "blocks": [["p", "**Практична робота 8.** Мета: зверстати головну сторінку власного сайту за макетом, створеним у практичній роботі 7, з використанням семантичних тегів HTML5, зовнішнього CSS і Flexbox/Grid."], ["ol", ["Створіть структуру папок: `index.html`, `css/style.css`, `img/`.", "У `index.html` запишіть каркас документа з `lang=\"uk\"`, кодуванням UTF-8, метатегом viewport і підключенням стилів.", "Розмітьте зони: `header` (логотип і назва), `nav` (меню з 4–6 пунктів), `main` (2–3 `section`), `footer` (контакти).", "У `style.css` задайте шрифт, кольори через CSS-змінні, `box-sizing: border-box`.", "Розташуйте меню за допомогою Flexbox, а картки або галерею — за допомогою Grid.", "Перевірте сторінку валідатором W3C і виправте помилки."]], ["code", "<header class=\"site-header\">\n  <h1>11-А клас<\/h1>\n  <nav>\n    <ul class=\"menu\">\n      <li><a href=\"index.html\">Головна<\/a><\/li>\n      <li><a href=\"news.html\">Новини<\/a><\/li>\n      <li><a href=\"contacts.html\">Контакти<\/a><\/li>\n    <\/ul>\n  <\/nav>\n<\/header>\n<main>\n  <section class=\"cards\">\n    <article><h2>Олімпіада<\/h2><p>Наші результати…<\/p><\/article>\n    <article><h2>Екскурсія<\/h2><p>Фотозвіт…<\/p><\/article>\n  <\/section>\n<\/main>\n<footer>&copy; 11-А клас<\/footer>"], ["ul", ["**Критерії:** валідний HTML без помилок; семантичні теги; стилі лише у зовнішньому файлі; меню на Flexbox, сітка на Grid; усі зображення мають `alt`; акуратні відступи в коді."]], ["note", "Пишіть код невеликими кроками і після кожного кроку оновлюйте сторінку в браузері — так помилку легше знайти."]]}, {"n": 116, "title": "Створення веб-сторінок", "blocks": [["p", "Мета: завершити сайт (2–3 сторінки), зробити його адаптивним і кросбраузерним. Урок завершує тематичну атестацію з веб-верстки."], ["ol", ["Додайте ще одну-дві сторінки (наприклад, «Новини» і «Контакти» з формою зворотного зв'язку), підключивши той самий файл стилів.", "Позначте активний пункт меню класом (наприклад, `.active`) на кожній сторінці.", "Додайте медіазапити: на вузьких екранах меню і картки розташовуються в одну колонку.", "Перевірте всі посилання між сторінками і роботу сайту в двох різних браузерах та в режимі пристрою DevTools.", "Здайте архів сайту або посилання на опублікований сайт (наприклад, GitHub Pages)."]], ["code", ".menu { display: flex; gap: 16px; }\n.menu a.active { font-weight: bold; border-bottom: 2px solid currentColor; }\n.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }\n\n@media (max-width: 600px) {\n  .menu { flex-direction: column; }\n  .cards { grid-template-columns: 1fr; }\n}"], ["ul", ["**Критерії:** щонайменше 2 пов'язані сторінки зі спільним стилем; коректне відображення на ширині від 320 px без горизонтального прокручування; однаковий вигляд у двох браузерах; валідний код; форма з підписами `<label>`."]], ["note", "Перед здачею відкрийте сайт на власному смартфоні: це найчесніша перевірка адаптивності."]]}], "practice": [{"task": "Напишіть HTML-код сторінки з правильним каркасом (мова — українська), шапкою з заголовком першого рівня, навігацією з трьох посилань, основним вмістом з однією статтею та підвалом.", "answer": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Гурток робототехніки<\/title>\n<\/head>\n<body>\n  <header>\n    <h1>Гурток робототехніки<\/h1>\n  <\/header>\n  <nav>\n    <a href=\"index.html\">Головна<\/a>\n    <a href=\"projects.html\">Проєкти<\/a>\n    <a href=\"contacts.html\">Контакти<\/a>\n  <\/nav>\n  <main>\n    <article>\n      <h2>Наш перший робот<\/h2>\n      <p>Робот проходить лабіринт за датчиками відстані.<\/p>\n    <\/article>\n  <\/main>\n  <footer>\n    <p>Гурток робототехніки, 2026<\/p>\n  <\/footer>\n<\/body>\n<\/html>", "code": true}, {"task": "Є правила: `p { color: black; }`, `.note { color: green; }`, `#intro { color: blue; }`. Якого кольору буде текст елемента `<p id=\"intro\" class=\"note\">`? Поясніть.", "answer": "Синього. До елемента застосовуються всі три правила, але селектор за id (`#intro`) має найбільшу специфічність серед них, тому перемагає його значення `blue`. Порядок запису тут не важливий, бо специфічності різні.", "code": false}, {"task": "Зверстайте горизонтальне меню на Flexbox: пункти рівномірно розподілені по ширині, вертикально вирівняні по центру, без маркерів списку. HTML: `<ul class=\"menu\">` з пунктами `<li><a>`.", "answer": ".menu {\n  display: flex;\n  justify-content: space-around;\n  align-items: center;\n  list-style: none;\n  margin: 0;\n  padding: 12px 0;\n  background: #0057b8;\n}\n.menu a {\n  color: #ffffff;\n  text-decoration: none;\n  padding: 8px 12px;\n}\n.menu a:hover {\n  background: rgba(255, 255, 255, 0.2);\n  border-radius: 4px;\n}", "code": true}, {"task": "Створіть адаптивну галерею: на смартфоні — 1 колонка, від 600px — 2 колонки, від 1000px — 4 колонки; зображення не виходять за межі своїх комірок. Підхід — mobile first.", "answer": ".gallery {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 12px;\n}\n.gallery img {\n  max-width: 100%;\n  height: auto;\n  display: block;\n}\n@media (min-width: 600px) {\n  .gallery { grid-template-columns: repeat(2, 1fr); }\n}\n@media (min-width: 1000px) {\n  .gallery { grid-template-columns: repeat(4, 1fr); }\n}", "code": true}, {"task": "Сторінка має фон `background: conic-gradient(red, yellow, green);`. Як зробити так, щоб у браузері без підтримки `conic-gradient` фон був хоча б однотонним? Наведіть код і поясніть принцип.", "answer": ".banner {\n  background: #ffcc00;\n  background: conic-gradient(red, yellow, green);\n}\n/* Браузер, який не розуміє другого значення, ігнорує цей рядок і залишає однотонний фон із першого рядка. Браузер із підтримкою застосує градієнт, бо він записаний пізніше. */", "code": true}], "quiz": [{"q": "Який елемент HTML5 призначений для основного унікального вмісту сторінки?", "o": ["`<main>`", "`<section>`", "`<body>`", "`<article>`"], "a": 0, "why": "`<main>` — основний вміст, на сторінці він один."}, {"q": "Для чого потрібен атрибут `alt` в елементі `<img>`?", "o": ["Задає розмір зображення", "Задає альтернативний текст, якщо зображення недоступне, і для програм екранного доступу", "Вказує адресу зображення", "Робить зображення посиланням"], "a": 1, "why": "Адресу задає `src`, а `alt` — текстовий опис."}, {"q": "Як правильно підключити зовнішній CSS-файл?", "o": ["`<style src=\"style.css\">`", "`<css href=\"style.css\">`", "`<link rel=\"stylesheet\" href=\"style.css\">`", "`<script href=\"style.css\">`"], "a": 2, "why": "Зовнішні стилі підключають елементом `<link>` у `<head>`."}, {"q": "Який селектор має найбільшу специфічність?", "o": ["`p`", "`.menu a`", "`nav ul li`", "`#header`"], "a": 3, "why": "Селектор за id важить більше за будь-яку кількість класів і тегів."}, {"q": "Що робить властивість `box-sizing: border-box`?", "o": ["Додає рамку до елемента", "Включає padding і border у задану ширину елемента", "Прибирає зовнішні відступи", "Робить елемент блоковим"], "a": 1, "why": "Тоді `width` — це повна ширина разом із внутрішнім відступом і рамкою."}, {"q": "Яка властивість Flexbox вирівнює елементи вздовж головної осі?", "o": ["`justify-content`", "`align-items`", "`flex-wrap`", "`grid-area`"], "a": 0, "why": "`align-items` діє вздовж поперечної осі."}, {"q": "Що означає запис `grid-template-columns: 1fr 2fr;`?", "o": ["Дві колонки по 1 і 2 пікселі", "Два рядки різної висоти", "Дві колонки, друга вдвічі ширша за першу", "Колонки з відступом 1 і 2 одиниці"], "a": 2, "why": "`fr` — частка вільного простору контейнера."}, {"q": "Який медіазапит застосує стилі на екранах шириною 768px і більше?", "o": ["`@media (max-width: 768px)`", "`@media screen and (width < 768px)`", "`@media print`", "`@media (min-width: 768px)`"], "a": 3, "why": "`min-width` — мінімальна ширина, від якої діють стилі."}, {"q": "Без якого метатегу мобільний браузер покаже зменшену «настільну» версію сторінки?", "o": ["`<meta charset=\"UTF-8\">`", "`<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">`", "`<meta name=\"description\">`", "`<meta name=\"author\">`"], "a": 1, "why": "Метатег viewport задає ширину області перегляду рівною ширині екрана."}, {"q": "Яке правило CSS дозволяє застосувати стилі лише в браузерах, що підтримують певну властивість?", "o": ["`@supports`", "`@media`", "`@import`", "`!important`"], "a": 0, "why": "`@supports (display: grid) { … }` спрацює лише за підтримки grid."}]}, {"id": "t33", "topic": 3, "code": "3.3", "title": "Графіка, анімація і мультимедіа на веб-сторінках", "lessons": [{"n": 117, "title": "Графіка для веб-середовища", "blocks": [["h", "Растрова і векторна графіка у вебі"], ["p", "Зображення на веб-сторінках бувають **растровими** (сітка пікселів: фото, скриншоти) і **векторними** (опис фігур формулами: логотипи, іконки, схеми). Растрове зображення при збільшенні «розсипається» на пікселі, векторне масштабується без втрати якості."], ["table", ["Формат", "Тип", "Стиснення", "Прозорість", "Для чого"], [["JPEG", "растровий", "з втратами", "ні", "фотографії"], ["PNG", "растровий", "без втрат", "так (альфа-канал)", "скриншоти, графіка з чіткими краями"], ["GIF", "растровий", "без втрат, до 256 кольорів", "так (1 колір)", "прості анімації"], ["WebP", "растровий", "з втратами або без", "так", "універсальна заміна JPEG/PNG"], ["AVIF", "растровий", "з втратами або без", "так", "фото з високим ступенем стиснення"], ["SVG", "векторний", "текстовий XML-файл", "так", "логотипи, іконки, діаграми"]]], ["h", "Вставлення зображення: тег img"], ["code", "<img src=\"images/lyceum.jpg\"\n     alt=\"Будівля ліцею взимку\"\n     width=\"800\" height=\"533\"\n     loading=\"lazy\">"], ["ul", ["`src` — шлях до файлу (відносний або абсолютний URL);", "`alt` — текстова альтернатива: її читають екранні диктори, її показує браузер, якщо зображення не завантажилось, її враховують пошукові системи;", "`width` і `height` — розміри; браузер заздалегідь резервує місце, і сторінка не «стрибає» під час завантаження;", "`loading=\"lazy\"` — відкладене завантаження зображень, що поки не видно на екрані."]], ["h", "Фігура з підписом і вбудований SVG"], ["code", "<figure>\n  <img src=\"chart.png\" alt=\"Кількість учнів за роками\">\n  <figcaption>Рис. 1. Динаміка кількості учнів<\/figcaption>\n<\/figure>\n\n<svg width=\"120\" height=\"120\" viewBox=\"0 0 120 120\">\n  <circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"gold\" stroke=\"navy\" stroke-width=\"4\"/>\n  <text x=\"60\" y=\"68\" text-anchor=\"middle\" font-size=\"24\">ЯСНО<\/text>\n<\/svg>"], ["note", "Декоративні зображення (візерунки, фони) краще задавати в CSS через `background-image`, а для змістовних зображень використовувати `<img>` з осмисленим `alt`. Для суто декоративного `<img>` ставлять порожній `alt=\"\"`."]]}, {"n": 118, "title": "Методи створення та збереження зображень для веб-сторінок", "blocks": [["h", "Інструменти створення графіки"], ["ul", ["**Растрові редактори**: GIMP, Krita, Adobe Photoshop, онлайн-редактори (наприклад, Photopea) — обробка фото, ретуш, колаж;", "**Векторні редактори**: Inkscape, Adobe Illustrator, Figma — логотипи, іконки, макети; експорт у SVG;", "**Програмне створення**: SVG-код вручну, елемент `<canvas>` і JavaScript, CSS-градієнти й тіні замість зображень."]], ["h", "Оптимізація перед публікацією"], ["ol", ["Обріжте зайве і зменште розміри до потрібних: немає сенсу завантажувати фото 4000×3000 px у блок шириною 800 px.", "Оберіть формат: фото — JPEG/WebP/AVIF, графіка з прозорістю — PNG/WebP, іконки — SVG.", "Підберіть якість стиснення (для JPEG/WebP часто достатньо 70–85 %), порівнюючи результат на око.", "Видаліть метадані (EXIF), якщо вони не потрібні: це зменшує розмір і не розкриває, наприклад, геолокацію знімка.", "Давайте файлам зрозумілі імена латиницею без пробілів: `lyceum-hall-2.webp`."]], ["h", "Адаптивні зображення"], ["p", "Атрибут `srcset` дозволяє браузеру вибрати файл відповідного розміру, а елемент `<picture>` — запропонувати сучасний формат із запасним варіантом."], ["code", "<picture>\n  <source srcset=\"hall.avif\" type=\"image/avif\">\n  <source srcset=\"hall.webp\" type=\"image/webp\">\n  <img src=\"hall.jpg\" alt=\"Актова зала\"\n       srcset=\"hall-480.jpg 480w, hall-960.jpg 960w\"\n       sizes=\"(max-width: 600px) 480px, 960px\">\n<\/picture>"], ["h", "Малювання на canvas"], ["code", "<canvas id=\"pic\" width=\"200\" height=\"100\"><\/canvas>\n<script>\n  const ctx = document.getElementById(\"pic\").getContext(\"2d\");\n  ctx.fillStyle = \"#0057b7\";\n  ctx.fillRect(0, 0, 200, 50);   // верхня смуга\n  ctx.fillStyle = \"#ffd700\";\n  ctx.fillRect(0, 50, 200, 50);  // нижня смуга\n<\/script>"], ["note", "Вміст `<canvas>` — це растрове зображення, яке малює скрипт; пошукові системи та екранні диктори його не «бачать». Для змістовної інформації додавайте текстовий опис."]]}, {"n": 119, "title": "Анімаційні ефекти", "blocks": [["h", "Способи анімації у вебі"], ["ul", ["**CSS-переходи** (`transition`) — плавна зміна властивості при зміні стану (наведення, клас);", "**CSS-анімації** (`@keyframes` + `animation`) — сценарій з кількох кадрів, може повторюватись;", "**JavaScript** — анімація, що залежить від логіки програми (`requestAnimationFrame`, Web Animations API);", "**анімовані зображення** — GIF, анімований WebP, SVG-анімація."]], ["h", "Перехід при наведенні"], ["code", ".btn {\n  background: #0057b7;\n  color: white;\n  transition: background 0.3s ease, transform 0.3s ease;\n}\n.btn:hover {\n  background: #003f87;\n  transform: scale(1.05);\n}"], ["h", "Анімація з ключовими кадрами"], ["code", "@keyframes pulse {\n  0%   { transform: scale(1);   opacity: 1; }\n  50%  { transform: scale(1.2); opacity: 0.6; }\n  100% { transform: scale(1);   opacity: 1; }\n}\n.badge {\n  animation: pulse 2s ease-in-out infinite;\n}"], ["table", ["Властивість", "Значення"], [["`animation-name`", "ім'я набору `@keyframes`"], ["`animation-duration`", "тривалість одного циклу, напр. `2s`"], ["`animation-timing-function`", "характер руху: `linear`, `ease`, `ease-in-out`"], ["`animation-delay`", "затримка перед стартом"], ["`animation-iteration-count`", "кількість повторів або `infinite`"], ["`animation-direction`", "напрям: `normal`, `reverse`, `alternate`"]]], ["note", "Найплавніше анімуються `transform` і `opacity`: їх браузер обробляє без перерахунку розмітки. Поважайте налаштування користувача: у блоці `@media (prefers-reduced-motion: reduce)` вимикайте або спрощуйте анімації."]]}, {"n": 120, "title": "Мультимедіа на веб-сторінках", "blocks": [["h", "Аудіо та відео в HTML5"], ["p", "Для вбудовування мультимедіа без сторонніх плагінів використовують елементи `<audio>` і `<video>`. Усередині можна вказати кілька `<source>` — браузер відтворить перший формат, який підтримує."], ["code", "<video controls width=\"640\" poster=\"preview.jpg\">\n  <source src=\"lesson.webm\" type=\"video/webm\">\n  <source src=\"lesson.mp4\"  type=\"video/mp4\">\n  <track src=\"lesson-uk.vtt\" kind=\"subtitles\" srclang=\"uk\" label=\"Українська\">\n  Ваш браузер не підтримує відео.\n<\/video>\n\n<audio controls>\n  <source src=\"anthem.ogg\" type=\"audio/ogg\">\n  <source src=\"anthem.mp3\" type=\"audio/mpeg\">\n<\/audio>"], ["table", ["Атрибут", "Призначення"], [["`controls`", "показати стандартні кнопки керування"], ["`autoplay`", "почати відтворення автоматично"], ["`muted`", "вимкнути звук"], ["`loop`", "повторювати"], ["`poster`", "зображення-заставка відео"], ["`preload`", "що завантажувати заздалегідь: `none`, `metadata`, `auto`"]]], ["h", "Формати"], ["ul", ["відео: **MP4** (кодек H.264 — найширша підтримка), **WebM** (VP9/AV1);", "аудіо: **MP3**, **AAC**, **Ogg Vorbis/Opus**, **WAV** (без стиснення, великі файли)."]], ["note", "Більшість браузерів блокує `autoplay` зі звуком. Автозапуск зазвичай дозволено лише разом з `muted`. Субтитри (`<track>`, формат WebVTT) роблять відео доступним для людей з порушеннями слуху і для перегляду без звуку."]]}, {"n": 121, "title": "Мультимедіа на веб-сторінках (продовження)", "blocks": [["h", "Керування мультимедіа з JavaScript"], ["p", "Елементи `<audio>`/`<video>` мають методи `play()`, `pause()` і властивості `currentTime`, `duration`, `volume`, `paused`, `muted`. Це дозволяє створити власний програвач."], ["code", "<video id=\"v\" src=\"lesson.mp4\" width=\"480\"><\/video>\n<button id=\"toggle\">▶ Відтворити<\/button>\n<span id=\"time\">0 с<\/span>\n\n<script>\n  const v = document.getElementById(\"v\");\n  const btn = document.getElementById(\"toggle\");\n  btn.addEventListener(\"click\", () => {\n    if (v.paused) { v.play(); btn.textContent = \"⏸ Пауза\"; }\n    else          { v.pause(); btn.textContent = \"▶ Відтворити\"; }\n  });\n  v.addEventListener(\"timeupdate\", () => {\n    document.getElementById(\"time\").textContent =\n      Math.floor(v.currentTime) + \" с\";\n  });\n<\/script>"], ["h", "Вбудовування зовнішнього вмісту: iframe"], ["p", "Відео з відеохостингів, карти, презентації вставляють через `<iframe>` — «вікно» з іншою сторінкою. Код вбудовування зазвичай надає сам сервіс (кнопка «Поділитися → Вбудувати»)."], ["code", "<iframe src=\"https://example.com/embed/map\"\n        width=\"600\" height=\"400\"\n        title=\"Карта розташування ліцею\"\n        loading=\"lazy\"><\/iframe>"], ["ul", ["обов'язково задавайте `title` — для доступності;", "розміри адаптуйте через CSS (`width: 100%`, `aspect-ratio: 16 / 9`);", "атрибут `sandbox` обмежує можливості вбудованої сторінки (скрипти, форми тощо)."]], ["note", "Розміщуйте лише той вміст, на який маєте право: власні записи, матеріали з відкритою ліцензією (наприклад, Creative Commons) із зазначенням автора або офіційні коди вбудовування."]]}, {"n": 122, "title": "Застосування гіпертекстових, графічних, анімаційних та мультимедійних елементів на веб-сторінках", "blocks": [["p", "**Практична робота 9.** Мета: створити сторінку «Мій улюблений предмет», що поєднує гіперпосилання, графіку, анімацію і мультимедіа. Урок завершує тематичну атестацію з розділу."], ["ol", ["Створіть папку проєкту з підпапками `images` і `media`, файли `index.html` і `style.css`.", "Додайте меню з якірними посиланнями на розділи сторінки (`<a href=\"#gallery\">`).", "Розмістіть галерею з 3–4 оптимізованих зображень (`<figure>`, `<figcaption>`, `alt`, `loading=\"lazy\"`).", "Додайте власний SVG-значок або логотип.", "Вставте відео або аудіо з атрибутом `controls` і двома джерелами `<source>`.", "Додайте CSS-перехід для кнопок/посилань і одну анімацію `@keyframes`; врахуйте `prefers-reduced-motion`.", "Перевірте сторінку у двох браузерах і на вузькому екрані."]], ["table", ["Критерій", "Бали"], [["Коректна структура HTML і робочі посилання", "3"], ["Оптимізовані зображе
