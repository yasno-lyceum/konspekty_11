<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конспекти ЯСНО</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = [{"id": "art", "name": "Мистецтво", "short": "Мистецтво 10", "themes": [{"name": "Тема 1. Мистецтво африканського культурного регіону (9 год.)", "lessons": [{"n": "1", "t": "Африка. Наскельні малюнки. Статуетки, скульптура", "g": "Дізнатися, як виникло мистецтво Африки, де збереглися найдавніші наскельні малюнки, чим особлива африканська скульптура та які культури створили її шедеври.", "k": "", "terms": [["Петрогліфи", "зображення, вибиті або вирізані на камені."], ["Наскельний живопис", "малюнки, виконані фарбами (охрою, вугіллям, білою глиною) на стінах печер і скель."], ["Теракота", "випалена глина без поливи; матеріал для давніх статуеток."], ["Метод втраченої форми", "лиття металу: модель з воску обмазують глиною, віск виплавляють, а в порожнину заливають бронзу."], ["Фронтальність", "розташування фігури суворо обличчям до глядача, симетрично."]], "th": [{"h": "Африка — колиска людства і мистецтва", "p": ["Африка — другий за площею континент, де живуть понад тисячу народів і звучать понад 2000 мов. Саме тут з’явилися перші люди, тож і мистецтво Африки має дуже давнє коріння. Для африканців мистецтво ніколи не було просто прикрасою: воно пов’язане з вірою в духів предків, силами природи, обрядами народження, дорослішання, полювання, врожаю і смерті."], "ul": []}, {"h": "Наскельні малюнки", "p": ["Найдавніші твори африканського мистецтва — малюнки на скелях. Найвідоміший осередок — плато Тассілін-Аджер у Сахарі (Алжир), об’єкт Всесвітньої спадщини ЮНЕСКО. Тут збереглося понад 15 тисяч зображень, створених упродовж кількох тисячоліть. Вони показують, що колись Сахара була зеленою саваною з річками та озерами.", "Науковці поділяють сахарські малюнки на періоди за тим, що на них зображено:"], "ul": ["період мисливців — дикі тварини (слони, жирафи, буйволи, носороги) та люди зі зброєю;", "«пастуший» період — стада корів, сцени з побуту, танці;", "період коня — колісниці та вершники;", "період верблюда — коли Сахара вже перетворилася на пустелю."]}, {"h": "", "p": ["Інші відомі осередки: Тадрарт-Акакус (Лівія) та гори Драконові (Дракенсберг) у Південній Африці, де малюнки залишив народ сан (бушмени). Художники використовували природні пігменти: червону й жовту охру, вугілля, білу глину, змішуючи їх із тваринним жиром чи кров’ю. Фігури тварин часто дуже живі та динамічні, а людей зображено схематично, у русі."], "ul": []}, {"h": "Скульптура та статуетки", "p": ["Скульптура — найважливіший вид мистецтва Тропічної Африки. Головний матеріал — дерево, тому багато давніх творів не збереглося. Найдавніші відомі скульптури створила культура Нок (територія сучасної Нігерії, приблизно І тис. до н. е.) — це теракотові голови з великими мигдалеподібними очима та складними зачісками.", "Згодом у місті Іфе (Нігерія) створювали реалістичні бронзові та теракотові голови правителів, а в королівстві Бенін — знамениті бронзові пластини й голови, відлиті методом втраченої форми. Бенінські бронзи прикрашали королівський палац і розповідали про історію правителів."], "ul": []}, {"h": "Характерні риси африканської скульптури", "p": [], "ul": ["голова часто завелика порівняно з тілом — вважалося, що в ній зосереджена життєва сила;", "фронтальність, симетрія, статична поза;", "узагальнення форм, геометризація (циліндри, конуси, кулі);", "поєднання дерева з металом, намистом, мушлями, тканиною;", "магічне призначення: статуетки предків, фігури-охоронці, обереги."]}, {"h": "", "p": ["Приклади: статуетки-охоронці народу фанг (Габон), які стерегли реліквії предків; фігури нкісі народу конго, утикані цвяхами, — ними «запечатували» обіцянки та клятви; ляльки акуаба народу ашанті (Гана) з круглою пласкою головою — їх носили жінки, які мріяли про дитину."], "ul": []}], "f": "Бенінські бронзи потрапили до Європи 1897 року після британської військової експедиції. Нині кілька країн (зокрема Німеччина) повертають частину цих творів Нігерії.", "pr": ["Намалюйте ескіз «наскельного малюнка» на тему «Полювання» або «Тварини савани»: використайте лише 2–3 «природні» кольори (охра, коричневий, чорний) на тонованому папері. Фігури — схематичні, але в русі.", "Або: виліпіть із пластиліну/глини невелику статуетку в африканському стилі, дотримуючись фронтальності та симетрії."], "q": ["Чому наскельні малюнки Сахари називають «літописом клімату»?", "Назвіть три культури, що створили давні африканські скульптури.", "Які риси відрізняють африканську скульптуру від античної грецької?", "Що таке метод втраченої форми?", "Для чого слугували статуетки предків?"]}, {"n": "2", "t": "Африканські ритуальні маски. Типи масок", "g": "З’ясувати, яку роль відігравали маски в житті африканських народів, розрізняти основні типи масок та впізнавати маски відомих народів.", "k": "", "terms": [["Ритуальна маска", "предмет, який надягають під час обряду; вважалося, що той, хто її носить, перетворюється на духа."], ["Маскарад", "в Африці — обрядове дійство з танцем, музикою й костюмом, де маска — лише частина образу."], ["Ініціація", "обряд переходу підлітків до дорослого життя."], ["Стилізація", "спрощення форм задля виразності."]], "th": [{"h": "Маска — не лише обличчя", "p": ["В Африці маска — це «дім» для духа. Той, хто одягав маску, ніби втрачав власну особистість і ставав посередником між світом людей і світом духів та предків. Маску використовували разом із костюмом (з рафії, тканини, листя), музикою та танцем. У музеях ми бачимо лише дерев’яну частину, яка без руху й звуку втрачає значну частину свого значення.", "Виготовляли маски майстри-різьбярі, які часто мали особливий статус. Дерево обирали ретельно, іноді з обрядами прохання дозволу в духа дерева."], "ul": []}, {"h": "Призначення масок", "p": [], "ul": ["обряди ініціації (посвячення юнаків і дівчат у дорослі);", "похоронні обряди та вшанування предків;", "землеробські свята — прохання про дощ і врожай;", "судові функції — «дух» у масці розв’язував суперечки;", "розважальні вистави та свята."]}, {"h": "Типи масок за формою", "p": [], "ul": ["лицьові — закривають лише обличчя (маски дан, пуну);", "маски-шоломи — надягаються на всю голову (маски народу менде);", "наголовні (гребінцеві) — кріпляться на маківці, обличчя танцюриста закрите тканиною (антилопа чі-вара народу бамана, Малі);", "наплічні — величезні, спираються на плечі (маска д’мба народу бага, Гвінея, до 1,5 м заввишки)."]}, {"h": "Відомі маски", "p": [], "ul": ["Канага (догони, Малі) — хрестоподібна надбудова, символ зв’язку неба й землі; використовується в похоронних обрядах.", "Чі-вара (бамана, Малі) — антилопа, яка, за легендою, навчила людей обробляти землю; танцюють парою «самець» і «самка».", "Маски пуну (Габон) — біле обличчя (каолін), вузькі очі, зачіска; символ духів предків і жіночої краси.", "Нгіль (фанг, Габон) — видовжене біле обличчя, серцеподібні заглибини.", "Мвана-пво (чокве, Ангола) — ідеал жіночої краси, хоча носять її чоловіки.", "Геледе (йоруба, Нігерія) — вшанування жінок-матерів, часто з цілими скульптурними сценами на маківці."]}, {"h": "Художні засоби", "p": ["Майстри використовують геометризацію, контраст опуклих і вгнутих форм, перебільшення рис (великий лоб, вузькі щілини очей, видовжене обличчя). Кольори — природні: білий (каолін — колір духів і смерті), червоний (життя, сила), чорний. Прикраси — мушлі каурі, бісер, пір’я, волокна рафії."], "ul": []}], "f": "Маски народу пуну з білими обличчями колись помилково вважали зображеннями європейців, але білий колір для пуну — це колір світу предків.", "pr": ["Створіть ескіз власної африканської маски (олівець, фломастери або аплікація з кольорового паперу/картону). Оберіть призначення маски (дощ, врожай, мудрість, сміливість) і відобразіть його через форму та символи.", "Під малюнком напишіть 3–4 речення: якого типу ваша маска, для якого обряду вона призначена, що означають її кольори."], "q": ["Чому маску в Африці вважали «домом духа»?", "Назвіть чотири типи масок за формою та наведіть приклад кожного.", "Що символізує маска чі-вара?", "Які кольори найчастіше використовують у масках і що вони означають?", "Чому маска в музеї «втрачає» частину свого змісту?"]}, {"n": "3", "t": "Татуювання та шрамування народів Африки. Макіяж та зачіски", "g": "Зрозуміти, як народи Африки використовували тіло як «полотно» для мистецтва, що означали розписи, прикраси та зачіски, та побачити в цьому систему знаків.", "k": "", "terms": [["Боді-арт", "мистецтво прикрашання тіла (розпис, татуювання, прикраси)."], ["Скарифікація (шрамування)", "нанесення на шкіру візерунків із рубців."], ["Отжизе", "суміш вохри й масла, якою жінки народу хімба (Намібія) покривають шкіру та волосся."], ["Хна", "рослинна фарба, якою в Північній Африці розписують руки й ноги."]], "th": [{"h": "Тіло як «паспорт»", "p": ["У багатьох африканських народів візерунки на тілі, прикраси та зачіска були своєрідним «паспортом»: з них можна було дізнатися, з якого людина племені, скільки їй років, чи вона одружена, чи пройшла обряд дорослішання, яке має становище в громаді. Водночас це було вираженням уявлень про красу."], "ul": []}, {"h": "Шрамування та татуювання", "p": ["Оскільки на темній шкірі звичайне татуювання погано помітне, в Тропічній Африці поширилася скарифікація — візерунки з рубців. Їх наносили під час обрядів ініціації; витримати біль означало показати мужність. Візерунки були геометричними (лінії, крапки, ромби) і відрізнялися в кожного народу.", "Сьогодні ця традиція в більшості країн зникає — молодь від неї відмовляється, а в деяких державах її обмежено законом. Її вивчають як частину історії культури.", "У Північній Африці жінки-амазиги (бербери) мали традиційні татуювання на обличчі — геометричні знаки-обереги, а також розписи хною на руках і ногах до весіль та свят."], "ul": []}, {"h": "Розпис тіла і «макіяж»", "p": [], "ul": ["Народи долини річки Омо (Ефіопія), зокрема каро, розписують тіло білою глиною, вохрою, вугіллям — візерунки нагадують леопардові плями чи крила птахів.", "Нуба (Судан) — яскравий розпис тіла, особливо в юнаків під час свят.", "Хімба (Намібія) — червонувата паста отжизе захищає від сонця і є символом краси.", "Масаї (Кенія, Танзанія) — багатоярусні намиста з бісеру: кольори означають вік, статус, стан (червоний — хоробрість, білий — чистота, синій — небо)."]}, {"h": "Зачіски", "p": ["Зачіска в Африці — справжня скульптура з волосся. Над нею працювали годинами, а то й днями. Мангбету (Конго) славилися видовженими «віялоподібними» зачісками. Фульбе (Західна Африка) плетуть коси з вплетеними мушлями каурі та монетами. Відомі сьогодні в усьому світі афрокоски, «бантуські вузлики», дреди мають африканське коріння. Складність зачіски могла вказувати на багатство, вік і сімейний стан."], "ul": []}, {"h": "Вплив на сучасну культуру", "p": ["Африканські орнаменти, розписи тіла й зачіски надихають сучасних дизайнерів одягу, фотографів, візажистів. Проте важливо ставитися до них із повагою — як до частини культурної ідентичності, а не лише «екзотики»."], "ul": []}], "f": "У мові деяких народів Західної Африки є окремі слова для десятків видів зачісок, а майстрині-перукарки мали таку саму пошану, як різьбярі масок.", "pr": ["Намалюйте контур обличчя або руки й прикрасьте його орнаментом «боді-арту» в африканському стилі: геометричні лінії, крапки, ромби, 2–3 кольори (білий, охра, чорний). Або створіть ескіз африканської зачіски.", "Підпишіть, що означає кожен елемент вашого візерунка (вигадана «мова знаків»)."], "q": ["Чому прикраси та візерунки на тілі називають «паспортом»?", "Чим скарифікація відрізняється від татуювання і чому вона поширилася в Тропічній Африці?", "Що таке отжизе і для чого його використовують?", "Про що могла «розповісти» зачіска?", "Які сучасні модні тенденції мають африканське коріння?"]}, {"n": "4", "t": "Живопис і графіка Африки. Центр сучасного африканського мистецтва — школа Пота-Пота в Конго", "g": "Ознайомитися з традиціями живопису та графіки Африки, зі школою Пота-Пота та її стилем.", "k": "", "terms": [["Гуаш", "непрозора водяна фарба, якою часто працювали художники Пота-Пота."], ["Стилізація", "умовне, спрощене зображення з підкресленням декоративності."], ["Адінкра", "символи народу ашанті (Гана), які штампують на тканині."], ["Боголан", "тканина Малі, розписана глиною («тканина з грязі»)."]], "th": [{"h": "Традиційний живопис і графіка", "p": ["Окрім наскельних малюнків, в Африці віддавна розвивалися й інші види живопису та графіки:"], "ul": ["Ефіопія — християнський іконопис і рукописні книги з мініатюрами, фрески в храмах; великі мигдалеподібні очі персонажів — характерна риса.", "Народ ндебеле (Південна Африка) — яскравий геометричний розпис стін будинків, який виконують жінки. Художниця Естер Малангу прославила цей стиль у світі (розписувала навіть автомобіль BMW).", "Тканини як «графіка»: символи адінкра (Гана), розписи боголан (Малі), вишиті тканини куба (Конго) з геометричним орнаментом."]}, {"h": "Школа Пота-Пота", "p": ["Пота-Пота — район міста Браззавіль (Республіка Конго). У 1951 році француз П’єр Лодс заснував тут майстерню-школу живопису. Він свідомо не навчав учнів європейським академічним правилам (перспективі, світлотіні), а заохочував малювати так, як вони відчувають, спираючись на африканські традиції. Так виник самобутній стиль, який згодом прославився на міжнародних виставках.", "Серед відомих художників школи — Ніколя Ондонго, Франсуа Ілокі та інші. Пізніше П’єр Лодс продовжив цю справу в Дакарі (Сенегал)."], "ul": []}, {"h": "Особливості стилю Пота-Пота", "p": [], "ul": ["площинність, відсутність перспективи;", "видовжені, стилізовані фігури людей і тварин, часто показані в русі (танці, полювання, ринок, риболовля);", "ритмічні повтори, орнаментальність;", "яскраві, насичені кольори, контрастні силуети;", "сюжети з повсякденного життя та природи Африки."]}, {"h": "Чому це «центр сучасного мистецтва»", "p": ["Школа Пота-Пота показала, що африканські художники можуть створювати сучасне мистецтво, не копіюючи Європу, а спираючись на власну традицію. Картини цієї школи купували колекціонери та музеї світу, а сама школа діє й досі."], "ul": []}], "f": "П’єр Лодс, засновник школи, не був професійним викладачем живопису — він сам вчився разом зі своїми учнями, спостерігаючи, як ті малюють.", "pr": ["Намалюйте гуашшю або фломастерами композицію в стилі Пота-Пота на тему «Африканський ринок», «Танець» або «Риболовля»: видовжені стилізовані силуети, яскраві контрастні кольори, без перспективи.", "Альтернатива: створіть «тканину адінкра» — штампи з картоплі чи гумки з простими символами."], "q": ["Хто і коли заснував школу Пота-Пота?", "Назвіть 3–4 характерні риси стилю Пота-Пота.", "Чим розпис будинків ндебеле схожий на твори художників Пота-Пота?", "Чому П’єр Лодс не навчав учнів перспективи й світлотіні?", "Які ще види живопису та графіки існували в Африці?"]}, {"n": "5", "t": "Відомі художники Африки. Малангатана Валенте Нгвенья. Атхі-Патра Руга", "g": "Познайомитися з творчістю відомих художників Африки ХХ–ХХІ ст., навчитися аналізувати їхні твори та розуміти теми, які вони порушують.", "k": "", "terms": [["Перформанс", "мистецтво дії: художник сам стає частиною твору, виконуючи дію перед глядачами."], ["Інсталяція", "просторова композиція з різних предметів і матеріалів."], ["Гобелен", "килим-картина, витканий або вишитий вручну."], ["Утопія", "вигадана ідеальна країна чи суспільство."]], "th": [{"h": "Малангатана Валенте Нгвенья (1936–2011)", "p": ["Мозамбіцький художник, поет і громадський діяч. Народився в селі на півдні Мозамбіку, у дитинстві пас худобу, працював хлопчиком-слугою в столиці. Малювати вчився у вечірній школі. Його талант помітили архітектор Панчо Гедеш, який надав йому майстерню, та інші митці.", "Коли Мозамбік боровся за незалежність від Португалії, Малангатану заарештувала португальська політична поліція, і він провів у в’язниці близько півтора року. Тема страждань, війни, насильства та боротьби за свободу стала однією з головних у його творчості."], "ul": []}, {"h": "Особливості стилю Малангатани", "p": [], "ul": ["переповнені композиції — полотно густо заповнене фігурами;", "обличчя з широко розплющеними очима та вищиреними зубами, химерні істоти, чудовиська;", "поєднання африканської міфології з реальними подіями;", "насичені червоні, сині, жовті кольори;", "монументальні настінні розписи (мурали) у Мапуту, кераміка, скульптура, поезія."]}, {"h": "", "p": ["У 1997 році ЮНЕСКО проголосило його «Художником миру». Малангатана вважається засновником сучасного живопису Мозамбіку."], "ul": []}, {"h": "Атхі-Патра Руга (нар. 1984)", "p": ["(У КТП — «Архі-Патра Руга».) Сучасний художник із Південно-Африканської Республіки. Працює в жанрах перформансу, фотографії, відео, створює яскраві гобелени, вишиті бісером і вовною.", "Головний проєкт — вигадана утопічна країна «Азанія» зі своєю історією, міфологією, героями та символами. Через неї художник розмірковує про пам’ять, ідентичність, наслідки колоніалізму й апартеїду, про те, якою могла б бути Африка майбутнього. Його персонажі — у фантастичних костюмах, наприклад, покритих повітряними кульками, — з’являються на вулицях міст під час перформансів."], "ul": []}, {"h": "Інші імена, які варто знати", "p": [], "ul": ["Ель Анатсуй (Гана) — величезні «килими-гобелени» з тисяч металевих кришечок від пляшок;", "Шері Самба (ДР Конго) — яскраві картини-комікси з написами на соціальні теми;", "Естер Малангу (ПАР) — розписи в стилі ндебеле."]}], "f": "Ель Анатсуй не використовує жодних нових матеріалів для своїх «золотих килимів»: це тисячі кришечок від пляшок, зібраних на переробних пунктах і з’єднаних мідним дротом.", "pr": ["Оберіть одну картину Малангатани або Атхі-Патра Руги (знайдіть зображення в інтернеті) і напишіть короткий аналіз за планом: 1) що зображено; 2) які кольори й чому; 3) які почуття викликає; 4) яку проблему порушує художник.", "Творче завдання: створіть власну «утопічну країну» як Атхі-Патра Руга — намалюйте її прапор, герб і героя в костюмі."], "q": ["Які події життя вплинули на творчість Малангатани?", "Назвіть характерні риси його живопису.", "Що таке «Азанія» в мистецтві Атхі-Патра Руги?", "У яких жанрах працює Атхі-Патра Руга?", "Чим схожі та чим відрізняються ці два художники?"]}, {"n": "6", "t": "Едвард Саїді Тінгатінга. Стиль тінгатінга. Вплив художників Африки на європейське мистецтво", "g": "Дізнатися про стиль тінгатінга, його засновника й особливості, а також про те, як африканське мистецтво змінило європейський живопис і скульптуру ХХ ст.", "k": "", "terms": [["Тінгатінга", "стиль живопису з Танзанії: яскраві декоративні зображення тварин і людей емалевими фарбами."], ["Примітивізм", "напрям у мистецтві кінця ХІХ — початку ХХ ст., що надихався мистецтвом «неєвропейських» народів і народною творчістю."], ["Кубізм", "напрям, що зображує предмети через геометричні форми (засновники — Пабло Пікассо і Жорж Брак)."], ["Наївне мистецтво", "творчість самоуків — щира, яскрава, декоративна."]], "th": [{"h": "Едвард Саїді Тінгатінга (1932–1972)", "p": ["Танзанійський художник-самоук. Наприкінці 1960-х років у місті Дар-ес-Салам почав малювати на квадратних дошках (мазоніті) звичайною велосипедною емалевою фарбою. Його яскраві картини із зображенням тварин швидко стали популярними серед туристів.", "Тінгатінга навчив малювати своїх родичів і друзів. У 1972 році він трагічно загинув, але його послідовники продовжили справу: у Дар-ес-Саламі й досі працює кооператив художників тінгатінга."], "ul": []}, {"h": "Особливості стилю тінгатінга", "p": [], "ul": ["головні герої — тварини Африки: леопарди, жирафи, слони, птахи, риби, а також сцени з життя людей;", "яскраві, чисті, «соковиті» кольори, часто однотонне тло;", "чіткий контур, площинність, відсутність тіней і перспективи;", "декоративні візерунки на тілах тварин (плями, смужки, крапки);", "гумор, казковість, доброзичливість образів;", "емалева фарба дає блискучу поверхню."]}, {"h": "Вплив Африки на європейське мистецтво", "p": ["На початку ХХ ст. африканські маски й статуетки почали потрапляти до музеїв і антикварних крамниць Парижа. Молоді художники, які шукали нових шляхів у мистецтві, побачили в них небачену силу виразності: сміливе спрощення форм, геометризацію, емоційність."], "ul": ["Пабло Пікассо — картина «Авіньйонські панянки» (1907): обличчя двох жінок нагадують африканські маски. Цей твір став передвісником кубізму. Період 1907–1909 рр. у творчості Пікассо називають «африканським».", "Анрі Матісс, Андре Дерен, Моріс де Вламінк колекціонували африканські маски.", "Амедео Модільяні — видовжені обличчя й шиї його портретів і скульптур навіяні масками народу бауле.", "Константин Бринкузі — узагальнені, спрощені скульптурні форми.", "Німецькі експресіоністи (об’єднання «Міст», Ернст Людвіг Кірхнер) — різкі кольори, спрощені форми."]}, {"h": "", "p": ["Так мистецтво Африки стало одним із джерел модернізму — і сьогодні європейське мистецтво вже неможливо уявити без цього впливу."], "ul": []}], "f": "Пікассо спочатку заперечував вплив африканських масок на «Авіньйонських панянок», але пізніше визнав, що відвідування етнографічного музею в Парижі стало для нього «одкровенням».", "pr": ["Намалюйте тварину в стилі тінгатінга (гуаш, акрил або фломастери): яскраве однотонне тло, чіткий контур, декоративні візерунки на тілі, жодних тіней.", "Порівняйте африканську маску і картину Пікассо «Авіньйонські панянки»: знайдіть 3 спільні риси й запишіть їх."], "q": ["Хто такий Едвард Саїді Тінгатінга і які матеріали він використовував?", "Назвіть 4 риси стилю тінгатінга.", "Яка картина Пікассо вважається прикладом впливу африканських масок?", "Що таке примітивізм?", "Які ще європейські митці зазнали впливу африканського мистецтва?"]}, {"n": "7", "t": "Музика та література Африки", "g": "Ознайомитися з особливостями традиційної та сучасної музики Африки, її інструментами, а також з усною творчістю та відомими письменниками континенту.", "k": "", "terms": [["Поліритмія", "одночасне звучання кількох різних ритмів."], ["Заклик-відповідь", "спосіб виконання: соліст «запитує», хор або інструменти «відповідають»."], ["Гріоти", "співці-оповідачі Західної Африки, хранителі історії та родоводів."], ["Негритюд", "літературний рух, що утверджував цінність африканської культури (Л. С. Сенгор)."]], "th": [{"h": "Особливості африканської музики", "p": ["Для африканців музика — невід’ємна частина життя: нею супроводжують роботу, свята, обряди, навіть суперечки. Найважливіше в ній — ритм. Кілька барабанщиків можуть одночасно грати різні ритмічні малюнки, які складаються в складну поліритмію. Музика нерозривно пов’язана з танцем і співом."], "ul": ["поліритмія та імпровізація;", "принцип «заклик-відповідь»;", "колективне виконання, участь усіх присутніх (плескання, притупування);", "«мовні» барабани, що імітують інтонації мови."]}, {"h": "Музичні інструменти", "p": [], "ul": ["джембе — барабан у формі келиха (Західна Африка);", "«говорячий» барабан (дундун) — змінює висоту звуку, коли музикант стискає шнури;", "кора — 21-струнний інструмент (поєднання арфи й лютні), на якому грають гріоти;", "балафон — дерев’яний ксилофон із гарбузами-резонаторами;", "мбіра (калімба) — металеві язички на дощечці (Зімбабве);", "шекере — гарбуз, обплетений сіткою з намистинами."]}, {"h": "Сучасна музика", "p": ["Африканська музика стала основою багатьох світових стилів: спірічуелс, блюзу, джазу, а через них — року, фанку, хіп-хопу. Сучасні африканські стилі — хайлайф (Гана), афробіт (Фела Куті, Нігерія), сукус (Конго), мбалах (Юссу Н’Дур, Сенегал), «пустельний блюз» (Алі Фарка Туре, Малі). Міріам Макеба (ПАР), яку називали «Мама Африка», прославилася піснею «Pata Pata». Сьогодні популярні афробітс-виконавці Burna Boy і Wizkid (Нігерія)."], "ul": []}, {"h": "Література Африки", "p": ["Протягом століть африканська література була усною: казки, прислів’я, загадки, епоси. Найвідоміший — епос про Сундіату, засновника імперії Малі, який передавали з покоління в покоління гріоти.", "У ХХ ст. сформувалася писемна література африканськими, англійською, французькою, арабською мовами. Поет Леопольд Седар Сенгор (перший президент Сенегалу) був одним із засновників руху негритюду. Роман Чинуа Ачебе «Усе розпадається» (1958, Нігерія) — один із найвідоміших африканських романів."], "ul": []}, {"h": "Нобелівські лауреати з Африки", "p": [], "ul": ["Воле Шоїнка (Нігерія, 1986) — перший африканець-лауреат;", "Нагіб Махфуз (Єгипет, 1988);", "Надін Гордимер (ПАР, 1991);", "Джон Максвелл Кутзее (ПАР, 2003);", "Абдулразак Гурна (Танзанія, 2021)."]}], "f": "Слово «банджо», ймовірно, має африканське походження — цей інструмент привезли до Америки поневолені африканці.", "pr": ["Прослухайте 2 музичні фрагменти (гра на корі та Міріам Макеба або Burna Boy) і заповніть таблицю: назва, інструменти, темп, настрій, що нагадує.", "Спробуйте поліритмію: одна рука плескає по столу рівно на «раз-два-три-чотири», інша — на «раз-і-три». Опишіть відчуття.", "Знайдіть і запишіть 3 африканські прислів’я та поясніть їхній зміст."], "q": ["Що таке поліритмія і принцип «заклик-відповідь»?", "Назвіть 4 африканські музичні інструменти.", "Хто такі гріоти?", "Які світові музичні стилі мають африканське коріння?", "Назвіть двох африканських письменників — лауреатів Нобелівської премії."]}, {"n": "8", "t": "Кінематограф Африки", "g": "Дізнатися про становлення кіно в Африці, найвідоміших режисерів, кіноіндустрію Нігерії (Нолівуд) та провідні кінофестивалі континенту.", "k": "", "terms": [["Нолівуд", "кіноіндустрія Нігерії; одна з найбільших у світі за кількістю фільмів."], ["ФЕСПАКО", "Панафриканський кінофестиваль у Уагадугу (Буркіна-Фасо)."], ["Афрофутуризм", "напрям, що поєднує африканську культуру з фантастикою та технологіями майбутнього."]], "th": [{"h": "Початки", "p": ["У колоніальну добу фільми про Африку знімали здебільшого європейці, і африканці бачили себе на екрані очима чужинців. Після здобуття незалежності (1950–1960-ті рр.) з’явилися власні режисери, які розповідали історії зсередини."], "ul": []}, {"h": "Усман Сембен — «батько африканського кіно»", "p": ["Сенегальський письменник і режисер Усман Сембен (1923–2007) зняв фільм «Чорна дівчина» (1966) — один із перших повнометражних фільмів режисера з Тропічної Африки. Його фільми порушують теми колоніалізму, бідності, прав жінок."], "ul": []}, {"h": "ФЕСПАКО", "p": ["З 1969 року в столиці Буркіна-Фасо Уагадугу відбувається Панафриканський кінофестиваль ФЕСПАКО — найбільший кінофорум Африки. Він проходить раз на два роки, головна нагорода — «Золотий жеребець Єнненги»."], "ul": []}, {"h": "Нолівуд", "p": ["Нігерійська кіноіндустрія виникла на початку 1990-х років. Відправною точкою вважають фільм «Життя в неволі» (1992), знятий на відеокамеру. Фільми Нолівуду знімають швидко й недорого, вони розповідають про родинні стосунки, кохання, гроші, традиції та сучасне місто. Сьогодні Нолівуд випускає тисячі фільмів на рік, а нігерійські фільми й серіали доступні на міжнародних стрімінгових платформах."], "ul": []}, {"h": "Інші кінематографії", "p": [], "ul": ["Єгипет — давня кіношкола, яку називали «Голлівудом Близького Сходу»; режисер Юсеф Шахін;", "ПАР — фільм «Цоці» (2005) отримав «Оскар» як найкращий іноземний фільм;", "Мавританія — «Тімбукту» (2014) Абдеррахмана Сіссако номінувався на «Оскар»."]}, {"h": "Африка у світовому кіно", "p": ["Африканська природа й культура надихнули мультфільм «Король Лев» (1994). Фільм «Чорна пантера» (2018) став яскравим прикладом афрофутуризму: костюми, архітектура та музика вигаданої країни Ваканди поєднують африканські традиції з технологіями майбутнього."], "ul": []}], "f": "За кількістю фільмів, що випускаються щороку, Нолівуд поступається лише індійському кіно і випереджає Голлівуд.", "pr": ["Перегляньте трейлер «Чорної пантери» або «Короля Лева» і знайдіть у ньому елементи африканської культури (візерунки, костюми, музика, маски, зачіски). Запишіть 5 прикладів.", "Придумайте ідею короткого фільму про Африку (5–6 речень): жанр, головний герой, де відбувається дія, яку африканську традицію він покаже."], "q": ["Чому Усмана Сембена називають «батьком африканського кіно»?", "Що таке ФЕСПАКО?", "Які особливості фільмів Нолівуду?", "Що таке афрофутуризм? Наведіть приклад.", "Назвіть африканські фільми, відзначені на «Оскарі»."]}, {"n": "9", "t": "Урок узагальнення знань. Мистецтво африканського культурного регіону", "g": "Повторити й систематизувати знання про мистецтво Африки, перевірити себе та виконати творчий проєкт.", "k": "", "terms": [], "th": [{"h": "Повторюємо головне", "p": [], "ul": ["Наскельний живопис: Тассілін-Аджер (Сахара), Драконові гори (народ сан).", "Скульптура: Нок (теракота), Іфе, Бенін (бронза), статуетки предків, нкісі.", "Маски: лицьові, шоломи, наголовні, наплічні; канага, чі-вара, пуну, мвана-пво.", "Мистецтво тіла: скарифікація, розпис, прикраси масаїв, зачіски.", "Живопис: іконопис Ефіопії, розписи ндебеле, школа Пота-Пота (П. Лодс, 1951), тінгатінга.", "Художники: Малангатана, Атхі-Патра Руга, Ель Анатсуй.", "Вплив: примітивізм, Пікассо («Авіньйонські панянки»), Модільяні, Матісс.", "Музика: поліритмія, джембе, кора, мбіра; гріоти; афробіт, Міріам Макеба.", "Література: епос про Сундіату, Ачебе, Шоїнка, Сенгор.", "Кіно: Усман Сембен, ФЕСПАКО, Нолівуд, афрофутуризм."]}], "f": "", "pr": ["Тест (запишіть відповіді):", "1) Де розташоване плато Тассілін-Аджер? 2) Яка культура створила найдавніші теракотові голови? 3) Маска народу бамана у вигляді антилопи — це … 4) Хто заснував школу Пота-Пота? 5) Якою фарбою малював Тінгатінга? 6) Яка картина Пікассо пов’язана з африканськими масками? 7) Кора — це … 8) Хто такі гріоти? 9) Як називається кіноіндустрія Нігерії? 10) Де проходить фестиваль ФЕСПАКО?", "Творчий проєкт (оберіть один): а) віртуальна виставка «Мистецтво Африки» — 8–10 слайдів; б) власна маска з картону з описом її призначення; в) картина в стилі тінгатінга або Пота-Пота; г) плакат «Африка, що змінила світове мистецтво»."], "q": ["Що найбільше вразило вас у мистецтві Африки і чому?", "Як мистецтво Африки пов’язане з вірою та обрядами?", "Які африканські впливи ви помічаєте в сучасній моді, музиці, кіно?"]}]}, {"name": "Тема 2. Мистецтво американського культурного регіону (8 год.)", "lessons": [{"n": "10", "t": "Мистецтво доколумбової Америки: майя, ацтеки, інки", "g": "Дізнатися про мистецтво давніх цивілізацій Америки до приходу європейців, їхню архітектуру, скульптуру та декоративне мистецтво.", "k": "", "terms": [["Доколумбова Америка", "період історії Америки до 1492 р., коли туди прибув Христофор Колумб."], ["Ступінчаста піраміда", "споруда з кількох ярусів-терас зі сходами й храмом нагорі."], ["Стела", "вертикальна кам’яна плита з рельєфами та написами."], ["Кіпу", "система вузликів на шнурах, якою інки вели облік."]], "th": [{"h": "Предтечі: ольмеки", "p": ["Найдавніша розвинена культура Центральної Америки — ольмеки (ІІ–І тис. до н. е., узбережжя Мексиканської затоки). Вони залишили гігантські базальтові голови заввишки до 3 м — ймовірно, портрети правителів у шоломах."], "ul": []}, {"h": "Майя", "p": ["Цивілізація майя існувала на півострові Юкатан і в сучасних Гватемалі, Белізі, Гондурасі. Майя мали ієрогліфічне письмо, точний календар, знали число «нуль». Їхні міста — Тікаль, Паленке, Чичен-Іца, Копан."], "ul": ["Архітектура: ступінчасті піраміди з храмами нагорі, палаци, обсерваторії, майданчики для гри в м’яч. Піраміда Кукулькана в Чичен-Іці побудована так, що в дні рівнодення тінь на сходах утворює «змію», що сповзає донизу.", "Скульптура: стели та рельєфи з зображеннями правителів і ієрогліфами; нефритова маска правителя Пакаля з Паленке.", "Живопис: фрески Бонампака — яскраві сцени битв, свят і церемоній.", "Кераміка: розписні посудини з міфологічними сюжетами."]}, {"h": "Ацтеки", "p": ["Ацтеки заснували столицю Теночтітлан (1325 р.) на острові посеред озера — на її місці нині Мехіко. Місто вражало іспанців своїми розмірами, каналами й храмами."], "ul": ["Великий храм (Темпло Майор) з двома святилищами на вершині.", "«Камінь Сонця» (ацтекський календар) — базальтовий диск діаметром близько 3,6 м і вагою близько 24 т.", "Мистецтво з пір’я: головний убір, пов’язаний із правителем Монтесумою, зберігається у Відні.", "Мозаїчні маски з бірюзи, нефриту, мушель."]}, {"h": "", "p": ["Поруч з ацтеками варто згадати давнє місто Теотіуакан з пірамідами Сонця і Місяця, яке ацтеки вже застали в руїнах і вважали «місцем, де народилися боги»."], "ul": []}, {"h": "Інки", "p": ["Імперія інків простягалася вздовж Анд (Перу, Еквадор, Болівія, Чилі). Столиця — Куско."], "ul": ["Кам’яна кладка без розчину: блоки підігнані так щільно, що між ними не пройде лезо ножа. У Куско є знаменитий «камінь з 12 кутами».", "Мачу-Пікчу (XV ст.) — місто високо в горах, об’єкт Всесвітньої спадщини ЮНЕСКО.", "Ювелірне мистецтво із золота і срібла (золото інки називали «потом Сонця»), більшість виробів переплавили конкістадори.", "Ткацтво — тканини з вовни лам і альпак із геометричним візерунком цінувалися вище за золото.", "Задовго до інків культура наска залишила гігантські малюнки на поверхні пустелі — «лінії Наска»."]}], "f": "Майя використовували у своїй системі числення знак нуля на кілька століть раніше, ніж він поширився в Європі.", "pr": ["Заповніть порівняльну таблицю «Майя — Ацтеки — Інки»: територія, столиця/міста, архітектура, скульптура, декоративне мистецтво, цікавий факт.", "Намалюйте ескіз «календаря» за мотивами «Каменя Сонця»: коло, поділене на сектори з вашими власними символами для кожного місяця."], "q": ["Що залишили після себе ольмеки?", "Яке «диво» можна побачити на піраміді Кукулькана в дні рівнодення?", "Що таке «Камінь Сонця»?", "Чим уславилися інки-будівельники?", "Чому до нас дійшло так мало золотих виробів доколумбової Америки?"]}, {"n": "11", "t": "Культура США. Американська філософія", "g": "Зрозуміти особливості формування культури США, її цінності та ідеї американських мислителів, що вплинули на мистецтво й освіту.", "k": "", "terms": [["«Плавильний котел»", "образ американського суспільства, де змішуються культури різних народів."], ["«Американська мрія»", "віра в те, що кожен завдяки праці може досягти успіху."], ["Трансценденталізм", "філософський рух ХІХ ст. про єдність людини й природи, довіру до внутрішнього голосу."], ["Прагматизм", "філософія, що оцінює ідеї за їхньою практичною користю."]], "th": [{"h": "Країна іммігрантів", "p": ["Культура США формувалася з культур корінних народів Америки, переселенців з Англії, Ірландії, Німеччини, Італії, Східної Європи (зокрема й України), поневолених африканців, пізніше — іммігрантів з Латинської Америки та Азії. Тому американську культуру часто порівнюють із «плавильним котлом» або «салатом», де кожен інгредієнт зберігає свій смак.", "Головні цінності, закладені в Декларації незалежності (1776), — свобода, рівність, право на «пошук щастя». Символ свободи — Статуя Свободи в Нью-Йорку (1886), подарунок Франції; її автор — скульптор Фредерік Огюст Бартольді."], "ul": []}, {"h": "Трансценденталісти", "p": [], "ul": ["Ральф Волдо Емерсон (1803–1882) — есе «Природа», «Довіра до себе»: людина має покладатися на власний розум і інтуїцію, а природа — джерело духовності.", "Генрі Девід Торо (1817–1862) — книга «Волден, або Життя в лісі» про два роки життя в хатині біля озера; есе «Громадянська непокора» вплинуло на Махатму Ганді та Мартіна Лютера Кінга."]}, {"h": "Прагматизм — «американська філософія»", "p": [], "ul": ["Чарльз Пірс — засновник прагматизму;", "Вільям Джеймс — психолог і філософ: істинне те, що «працює» в житті;", "Джон Дьюї — реформатор освіти, ідея «навчання через дію»; на його думках ґрунтуються проєктне навчання й сучасні школи."]}, {"h": "Література", "p": ["Волт Вітмен («Листя трави») — співець демократії та свободи; Марк Твен («Пригоди Тома Сойєра», «Пригоди Гекльберрі Фінна»); Ернест Хемінгуей («Старий і море»), Джон Стейнбек, Рей Бредбері. Твори цих авторів сформували образ Америки у світі."], "ul": []}, {"h": "Культурні інституції", "p": ["У США діють одні з найбільших музеїв світу: Метрополітен-музей і Музей сучасного мистецтва (MoMA) в Нью-Йорку, Смітсонівський інститут у Вашингтоні. Велику роль відіграють приватні меценати та фонди, які фінансують музеї, театри й університети."], "ul": []}], "f": "Генрі Девід Торо прожив у хатині біля озера Волден 2 роки, 2 місяці та 2 дні — він хотів перевірити, скільки насправді потрібно людині для щастя.", "pr": ["Прочитайте цитату Р. В. Емерсона: «Довіряй собі: кожне серце відгукується на цю залізну струну». Напишіть міні-есе (8–10 речень): чи згодні ви з нею, як вона стосується вашого життя.", "Складіть «ментальну карту» (схему) «Культура США»: у центрі — США, гілки — народи, цінності, філософи, письменники, символи."], "q": ["Чому культуру США називають «плавильним котлом»?", "Що таке «американська мрія»?", "Назвіть ідеї Емерсона й Торо.", "Що означає прагматизм? Хто його представники?", "Як ідеї Джона Дьюї вплинули на освіту?"]}, {"n": "12", "t": "Американська архітектура", "g": "Простежити розвиток архітектури США від колоніальних будівель до хмарочосів і сучасних споруд, знати імена провідних архітекторів.", "k": "", "terms": [["Хмарочос", "багатоповерхова будівля з металевим каркасом."], ["Функціоналізм", "принцип: «форма відповідає функції» (Луїс Салліван)."], ["Ар-деко", "стиль 1920–1930-х рр.: геометричні орнаменти, блиск металу, ступінчасті силуети."], ["Органічна архітектура", "будівля, що гармонійно зливається з природою (Ф. Л. Райт)."], ["Деконструктивізм", "стиль із «ламаними», хвилястими формами, що ніби порушують правила."]], "th": [{"h": "Від колоній до класицизму", "p": ["Перші європейські поселенці будували дерев’яні та цегляні будинки за англійськими зразками (колоніальний стиль). Після здобуття незалежності архітектура звернулася до античності як символу демократії: так постали Капітолій і Білий дім у Вашингтоні, садиба Монтічелло Томаса Джефферсона."], "ul": []}, {"h": "Народження хмарочоса", "p": ["Після пожежі 1871 р. Чикаго відбудовували заново — тут і народилася «чиказька школа». 1885 р. архітектор Вільям Ле Барон Дженні спорудив Home Insurance Building із металевим каркасом — його вважають першим хмарочосом. Луїс Салліван сформулював принцип «форма відповідає функції». Ліфт і сталевий каркас дозволили будувати все вище."], "ul": ["Флетайрон-білдинг (1902, Нью-Йорк) — будівля-«праска» на трикутній ділянці;", "Крайслер-білдинг (1930) — шедевр ар-деко з блискучим шпилем;", "Емпайр-стейт-білдинг (1931) — 102 поверхи, упродовж десятиліть найвища будівля світу;", "Всесвітній торговий центр 1 (2014) — 541 м (1776 футів — на згадку про рік незалежності)."]}, {"h": "Великі архітектори", "p": [], "ul": ["Френк Ллойд Райт — «органічна архітектура»: будинок «Над водоспадом» (1930-ті рр.), що нависає над потоком; музей Гуґґенгайма в Нью-Йорку (1959) зі спіральною рампою всередині.", "Людвіг Міс ван дер Рое — «менше — це більше»: скляні прямокутні будівлі (Сіграм-білдинг, 1958).", "Френк Гері — деконструктивізм: концертний зал імені Волта Діснея в Лос-Анджелесі (2003) з хвилястими металевими «вітрилами»."]}, {"h": "Інженерні символи", "p": ["Бруклінський міст (1883) і міст «Золоті ворота» в Сан-Франциско (1937) — символи інженерної сміливості. Гора Рашмор із вирізьбленими головами чотирьох президентів — поєднання архітектури, скульптури та ландшафту."], "ul": []}], "f": "Будинок «Над водоспадом» Ф. Л. Райт спроєктував, за легендою, лише за кілька годин — перед приїздом замовника, хоча обмірковував ідею кілька місяців.", "pr": ["Складіть «стрічку часу» американської архітектури: 6–8 споруд з датами та коротким описом.", "Намалюйте ескіз власного хмарочоса в одному зі стилів (ар-деко, функціоналізм, деконструктивізм). Поясніть, як його форма пов’язана з призначенням."], "q": ["Чому ранні будівлі США нагадують античні храми?", "Де і коли з’явився перший хмарочос?", "Що означає принцип «форма відповідає функції»?", "Що таке органічна архітектура? Наведіть приклад.", "Назвіть три знамениті хмарочоси Нью-Йорка."]}, {"n": "13", "t": "Театр. Кінематограф США", "g": "Дізнатися про американський театр, бродвейський мюзикл, історію Голлівуду, його жанри та видатних митців.", "k": "", "terms": [["Бродвей", "театральний район Нью-Йорка; синонім комерційного театру найвищого рівня."], ["Мюзикл", "музично-сценічний жанр, що поєднує драму, спів, танець."], ["«Тоні»", "головна театральна премія США."], ["«Оскар»", "премія Американської академії кінематографічних мистецтв і наук (з 1929 р.)."]], "th": [{"h": "Американський театр", "p": ["Бродвей — вулиця й район у Нью-Йорку, де зосереджено близько 40 великих театрів. Саме тут сформувався мюзикл — «візитівка» американського театру: «Плавучий театр» (1927), «Вестсайдська історія» (1957, музика Леонарда Бернстайна — сучасна версія «Ромео і Джульєтти»), «Кішки», «Привид опери» (найдовше в історії Бродвею йшов на сцені), «Гамільтон» (2015)."], "ul": ["Драматурги: Юджин О’Ніл, Теннессі Вільямс («Трамвай “Бажання”»), Артур Міллер («Смерть комівояжера»).", "Поряд з Бродвеєм існують «Офф-Бродвей» та експериментальні театри."]}, {"h": "Голлівуд", "p": ["Голлівуд — район Лос-Анджелеса, де з 1910-х років зосередилися кіностудії (сонячна погода, різноманітні краєвиди поблизу). Етапи розвитку:"], "ul": ["німе кіно: Чарлі Чаплін — образ «маленького бродяги»;", "1927 — «Співак джазу», перший повнометражний фільм із синхронним звуком;", "1937 — «Білосніжка і семеро гномів» Волта Діснея, перший повнометражний мальований мультфільм студії;", "«золота доба» (1930–1950-ті): вестерни, мюзикли, «Віднесені вітром», «Касабланка»;", "«новий Голлівуд» і блокбастери: Стівен Спілберг («Щелепи», «Парк юрського періоду»), Джордж Лукас («Зоряні війни»), Мартін Скорсезе;", "сьогодні — комп’ютерна графіка, анімація Pixar, стрімінгові платформи."]}, {"h": "Жанри американського кіно", "p": ["Вестерн, мюзикл, фільм-нуар, фантастика, фільм жахів, супергеройське кіно, анімація. Систему «зірок» і величезні бюджети створив саме Голлівуд."], "ul": []}, {"h": "Українці в Голлівуді", "p": ["Українське коріння мали актор Джек Паланс (Володимир Палагнюк), а також інші відомі діячі кіно; актриса Мілла Йовович народилася в Києві."], "ul": []}], "f": "Знаменитий напис HOLLYWOOD на пагорбах спочатку був рекламою житлового району «Hollywoodland» (1923), а останні чотири літери прибрали 1949 р.", "pr": ["Оберіть один американський фільм, який ви бачили, і напишіть рецензію за планом: жанр, режисер, сюжет (2–3 речення), що вразило, які засоби кіно (музика, операторська робота, спецефекти) найсильніші.", "Перегляньте фрагмент мюзиклу («Вестсайдська історія», «Кішки» тощо) і визначте, як музика, танець і слово передають емоції героїв."], "q": ["Що таке Бродвей і чим відомий мюзикл?", "Чому кіностудії переїхали саме до Голлівуду?", "Назвіть головні етапи розвитку американського кіно.", "Яким фільмом розпочалося звукове кіно?", "Назвіть трьох видатних режисерів США."]}, {"n": "14", "t": "Американська народна музика. Сучасна музика США. Танці", "g": "Простежити шлях американської музики від спірічуелс і блюзу до джазу, року й хіп-хопу, ознайомитися з американськими танцями.", "k": "", "terms": [["Спірічуелс", "духовні пісні афроамериканців."], ["Блюз", "жанр із характерною 12-тактовою формою та «блюзовими нотами»; пісні-«сповідь» про смуток і надію."], ["Регтайм", "фортепіанна музика з «розірваним» (синкопованим) ритмом."], ["Джаз", "музика, що поєднує африканські ритми, європейську гармонію та імпровізацію."], ["Кантрі", "музика білих фермерів півдня США (гітара, банджо, скрипка)."]], "th": [{"h": "Народні витоки", "p": ["Американська музика виросла з двох джерел: музики африканців (ритм, «заклик-відповідь», імпровізація) та пісень європейських переселенців (балади, скрипкові наспіви). На їхньому перетині з’явилися:"], "ul": ["спірічуелс і госпел — духовні пісні;", "блюз — з дельти Міссісіпі; Роберт Джонсон, Бі Бі Кінг;", "регтайм — Скотт Джоплін («Maple Leaf Rag», 1899);", "кантрі — Нешвілл, Джонні Кеш, Доллі Партон."]}, {"h": "Джаз", "p": ["Джаз народився на початку ХХ ст. в Новому Орлеані. Його основа — імпровізація і свінг. Видатні музиканти: Луї Армстронг (труба, характерний хрипкий голос), Дюк Еллінгтон (біг-бенд), Елла Фіцджеральд («перша леді джазу»), Майлз Девіс.", "Композитор Джордж Гершвін поєднав джаз і класику: «Рапсодія в блюзових тонах» (1924), опера «Поргі та Бесс» (1935). За поширеною версією, колискова «Summertime» з цієї опери навіяна українською колисковою «Ой ходить сон коло вікон», яку Гершвін почув у виконанні Українського національного хору Олександра Кошиця."], "ul": []}, {"h": "Сучасна музика США", "p": [], "ul": ["рок-н-рол (1950-ті) — Елвіс Преслі, Чак Беррі;", "соул і фанк — Арета Франклін, Джеймс Браун;", "поп-музика — Майкл Джексон («король попу»), Мадонна, Бейонсе, Тейлор Свіфт;", "хіп-хоп (1970-ті, Бронкс, Нью-Йорк) — реп, діджеїнг, брейкданс, графіті."]}, {"h": "Танці", "p": [], "ul": ["степ (теп-денс) — ритм вибивають металевими набійками на взутті;", "чарльстон (1920-ті) — енергійний танець доби джазу;", "свінг, лінді-хоп — парні танці під біг-бенди;", "рок-н-рол — акробатичний парний танець;", "сквер-данс і лайн-данс — народні танці кантрі;", "брейкданс і хіп-хоп — вуличні танці, брейкінг навіть став олімпійським видом спорту (2024)."]}], "f": "Брейкінг дебютував на Олімпійських іграх у Парижі 2024 року — одне з небагатьох мистецтв, що стало олімпійським видом спорту.", "pr": ["Прослухайте «Summertime» Гершвіна та українську колискову «Ой ходить сон коло вікон». Запишіть, що в них спільного (настрій, мелодія, темп) і чим вони відрізняються.", "Складіть «музичне дерево» США: корінь — африканська й європейська музика, стовбур — блюз і джаз, гілки — сучасні стилі. Позначте на кожній гілці одного виконавця."], "q": ["Які два джерела сформували американську музику?", "Що таке блюз і регтайм?", "Де народився джаз? Назвіть його видатних виконавців.", "Чим відомий Джордж Гершвін?", "Назвіть 4 американські танці та їхні особливості."]}, {"n": "15", "t": "Американський живопис", "g": "Ознайомитися з основними етапами та напрямами живопису США — від пейзажистів ХІХ ст. до абстрактного експресіонізму, поп-арту й стріт-арту.", "k": "", "terms": [["Реалізм", "правдиве зображення дійсності."], ["Абстрактний експресіонізм", "напрям, у якому художник передає почуття через колір, лінію, жест без зображення предметів."], ["Поп-арт", "мистецтво, що використовує образи масової культури: рекламу, комікси, упаковки."], ["Стріт-арт", "вуличне мистецтво, графіті."]], "th": [{"h": "ХІХ ст.: пейзаж і реалізм", "p": [], "ul": ["Школа річки Гудзон (Томас Коул) — величні романтичні пейзажі дикої природи Америки;", "Вінслоу Гомер — море, рибалки, сила стихії;", "Джеймс Вістлер («Мати художника»), Джон Сінгер Сарджент (портрети)."]}, {"h": "Перша половина ХХ ст.", "p": [], "ul": ["Едвард Гоппер — самотність людини у великому місті («Нічні яструби», 1942);", "Грант Вуд — «Американська готика» (1930), одна з найвідоміших картин США;", "Джорджія О’Кіф — величезні квіти й пейзажі пустель;", "Норман Роквелл — ілюстрації, що створили образ «ідеальної» Америки."]}, {"h": "Абстрактний експресіонізм (1940–1950-ті)", "p": ["Після Другої світової війни центр світового мистецтва перемістився з Парижа до Нью-Йорка. Джексон Поллок розкладав полотно на підлозі та розбризкував фарбу — «живопис дії». Марк Ротко створював великі полотна з м’якими прямокутниками кольору, що мали викликати глибокі почуття."], "ul": []}, {"h": "Поп-арт (1960-ті)", "p": ["Енді Воргол — «Банки супу Campbell’s» (1962), «Мерилін»; він тиражував образи методом шовкографії, як на фабриці (його майстерня так і називалася — «Фабрика»). Рой Ліхтенштейн збільшував кадри коміксів із характерними крапками. Поп-арт поставив запитання: що таке мистецтво в епоху реклами й масового виробництва?"], "ul": []}, {"h": "Стріт-арт", "p": ["Жан-Мішель Баскія починав із графіті на стінах Нью-Йорка, а став одним із найдорожчих художників. Кіт Гарінг — яскраві «танцюючі» чоловічки на станціях метро."], "ul": []}, {"h": "Українське коріння", "p": ["Олександр Архипенко (скульптор, народився в Києві) став одним із новаторів скульптури ХХ ст. і тривалий час працював у США. Скульпторка Луїза Невелсон народилася в Переяславі."], "ul": []}], "f": "Енді Воргол казав: «У майбутньому кожен матиме свої 15 хвилин слави» — ця фраза стала крилатою ще задовго до соцмереж.", "pr": ["Створіть власну роботу в стилі поп-арт: оберіть звичайний предмет (пляшку, пачку чипсів, кросівок) і намалюйте його 4 рази різними яскравими кольорами, як Воргол.", "Або: порівняйте «Нічних яструбів» Гоппера і картину Поллока — що хотів сказати кожен художник і якими засобами?"], "q": ["Що зображували художники школи річки Гудзон?", "Яку тему розкриває Едвард Гоппер?", "Що таке «живопис дії»?", "Які образи використовує поп-арт? Назвіть його представників.", "Хто з американських митців має українське коріння?"]}, {"n": "16", "t": "Мистецтво Латинської Америки. Карнавал", "g": "Дізнатися про мистецтво країн Латинської Америки — архітектуру, живопис, музику й танці — та про традиції карнавалу.", "k": "", "terms": [["Мексиканський муралізм", "монументальні настінні розписи на історичні та соціальні теми."], ["Карнавал", "масове вуличне свято з костюмами, музикою й танцями перед Великим постом."], ["Школа самби", "об’єднання, що готує виступ на карнавалі в Ріо."], ["Самбодром", "спеціальна «вулиця-стадіон» для параду шкіл самби в Ріо-де-Жанейро."]], "th": [{"h": "Поєднання культур", "p": ["Латинська Америка — це Мексика, Центральна та Південна Америка, острови Карибського моря, де говорять переважно іспанською та португальською мовами. Її культура постала з поєднання традицій корінних народів, європейців (іспанців і португальців) та африканців."], "ul": []}, {"h": "Архітектура і скульптура", "p": [], "ul": ["колоніальне бароко — пишні собори та церкви (Мехіко, Куско, Оуру-Прету в Бразилії); скульптор Алейжадінью;", "статуя Христа-Спасителя на горі Корковаду в Ріо-де-Жанейро (1931) — близько 30 м заввишки, одне з «нових семи чудес світу»;", "Оскар Німейєр — модерністська архітектура нової столиці Бразилії, міста Бразиліа (1960)."]}, {"h": "Живопис", "p": [], "ul": ["мексиканські муралісти Дієго Рівера, Хосе Клементе Ороско, Давид Альфаро Сікейрос — величезні фрески про історію народу;", "Фріда Кало — щирі й символічні автопортрети, яскраві мексиканські мотиви;", "Фернандо Ботеро (Колумбія) — «об’ємні», пишні фігури людей і тварин."]}, {"h": "Музика й танці", "p": [], "ul": ["танго (Аргентина, Буенос-Айрес) — пристрасний парний танець; композитор Астор П’яццолла;", "самба та боса-нова (Бразилія) — «Дівчина з Іпанеми» Антоніу Карлуса Жобіма;", "сальса, румба, ча-ча-ча (Куба), меренге (Домінікана);", "мексиканська музика маріачі — ансамблі в сомбреро зі скрипками, гітарами, трубами."]}, {"h": "Карнавал", "p": ["Найвідоміший карнавал світу — у Ріо-де-Жанейро. Він відбувається щороку перед Великим постом. Головна подія — парад шкіл самби на Самбодромі (спроєктованому Оскаром Німейєром): кожна школа цілий рік готує виступ на певну тему — костюми, величезні рухомі платформи, власну пісню-самбу, сотні барабанщиків (батерія). Журі оцінює музику, костюми, хореографію, гармонію.", "Інші відомі карнавали: у Салвадорі (Бразилія) — вуличний, з вантажівками-сценами; у Барранкільї (Колумбія) та Оруро (Болівія) — внесені до списку нематеріальної спадщини ЮНЕСКО. У Мексиці — свято День мертвих з яскравими черепами-калаверами та квітами."], "ul": []}], "f": "Костюми для одного виступу школи самби в Ріо можуть шити цілий рік, а в параді однієї школи беруть участь кілька тисяч учасників.", "pr": ["Створіть ескіз карнавального костюма або маски для параду в Ріо на обрану тему (наприклад, «Україна», «Космос», «Океан»). Використайте яскраві кольори, пір’я, блискітки (можна колаж).", "Або: розгляньте автопортрет Фріди Кало і опишіть, які символи вона використовує та що вони означають."], "q": ["Які культури сформували мистецтво Латинської Америки?", "Хто такі мексиканські муралісти?", "Чим особлива творчість Фріди Кало та Фернандо Ботеро?", "Назвіть латиноамериканські танці та країни їхнього походження.", "Як відбувається карнавал у Ріо-де-Жанейро?"]}, {"n": "17", "t": "Урок узагальнення знань. Мистецтво американського культурного регіону", "g": "Систематизувати знання про мистецтво Америки, перевірити себе та виконати творчий проєкт.", "k": "", "terms": [], "th": [{"h": "Повторюємо головне", "p": [], "ul": ["Доколумбова Америка: ольмеки (кам’яні голови), майя (піраміди, стели, фрески Бонампака), ацтеки (Теночтітлан, «Камінь Сонця»), інки (Мачу-Пікчу, кладка без розчину, золото, текстиль).", "Культура США: «плавильний котел», «американська мрія», трансценденталізм (Емерсон, Торо), прагматизм (Пірс, Джеймс, Дьюї).", "Архітектура: класицизм (Капітолій), чиказька школа, хмарочоси (Емпайр-стейт, Крайслер), Ф. Л. Райт, Міс ван дер Рое, Ф. Гері.", "Театр і кіно: Бродвей, мюзикл, Голлівуд, Чаплін, Дісней, Спілберг.", "Музика: спірічуелс, блюз, регтайм, джаз (Армстронг), Гершвін, рок-н-рол, хіп-хоп; танці: степ, чарльстон, брейкданс.", "Живопис: Гоппер, Вуд, Поллок, Ротко, Воргол, Баскія.", "Латинська Америка: муралісти, Фріда Кало, Ботеро, танго, самба, карнавал у Ріо."]}], "f": "", "pr": ["Тест: 1) Столиця ацтеків — … 2) Де розташоване Мачу-Пікчу? 3) Автор книги «Волден» — … 4) Хто сказав «форма відповідає функції»? 5) Хто спроєктував музей Гуґґенгайма в Нью-Йорку? 6) Перший звуковий фільм — … 7) Місто — батьківщина джазу. 8) Автор «Рапсодії в блюзових тонах». 9) Хто створив «Банки супу Campbell’s»? 10) Як називається місце параду шкіл самби?", "Творчий проєкт (на вибір): а) «путівник» мистецькою Америкою — 10 обов’язкових до відвідування місць; б) плакат-колаж «Музика Америки»; в) картина в стилі поп-арт; г) ескіз карнавального костюма."], "q": ["Що об’єднує мистецтво Північної та Латинської Америки, а що відрізняє?", "Який американський митець або твір вам найбільше запам’ятався і чому?", "Як американська культура впливає на ваше повсякденне життя?"]}]}, {"name": "Тема 3. Мистецтво далекосхідного культурного регіону (6 год.)", "lessons": [{"n": "18", "t": "Архітектура Далекого Сходу (Китай, Японія, Корея)", "g": "Дізнатися про спільні риси та відмінності архітектури Китаю, Японії й Кореї, знати найвідоміші пам’ятки.", "k": "", "terms": [["Пагода", "багатоярусна вежа буддійського храму."], ["Доуґун", "система дерев’яних кронштейнів, що підтримує виступаючий дах."], ["Торії", "ворота до синтоїстського святилища в Японії."], ["Ханок", "традиційний корейський будинок."], ["Даньчхон", "яскравий розпис дерев’яних частин корейських споруд."]], "th": [{"h": "Спільні риси", "p": [], "ul": ["головний матеріал — дерево; каркасна конструкція (стовпи й балки), стіни не несуть навантаження;", "вигнуті дахи з піднятими краями — найвиразніша частина будівлі;", "гармонія з природою: будівлі «вписані» в ландшафт;", "симетрія та розташування вздовж осі «північ — південь» (особливо в Китаї);", "символіка кольорів і чисел."]}, {"h": "Китай", "p": [], "ul": ["Велика Китайська стіна — оборонна споруда завдовжки тисячі кілометрів;", "Заборонене місто в Пекіні (початок XV ст.) — імператорський палац із майже тисячею будівель; жовті дахи — колір імператора;", "Храм Неба в Пекіні — кругла зала з трьома синіми дахами (коло — символ неба, квадрат — землі);", "пагоди (Велика пагода диких гусей у Сіані);", "сучасна архітектура — хмарочоси Шанхая, Пекінський національний стадіон «Пташине гніздо»."]}, {"h": "Японія", "p": [], "ul": ["синтоїстські святилища: Ісе (перебудовується кожні 20 років), «плавучі» червоні ворота-торії святилища Іцукусіма;", "Хорю-дзі — буддійський храм, серед найдавніших дерев’яних будівель світу;", "Тодай-дзі в Нарі — величезна зала з бронзовою статуєю Будди;", "Кінкаку-дзі (Золотий павільйон) у Кіото, вкритий сусальним золотом;", "замок Хімедзі — «Замок білої чаплі»;", "традиційний будинок: розсувні паперові перегородки сьодзі, мати-татамі, мінімум меблів;", "сучасні архітектори: Кендзо Танге, Тадао Андо (бетон, світло, «Церква світла»)."]}, {"h": "Корея", "p": [], "ul": ["палац Кьонбоккун у Сеулі (1395) — головний палац династії Чосон;", "буддійський храм Пульгукса;", "ханоки з підлоговим опаленням ондоль;", "розпис даньчхон — п’ять кольорів захищають дерево й відганяють зло;", "сучасність: хмарочос Lotte World Tower (555 м), Dongdaemun Design Plaza (архітекторка Заха Хадід)."]}], "f": "Святилище Ісе в Японії розбирають і будують заново з нового дерева кожні 20 років уже понад тисячу років — так зберігають і будівлю, і майстерність теслярів.", "pr": ["Заповніть таблицю «Архітектура Китаю, Японії, Кореї»: 2–3 пам’ятки кожної країни, матеріал, характерні риси, призначення.", "Намалюйте ескіз пагоди або японського храму з вигнутим дахом, звертаючи увагу на пропорції ярусів і силует даху."], "q": ["Які спільні риси має архітектура Далекого Сходу?", "Що символізують форми Храму Неба?", "Чому святилище Ісе перебудовують кожні 20 років?", "Що таке ханок і ондоль?", "Назвіть 2 сучасні споруди Далекого Сходу."]}, {"n": "19", "t": "Китайський та японський живопис", "g": "Дізнатися про матеріали, техніки та видатних майстрів живопису Китаю і Японії, про зв’язок живопису з поезією та каліграфією.", "k": "", "terms": [["Гохуа", "традиційний китайський живопис тушшю й фарбами на шовку чи папері."], ["Суйбоку / сумі-е", "японський монохромний живопис тушшю."], ["Укійо-е", "японська гравюра на дереві («картини мінливого світу»)."], ["Сувій", "формат картини: горизонтальний (розгортається руками) або вертикальний (підвішується)."], ["Японізм", "захоплення європейських художників японським мистецтвом у ХІХ ст."]], "th": [{"h": "Китайський живопис (гохуа)", "p": ["Китайські художники працювали пензлем і тушшю на шовку або рисовому папері. «Чотири скарби кабінету вченого» — пензель, туш, папір і тушечниця. На папері неможливо виправити помилку, тому кожен мазок мав бути впевненим — це результат багаторічних тренувань.", "Живопис, поезія та каліграфія становили єдність: на картині часто розміщували вірш і червону печатку автора. Художник не копіював природу, а передавав її дух і власний настрій."], "ul": ["техніка гунбі — ретельне, детальне малювання тонкими лініями;", "техніка сєї («написання ідеї») — вільні, швидкі, виразні мазки;", "майстри: Гу Кайчжи, Ван Вей (поет і художник), Фань Куань («Мандрівники серед гір і потоків»), Ці Байші (ХХ ст., знамениті креветки)."]}, {"h": "Японський живопис", "p": [], "ul": ["ямато-е — «японський» стиль, яскраві фарби; ілюстровані сувої-емакімоно, зокрема до «Повісті про Ґендзі»;", "сумі-е — живопис тушшю під впливом дзен-буддизму; майстер Сессю (XV ст.);", "розписи ширм і розсувних дверей золотом (школа Кано);", "укійо-е — кольорові гравюри на дереві XVII–XIX ст., що зображували актори, красунь, пейзажі. Кацусіка Хокусай — серія «36 видів гори Фудзі», зокрема «Велика хвиля в Канаґаві» (близько 1831 р.); Утаґава Хіросіґе — «53 станції Токайдо»; Кітаґава Утамаро — жіночі образи."]}, {"h": "Вплив на Європу", "p": ["У другій половині ХІХ ст. японські гравюри потрапили до Європи й захопили імпресіоністів і постімпресіоністів. Вінсент ван Гог копіював гравюри Хіросіґе, Клод Моне колекціонував укійо-е і збудував у своєму саду японський місток. Цей феномен називають японізмом."], "ul": []}], "f": "«Велику хвилю» Хокусая надрукували тисячами відбитків — це одне з найбільш упізнаваних зображень у світі, а її мотив можна побачити навіть у емодзі хвилі.", "pr": ["Намалюйте тушшю або чорною аквареллю пейзаж у стилі сумі-е: гора, дерево, хвиля або бамбук. Використовуйте різну насиченість — від насиченого чорного до ледь помітного сірого. Додайте свою «печатку» червоним кольором.", "Розгляньте «Велику хвилю» Хокусая і дайте відповіді: що на першому плані, що на задньому, який настрій, де гора Фудзі?"], "q": ["Що таке «чотири скарби кабінету вченого»?", "Чим відрізняються техніки гунбі та сєї?", "Як поєднуються живопис, поезія і каліграфія в Китаї?", "Що таке укійо-е? Назвіть його майстрів.", "Що таке японізм і кого з європейських художників він надихнув?"]}, {"n": "20", "t": "Жанри. Символічне наповнення кольору", "g": "Розрізняти основні жанри живопису Китаю та Японії, розуміти символіку рослин, тварин і кольорів у мистецтві Далекого Сходу.", "k": "", "terms": [["Шань-шуй", "«гори-води» — китайський пейзаж."], ["Хуаняо", "«квіти-птахи» — жанр зображення природи."], ["«Чотири благородні»", "слива, орхідея, бамбук, хризантема — символи чеснот."], ["У-сін", "вчення про п’ять першоелементів, з яким пов’язана символіка кольорів."]], "th": [{"h": "Жанри китайського живопису", "p": [], "ul": ["Шань-шуй (пейзаж «гори й води») — найшанованіший жанр. Гори — чоловіче, тверде начало (ян), вода — жіноче, м’яке (інь). Маленькі фігурки людей серед величезних гір показують, що людина — лише частинка природи. Перспектива «плаваюча»: погляд ніби мандрує картиною.", "Хуаняо («квіти-птахи») — квіти, птахи, комахи, риби, кожен з яких має символічне значення.", "Жень-у (фігуративний жанр) — портрети, історичні сцени, мудреці.", "«Чотири благородні» — слива мей (стійкість, зима), орхідея (витонченість, весна), бамбук (гнучкість і сила духу, літо), хризантема (довголіття, осінь). На них учні вчилися володіти пензлем."]}, {"h": "Символи тварин і рослин", "p": [], "ul": ["дракон — сила, імператор, вода й дощ;", "фенікс (фенхуан) — імператриця, гармонія;", "журавель — довголіття; сосна — стійкість;", "короп — наполегливість (за легендою, короп, що подолав водоспад, стає драконом);", "півонія — багатство; лотос — чистота."]}, {"h": "Жанри японського мистецтва", "p": [], "ul": ["бідзін-ґа — зображення красунь;", "якуся-е — портрети акторів театру кабукі;", "мейсьо-е — «знамениті місця», пейзажі;", "катьо-ґа — «квіти й птахи»."]}, {"h": "Символіка кольору", "p": ["У Китаї кольори пов’язані з п’ятьма першоелементами (у-сін), сторонами світу та порами року:"], "ul": ["зелений/синій (цін) — дерево, схід, весна, життя, ріст;", "червоний — вогонь, південь, літо; радість, щастя, свято (весільне вбрання, ліхтарики, конверти з грошима на Новий рік);", "жовтий — земля, центр; колір імператора, влада;", "білий — метал, захід, осінь; колір жалоби;", "чорний — вода, північ, зима; глибина, мудрість."]}, {"h": "", "p": ["У Японії червоний (яскраво-оранжевий, як на воротах торії) — захист від зла; білий — чистота (синтоїзм), весільне вбрання; фіолетовий — колір знаті. У Кореї п’ять кольорів обансек (синій, червоний, жовтий, білий, чорний) використовують в одязі, розписах, стравах."], "ul": []}], "f": "У Китаї на Новий рік дарують червоні конверти хунбао з грошима — червоний колір «приносить удачу» й відганяє злих духів.", "pr": ["Намалюйте одну з «чотирьох благородних» рослин (найпростіше — бамбук) у техніці тушшю чи аквареллю: стебло — одним рухом пензля, листя — швидкими мазками.", "Складіть таблицю «Колір — значення в Китаї — значення в Україні»: порівняйте символіку червоного, білого, жовтого, чорного, зеленого."], "q": ["Що таке шань-шуй і що символізують у ньому гори й вода?", "Назвіть «чотирьох благородних» і їхні значення.", "Які жанри існували в японській гравюрі?", "Що означає червоний колір у Китаї? А білий?", "Що символізує короп у мистецтві Далекого Сходу?"]}, {"n": "21", "t": "Декоративно-ужиткове мистецтво Далекого Сходу", "g": "Ознайомитися з основними видами декоративно-ужиткового мистецтва Китаю, Японії та Кореї: порцеляною, лаком, шовком, нецке, кімоно, оригамі.", "k": "", "terms": [["Порцеляна", "біла тонка кераміка з каоліну, винайдена в Китаї."], ["Селадон", "кераміка з сіро-зеленою поливою (Корея, Китай)."], ["Нецке", "японська мініатюрна скульптура-брелок для кріплення речей до пояса кімоно."], ["Кінцуґі", "японське мистецтво реставрації посуду золотом."], ["Бодзаґі", "корейська клаптикова тканина для загортання речей."]], "th": [{"h": "Китай", "p": [], "ul": ["Порцеляна — китайський винахід. Центр виробництва — місто Цзіндечжень. Найвідоміша — біло-синя порцеляна доби Мін (XIV–XVII ст.). Англійською порцеляна так і називається — china.", "Шовк — Китай тисячоліттями зберігав таємницю шовківництва; Великий шовковий шлях поєднував Китай з Європою.", "Нефрит — камінь, символ чистоти й безсмертя; з нього виготовляли прикраси, чаші, статуетки.", "Лакові вироби (різьблений червоний лак), перегородчаста емаль, паперові ліхтарі, віяла, вирізанки з паперу."]}, {"h": "Японія", "p": [], "ul": ["Кераміка: чайні чаші раку — навмисно нерівні, «недосконалі» (естетика ваби-сабі).", "Кінцуґі — тріснутий посуд склеюють лаком із золотим порошком: пошкодження не приховують, а підкреслюють як частину історії речі.", "Нецке — мініатюрні фігурки з дерева, кістки, слонової кістки (тварини, персонажі легенд), що слугували противагою для гаманця чи коробочки на поясі.", "Кімоно — традиційний одяг; візерунки відповідають порі року, віку, події.", "Оригамі — мистецтво складання паперу; журавлик — символ миру й довголіття.", "Лакові скриньки, віяла, фурошікі (тканина для загортання подарунків)."]}, {"h": "Корея", "p": [], "ul": ["Селадон доби Корьо (XII ст.) з інкрустацією — «нефритовий» колір поливи;", "«Місячна ваза» — біла порцеляна доби Чосон, проста й величава;", "ханбок — традиційний одяг з яскравими кольорами;", "бодзаґі — клаптикові тканини, схожі на абстрактний живопис;", "вироби з перламутру, вузликове плетіння маедеуп."]}], "f": "За легендою, людина, яка складе тисячу паперових журавликів, отримає здійснення бажання. Японська дівчинка Садако Сасакі зробила журавликів символом миру.", "pr": ["Складіть журавлика або іншу фігурку в техніці оригамі.", "Або: намалюйте ескіз вази в стилі китайської біло-синьої порцеляни (лише синій колір на білому) з рослинним орнаментом чи драконом.", "Або: «кінцуґі на папері» — розріжте малюнок чашки на кілька частин і складіть знову, «заповнивши тріщини» золотим маркером. Поясніть ідею кінцуґі."], "q": ["Чому порцеляну англійською називають china?", "Що таке нецке і для чого воно служило?", "У чому полягає ідея кінцуґі?", "Що таке селадон?", "Які вироби декоративного мистецтва Далекого Сходу поширені сьогодні в усьому світі?"]}, {"n": "22", "t": "Особливості музичного мистецтва Далекого Сходу", "g": "Дізнатися про особливості музики Китаю, Японії та Кореї, їхні інструменти та театрально-музичні жанри, сучасну популярну музику регіону.", "k": "", "terms": [["Пентатоніка", "звукоряд із п’яти звуків (як на чорних клавішах ф
