ь-який рух небезпечний; переміщують обережно, не згинаючи тіло, на тверду поверхню;", "масивна кровотеча — спочатку зупинити, під час перенесення контролювати, чи не відновилася."]}, {"h": "Пріоритети евакуації", "p": [], "ul": ["критично поранені — першими;", "ті, хто в найнебезпечнішому місці;", "хто може рухатися сам — евакуюється самостійно;", "завжди говоріть із пораненим, якщо він при тямі — ваш спокій передається йому."]}], "f": "", "pr": ["Складіть таблицю «Спосіб евакуації — скільки людей — коли застосовувати — ризики».", "На уроці під наглядом учителя відпрацюйте в парах перенесення «замком» і волочіння на короткій відстані."], "q": ["Чому не можна просто «схопити й побігти»?", "Що робимо в червоній зоні, а що — в жовтій?", "Які способи евакуації одним рятувальником ви знаєте?", "Як діяти при підозрі на травму хребта?", "Кого евакуюють першим?"]}, {"n": "7", "t": "Допомога в польових умовах. Алгоритм MARCH. Склад аптечки IFAK", "g": "Знати етапи алгоритму MARCH та склад і призначення індивідуальної аптечки IFAK.", "k": "", "terms": [["MARCH", "алгоритм допомоги в жовтій зоні: масивна кровотеча, дихальні шляхи, дихання, циркуляція, гіпотермія/травма голови."], ["IFAK", "Individual First Aid Kit — індивідуальна аптечка першої допомоги."], ["Турнікет", "кровоспинний джгут для зупинки масивної кровотечі з кінцівки."], ["Сортування (тріаж)", "визначення черговості допомоги пораненим."]], "th": [{"h": "Алгоритм MARCH", "p": [], "ul": ["M — Massive hemorrhage: масивна кровотеча — найважливіше, вбиває за хвилини;", "A — Airway: прохідність дихальних шляхів;", "R — Respiration: дихання, огляд грудної клітки, закриття відкритих ран оклюзійною пов’язкою;", "C — Circulation: інші кровотечі, бандажі, гемостатики;", "H — Hypothermia / Head injury: збереження тепла, травма голови, свідомість."]}, {"h": "Склад IFAK", "p": [], "ul": ["турнікет — зупинка сильної кровотечі з кінцівки;", "компресійний («ізраїльський») бандаж;", "гемостатичний засіб — прискорює зсідання крові;", "назофарингеальна трубка — для прохідності дихальних шляхів (використовують навчені люди);", "оклюзійна пов’язка — для ран грудної клітки;", "медичні рукавички — без них жодних дій;", "медичні ножиці — розрізати одяг;", "маркер — записати час накладання турнікета;", "термоковдра — запобігання переохолодженню."]}, {"h": "Чому аптечка стандартна", "p": ["Усі IFAK укомплектовані однаково, щоб у стресі рятувальник знав, де що лежить, і не втрачав секунд. Аптечку носять у визначеному місці спорядження, а турнікет — так, щоб дістати однією рукою."], "ul": []}], "f": "", "pr": ["Розшифруйте MARCH і до кожної літери запишіть, що робить рятувальник.", "Складіть список IFAK і біля кожного предмета напишіть його призначення.", "Перевірте домашню аптечку: чого бракує для надання допомоги при кровотечі?"], "q": ["Що означає кожна літера MARCH?", "Чому масивна кровотеча — на першому місці?", "Що входить до IFAK?", "Навіщо в аптечці маркер?", "Чому всі аптечки комплектують однаково?"]}, {"n": "8", "t": "Огляд постраждалого. Ознаки критичної кровотечі", "g": "Вміти швидко оглянути постраждалого та розпізнати ознаки критичної кровотечі.", "k": "", "terms": [["Швидкий огляд", "оцінка стану постраждалого за 15–30 секунд."], ["Критична (масивна) кровотеча", "кровотеча, що може вбити за кілька хвилин."]], "th": [{"h": "Спочатку огляд", "p": ["Не знаючи, що з людиною, допомогти неможливо. Огляд — перший пункт плану. Кров лякає, але це лише симптом; справжня небезпека — бездіяльність. Людина з масивною кровотечею може загинути за 3 хвилини. Працюють тільки в рукавичках (краще світлих — на них видно кров)."], "ul": []}, {"h": "Швидкий огляд (15–30 с)", "p": [], "ul": ["чи людина при тямі, чи дихає;", "великі плями крові, пошкоджений одяг;", "огляд «з голови до ніг» руками (пальпація);", "обов’язково — взуття: воно, як губка, може вбирати кров і приховувати критичну кровотечу;", "говоріть із постраждалим, якщо він при тямі."]}, {"h": "Ознаки критичної кровотечі", "p": [], "ul": ["кров б’є струменем у такт серцю (пульсує);", "під людиною швидко утворюється калюжа крові;", "одяг мокрий, просочений кров’ю;", "відсутня кінцівка або її частина."]}, {"h": "Що далі", "p": ["Виявили критичну кровотечу на кінцівці — негайно турнікет (або прямий тиск на рану, якщо турнікета немає) і виклик допомоги: 103 або 112. Навіть у мирному житті (ДТП, нещасний випадок) прямий тиск на рану рятує життя."], "ul": []}], "f": "", "pr": ["Запишіть 4 ознаки критичної кровотечі.", "На уроці в парах: за 15 секунд оглянути «постраждалого» та назвати всі «травми» (позначені наліпками)."], "q": ["Скільки часу має тривати швидкий огляд?", "Навіщо оглядати взуття постраждалого?", "Назвіть ознаки критичної кровотечі.", "Що робити, якщо турнікета немає?", "За якими номерами викликати допомогу?"]}]}, {"name": "Тренінг 9. Домедична допомога в умовах бою (продовження)", "lessons": [{"n": "1", "t": "Способи зупинки масивної кровотечі: турнікети", "g": "Знати принцип дії та види турнікетів, правила їх накладання («високо і туго» та прицільно) і послідовність накладання турнікета на руку й ногу.", "k": "", "terms": [["Турнікет", "кровоспинний джгут, що стискає м’язи по колу, а вони — судини, зупиняючи кровотік у кінцівці."], ["«High and Tight» (високо і туго)", "у червоній зоні турнікет накладають якомога вище на кінцівці."], ["Прицільне накладання", "у жовтій зоні — на 5–8 см вище рани, але ніколи не на суглоб."], ["Сертифікований турнікет", "турнікет, рекомендований Комітетом TCCC (наприклад, CAT, SOF, SAM, TX2, TX3, RMT)."]], "th": [{"h": "Чому важливий час", "p": ["При критичній кровотечі людина може втратити смертельний об’єм крові менш ніж за 3 хвилини. Турнікет виграє час до прибуття медиків. Він може травмувати кінцівку, але рятує життя. Протоколи «написані кров’ю» — жодних імпровізацій і лише сертифіковані засоби, не підробки."], "ul": []}, {"h": "Види турнікетів", "p": [], "ul": ["для кінцівок: вороткові (CAT, SOF, SAM), храпові (TX2, TX3, RMT), пневматичні;", "вузлові — для ран у паху та пахвовій ділянці, де звичайний турнікет не діє;", "абдомінальні — для поранень живота (у медиків)."]}, {"h": "Правила накладання", "p": [], "ul": ["червона зона — «високо і туго», якомога вище;", "жовта зона — прицільно, на 5–8 см вище рани, не на суглоб;", "перед накладанням на ногу — прибрати предмети з кишень;", "вороток крутити, доки не зупиниться кровотеча і не зникне пульс нижче турнікета;", "обов’язково записати час накладання;", "усі дії — у рукавичках."]}, {"h": "Послідовність накладання на руку (загально)", "p": [], "ul": ["зайняти безпечне положення;", "одягнути петлю турнікета якомога вище на кінцівку;", "зробити максимально сильний перший затяг, розмістивши вороток із зовнішнього боку руки;", "закріпити стрічку на липучці;", "крутити вороток до зупинки кровотечі, зафіксувати його у фіксаторі;", "закріпити залишок стрічки, записати час."]}, {"h": "Як тренуватися", "p": ["Навичку доводять до автоматизму: спочатку повільно й за інструкцією, потім на собі, на партнері, із заплющеними очима, на час, у стресових умовах. Відпрацьовують тільки під наглядом інструктора."], "ul": []}], "f": "Турнікет стискає не судину до кістки, як часто думають, а м’язи по колу — вже вони перетискають судини.", "pr": ["Запишіть правила накладання турнікета в червоній і жовтій зонах.", "Під наглядом учителя відпрацюйте накладання турнікета на руку собі та партнеру; засікіть час.", "Складіть пам’ятку «Як відрізнити сертифікований турнікет від підробки» (з допомогою інформації виробників)."], "q": ["Чому турнікет потрібно накладати негайно?", "Що означає «high and tight»?", "На якій відстані від рани накладають турнікет у жовтій зоні?", "Як зрозуміти, що турнікет накладено правильно?", "Навіщо записувати час накладання?"]}, {"n": "2", "t": "Практикум: огляд постраждалого і зупинка кровотечі", "g": "Відпрацювати повний алгоритм від огляду до накладання турнікета, довести послідовність дій до автоматизму.", "k": "", "terms": [["Комплексний сценарій", "вправа, що поєднує кілька навичок в одній ситуації."], ["Зворотний зв’язок «бутерброд»", "що вийшло добре → що виправити → що вийшло чудово."]], "th": [{"h": "Алгоритм дій рятувальника", "p": [], "ul": ["безпека: оцінити ситуацію, рукавички;", "огляд: швидко оглянути постраждалого (включно зі взуттям);", "знайти джерело масивної кровотечі;", "ухвалити рішення: турнікет;", "накласти турнікет за інструкцією;", "постійно говорити з постраждалим."]}, {"h": "Чому без імпровізацій", "p": ["Навіть невелика помилка в протоколі може коштувати життя. Тому кожен крок повторюють, поки він не стане автоматичним навіть у стресі: коли постраждалий кричить, заважає, а час обмежений."], "ul": []}], "f": "", "pr": ["Запишіть алгоритм дій рятувальника від огляду до накладання турнікета.", "На уроці виконайте комплексний сценарій за 2 хвилини; після — оцініть себе методом «бутерброда»."], "q": ["З чого починає рятувальник?", "Чому важливо оглядати взуття?", "Навіщо тренуватися в стресових умовах?", "Що таке зворотний зв’язок «бутерброд»?"]}, {"n": "3", "t": "Правила тампонування поранення", "g": "Розуміти, коли застосовують тампонування, знати його послідовність (алгоритм 4P) і правила безпечної роботи з кров’ю.", "k": "", "terms": [["Тампонування", "щільне заповнення рани бинтом (звичайним чи гемостатичним) для прямого тиску на судину зсередини."], ["Гемостатичний бинт", "бинт з речовиною, що прискорює зсідання крові (каолін, хітозан)."], ["Вузлова кровотеча", "кровотеча в паху, пахвовій ділянці, на шиї, де турнікет не накласти."]], "th": [{"h": "Турнікет чи тампонування", "p": ["Турнікет рятує життя, а тампонування допомагає зберегти кінцівку. Тампонують там, де турнікет неефективний чи неможливий (пах, пахва, шия), або коли кровотеча вже контрольована."], "ul": []}, {"h": "Алгоритм 4P", "p": [], "ul": ["Peel — дістати бинт з упаковки;", "Push — знайти джерело кровотечі, притиснути його пальцями й щільно заповнювати рану бинтом, не послаблюючи тиску, заповнюючи всі «кишені»;", "Pile — залишити над раною «грибочок» з бинта заввишки близько 2 см;", "Pressure — тиснути обома руками: гемостатичний бинт — щонайменше 3 хв, звичайний — до 10 хв."]}, {"h": "Важливо", "p": [], "ul": ["рукавички правильного розміру, одягнені поверх рукавів;", "зняти каблучки та металеві прикраси;", "якщо гемостатичний бинт не спрацював — витягнути і тампонувати новим (він одноразовий);", "після тампонування — тиснуча пов’язка;", "правильно знімати рукавички («рукавичка в рукавичці»), не торкаючись обличчя, після — обробити руки."]}], "f": "Від вузлових кровотеч гине приблизно кожен п’ятий поранений — тому вміння тампонувати так важливе.", "pr": ["Розшифруйте алгоритм 4P і запишіть ключові правила кожного етапу.", "Поясніть різницю між турнікетом і тампонуванням у двох реченнях."], "q": ["Коли застосовують тампонування замість турнікета?", "Що означає кожна літера 4P?", "Скільки часу тримати тиск для гемостатичного і звичайного бинта?", "Що робити, якщо гемостатичний бинт не зупинив кровотечу?", "Як безпечно зняти рукавички?"]}, {"n": "4", "t": "Бандажування та комплексний сценарій", "g": "Знати призначення компресійної (тиснучої) пов’язки, будову «ізраїльського бандажа» та вміти перевіряти кровообіг після бандажування.", "k": "", "terms": [["Бандажування", "накладання компресійної пов’язки, що підтримує тиск на рану після тампонування."], ["«Ізраїльський бандаж»", "еластичний бинт із подушечкою та аплікатором тиску; можна накласти однією рукою."]], "th": [{"h": "Тампонування і бандажування", "p": [], "ul": ["тампонування — прямий тиск на джерело кровотечі;", "бандажування — підтримка цього тиску, фіксація матеріалу та захист рани;", "бандаж не замінює тампонування, якщо воно потрібне."]}, {"h": "Як накладають ізраїльський бандаж", "p": [], "ul": ["прикласти подушечку до рани;", "зробити один оберт навколо кінцівки;", "протягнути бинт через аплікатор і повернути в протилежний бік — створюється тиск;", "щільно намотати, покриваючи краї подушечки, і зафіксувати кінець."]}, {"h": "Особливі ділянки", "p": [], "ul": ["шия — дуже обережно, щоб не перетиснути дихальні шляхи й судини;", "пах і пахва — тільки тампонування + компресійна пов’язка."]}, {"h": "Перевірка кровообігу", "p": ["Після бандажування перевірте кінцівку нижче пов’язки: якщо шкіра холодна, синіє, німіє, а пульс не прощупується — пов’язку затягнули надміру, її слід послабити й накласти знову."], "ul": []}], "f": "", "pr": ["Опишіть послідовність накладання ізраїльського бандажа.", "Поясніть, як перевірити, що бандаж не затягнуто надміру."], "q": ["Чим бандажування відрізняється від тампонування?", "Як улаштований ізраїльський бандаж?", "Чому бандажування шиї вимагає особливої обережності?", "Які ознаки того, що пов’язку затягнуто надміру?"]}, {"n": "5", "t": "Контроль прохідності дихальних шляхів", "g": "Розуміти ризики непрохідності дихальних шляхів, вміти перевіряти дихання («Бачу — чую — відчуваю»), виконувати виведення щелепи та переводити людину в стабільне бокове положення.", "k": "", "terms": [["Непрохідність дихальних шляхів", "перекриття шляху повітря: западання язика, кров, блювота, сторонні предмети."], ["Стабільне бокове положення", "положення на боці для людини, яка знепритомніла, але дихає."], ["Виведення щелепи", "прийом для відкриття дихальних шляхів без руху шиї (при підозрі на травму хребта)."], ["Геморагічний шок", "критичний стан через велику крововтрату."]], "th": [{"h": "Чому це важливо", "p": ["Після зупинки кровотечі (M) іде A — дихальні шляхи. Непритомна людина може задихнутися через западання язика, кров чи блювоту (блювота може бути ознакою тяжкої крововтрати). Назофарингеальну трубку в шкільному курсі не використовують — лише безпечні методи."], "ul": []}, {"h": "«Бачу — чую — відчуваю»", "p": [], "ul": ["Бачу — рухи грудної клітки й живота;", "Чую — звуки дихання біля рота й носа (хрипи, булькання — ознака перешкоди);", "Відчуваю — потік повітря щокою."]}, {"h": "Виведення щелепи", "p": ["Станьте на коліна біля голови, візьміть нижню щелепу за кути пальцями і обережно висуньте її вперед, не рухаючи шию. Цей спосіб обирають при підозрі на травму шийного відділу (вибух, ДТП, сильний удар)."], "ul": []}, {"h": "Стабільне бокове положення", "p": [], "ul": ["язик не западає;", "кров і блювота вільно витікають;", "зігнуті кінцівки не дають перевернутися на спину;", "якщо людина знепритомніла, але дихає — якнайшвидше покладіть її в це положення і стежте за диханням."]}, {"h": "Ознаки геморагічного шоку", "p": ["Бліда, холодна, спітніла шкіра; частий слабкий пульс; спрага, нудота; збудження або апатія, втрата свідомості; прискорене дихання. Потрібна негайна медична допомога."], "ul": []}], "f": "", "pr": ["Опишіть по кроках, як перевести людину в стабільне бокове положення.", "Удома відпрацюйте стабільне бокове положення з дорослим членом родини."], "q": ["Що може перекрити дихальні шляхи?", "Як діє метод «Бачу — чую — відчуваю»?", "Коли застосовують виведення щелепи?", "Навіщо стабільне бокове положення?", "Назвіть ознаки геморагічного шоку."]}, {"n": "6", "t": "Запобігання проблемам з органами дихання. Пневмоторакс. Оклюзійна наліпка", "g": "Розуміти, що таке пневмоторакс, розпізнавати проникаюче поранення грудної клітки та знати, як накладати оклюзійну наліпку.", "k": "", "terms": [["Плевральна порожнина", "вузький простір між легенею і стінкою грудної клітки з негативним тиском."], ["Пневмоторакс", "потрапляння повітря в плевральну порожнину, через що легеня спадається."], ["Напружений пневмоторакс", "повітря заходить, але не виходить — тиск наростає, здавлює легеню та серце; стан загрожує життю."], ["Оклюзійна наліпка", "герметична наліпка на рану грудної клітки (часто з клапаном)."]], "th": [{"h": "Як дихають легені", "p": ["Грудна клітка — герметична «коробка». Легені не мають власних м’язів: їх розправляють діафрагма та міжреберні м’язи завдяки негативному тиску в плевральній порожнині. Якщо цю герметичність порушено пораненням, повітря заходить усередину, і легеня спадається, як проколотий м’яч."], "ul": []}, {"h": "Види пневмотораксу", "p": [], "ul": ["відкритий — повітря вільно заходить і виходить через рану;", "напружений — рана діє як односторонній клапан, тиск наростає, зміщуються серце і великі судини — найнебезпечніший стан."]}, {"h": "Що робити", "p": [], "ul": ["уважно оглянути груди, спину, живіт, розгладжуючи шкіру: дрібна рана може бути проникаючою; шукати вхідні й вихідні отвори;", "очистити шкіру навколо рани;", "накласти оклюзійну наліпку, розгладжуючи від центру до країв, повністю закривши рану;", "стежити за станом: якщо дихання погіршується — покласти на бік поранення і негайно повідомити медиків."]}], "f": "", "pr": ["Намалюйте схему «легеня в плевральній порожнині» і поясніть, що стається при пневмотораксі.", "Опишіть алгоритм накладання оклюзійної наліпки."], "q": ["Що таке плевральна порожнина?", "Чим відкритий пневмоторакс відрізняється від напруженого?", "Як шукати поранення грудної клітки?", "Як правильно накласти оклюзійну наліпку?", "Що робити, якщо після накладання наліпки стан погіршується?"]}, {"n": "7", "t": "Базові життєві показники. Запобігання переохолодженню. Картка пораненого", "g": "Вміти вимірювати пульс, розпізнавати ознаки шоку та переохолодження, захищати постраждалого від втрати тепла і заповнювати картку пораненого.", "k": "", "terms": [["Пульс", "поштовхи крові в артеріях у ритмі серця; норма для дорослого — 60–100 ударів за хвилину."], ["Тахікардія / брадикардія", "пульс понад 100 / менше 60 ударів за хвилину."], ["Гіпотермія", "переохолодження організму."], ["Картка пораненого", "документ, що передає медикам інформацію про поранення та надану допомогу."]], "th": [{"h": "Пульс", "p": [], "ul": ["шукають на зап’ясті (променева артерія) або на шиї (сонна артерія) двома пальцями;", "«Правило 15»: порахуйте удари за 15 секунд і помножте на 4 (при неритмічному пульсі — рахуйте хвилину);", "червоні прапорці шоку: слабкий або відсутній пульс на зап’ясті, зміни свідомості без травми голови — негайно повідомте медиків."]}, {"h": "Переохолодження", "p": [], "ul": ["може статися навіть улітку, особливо якщо людина мокра;", "легке — тремтіння, «гусяча шкіра», холодні руки;", "середнє — повільна мова, апатія, «дерев’яні» пальці;", "важке — тремтіння зникає, людина може знепритомніти — дуже небезпечно.", "Кров переносить тепло, тому велика крововтрата швидко призводить до переохолодження — M і H у MARCH пов’язані."]}, {"h": "Як захистити від холоду", "p": [], "ul": ["ізолювати від землі (плед, каремат, рюкзак);", "зняти мокрий одяг (якщо безпечно) — мокрий одяг ворог № 1;", "загорнути в термоковдру повністю, включно з головою та шиєю, залишивши відкритим обличчя;", "захистити від вітру, дощу, бруду;", "при підозрі на травму голови — не рухати без потреби."]}, {"h": "Картка пораненого: ЧЩС", "p": [], "ul": ["ЧАС — коли сталося поранення і коли надано допомогу (зокрема час накладання турнікета);", "ЩО — що сталося і що ви зробили;", "СТАН — пульс, дихання, рівень свідомості."]}], "f": "", "pr": ["Виміряйте свій пульс у спокої та після 20 присідань («Правило 15»). Запишіть результати.", "Складіть пам’ятку «Як захистити постраждалого від переохолодження».", "Складіть приклад заповненої картки пораненого за схемою ЧАС — ЩО — СТАН."], "q": ["Де і як вимірюють пульс?", "Яка норма пульсу для дорослого?", "Назвіть ознаки легкого, середнього та важкого переохолодження.", "Чому крововтрата і переохолодження пов’язані?", "Що записують у картку пораненого?"]}]}]}, {"id": "pe", "name": "Фізична культура", "short": "Фізкультура 10", "themes": [{"name": "Розділ 1. Волейбол (уроки 1–26)", "lessons": [{"n": "1", "t": "Інструктаж з безпеки життєдіяльності на заняттях з волейболу. Спеціальні бігові та стрибкові вправи", "g": "Знати правила безпечної поведінки на заняттях волейболом і розуміти призначення спеціальних бігових і стрибкових вправ.", "k": "1 (первинний), 2–26 (повторення)", "terms": [["Інструктаж з БЖД", "ознайомлення з правилами безпеки перед заняттями; первинний — на початку розділу, повторний — перед кожним уроком."], ["Розминка", "комплекс вправ, що готує м’язи, суглоби, серце й дихання до навантаження."], ["Спеціальні бігові вправи", "вправи, що розвивають техніку бігу, швидкість і координацію."], ["Спеціальні стрибкові вправи", "вправи для розвитку вибухової сили ніг і стрибучості."]], "th": [{"h": "Правила безпеки на заняттях волейболом", "p": [], "ul": ["займатися лише у спортивній формі та взутті з неслизькою підошвою; зняти прикраси, годинник;", "розпочинати гру тільки після розминки та за сигналом учителя;", "не виконувати подачу, доки партнери не готові, і не подавати в бік людей;", "не висіти на сітці й не штовхати гравців біля неї;", "стежити за м’ячами, що відкотилися на майданчик, — на них можна травмувати гомілкостоп;", "під час блокування й нападу приземлятися на обидві ноги, на свою половину;", "при будь-якій травмі чи поганому самопочутті — негайно повідомити вчителя."]}, {"h": "Навіщо розминка", "p": ["Волейбол — гра з різкими стрибками, ривками й падіннями. Без розминки зростає ризик розтягнень і травм суглобів. Розминка підвищує температуру м’язів, еластичність зв’язок і частоту серцевих скорочень, налаштовує нервову систему на швидку реакцію."], "ul": []}, {"h": "Спеціальні бігові вправи", "p": [], "ul": ["біг з високим підніманням стегна — сила м’язів-згиначів стегна, частота кроків;", "біг із закиданням гомілки назад — розслаблення задньої поверхні стегна;", "семенячий біг — частота рухів і робота стопи;", "приставні кроки лівим і правим боком, біг спиною вперед — пересування волейболіста по майданчику;", "прискорення на 10–15 м зі зміною напрямку за сигналом — швидкість реакції."]}, {"h": "Спеціальні стрибкові вправи", "p": [], "ul": ["стрибки на двох ногах на місці та з просуванням;", "багатоскоки з ноги на ногу;", "стрибки вгору з імітацією нападаючого удару чи блоку;", "стрибки через скакалку — ритм і робота гомілкостопа.", "Стрибкові вправи виконують після бігової частини розминки, приземлюючись м’яко, на передню частину стопи з перекатом."]}], "f": "Волейболіст високого рівня за одну гру може виконати понад 100 стрибків.", "pr": ["Складіть пам’ятку «7 правил безпеки на уроці волейболу».", "Опишіть комплекс розминки волейболіста з 8 вправ: назва вправи, її мета, дозування (кількість повторів або час)."], "q": ["Для чого проводять первинний і повторний інструктаж з БЖД?", "Назвіть 5 правил безпеки на заняттях волейболом.", "Чому без розминки зростає ризик травм?", "Яку мету мають біг з високим підніманням стегна та приставні кроки?", "Як правильно приземлятися після стрибка?"]}, {"n": "2", "t": "Історія розвитку волейболу. Основні поняття та правила гри", "g": "Знати історію виникнення волейболу та основні правила гри.", "k": "1, 2, 8", "terms": [["Розіграш (раллі)", "період гри від подачі до моменту, коли м’яч поза грою; кожен розіграш приносить очко."], ["Перехід", "зміна позицій гравців за годинниковою стрілкою після отримання права подачі."], ["Ліберо", "гравець захисту в формі іншого кольору; не подає, не блокує, не атакує вище сітки."], ["Зони майданчика", "шість позицій гравців, пронумерованих від 1 до 6."]], "th": [{"h": "Історія", "p": [], "ul": ["1895 р. — Вільям Морган, викладач фізкультури з міста Голіок (США), придумав гру «мінтонет»; згодом її назвали волейболом (volley — удар з льоту, ball — м’яч);", "1947 р. — створено Міжнародну федерацію волейболу (FIVB);", "1964 р. — волейбол став олімпійським видом спорту (Токіо), з 1996 р. — також пляжний волейбол;", "в Україні волейбол поширився в 1920-х роках; сьогодні діють чоловіча й жіноча Суперліги."]}, {"h": "Майданчик і інвентар", "p": [], "ul": ["майданчик 18 × 9 м, розділений сіткою на дві половини 9 × 9 м;", "висота сітки: чоловіки — 2,43 м, жінки — 2,24 м;", "лінія атаки — за 3 м від сітки; вона відділяє передню зону від задньої;", "м’яч: обвід 65–67 см, маса 260–280 г."]}, {"h": "Основні правила", "p": [], "ul": ["у команді на майданчику 6 гравців;", "партія триває до 25 очок з перевагою щонайменше у 2 очки; вирішальна п’ята партія — до 15;", "матч — до трьох виграних партій;", "команда має право на три торкання м’яча (без урахування блоку); один гравець не може торкатися двічі поспіль;", "помилки: м’яч за межами майданчика, чотири торкання, подвійне торкання, торкання сітки, заступ за центральну лінію, неправильна розстановка;", "після виграшу права подачі гравці виконують перехід за годинниковою стрілкою."]}, {"h": "Зони майданчика", "p": ["Зона 1 — задня права (звідси подають), 2 — передня права, 3 — передня центральна, 4 — передня ліва, 5 — задня ліва, 6 — задня центральна. Гравці передньої лінії (2, 3, 4) можуть атакувати й блокувати біля сітки."], "ul": []}, {"h": "Волейбол як засіб фізичного виховання", "p": ["Волейбол розвиває швидкість реакції, стрибучість, спритність, координацію, силу рук і ніг, а також командну взаємодію, рішучість, уміння швидко ухвалювати рішення та контролювати емоції. Це безконтактна гра, тому нею можна займатися в будь-якому віці."], "ul": []}], "f": "Перший офіційний чемпіонат світу з волейболу серед чоловіків відбувся 1949 року в Празі.", "pr": ["Намалюйте схему волейбольного майданчика з розмірами, лінією атаки та зонами 1–6.", "Складіть 10 тестових запитань про правила волейболу для однокласників."], "q": ["Хто і коли винайшов волейбол?", "Які розміри майданчика та висота сітки?", "До скількох очок триває партія?", "Скільки торкань м’яча має команда?", "Які якості розвиває волейбол?"]}, {"n": "3", "t": "Подача м’яча. Верхня бокова подача. Подача в ліву та праву половину майданчика. Тактика подачі", "g": "Знати види подач, техніку верхньої бокової подачі та тактику вибору напрямку подачі.", "k": "1, 4, 7, 10, 13, 17, 20, 25, 26", "terms": [["Подача", "введення м’яча в гру ударом рукою із зони подачі (за лицьовою лінією)."], ["Нижня пряма подача", "найпростіша: удар знизу, м’яч летить по високій траєкторії."], ["Верхня пряма подача", "удар над головою обличчям до сітки."], ["Верхня бокова подача", "гравець стоїть боком до сітки, удар виконується над головою широким рухом руки."], ["Планер", "подача без обертання м’яча, траєкторія якої непередбачувана."]], "th": [{"h": "Правила подачі", "p": [], "ul": ["подають із зони подачі за лицьовою лінією, не заступаючи на неї;", "на подачу — 8 секунд після свистка судді;", "м’яч треба підкинути або відпустити з руки й ударити однією рукою;", "подача, що торкнулася сітки й перелетіла на бік суперника, — правильна."]}, {"h": "Техніка верхньої бокової подачі", "p": [], "ul": ["вихідне положення: стоячи лівим боком до сітки (для правші), ноги на ширині плечей, м’яч у лівій руці;", "підкидання: м’яч підкидають лівою рукою вгору над правим плечем на висоту 1–1,5 м;", "замах: праву руку відводять униз-назад, вага тіла — на правій нозі;", "удар: рука описує дугу через бік угору, тулуб повертається до сітки, удар — долонею по нижній задній частині м’яча у найвищій точці;", "після удару вага переходить на ліву ногу, гравець швидко входить у майданчик."]}, {"h": "Тактика подачі", "p": [], "ul": ["подача в ліву чи праву половину майданчика змушує суперника переміщатися;", "подача на гравця, слабшого у прийомі, або на того, хто щойно вийшов на заміну;", "подача в зону між гравцями, у зону 1 або 5 біля ліній;", "подача гравцеві, який має атакувати, — щоб ускладнити йому наступний напад;", "пріоритет — надійність: помилка на подачі дарує суперникові очко."]}, {"h": "Контрольні нормативи (довідково)", "p": ["Учні виконують серію подач на влучність у визначену зону (юнаки — верхні, дівчата — нижні прямі подачі) та подачі в ліву й праву половини майданчика. Оцінюють кількість влучних подач і правильність техніки."], "ul": []}], "f": "Швидкість подачі у стрибку в найсильніших волейболістів світу перевищує 120 км/год.", "pr": ["Опишіть фази верхньої бокової подачі й зазначте типові помилки в кожній фазі.", "Намалюйте майданчик і стрілками позначте 4 тактичні напрямки подачі з поясненням."], "q": ["Які види подач ви знаєте?", "Скільки секунд дається на виконання подачі?", "Опишіть вихідне положення для верхньої бокової подачі.", "На кого вигідно подавати і чому?", "Що таке «планер»?"]}, {"n": "4", "t": "Прийом м’яча знизу. Прийом однією рукою з падінням і перекатом", "g": "Знати техніку прийому м’яча знизу двома руками та однією рукою з падінням, розуміти, як безпечно падати.", "k": "2, 16, 20, 22, 23, 25", "terms": [["Прийом знизу", "приймання м’яча передпліччями з’єднаних рук; основний спосіб прийому подачі й сильних ударів."], ["Стійка волейболіста", "положення готовності: ноги зігнуті, вага на передній частині стоп, руки перед собою."], ["Самостраховка", "уміння безпечно падати й перекочуватися після прийому."]], "th": [{"h": "Прийом знизу двома руками", "p": [], "ul": ["стійка: ноги на ширині плечей, коліна зігнуті, корпус трохи нахилений уперед;", "руки випрямлені й з’єднані (одна долоня в другій, великі пальці паралельно), утворюють рівну «платформу» з передпліч;", "м’яч приймають передпліччями ближче до зап’ясть, а не кистями;", "рух виконують ногами — розгинанням колін, а не махом рук;", "«платформу» спрямовують туди, куди має полетіти м’яч (до зв’язкового гравця)."]}, {"h": "Прийом однією рукою з падінням", "p": ["Застосовують, коли до м’яча не встигнути двома руками. Гравець робить випад у бік м’яча, приймає його кистю чи передпліччям однієї руки і, щоб не травмуватися, виконує падіння з перекатом:"], "ul": ["дівчата — падіння вперед з перекатом на стегно та живіт;", "юнаки — падіння вперед з ковзанням на груди (перекатом на груди), руки амортизують;", "головне правило безпеки: не падати на випрямлені руки, коліна чи лікті; група тіла та м’які перекати."]}, {"h": "Типові помилки", "p": [], "ul": ["прийом кистями або зігнутими руками;", "мах руками замість роботи ніг;", "пізній вихід під м’яч, прийом «на прямих ногах»."]}], "f": "", "pr": ["Опишіть по етапах техніку прийому м’яча знизу.", "Поясніть, чому падіння з перекатом безпечніше, ніж падіння на руки."], "q": ["Якою частиною рук приймають м’яч знизу?", "Як з’єднують руки для прийому?", "Чому рух виконують ногами, а : ["дозвіл на подачу — рух рукою в бік подачі;", "команда, що подаватиме, — рука витягнута в її бік;", "м’яч у полі — рука вказує на підлогу майданчика;", "аут — обидві руки зігнуті, долоні до себе;", "чотири торкання — чотири пальці;", "подвійне торкання — два пальці;", "торкання сітки — долонею по сітці;", "перерва — руки буквою «Т»;", "заміна — оберти рук одна навколо іншої."]}, {"h": "Протокол гри", "p": ["У протокол вносять назви команд, номери гравців, розстановку на початку кожної партії, рахунок, заміни, перерви, попередження та покарання, результат і підписи. Правильне ведення протоколу — запорука чесності змагань."], "ul": []}], "f": "", "pr": ["Намалюйте або опишіть 8 жестів судді та їхнє значення.", "Перегляньте фрагмент волейбольного матчу й запишіть, які жести судді ви побачили."], "q": ["З кого складається суддівська бригада?", "Що контролює другий суддя?", "Покажіть (опишіть) жест «аут».", "Що записують у протокол гри?"]}, {"n": "9", "t": "Тактика гри. Взаємодія гравців. Страховка. Побудова «кутом вперед». Фактори ефективності змагальної діяльності", "g": "Знати основи командної тактики волейболу: взаємодію з зв’язковим, страховку, розстановки під час прийому та чинники успішної гри.", "k": "12, 14, 15, 16, 17, 18, 22", "terms": [["Тактика", "організація дій гравців і команди для досягнення перемоги."], ["Страховка", "позиція гравця, готового підхопити м’яч, якщо партнер не впорається."], ["«Кутом вперед»", "розстановка при прийомі, коли гравець зони 6 виходить уперед, утворюючи кут."]], "th": [{"h": "Схема «прийом — передача — атака»", "p": [], "ul": ["перше торкання — прийом, м’яч спрямовують зв’язковому (зона 3 або 2);", "друге торкання — передача зв’язкового нападникові;", "третє — нападаючий удар.", "Зв’язковий обирає партнера для атаки: того, хто в кращій позиції, або проти слабшого блоку суперника."]}, {"h": "Страховка", "p": ["Під час прийому та нападу гравці, які не виконують дію, займають місця страховки: ближче до партнера, щоб підхопити м’яч, що відскочив від рук чи блоку. При побудові «кутом вперед» гравець зони 6 виходить до лінії атаки й страхує нападників."], "ul": []}, {"h": "Фактори ефективності змагальної діяльності", "p": [], "ul": ["фізична підготовленість (швидкість, стрибучість, витривалість);", "технічна майстерність;", "тактична грамотність, взаєморозуміння;", "психологічна стійкість, уміння зосередитися;", "командний дух і комунікація на майданчику."]}], "f": "", "pr": ["Намалюйте схему розстановки «кутом вперед» під час прийому подачі.", "Назвіть 5 факторів, від яких залежить успіх команди, і поясніть, як їх розвивати."], "q": ["Опишіть схему «прийом — передача — атака».", "Що таке страховка?", "Як обирає зв’язковий партнера для атаки?", "Які фактори визначають ефективність гри?"]}, {"n": "10", "t": "Волейбол як засіб фізичного виховання. Досягнення українських волейболістів", "g": "Розуміти оздоровче й виховне значення волейболу та знати про розвиток волейболу в Україні.", "k": "8, 15", "terms": [["Фізичні якості", "сила, швидкість, витривалість, спритність, гнучкість."], ["Пляжний волейбол", "олімпійський вид: команди по 2 гравці на піску."]], "th": [{"h": "Оздоровче значення", "p": [], "ul": ["зміцнює серцево-судинну та дихальну системи;", "розвиває стрибучість, швидкість реакції, координацію;", "зміцнює м’язи ніг, рук, спини;", "покращує поставу й окомір;", "підходить для будь-якого віку, адже є безконтактним."]}, {"h": "Виховне значення", "p": ["Волейбол виховує відповідальність перед командою, уміння довіряти партнерам, дисципліну, наполегливість і вміння контролювати емоції — кожне очко команда здобуває разом."], "ul": []}, {"h": "Волейбол в Україні", "p": [], "ul": ["волейбол — один з найпопулярніших ігрових видів спорту в українських школах;", "чоловіча збірна України 2022 року дійшла до чвертьфіналу чемпіонату світу;", "Олег Плотницький — один з провідних нападників світу, багато років грає за італійську «Перуджу»;", "розвиваються пляжний волейбол та волейбол сидячи (паралімпійський вид), популярний серед ветеранів."]}], "f": "Волейбол сидячи — паралімпійський вид спорту, у якому сітка нижча (близько 1,15 м для чоловіків), а гравці мають постійно торкатися підлоги сідницями.", "pr": ["Підготуйте коротке повідомлення (8–10 речень) про українського волейболіста чи волейболістку.", "Складіть таблицю «Фізичні якості — які дії у волейболі їх розвивають»."], "q": ["Які фізичні якості розвиває волейбол?", "Які риси характеру виховує гра?", "Що таке волейбол сидячи?", "Назвіть досягнення українських волейболістів."]}, {"n": "11", "t": "Попередження спортивного травматизму", "g": "Знати причини спортивних травм і способи їх запобігання.", "k": "14", "terms": [["Спортивний травматизм", "пошкодження, отримані під час занять фізкультурою і спортом."], ["Перевтома", "стан, коли організм не встигає відновитися після навантажень."]], "th": [{"h": "Причини травм", "p": [], "ul": ["відсутність або погана розминка;", "неправильна техніка виконання вправ;", "невідповідний одяг і взуття, прикраси;", "порушення правил гри та дисципліни;", "надмірне навантаження, втома, недостатній сон;", "незадовільний стан спортивного майданчика чи інвентарю."]}, {"h": "Типові травми у волейболі", "p": [], "ul": ["розтягнення зв’язок гомілковостопного суглоба (приземлення на ногу іншого гравця);", "травми пальців (вивихи, забої) під час блоку й прийому;", "травми колін і плечового суглоба."]}, {"h": "Як запобігти", "p": [], "ul": ["завжди розминатися й завершувати заняття заминкою;", "опановувати правильну техніку, особливо приземлення та падіння;", "поступово збільшувати навантаження;", "користуватися якісним взуттям, за потреби — наколінниками;", "дотримуватися режиму сну й харчування, пити воду;", "не займатися при поганому самопочутті."]}], "f": "", "pr": ["Складіть пам’ятку «10 способів уникнути спортивної травми».", "Опишіть, як правильно приземлятися після стрибка, щоб не травмувати гомілковостоп."], "q": ["Назвіть основні причини спортивних травм.", "Які травми найчастіше трапляються у волейболі?", "Чому важлива заминка після заняття?", "Як режим дня впливає на ризик травм?"]}]}, {"name": "Розділ 2. Настільний теніс (уроки 27–52)", "lessons": [{"n": "12", "t": "Інструктаж з БЖД на заняттях настільним тенісом. Історія та правила гри. Стійка тенісиста", "g": "Знати правила безпеки, історію та основні правила настільного тенісу, способи тримання ракетки й стійку тенісиста.", "k": "27 (первинний), 28–52 (повторення)", "terms": [["Хватка", "спосіб тримання ракетки."], ["Європейська хватка («рукостискання»)", "ракетку тримають, ніби вітаються з нею за руку; найпоширеніша."], ["Азійська хватка («перо»)", "ракетку тримають як ручку для письма."], ["Партія (гейм)", "триває до 11 очок з перевагою у 2 очки."]], "th": [{"h": "Правила безпеки", "p": [], "ul": ["займатися у спортивному взутті, на сухій неслизькій підлозі;", "між столами має бути достатньо місця; не бігати між столами під час гри інших;", "не сідати й не спиратися на стіл, не пересувати його самостійно (складні столи можуть травмувати руки);", "не махати ракеткою поруч з іншими; не кидати ракетку;", "підбирати м’ячі, щоб не наступити на них."]}, {"h": "Історія", "p": [], "ul": ["гра виникла в Англії наприкінці ХІХ ст. як кімнатна розвага; звук удару дав назву «пінг-понг»;", "1926 р. — створено Міжнародну федерацію настільного тенісу (ITTF), проведено перший чемпіонат світу;", "1988 р. — настільний теніс став олімпійським видом спорту (Сеул);", "найсильніша школа сьогодні — китайська."]}, {"h": "Інвентар і правила", "p": [], "ul": ["стіл 274 × 152,5 см, висота 76 см; висота сітки 15,25 см;", "м’яч діаметром 40 мм, масою 2,7 г;", "партія — до 11 очок (при 10:10 — до переваги у 2 очки); матч — з 3, 5 або 7 партій;", "подачу змінюють кожні 2 очки (при 10:10 — кожне очко);", "м’яч має один раз відскочити на своєму боці при подачі та на боці суперника."]}, {"h": "Стійка тенісиста", "p": [], "ul": ["ноги на ширині плечей або трохи ширше, права (для правші) трохи позаду;", "коліна зігнуті, вага на передній частині стоп;", "корпус трохи нахилений уперед, ракетка перед собою на рівні столу;", "відстань до столу — близько витягнутої руки;", "з цієї стійки легко пересуватися приставними кроками вліво-вправо."]}], "f": "Під час гри в настільний теніс м’яч у професіоналів може летіти зі швидкістю понад 100 км/год і обертатися понад 100 обертів за секунду.", "pr": ["Намалюйте схему тенісного столу з розмірами.", "Порівняйте європейську та азійську хватки: переваги й недоліки."], "q": ["Коли настільний теніс став олімпійським видом?", "До скількох очок триває партія?", "Як часто змінюється подача?", "Опишіть стійку тенісиста.", "Назвіть 4 правила безпеки на заняттях."]}, {"n": "13", "t": "Методика проведення самостійних занять. Комплекс спеціальних вправ тенісиста. Техніко-тактична підготовка", "g": "Знати, як правильно організувати самостійні заняття, та призначення спеціальних вправ тенісиста.", "k": "27, 29, 33, 35", "terms": [["Самостійні заняття", "тренування, які людина організовує сама, поза уроком."], ["Самоконтроль", "спостереження за власним самопочуттям і показниками (пульс, сон, настрій)."], ["Техніко-тактична підготовка", "вдосконалення техніки ударів і вміння застосовувати їх у грі."]], "th": [{"h": "Принципи самостійних занять", "p": [], "ul": ["регулярність — 2–3 рази на тиждень;", "поступовість — навантаження збільшують повільно;", "структура заняття: розминка (10 хв) → основна частина → заминка (5–10 хв);", "самоконтроль: пульс до, під час і після заняття, самопочуття, сон;", "щоденник тренувань: що робив, скільки, як почувався."]}, {"h": "Спеціальні вправи тенісиста (що вони розвивають)", "p": [], "ul": ["приставні кроки вліво-вправо в стійці — швидкість пересування біля столу;", "імітація ударів без м’яча (перед дзеркалом) — техніка й автоматизм;", "набивання м’яча на ракетці різними сторонами — відчуття м’яча;", "вправи для кисті та передпліччя;", "вправи на реакцію (ловля м’ячика, що відскочив від стіни)."]}, {"h": "Техніко-тактична підготовка", "p": ["Техніка — це «як» виконати удар, тактика — «коли й навіщо». Тенісист поєднує подачі, накати й підрізки, змінює обертання, темп і напрямок, щоб змусити суперника помилитися. Тактичні принципи: грати в незручну для суперника сторону, змінювати довжину й обертання м’яча, атакувати слабкі передачі."], "ul": []}], "f": "", "pr": ["Складіть план самостійного заняття тривалістю 30 хвилин (розминка, основна частина, заминка).", "Створіть шаблон щоденника самоконтролю на тиждень."], "q": ["Які принципи самостійних занять ви знаєте?", "З яких частин складається заняття?", "Що таке самоконтроль і які показники варто відстежувати?", "Чим техніка відрізняється від тактики?"]}, {"n": "14", "t": "Подачі з нижнім, верхнім і боковим обертанням. Подача «маятник»", "g": "Знати правила подачі та різновиди подач з обертанням, зокрема подачу «маятник».", "k": "28, 29, 31, 33, 35, 38, 43, 46, 47, 48, 50, 52", "terms": [["Нижнє обертання (підрізка)", "м’яч обертається «назад», після відскоку гальмує і прагне піти вниз."], ["Верхнє обертання (топ)", "м’яч обертається «вперед», після відскоку прискорюється."], ["Бокове обертання", "м’яч обертається навколо вертикальної осі й відхиляється вбік."], ["Подача «маятник»", "подача, під час якої ракетка рухається, як маятник, створюючи бокове (і нижнє або верхнє) обертання."]], "th": [{"h": "Правила подачі", "p": [], "ul": ["м’яч лежить на відкритій долоні вільної руки, над рівнем столу й за задньою лінією;", "м’яч підкидають вертикально вгору щонайменше на 16 см;", "удар — коли м’яч опускається;", "м’яч має відскочити один раз на своєму боці, а потім — на боці суперника;", "у парній грі подача виконується по діагоналі (з правої половини в праву)."]}, {"h": "Подачі з обертанням", "p": [], "ul": ["з нижнім обертанням — ракетка «підрізає» м’яч знизу рухом уперед-униз;", "з верхнім обертанням — ракетка рухається знизу вгору-вперед, «накриваючи» м’яч;", "з боковим — рух ракетки вбік; часто поєднують з нижнім чи верхнім («нижньобокова»)."]}, {"h": "Подача «маятник»", "p": ["Виконується справа: ракетка рухається від себе до себе (як маятник), удар — по нижній чи бічній частині м’яча. Змінюючи точку удару, можна давати різне обертання однаковим рухом — це збиває суперника з пантелику."], "ul": []}, {"h": "Контрольний норматив (довідково)", "p": ["Виконання подачі з нижнім боковим обертанням у визначену зону."], "ul": []}], "f": "Сильне обертання м’яча пояснюється ефектом Магнуса: через різницю тиску з двох боків м’яч відхиляється від прямої траєкторії.", "pr": ["Намалюйте схеми нижнього, верхнього та бокового обертання м’яча (стрілками) і опишіть, як м’яч поводиться після відскоку.", "Запишіть правила подачі у вигляді пам’ятки."], "q": ["На яку висоту потрібно підкидати м’яч при подачі?", "Чим відрізняється нижнє обертання від верхнього?", "Як виконується подача «маятник»?", "Як виконується подача в парній грі?"]}, {"n": "15", "t": "Прийом подачі з нижнім обертанням м’яча", "g": "Знати, як розпізнати нижнє обертання та як правильно приймати таку подачу.", "k": "27, 29, 31, 36, 41", "terms": [["Підрізка (підрізання)", "удар, що надає м’ячу нижнього обертання."], ["Відкрита ракетка", "ракетка, нахилена ігровою поверхнею догори."]], "th": [{"h": "Як розпізнати нижнє обертання", "p": [], "ul": ["ракетка суперника рухалася зверху вниз і «підрізала» м’яч;", "м’яч летить повільніше, після відскоку ніби «гальмує»;", "якщо підставити ракетку прямо — м’яч піде в сітку."]}, {"h": "Способи прийому", "p": [], "ul": ["підрізкою — ракетка відкрита, рух уперед-униз під м’ячем; безпечний спосіб;", "накатом по нижньому обертанню — активний рух знизу вгору (для досвідчених);", "«скидка» (коротка відповідь) — м’яч ледь перелітає сітку, ускладнюючи атаку суперника."]}, {"h": "Поради", "p": ["Уважно стежте за ракеткою суперника в момент удару, займіть стійку ближче до столу, реагуйте ногами, а не лише рукою. Чим сильніше обертання — тим більше треба відкривати ракетку."], "ul": []}], "f": "", "pr": ["Опишіть три ознаки, за якими можна визначити нижнє обертання подачі.", "Поясніть, чому м’яч з нижнім обертанням іде в сітку, якщо підставити ракетку прямо."], "q": ["Як розпізнати подачу з нижнім обертанням?", "Як треба нахилити ракетку при прийомі підрізкою?", "Що таке «скидка»?", "Чому важливо стежити за ракеткою суперника?"]}, {"n": "16", "t": "Накат справа та зліва по діагоналі. Серійні удари", "g": "Знати техніку накату справа та зліва й розуміти, чому гру ведуть по діагоналі.", "k": "28, 30, 32, 34, 37, 40, 42, 45, 47, 49, 51", "terms": [["Накат", "атакувальний удар з верхнім обертанням, рух ракетки знизу вгору-вперед."], ["Справа / зліва", "удар з правого (форхенд) чи лівого (бекхенд) боку тіла."], ["Діагональ", "напрямок удару з кута в протилежний кут столу."]], "th": [{"h": "Накат справа (форхенд)", "p": [], "ul": ["стійка: ліва нога трохи попереду (у правші);", "замах — поворот тулуба праворуч, ракетка відводиться вниз-назад;", "удар — рух ракетки вгору-вперед з поворотом тулуба, ракетка трохи закрита;", "удар у верхній точці відскоку або на висхідній;", "після удару — повернення в стійку."]}, {"h": "Накат зліва (бекхенд)", "p": [], "ul": ["ракетка перед собою, лікоть трохи виведений уперед;", "рух від себе з розгинанням передпліччя і кисті;", "удар коротший і компактніший, ніж справа."]}, {"h": "Чому по діагоналі", "p": ["Діагональ — найдовший шлях через стіл (близько 3,2 м), тож м’яч має більше «запасу» для влучання, а сітка по краях нижча. Серійні удари по діагоналі з партнером — основна вправа для закріплення техніки."], "ul": []}, {"h": "Контрольний норматив (довідково)", "p": ["Серійні удари справа або зліва з партнером по діагоналі — оцінюють кількість ударів без помилки."], "ul": []}], "f": "", "pr": ["Опишіть по фазах накат справа і накат зліва, порівняйте їх.", "Поясніть, чому гравці-початківці тренують удари саме по діагоналі."], "q": ["Що таке накат?", "Чим накат справа відрізняється від накату зліва?", "У якій точці відскоку краще бити накатом?", "Чому діагональ вигідна для удару?"]}, {"n": "17", "t": "Контрудари", "g": "Знати, що таке контрудар і коли його застосовувати.", "k": "30, 34, 37, 42, 47, 51", "terms": [["Контрудар", "атакувальний удар у відповідь на атакувальний удар суперника."], ["Темп", "швидкість обміну ударами."]], "th": [{"h": "Суть контрудару", "p": ["Контрудар — це відповідь накатом на накат або топ-спін суперника. Гравець використовує швидкість м’яча суперника, додаючи власний рух. Контрудари вимагають швидкої реакції, стабільної стійки й короткого замаху."], "ul": []}, {"h": "Техніка", "p": [], "ul": ["стійка близько до столу або на середній відстані;", "короткий замах, удар на висхідній або у верхній точці;", "ракетка закрита (нахилена вперед), щоб контролювати верхнє обертання суперника;", "швидке повернення у вихідне положення."]}, {"h": "Тактичне значення", "p": ["Контрудари дозволяють перехопити ініціативу, підвищити темп і не дати суперникові спокійно атакувати."], "ul": []}], "f": "", "pr": ["Порівняйте накат і контрудар: схожість і відмінності.", "Перегляньте фрагмент професійного матчу та порахуйте, скільки контрударів виконали гравці в одному розіграші."], "q": ["Що таке контрудар?", "Чому для контрудару потрібен короткий замах?", "Як нахиляють ракетку при контрударі проти верхнього обертання?", "Яке тактичне значення контрударів?"]}, {"n": "18", "t": "Топ-спін. Підрізка справа", "g": "Знати різницю між топ-спіном і підрізкою та їхнє призначення у грі.", "k": "39, 44, 49", "terms": [["Топ-спін", "удар з дуже сильним верхнім обертанням: ракетка «зачісує» м’яч знизу вгору."], ["Підрізка", "захисний удар з нижнім обертанням."]], "th": [{"h": "Топ-спін", "p": [], "ul": ["головна атакувальна зброя сучасного тенісу;", "рух ракетки — знизу вгору-вперед, дотик до м’яча дотичний, «зачісувальний»;", "м’яч летить дугою, після відскоку різко прискорюється і «стрибає»;", "ефективний проти м’ячів з нижнім обертанням."]}, {"h": "Підрізка справа", "p": [], "ul": ["захисний удар; ракетка відкрита, рух зверху вниз-уперед під м’ячем;", "м’яч летить низько, з нижнім обертанням, його складно атакувати;", "застосовують проти коротких м’ячів і для прийому подачі з нижнім обертанням."]}, {"h": "Тактика", "p": ["Типова комбінація: подача з нижнім обертанням → суперник відповідає підрізкою → гравець атакує топ-спіном. Уміння поєднувати підрізку й топ-спін робить гру різноманітною."], "ul": []}], "f": "", "pr": ["Складіть таблицю «Топ-спін / підрізка»: обертання, рух ракетки, траєкторія, призначення.", "Опишіть тактичну комбінацію з подачі, підрізки та топ-спіну."], "q": ["Що таке топ-спін?", "Як рухається ракетка під час підрізки?", "Чому топ-спін ефективний проти нижнього обертання?", "Коли застосовують підрізку?"]}, {"n": "19", "t": "Настільний теніс в Україні та світі. Оздоровче значення", "g": "Знати досягнення українських тенісистів і користь настільного тенісу для здоров’я.", "k": "27–52 (узагальнення)", "terms": [["ITTF", "Міжнародна федерація настільного тенісу."], ["Паранастільний теніс", "настільний теніс для людей з інвалідністю — паралімпійський вид."]], "th": [{"h": "Користь для здоров’я", "p": [], "ul": ["розвиває швидкість реакції, координацію рухів «око — рука»;", "тренує увагу, зосередженість, тактичне мислення;", "помірне навантаження на серце й дихальну систему;", "доступний для будь-якого віку."]}, {"h": "Українці в настільному тенісі", "p": [], "ul": ["Коу Лей — багаторазовий чемпіон України, учасник кількох Олімпійських ігор;", "Маргарита Песоцька — учасниця Олімпійських ігор, одна з найсильніших тенісисток України;", "українські паратенісисти неодноразово здобували медалі Паралімпійських ігор."]}], "f": "", "pr": ["Підготуйте повідомлення про одного з українських тенісистів.", "Назвіть 5 якостей, які розвиває настільний теніс, і поясніть, як вони знадобляться в житті."], "q": ["Які якості розвиває настільний теніс?", "Назвіть українських тенісистів.", "Чому настільний теніс підходить людям різного віку?"]}]}, {"name": "Розділ 3. Футбол (уроки 53–78)", "lessons": [{"n": "20", "t": "Інструктаж з БЖД на заняттях футболом. Історія розвитку та основні правила гри", "g": "Знати правила безпеки, історію футболу та основні правила гри.", "k": "53 (первинний), 54–78 (повторення)", "terms": [["Офсайд (положення «поза грою»)", "гравець ближче до лінії воріт суперника, ніж м’яч і передостанній захисник, у момент передачі йому м’яча."], ["Стандартні положення", "кутовий, штрафний, пенальті, вкидання м’яча з-за бокової лінії."], ["VAR", "система відеоперегляду спірних моментів."]], "th": [{"h": "Правила безпеки", "p": [], "ul": ["форма, бутси чи кросівки відповідно до покриття, щитки на гомілки;", "зняти прикраси; ворота мають бути надійно закріплені — не висіти на поперечині;", "не виконувати підкати ззаду та удари ногою на рівні голови суперника;", "розминка обов’язкова; при травмі — негайно зупинитися й повідомити вчителя."]}, {"h": "Історія", "p": [], "ul": ["ігри з м’ячем ногами відомі в Китаї (цуцзю), Греції, Римі;", "1863 р. — в Англії створено Футбольну асоціацію та перші єдині правила — народження сучасного футболу;", "1904 р. — заснована FIFA; 1930 р. — перший чемпіонат світу (Уругвай);", "1954 р. — створено УЄФА; чемпіонат Європи — з 1960 р."]}, {"h": "Основні правила", "p": [], "ul": ["у команді на полі 11 гравців, серед них воротар;", "матч — два тайми по 45 хвилин з перервою 15 хвилин;", "розміри поля для міжнародних матчів — 100–110 × 64–75 м; ворота 7,32 × 2,44 м;", "руками грає лише воротар у своєму штрафному майданчику;", "порушення карають штрафним або пенальті, попередженням (жовта картка) чи вилученням (червона);", "гол зараховують, коли м’яч повністю перетнув лінію воріт."]}, {"h": "Футбол в Україні", "p": [], "ul": ["київське «Динамо» двічі вигравало Кубок володарів кубків (1975, 1986) і Суперкубок УЄФА (1975);", "донецький «Шахтар» виграв Кубок УЄФА у 2009 році;", "«Золотий м’яч» здобували Олег Блохін (1975), Ігор Бєланов (1986), Андрій Шевченко (2004);", "збірна України — чвертьфіналіст чемпіонату світу 2006 і Євро-2020; Україна разом з Польщею приймала Євро-2012."]}], "f": "Андрій Шевченко виграв Лігу чемпіонів з «Міланом» (2003) і став першим володарем «Золотого м’яча» в історії незалежної України (2004).", "pr": ["Намалюйте схему футбольного поля з розмітками (центральне коло, штрафний майданчик, точка пенальті, кутові сектори).", "Поясніть своїми словами правило офсайду з прикладом-схемою."], "q": ["Коли з’явилися перші єдині правила футболу?", "Скільки триває матч?", "Які розміри футбольних воріт?", "Що таке офсайд?", "Назвіть українських володарів «Золотого м’яча»."]}, {"n": "21", "t": "Удари по м’ячу ногою", "g": "Знати способи ударів по м’ячу ногою та їхнє призначення.", "k": "53, 57, 65, 70, 77", "terms": [["Удар внутрішньою стороною стопи", "найточніший удар, для передач на короткі й середні відстані."], ["Удар підйомом", "удар верхньою частиною стопи (шнурівкою); сильний, для ударів по воротах і далеких передач."], ["Опорна нога", "нога, що стоїть поруч із м’ячем під час удару."]], "th": [{"h": "Способи ударів", "p": [], "ul": ["внутрішньою стороною стопи — точні передачі;", "серединою підйому — сильні прямі удари;", "внутрішньою частиною підйому — навісні передачі, «закручені» удари;", "зовнішньою частиною підйому — удари з обертанням («шведкою»);", "носком — рідко, коли немає часу на замах."]}, {"h": "Фази удару", "p": [], "ul": ["розбіг — прямолінійний або під кутом;", "постановка опорної ноги збоку від м’яча (носок у напрямку удару);", "замах ударною ногою (згинання в коліні);", "удар — ступня напружена, зафіксована;", "супровід м’яча — нога продовжує рух у напрямку удару."]}, {"h": "Поради", "p": ["Дивіться на м’яч у момент удару, корпус над м’ячем для низького удару; відхилення корпусу назад робить удар «свічкою»."], "ul": []}], "f": "", "pr": ["Складіть таблицю «Спосіб удару — коли застосовують — точність / сила».", "Опишіть фази удару серединою підйому."], "q": ["Який удар найточніший і чому?", "Куди ставлять опорну ногу?", "Чому м’яч летить угору, якщо корпус відхилено назад?", "Для чого застосовують удар внутрішньою частиною підйому?"]}, {"n": "22", "t": "Зупинки та ведення м’яча різними способами", "g": "Знати способи зупинки й ведення м’яча і розуміти, коли їх застосовують.", "k": "53, 57, 61, 65, 70, 74, 77, 78", "terms": [["Зупинка (прийом) м’яча", "гасіння швидкості м’яча, щоб узяти його під контроль."], ["Ведення м’яча", "переміщення з м’ячем серією легких поштовхів."]], "th": [{"h": "Способи зупинки", "p": [], "ul": ["підошвою — для м’ячів, що котяться;", "внутрішньою стороною стопи — найпоширеніша;", "стегном — для м’ячів, що летять на рівні пояса;", "грудьми — для високих м’ячів;", "головою — рідко, у складних ситуаціях.", "Принцип: частина тіла «поступається» м’ячу, гасячи його швидкість (амортизація)."]}, {"h": "Способи ведення", "p": [], "ul": ["внутрішньою стороною стопи — зручно змінювати напрямок;", "зовнішньою частиною підйому — швидке ведення по прямій;", "серединою підйому — на великій швидкості;", "голова піднята, щоб бачити поле; м’яч близько до ноги, якщо поруч суперник."]}, {"h": "Контрольні нормативи (довідково)", "p": ["Зупинка м’яча різними способами та ведення м’яча зі зміною напрямку (між стійками) на час."], "ul": []}], "f": "", "pr": ["Опишіть, якою частиною тіла краще зупинити м’яч у 5 різних ситуаціях.", "Поясніть, чому під час ведення важливо тримати голову піднятою."], "q": ["Назвіть способи зупинки м’яча.", "Що означає «амортизувати» м’яч?", "Які способи ведення м’яча ви знаєте?", "Коли м’яч ведуть близько до ноги?"]}, {"n": "23", "t": "Фінти. Відбирання м’яча в підкаті", "g": "Знати, що таке фінти, їхні види, та правила безпечного відбору м’яча.", "k": "54, 59, 64, 69", "terms": [["Фінт", "обманний рух, що змушує суперника рушити в хибному напрямку."], ["Відбір", "дії, щоб заволодіти м’ячем суперника."], ["Підкат", "відбір м’яча в ковзанні по газону."]], "th": [{"h": "Види фінтів", "p": [], "ul": ["«відходом» — показати рух в один бік і піти в інший;", "«ударом» — імітувати удар чи передачу, а потім обійти суперника;", "«зупинкою» — різко зупинитися й змінити темп;", "переступи через м’яч."]}, {"h": "Відбір м’яча", "p": [], "ul": ["стоячи — випадом, виставленою ногою;", "плечем у плече (дозволений силовий прийом);", "у підкаті — ковзаючи по газону, вибити або забрати м’яч ногою."]}, {"h": "Безпека підкату", "p": ["Підкат виконують лише збоку або спереду, граючи в м’яч, а не в ногу суперника. Підкат ззаду, двома ногами чи з шипами вперед — грубе порушення, що карається червоною карткою й може спричинити важку травму. На шкільних уроках і на твердому покритті підкати не виконують."], "ul": []}], "f": "", "pr": ["Опишіть два фінти, які ви бачили у професійних футболістів.", "Складіть правила безпечного відбору м’яча."], "q": ["Що таке фінт?", "Назвіть види фінтів.", "Які способи відбору м’яча ви знаєте?", "Коли підкат вважається грубим порушенням?"]}, {"n": "24", "t": "Удари по м’ячу головою. Техніка удару лобом", "g": "Знати техніку удару лобом і правила безпечного виконання.", "k": "55, 60, 66, 71, 73, 76", "terms": [["Удар лобом", "удар серединою лоба — основний і найбезпечніший спосіб удару головою."]], "th": [{"h": "Техніка", "p": [], "ul": ["стежити за м’ячем до моменту удару, очі відкриті;", "шия напружена, підборіддя трохи притиснуте;", "удар серединою лоба (не маківкою чи скронею);", "рух іде від корпусу: прогин назад і різкий рух уперед;", "удари виконують з місця, у стрибку або в падінні."]}, {"h": "Безпека та здоров’я", "p": ["Часті удари головою можуть шкодити мозку, тому в багатьох країнах для дітей і підлітків кількість таких ударів на тренуваннях обмежують. На уроках використовують легкі м’ячі й невелику кількість повторів. При запамороченні, головному болю чи нудоті після удару — негайно припинити заняття."], "ul": []}], "f": "", "pr": ["Опишіть техніку удару лобом по етапах.", "Поясніть, чому для підлітків обмежують кількість ударів головою."], "q": ["Якою частиною голови б’ють по м’ячу?", "Чому шия має бути напруженою?", "Які симптоми після удару головою — привід припинити заняття?"]}, {"n": "25", "t": "Гра воротаря: кидки руками, вибивання м’яча ногами, гра на виходах", "g": "Знати основні технічні прийоми воротаря та правила, що стосуються його гри.", "k": "56, 62, 67, 75", "terms": [["Вихід воротаря", "рух воротаря з воріт, щоб перехопити м’яч до удару суперника."], ["Введення м’яча в гру", "кидок рукою або удар ногою воротаря після того, як він заволодів м’ячем."]], "th": [{"h": "Прийоми воротаря", "p": [], "ul": ["ловля м’яча — «чашечкою» з долонь, прижимання до грудей;", "відбивання кулаком — коли не впевнений, що спіймаєш;", "стрибок-кидок — для м’ячів у кут;", "вибір позиції — на бісектрисі кута між м’ячем і стійками воріт."]}, {"h": "Введення м’яча", "p": [], "ul": ["кидок знизу (котом) — на короткі відстані;", "кидок зверху (як гандбольний) — на середні відстані;", "вибивання з рук або з землі — на далекі відстані, для швидкої атаки."]}, {"h": "Гра на виходах", "p": ["Воротар виходить, щоб перехопити навісну передачу або скоротити кут перед ударом нападника. Потрібні рішучість, правильний вибір моменту і гучна команда захисникам («Моя!»)."], "ul": []}, {"h": "Правила для воротаря", "p": [], "ul": ["грати руками дозволено лише у своєму штрафному майданчику;", "тримати м’яч у руках — не довше 6 секунд;", "не можна брати в руки м’яч після навмисної передачі ногою від свого гравця."]}], "f": "Українець Олександр Шовковський провів понад 20 сезонів у воротах київського «Динамо» і відбив вирішальні пенальті в серії з Швейцарією на чемпіонаті світу 2006 року.", "pr": ["Намалюйте схему вибору позиції воротарем при ударі з флангу й по центру.", "Складіть таблицю «Спосіб введення м’яча — відстань — перевага»."], "q": ["Де воротар може грати руками?", "Скільки секунд воротар може тримати м’яч?", "Як обирає позицію воротар?", "Що таке гра на виходах?"]}, {"n": "26", "t": "Тактика футболу: швидкий і поступовий напад, організація оборони", "g": "Знати види нападу й оборони та принципи командної тактики у футболі.", "k": "58, 63, 68, 72", "terms": [["Швидкий напад (контратака)", "стрімка атака після відбору м’яча, поки суперник не організував оборону."], ["Поступовий (позиційний) напад", "атака з контролем м’яча, серіями передач, пошуком слабкого місця."], ["Персональна оборона", "кожен захисник опікає конкретного суперника."], ["Зонна оборона", "кожен захисник відповідає за свою зону поля."]], "th": [{"h": "Швидкий напад", "p": [], "ul": ["мінімум передач — довгі передачі вперед, ривки нападників;", "застосовують, коли суперник багатьма гравцями пішов в атаку;", "оборона проти нього — швидке повернення в оборону, страховка, перекриття зон і напрямків передач."]}, {"h": "Поступовий напад", "p": [], "ul": ["контроль м’яча, передачі в ширину й глибину;", "розтягування оборони суперника, пошук вільного простору;", "оборона проти нього — компактність, щільні лінії, пресинг."]}, {"h": "Схеми розстановки", "p": ["Розстановку позначають цифрами від захисту до атаки (без воротаря): 4-4-2, 4-3-3, 3-5-2. Вона визначає, скільки гравців у кожній лінії, але в грі гравці постійно взаємодіють і змінюють позиції."], "ul": []}, {"h": "Принципи командної гри", "p": [], "ul": ["кожен гравець атакує і обороняється;", "комунікація — голосові підказки партнерам;", "підтримка партнера з м’ячем, відкривання для передачі."]}], "f": "Тренер Валерій Лобановський одним з перших у світі застосував наукові методи (статистику, моделювання) у підготовці футбольної команди.", "pr": ["Намалюйте схему розстановки 4-4-2 або 4-3-3 і позначте зони відповідальності.", "Опишіть ситуацію, коли команді вигідно застосувати швидкий напад."], "q": ["Чим швидкий напад відрізняється від поступового?", "Що таке персональна та зонна оборона?", "Що означає розстановка 4-3-3?", "Які принципи командної гри ви знаєте?"]}]}, {"name": "Розділ 4. Легка атлетика (уроки 79–105)", "lessons": [{"n": "27", "t": "Інструктаж з БЖД на заняттях легкою атлетикою. Спеціальні бігові та стрибкові вправи. Історія легкої атлетики", "g": "Знати правила безпеки на заняттях легкою атлетикою, види легкої атлетики та призначення спеціальних вправ.", "k": "79 (первинний), 80–105 (повторення)", "terms": [["Легка атлетика", "«королева спорту»: біг, ходьба, стрибки, метання, багатоборства."], ["Бігова доріжка", "стадіонна доріжка довжиною 400 м (по першій доріжці)."], ["Сектор", "місце для стрибків чи метань."]], "th": [{"h": "Правила безпеки", "p": [], "ul": ["займатися в легкому одязі за погодою та в кросівках;", "бігти лише у своїй доріжці, не перетинати доріжку, де біжать інші;", "не стояти в секторі метання й не перебігати його; метати лише за командою вчителя, підбирати снаряди — теж за командою;", "перед стрибками перевірити, чи розпушено пісок у ямі, чи немає в ньому сторонніх предметів;", "після фінішу не зупинятися різко — поступово перейти на ходьбу;", "пити воду, у спеку — головний убір."]}, {"h": "Історія", "p": [], "ul": ["біг на один стадій (близько 192 м) — перша дисципліна античних Олімпійських ігор (776 р. до н. е.);", "легка атлетика — основа сучасних Олімпійських ігор з 1896 р.;", "World Athletics (колишня IAAF) заснована 1912 р."]}, {"h": "Видатні українські легкоатлети", "p": [], "ul": ["Валерій Борзов — олімпійський чемпіон 1972 р. у бігу на 100 і 200 м;", "Сергій Бубка — стрибки з жердиною, 35 світових рекордів, олімпійський чемпіон 1988 р.;", "Наталія Добринська — олімпійська чемпіонка 2008 р. в семиборстві;", "Ярослава Магучіх — олімпійська чемпіонка 2024 р. у стрибках у висоту, світова рекордсменка (2,10 м, 2024)."]}, {"h": "Спеціальні бігові та стрибкові вправи", "p": [], "ul": ["біг з високим підніманням стегна, із закиданням гомілки, семенячий біг — техніка й частота кроків;", "біг прямими ногами, стрибковий біг — сила поштовху;", "прискорення 20–30 м — швидкість;", "стрибки на одній і двох ногах, багатоскоки, стрибки через перешкоди — вибухова сила ніг."]}], "f": "Ярослава Магучіх встановила світовий рекорд 2,10 м у Парижі 7 липня 2024 року й за місяць виграла Олімпійські ігри в тому ж місті.", "pr": ["Складіть пам’ятку «Правила безпеки на заняттях легкою атлетикою».", "Підготуйте повідомлення про одного з українських легкоатлетів."], "q": ["Чому легку атлетику називають «королевою спорту»?", "Які правила безпеки діють у секторі метання?", "Назвіть видатних українських легкоатлетів.", "Для чого виконують біг з високим підніманням стегна?"]}, {"n": "28", "t": "Біг на короткі дистанції: 30 м, 100 м, 200 м. Серії бігу 3×30 м, 2×100 м, 2×200 м", "g": "Знати фази спринтерського бігу, види стартів та значення серійного (повторного) бігу для розвитку швидкості.", "k": "79, 82, 83, 84, 85, 86, 87, 88, 89, 93, 94, 97, 99, 101, 102, 103, 104, 105", "terms": [["Спринт", "біг на короткі дистанції (до 400 м) з максимальною швидкістю."], ["Низький старт", "старт зі стартових колодок; застосовують на 100, 200, 400 м."], ["Високий старт", "старт стоячи; застосовують на 30 м у школі та на довгих дистанціях."], ["Повторний (серійний) біг", "кілька відрізків з відпочинком між ними, напр. 3×30 м."]], "th": [{"h": "Фази спринтерського бігу", "p": [], "ul": ["старт — команди «На старт!», «Увага!», постріл (або «Руш!»);", "стартовий розбіг — перші 15–30 м, корпус поступово випрямляється, кроки збільшуються;", "біг по дистанції — максимальна швидкість, активна робота рук, біг на передній частині стопи;", "фініш — кидок грудьми або плечем на фінішну лінію, після фінішу — поступове зниження швидкості."]}, {"h": "Особливості 200 м", "p": ["Частину дистанції біжать по віражу (повороту): корпус нахиляють ліворуч, права рука працює ширше. Старт ставлять ближче до зовнішнього краю доріжки, щоб бігти по дотичній."], "ul": []}, {"h": "Серійний біг", "p": ["Повторний біг (3×30 м, 2×100 м, 2×200 м) розвиває швидкість і швидкісну витривалість. Між відрізками — відпочинок ходьбою до відновлення пульсу. Кожен відрізок пробігають з однаковою якістю техніки."], "ul": []}, {"h": "Типові помилки", "p": [], "ul": ["передчасне випрямлення на старті;", "біг «на п’ятках», закріпачені плечі;", "сповільнення перед фінішною лінією."]}], "f": "Світовий рекорд у бігу на 100 м (9,58 с) встановив Усейн Болт 2009 року — його середня швидкість становила майже 37,6 км/год.", "pr": ["Опишіть фази бігу на 100 м і зазначте головне завдання кожної.", "Обчисліть середню швидкість (м/с і км/год) бігуна, який пробіг 100 м за 14 с."], "q": ["Які фази має спринтерський біг?", "Чим низький старт відрізняється від високого?", "Як бігти по віражу?", "Для чого застосовують серійний біг?", "Як правильно фінішувати?"]}, {"n": "29", "t": "Біг на витривалість: повільний біг 6 хв, рівномірний біг до 1500 м", "g": "Знати особливості бігу на витривалість, правильну техніку й дихання, способи самоконтролю.", "k": "91, 92, 94, 96, 100", "terms": [["Витривалість", "здатність довго виконувати роботу без зниження ефективності."], ["Рівномірний біг", "біг з постійною помірною швидкістю."], ["Аеробне навантаження", "робота, під час якої організму вистачає кисню."]], "th": [{"h": "Техніка", "p": [], "ul": ["біг з високого старту;", "корпус майже вертикальний, плечі розслаблені;", "руки зігнуті приблизно під прямим кутом, рухаються вздовж тулуба;", "постановка стопи м’яка, з передньої частини або з перекатом;", "дихання ритмічне, через ніс і рот, на 2–3 кроки вдих і на 2–3 — видих."]}, {"h": "Як розподілити сили", "p": ["Не починати занадто швидко; тримати рівний темп, прискорюватися лише на останніх 100–200 м. Якщо з’являється задишка — трохи знизити темп."], "ul": []}, {"h": "Користь і самоконтроль", "p": [], "ul": ["біг на витривалість зміцнює серце, легені, судини, підвищує працездатність;", "оптимальний пульс під час оздоровчого бігу для підлітків — приблизно 130–160 уд/хв;", "після бігу пульс має знизитися до вихідного за 5–10 хвилин;", "«правило розмови»: під час повільного бігу можна говорити, не задихаючись."]}], "f": "", "pr": ["Складіть план поступового переходу від 3 до 6 хвилин безперервного бігу за 4 тижні (для самостійних занять після дозволу лікаря).", "Поясніть «правило розмови» і як за ним визначити інтенсивність."], "q": ["Що таке витривалість?", "Як правильно дихати під час тривалого бігу?", "Як розподілити сили на дистанції 1500 м?", "Який пульс оптимальний під час оздоровчого бігу?"]}, {"n": "30", "t": "Спортивна ходьба на відстань до 1000 м", "g": "Знати правила й техніку спортивної ходьби та її відмінність від бігу.", "k": "90, 95, 98", "terms": [["Спортивна ходьба", "олімпійська дисципліна: швидке пересування кроками з постійним контактом із землею."], ["Втрата контакту", "момент, коли обидві ноги в повітрі; у спортивній ходьбі заборонено."]], "th": [{"h": "Два головні правила", "p": [], "ul": ["постійний контакт із землею: одна нога ще не відірвалася, а друга вже торкається землі;", "опорна нога має бути випрямлена в коліні від моменту постановки на землю до вертикального положення."]}, {"h": "Техніка", "p": [], "ul": ["стопу ставлять на п’яту з перекатом на носок;", "активна робота тазу — він обертається навколо вертикальної осі, подовжуючи крок;", "руки зігнуті під кутом близько 90°, енергійно працюють;", "корпус прямий, погляд уперед."]}, {"h": "Порушення", "p": ["Суддя фіксує «втрату контакту» і «зігнуте коліно». За три попередження спортсмена дискваліфікують."], "ul": []}], "f": "Українські спортсмени у спортивній ходьбі неодноразово здобували медалі чемпіонатів світу та Європи.", "pr": ["Порівняйте спортивну ходьбу і біг: 3 спільні й 3 відмінні ознаки.", "Поясніть, чому за правилами коліно опорної ноги має бути випрямленим."], "q": ["Які два головні правила спортивної ходьби?", "Як ставлять стопу?", "Яку роль відіграє таз у техніці ходьби?", "За що дискваліфікують спортсменів?"]}, {"n": "31", "t": "Стрибки в довжину з місця", "g": "Знати техніку стрибка в довжину з місця та правила вимірювання результату.", "k": "80, 83, 89, 91, 96, 98, 100, 102", "terms": [["Вибухова сила", "здатність розвинути максимальне зусилля за найкоротший час."], ["Мах руками", "рух рук, що допомагає пош  "k": "87", "terms": [["Забій", "пошкодження м’яких тканин без порушення шкіри."], ["Розтягнення", "пошкодження зв’язок суглоба."], ["Вивих", "зміщення суглобових поверхонь кісток."], ["Перелом", "порушення цілісності кістки."], ["Іммобілізація", "знерухомлення пошкодженої частини тіла."]], "th": [{"h": "Загальні правила", "p": [], "ul": ["припинити заняття, повідомити вчителя, викликати допомогу — 103 або 112;", "не рухати пошкоджену кінцівку без потреби;", "заспокоїти потерпілого, стежити за його станом."]}, {"h": "Допомога при травмах", "p": [], "ul": ["забій і розтягнення — спокій, холод на 10–15 хвилин (через тканину), тугувата пов’язка, піднесене положення кінцівки;", "вивих — НЕ вправляти самостійно; знерухомити в тому положенні, яке є, холод, до лікаря;", "перелом — знерухомити (шина з підручних засобів, що захоплює два сусідні суглоби), холод, виклик швидкої; при відкритому переломі — стерильна пов’язка, при сильній кровотечі — зупинка кровотечі;", "носова кровотеча — сісти, голову трохи нахилити вперед (не закидати назад!), притиснути крила носа на 10 хвилин, холод на перенісся;", "садна й подряпини — промити чистою водою, обробити антисептиком навколо рани, накласти пов’язку;", "тепловий удар — перенести в тінь, охолодити, дати воду маленькими ковтками."]}, {"h": "Чого не можна робити", "p": [], "ul": ["гріти свіжу травму;", "вправляти вивихи й переломи;", "продовжувати тренування «через біль»."]}], "f": "", "pr": ["Складіть таблицю «Травма — ознаки — перша допомога — чого не можна робити».", "Опишіть, як виготовити шину з підручних засобів при переломі передпліччя."], "q": ["Чим вивих відрізняється від розтягнення?", "Чому не можна гріти свіжу травму?", "Як діяти при носовій кровотечі?", "Що таке іммобілізація і навіщо вона?", "За якими номерами викликати допомогу?"]}]}]}];

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = t => t.toLowerCase().replace(/[«»"()]/g, "").trim();

function makeQuiz(l){
  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Який термін відповідає визначенню?", sub: def, opts }
      : { q: "Що означає термін «" + term + "»?", sub: "", opts };
  });
}

  });
  if (!shown) toc.innerHTML = '<p class="empty">Нічого не знайдено. Спробуйте інше слово.</p>';

}
