сержант (бригади), старший майстер-сержант (роду військ), головний майстер-сержант (виду ЗСУ, Генштабу, ЗСУ)."]}, {"h": "Рядові", "p": ["Рядовий склад — рекрут, солдат, старший солдат — найчисленніший. Саме рядові тримають позиції, ведуть вогонь, керують дронами й машинами, забезпечують логістику. Від їхньої підготовки й мотивації залежить боєздатність підрозділу. У Силах оборони служать і сотні тисяч жінок — від солдата до генерала."], "ul": []}], "f": "Головний сержант ЗСУ — єдиний сержант, який носить зірку на погоні.", "pr": ["Складіть таблицю «Звання — погон (схематично) — типова посада» для рядового, сержантського й офіцерського складу.", "Поясніть своїми словами, чому сержантів називають «хребтом армії»."], "q": ["Назвіть звання молодшого та старшого офіцерського складу.", "Хто зазвичай командує взводом, ротою, батальйоном, бригадою?", "Які обов’язки мають сержанти?", "Що таке звання «рекрут»?", "Що таке масштабування позитивного досвіду? Наведіть приклад."]}]}, {"name": "Тренінг 3. Військове лідерство. Озброєння та військова техніка. Безпечне поводження зі зброєю", "lessons": [{"n": "1–2", "t": "Військове лідерство України: від історії до сучасності та доктрини", "g": "Усвідомити, що лідерство — це навичка й відповідальність, а не лише звання; визначити ключові риси лідера на прикладах українських військових і зіставити їх із Доктриною розвитку військового лідерства ЗСУ та принципом Mission Command.", "k": "", "terms": [["Лідерство", "здатність брати відповідальність, ухвалювати рішення, вести за собою людей і досягати спільної мети."], ["Доктрина розвитку військового лідерства ЗСУ", "офіційний документ (затверджений Генштабом ЗСУ у грудні 2020 р.), що визначає рівні лідерства та якості військового лідера відповідно до стандартів НАТО."], ["Mission Command (делеговане керівництво)", "підхід НАТО: командир пояснює мету (намір), а підлеглі мають свободу й ініціативу, як її досягти."], ["Намір командира (Commander’s Intent)", "чітке формулювання того, чого треба досягти, а не того, як саме діяти."]], "th": [{"h": "Лідерство — це рішення під тиском", "p": ["Командири часто ухвалюють рішення швидко, на основі неповної інформації та з відповідальністю за життя інших. Лідерство проявляється у взятті відповідальності, ініціативі, комунікації, етиці та стресостійкості."], "ul": []}, {"h": "Микола Верхогляд: Жепа, 1995", "p": ["Полковник Микола Верхогляд командував українськими миротворцями ООН у боснійському анклаві Жепа. Коли над мирним населенням нависла загроза різанини (як незадовго до того в Сребрениці), він особисто пішов на переговори з сербською стороною, фактично всупереч наказу про відступ. Завдяки його рішучості й умінню домовлятися вдалося врятувати близько 12 тисяч людей. Це приклад гуманітарного лідерства та ініціативи."], "ul": []}, {"h": "Денис Прокопенко: Маріуполь і «Азовсталь», 2022", "p": ["Командир полку «Азов» Денис Прокопенко («Редіс») очолював оборону Маріуполя — 86 днів, з них 82 у повному оточенні на «Азовсталі». Гарнізон скував великі сили ворога й виграв для країни критично важливий час. Виконуючи наказ вищого командування, Прокопенко ухвалив надважке рішення про вихід гарнізону в полон задля збереження життів. Захисники «Азовсталі» стали символом незламності."], "ul": []}, {"h": "Євген Коновалець: міжвоєнний період", "p": ["Після поразки Української революції полковник Євген Коновалець 1920 року заснував Українську військову організацію (УВО), а 1929-го очолив Організацію українських націоналістів (ОУН). Не маючи держави й ресурсів, він зберіг ідею незалежності, розбудував підпільну мережу й готував кадри. 1938 року загинув від рук агента НКВС. Це приклад стратегічного бачення й віри в безнадійних умовах."], "ul": []}, {"h": "Доктрина ЗСУ та Mission Command", "p": [], "ul": ["Ключові якості лідера за Доктриною: відповідальність, ініціативність, комунікабельність, вмотивованість, психологічна стійкість.", "Рівні лідерства: особистісний, організаційний, стратегічний.", "Принципи Mission Command: чіткий намір командира; делегування повноважень; дисциплінована ініціатива; спільне розуміння мети; готовність прийняти ризик помилки.", "Горизонтальне лідерство: авторитет здобувається особистими якостями й ефективністю, а не лише званням (приклад — Дмитро «Да Вінчі» Коцюбайло)."]}, {"h": "Лідерство в цивільному житті", "p": ["Ці якості потрібні не лише на війні: у школі, команді, громадській діяльності, бізнесі. Людина, яка вміє брати відповідальність і ухвалювати виважені рішення, стане опорою для інших у будь-якій сфері."], "ul": []}], "f": "Український миротворчий контингент у Жепі — одна з найменш відомих, але найблагородніших сторінок історії українського війська: про неї розповідали BBC та інші світові медіа.", "pr": ["Заповніть таблицю «Портрет українського військового лідера»: для Верхогляда, Прокопенка й Коновальця вкажіть прояви відповідальності, ініціативи, комунікації, стресостійкості та ціну лідерства.", "Складіть «кейс-карту» іншого українського військового лідера (наприклад, Дмитра Коцюбайла): ситуація, дилема, рішення, якості.", "Або напишіть есе «Які лідерські якості знадобляться мені в житті та майбутній професії»."], "q": ["Чому лідерство — це навичка, а не лише звання?", "Яке рішення ухвалив Микола Верхогляд і які якості він проявив?", "Що таке Mission Command і намір командира?", "Які якості лідера визначає Доктрина ЗСУ?", "Де в цивільному житті потрібні лідерські якості?"]}, {"n": "3–4", "t": "Озброєння та військова техніка: призначення, види та типи", "g": "Ознайомитися з класифікацією сучасного озброєння та військової техніки, їхнім призначенням і загальною роллю на полі бою.", "k": "", "terms": [["Озброєння", "зброя та засоби, що забезпечують її застосування."], ["Військова техніка", "машини й системи для ведення бою та забезпечення військ."], ["Ефективна дальність", "відстань, на якій зброя надійно вражає ціль."], ["ППО", "протиповітряна оборона."]], "th": [{"h": "Основні групи озброєння та техніки", "p": [], "ul": ["Стрілецька зброя — пістолети, автомати, гвинтівки, кулемети; основна зброя піхотинця.", "Гранатомети та протитанкові засоби — ручні протитанкові гранатомети, протитанкові ракетні комплекси (ПТРК, наприклад Javelin, Stugna-P).", "Бронетехніка — танки, бойові машини піхоти (БМП), бронетранспортери (БТР), броньовані автомобілі; захищають і перевозять екіпаж та піхоту.", "Артилерія — міномети, гармати, гаубиці (самохідні й буксировані), реактивні системи залпового вогню (РСЗВ, наприклад HIMARS).", "Засоби ППО — переносні зенітні комплекси, зенітні ракетні комплекси (Patriot, NASAMS, IRIS-T), зенітні кулеметні установки.", "Авіація — літаки та гелікоптери різного призначення.", "Безпілотні системи — розвідувальні й ударні дрони (зокрема FPV), наземні та морські безпілотники.", "Засоби зв’язку, радіоелектронної боротьби (РЕБ) і розвідки."]}, {"h": "Від чого залежить вибір озброєння", "p": [], "ul": ["завдання (оборона, наступ, розвідка, прикриття);", "дальність і точність ураження;", "мобільність і захищеність;", "вартість та можливість виробництва;", "підготовка людей, які ним керують."]}, {"h": "Сучасні тенденції", "p": ["Війна в Україні змінила уявлення про озброєння: дешеві дрони знищують дорогу техніку, РЕБ стала критично важливою, а мережеве поєднання розвідки й вогню пришвидшило ураження цілей. Але незмінним залишається головне: будь-яка зброя працює лише в руках навченої людини."], "ul": []}], "f": "Україна стала першою країною, що створила окремий рід військ — Сили безпілотних систем.", "pr": ["Складіть схему-класифікацію «Озброєння та військова техніка» з прикладами для кожної групи.", "Оберіть один вид техніки та підготуйте коротку картку: призначення, хто застосовує (рід військ), переваги й вразливості."], "q": ["Назвіть основні групи озброєння та військової техніки.", "Чим БМП відрізняється від танка за призначенням?", "Для чого призначені засоби ППО?", "Як дрони змінили сучасну війну?", "Чому без навченої людини жодна зброя не ефективна?"]}, {"n": "5", "t": "Порядок зберігання зброї та боєприпасів", "g": "Знати основні правила зберігання зброї й боєприпасів, розуміти наслідки їх порушення та вміти оцінювати, чи правильно організовано зберігання.", "k": "", "terms": [["Облік зброї", "реєстрація кожної одиниці зброї (номер, журнал видачі та повернення з підписами)."], ["Інвентаризація", "регулярна перевірка наявності та стану зброї."], ["ММГ", "масогабаритний макет зброї, що використовують на уроках."]], "th": [{"h": "Основні принципи зберігання", "p": [], "ul": ["Зброю зберігають у спеціально обладнаному місці: сейфі, металевій шафі, кімнаті з обмеженим доступом, сигналізацією.", "Кожна одиниця зброї обліковується: номер, журнал видачі, підписи отримувача та чергового.", "Зброю й боєприпаси зберігають окремо.", "Доступ мають лише відповідальні особи; ключі — тільки в них.", "Регулярно проводять перевірку (інвентаризацію).", "Зброю ніколи не залишають без нагляду — навіть «на 5 хвилин»."]}, {"h": "Наслідки порушень", "p": ["Недбале зберігання може призвести до випадкових пострілів, каліцтва чи смерті людей, крадіжок зброї. Важливо пам’ятати не лише про юридичну відповідальність, а й про непоправну шкоду людському життю. Незаконне носіння, зберігання, придбання чи передача вогнепальної зброї та боєприпасів — кримінальний злочин (ст. 263 Кримінального кодексу України)."], "ul": []}, {"h": "Правильно чи неправильно?", "p": [], "ul": ["Автомати в металевій шафі на два замки, ключі у відповідальної особи — правильно.", "Сейф залишили відімкненим, «бо відійшли на 5 хвилин» — неправильно.", "Ключ від сейфа лежить у шухляді «на всякий випадок» — неправильно.", "Набої в шухляді, «бо без зброї вони не небезпечні» — неправильно: боєприпаси також потребують захищеного зберігання.", "Макети в незамкненій шафі в зачиненому класі — ризиковано: потрібен замок і контроль."]}], "f": "", "pr": ["Оцініть кожну ситуацію як «правильно» чи «неправильно», поясніть можливі наслідки та як виправити: а) учень після тренування залишив макет на парті й пішов пити воду; б) у кімнату зберігання мають доступ лише дві відповідальні особи; в) зброя зберігається не в сейфі, але в замкненій кімнаті.", "Складіть пам’ятку «6 правил зберігання зброї»."], "q": ["Де і як мають зберігатися зброя та боєприпаси?", "Навіщо потрібен облік кожної одиниці зброї?", "Чому зброю й боєприпаси зберігають окремо?", "До чого можуть призвести порушення правил зберігання?", "Яку відповідальність передбачає ст. 263 ККУ?"]}, {"n": "6", "t": "Заходи безпеки при поводженні зі зброєю. Кодекс стрільця", "g": "Знати напам’ять чотири золоті правила Кодексу стрільця та розширені 12 правил безпеки, вміти розпізнавати їх порушення.", "k": "", "terms": [["Кодекс стрільця", "правила безпечного поводження зі зброєю, обов’язкові для кожного."], ["Осічка / затримка", "ситуація, коли постріл не відбувся або зброя перестала працювати належним чином."]], "th": [{"h": "Чотири золоті правила", "p": [], "ul": ["1. Завжди поводься зі зброєю так, ніби вона заряджена.", "2. Не направляй зброю на людей чи предмети, у які не збираєшся стріляти.", "3. Тримай палець поза спусковим гачком, доки не готовий зробити постріл.", "4. Завжди знай, що перед ціллю і що за нею."]}, {"h": "Розширений Кодекс (ще 8 правил)", "p": [], "ul": ["5. Не залишай зброю без нагляду.", "6. Не жартуй зі зброєю.", "7. Передаючи зброю іншій особі, перевір її стан: розряджена, затвор відкритий, магазин від’єднаний.", "8. Патрон у патронник — лише за командою або в разі потреби.", "9. Боєприпаси зберігай окремо від зброї.", "10. У разі осічки чи затримки тримай зброю в напрямку мішені й дій за стандартною процедурою.", "11. Використовуй лише справні зброю та патрони.", "12. Відповідальність за безпеку завжди несе стрілець."]}, {"h": "Чому правила однакові навіть для макета", "p": ["Правила діють і для навчальних макетів: так формується звичка, яка згодом може врятувати життя. Жарт «Бах!» з макетом, палець на спусковому гачку «щоб швидше зреагувати» чи передача зброї без перевірки — грубі порушення."], "ul": []}], "f": "Більшість нещасних випадків зі зброєю стається через порушення саме перших трьох правил — людина була певна, що зброя розряджена.", "pr": ["Запишіть чотири золоті правила на форзаці зошита й вивчіть напам’ять.", "Визначте порушене правило: а) учень навів макет на однокласницю, «щоб показати, як тримати»; б) учениця взяла в друга зброю й не перевірила, чи вона розряджена; в) після тренування учениця хоче забрати навчальні патрони додому."], "q": ["Назвіть чотири золоті правила Кодексу стрільця.", "Як правильно передавати зброю іншій людині?", "Коли можна досилати патрон у патронник?", "Що робити в разі осічки?", "Хто несе відповідальність за безпеку під час стрільби?"]}, {"n": "7–8", "t": "Класифікація та будова вогнепальної зброї. АК-74 та AR-15", "g": "Знати основні класи стрілецької зброї, загальну будову автоматів АК-74 та AR-15 і відмінності між ними, розуміти значення догляду за зброєю.", "k": "", "terms": [["Стрілецька зброя", "вогнепальна зброя калібру до 20 мм: пістолети, автомати, гвинтівки, кулемети."], ["Купчастість", "здатність зброї влучати кулями близько одна до одної."], ["Масогабаритний макет (ММГ)", "навчальна копія зброї, що повторює розміри й вагу оригіналу."]], "th": [{"h": "Класи стрілецької зброї", "p": [], "ul": ["пістолети — особиста зброя для самозахисту на малих відстанях;", "автомати — основна зброя піхотинця;", "гвинтівки (зокрема снайперські) — для точної стрільби на більші відстані;", "кулемети — для інтенсивного вогню й підтримки підрозділу."]}, {"h": "Основні частини автомата (загально)", "p": ["І АК-74, і AR-15 (в Україні — UAR-15) мають спільні основні частини: ствол, ствольну коробку, затворну групу (затворна рама і затвор), газовідвідну систему, ударно-спусковий механізм, прицільні пристрої, приклад, магазин. Розбирання й збирання вивчають на макетах під керівництвом учителя — воно потрібне для чищення, змащування та усунення затримок."], "ul": []}, {"h": "Порівняння АК-74 та AR-15", "p": [], "ul": ["AR-15 — переваги: легко встановити додаткові приціли (оптичні, коліматорні, тепловізійні, нічного бачення) без втручання в конструкцію; висока купчастість; регульований приклад; мінімальне підкидання дула. Недолік: чутливіший до бруду, потребує регулярного чищення.", "АК — переваги: стійкий до бруду й надійний у складних умовах; можна встановити підствольний гранатомет. Недоліки: складніше встановити сучасні приціли без втручання в конструкцію; відчутне підкидання дула; нерегульований приклад.", "Відмінності конструкції впливають на тактику застосування зброї."]}, {"h": "Догляд за зброєю", "p": ["Зброю регулярно чистять і змащують (шомпол, протяжка, піна, мастила, серветки), перевіряють відсутність люфтів. Перед будь-якими діями обов’язково перевіряють, що зброя розряджена, і працюють уважно, щоб не загубити деталі. Ствол біля дульного зрізу чистять акуратно, щоб не пошкодити нарізи."], "ul": []}], "f": "Автомат Калашникова вважається найпоширенішою зброєю у світі — вироблено десятки мільйонів одиниць, а AR-15 став основою для цілого сімейства сучасних гвинтівок, зокрема українських.", "pr": ["Складіть порівняльну таблицю «АК-74 / AR-15»: переваги, недоліки, для яких умов краще підходить.", "Намалюйте схему автомата й підпишіть основні частини.", "На уроці під керівництвом учителя відпрацюйте неповне розбирання та збирання макета, коментуючи кожну дію і дотримуючись Кодексу стрільця."], "q": ["Назвіть основні класи стрілецької зброї та їхнє призначення.", "Які основні частини має автомат?", "Назвіть переваги AR-15 і переваги АК.", "Навіщо потрібне розбирання та збирання зброї?", "Які правила безпеки діють під час чищення зброї?"]}]}, {"name": "Тренінг 4. Індивідуальні навички поводження зі стрілецькою зброєю (практичний)", "lessons": [{"n": "1–2", "t": "Тактична стійка. Положення для стрільби з коліна та лежачи", "g": "Знати види стійок, елементи тактичної стійки та варіанти положень з коліна й лежачи, їхні переваги й недоліки.", "k": "", "terms": [["Тактична стійка", "базове положення стрільця, найбільш наближене до умов бою; від нього залежать точність, швидкість реакції й безпека."], ["Силует", "видимий для противника обрис тіла; знижений силует — менша ціль."], ["Робоче / неробоче плече", "плече, до якого зазвичай упирають приклад (у правші — праве), та протилежне."]], "th": [{"h": "Види стійок", "p": ["Розрізняють стройову (гвардійську), спортивну та тактичну стійки. На уроках відпрацьовують тактичну — вона найближча до умов бою."], "ul": []}, {"h": "Елементи тактичної стійки (для правші)", "p": [], "ul": ["стопи паралельні, носки в бік цілі; ліва нога попереду, права — трохи позаду;", "ноги на ширині плечей — стабільність і свобода руху;", "коліна злегка зігнуті, «пружні»;", "таз, стегна й груди — фронтально до цілі, верх корпусу трохи подано вперед;", "приклад упирається в «нішу» між плечем і ключицею, правий лікоть притиснутий до корпусу;", "зброю підводять до рівня очей, а не опускають голову до прицілу."]}, {"h": "Положення з коліна", "p": [], "ul": ["Високе коліно — швидко займати, знижує силует, але не дуже стабільне.", "Навпочіпки — швидкий перехід, але погано компенсує віддачу.", "На два коліна — швидко й суттєво зменшує силует, але важко піднятися зі спорядженням.", "Класичне середнє коліно — три точки опори, найстабільніше при збереженні мобільності.", "Низьке коліно — майже як лежачи, але складно змінювати позицію.", "Бережіть коліна — використовуйте наколінники."]}, {"h": "Положення лежачи", "p": [], "ul": ["найстабільніше для стрільби;", "зброя, корпус і опорна нога утворюють одну лінію;", "лікті впираються в землю й розведені для стабільності;", "магазин ніколи не ставлять на землю."]}], "f": "Під час відпрацювання стійки команди дублюють хором — так тренують і витривалість, і передавання команд у бою.", "pr": ["Опишіть по пунктах елементи тактичної стійки (можна з малюнком).", "Складіть таблицю «Положення з коліна: переваги / недоліки» для п’яти варіантів.", "На уроці під контролем учителя відпрацюйте в парах стійку та положення, перевіряючи одне одного."], "q": ["Які види стійок ви знаєте? Чому відпрацьовують тактичну?", "Куди упирається приклад у тактичній стійці?", "Яке положення з коліна найстабільніше і чому?", "Чому положення лежачи вважають найстабільнішим?", "Чому магазин не можна ставити на землю?"]}, {"n": "3", "t": "Положення зброї «ствол вгору» та «ствол вниз». Перекладання зброї на неробоче плече", "g": "Знати, коли застосовують положення «ствол вгору» та «ствол вниз», і навіщо перекладають зброю на неробоче плече.", "k": "", "terms": [["Перекладання зброї", "перенесення приклада на неробоче плече, щоб вести вогонь з-за укриття з меншим силуетом."]], "th": [{"h": "Безпечне положення під час руху", "p": ["Під час пересування ствол не повинен бути спрямований на людей поруч, на власні ноги чи в землю (щоб не забити ствол ґрунтом при падінні)."], "ul": []}, {"h": "«Ствол вгору»", "p": [], "ul": ["зброя у двох руках, ствол під кутом догори й трохи вбік;", "застосовують у тісних приміщеннях і в колоні, щоб не спрямовувати ствол на людей попереду;", "ризики: ствол може чіплятися за гілки, дверні отвори; під час посадки на техніку треба контролювати, щоб ствол не був спрямований на людей."]}, {"h": "«Ствол вниз»", "p": [], "ul": ["зброя у двох руках, ствол спрямований донизу;", "застосовують на відкритій місцевості, коли попереду нікого немає — так швидко вивести зброю в потрібний сектор;", "обидва положення правильні — вибір залежить від ситуації."]}, {"h": "Перекладання на неробоче плече", "p": [], "ul": ["мета — стріляти з-за укриття, показуючи противнику мінімум тіла;", "неповне перекладання — приклад на інше плече, руки не міняються;", "повне перекладання — додатково змінюється хват рук; складніше, але дає кращий контроль;", "позиція ніг не змінюється: задня нога залишається опорною."]}], "f": "", "pr": ["Опишіть дві ситуації, коли доречне положення «ствол вгору», і дві — «ствол вниз».", "Поясніть різницю між неповним і повним перекладанням зброї."], "q": ["Навіщо контролювати положення ствола під час руху?", "Коли застосовують положення «ствол вгору»?", "Коли краще використовувати «ствол вниз»?", "Навіщо перекладати зброю на неробоче плече?", "Чим повне перекладання відрізняється від неповного?"]}, {"n": "4–7", "t": "Сектори «годинника». Реагування на контакт з місця, з коліна, лежачи. Одно- та багатокрокове зміщення", "g": "Розуміти систему секторів «годинника», загальний алгоритм реагування та принципи зміщення й завершальних перевірок.", "k": "", "terms": [["Сектори «годинника»", "спосіб позначення напрямків відносно стрільця: 12 — прямо, 3 — праворуч, 6 — позаду, 9 — ліворуч."], ["Контакт", "виявлення противника або загрози."], ["Зміщення", "переміщення на крок чи кілька кроків, щоб зійти з лінії вогню або зайняти укриття."]], "th": [{"h": "Сектори «годинника»", "p": ["Уявіть, що стоїте в центрі циферблата і дивитеся на 12. Тоді 3 — праворуч, 6 — позаду, 9 — ліворуч. Так швидко й однозначно позначають напрямок загрози: «Контакт, 9 година!»."], "ul": []}, {"h": "Загальний алгоритм реагування", "p": [], "ul": ["знизити силует;", "опустити ствол униз (під час розвороту ствол не повинен «гуляти» вище лінії пояса);", "повернути голову й ідентифікувати ціль;", "розвернути стопу в бік сектору й підставити іншу ногу;", "вкласти зброю та вивести її вперед у класичне положення."]}, {"h": "Зміщення", "p": [], "ul": ["однокрокове — один крок, щоб зійти з лінії вогню або створити простір для дій;", "багатокрокове — два кроки й більше, щоб зайняти укриття чи змінити позицію;", "вперед рухаються плавно з п’ятки на носок (стійкість і тиша), назад — з носка на п’ятку (баланс);", "силует знижений, ствол під час переведення — донизу."]}, {"h": "Завершальні перевірки", "p": ["Кожну вправу завершують трьома перевірками: контроль цілі → контроль зброї → контроль секторів (огляд навколо)."], "ul": []}, {"h": "Типові помилки", "p": [], "ul": ["ствол піднімається вище пояса під час розвороту;", "силует піднімається завчасно;", "плутанина в порядку ніг, «крок назад»."]}], "f": "Систему «годинника» використовують не лише військові, а й пілоти («ціль на 2 годині») та рятувальники.", "pr": ["Намалюйте схему «годинника» навколо стрільця й позначте сектори 12, 3, 6, 9.", "Запишіть алгоритм реагування по кроках і вивчіть його.", "На уроці в парах: одна людина виконує реагування на названий сектор (з макетом), інша контролює безпеку й порядок дій."], "q": ["Що означає «контакт, 3 година»?", "Назвіть кроки загального алгоритму реагування.", "Чому під час розвороту ствол тримають опущеним?", "Чим однокрокове зміщення відрізняється від багатокрокового?", "Які три завершальні перевірки виконують після вправи?"]}, {"n": "8", "t": "Маніпуляції зі зброєю: запобіжник, заміна магазина, базове усунення затримок", "g": "Мати загальне уявлення про основні маніпуляції зі зброєю та правила безпеки під час їх відпрацювання на макетах.", "k": "", "terms": [["Запобіжник", "механізм, що блокує випадковий постріл."], ["Затримка", "збій у роботі зброї під час стрільби."], ["Єдина процедура заряджання / розряджання", "стандартна послідовність дій, яку виконують усі однаково для безпеки."]], "th": [{"h": "Що відпрацьовують", "p": [], "ul": ["зняття із запобіжника та постановку на запобіжник;", "заміну магазина (зі збереженням порожнього та без збереження);", "базові дії при затримках;", "усе — на двох системах (АК та AR), правою й лівою рукою, у різних положеннях."]}, {"h": "Правила під час відпрацювання", "p": [], "ul": ["лише макети та навчальні засоби, лише під керівництвом інструктора;", "спершу повільно й правильно, потім — швидше;", "ствол завжди в безпечному напрямку, палець поза спусковим гачком;", "виконуйте єдину процедуру — так дії стають автоматичними й безпечними."]}, {"h": "Чому це важливо", "p": ["У стресовій ситуації людина діє так, як навчилася. Тому маніпуляції відпрацьовують до автоматизму — але безпека завжди важливіша за швидкість."], "ul": []}], "f": "", "pr": ["Запишіть правила безпеки під час відпрацювання маніпуляцій зі зброєю.", "Поясніть, навіщо в армії існує єдина процедура заряджання та розряджання."], "q": ["Для чого призначений запобіжник?", "Які маніпуляції зі зброєю відпрацьовують на уроці?", "Чому спершу діють повільно, а потім швидше?", "Що важливіше — швидкість чи безпека? Чому?"]}]}, {"name": "Тренінг 5. Стрілецька підготовка. Ручні гранати та гранатомети: безпека", "lessons": [{"n": "1", "t": "Стрілецька підготовка: теоретична підготовка. Прицільні пристосування. Балістика", "g": "Пригадати правила безпеки, ознайомитися з видами прицільних пристосувань, видами стрілецької зброї для різних завдань і чинниками, що впливають на влучність.", "k": "", "terms": [["Прицільні пристосування", "пристрої для наведення зброї на ціль: відкриті приціли, коліматорні, оптичні, тепловізійні."], ["Зовнішня балістика", "наука про рух кулі (снаряда) після вильоту зі ствола."], ["Пристрілювання", "налаштування прицілу так, щоб точка прицілювання збігалася з точкою влучання."], ["Деривація", "відхилення кулі, що обертається, у бік обертання (зазвичай праворуч)."]], "th": [{"h": "Головне завдання стрільця", "p": ["Зброя — це інструмент. Головна мета — стріляти ВЛУЧНО. Навчання йде поступово: від влучності → до швидкості → до стрільби в умовах стресу. Робота зі зброєю вимагає відповідальності, акуратності та уваги, а на стрільбищі — захисту очей і слуху (окуляри, беруші, навушники)."], "ul": []}, {"h": "Види прицільних пристосувань", "p": [], "ul": ["Прицільна планка + мушка — на гладкоствольній зброї; швидке прицілювання, ефективна дистанція 40–70 м.", "Відкриті нерегульовані (цілик + мушка) — переважно на пістолетах, до 30 м.", "Відкриті регульовані — на автоматах і гвинтівках: прості, надійні за будь-якої погоди, але без збільшення (важко на 200+ м).", "Коліматорні — дуже швидке й інтуїтивне прицілювання, зі збільшенням 2–3× — до 300 м; забруднюються в негоду.", "Оптичні — точна стрільба від 300 м і далі (снайпери, марксмени); звужують поле зору, збільшують масу.", "Тепловізійні — робота в темряві, диму, проти замаскованих цілей; дорогі, потребують живлення, гірше працюють у дощ і сніг.", "Лазерний цілевказівник — швидке наведення в темряві, але демаскує стрільця."]}, {"h": "Зброя для різних завдань", "p": [], "ul": ["короткоствольна (пістолети) — самозахист, робота в тісних приміщеннях;", "автомати зі складаним прикладом — для водіїв, операторів БпЛА і НРК;", "гвинтівки з поздовжньо-ковзним («болтовим») затвором — снайперські завдання;", "гладкоствольна зброя — зокрема для збивання дронів;", "ручні кулемети — вогневе ураження противника, вимагають сили й витривалості.", "Універсальної зброї не існує: зброя має відповідати завданню."]}, {"h": "Що впливає на влучність", "p": [], "ul": ["вітер, відстань до цілі, кут місця цілі, сила тяжіння;", "висота над рівнем моря, атмосферний тиск, температура повітря, освітлення;", "деривація;", "підготовка стрільця і пристрілювання зброї."]}], "f": "Полум’ягасник на зброї вночі потрібен не лише для зручності стрільця: спалах пострілу може видати позицію противнику.", "pr": ["Складіть таблицю «Вид прицілу — дистанція — переваги — недоліки».", "Поясніть, яку зброю й приціл ви обрали б: а) для оператора дрона; б) для роботи вночі; в) для стрільби на 500 м."], "q": ["Яка головна мета стрільця?", "Назвіть види прицільних пристосувань і їхні особливості.", "Чим коліматорний приціл відрізняється від оптичного?", "Які чинники впливають на влучність?", "Чому не існує універсальної зброї?"]}, {"n": "2", "t": "Стрілецька підготовка: стрільба з положення лежачи", "g": "Розуміти, що таке постріл і лінія прицілювання, знати правила прицілювання, визначати своє робоче око та виконувати прицільний постріл лежачи з пневматичної зброї.", "k": "", "terms": [["Лінія прицілювання", "уявна лінія через цілик і мушку до цілі."], ["Робоче (ведуче) око", "око, яким людина природно прицілюється."], ["Середня точка влучання (СТВ)", "центр групи влучань на мішені."], ["Купчастість", "наскільки близько одне до одного лягають влучання."]], "th": [{"h": "Комплекс для влучного пострілу", "p": ["Влучний постріл — результат роботи комплексу «стрілець + зброя + прицільні пристосування + набій». Покращувати треба кожен складник, а насамперед — власні навички."], "ul": []}, {"h": "Як визначити робоче око", "p": ["Витягніть руку й наведіть великий палець на точку. Почергово заплющуйте очі: око, при якому палець не «зміщується» з цілі, — робоче."], "ul": []}, {"h": "Правила прицілювання (відкритий приціл)", "p": [], "ul": ["мушка — рівно посередині прорізу цілика, верх мушки на рівні країв цілика;", "фокус ока — на мушці; ціль і цілик трохи розмиті;", "зброю тримати стабільно;", "постріл — на короткій затримці дихання після видиху;", "натискання на спусковий гачок — плавне, без смикання."]}, {"h": "Положення лежачи: як перевірити природне наведення", "p": [], "ul": ["займіть положення, лікті на землі, приклад надійно в плечі;", "прицілюйтеся 7–10 секунд;", "заплющіть очі на 3 секунди, розплющіть — чи не «з’їхала» точка прицілювання?", "якщо з’їхала — не руками, а зміщенням тіла (таза) виправте положення й повторіть;", "мета — щоб тіло «само» дивилося на ціль."]}, {"h": "Після стрільби", "p": ["Оцінюють групу влучань і визначають середню точку влучання. Важливо: однакове прицілювання дає однакові влучання — не вносьте випадкових поправок."], "ul": []}], "f": "Навіть досвідченим стрільцям важко влучно стріляти одразу після фізичного навантаження — тому дихання та спокій так само важливі, як і приціл.", "pr": ["Визначте своє робоче око і запишіть результат.", "Намалюйте правильне положення мушки в цілику.", "Якщо є можливість, під наглядом дорослого інструктора в тирі зробіть серію пострілів у кілька мішеней і визначте середню точку влучання."], "q": ["З чого складається комплекс для влучного пострілу?", "Що таке лінія прицілювання?", "Як правильно поєднати мушку й цілик?", "На якій фазі дихання виконують постріл?", "Як перевірити й виправити природне наведення в положенні лежачи?"]}, {"n": "3", "t": "Стрілецька підготовка: стрільба з положення стоячи", "g": "Навчитися підлаштовувати тактичну стійку під зброю, знати вимоги до стійки для стрільби стоячи та вміти аналізувати свої влучання.", "k": "", "terms": [["Холоста (суха) тренувальна вправа", "відпрацювання прицілювання та спуску без пострілу, з макетом."], ["Вогневий рубіж", "місце, з якого ведуть стрільбу."]], "th": [{"h": "Вимоги до стійки для стрільби стоячи", "p": [], "ul": ["носки стоп повернуті в напрямку мішені;", "коліна злегка зігнуті, пружинять;", "лікті не виступають за ширину тулуба;", "лікоть руки, що виконує спуск, притиснутий до тулуба;", "приклад — між плечем і ключицею;", "приклад підносять до зручної висоти голови, а не голову до прицілу."]}, {"h": "Порядок роботи на рубежі", "p": [], "ul": ["усі дії — лише за командою керівника стрільби;", "пробні постріли з контролем влучань, потім — залікові;", "поки одна група стріляє, інша відпрацьовує стійку з макетами;", "після стрільби зброя залишається на рубежі під наглядом, а стрільці йдуть оцінювати мішені."]}, {"h": "Чому стоячи важче", "p": ["У положенні стоячи менше точок опори, тож тіло хитається сильніше, особливо на «збитому» диханні. Саме тому всі стійки покликані допомогти швидко зайняти стабільне положення для влучного пострілу з мінімальним ризиком."], "ul": []}], "f": "", "pr": ["Запишіть вимоги до стійки для стрільби стоячи.", "Проаналізуйте свою залікову мішень: де середня точка влучання, наскільки купчасті влучання, що заважало."], "q": ["Куди мають бути спрямовані носки стоп у стійці?", "Чому лікоть руки, що натискає на спуск, притискають до тулуба?", "Чому стріляти стоячи важче, ніж лежачи?", "Які правила діють на вогневому рубежі?"]}, {"n": "4–6", "t": "Стрільба з положень стоячи, з коліна, лежачи. Стрільба в умовах втоми", "g": "Закріпити навички прицільного пострілу з різних положень, навчитися контролювати дихання і спуск в умовах, наближених до стресових.", "k": "", "terms": [["Принцип поступовості", "спершу влучність, потім швидкість, потім стресові чинники."], ["Смикання спуску", "різке натискання на спусковий гачок, що зсуває зброю і погіршує влучність."]], "th": [{"h": "Безпека понад усе", "p": ["Навіть пневматична зброя може бути смертельно небезпечною. У 2023 році на гуртку зі стрільби в одному з ліцеїв учень під час перезаряджання пневматичної гвинтівки з необережності влучив в іншого учня — хлопець загинув. Тому правила Кодексу стрільця та команди керівника стрільби виконують завжди й беззаперечно."], "ul": []}, {"h": "Як контролювати дихання і спуск", "p": [], "ul": ["після навантаження зробіть кілька глибоких повільних вдихів і видихів, щоб заспокоїти пульс;", "постріл — на короткій паузі після видиху;", "тисніть на спуск плавно, рівномірно, поки постріл «не станеться сам»;", "зберігайте однакове прицілювання в кожному пострілі."]}, {"h": "Стрільба на втомі", "p": ["Вправа: постріли чергуються з відтисканнями чи присіданнями. Вона показує, як втома й прискорене дихання впливають на влучність, і вчить відновлювати контроль. Той, хто за станом здоров’я не може виконувати навантаження, стріляє без нього."], "ul": []}, {"h": "Вимоги до стійки", "p": [], "ul": ["природність — зручна для вашого тіла;", "мінімальний силует;", "можливість швидко маневрувати."]}], "f": "", "pr": ["Порівняйте свої результати стрільби до і після навантаження. Що змінилося й чому?", "Складіть власну пам’ятку «Як заспокоїти дихання перед пострілом»."], "q": ["Що означає принцип поступовості в стрілецькій підготовці?", "Як правильно натискати на спусковий гачок?", "Як втома впливає на влучність?", "Чому навіть пневматична зброя вимагає суворого дотримання правил безпеки?"]}, {"n": "7", "t": "Ручні гранати і гранатомети. Безпека поводження", "g": "Ознайомитися з типами ручних гранат і гранатометів, знати золоте правило поводження з гранатами, порядок дій при виявленні нерозірваної гранати та небезпечну зону позаду гранатомета.", "k": "", "terms": [["Оборонна граната", "граната з великим радіусом розльоту уламків; метають лише з-за укриття (наприклад, Ф-1)."], ["Наступальна граната", "граната з меншим радіусом розльоту уламків (наприклад, РГД-5)."], ["Запал", "пристрій, що підриває гранату."], ["Реактивний струмінь", "викид розпечених газів і полум’я позаду гранатомета під час пострілу."]], "th": [{"h": "Золоте правило", "p": ["Граната окремо, запал окремо! Запал вкручують у гранату лише безпосередньо перед застосуванням. Гранати носять тільки в спеціальних підсумках так, щоб кільце не виглядало; носити гранату за кільце категорично заборонено."], "ul": []}, {"h": "Основні правила безпеки", "p": [], "ul": ["оберігати від ударів, вологи, вогню, бруду та сонця;", "при виявленні іржі, тріщин, вм’ятин чи зеленого нальоту на запалі — не використовувати, здати для знищення;", "не розбирати і не намагатися «лагодити» гранату;", "метання — лише з-за надійного укриття, з гучним попередженням «Граната!»;", "після кидка — негайно сховатися й не виходити до вибуху."]}, {"h": "Найважливіше для кожного цивільного", "p": [], "ul": ["Знайшли предмет, схожий на гранату, запал чи боєприпас — НЕ ПІДХОДЬТЕ і НЕ ТОРКАЙТЕСЯ! Позначте місце, відійдіть і повідомте за номером 101 або 102.", "Почули вигук «Граната!» — негайно впасти, бажано в заглиблення, схрестивши ноги (захист стегнових артерій)."]}, {"h": "Поширені ручні гранати", "p": [], "ul": ["Ф-1 — оборонна; уламки розлітаються до 200 м; тільки з-за укриття;", "РГД-5 — наступальна; легкі уламки, розліт до 25 м;", "РГО (оборонна) і РГН (наступальна) — з ударно-дистанційним запалом;", "гранати партнерів: M67 (США), DM51 (Німеччина, модульна)."]}, {"h": "Гранатомети: небезпечна зона", "p": [], "ul": ["головна небезпека — реактивний струмінь позаду гранатомета;", "небезпечна зона — сектор 90° позаду, радіусом щонайменше 20 м (для деяких систем більше); там не повинно бути людей, боєприпасів, легкозаймистих речовин;", "з більшості гранатометів заборонено стріляти в приміщеннях (крім спеціально розроблених систем);", "поширені: РПГ-7, РПГ-22, AT4 (Швеція), Panzerfaust 3 (Німеччина), RPG-75 (Чехія);", "на політ гранати впливають вітер і температура повітря."]}], "f": "Турнікет варто мати при собі завжди — навіть у мирних умовах вибух чи ДТП можуть статися несподівано.", "pr": ["Запишіть золоте правило та 5 основних правил безпеки поводження з гранатами.", "Намалюйте схему небезпечної зони позаду гранатомета.", "Складіть алгоритм дій для цивільного, який знайшов підозрілий предмет."], "q": ["Яке золоте правило поводження з ручними гранатами?", "Чим оборонна граната відрізняється від наступальної?", "Що робити, якщо ви знайшли нерозірвану гранату?", "Як діяти, почувши вигук «Граната!»?", "Що таке небезпечна зона позаду гранатомета і чому в ній не можна перебувати?"]}, {"n": "8–9", "t": "Практика поводження з гранатами (тренувальні гранати)", "g": "Відпрацювати безпечне метання тренувальних гранат з укриття, правильну реакцію на команду «Граната!» та знати вимоги до укриття.", "k": "", "terms": [["Тренувальна граната", "гумовий або металевий макет гранати без вибухової речовини."], ["Засоби індивідуального захисту (ЗІЗ)", "шолом, бронежилет, окуляри тощо."], ["РПС", "ременно-плечова система з підсумками для спорядження."]], "th": [{"h": "Правила безпеки на занятті", "p": [], "ul": ["усі дії — виключно за командою;", "на рубежі — лише ті, хто виконує вправу;", "шолом — перед виходом на рубіж, знімають після виходу;", "перш ніж метати, оберіть укриття для себе;", "почули «Граната!» — негайно впасти, схрестивши ноги;", "знайдений справжній підозрілий предмет — не чіпати, повідомити правоохоронців."]}, {"h": "Що є надійним укриттям", "p": ["Окопи, вирви, цегляні стіни товщиною щонайменше 380 мм, бетонні стіни. Щоб знизити ефективність ворожих гранат, вікна й отвори на позиціях затягують сітками."], "ul": []}, {"h": "Послідовність дій під час вправи", "p": [], "ul": ["оцінити ціль;", "метнути тренувальну гранату (на 10–30 м, по мішені);", "одразу повернутися в укриття."]}, {"h": "Техніки метання", "p": ["Метання кистю знадобиться там, де заважають кущі й гілки, а метання «з-під низу» чи закочування — у приміщеннях. Усе відпрацьовують лише з тренувальними гранатами під наглядом інструктора."], "ul": []}], "f": "", "pr": ["Запишіть правила безпеки на занятті з метання гранат.", "На уроці виконайте вправу з метання тренувальних гранат з укриття за командою інструктора; оцініть свою влучність."], "q": ["Які засоби захисту використовують на занятті з метання гранат?", "Що вважається надійним укриттям?", "Яка послідовність дій під час метання?", "Як діяти за вигуком «Граната!»?"]}]}, {"name": "Тренінг 6. Основи дій, комунікації та взаємодії в бою", "lessons": [{"n": "1", "t": "Практика поводження з гранатами: взаємодія у двійці", "g": "Закріпити правила безпеки під час роботи з тренувальними гранатами та зрозуміти принцип розподілу ролей у двійці («прикриває» / «метає»).", "k": "", "terms": [["Двійка", "найменша бойова група з двох осіб, які діють узгоджено й прикривають одне одного."], ["«Уламки!»", "попереджувальний вигук під час власного кидка."], ["«Граната!»", "вигук, коли граната прилетіла на вашу позицію."]], "th": [{"h": "Два різні вигуки", "p": [], "ul": ["«Уламки!» — попереджає своїх про ваш кидок;", "«Граната!» — сигнал негайно впасти, притиснутися до землі (бажано в заглиблення) і схрестити ноги."]}, {"h": "Принцип роботи у двійці", "p": ["Кожен у двійці має чітку роль: один прикриває (контролює напрямок загрози), інший діє. Під час вправ з тренувальними гранатами інструктор стежить за кутами й секторами, щоб учасники ніколи не потрапляли в зону ураження власного кидка. Це вчить головного — узгодженості та відповідальності одне за одного."], "ul": []}, {"h": "Безпека на занятті", "p": [], "ul": ["шоломи, бронежилети, РПС — для тих, хто на рубежі;", "дії — лише за командою;", "після вправи — розбір помилок (можна з відеозапису з дрона)."]}], "f": "", "pr": ["Поясніть різницю між вигуками «Уламки!» і «Граната!».", "Опишіть, чому у двійці важливо чітко розподіляти ролі."], "q": ["Як діяти за вигуком «Граната!»?", "Для чого вигукують «Уламки!»?", "Які ролі є у двійці?", "Чому важливо контролювати сектори під час вправ?"]}, {"n": "2", "t": "Подолання інженерних загороджень. Смуга перешкод", "g": "Знати типи невибухових інженерних загороджень, способи їх виявлення та безпечного подолання в команді.", "k": "", "terms": [["Інженерні загородження", "штучні перешкоди, що уповільнюють або зупиняють рух противника (дріт, рови, окопи, завали)."], ["Невибухові загородження", "загородження без вибухових речовин: дротяні перепони, протитанкові рови, «зуби дракона» тощо."], ["Зондування", "обережна перевірка ґрунту чи перешкоди щупом."]], "th": [{"h": "Призначення загороджень", "p": ["Загородження уповільнюють рух противника, змушують його зупинитися там, де його зручно вражати, і направляють його в потрібному обороні напрямку. Часто їх поєднують із мінами — тому невибухове загородження завжди треба перевіряти."], "ul": []}, {"h": "Типи невибухових загороджень", "p": [], "ul": ["дротяні загородження (спіралі, сітки, «розтяжки» з дроту);", "рови, окопи, ескарпи;", "завали з дерев, бетонні блоки, «зуби дракона»."]}, {"h": "Як долати", "p": [], "ul": ["візуальний пошук: огляньте перешкоду й підходи до неї, шукайте ознаки мін і розтяжок;", "зондування — лише навченими людьми;", "способи: переповзання під дротом, прорізання проходу, використання підручних засобів (дошки, килимки);", "команда долає перешкоду по черзі: одні прикривають, інші долають."]}, {"h": "Смуга перешкод", "p": ["На уроці смугу перешкод проходять командами по 6–7 осіб. Оцінюють не лише швидкість, а й те, чи команда подолала дистанцію «без втрат», забезпечуючи прикриття одне одному."], "ul": []}], "f": "Українські сапери — одні з найдосвідченіших у світі: Україна сьогодні є однією з найбільш замінованих країн.", "pr": ["Намалюйте схему імпровізованої смуги перешкод для шкільного стадіону з 5–6 елементів.", "Опишіть, як команда має долати дротяне загородження, щоб усі були в безпеці."], "q": ["Для чого призначені інженерні загородження?", "Назвіть типи невибухових загороджень.", "Чому невибухове загородження все одно потребує обережності?", "Як команда взаємодіє під час подолання перешкоди?"]}, {"n": "3–4", "t": "Основи тактики та види бою", "g": "Знати поняття «тактика», «бій», «загальновійськовий бій», особливості оборони й наступу, основні форми маневру та суть маневреної війни.", "k": "", "terms": [["Воєнне мистецтво", "система знань про підготовку та ведення війни; рівні: стратегія, оперативне мистецтво, тактика."], ["Тактика", "дії підрозділів (від відділення до батальйону) у конкретному бою."], ["Бій", "організоване зіткнення підрозділів з конкретною метою, у певний час і в певному місці."], ["Загальновійськовий бій", "бій, у якому різні роди військ діють узгоджено для спільної мети."], ["Маневрена війна", "підхід, що прагне позбавити противника можливості ефективно діяти, а не просто знищити якомога більше його сил."]], "th": [{"h": "Рівні воєнного мистецтва", "p": [], "ul": ["стратегія — рішення найвищого рівня про війну в цілому;", "оперативне мистецтво — планування великих операцій;", "тактика — дії підрозділів у бою. Вона вимагає вміння адаптуватися й думати, а не діяти шаблонно."]}, {"h": "Види бою", "p": ["Залежно від учасників розрізняють повітряний, морський, протиповітряний і загальновійськовий бій. Сучасний бій має наземно-повітряний характер і охоплює всі п’ять доменів: суша, море, повітря, космос (супутники, GPS, Starlink), кіберпростір. Складники бою: вогонь і удар, маневр, радіоелектронне придушення."], "ul": []}, {"h": "Оборона", "p": ["Оборонці займають позиції раніше, окопуються, маскуються, продумують систему вогню. Мета — зупинити противника, завдати втрат, виграти час, утримати важливу місцевість. Риси успішної оборони: порушення планів противника, гнучкість (резерви, запасні позиції), маневр, ретельна підготовка."], "ul": ["позиційна оборона — утримати місцевість;", "рухома оборона — вимотувати противника й знищувати на вигідних рубежах;", "організований відхід — зберегти людей, виграти час."]}, {"h": "Наступ", "p": ["Мета наступу — перемогти противника, захопити й утримати територію, розвинути успіх. Чотири риси успішного наступу: рішучість, концентрація, раптовість, темп. Приклад — Харківський контрнаступ 2022 року."], "ul": []}, {"h": "Форми маневру", "p": [], "ul": ["фронтальна атака — прямо на противника; просто, але небезпечно;", "охоплення — удар у фланг; зазвичай менші втрати;", "обхідний маневр — удар у тил, щоб змусити противника залишити позиції;", "проникнення — непомітний рух між позиціями противника, часто вночі;", "прорив — атака вузьким «коридором» у слабке місце оборони;", "відхід — вихід з-під ударів переважаючих сил, лише за наказом."]}, {"h": "Маневрена війна і асиметричні дії", "p": ["Маневрена війна — це швидкість, гнучкість, хитрість і удари по слабких місцях замість лобових атак; війна на виснаження — повільний тиск «лоб у лоб» з великими втратами. Слабша сторона компенсує меншу кількість сил асиметричними діями: удари по логістиці, застосування дронів, технологічні переваги. Приклад — морські дрони, завдяки яким Україна без великого флоту змусила російські кораблі відійти з Криму."], "ul": []}], "f": "Битву під Каннами (216 р. до н. е.), де Ганнібал оточив значно більшу римську армію, досі вивчають у військових академіях як класичний приклад охоплення.", "pr": ["Намалюйте схеми п’яти форм маневру (стрілками) і підпишіть переваги кожної.", "Підготуйте коротку презентацію про одну операцію України, що є прикладом асиметричних дій."], "q": ["Назвіть рівні воєнного мистецтва.", "Що таке загальновійськовий бій?", "Які риси має успішна оборона? А наступ?", "Чим охоплення відрізняється від обхідного маневру?", "Що таке маневрена війна та асиметричні дії?"]}, {"n": "5", "t": "Основи маскування", "g": "Розрізняти маскування й укриття, розуміти мультиспектральність маскування (видимий, тепловий, радіодіапазони) та знати основні демаскуючі ознаки.", "k": "", "terms": [["Маскування", "комплекс заходів, що запобігають виявленню об’єкта засобами розвідки."], ["Укриття", "споруди чи природні бар’єри для фізичного захисту від куль і уламків."], ["Демаскуючі ознаки", "прикмети, за якими противник може виявити позицію чи техніку."], ["Мультиспектральність", "необхідність ховатися одночасно у видимому, інфрачервоному (тепловому) та радіочастотному діапазонах."], ["Радіодисципліна", "правила користування засобами зв’язку, що зменшують ризик виявлення."]], "th": [{"h": "Маскування важливіше за укриття", "p": ["Якщо об’єкт не виявлено — його не уразять. Укриття без маскування — лише добре укріплена, але вже виявлена мішень. Сучасна розвідка багатоканальна: оптика, тепловізори, радіорозвідка, системи зі штучним інтелектом."], "ul": []}, {"h": "Видимий спектр", "p": [], "ul": ["розбиття контурів: прямі лінії й чіткі форми різко контрастують із природою;", "приховування тіні;", "сліди руху (колії, стежки) — одна з найнебезпечніших ознак;", "свіжий вийнятий ґрунт має інший колір і фактуру — його прибирають або маскують;", "роботи — у темний час доби та якомога швидше."]}, {"h": "Тепловий (інфрачервоний) спектр", "p": [], "ul": ["тепловізор фіксує тепло поверхні, а не «бачить крізь стіни»;", "взимку будь-яке джерело тепла (пічка, теплий будинок серед холодних) дуже помітне;", "фольга, агроволокно, звичайна тканина — НЕ маскують, а часто роблять ціль помітнішою;", "ефективні лише спеціальні багатошарові матеріали: поглинання, вентиляція, розсіювання тепла;", "звичайне віконне скло для тепловізора непрозоре, але лінзи тепловізорів пропускають ІЧ-промені."]}, {"h": "Радіочастотний спектр", "p": [], "ul": ["будь-який активний зв’язок (рації, телефони, Wi-Fi, супутниковий термінал) можна виявити;", "термінал Starlink — дуже помітна ціль і в радіо-, і в тепловому діапазоні; його маскують і виносять подалі від позиції;", "основа — радіодисципліна: мінімум часу в ефірі, правильний вибір частот, приховані антени."]}, {"h": "Штучний інтелект", "p": ["Системи машинного зору можуть розпізнавати цілі, замасковані від людського ока, але мають власні вразливості. Тому маскування постійно вдосконалюється."], "ul": []}], "f": "Навіть смартфон у кишені може видати позицію: геолокація, фото з метаданими й активність у мережі — джерела розвідданих для ворога.", "pr": ["Заповніть таблицю «Спектр — чим виявляють — як маскуватися» для видимого, теплового та радіодіапазонів.", "Складіть перелік демаскуючих ознак для зими та для літа.", "Поясніть, чому фольга не є засобом термомаскування."], "q": ["Чим маскування відрізняється від укриття?", "Чому маскування має пріоритет?", "Які демаскуючі ознаки найнебезпечніші?", "Чому взимку теплові сліди особливо помітні?", "Що таке радіодисципліна?"]}, {"n": "6", "t": "Передача інформації в умовах бойових дій", "g": "Розуміти роль швидкої й точної інформації, поняття «туман війни», «ситуаційна обізнаність», «OPSEC», моделі передачі інформації та правила оперативної безпеки.", "k": "", "terms": [["«Туман війни»", "неповна, неточна, мінлива інформація про ситуацію на полі бою."], ["Ситуаційна обізнаність", "розуміння того, що відбувається навколо, де свої й чужі, — основа для рішень."], ["OPSEC (операційна безпека)", "п’ятикроковий процес захисту критичної інформації від противника."], ["РЕР", "радіоелектронна розвідка — виявлення джерел радіовипромінювання."]], "th": [{"h": "Чому інформація «псується»", "p": ["Кожен військовий бачить лише свій сектор. Командир ухвалює рішення, спираючись на зібрану інформацію. Чим швидше інформація проходить від «сенсора» до виконавця, тим менше шансів, що вона застаріє. «Туман війни» створюють брак і неточність даних, протидія противника (РЕБ, маскування), стрес і втома. Зменшують його розвідка та системи ситуаційної обізнаності (українська «Дельта», месенджер MilChat)."], "ul": []}, {"h": "Три моделі передачі інформації", "p": [], "ul": ["Машина → Машина: розвідувальний дрон → система управління вогнем → артилерія; найшвидше, мінімум помилок людини.", "Машина → Людина: дрон транслює відео оператору й на командний пункт, координати наносять на цифрову карту.", "Людина → Людина: спостерігач доповідає командиру голосом чи повідомленням; найбільше залежить від людського фактора."]}, {"h": "Канали зв’язку", "p": [], "ul": ["аналоговий радіозв’язок — легко перехопити;", "цифровий захищений — складніше перехопити, але можливо (наприклад, через трофейні рації);", "супутниковий (Starlink, українська альтернатива UASAT) — швидкий, але термінал можна виявити, а також є залежність від провайдера."]}, {"h": "5 кроків OPSEC", "p": [], "ul": ["1. Визначити критичну інформацію (плани, маршрути, чисельність, розташування).", "2. Проаналізувати загрози (хто і як може розвідувати).", "3. Знайти вразливості (соцмережі, відкритий ефір, фото).", "4. Оцінити ризики.", "5. Застосувати контрзаходи: шифрування, радіодисципліна, заборона фото позицій, обмеження розмов."]}, {"h": "OPSEC для цивільних", "p": ["Не публікуйте фото й відео місць влучань, роботи ППО, переміщення техніки та військових; не вказуйте геолокацію; не розповідайте незнайомцям про військових знайомих. Навіть дрібні деталі з різних джерел ворог може скласти в цілісну картину."], "ul": []}], "f": "", "pr": ["Наведіть приклад кожної з трьох моделей передачі інформації.", "Складіть 5 правил OPSEC для себе й родини під час війни.", "Знайдіть в інтернеті (без поширення!) приклад допису, який порушує OPSEC, і поясніть, чим він небезпечний."], "q": ["Що таке «туман війни» і як його зменшити?", "Назвіть три моделі передачі інформації.", "Чим аналоговий зв’язок небезпечніший за цифровий?", "Назвіть 5 кроків OPSEC.", "Які правила OPSEC мають виконувати цивільні?"]}, {"n": "7", "t": "Радіозв’язок на полі бою: правила ведення переговорів", "g": "Розуміти вразливість відкритого радіоефіру, знати структуру радіообміну та принцип роботи таблиць кодів і позивних.", "k": "", "terms": [["Позивний", "умовне ім’я абонента в радіомережі."], ["Таблиця кодів (сигналів)", "перелік умовних позначень для об’єктів, місць і дій."], ["Радіообмін", "обмін повідомленнями за встановленими правилами."], ["«Прийом»", "слово, яким завершують передачу й очікують відповіді."]], "th": [{"h": "Відкритий ефір — найбільша вразливість", "p": ["Усе, що сказано в ефірі, може почути противник. Тому переговори ведуть коротко, за правилами, з використанням позивних і кодів, а не справжніх імен, назв і координат."], "ul": []}, {"h": "Структура радіообміну", "p": [], "ul": ["виклик: «Говерла, Говерла, я — Канада, прийом»;", "відповідь: «Канада, Канада, я — Говерла, прийом»;", "передача повідомлення кодами: «Говерла, лама 340 10-50 ґазда-11, прийом»;", "підтвердження отримання та виконання."]}, {"h": "Коди та їх зміна", "p": [], "ul": ["кожен об’єкт, місце, дія отримує код (слово чи число);", "будь-який код можна розгадати, спостерігаючи за діями, тому таблиці кодів і позивні регулярно змінюють;", "на фронті не завжди є час на таблиці кодів, тому важливо завжди дотримуватися радіодисципліни."]}], "f": "", "pr": ["Складіть власну таблицю кодів для класу: позивні для 4 людей, коди для 5 предметів, 3 місць і 3 дій.", "Запишіть радіообмін, у якому ви кодами даєте завдання однокласнику."], "q": ["Чому відкритий ефір небезпечний?", "Що таке позивний?", "З яких елементів складається радіообмін?", "Навіщо регулярно змінювати коди та позивні?"]}, {"n": "8", "t": "Способи і умови пересування військовослужбовців у бою", "g": "Знати основні способи пересування в бою, розуміти, як умови впливають на вибір способу, і чому ці знання корисні цивільним.", "k": "", "terms": [["Перебігання", "швидкий ривок від укриття до укриття на відкритій місцевості."], ["Переповзання", "пересування лежачи: по-пластунськи, на напівкарачки, на боці."], ["Силует", "видимий обрис тіла; чим нижчий, тим менш помітна людина."]], "th": [{"h": "Компроміс швидкості й непомітності", "p": ["Будь-яке переміщення в бою — вибір між швидкістю та непомітністю. Неправильний спосіб руху може призвести до втрат. На вибір впливають вогонь противника, рельєф, наявність дронів, видимість."], "ul": []}, {"h": "Способи пересування", "p": [], "ul": ["кроком або бігом (на повний зріст чи пригнувшись) — там, де противник не бачить і не веде вогонь;", "перебіганням — на відкритій місцевості; довжина ривка в середньому 20–40 кроків: що сильніший вогонь, то коротший ривок; після ривка — знизити силует;", "переповзанням по-пластунськи — найнижчий силует, максимальна непомітність;", "на напівкарачки — швидше, але силует вищий;", "на боці — зручно з вантажем, важкою зброєю або пораненим."]}, {"h": "Навіщо це цивільним", "p": ["Під час обстрілу чи небезпеки знання про низький силует, рух від укриття до укриття та перебігання короткими відрізками можуть врятувати життя будь-кому."], "ul": []}], "f": "", "pr": ["Складіть таблицю «Спосіб пересування — коли застосовують — перевага — недолік».", "На уроці відпрацюйте прискорений крок з пригинанням, три види переповзання та перебігання на 20 і 40 кроків."], "q": ["Чому переміщення в бою — компроміс?", "Яка середня довжина перебігання і від чого вона залежить?", "Які види переповзання ви знаєте?", "Коли зручно переповзати на боці?", "Чим ці знання корисні цивільним?"]}]}, {"name": "Тренінг 7. Основи дій і взаємодії. Орієнтування та визначення відстаней на місцевості", "lessons": [{"n": "1–2", "t": "Техніка переміщення у складі бойової групи: пересування двійками, реакція на контакт", "g": "Знати принцип «вогонь і рух», особливості пересування двійками на різній місцевості, команди взаємоприкриття та загальний порядок реакції на контакт.", "k": "", "terms": [["Двійка", "найменша група з двох осіб, які рухаються поперемінно й прикривають одне одного."], ["«Вогонь і рух»", "принцип: один прикриває, інший рухається."], ["Контакт", "виявлення противника; напрямок вказують за «годинником» (12 — вперед, 3 — праворуч, 6 — назад, 9 — ліворуч)."], ["«Відскок»", "почергове відходження групи під прикриттям вогню."]], "th": [{"h": "Чому починають з двійок", "p": ["Завдання зазвичай ставлять відділенню (умовно 8 осіб), яке ділиться на менші групи. Найменша група — двійка. Уміння злагоджено діяти вдвох — основа роботи будь-якого підрозділу."], "ul": []}, {"h": "Пересування на різній місцевості", "p": [], "ul": ["відкрита місцевість — короткі перебіжки (5–10 секунд), поки напарник прикриває;", "лісиста — використання дерев і кущів як укриттів, дистанція між двійками 5–10 м, щоб не скупчуватися;", "міська — укриття за будівлями й автомобілями, обов’язкова перевірка кутів і дверей."]}, {"h": "Команди взаємоприкриття", "p": [], "ul": ["«Вперед!» — «Йду!» — перебіжка до укриття;", "«Крию!» — зайняв позицію й прикриваю напарника;", "«Відхід!» — почергове відходження під прикриттям;", "по рації — позивні та короткі кодові слова (наприклад, «Сова» — прикриваю, «Кріт» — готовий до руху)."]}, {"h": "Реакція на контакт", "p": [], "ul": ["той, хто помітив противника, негайно подає сигнал: «Контакт на 3!»;", "хто ближчий до загрози — придушує (на уроці — імітаційно), напарник займає укриття, підтверджує й маневрує (у фланг або на відхід);", "у групі командир розподіляє сектори, група може почергово відходити («відскок»);", "говорити коротко й чітко, лише встановленими командами — зайві слова створюють хаос."]}, {"h": "Безпека на занятті", "p": ["Вправи виконують з макетами, за командою вчителя; при роботі з коліна обов’язково використовують наколінники."], "ul": []}], "f": "", "pr": ["Запишіть команди взаємоприкриття та їхнє значення.", "Опишіть, чим відрізняється пересування двійкою на відкритій, лісистій і міській місцевості.", "На уроці відпрацюйте в парах пересування «вперед» і «відхід» з командами."], "q": ["Що означає принцип «вогонь і рух»?", "Скільки триває перебіжка на відкритій місцевості?", "Яку дистанцію тримають між двійками в лісі?", "Як правильно повідомити про контакт?", "Чому під час контакту потрібно говорити лише встановленими командами?"]}, {"n": "3", "t": "Подолання інженерних загороджень. Смуга перешкод (повторення)", "g": "Закріпити знання про невибухові інженерні загородження та вдосконалити командне подолання смуги перешкод.", "k": "", "terms": [["Інженерні загородження", "штучні перешкоди для уповільнення руху противника."]], "th": [{"h": "Пригадаймо", "p": [], "ul": ["загородження уповільнюють противника й часто поєднуються з мінами;", "типи: дротяні перепони, рови, окопи, завали, бетонні блоки;", "виявлення: візуальний пошук, зондування;", "подолання: переповзання, прорізання проходу, підручні засоби;", "команда: одні прикривають — інші долають."]}, {"h": "Оцінювання на смузі перешкод", "p": ["Команди проходять смугу по черзі. Перемагає та, що подолала дистанцію найшвидше, але без «втрат» — тобто зберігаючи прикриття й взаємодію."], "ul": []}], "f": "", "pr": ["Після проходження смуги перешкод проведіть з командою аналіз проведених дій (АПД): що планували, що вийшло, чому, що змінимо."], "q": ["Для чого використовують інженерні загородження?", "Як виявляють загородження?", "Що важливіше на смузі перешкод — швидкість чи взаємодія?"]}, {"n": "4", "t": "Місцевість. Азимути", "g": "Розуміти вплив місцевості на дії, вміти визначати сторони горизонту за компасом, вимірювати магнітний азимут і зворотний азимут.", "k": "", "terms": [["Військова топографія", "наука про місцевість, її форми та об’єкти для потреб війська."], ["Магнітний азимут", "кут між напрямком на північ (за магнітною стрілкою) і напрямком на об’єкт, від 0° до 360° за годинниковою стрілкою."], ["Зворотний азимут", "азимут повернення: ± 180° від прямого."], ["Тисячна", "одиниця виміру кутів, близька до 1/1000 радіана."]], "th": [{"h": "Місцевість і її елементи", "p": ["Рельєф, рослинність, водойми, дороги, будівлі впливають на швидкість руху, маскування, спостереження і ведення вогню. Ліс ховає, але ускладнює орієнтування; рівнина дозволяє швидко рухатися, але робить помітним. Коли зникає GPS чи зв’язок, рятує вміння «читати» місцевість."], "ul": []}, {"h": "Компас Адріанова", "p": [], "ul": ["шкала в градусах (ціна поділки 3°) зростає за годинниковою стрілкою; шкала тисячних (ціна поділки 50 тисячних) — проти;", "перевірка справності: відвести стрілку металевим предметом — вона має повернутися до попереднього відліку;", "не працювати з компасом під час грози, біля ЛЕП і металу; від автомобіля відійти на 10–15 м, від танка — на 30–40 м."]}, {"h": "Сторони горизонту", "p": ["Встановіть мушку на 0°, тримайте компас горизонтально, відпустіть гальмо і поверніть компас так, щоб північний кінець стрілки збігся з 0. Орієнтир через цілик і мушку вкаже північ (0°), протилежний напрямок — південь (180°), праворуч — схід (90°), ліворуч — захід (270°)."], "ul": []}, {"h": "Як виміряти азимут", "p": [], "ul": ["станьте обличчям до орієнтира, тримайте компас горизонтально;", "поєднайте північний кінець стрілки з 0°;", "поверніть візирний пристрій так, щоб бачити орієнтир крізь цілик і мушку;", "зніміть відлік біля мушки — це магнітний азимут;", "зворотний азимут: якщо азимут більший за 180° — відніміть 180°, якщо менший — додайте 180°."]}, {"h": "Цифрові засоби", "p": ["Азимут можна визначати й у цифрових картах (наприклад, у MilChat: інструмент «Циркуль», перемикання на магнітний азимут). Але паперова карта й компас залишаються надійним резервом."], "ul": []}], "f": "Азимут не залежить від орієнтирів, які можуть зникнути (будинок зруйнують, дерево зріжуть), — тому він надійний у лісі, полі, місті й уночі.", "pr": ["Визначте за компасом (або компасом у телефоні) сторони горизонту з вікна класу чи дому й запишіть орієнтири.", "Обчисліть зворотні азимути для 45°, 120°, 200°, 300°.", "Виміряйте азимут на 3 орієнтири біля школи."], "q": ["Як місцевість впливає на дії військових?", "Що таке магнітний азимут?", "Як перевірити справність компаса?", "Як визначити зворотний азимут?", "Чому біля металу чи ЛЕП компас може показувати неправильно?"]}, {"n": "5–6", "t": "Визначення відстаней на місцевості. Формула тисячної", "g": "Знати способи визначення відстаней за допомогою приладів, карт і формули тисячної; вміти обчислювати відстань за кутом і відомим розміром об’єкта.", "k": "", "terms": [["Лазерний далекомір", "прилад, що вимірює відстань за часом руху лазерного імпульсу до об’єкта й назад."], ["Тисячна (мілірадіан)", "1/1000 радіана; у різних арміях коло поділяють на 6000 (пострадянські), 6400 (НАТО, mil) або 6300 (Швеція) тисячних."], ["Формула тисячної", "D = В (Ш) · 1000 / α, де D — дистанція, В (Ш) — висота (ширина) об’єкта, α — кут у тисячних."]], "th": [{"h": "Найточніші способи", "p": [], "ul": ["лазерний далекомір — похибка може бути в міліметрах, але об’єкт має бути в зоні видимості;", "електронні карти (Google Maps: «Виміряти відстань»; MilChat) — достатньо поставити дві точки."]}, {"h": "Формула тисячної", "p": ["D = В (Ш) · 1000 / α. Потрібно знати розмір об’єкта (часто беруть середні значення: ширина людини ≈ 0,5 м, зріст ≈ 1,7 м, висота танка ≈ 2,4 м) і виміряти кут, під яким його видно."], "ul": []}, {"h": "Чим виміряти кут", "p": [], "ul": ["власним пальцем: наприклад, палець шириною 2,4 см на відстані 50 см від ока «закриває» 48 тисячних (0,024·1000/0,5). Людина шириною 0,5 м, яку повністю закриває палець, — на відстані ≈ 10 м;", "сіткою бінокля чи прицілу: танк заввишки 2,4 м видно під кутом 10 тисячних → D = 2,4·1000/10 = 240 м;", "лінійкою на відстані 50 см від ока: 1 мм = 2 тисячні. Людина шириною 0,5 м займає 2 мм (4 тисячні) → D = 0,5·1000/4 = 125 м."]}, {"h": "Похибки", "p": ["Результат приблизний: люди й техніка мають різні розміри, руки тремтять, відстань до лінійки може відрізнятися. Проте для оцінки дистанції метод цілком придатний."], "ul": []}], "f": "Сонце в 400 разів більше за Місяць, але й приблизно в 400 разів далі — тому на небі вони видаються однаковими: ми бачимо їх під однаковим кутом.", "pr": ["Виміряйте ширину свого великого пальця та відстань від ока до пальця на витягнутій руці. Обчисліть, скільки тисячних закриває ваш палець, два й три пальці. Запам’ятайте ці значення.", "Розв’яжіть: людину (ширина 0,5 м) видно під кутом 5 тисячних. Яка відстань? (Відповідь: 100 м.)", "Виміряйте в Google Maps відстань по прямій від школи до відомої пам’ятки вашого міста."], "q": ["Як працює лазерний далекомір?", "Запишіть формулу тисячної та поясніть кожну величину.", "Скільки тисячних у колі в НАТО?", "Скільки тисячних відповідає 1 мм лінійки на відстані 50 см від ока?", "Чому вимірювання за формулою тисячної є приблизним?"]}, {"n": "7", "t": "Інші способи вимірювання відстані: за видимістю, звуком, тінями, кроками", "g": "Вміти оцінювати відстань за ознаками видимості, звуком, пропорціями тіней і власними кроками.", "k": "", "terms": [["Пара кроків", "два кроки (ліва + права нога); рахувати парами зручніше й точніше."]], "th": [{"h": "За ознаками видимості", "p": ["Якщо ви розрізняєте певні деталі об’єкта, він не далі за відстань, указану в спеціальній таблиці ознак видимості. Метод працює лише для людей з добрим зором."], "ul": []}, {"h": "За звуком", "p": ["Світло доходить миттєво, а звук — зі швидкістю приблизно 1/3 км за секунду. Побачивши спалах (блискавку), рахуйте секунди («501, 502, 503…» або «один-тисяча, два-тисяча…»), доки не почуєте звук. Кількість секунд поділіть на 3 — отримаєте відстань у кілометрах. Наприклад, 12 с → 4 км. Чутність звуків (пострілів тощо) дає лише максимальний радіус, а не точну відстань."], "ul": []}, {"h": "За тінями", "p": ["Висота предмета відноситься до довжини його тіні так само, як зріст людини — до довжини її тіні: B/D = b/d. Приклад: тінь дерева 17,2 м, людина 1,77 м має тінь 2,25 м → B = 17,2·1,77/2,25 ≈ 13,5 м."], "ul": []}, {"h": "Кроками", "p": [], "ul": ["визначте довжину свого кроку на відомій дистанції (наприклад, коло стадіону 400 м), пройшовши її кілька разів і рахуючи пари кроків;", "приклад: 328 пар = 656 кроків на 400 м → крок ≈ 61 см; 100 м ≈ 82 пари кроків;", "знадобиться й у житті: виміряти паркан, відміряти 11 м для пенальті."]}], "f": "", "pr": ["Визначте довжину свого кроку на стадіоні (3 кола по 400 м) і обчисліть, скільки пар кроків у вас на 100 м.", "Виміряйте висоту дерева чи будинку за тінню, використовуючи тінь людини.", "Розв’яжіть: між спалахом і громом минуло 9 секунд. Яка відстань до грози?"], "q": ["Як визначити відстань за звуком?", "Чому краще рахувати «501, 502…», а не «1, 2…»?", "Запишіть пропорцію для вимірювання висоти за тінню.", "Як визначити довжину свого кроку?", "Що означає, якщо ви чуєте звук, характерний для відстані 2–3 км?"]}, {"n": "8", "t": "Орієнтування на місцевості за допомогою навігаційних приладів. Гра на коригування «вогню»", "g": "Зрозуміти основи найпростішого коригування вогню, закріпити вимірювання відстаней, орієнтування та роботу з цифровою картою (MilChat).", "k": "", "terms": [["Спостережний пункт (СП)", "місце, з якого спостерігають за ціллю та коригують вогонь."], ["Коригування", "передача поправок (у метрах за напрямками північ–південь, захід–схід), щоб наступний «постріл» влучив."]], "th": [{"h": "Як проходить гра", "p": [], "ul": ["картонна коробка — «ворожа техніка»; учасник із м’ячем — «артилерія»;", "двоє учнів на СП позначають ціль на цифровій карті (MilChat: шари, об’єкт «ворожий — наземний — танк»);", "після кожного «пострілу» (удару м’яча) СП фіксує місце падіння і за допомогою інструмента «циркуль» визначає поправку (наприклад, «Північ 11 м, Захід 16 м»);", "поправку передають «артилерії», яка вносить корекцію."]}, {"h": "Чого вчить гра", "p": ["Точність спостереження, швидкість і чіткість передачі інформації, вміння працювати з картою та командою. Саме так у реальних умовах спостерігачі й оператори дронів допомагають артилерії влучати."], "ul": []}], "f": "", "pr": ["Встановіть MilChat (або відкрийте будь-яку цифрову карту) і потренуйтеся ставити позначки та вимірювати відстань між двома точками.", "Опишіть, які навички знадобилися вам під час гри на коригування «вогню»."], "q": ["Що робить спостережний пункт?", "Як визначають поправку для коригування?", "У яких одиницях і за якими напрямками передають поправку?", "Які навички розвиває ця гра?"]}]}, {"name": "Тренінг 8. Орієнтування без приладів. Мінна безпека. Домедична допомога в умовах бою (початок)", "lessons": [{"n": "1", "t": "Орієнтування на місцевості без спеціальних навігаційних приладів", "g": "Вміти визначати сторони світу за Сонцем (тінь, годинник, схід і захід), за Полярною зорею та штучними об’єктами, критично оцінювати «народні» прикмети.", "k": "", "terms": [["Спуфінг", "надсилання хибних GPS-сигналів, через які телефон показує неправильне місцезнаходження."], ["Полярна зоря", "зірка в сузір’ї Малої Ведмедиці, яка майже точно вказує на північ."], ["Бісектриса", "промінь, що ділить кут навпіл."]], "th": [{"h": "Навіщо це вміти", "p": ["GPS і смартфон не завжди допоможуть: під час повітряних тривог через спуфінг навігація може «зводити з розуму», може зникнути зв’язок чи сісти батарея. Тоді рятують прості способи орієнтування."], "ul": []}, {"h": "За Сонцем", "p": [], "ul": ["Спосіб тіні: встроміть палицю, позначте кінець тіні, через 15–30 хв позначте знову й з’єднайте точки. Станьте спиною до Сонця, носками на лінію — попереду північ.", "Схід і захід: лише в дні рівнодення Сонце сходить точно на сході; влітку — на північному сході, взимку — на південному сході (захід — відповідно).", "«Опівдні Сонце на півдні» (для широт України).", "За годинником зі стрілками: тримайте годинник горизонтально, наведіть годинну стрілку на Сонце; бісектриса кута між нею та цифрою «1» вказує на ПІВДЕНЬ (спосіб приблизний)."]}, {"h": "Уночі", "p": [], "ul": ["Полярну зорю шукають за Великою Ведмедицею: продовжте лінію двох крайніх зір «ковша» приблизно на п’ять відстаней між ними;", "або за W-подібною Кассіопеєю;", "Полярна зоря — не найяскравіша на небі! Її висота над горизонтом приблизно дорівнює географічній широті;", "взимку Пояс Оріона під час сходу вказує на схід, під час заходу — на захід."]}, {"h": "За штучними об’єктами", "p": ["Вівтар православних церков традиційно спрямований на схід, вхід — на захід; нижня перекладина хреста піднятим краєм вказує на північ. Але будівлі не завжди орієнтовані точно — метод приблизний."], "ul": []}, {"h": "Мох, мурашники, крони — ненадійні", "p": ["Мох росте там, де волого (часто, але не завжди, на півночі); розташування мурашників і густота крон залежать від багатьох чинників. Ці ознаки можуть лише підтвердити, але не замінити основні способи."], "ul": []}], "f": "Висота Полярної зорі над горизонтом у Рівному — близько 50,6°, тобто приблизно дорівнює широті міста.", "pr": ["Визначте північ способом тіні біля школи чи дому. Перевірте результат компасом телефону.", "Знайдіть Полярну зорю ввечері (або в застосунку Stellarium / Star Walk).", "Розв’яжіть: о 13:00 серед однакових будинків ви не можете зорієнтуватися за картою. Що робити?"], "q": ["Що таке спуфінг і чому через нього не можна повністю покладатися на GPS?", "Опишіть спосіб визначення півночі за тінню.", "Куди вказує бісектриса у способі з годинником?", "Як знайти Полярну зорю?", "Чому мох і мурашники — ненадійні орієнтири?"]}, {"n": "2–3", "t": "Протипіхотні міни: чому на них не можна стояти? Оттавська конвенція", "g": "Розвінчати кіноміфи про міни, мати загальне уявлення про типи протипіхотних мін і знати головні правила мінної безпеки; обговорити Оттавську конвенцію.", "k": "", "terms": [["Протипіхотна міна", "вибуховий пристрій для ураження людей."], ["Міна натискної дії", "спрацьовує, коли на неї наступають."], ["Міна направленої дії", "уражає елементами в певному секторі."], ["Вистрибуюча міна", "підстрибує і вибухає над землею."], ["Оттавська конвенція (1997)", "міжнародний договір про заборону протипіхотних мін."]], "th": [{"h": "Кіноміф", "p": ["У фільмах герой наступає на міну, завмирає, і вибух стається лише коли він прибирає ногу. Насправді механізми мін різні: більшість спрацьовує від натиску, натягнення дроту чи іншого датчика, деякі мають пристрої проти знешкодження. Кінотроп — драматургія, а не інструкція; вірити йому смертельно небезпечно."], "ul": []}, {"h": "Типи протипіхотних мін (загально)", "p": [], "ul": ["фугасні натискної дії (наприклад, ПМН-2, ПФМ-1 «Пелюстка») — руйнують стопу/ногу; ПФМ-1 розкидають дистанційно, вона маленька й нагадує іграшку чи листок;", "направленої дії (МОН-50) — уражають сотнями елементів у секторі на десятки метрів;", "вистрибуючі (ОЗМ-72) — підстрибують і вибухають на висоті близько метра, ураження по колу."]}, {"h": "ГОЛОВНЕ правило", "p": ["НЕ ПІДХОДЬ! НЕ ЧІПАЙ! 101 НАБИРАЙ! Навіть макет чи «просто шматок заліза» не торкаються й не пересувають. Розміновувати може лише фахівець — сапер або піротехнік ДСНС."], "ul": []}, {"h": "Оттавська конвенція", "p": ["Конвенція 1997 року забороняє застосування, накопичення, виробництво й передачу протипіхотних мін. Росія її не підписала й масово мінує українські території. У 2025 році Україна, Польща, Фінляндія, Литва, Латвія та Естонія оголосили про вихід або призупинення участі, пояснюючи це загрозою з боку Росії та необхідністю захищатися від агресора, що не дотримується правил."], "ul": []}], "f": "Україна — одна з найбільш замінованих країн світу; розмінування триватиме ще багато років.", "pr": ["Запишіть головне правило мінної безпеки й поясніть, чому не можна торкатися навіть «макета».", "Підготуйте аргументи «за» і «проти» виходу України з Оттавської конвенції (по 3)."], "q": ["Чому кіносцени з мінами небезпечно сприймати як інструкцію?", "Назвіть типи протипіхотних мін за способом дії.", "Чим небезпечна міна ПФМ-1 «Пелюстка» для цивільних?", "Яке головне правило мінної безпеки?", "Що таке Оттавська конвенція і чому деякі країни з неї виходять?"]}, {"n": "4", "t": "Демаскуючі ознаки мін. Військові професії: інженери-сапери", "g": "Знати демаскуючі ознаки мін і вибухонебезпечних предметів на місцевості, дорогах, у будівлях, та ознайомитися з професією сапера.", "k": "", "terms": [["Демаскуючі ознаки мін", "прикмети, що можуть вказувати на встановлений вибуховий пристрій."], ["Розтяжка", "дріт чи шнур, натягнутий над землею, що може спрацювати від зачіпання."], ["Сапер", "військовий фахівець із встановлення та знешкодження мін."]], "th": [{"h": "На місцевості", "p": [], "ul": ["невеликі свіжі ямки, горбки, осідання ґрунту в певному порядку;", "плями ґрунту іншого кольору чи структури, порушений сніг;", "упаковки, обгортки, фрагменти тари, металеві чи пластикові предмети;", "натягнуті дроти, шнури, кілочки;", "яскраві «цікаві» предмети — можуть бути приманкою;", "тварини уникають ділянки."]}, {"h": "На дорогах і мостах", "p": [], "ul": ["«латки» в покритті, нові дошки чи плити, свіжий бетон;", "розкопані ділянки, дрібні траншеї поперек дороги;", "дроти, пакети, ящики біля опор мостів."]}, {"h": "У будівлях", "p": [], "ul": ["розтяжки в коридорах, дверях, на сходах;", "свіжа кладка, тинькування, сліди розкриття підлоги;", "підозрілі дроти, батареї, отвори у стінах."]}, {"h": "Що робити", "p": ["Помітили ознаку — зупиніться, не рухайтеся далі, поверніться тим самим шляхом, яким прийшли, позначте місце (не торкаючись) і повідомте за номером 101 або 102. Ніколи не підбирайте незнайомі предмети."], "ul": []}, {"h": "Професія сапера", "p": ["Інженерно-саперні підрозділи забезпечують рух своїх військ і перешкоджають руху противника: розміновують дороги й території, облаштовують позиції, будують переправи. Потрібні холодний розум, технічне мислення, увага до деталей і робота в команді. Після війни саме сапери повертатимуть безпеку на звільнені землі."], "ul": []}], "f": "", "pr": ["Складіть пам’ятку «Демаскуючі ознаки мін» для родини (8–10 пунктів) та алгоритм дій.", "Знайдіть на сайті Lobby X вакансії інженерно-саперних спеціальностей і опишіть одну з них."], "q": ["Назвіть 5 демаскуючих ознак мін на місцевості.", "Які ознаки можуть вказувати на мінування дороги чи мосту?", "Що робити, якщо ви помітили підозрілий предмет?", "Які навички потрібні саперу?", "Чому професія сапера критично важлива?"]}, {"n": "5", "t": "Протоколи TCCC. Бойовий стрес і саморегуляція. Професія бойового медика", "g": "Знати три фази TCCC, розпізнавати реакції на стрес («бий — біжи — завмри»), володіти базовими техніками дихання та «заземлення», знати протокол ЯАЛОМ.", "k": "", "terms": [["TCCC", "Tactical Combat Casualty Care — протокол допомоги пораненим в умовах бою."], ["«Червона зона»", "допомога під вогнем / загрозою."], ["«Жовта зона»", "допомога в польових умовах, коли загроза мінімізована."], ["Бойовий медик", "фахівець, що рятує життя в екстремальних умовах."]], "th": [{"h": "Безпека — понад усе", "p": ["Понад половина смертей від крововтрати настає в перші хвилини — швидка просто не встигне. Тому кожен, хто поруч, — перша людина, яка може допомогти. Але спершу — власна безпека: поранений рятувальник не допоможе нікому."], "ul": []}, {"h": "Тактичні пріоритети та три фази TCCC", "p": [], "ul": ["пріоритети: 1) безпека місця події; 2) переміщення пораненого в безпечне місце; 3) зупинка кровотечі, що загрожує життю;", "допомога під вогнем (червона зона) — самозбереження, укриття, лише турнікет на кінцівку з масивною кровотечею;", "допомога в польових умовах (жовта зона) — повноцінна допомога за алгоритмом;", "допомога під час евакуації — під час транспортування."]}, {"h": "Стрес — нормальна реакція", "p": ["У небезпеці мозок вмикає режим виживання: «бий», «біжи» або «завмри». Центр страху (амигдала) реагує миттєво, а центр логіки гальмується — тому людині важко думати. Мета — не позбутися страху, а підкорити його чіткими діями. У стресі можна не відчути власної травми, тому в укритті спочатку «Стоп-кадр»: огляньте себе."], "ul": []}, {"h": "Техніки повернення контролю", "p": [], "ul": ["дихання: видих довший за вдих; «Квадрат» — вдих на 4, затримка на 4, видих на 6, пауза;", "техніка «Вуса» — глибокий вдих і протяжний видих «Вууусааа»;", "«М’язовий стоп-кадр» — стиснути кулаки на 5 секунд і різко розслабити;", "«Заземлення» 5–4–3–2–1 — назвати 5 речей, які бачите, 4 — які відчуваєте на дотик, 3 звуки, 2 запахи, 1 смак."]}, {"h": "Протокол ЯАЛОМ", "p": [], "ul": ["Я — «Я тут, щоб тобі допомогти»;", "А — «А що з тобою? Де болить?»;", "Л — «Лежи, не рухайся»;", "О — «Озирнися, ми переміщаємося в безпечне місце»;", "М — «Можеш сам? Повзи!»."]}, {"h": "Як допомогти людині в стресі", "p": ["Говорити тихо, повільно, коротко («Сядь. Дихай»); не кричати, не соромити, не давати складних інструкцій. Будь-які реакції тіла на страх — нормальні, їх не коментують і не висміюють."], "ul": []}], "f": "Онлайн-симулятор LifesaverSIM дозволяє безпечно потренуватися в ухваленні рішень під час надання допомоги.", "pr": ["Щодня протягом тижня виконуйте дихання «Квадрат» (2–3 хвилини) і запишіть, як змінюється ваш стан.", "Розшифруйте протокол ЯАЛОМ і складіть до кожної літери свою фразу.", "Пройдіть перші місії в симуляторі LifesaverSIM."], "q": ["Які три фази має TCCC?", "Назвіть тактичні пріоритети в правильному порядку.", "Що таке реакції «бий — біжи — завмри»?", "Навіщо робити «Стоп-кадр» і оглядати себе?", "Назвіть 3 техніки повернення контролю над собою."]}, {"n": "6", "t": "Правила поводження під час трьох фаз TCCC. Переміщення пораненого із зони загрози", "g": "Розуміти, коли і як безпечно переміщати пораненого, знати базові способи евакуації однією та двома особами.", "k": "", "terms": [["Евакуація", "переміщення пораненого з небезпечної зони в безпечне місце."], ["Імпровізовані ноші", "ноші з підручних засобів: куртки, ременя, плащ-намета."]], "th": [{"h": "«Швидко, але обдумано»", "p": ["Швидкість важлива, але безпека — понад усе: необдумані дії створюють нових постраждалих. У червоній зоні мета одна — переміститися в укриття. У жовтій — план: оцінити пораненого й надати допомогу."], "ul": []}, {"h": "Способи переміщення", "p": [], "ul": ["одним рятувальником — волочіння (зокрема за евакуаційну петлю чи бронежилет), перенесення на собі, спосіб «пожежника» (на плечі) — вимагає сили, але звільняє руку;", "двома рятувальниками — «замок» зі зчеплених рук, ношами з підручних засобів;", "переміщенням має займатися щонайменше двоє, один — лише в екстреному випадку."]}, {"h": "Особливі випадки", "p": [], "ul": ["підозра на травму хребта — буд
