ортепіано)."], ["Пекінська опера", "китайський музичний театр, що поєднує спів, декламацію, акробатику, пантоміму."], ["Ґаґаку", "давня придворна музика Японії."], ["Пхансорі", "корейський жанр оповіді-співу під барабан."], ["Кабукі, Но", "традиційні японські театри."]], "th": [{"h": "Спільні риси", "p": [], "ul": ["пентатоніка — основа мелодій;", "увага до тембру окремого звуку, до пауз і тиші;", "зв’язок музики з філософією, природою, театром;", "мелодія важливіша за гармонію; часте одноголосся."]}, {"h": "Китай", "p": [], "ul": ["ґуцінь — 7-струнна цитра, інструмент учених і філософів (Конфуцій грав на ньому);", "піпа — 4-струнна лютня; ерху — 2-струнна «скрипка», звук якої нагадує людський голос;", "ді — бамбукова флейта; шен — губний орган з бамбукових трубочок;", "Пекінська опера (з кінця XVIII ст.) — синтез співу, акробатики, бойових мистецтв; колір гриму має значення: червоний — вірність і мужність, чорний — чесність, білий — підступність. Внесена до спадщини ЮНЕСКО."]}, {"h": "Японія", "p": [], "ul": ["ґаґаку — придворна оркестрова музика, одна з найдавніших у світі;", "кото — 13-струнна цитра; сямісен — 3-струнна лютня; сякухаті — бамбукова флейта;", "тайко — великі барабани, виступи яких схожі на бойове мистецтво;", "театр Но — повільний, філософський, актори в масках; кабукі — яскраві костюми та грим кумадорі; бунраку — ляльковий театр;", "сучасність: J-pop, музика до аніме (Джо Хісаісі — композитор фільмів Хаяо Міядзакі)."]}, {"h": "Корея", "p": [], "ul": ["каягим — 12-струнна цитра;", "пхансорі — один співак і барабанщик із барабаном пук розповідають історію протягом кількох годин;", "самульнорі — ансамбль із чотирьох ударних інструментів, що символізують грім, дощ, хмари й вітер;", "сучасність: K-pop — яскраве шоу, де музика, хореографія, мода і відео однаково важливі (BTS, BLACKPINK)."]}], "f": "Звук ерху називають «плачем» — на цьому інструменті лише дві струни, а смичок затиснутий між ними.", "pr": ["Прослухайте фрагменти гри на ерху, кото та виступ барабанів тайко. Опишіть кожен тембр одним-двома образами з природи (наприклад, «як вітер у бамбуку»).", "Зіграйте пентатоніку: на фортепіано чи в онлайн-піаніно натискайте лише чорні клавіші — придумайте коротку мелодію. Що вона вам нагадує?", "Намалюйте ескіз гриму для героя пекінської опери, використовуючи символіку кольорів."], "q": ["Що таке пентатоніка?", "Назвіть по два інструменти Китаю, Японії та Кореї.", "Що означають кольори гриму в пекінській опері?", "Чим відрізняються театри Но і кабукі?", "Які сучасні музичні явища Далекого Сходу популярні у світі?"]}, {"n": "23", "t": "Японські сади. Чайна церемонія", "g": "Зрозуміти філософію японського саду та чайної церемонії, їхні види, елементи й символіку.", "k": "", "terms": [["Каресансуй", "«сухий» сад каменів і піску."], ["Ваби-сабі", "японська естетика краси простого, недосконалого, мінливого."], ["Тяною (тядо)", "«шлях чаю» — японська чайна церемонія."], ["Тясіцу", "чайний будиночок."], ["Ікебана", "мистецтво складання квіткових композицій."]], "th": [{"h": "Японський сад — природа в мініатюрі", "p": ["Японський сад — це не клумби, а модель Всесвіту. Камені символізують гори й острови, пісок або вода — море, мох — ліс. Сад призначений для споглядання й роздумів."], "ul": ["сухий сад каменів (каресансуй) — найвідоміший у храмі Рьоан-дзі в Кіото: 15 каменів на білому гравії, але з жодної точки не видно всіх 15 одночасно; гравій розчісують граблями, створюючи «хвилі»;", "сад зі ставком — для прогулянок або споглядання з павільйону;", "чайний сад (родзі) — стежка до чайного будиночка, що допомагає «залишити» буденні турботи;", "елементи: кам’яні ліхтарі, містки, бамбукові огорожі, клени, сакура, сосни, короп у ставку."]}, {"h": "", "p": ["До мистецтва японського саду близькі бонсай (вирощування мініатюрних дерев) та ікебана (композиція з квітів, гілок і листя, яка часто має три головні лінії — «небо», «людина», «земля»).", "В Україні є Корейський традиційний сад у Національному ботанічному саду імені М. М. Гришка в Києві, а японські сади — в ботанічних садах кількох міст."], "ul": []}, {"h": "Чайна церемонія", "p": ["Чай прийшов до Японії з Китаю, а в XVI ст. майстер Сен-но Рікю перетворив чаювання на мистецтво й духовну практику. Чотири принципи чайної церемонії:"], "ul": ["ва — гармонія;", "кей — повага;", "сей — чистота;", "дзяку — спокій."]}, {"h": "", "p": ["Церемонія відбувається в маленькому чайному будиночку (тясіцу). Вхід до нього дуже низький — навіть знатний гість мусить схилитися: перед чаєм усі рівні. Господар готує зелений порошковий чай маття: насипає його в чашу (тяван), заливає гарячою водою й збиває бамбуковим віничком (тясен). Гість приймає чашу, повертає її, милується нею, п’є і дякує. Кожен рух виважений, а увагу приділяють і сувою на стіні, і квіткам, і посуду.", "У Китаї існує своя чайна традиція — гунфу-ча, де головне — майстерність заварювання та смак чаю."], "ul": []}], "f": "Японське прислів’я, пов’язане з чайною церемонією, — «ітіґо ітіе»: «одна зустріч — одна можливість». Кожна зустріч неповторна, тому її слід цінувати.", "pr": ["Створіть проєкт міні-саду каменів: у коробці або на аркуші розмістіть 3–5 «каменів» і намалюйте «хвилі» піску. Поясніть, що символізує кожен елемент.", "Або: складіть ікебану з гілок, листя й квітів, які є під рукою (три головні лінії: «небо», «людина», «земля»), сфотографуйте та опишіть.", "Напишіть, як принципи ва, кей, сей, дзяку можна застосувати у вашому житті."], "q": ["Що символізують камені, пісок і мох у японському саду?", "Чим особливий сад храму Рьоан-дзі?", "Хто такий Сен-но Рікю?", "Назвіть чотири принципи чайної церемонії.", "Чому вхід до чайного будиночка такий низький?"]}]}, {"name": "Тема 4. Мистецтво індійського культурного регіону (4 год.)", "lessons": [{"n": "24", "t": "Синтез архітектури і скульптури", "g": "Зрозуміти, як в індійських храмах архітектура й скульптура зливаються в єдине ціле, знати основні типи споруд і видатні пам’ятки Індії.", "k": "", "terms": [["Ступа", "буддійська культова споруда у формі напівсфери, де зберігаються реліквії."], ["Торана", "різьблені кам’яні ворота ступи."], ["Шикхара", "високий вежоподібний дах-вершина індуїстського храму на півночі Індії."], ["Гопурам", "величезна ступінчаста вежа-брама храмів Південної Індії."], ["Синтез мистецтв", "поєднання кількох видів мистецтва в одному творі."]], "th": [{"h": "Храм як модель Всесвіту", "p": ["Індія — батьківщина індуїзму, буддизму, джайнізму, сикхізму; тут поширений і іслам. Кожна релігія залишила свої шедеври. В індійському храмі архітектура і скульптура нероздільні: стіни, колони, вежі вкриті тисячами рельєфів і статуй богів, тварин, танцівниць, квітів. Храм уявляли як священну гору Меру — центр Всесвіту."], "ul": []}, {"h": "Буддійська архітектура", "p": [], "ul": ["Ступа в Санчі (ІІІ ст. до н. е., за часів царя Ашоки) — напівсфера, оточена огорожею з чотирма різьбленими воротами-торанами, які розповідають про життя Будди;", "печерні храми Аджанти — вирубані в скелі монастирі з чудовими фресками;", "Елора — комплекс із 34 печерних храмів різних релігій; храм Кайласа (VIII ст.) вирубаний з однієї скелі згори донизу, як величезна скульптура."]}, {"h": "Індуїстські храми", "p": [], "ul": ["Кхаджурахо (Х–ХІ ст.) — храми з високими шикхарами, вкриті витонченою скульптурою;", "Сонячний храм у Конараку (XIII ст.) — у формі колісниці бога Сонця з 24 різьбленими колесами й кіньми;", "храм Мінакші в Мадураї — гопурами заввишки до 50 м, вкриті тисячами розписаних фігур;", "скульптура: «Шива Натараджа» — бронзова статуя танцюючого Шиви в колі полум’я (доба Чола); тримурті (тригола статуя) в печерах острова Елефанта."]}, {"h": "Мистецтво Великих Моголів", "p": ["У XVI–XVII ст. Індією правили мусульманські імператори з династії Великих Моголів. Вони поєднали індійські та перські традиції."], "ul": ["Тадж-Махал в Агрі (1632–1653) — мавзолей, який імператор Шах-Джахан звів на честь дружини Мумтаз-Махал. Білий мармур інкрустований напівдорогоцінним камінням, будівля ідеально симетрична, відбивається у воді каналу;", "Червоний форт у Делі, мінарет Кутб-Мінар."]}, {"h": "Сучасність", "p": ["«Храм Лотоса» в Делі (1986) — будівля у формі квітки лотоса з 27 мармурових «пелюсток»; сучасна архітектура міста Чандігарх за проєктом Ле Корбюзьє."], "ul": []}], "f": "Колір мармуру Тадж-Махалу змінюється протягом дня: вранці він рожевуватий, удень — сліпучо-білий, а в місячному світлі — золотавий.", "pr": ["Підготуйте «картку-екскурсію» про одну пам’ятку Індії (Тадж-Махал, Кайласа, Конарак, Мінакші, Санчі): фото або малюнок, де і коли збудовано, релігія, 3 цікаві факти, як у ній поєднуються архітектура і скульптура.", "Розгляньте статую «Шива Натараджа» та поясніть символіку: коло полум’я, чотири руки, піднята нога, карлик під ногою."], "q": ["Чому індійський храм називають «моделлю Всесвіту»?", "Що таке ступа і торана?", "Чим унікальний храм Кайласа в Елорі?", "Як виглядає Сонячний храм у Конараку?", "Хто і навіщо збудував Тадж-Махал?"]}, {"n": "25", "t": "Музика Індії. Рага. Музичний інструментарій", "g": "Дізнатися про дві традиції класичної музики Індії, поняття раги й тали, основні індійські інструменти та відомих виконавців.", "k": "", "terms": [["Рага", "мелодична основа (лад + характерні звороти), на якій музикант імпровізує; кожна рага має свій настрій і час виконання."], ["Тала", "ритмічний цикл (наприклад, тінтал — 16 долей)."], ["Раса", "емоційний настрій, «смак» твору."], ["Бурдон", "тривалий незмінний звук-фон (його створює тампура)."]], "th": [{"h": "Дві традиції", "p": ["Класична музика Індії існує в двох традиціях: хіндустанській (Північна Індія, з перським впливом) та карнатичній (Південна Індія). Обидві спираються на давній трактат «Натьяшастра» (приписують мудрецю Бхараті) і на три основи: рагу, талу та імпровізацію."], "ul": []}, {"h": "Рага", "p": ["Слово «рага» означає «забарвлення», «те, що зачаровує душу». Рага — не готова мелодія, а набір правил: які звуки використовувати, у якому порядку підніматися й спускатися, які звороти характерні. На цій основі музикант щоразу творить нову імпровізацію. Кожна рага пов’язана з певним часом доби (ранкові, вечірні, нічні раги), порою року й настроєм (раса): любов, смуток, мужність, спокій. Виконання раги може тривати від кількох хвилин до години й більше.", "Традиційна форма: повільний вступ без ритму (алап), поступове прискорення, приєднання ударних і віртуозний фінал."], "ul": []}, {"h": "Інструменти", "p": [], "ul": ["ситар — довгогрифовий струнний інструмент із резонатором із гарбуза; має струни, що звучать «у відповідь» (резонансні);", "віна — один з найдавніших струнних інструментів, пов’язаний з богинею мудрості Сарасваті;", "сарод (струнний без ладів), сарангі (смичковий, найближчий до людського голосу);", "табла — пара барабанів, на яких грають пальцями; складна система складів-звуків;", "мрідангам — двосторонній барабан (карнатична музика);", "бансурі — бамбукова флейта, інструмент бога Крішни;", "шехнай — дерев’яний духовий інструмент (звучить на весіллях);", "тампура — створює безперервний бурдон, фон для раги."]}, {"h": "Видатні музиканти", "p": [], "ul": ["Раві Шанкар (ситар) — познайомив Захід з індійською музикою; навчав гітариста гурту The Beatles Джорджа Гаррісона, після чого ситар зазвучав у піснях «бітлів»;", "Закір Хуссейн (табла), Харіпрасад Чаурасія (бансурі), Бісмілла Хан (шехнай)."]}], "f": "За легендою, раги можуть впливати на природу: вечірня рага «Діпак» нібито запалює світильники, а рага «Мегх Малхар» викликає дощ.", "pr": ["Прослухайте фрагмент раги у виконанні Раві Шанкара (5–10 хв). Визначте: коли з’являються ударні, як змінюється темп, який настрій (раса) панує. Для якого часу доби, на вашу думку, ця рага?", "Створіть «картку інструмента»: малюнок одного індійського інструмента, група (струнні, духові, ударні), як на ньому грають, особливості звучання."], "q": ["Чим відрізняються хіндустанська та карнатична традиції?", "Що таке рага і тала?", "Чому одну й ту саму рагу щоразу виконують по-різному?", "Назвіть 5 індійських інструментів.", "Як Раві Шанкар вплинув на західну музику?"]}, {"n": "26", "t": "Символічність танцювального мистецтва", "g": "Дізнатися про класичні танці Індії, мову жестів (мудри), вираз обличчя та зв’язок танцю з міфологією.", "k": "", "terms": [["Мудра (хаста)", "символічний жест руки в індійському танці."], ["Абхіная", "виразність: передача змісту через обличчя, очі, жести."], ["Нрітта", "«чистий» танець — ритмічні рухи без сюжету."], ["Нрітья", "виразний танець, що передає почуття й сюжет."], ["Ґунґру", "дзвіночки на щиколотках танцівника."]], "th": [{"h": "Танець — молитва й розповідь", "p": ["В Індії танець вважається священним мистецтвом. За міфологією, Всесвіт творить і руйнує своїм космічним танцем бог Шива — Натараджа («цар танцю»). Давній трактат «Натьяшастра» описує правила танцю, музики і театру. Класичний танець складається з трьох частин: нрітта (чистий ритм), нрітья (вираження почуттів) і натья (драма, сюжет)."], "ul": []}, {"h": "Мова тіла", "p": [], "ul": ["мудри: для однієї руки описано 28 жестів, для двох рук — 24; один і той самий жест може означати різне (наприклад, «патака» — розкрита долоня — це і прапор, і хмара, і ліс, і благословення);", "очі та брови — окрема «мова»; танцівники роками тренують рухи очей;", "дев’ять рас (почуттів): любов, сміх, смуток, гнів, мужність, страх, відраза, подив, спокій;", "ритм, що вибивають ногами, підсилений дзвіночками ґунґру."]}, {"h": "Класичні танці Індії", "p": [], "ul": ["бхаратанатьям (Тамілнад) — геометрично чіткі пози, напівприсід, виразні мудри;", "катхак (Північна Індія) — швидкі оберти й віртуозне вибивання ритму ногами; сформувався під впливом придворної культури Моголів;", "катхакалі (Керала) — танець-драма, виконують чоловіки з яскравим гримом і великими спідницями; сюжети з епосів «Рамаяна» і «Махабхарата»;", "одіссі (Орісса) — плавні, скульптурні пози, як у храмових статуях;", "маніпурі, кучипуді, мохініяттам, сатрія — інші визнані класичні стилі."]}, {"h": "Народні танці й сучасність", "p": ["Окрім класичних, в Індії безліч народних танців: бхангра (Пенджаб) — енергійний танець свята врожаю, ґарба (Гуджарат) — коловий танець із паличками. Сучасний «боллівудський» танець поєднує класичні мудри, народні рухи й західну хореографію."], "ul": []}], "f": "Підготовка танцівника катхакалі до виступу — нанесення гриму й одягання костюма — може тривати 3–4 години.", "pr": ["Вивчіть і відтворіть 4 мудри: патака (пряма долоня — прапор, хмара), тріпатака (безіменний палець зігнутий — корона, дерево), ардхачандра (великий палець відведено — півмісяць), алападма (пальці розкриті віялом — розквітлий лотос). Сфотографуйте або замалюйте їх і складіть із них коротку «історію».", "Перегляньте фрагменти бхаратанатьяму і катхаку та порівняйте їх (рухи, костюм, темп, музика)."], "q": ["Чому танець в Індії вважається священним?", "Що таке нрітта, нрітья і натья?", "Що таке мудра? Наведіть приклади.", "Назвіть 4 класичні танці Індії та їхні особливості.", "Хто такий Шива Натараджа?"]}, {"n": "27", "t": "Індійський кінематограф", "g": "Дізнатися про історію та особливості кіно Індії, центри кіновиробництва, видатних режисерів і акторів.", "k": "", "terms": [["Боллівуд", "кіноіндустрія Мумбаї (колишній Бомбей), фільми мовою гінді."], ["Масала-фільм", "фільм, що поєднує кілька жанрів: драму, комедію, бойовик, мелодраму, мюзикл."], ["Плейбек-співак", "співак, чий голос звучить у піснях замість голосу актора."]], "th": [{"h": "Історія", "p": [], "ul": ["1913 — перший індійський повнометражний фільм «Раджа Харішчандра» режисера Дадасахеба Пхальке, «батька індійського кіно»;", "1931 — перший звуковий фільм «Алам Ара»; відтоді пісні стали невід’ємною частиною індійського кіно;", "1950-ті — «золота доба»: Радж Капур («Бродяга», 1951) — фільм був надзвичайно популярний і в СРСР, зокрема в Україні;", "Сатьяджит Рей (Бенгалія) — «Пісня дороги» (1955), вершина авторського кіно; 1992 р. отримав почесний «Оскар»."]}, {"h": "Кіноцентри Індії", "p": ["Індія випускає найбільше фільмів у світі. Кіно знімають різними мовами:"], "ul": ["Боллівуд — Мумбаї, мова гінді;", "Толлівуд — телугу; Коллівуд — тамільська мова та інші регіональні кіноіндустрії."]}, {"h": "Особливості індійського кіно", "p": [], "ul": ["численні пісні й танці, які розкривають почуття героїв;", "поєднання жанрів (масала);", "велика тривалість — часто близько трьох годин з антрактом;", "яскраві костюми, мальовничі пейзажі;", "теми: кохання, родина, дружба, боротьба добра зі злом, соціальна несправедливість;", "плейбек-співаки: Лата Мангешкар записала тисячі пісень для фільмів."]}, {"h": "Зірки й сучасність", "p": ["Амітабх Баччан, Шахрукх Кхан, Аамір Кхан («Лагаан», «Три ідіоти») — зірки світового масштабу. Фільм «RRR» (2022) отримав «Оскар» за пісню «Naatu Naatu». Цікаво, що танцювальну сцену до цієї пісні знімали в Києві, біля Маріїнського палацу, 2021 року."], "ul": []}], "f": "Сцену «Naatu Naatu» з фільму «RRR», знятого біля Маріїнського палацу в Києві, переглянули в мережі сотні мільйонів разів.", "pr": ["Перегляньте музичний фрагмент «Naatu Naatu» або пісню з іншого індійського фільму. Визначте: які почуття героїв передає танець, які елементи класичного та народного танцю ви помітили, де відбувається дія.", "Складіть «рецепт» масала-фільму: які жанри, персонажі, пісні та «інгредієнти» обов’язкові. Придумайте назву свого фільму."], "q": ["Хто вважається «батьком індійського кіно»?", "Що таке Боллівуд?", "Назвіть 4 особливості індійського кіно.", "Чим відомий Сатьяджит Рей?", "Як пов’язані фільм «RRR» та Україна?"]}]}, {"name": "Тема 5. Мистецтво арабо-мусульманського культурного регіону (6 год.)", "lessons": [{"n": "28", "t": "Архітектура арабо-мусульманського культурного регіону", "g": "Дізнатися про основні типи споруд, архітектурні елементи та найвідоміші пам’ятки арабо-мусульманського світу.", "k": "", "terms": [["Мечеть", "мусульманська молитовна споруда."], ["Мінарет", "вежа біля мечеті, з якої скликають на молитву."], ["Міхраб", "ніша в стіні мечеті, що вказує напрямок на Мекку."], ["Мукарнаси", "«сталактитові» склепіння з багатьох дрібних комірок."], ["Медресе", "мусульманський навчальний заклад."], ["Айван", "велика склепінчаста арка-портал, відкрита з одного боку."]], "th": [{"h": "Регіон і його особливості", "p": ["Арабо-мусульманський культурний регіон охоплює Близький Схід, Північну Африку, Іран, Туреччину, Середню Азію; колись до нього належала й Південна Іспанія (Андалусія). Мистецтво регіону поєднало арабські, перські, візантійські, тюркські традиції. У релігійних спорудах зазвичай не зображують людей і тварин, тому провідну роль відіграють орнамент і каліграфія."], "ul": []}, {"h": "Мечеть та її елементи", "p": [], "ul": ["внутрішній двір із фонтаном або басейном для омовіння;", "молитовна зала, часто з багатьма колонами або великим куполом;", "міхраб — прикрашена ніша, звернена до Мекки; мінбар — кафедра;", "мінарети — від одного до шести і більше;", "арки різних форм: підковоподібні, стрілчасті, багатолопатеві;", "мукарнаси, мозаїка, кахлі, різьблення по каменю й гіпсу."]}, {"h": "Шедеври", "p": [], "ul": ["Купол Скелі в Єрусалимі (691 р.) — одна з найдавніших пам’яток ісламської архітектури, восьмикутна будівля з золотим куполом;", "Мечеть-собор у Кордові (Іспанія) — «ліс» колон із червоно-білими смугастими арками;", "Альгамбра в Гранаді (XIII–XIV ст.) — палац із тонким різьбленням стін, Двір левів, мукарнасові склепіння;", "Блакитна мечеть (Султанахмет) у Стамбулі (1609–1616) — шість мінаретів, інтер’єр із тисяч блакитних ізникських кахлів;", "мечеть Сулейманіє в Стамбулі — творіння архітектора Сінана;", "площа Регістан у Самарканді — три медресе, вкриті яскравою мозаїкою;", "Мечеть шейха Заїда в Абу-Дабі (2007) — сучасна біломармурова мечеть."]}, {"h": "Світські споруди та сучасність", "p": ["Окрім мечетей, будували палаци, караван-сараї (заїжджі двори для купців), лазні-хамами, базари, фортеці. Сучасна архітектура регіону відома рекордами: хмарочос Бурдж-Халіфа в Дубаї (828 м) — найвища будівля світу."], "ul": []}, {"h": "Зв’язок з Україною", "p": ["У Криму, в Бахчисараї, зберігся Ханський палац (XVI ст.) — резиденція кримських ханів із мечетями, двориками та знаменитим «Фонтаном сліз». Це пам’ятка культури кримськотатарського народу, корінного народу України."], "ul": []}], "f": "У Двір левів Альгамбри вода надходить через фонтан із 12 мармуровими левами; за легендою, в давнину він працював як годинник — щогодини вода текла з пащі іншого лева.", "pr": ["Намалюйте схему мечеті та підпишіть її основні елементи: купол, мінарет, двір, фонтан, молитовна зала, міхраб.", "Намалюйте три види арок (підковоподібна, стрілчаста, багатолопатева) і знайдіть фото споруди з кожним видом."], "q": ["Чому в релігійному мистецтві регіону переважають орнамент і каліграфія?", "Назвіть основні елементи мечеті.", "Що таке мукарнаси?", "Чим відомі Альгамбра і Блакитна мечеть?", "Яка пам’ятка арабо-мусульманської культури є в Україні?"]}, {"n": "29", "t": "Каліграфія. Арабеска", "g": "Зрозуміти, чому каліграфія стала провідним мистецтвом ісламського світу, розрізняти її стилі та знати, що таке арабеска і геометричний орнамент.", "k": "", "terms": [["Каліграфія", "мистецтво красивого письма."], ["Калам", "очеретяне перо для письма."], ["Куфі", "найдавніший кутастий стиль арабського письма."], ["Арабеска", "складний безперервний орнамент із переплетених рослинних мотивів."], ["Гірих", "геометричний орнамент із зірок і багатокутників."], ["Туґра", "вензель-підпис османського султана."]], "th": [{"h": "Слово як мистецтво", "p": ["Арабське письмо пишуть справа наліво, в алфавіті 28 літер, більшість яких з’єднуються між собою. Оскільки в мечетях не зображують живих істот, найвищим мистецтвом стала каліграфія. Нею прикрашали книги, стіни мечетей і палаців, посуд, тканини, монети. Каліграфи навчалися багато років, а їхні імена шанували не менше, ніж імена художників."], "ul": []}, {"h": "Стилі каліграфії", "p": [], "ul": ["куфі — кутастий, чіткий, «архітектурний»; використовувався в ранніх рукописах і на стінах;", "насх — округлий, легко читається; основа друкованих шрифтів;", "сульс — великий, урочистий, для написів на будівлях;", "дивані — химерно-витончений стиль канцелярії Османської імперії;", "насталік — «висячий», похилий стиль Ірану;", "магрибі — стиль Північної Африки."]}, {"h": "", "p": ["Каліграфи вміли складати з літер цілі картини — зображення птахів, кораблів, левів (каліграми). Туґра — складний вензель султана — ставилася на указах як підпис і печатка."], "ul": []}, {"h": "Арабеска і геометричний орнамент", "p": ["Арабеска — нескінченний орнамент із гілок, листя, квітів, що переплітаються та ростуть одне з одного. У ній немає початку й кінця — це символ нескінченності та гармонії світу.", "Гірих — геометричний орнамент із 6-, 8-, 10-, 12-променевих зірок і багатокутників. Його будують за допомогою циркуля й лінійки, і він демонструє глибокі математичні знання майстрів."], "ul": []}, {"h": "Слово «арабеска» в інших мистецтвах", "p": [], "ul": ["у балеті арабеск — поза, коли танцівник стоїть на одній нозі, а другу витягує назад;", "у музиці — п’єса з вишуканою, «візерунчастою» мелодією (Роберт Шуман, Клод Дебюссі «Дві арабески»)."]}], "f": "Деякі середньовічні візерунки гірих у мечетях Ірану побудовані за принципом, який математики на Заході описали лише у ХХ ст., — так званих «квазікристалічних» мозаїк.", "pr": ["Побудуйте циркулем і лінійкою восьмипроменеву зірку та розвиньте з неї геометричний орнамент (гірих). Розфарбуйте у 2–3 кольори (синій, бірюзовий, золотий).", "Або: намалюйте арабеску в колі чи квадраті — безперервна гілка з листям і квітами, що переплітаються.", "Або: створіть свою «каліграму» — напишіть своє ім’я українською так, щоб літери утворили зображення (птах, риба, квітка)."], "q": ["Чому каліграфія стала провідним мистецтвом ісламського світу?", "Назвіть 4 стилі арабської каліграфії.", "Що таке туґра?", "Чим арабеска відрізняється від гіриху?", "Що означає слово «арабеска» в балеті та музиці?"]}, {"n": "30", "t": "Декоративно-ужиткове мистецтво регіону: килимарство, кераміка, ткацтво. Книжкова мініатюра", "g": "Ознайомитися з перськими килимами, ізникською керамікою, тканинами Сходу та мистецтвом книжкової мініатюри.", "k": "", "terms": [["Ворсовий килим", "килим, виготовлений вузликами, що утворюють ворс."], ["Кілім", "безворсовий, тканий килим."], ["Люстр", "кераміка з металевим відблиском поливи."], ["Мініатюра", "невелике, дуже детальне зображення, що ілюструє рукописну книгу."], ["Орнек", "кримськотатарський орнамент, внесений до спадщини ЮНЕСКО."]], "th": [{"h": "Килимарство", "p": ["Килим на Сході — не лише прикраса: він був підлогою, ліжком, стіною намету, молитовним місцем і показником багатства. Найславетніші — перські килими (міста Тебриз, Ісфахан, Кашан). Ворсовий килим в’яжуть вручну вузликами: у дорогому килимі їх може бути понад мільйон на квадратний метр, а робота триває роки."], "ul": ["візерунки: центральний медальйон, «сад» (символ раю), рослинні та геометричні мотиви;", "молитовні килими з зображенням арки-міхраба;", "Ардебільський килим (1539–1540, зберігається в Лондоні) — один з найдавніших датованих килимів світу;", "кіліми — безворсові килими з геометричним візерунком (Туреччина, Кавказ, Середня Азія)."]}, {"h": "Кераміка", "p": [], "ul": ["Ізник (Туреччина, XVI ст.) — біла кераміка з кобальтово-синіми, бірюзовими та яскраво-червоними квітами (тюльпани, гвоздики); кахлі прикрашають мечеті Стамбула;", "люстрова кераміка з «золотим» металевим блиском (Ірак, Іран, Іспанія);", "кахлі та мозаїка Ірану й Середньої Азії — цілі стіни й куполи вкриті синьо-бірюзовою керамікою."]}, {"h": "Ткацтво та інші ремесла", "p": [], "ul": ["дамаск (від міста Дамаск) — тканина з візерунком, що виблискує;", "муслін (від міста Мосул) — тонка легка бавовняна тканина;", "сюзане — вишиті покривала Середньої Азії (Бухара);", "металеві вироби з інкрустацією, скляні світильники для мечетей;", "кримськотатарський орнамент «орнек» — у 2021 р. внесений до Репрезентативного списку нематеріальної культурної спадщини ЮНЕСКО."]}, {"h": "Книжкова мініатюра", "p": ["Рукописні книги прикрашали мініатюрами — яскравими малюнками з тонкими деталями. Особливості:"], "ul": ["площинність, відсутність лінійної перспективи — те, що далі, зображено вище;", "яскраві мінеральні фарби й золото;", "дрібні деталі одягу, рослин, візерунків;", "поєднання зображення з каліграфічним текстом і орнаментальною рамкою."]}, {"h": "", "p": ["Школи мініатюри: багдадська (аль-Васіті, ілюстрації до «Макам» аль-Харірі, 1237 р.), перська (Кемаледдін Бехзад, Герат, кінець XV — початок XVI ст.; ілюстрації до «Шахнаме» Фірдоусі), османська, могольська (Індія)."], "ul": []}], "f": "Назви тканин «дамаск» і «муслін» походять від міст Дамаск і Мосул, звідки ці тканини потрапили до Європи.", "pr": ["Створіть ескіз килима у східному стилі: центральний медальйон, кутові елементи, бордюр з рослинним орнаментом. Використайте символічні кольори (червоний, синій, золотий).", "Або: намалюйте мініатюру за мотивами східної казки («Тисяча і одна ніч») — площинно, з яскравими кольорами, дрібними візерунками та орнаментальною рамкою з написом."], "q": ["Яку роль відігравав килим у житті людей Сходу?", "Чим відрізняються ворсовий килим і кілім?", "Чим відома кераміка Ізника?", "Назвіть 4 особливості книжкової мініатюри.", "Хто такий Кемаледдін Бехзад?"]}, {"n": "31", "t": "Особливості музичного мистецтва регіону (макам). Музичний інструментарій", "g": "Дізнатися про систему макамів, особливості звучання музики арабо-мусульманського регіону, її інструменти та вплив на європейську музику.", "k": "", "terms": [["Макам", "ладово-мелодична система (і окремий лад) арабської, турецької, азербайджанської та інших традицій."], ["Мікротони", "інтервали, менші за півтон (наприклад, чверть тону)."], ["Таксим", "вільна інструментальна імпровізація, вступ до твору."], ["Мугам", "азербайджанська класична музична традиція (у спадщині ЮНЕСКО)."]], "th": [{"h": "Макам", "p": ["Макам — це і лад, і набір правил розвитку мелодії, і певний настрій. Як індійська рага, макам — основа для імпровізації. Макамів дуже багато (десятки в арабській і турецькій традиціях), і кожен має назву: раст, баяті, хіджаз, сіка тощо.", "Особливість — мікротони: у музиці Сходу є звуки «між» клавішами фортепіано, тому вона звучить незвично для європейського вуха. Мелодія багато прикрашена (мелізми), ритм буває складним. Часто одну мелодію одночасно виконують кілька інструментів, трохи по-різному її прикрашаючи (гетерофонія)."], "ul": []}, {"h": "Споріднені традиції", "p": [], "ul": ["арабський макам;", "перський дастґях;", "турецький макам;", "азербайджанський мугам;", "шашмаком (Узбекистан, Таджикистан)."]}, {"h": "Інструменти", "p": [], "ul": ["уд — лютня без ладів, «цар інструментів»; саме від арабського «аль-уд» походить європейське слово «лютня»;", "канун — щипкова цитра з кількома десятками струн, лежить на колінах;", "най — очеретяна поздовжня флейта з м’яким «дихаючим» звуком;", "саз (баглама) — турецька лютня з довгим грифом;", "кеманча — смичковий інструмент, який тримають вертикально;", "ребаб — смичковий, один з предків скрипки;", "ударні: дарбука (келихоподібний барабан), рік (бубон із тарілочками), деф (велика рамкова бубна);", "зурна — гучний духовий інструмент для свят і вулиці."]}, {"h": "Співаки та вплив на Європу", "p": ["Умм Кульсум (Єгипет) — «Зірка Сходу»; її концерти тривали годинами. Фейруз (Ліван) — одна з найвідоміших арабських співачок.", "Музика Сходу вплинула на європейців: від уда походить лютня, від ребаба — смичкові; військові оркестри яничарів (мехтер) надихнули Моцарта на «Турецький марш» (рондо alla turca), а Римського-Корсакова — на сюїту «Шехеразада»."], "ul": []}], "f": "Європейська лютня, популярна в епоху Відродження, прийшла через Іспанію від арабського уда — навіть назва інструмента походить від арабського «аль-уд» («дерево»).", "pr": ["Прослухайте таксим на уді та «Турецький марш» Моцарта. Порівняйте: інструменти, ритм, мелодію, настрій. Що Моцарт «запозичив» зі Сходу?", "Складіть кросворд (8–10 слів) на тему «Музичні інструменти арабо-мусульманського регіону»."], "q": ["Що таке макам?", "Що таке мікротони і як вони впливають на звучання?", "Назвіть 5 інструментів регіону та їхні групи.", "Яке європейське слово походить від назви «уд»?", "Як музика Сходу вплинула на європейських композиторів?"]}, {"n": "32", "t": "Танцювальне мистецтво арабо-мусульманського культурного регіону", "g": "Ознайомитися з традиційними танцями регіону, їхнім значенням і символікою, а також зі східними мотивами у світовому балеті.", "k": "", "terms": [["Ракс шаркі", "«східний танець» — класичний сольний танець Єгипту (у Європі його називають «танцем живота»)."], ["Дабке", "груповий лінійний танець Леванту з притупуванням."], ["Сема", "обертальний духовний танець дервішів ордену Мевлеві."], ["Танура", "єгипетський обертальний танець у багатошарових кольорових спідницях."]], "th": [{"h": "Загальні риси", "p": ["Танці регіону дуже різні — від святкових народних до духовних. Спільне: зв’язок з музикою макамів і ударними інструментами, увага до пластики рук і корпусу, імпровізаційність, особлива роль свят і весіль."], "ul": []}, {"h": "Основні танці", "p": [], "ul": ["Ракс шаркі (Єгипет) — сольний танець з плавними й різкими рухами стегон, корпусу, рук; виконується під оркестр або дарбуку; уславили його танцівниці Самія Гамаль і Тахія Каріока, які знімались у єгипетському кіно;", "дабке (Ліван, Сирія, Палестина, Йорданія) — учасники тримаються за руки чи плечі й утворюють лінію; ритмічне притупування символізує єдність громади; танцюють на весіллях і святах;", "халіджі (країни Перської затоки) — жіночий танець з граційними рухами голови й волосся та розшитими сукнями;", "тахтіб (Єгипет) — чоловічий танець із палицями, що походить від бойового мистецтва; внесений до спадщини ЮНЕСКО;", "танура (Єгипет) — танцівник обертається довгий час, піднімаючи й розкручуючи кольорові спідниці, що нагадують квіти;", "халай (Туреччина) — коловий танець під барабан і зурну;", "хайтарма — кримськотатарський народний танець."]}, {"h": "Сема — танець дервішів", "p": ["Орден Мевлеві, заснований послідовниками поета-містика Джалаледдіна Румі (XIII ст., місто Конья, Туреччина), створив обряд сема. Дервіші в білих сорочках і високих повстяних шапках обертаються з розкритими руками: права долоня звернена вгору (отримати благословення неба), ліва — донизу (передати його землі). Обертання символізує рух планет навколо Сонця та шлях людини до Бога. Церемонія внесена до списку нематеріальної спадщини ЮНЕСКО."], "ul": []}, {"h": "Східні мотиви у світовому мистецтві", "p": ["«Арабський танець» у балеті П. Чайковського «Лускунчик», балет «Шехеразада» на музику Римського-Корсакова (трупа Дягілєва, костюми Льва Бакста), поза «арабеск» у класичному балеті — приклади того, як європейська хореографія надихалася Сходом."], "ul": []}], "f": "Дервіші під час сема можуть обертатися понад пів години поспіль і не втрачати рівноваги — вони фіксують погляд на власній руці.", "pr": ["Перегляньте фрагменти двох танців (наприклад, сема і дабке) та порівняйте їх за планом: хто виконує, костюм, музика й інструменти, рухи, символіка, призначення (свято, обряд, сцена).", "Намалюйте ескіз костюма для одного з танців регіону (танура, халіджі, дабке, сема), враховуючи його символіку."], "q": ["Які спільні риси мають танці арабо-мусульманського регіону?", "Що таке дабке і що він символізує?", "Що означають рухи рук у сема?", "Чим особливий танець танура?", "Де в європейському балеті звучать східні мотиви?"]}, {"n": "33", "t": "Урок узагальнення знань. Підсумковий урок за рік", "g": "Систематизувати знання про мистецтво арабо-мусульманського регіону та всіх культурних регіонів, вивчених протягом року.", "k": "", "terms": [], "th": [{"h": "Арабо-мусульманський регіон: повторюємо", "p": [], "ul": ["Архітектура: мечеть (купол, мінарет, міхраб), мукарнаси, арки; Купол Скелі, Альгамбра, Блакитна мечеть, Регістан, Бахчисарайський Ханський палац.", "Каліграфія: куфі, насх, сульс, дивані, насталік; туґра; арабеска і гірих.", "Декоративне мистецтво: перські килими, кілім, ізникська кераміка, дамаск, муслін, орнек.", "Мініатюра: аль-Васіті, Бехзад, «Шахнаме».", "Музика: макам, мікротони, уд, канун, най, дарбука; Умм Кульсум.", "Танці: ракс шаркі, дабке, танура, сема."]}, {"h": "Мистецтво світу за рік: порівнюємо регіони", "p": [], "ul": ["Африка — маски, скульптура, поліритмія, вплив на модернізм;", "Америка — доколумбові піраміди, хмарочоси, джаз, Голлівуд, поп-арт, карнавал;", "Далекий Схід — дерев’яні храми, живопис тушшю, порцеляна, сади, чайна церемонія;", "Індія — синтез архітектури і скульптури, рага, мудри, Боллівуд;", "Арабо-мусульманський світ — орнамент і каліграфія, килими, мініатюра, макам."]}], "f": "", "pr": ["Тест: 1) Ніша в мечеті, що вказує на Мекку, — … 2) Найдавніший кутастий стиль письма — … 3) Геометричний орнамент із зірок — … 4) Місто-центр кераміки в Туреччині — … 5) Ладова система арабської музики — … 6) Від якого інструмента походить лютня? 7) Танець дервішів — … 8) Палац у Гранаді — … 9) Автор перських мініатюр XV–XVI ст. — … 10) Кримськотатарський орнамент у списку ЮНЕСКО — …", "Підсумковий проєкт (на вибір): а) «Мистецька карта світу» — контурна карта з позначеними пам’ятками й символами кожного регіону; б) віртуальна екскурсія (презентація) «Мої 10 улюблених шедеврів року»; в) орнамент-«діалог культур», що поєднує мотиви різних регіонів; г) есе «Що об’єднує мистецтво різних народів?»."], "q": ["Яке мистецтво якого регіону вас найбільше вразило за рік і чому?", "Які спільні риси ви помітили в мистецтві різних регіонів?", "Як мистецтво різних культур впливало одне на одного? Наведіть 3 приклади.", "Чому важливо знати й поважати мистецтво інших народів?"]}]}]}, {"id": "zu", "name": "Захист України", "short": "Захист України 10", "themes": [{"name": "Тренінг 1. Основи національної безпеки та оборони України", "lessons": [{"n": "1–2", "t": "Взаємодія між громадянами / громадянками і державою у захисті країни", "g": "Зрозуміти, чому оборона країни починається з довіри, співпраці та відповідальності кожного громадянина й громадянки, і як розподіл благ у суспільстві впливає на згуртованість держави.", "k": "", "terms": [["Держава", "політична організація суспільства на певній території з публічною владою, законами та бюджетом."], ["Суспільне (спільне) благо", "те, що корисне всім: безпека, дороги, освіта, медицина; воно створюється спільними внесками громадян."], ["Довіра", "впевненість, що інші люди й держава діятимуть чесно та в спільних інтересах."], ["Громадський контроль", "право й можливість громадян перевіряти, як держава використовує ресурси."], ["Середній клас", "люди зі стабільним доходом і доступом до освіти, роботи, базової фінансової безпеки."]], "th": [{"h": "Про предмет «Захист України»", "p": ["Протягом двох років ви опануєте знання й навички, потрібні громадянину та громадянці країни, що захищається від збройної агресії: основи національної безпеки, будову війська, орієнтування на місцевості, домедичну допомогу, правила безпечного поводження зі зброєю тощо. Головна ідея курсу: оборона — справа не лише армії, а всього суспільства."], "ul": []}, {"h": "Гра «Дві держави»: чого вона вчить", "p": ["На уроці ви грали ролі громадян двох держав — «Трикутник» і «Коло». Обидві держави мали однаковий загальний бюджет і однакові умови від «Світового ринку». Відрізнявся лише розподіл «успіхів» між людьми:"], "ul": ["у «Трикутнику» більшість громадян мала 1–2 «успіхи», а кілька людей — дуже багато (суспільство олігархів і бідних);", "у «Колі» переважав середній клас — «успіхи» були розподілені рівномірніше.", "Щоб держава зростала, громадяни мали добровільно вкладати свої «успіхи» в державну скарбницю. Коли люди не довіряли одне одному й державі, кожен грав «на себе» — і програвали всі."]}, {"h": "Головні висновки", "p": [], "ul": ["Довіру, співпрацю й домовленості легше будувати там, де якомога менше людей почувається погано — економічно, психологічно, морально, правово.", "Держава, що дбає лише про інтереси окремих людей «коштом системи», стає слабшою.", "Розбудова довіри — складний процес: потрібно відкриватися, переконувати, ризикувати й бути чесним.", "Корупція, обман і нерівність руйнують систему довіри, а прозорість і громадський контроль її зміцнюють.", "Кожен громадянин і кожна громадянка своїми рішеннями впливає на силу держави."]}, {"h": "Громадяни і держава у захисті країни", "p": ["Держава забезпечує безпеку, охорону прав, захист кордонів. Громадяни сплачують податки, виконують закони, долучаються до волонтерства, служать у війську, беруть участь у громадському житті й контролюють владу. Коли ці дві сторони довіряють одна одній, країна стає стійкою навіть у найскладніші часи."], "ul": []}], "f": "Дослідження показують: у країнах з вищим рівнем довіри між людьми економіка зростає швидше, а корупції менше, бо на перевірки й «страховки» від обману витрачається менше ресурсів.", "pr": ["Пригадайте хід гри «Дві держави» та дайте письмові відповіді: яку стратегію обрали ви й чому? Що допомогло або завадило вашій державі?", "Наведіть 3 приклади з реального життя (школа, громада, країна), коли спільні внески людей створили благо для всіх.", "Складіть «правила довіри» для вашого класу (5–7 пунктів)."], "q": ["Чим відрізнялися держави «Трикутник» і «Коло»?", "Чому в державі з середнім класом легше досягти спільної мети?", "Які дії громадян і держави руйнують довіру?", "Що таке громадський контроль і навіщо він потрібен?", "Як особисто ви можете зміцнювати довіру в громаді?"]}, {"n": "3", "t": "Конституційний обов’язок. Військовий обов’язок", "g": "Зрозуміти, що таке військовий обов’язок, ознайомитися з різними моделями військової служби у світі та сформувати власну обґрунтовану думку про оптимальну модель для України.", "k": "", "terms": [["Конституційний обов’язок", "обов’язок, закріплений у Конституції. Стаття 65 Конституції України: захист Вітчизни, незалежності та територіальної цілісності України, шанування її державних символів є обов’язком громадян України."], ["Військовий обов’язок", "встановлений законом обов’язок громадян щодо підготовки до служби, взяття на військовий облік, проходження служби та перебування в запасі."], ["Призов", "обов’язкове залучення громадян до військової служби."], ["Контрактна служба", "добровільна служба на підставі контракту."], ["Альтернативна (цивільна) служба", "служба замість військової для тих, кому переконання не дозволяють брати до рук зброю."], ["Резерв (запас)", "громадяни, які пройшли підготовку і можуть бути швидко мобілізовані."]], "th": [{"h": "Навіщо потрібен військовий обов’язок", "p": ["Військовий обов’язок забезпечує державі можливість мати навчене військо й резерв. Водночас він виховує відповідальність, єдність і готовність суспільства до захисту. Питання, як справедливо розподілити тягар оборони, — одне з найскладніших для кожної країни."], "ul": []}, {"h": "Моделі військової служби у світі", "p": [], "ul": ["Ізраїль — універсальна служба для чоловіків і жінок з 18 років (чоловіки — близько 32 міс., жінки — 24 міс.); служба — частина національної ідентичності.", "Швеція і Норвегія — вибірковий призов для обох статей: усі проходять відбір (медичні та психологічні тести), а служать найпридатніші й найвмотивованіші (9–12 міс.).", "Швейцарія — обов’язкова служба для чоловіків із трьома варіантами: військова, цивільна або податок на оборону; короткі курси щороку.", "Естонія — обов’язковий призов для чоловіків (8 або 11 міс.) і великий навчений резерв для територіальної оборони.", "Австрія — вибір між військовою (6 міс.) і цивільною (9 міс.) службою.", "Сінгапур — «Національна служба» для всіх чоловіків (24 міс.) у війську, поліції чи цивільній обороні, потім — резерв до 40 років.", "Туреччина — служба для чоловіків, але можна легально «відкупитися» фіксованим внеском.", "Єгипет — тривалість служби залежить від рівня освіти (18–36 міс.).", "Південна Корея — одна з найдовших служб (18–21 міс.) через тривалий конфлікт з КНДР.", "Північна Корея — служба для чоловіків і жінок тривалістю багато років; частина ідеологічного контролю режиму."]}, {"h": "Компроміси кожної моделі", "p": ["Не існує єдиної «правильної» моделі. Кожна країна обирає систему з огляду на свою історію, загрози, економіку й культуру. Тривала служба зменшує економічну активність молоді; обов’язковість для всіх обмежує особисту свободу; можливість «відкупу» порушує рівність; вибірковий призов залежить від мотивації людей. Для країни, що протистоїть агресору, особливо важливо мати великий і добре навчений резерв."], "ul": []}], "f": "Після повномасштабного вторгнення росії Швеція та Фінляндія відмовилися від багаторічного нейтралітету й вступили до НАТО, а кілька європейських країн почали обговорювати або повертати обов’язковий призов.", "pr": ["Уявіть, що ви працюєте в Міністерстві оборони. Запропонуйте модель військової служби для України після війни: призовний вік, тривалість, чи обов’язкова служба для жінок, чи є альтернативна служба. Поясніть свій вибір.", "Оберіть одну країну з уроку і складіть її «картку»: служба для жінок, призовний вік, термін, вид служби, переваги й недоліки для України."], "q": ["Що каже стаття 65 Конституції України?", "Чим призов відрізняється від контрактної служби?", "Що таке вибірковий призов? Наведіть приклад країни.", "Які переваги й недоліки має модель Швейцарії?", "Чому для України важливо мати великий навчений резерв?"]}, {"n": "4", "t": "Територіальна цілісність держави. Національний спротив", "g": "Розуміти поняття «територіальна цілісність» і «національний спротив», знати складники національного спротиву та відрізняти легітимний спротив від деструктивної поведінки.", "k": "", "terms": [["Територіальна цілісність", "неподільність і недоторканність території держави в межах її кордонів."], ["Національний спротив", "комплекс заходів для захисту держави за участю військових і цивільних, визначений Законом України «Про основи національного спротиву» (2021)."], ["Територіальна оборона (ТрО)", "система заходів для захисту території на місцевому рівні; включає Сили ТрО ЗСУ та добровольчі формування територіальних громад (ДФТГ)."], ["Рух опору", "воєнні, інформаційні та спеціальні заходи для відновлення суверенітету на тимчасово окупованих територіях."], ["Вандалізм", "навмисне пошкодження чужого майна; не є формою легітимного спротиву."]], "th": [{"h": "Правова основа", "p": [], "ul": ["Конституція України, ст. 2: «Суверенітет України поширюється на всю її територію. Україна є унітарною державою. Територія України в межах існуючого кордону є цілісною і недоторканною».", "Статут ООН (ст. 2, п. 4): держави не повинні застосовувати силу чи погрозу силою проти територіальної цілісності інших держав.", "Закон України «Про основи національного спротиву» № 1702-IX від 16.07.2021 визначає засади територіальної оборони, руху опору та підготовки громадян до національного спротиву."]}, {"h": "Три складники національного спротиву", "p": [], "ul": ["Територіальна оборона — підрозділи ТрО в кожній області й районі, навчання з тактичної медицини, поводження зі зброєю, виживання; добровільна участь цивільних (ДФТГ).", "Рух опору — діяльність на окупованих територіях: протести (Херсон, Мелітополь), рух «Жовта стрічка», саботаж, інформаційний спротив.", "Підготовка громадян до національного спротиву — зокрема предмет «Захист України» у школі, центри підготовки, волонтерські ініціативи."]}, {"h": "Форми спротиву", "p": [], "ul": ["збройний (партизанський рух, тотальна оборона);", "ненасильницький громадянський (протести, символіка, листівки);", "інформаційний (правдиві історії, контрнаративи, гумор);", "економічний (відмова співпрацювати з окупантами, збір допомоги своїм)."]}, {"h": "Історичні та сучасні приклади", "p": [], "ul": ["Холодноярська республіка (1919–1922) — селяни Холодного Яру створили збройні загони й захищали свою територію від більшовиків.", "Кенгірське повстання (1954) — політв’язні табору Степлаг (переважно українці) понад 40 днів без зброї боролися за людські умови.", "Кримськотатарський спротив після 2014 року — протести, правозахисні ініціативи, звернення до міжнародних організацій.", "Рух «Жовта стрічка» (з 2022 р.) — жителі окупованих територій вивішують стрічки й українську символіку.", "Зимова війна Фінляндії (1939–1940) — «тотальна оборона», коли кожен громадянин мав свою роль.", "Ізраїль — підготовка молоді до служби (табори Gadna, курси Mechina)."]}, {"h": "Спротив чи вандалізм?", "p": ["Легітимний спротив спрямований на захист держави й громади та не шкодить своїм. Наприклад, вивісити український прапор в окупованому місті чи зібрати медикаменти для ЗСУ — це спротив. А зіпсувати приватний білборд чи шкільну стіну — вандалізм, навіть якщо мотив патріотичний. Уміння розрізняти ці дії — ознака критичного мислення."], "ul": []}], "f": "Під час Зимової війни невелика Фінляндія змогла зупинити значно сильнішого агресора завдяки єдності суспільства, і її досвід «тотальної оборони» сьогодні вивчають в Україні.", "pr": ["Визначте, спротив це чи ні, і поясніть: а) волонтери зібрали медикаменти для ЗСУ через Telegram-канал; б) група людей розмалювала фарбою білборд проросійського бренду; в) школярка записала подкаст про життя в прифронтовому місті; г) водій відмовився перевозити вантаж для окупантів.", "Оберіть завдання: напишіть щоденниковий запис від імені героя чи героїні спротиву АБО створіть інфографіку «Як працює ТрО / ДФТГ» АБО запитайте рідних, чи були в історії вашої родини приклади боротьби за Україну."], "q": ["Що означає територіальна цілісність? Яка стаття Конституції її закріплює?", "Назвіть три складники національного спротиву.", "Які форми спротиву ви знаєте?", "Чим легітимний спротив відрізняється від вандалізму?", "Чого вчать приклади Холодного Яру та Зимової війни?"]}, {"n": "5", "t": "Сектор безпеки та оборони України", "g": "Знати, які органи входять до сектору безпеки та оборони України і за що вони відповідають, розуміти, як формується й використовується оборонний бюджет і чому життя воїна безцінне.", "k": "", "terms": [["Сектор безпеки та оборони", "система державних органів, Збройних Сил, інших формувань і громадян, що захищають національну безпеку (Закон України «Про національну безпеку України»)."], ["Оборонний бюджет", "кошти держави на потреби оборони: забезпечення військових, озброєння, підготовку тощо."], ["Оборонно-промисловий комплекс (ОПК)", "підприємства, які розробляють і виробляють зброю та техніку."]], "th": [{"h": "«Будинок оборони»", "p": ["Сектор безпеки та оборони можна уявити як будинок. Дах — Україна (державність, територія, народ). Колони — сили безпеки й оборони. Майстерня поруч — оборонно-промисловий комплекс. Фундамент — громадяни: податки, добровольці, волонтери, резерв. Якщо вибити одну колону, будинок завалиться — тому всі складники мають працювати разом."], "ul": []}, {"h": "Складники сектору («колони»)", "p": [], "ul": ["Збройні Сили України (ЗСУ) — захист суверенітету й територіальної цілісності, ведення бойових дій, захист неба;", "Національна гвардія (НГУ) — охорона стратегічних об’єктів, боротьба з диверсійними групами;", "Служба безпеки України (СБУ) — контррозвідка, боротьба з тероризмом, кіберзахист;", "Державна прикордонна служба (ДПСУ) — охорона кордону;", "Державна служба з надзвичайних ситуацій (ДСНС) — рятувальні операції, гасіння пожеж;", "Національна поліція — громадська безпека, розслідування злочинів;", "Державна міграційна служба, Служба судової охорони, Управління державної охорони (охорона вищих посадових осіб);", "Держспецзв’язку — захист інформації та державних комунікацій;", "Державна спеціальна служба транспорту, Антитерористичний центр при СБУ, розвідувальні органи України."]}, {"h": "Оборонний бюджет", "p": ["Після 2014 року, а особливо після 2022-го, витрати України на оборону різко зросли. Проте бюджет росії значно більший, тому Україна не може перемагати «кількістю» — її сила в розумному використанні ресурсів, технологіях і професіоналізмі людей. Гроші оборонного бюджету йдуть на:"], "ul": ["грошове забезпечення та компенсації військовим і їхнім родинам;", "озброєння, техніку, дрони;", "підготовку військових — інвестицію, що зберігає життя."]}, {"h": "Людина — головна цінність", "p": ["Танк можна виготовити заново за рік чи два, а людину замінити неможливо. Саме людина оцінює ситуацію, ухвалює рішення під тиском, керує технікою. Дрон може бути дешевшим і мобільнішим за танк, але без оператора не працює ні дрон, ні танк. Тому ефективне лідерство й добра підготовка, які зберігають життя, — найкраща інвестиція."], "ul": []}], "f": "Україна стала одним зі світових лідерів у виробництві та застосуванні безпілотників — значна частина їх створюється завдяки волонтерам і приватним компаніям.", "pr": ["Намалюйте схему «Будинок оборони» і розмістіть на ній: охорона кордону, контррозвідка, рятування під час пожеж, захист інформації, виробництво дронів, добровольці, податки, захист неба від ракет.", "Уявіть, що маєте умовні 100 млн грн. Розподіліть їх між: зарплатами й компенсаціями, дронами й технікою, підготовкою військових. Поясніть свій вибір.", "Створіть коротку презентацію або інфографіку про один орган сектору безпеки й оборони."], "q": ["Які органи входять до сектору безпеки та оборони України?", "За що відповідають ДПСУ, СБУ, ДСНС?", "Що є «фундаментом» сектору оборони?", "На що витрачається оборонний бюджет?", "Чому кажуть, що життя воїна безцінне?"]}, {"n": "6", "t": "Роль НАТО. Стратегічні партнери України у сфері безпеки. Коаліція демократичних держав у протистоянні авторитаризму", "g": "Розуміти відмінності між демократією та авторитаризмом, знати, що таке НАТО, як працює колективна оборона і хто є стратегічними партнерами України.", "k": "", "terms": [["Демократія", "політичний режим, де влада обирається народом, діють вільні вибори, свобода слова, незалежний суд."], ["Авторитаризм", "режим, де влада зосереджена в руках однієї особи чи групи, а права й свободи обмежені."], ["НАТО", "Організація Північноатлантичного договору — військово-політичний союз, створений 1949 року."], ["Колективна оборона (стаття 5)", "принцип: напад на одну країну-члена вважається нападом на всіх."]], "th": [{"h": "Демократії та авторитарні режими", "p": ["Україну підтримує переважно коаліція демократичних держав: США, Велика Британія, Польща, Німеччина, Литва, Канада, Франція та інші. Росію підтримують авторитарні режими — Іран, КНДР, частково Китай. Лінія розлому у війні збігається з протистоянням «демократія — авторитаризм»: демократії захищають право народів самостійно обирати свій шлях."], "ul": []}, {"h": "Що таке НАТО", "p": [], "ul": ["створене 1949 року для захисту демократичних країн від зовнішніх загроз;", "більшість членів — демократії, хоча є винятки й складні випадки (наприклад, Туреччина);", "стаття 5 — принцип колективної оборони. Вона не зобов’язує автоматично вступати у війну, але кожен член має допомогти так, як вважає за потрібне; шанси на допомогу значно зростають;", "країна-член зберігає суверенітет і незалежність, але отримує гарантії безпеки."]}, {"h": "Україна і НАТО", "p": ["Україна поки не є членом Альянсу, але має статус особливого партнера й отримує значну підтримку: навчання військових, передача зброї, обмін розвідданими, підготовка пілотів, фінансова допомога. Членство в НАТО є стратегічною метою України, закріпленою в Конституції."], "ul": []}, {"h": "Чому демократія — перевага", "p": ["Існує міф, що авторитарні режими ухвалюють рішення швидше й тому сильніші. Насправді демократії мають важливі переваги: відкриту критику помилок, вільний обмін ідеями, довіру суспільства, надійних союзників. Для України збереження демократії — умова підтримки партнерів і майбутнього в європейській спільноті."], "ul": []}], "f": "Єдиний раз в історії стаття 5 НАТО була застосована після терористичних атак на США 11 вересня 2001 року.", "pr": ["Розподіліть країни на дві колонки «Демократії» та «Авторитарні режими»: США, Польща, Велика Британія, Німеччина, Литва, Канада, Туреччина, Франція, РФ, Китай, Іран, КНДР. Позначте, хто підтримує Україну.", "Напишіть 5–7 речень на тему «Чому НАТО важливе для України»."], "q": ["Чим демократія відрізняється від авторитаризму?", "Коли і навіщо створено НАТО?", "Що означає стаття 5? Чи зобов’язує вона вступати у війну?", "Як партнери допомагають Україні?", "Чи втрачає країна незалежність, вступаючи до НАТО?"]}, {"n": "7", "t": "Волонтерський рух як складник підвищення спроможності Сил оборони. Способи реалізувати свій талант в обороні України", "g": "Ознайомитися з найвпливовішими громадськими ініціативами, що зміцнюють обороноздатність України, зрозуміти, що кожна з них починалася з малого, і подумати, як можете долучитися ви.", "k": "", "terms": [["Волонтерство", "добровільна безоплатна діяльність на користь інших людей чи суспільства."], ["Громадянське суспільство", "активні громадяни та їхні об’єднання, що діють незалежно від держави задля спільного блага."], ["Низова ініціатива", "проєкт, створений звичайними людьми «знизу», а не державою."]], "th": [{"h": "Волонтери — частина оборони", "p": ["З 2014 року, а особливо після 2022-го, волонтерський рух став одним із «фундаментів» оборони України. Волонтери забезпечують військових спорядженням, дронами, автомобілями, ліками, навчають, підтримують родини й ветеранів, допомагають переселенцям."], "ul": []}, {"h": "Великі справи починаються з малого", "p": [], "ul": ["Фонд «Повернись живим» почався з одного допису засновника у фейсбуці 2014 року — нині це один з найбільших фондів підтримки армії.", "Victory Drones виросли з невеликої школи пілотування дронів у Києво-Могилянській академії.", "Багато місцевих ініціатив: плетіння маскувальних сіток, виготовлення окопних свічок, збори на конкретні підрозділи."]}, {"h": "Що об’єднує успішні ініціативи", "p": [], "ul": ["їх почали «звичайні» люди з малих кроків;", "віра в ідею та важливість своєї справи;", "розуміння довгострокового впливу — «гра в довгу»;", "уміння залучати інших і будувати команду;", "прозорість і звітність перед донорами."]}, {"h": "Як реалізувати свій талант", "p": ["Кожен може знайти свою роль: програмісти — створювати корисні застосунки, дизайнери — інформаційні кампанії, спортсмени — благодійні забіги, майстри — виготовляти потрібні речі, блогери — поширювати правдиву інформацію. Важливо допомагати безпечно: перевіряти фонди й збори, не поширювати чутливу інформацію про військових."], "ul": []}], "f": "Українські волонтерські фонди щороку збирають мільярди гривень на потреби армії — значна частина внесків складається з невеликих донатів звичайних людей.", "pr": ["Знайдіть інформацію про одну волонтерську ініціативу (всеукраїнську чи у вашій громаді) і опишіть: хто і як її започаткував, з чого почали, чого досягли зараз.", "Складіть план власної маленької ініціативи на підтримку оборони: що, для кого, хто допоможе, які перші три кроки."], "q": ["Яку роль відіграють волонтери в обороні України?", "З чого починався фонд «Повернись живим»?", "Які спільні риси мають успішні громадські ініціативи?", "Як перевірити, що збір коштів надійний?", "Як ви можете застосувати свої таланти для підтримки оборони?"]}, {"n": "8", "t": "Адаптація суспільства до потреб військовослужбовців і ветеранів війни, зокрема осіб з інвалідністю внаслідок війни", "g": "Пояснити, що таке адаптація ветеранів і чому вона потрібна всьому суспільству, навчитися використовувати «Мову єдності» та усвідомити власну роль у підтримці захисників і захисниць.", "k": "", "terms": [["Ветеран / ветеранка війни", "людина, яка захищала Україну під час війни."], ["Адаптація", "процес повернення до цивільного життя: медичний, психологічний, соціальний; двосторонній — змінюється і людина, і суспільство."], ["Стигматизація", "навішування образливих «ярликів» на людину чи групу."], ["«Мова єдності»", "принципи спілкування між цивільними та військовими, що допомагають уникати упереджень."], ["Інклюзія", "створення умов, за яких кожна людина може брати повноцінну участь у житті суспільства."]], "th": [{"h": "Чому потрібна адаптація", "p": ["Повертаючись зі служби, військові стикаються з новими викликами: наслідки поранень, потреба в реабілітації, пошук роботи, відновлення стосунків. Адаптація — справа не лише держави, а й громади, школи та кожного з нас. Ветерани не потребують жалю — вони потребують рівних можливостей."], "ul": []}, {"h": "Принципи «Мови єдності»", "p": [], "ul": ["Спільність: цивільні та військові — дві частини одного суспільства.", "Різниця досвідів: військові мають особливий досвід, до якого варто ставитися з повагою, але вони не «особливі люди».", "Повага й емпатія замість жалю: говоріть з людиною як з рівною, а не як із «жертвою».", "Екологічна комунікація: уникайте фраз, що знецінюють досвід — «Я тебе розумію», «Коли перемога?», «Мені тебе шкода».", "Протидія стереотипам: ветерани — не «надлюди» і не «небезпечні контужені»."]}, {"h": "Слова мають значення", "p": [], "ul": ["кажіть «ветеран / ветеранка», а не «жертва війни»;", "«людина з інвалідністю», а не «інвалід»;", "не визначайте людину однією рисою;", "слова можуть бути таким самим бар’єром, як сходи без пандуса."]}, {"h": "Що може зробити кожен", "p": [], "ul": ["щиро дякувати захисникам і захисницям;", "поважати особистий простір і не ставити некоректних запитань;", "звертати увагу на доступність громади (пандуси, ліфти, зручна навігація);", "підтримувати ветеранський бізнес і спорт;", "вшановувати пам’ять полеглих."]}], "f": "«Ігри Нескорених» (Invictus Games) — міжнародні змагання для військових і ветеранів із пораненнями; українська збірна бере в них участь з 2017 року, а в Україні проводять Національні Ігри Нескорених.", "pr": ["Обговоріть ситуацію й запропонуйте рішення: до школи на роботу прийшов ветеран із протезом, а частина батьків проти. Як має діяти адміністрація? Використайте принципи «Мови єдності».", "Створіть інфографіку «5 правил Мови єдності у спілкуванні з ветеранами».", "Перевірте, наскільки доступні для людей з інвалідністю магазин, пошта чи лікарня у вашій громаді. Запишіть спостереження."], "q": ["Що таке адаптація ветеранів? Чому вона двостороння?", "Назвіть принципи «Мови єдності».", "Яких фраз варто уникати в розмові з ветераном?", "Чим небезпечна стигматизація?", "Що особисто ви можете зробити, щоб ваша громада була дружньою до ветеранів?"]}]}, {"name": "Тренінг 2. Основи управління та планування: склад і структура Сил оборони, звання, знаки розрізнення", "lessons": [{"n": "1", "t": "Домени — простори ведення бойових дій", "g": "Знати п’ять доменів ведення бойових дій, їхні особливості та розуміти, як домени пов’язані з видами Збройних Сил України.", "k": "", "terms": [["Домен", "узагальнений простір (середовище), де ведуться бойові дії, зі своїми умовами, засобами й тактиками."], ["Вид збройних сил", "складник збройних сил, призначений переважно для ведення бойових дій у певному домені."], ["НРК", "наземний роботизований комплекс."], ["БпЛА", "безпілотний літальний апарат."]], "th": [{"h": "П’ять доменів", "p": [], "ul": ["Суша — найдавніший домен. Бої за території, ресурси, населення. Ключові — піхота, танки, артилерія, інженери. Перспектива, яку успішно розвиває Україна, — наземні роботизовані комплекси.", "Море — з перших морських битв 3–5 тис. років тому. Боротьба за морські шляхи, порти, узбережжя. Кораблі: катери, корвети, фрегати, есмінці, підводні човни, авіаносці. Україна — лідер у застосуванні морських безпілотників.", "Повітря — вперше стало доменом у Першій світовій війні (1914–1918). Боротьба за панування в повітрі: літаки, гелікоптери, а нині — БпЛА.", "Космос — з ХХ ст. Прямих боїв у космосі не було; міжнародне право забороняє розміщувати там ядерну зброю та військові бази. Головне — супутники для зв’язку, навігації, розвідки.", "Кіберпростір — з кінця ХХ — початку ХХІ ст. Невидимий домен без чітких меж: сервери, мережі, кабелі, комп’ютери. Зброя — хакерські атаки та шкідливі програми."]}, {"h": "Домени перетинаються", "p": ["Удар з повітря знищує наземні цілі; кібератака може знеструмити критичний об’єкт і спричинити жертви; супутники допомагають наводити зброю на суші та морі. Сучасна війна — це взаємодія всіх доменів одночасно."], "ul": []}, {"h": "Види Збройних Сил України", "p": ["Традиційно армії будують за трьома доменами. ЗСУ складаються з трьох видів:"], "ul": ["Сухопутні війська (суша);", "Повітряні Сили (повітря);", "Військово-Морські Сили (море)."]}, {"h": "", "p": ["Сучасні армії світу додають структури для космосу й кіберпростору (наприклад, Космічні сили США)."], "ul": []}], "f": "Україна першою у світі масштабно застосувала морські дрони проти військового флоту — це змусило ворога відвести значну частину кораблів із західної частини Чорного моря.", "pr": ["Заповніть таблицю «Домен — з якого часу — основні засоби — чого можна досягти».", "Придумайте (опишіть словами) емблеми для Космічних сил і Кіберсил у стилі емблем ЗСУ: які кольори й символи ви б використали?"], "q": ["Що таке домен ведення бойових дій?", "Назвіть п’ять доменів і їхні ключові засоби.", "Коли повітря стало доменом війни?", "Чим кіберпростір відрізняється від інших доменів?", "З яких трьох видів складаються ЗСУ?"]}, {"n": "2", "t": "Окремі роди військ (сил) — важлива і специфічна складова", "g": "Розрізняти види збройних сил і роди військ, знати окремі роди військ (сил) ЗСУ та розуміти роль логістики й підтримки в бою.", "k": "", "terms": [["Рід військ (сил)", "спеціалізований складник збройних сил зі своїми завданнями, озброєнням і способами дій."], ["Окремий рід військ (сил)", "рід, що не входить до жодного виду ЗСУ і підпорядковується напряму."], ["Логістика", "забезпечення військ усім необхідним: їжею, пальним, боєприпасами, ліками, ремонтом."], ["РЕБ", "радіоелектронна боротьба — зокрема захист від дронів."]], "th": [{"h": "Аналогія з університетом", "p": ["Збройні сили — це університет, вид збройних сил — факультет, рід військ — кафедра. Роди можуть входити до видів або бути окремими."], "ul": []}, {"h": "Окремі роди військ (сил) ЗСУ", "p": [], "ul": ["Сили спеціальних операцій (ССО) — елітні оператори: глибока розвідка й диверсії в тилу ворога, протидія тероризму, підтримка руху опору;", "Сили безпілотних систем (СБС) — новітній рід, «армія дронів»;", "Сили територіальної оборони (ТрО) — комплектуються за регіональним принципом, захищають свою громаду й регіон;", "Сили логістики — зберігання та доставка всього необхідного, ремонт техніки;", "Сили підтримки — інженери, сапери, фахівці РЕР і РЕБ, РХБЗ, топографи, метеорологи, кінологи;", "Медичні сили — від допомоги на полі бою до лікування у шпиталях;", "Десантно-штурмові війська (ДШВ) — наймобільніший рід, штурми й десанти;", "Війська зв’язку та кібербезпеки — щоб накази й доповіді вчасно й таємно доходили до адресата."]}, {"h": "Чому танк не воюватиме без логістики та підтримки", "p": [], "ul": ["екіпаж голодний і без води — не підвезли харчування;", "немає бронежилетів і форми — не доставили екіпірування;", "танк не заводиться — немає пального;", "не може стріляти — немає боєприпасів;", "його легко знищить артилерія — не вирито укриття і не замасковано;", "стане мішенню дронів — не прикриває РЕБ;", "може підірватися на міні — ніхто не розмінував шлях."]}, {"h": "Висновок", "p": ["Про логістів, інженерів і зв’язківців рідко знімають фільми, але без них жоден бойовий підрозділ не виконає завдання. У сучасній війні логістика ще й небезпечна: ворожі дрони полюють на транспорт постачання."], "ul": []}], "f": "Військові часто кажуть: «Аматори говорять про тактику, професіонали — про логістику».", "pr": ["Складіть схему «Структура ЗСУ»: 3 види + окремі роди військ (сил) з коротким описом завдань кожного.", "Пригадайте гру «Ланцюжок постачання». Напишіть: чому логістика важлива і які в неї ризики в умовах сучасної війни?"], "q": ["Чим вид збройних сил відрізняється від роду військ?", "Назвіть окремі роди військ (сил) ЗСУ.", "Які завдання виконують Сили підтримки?", "Чому ТрО комплектують за регіональним принципом?", "Наведіть 4 причини, чому танк не воюватиме без логістики й підтримки."]}, {"n": "3", "t": "Як не заплутатись у всіх цих видах і родах? Нарукавні знаки. Органи управління. Звання вищого офіцерського складу", "g": "Розпізнавати нарукавні знаки видів та окремих родів ЗСУ, знати, що таке органи військового управління, з’єднання, частини й підрозділи, та впізнавати звання вищого офіцерського складу.", "k": "", "terms": [["Нарукавний знак", "офіційна назва емблеми на рукаві (неофіційно — «шеврон» чи «патч», але «шеврон» — неточний термін)."], ["Органи військового управління", "штаби й командування (Генштаб ЗСУ, командування видів і родів), що керують боєм."], ["З’єднання", "велике формування з кількох військових частин (наприклад, корпус)."], ["Військова частина", "формування зі своїм командиром, номером (в/ч А1234), печаткою, бойовим прапором."], ["Підрозділ", "складник військової частини (батальйон, рота, взвод)."]], "th": [{"h": "Нарукавні знаки видів ЗСУ", "p": [], "ul": ["Сухопутні війська — зелений щит вістрям донизу (суша — внизу);", "Повітряні Сили — синій щит вістрям догори (небо — вгорі);", "Військово-Морські Сили — з якорем."]}, {"h": "Нарукавні знаки окремих родів", "p": [], "ul": ["ДШВ — щит у формі парашута, маруновий колір;", "Війська зв’язку та кібербезпеки — чорний тризуб, схожий на антену;", "ССО — щит у формі діаманта і двозуб Святослава Хороброго;", "ТрО — вгорі мур фортечної стіни (захист своєї «фортеці» — громади)."]}, {"h": "Хто всім командує", "p": ["Військові частини поділяються на підрозділи та об’єднуються в з’єднання. Окремі батальйони мають унікальні номери (слово «окремий» — підказка), а лінійні батальйони бригади нумеруються 1-й, 2-й, 3-й."], "ul": []}, {"h": "Звання вищого офіцерського складу", "p": ["У ЗСУ 44 звання: 22 армійських і 22 корабельних. Генерали та адмірали мають на погонах схрещені булави — давній символ влади козацьких гетьманів. Чим більше зірок — тим вище звання."], "ul": ["армійські: бригадний генерал, генерал-майор, генерал-лейтенант, генерал;", "корабельні: коммодор, контр-адмірал, віце-адмірал, адмірал."]}, {"h": "Кольори погонів", "p": [], "ul": ["ВМС — чорний; Повітряні Сили — синій; ССО — сірий (символ — вовкулаки, як козаки-характерники); решта — зелений.", "У польових умовах носять камуфляж і погони без яскравих кольорів.", "На фронті знаки розрізнення часто не носять, щоб не стати пріоритетною ціллю снайпера чи дрона."]}], "f": "Система звань із бригадним генералом і коммодором діє в Україні з 2020 року — за стандартами НАТО; звання генерал-полковника тепер не присвоюють.", "pr": ["Намалюйте (схематично) нарукавні знаки Сухопутних військ, Повітряних Сил, ВМС, ССО, ТрО і підпишіть, як їх запам’ятати.", "Запитайте рідних чи знайомих військових, які в них звання й нарукавний знак, і що вони означають."], "q": ["Чому краще не називати нарукавні знаки «шевронами»?", "Як відрізнити нарукавні знаки Сухопутних військ і Повітряних Сил?", "Чим військова частина відрізняється від підрозділу та з’єднання?", "Назвіть армійські звання вищого офіцерського складу.", "Чому на передовій часто не носять знаків розрізнення?"]}, {"n": "4", "t": "Чи тільки ЗСУ захищають державу?", "g": "Розуміти, що Сили оборони України ширші за ЗСУ, знати їхні складники та приклади взаємодії під час захисту країни.", "k": "", "terms": [["Сили оборони України", "ЗСУ та інші військові формування і правоохоронні органи, що захищають державу."], ["ППО", "протиповітряна оборона."], ["Мобільна вогнева група", "підрозділ, що збиває дрони-камікадзе з кулеметів, встановлених на автомобілях."]], "th": [{"h": "Не лише ЗСУ", "p": ["Стаття 17 Конституції покладає оборону України на Збройні Сили. Але сьогодні державу захищають і інші структури Сил оборони:"], "ul": ["Національна гвардія — охорона порядку й стратегічних об’єктів, повноцінна участь у бойових діях (бригади «Азов», «Хартія» та інші; оборона Маріуполя);", "СБУ — протидія ворожій агентурі, глибинні операції;", "Головне управління розвідки МО (ГУР) — військова розвідка;", "Державна прикордонна служба — охорона кордону й бойові бригади;", "Державна спеціальна служба транспорту — відновлення доріг, залізниць, мостів;", "Військова служба правопорядку — правопорядок серед військових;", "Національна поліція — правопорядок, евакуація, має бойові бригади;", "ДСНС — рятує життя, гасить пожежі, розбирає завали."]}, {"h": "Взаємодія під час нічної атаки дронів", "p": [], "ul": ["Радіотехнічні війська Повітряних Сил — виявляють цілі та передають дані;", "Зенітні ракетні війська — збивають цілі комплексами ППО (Patriot, NASAMS, IRIS-T тощо);", "Авіація — збиває дрони з літаків і гелікоптерів;", "Мобільні вогневі групи — збивають «шахеди» з кулеметів;", "Поліція — охороняє місце влучання, допомагає евакуюватися, документує злочини;", "ДСНС — гасить пожежі, розбирає завали, надає допомогу, облаштовує пункти обігріву."]}, {"h": "Висновок", "p": ["Вигук «Слава ЗСУ!» — щира подяка, але варто пам’ятати про всіх: прикордонників, гвардійців, рятувальників, поліцейських, розвідників. Перемога — результат спільної роботи всіх Сил оборони."], "ul": []}], "f": "Під час масованих атак ракетами та дронами в захисті одного міста одночасно можуть брати участь підрозділи кількох різних структур — від радіотехнічних військ до ДСНС.", "pr": ["Оберіть ситуацію (нічна атака дронів, ворожа диверсійна група біля мосту, пожежа після влучання) і опишіть, які складники Сил оборони діють і що робить кожен.", "Придумайте свій варіант подяки, що охоплює всіх захисників, а не лише ЗСУ."], "q": ["Яка стаття Конституції покладає оборону на ЗСУ?", "Назвіть 6 складників Сил оборони, крім ЗСУ.", "Хто виявляє ворожі цілі в повітрі, а хто їх збиває?", "Яку роль відіграють ДСНС і поліція після удару по місту?", "Чому перемога — справа всіх Сил оборони?"]}, {"n": "5", "t": "Ієрархічна структура армії", "g": "Знати ієрархію військових формувань від вогневої групи до корпусу, їхню орієнтовну чисельність і позначення на картах.", "k": "", "terms": [["Військове формування", "загальна назва для підрозділів, частин і з’єднань."], ["Батарея / дивізіон", "назви роти / батальйону в артилерії та ППО."], ["Масштабування позитивного досвіду", "розширення успішного підрозділу до вищого рівня (батальйон → полк → бригада)."]], "th": [{"h": "Від малого до великого (як LEGO)", "p": ["Відділення об’єднуються у взводи, взводи — в роти, роти — в батальйони, батальйони — в бригади (або полки), бригади — в корпуси. Чисельність дуже орієнтовна й залежить від роду військ:"], "ul": ["вогнева група / розрахунок / екіпаж — 2–4 особи (позначення Ø);", "відділення — 5–15 (близько 10) — ●;", "взвод — 15–45 (близько 30) — ●●●;", "рота / батарея — 60–250 (близько 100) — I;", "батальйон / дивізіон — 300–800 (близько 500) — II;", "полк / центр — 1–2,5 тис. — III;", "бригада — 2–5 тис. — X;", "корпус — 30+ тис. — XXX."]}, {"h": "Особливості ЗСУ", "p": [], "ul": ["основа — батальйонно-бригадна система: батальйони об’єднуються в бригади;", "полки є переважно в ППО, Силах підтримки й логістики; у ССО аналог полку — «центр»;", "нині створюється корпусна система: кілька бригад різної спеціалізації разом із медиками, логістами, безпілотниками утворюють корпус;", "дивізій і секцій в ЗСУ немає."]}, {"h": "Як запам’ятати", "p": ["Мнемоніка: «Від сірого вовка рудий бігав павич, брикався, драконив, кричав: “Абордаж!”» — відділення, взвод, рота, батальйон, полк, бригада, корпус, армія."], "ul": []}], "f": "Механізована рота може мати близько 100 осіб, а танкова — лише близько 30, хоча обидві називаються «рота».", "pr": ["Побудуйте схему-піраміду військових формувань від вогневої групи до корпусу з орієнтовною чисельністю та позначеннями на картах.", "Придумайте власну мнемоніку для запам’ятовування ієрархії."], "q": ["Назвіть військові формування від найменшого до найбільшого.", "Як називаються рота й батальйон в артилерії?", "Які формування не використовуються в ЗСУ?", "Як позначають на картах бригаду і батальйон?", "Що таке корпусна система?"]}, {"n": "6–7", "t": "Починаємо вчитися читати карти та грати у воргейми", "g": "Розуміти призначення військових карт, читати основні умовні тактичні знаки (належність, розмір і роль формування) та знати, що таке воргейм.", "k": "", "terms": [["Умовні тактичні знаки", "уніфіковані символи НАТО (NATO Joint Military Symbology) для позначення військ і об’єктів на картах."], ["Мережецентрична система", "цифрова система управління, де всі бачать бойову обстановку на карті в реальному часі (наприклад, «Кропива»)."], ["Дружній вогонь (friendly fire)", "помилковий вогонь по своїх."], ["Воргейм", "воєнна гра — симуляція збройного конфлікту для навчання та планування."]], "th": [{"h": "Навіщо карта", "p": ["Без карти неможливі планування, оборона, артилерійський вогонь, розвідка. Сучасні карти дедалі частіше цифрові: на планшеті командири бачать своїх (щоб уникнути дружнього вогню), позначають ворожі цілі, які одразу бачать усі. Щоб карти були зрозумілими всім, використовують єдині знаки."], "ul": []}, {"h": "Належність військ (колір і форма рамки)", "p": [], "ul": ["свої / союзні — синій прямокутник;", "ворожі — червоний ромб;", "нейтральні — зелений квадрат;", "невідомі (неідентифіковані) — жовта рамка «квітка».", "Розпізнати своїх і чужих у бою складно: обидві сторони можуть мати схожу техніку й форму, тому використовують додаткові знаки — кольоровий скотч на рукавах, символи на техніці."]}, {"h": "Розмір, штаб і роль", "p": [], "ul": ["розмір формування позначають над рамкою (●, ●●●, I, II, X тощо);", "штаб — прапорець: місце «держака» вказує на розташування;", "роль (функція) — символ у рамці: піхота (схрещені лінії, як патронташі), танки (овал-гусениця), артилерія (крапка-ядро), розвідка (діагональ-ремінь), інженери, зв’язок (блискавка), ППО (дуга-«парасолька»), медики (хрест), постачання, ремонт (ключ), безпілотники тощо;", "знаки поєднуються: піхота + гусениця = механізована піхота."]}, {"h": "Воргейми", "p": ["Воргейм — гра на карті з фішками підрозділів, кубиками й наказами, що імітує бойові дії. Воргейми використовують і в ЗСУ для планування операцій. Вони вчать мислити на кілька кроків уперед, враховувати місцевість, взаємодію та логістику. Схожі принципи ви знайдете у стратегічних комп’ютерних і настільних іграх."], "ul": []}], "f": "Карти OSINT-аналітиків (наприклад, DeepState) використовують ті самі принципи умовних позначень, тож навички з уроку допоможуть вам читати їх.", "pr": ["Намалюйте умовні знаки: свій механізований батальйон, ворожий танковий взвод, свою артилерійську батарею, невідомий підрозділ, свій штаб бригади.", "Відкрийте будь-яку публічну карту OSINT-аналітиків і знайдіть 3 умовні позначення. Поясніть, що вони означають."], "q": ["Навіщо потрібні єдині умовні знаки на картах?", "Як позначають своїх, ворожих, нейтральних і невідомих?", "Де на знаку вказують розмір формування?", "Як позначають штаб?", "Що таке воргейм і чого він навчає?"]}, {"n": "опційно", "t": "Аналіз проведених дій (After Action Review, AAR)", "g": "Знати, що таке аналіз проведених дій (АПД), навіщо його використовують у війську та як застосовувати в цивільному житті.", "k": "", "terms": [["АПД (AAR)", "аналіз проведених дій — структурований розбір виконаного завдання для навчання на досвіді; стандарт НАТО."]], "th": [{"h": "Що таке АПД", "p": ["After Action Review (AAR) — інструмент, розроблений в армії США, який сьогодні застосовують у найсучасніших підрозділах Сил оборони України на всіх рівнях — від відділення до найвищих штабів. Після виконання завдання команда разом відповідає на запитання:"], "ul": ["Що планували зробити?", "Що сталося насправді?", "Чому виникла різниця?", "Що зробимо так само наступного разу, а що — інакше?"]}, {"h": "Головні правила", "p": [], "ul": ["не шукати винних і не принижувати — розбирати ситуацію, а не людей;", "говорити чесно, незалежно від звання;", "робити конкретні висновки для майбутніх дій."]}, {"h": "", "p": ["АПД формує здорову культуру в колективі, розвиває професійність і мотивацію кожного. Його можна застосувати і в цивільному житті: після поїздки з друзями, командного проєкту, спортивних змагань, ремонту чи контрольної роботи."], "ul": []}], "f": "", "pr": ["Проведіть АПД будь-якої своєї недавньої справи (контрольна, змагання, шкільний проєкт) за чотирма запитаннями. Запишіть висновки."], "q": ["Що таке АПД і де його придумали?", "Які чотири запитання ставлять під час АПД?", "Чому під час АПД не можна шукати винних?", "Як АПД впливає на мотивацію команди?"]}, {"n": "8", "t": "Від взводу до бригади. Офіцерський, сержантський і рядовий склад", "g": "Знати звання та знаки розрізнення молодшого й старшого офіцерського, сержантського та рядового складу, розуміти роль сержантів і рядових у бою.", "k": "", "terms": [["Офіцерський склад", "командири від взводу й вище (молодші, старші, вищі офіцери)."], ["Сержантський склад", "основа управління в бою, «місток» між рядовими та офіцерами."], ["Рекрут", "наймолодше звання — під час навчання до складання присяги; без знаків розрізнення."]], "th": [{"h": "Масштабування досвіду", "p": ["Найкращим підрозділам дають більше ресурсів і розширюють їх: «Птахи Мадяра» пройшли шлях від взводу до бригади, «Азов» — від батальйону до бригади; з’являються полки та бригади Сил безпілотних систем, штурмові полки. Розширити ефективний підрозділ часто краще, ніж створювати новий з нуля."], "ul": []}, {"h": "Офіцери", "p": [], "ul": ["молодші: молодший лейтенант, лейтенант, старший лейтенант, капітан;", "старші: майор, підполковник, полковник;", "зазвичай лейтенанти командують взводами, капітани — ротами, підполковники — батальйонами, полковники — бригадами; на війні посаду часто обіймають люди з нижчим званням;", "корабельні звання: молодший лейтенант, лейтенант, старший лейтенант, капітан-лейтенант, капітан 3, 2 і 1 рангу."]}, {"h": "Сержанти", "p": ["Сержанти відповідають за дисципліну, навчання, повсякденне життя підрозділу й контроль виконання наказів. Вони командують відділеннями, часто — взводами."], "ul": ["молодший сержантський склад: молодший сержант (командир відділення), сержант (командир бойової машини, танка);", "старший: старший сержант (головний сержант взводу), головний сержант (роти), штаб-сержант (батальйону);", "вищий: майстер-
