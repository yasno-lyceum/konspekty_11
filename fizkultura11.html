<script>
const DATA = [{"id": "pe11", "name": "Фізична культура · 11 клас", "short": "Фізкультура 11", "themes": [{"name": "Розділ 1. Загальна фізична підготовка, легка атлетика і здоров'я", "lessons": [{"n": "1", "t": "Правила безпеки на уроках фізичної культури. Фізична культура і спорт в Україні", "g": "Знати загальні правила безпечної поведінки під час занять фізичними вправами, розуміти, що таке фізична підготовка, і знати основні віхи розвитку спорту в незалежній Україні.", "k": "1, 25, 79", "terms": [["Фізична культура", "частина культури суспільства: знання, вміння й діяльність, спрямовані на зміцнення здоров'я та фізичний розвиток людини."], ["Спорт", "змагальна діяльність і підготовка до неї з метою досягнення найвищих результатів."], ["Фізична підготовка", "процес розвитку фізичних якостей і вдосконалення рухових умінь."], ["ЗФП", "загальна фізична підготовка — всебічний розвиток сили, швидкості, витривалості, спритності й гнучкості."], ["СФП", "спеціальна фізична підготовка — розвиток якостей, потрібних у конкретному виді спорту."]], "th": [{"h": "Загальні правила безпеки", "p": [], "ul": ["займатися лише у спортивній формі та взутті з неслизькою підошвою; зняти прикраси, годинник;", "починати заняття тільки з розминки й лише з дозволу вчителя або тренера;", "перевіряти справність інвентарю та чистоту майданчика перед заняттям;", "дотримуватися дистанції під час бігу, стрибків і метань; не перебувати в зоні метання;", "не пити холодну воду одразу після інтенсивного навантаження;", "у разі болю, запаморочення чи травми негайно припинити вправу й повідомити дорослого;", "під час повітряної тривоги припинити заняття й організовано перейти в укриття."]}, {"h": "Фізична підготовка", "p": ["Фізична підготовка буває загальною (ЗФП) і спеціальною (СФП). ЗФП створює фундамент: розвиває всі фізичні якості та зміцнює організм. СФП будується на цьому фундаменті й готує до вимог конкретного виду спорту: наприклад, для футболіста важливі стартова швидкість і витривалість, для волейболіста — стрибучість."], "ul": []}, {"h": "Фізична культура і спорт в Україні", "p": [], "ul": ["діяльність у сфері фізичної культури і спорту регулює Закон України «Про фізичну культуру і спорт»;", "Національний олімпійський комітет України створено 1990 року;", "як незалежна держава Україна вперше виступила на зимових Олімпійських іграх 1994 року в Ліллегаммері, а на літніх — 1996 року в Атланті;", "в Україні розвиваються масовий спорт (спорт для всіх), дитячо-юнацький спорт, спорт вищих досягнень і паралімпійський рух."]}], "f": "Першу олімпійську золоту медаль для незалежної України виборола фігуристка Оксана Баюл на Іграх 1994 року в Ліллегаммері.", "pr": ["Складіть пам'ятку з 7 правил безпеки для уроку фізичної культури на стадіоні.", "Наведіть по два приклади вправ ЗФП та СФП для футболіста."], "q": ["Чим відрізняються ЗФП і СФП?", "Назвіть п'ять правил безпеки під час занять фізичними вправами.", "Що треба зробити, якщо під час заняття з'явилися біль або запаморочення?", "Коли Україна вперше виступила на Олімпійських іграх як незалежна держава?"]}, {"n": "2", "t": "Планування та методика розвитку основних фізичних якостей", "g": "Знати основні фізичні якості та методи їх розвитку, вміти планувати самостійні заняття.", "k": "3", "terms": [["Фізичні якості", "сила, швидкість, витривалість, гнучкість, спритність (координація)."], ["Навантаження", "обсяг та інтенсивність фізичної роботи."], ["Повторний метод", "виконання вправи кілька разів з відпочинком між повтореннями."]], "th": [{"h": "Методи розвитку якостей", "p": [], "ul": ["сила — вправи з обтяженням власною вагою (віджимання, присідання, планка), 2–3 підходи по 8–15 повторень;", "швидкість — короткі прискорення 20–30 м з повним відпочинком, рухливі ігри;", "витривалість — тривалий рівномірний біг, ходьба, плавання, велосипед (20–40 хв);", "гнучкість — щоденні вправи на розтягування після розминки;", "спритність — вправи зі зміною напрямку, з м’ячем, естафети."]}, {"h": "Принципи планування", "p": [], "ul": ["регулярність — 3–4 заняття на тиждень;", "поступовість — збільшувати навантаження повільно;", "чергування — не тренувати одну якість щодня;", "індивідуальність — враховувати свій стан здоров’я й рівень підготовки;", "самоконтроль — пульс, самопочуття, щоденник."]}, {"h": "Сенситивні (сприятливі) періоди", "p": ["Для підлітків 15–16 років особливо сприятливий період для розвитку сили й витривалості; швидкість і гнучкість також потребують постійної підтримки."], "ul": []}], "f": "", "pr": ["Складіть тижневий план самостійних занять для розвитку однієї фізичної якості.", "Заповніть таблицю «Фізична якість — вправи — дозування»."], "q": ["Назвіть основні фізичні якості.", "Якими вправами розвивають силу?", "Що таке повторний метод?", "Які принципи планування занять ви знаєте?"]}, {"n": "3", "t": "Біг на витривалість: повільний біг 6 хв, рівномірний біг до 1500 м", "g": "Знати особливості бігу на витривалість, правильну техніку й дихання, способи самоконтролю.", "k": "4, 5, 6, 9, 81, 82", "terms": [["Витривалість", "здатність довго виконувати роботу без зниження ефективності."], ["Рівномірний біг", "біг з постійною помірною швидкістю."], ["Аеробне навантаження", "робота, під час якої організму вистачає кисню."]], "th": [{"h": "Техніка", "p": [], "ul": ["біг з високого старту;", "корпус майже вертикальний, плечі розслаблені;", "руки зігнуті приблизно під прямим кутом, рухаються вздовж тулуба;", "постановка стопи м’яка, з передньої частини або з перекатом;", "дихання ритмічне, через ніс і рот, на 2–3 кроки вдих і на 2–3 — видих."]}, {"h": "Як розподілити сили", "p": ["Не починати занадто швидко; тримати рівний темп, прискорюватися лише на останніх 100–200 м. Якщо з’являється задишка — трохи знизити темп."], "ul": []}, {"h": "Користь і самоконтроль", "p": [], "ul": ["біг на витривалість зміцнює серце, легені, судини, підвищує працездатність;", "оптимальний пульс під час оздоровчого бігу для підлітків — приблизно 130–160 уд/хв;", "після бігу пульс має знизитися до вихідного за 5–10 хвилин;", "«правило розмови»: під час повільного бігу можна говорити, не задихаючись."]}], "f": "", "pr": ["Складіть план поступового переходу від 3 до 6 хвилин безперервного бігу за 4 тижні (для самостійних занять після дозволу лікаря).", "Поясніть «правило розмови» і як за ним визначити інтенсивність."], "q": ["Що таке витривалість?", "Як правильно дихати під час тривалого бігу?", "Як розподілити сили на дистанції 1500 м?", "Який пульс оптимальний під час оздоровчого бігу?"]}, {"n": "4", "t": "Біг на короткі дистанції: 30 м, 100 м, 200 м. Серії бігу 3×30 м, 2×100 м, 2×200 м", "g": "Знати фази спринтерського бігу, види стартів та значення серійного (повторного) бігу для розвитку швидкості.", "k": "7, 8, 79, 80, 99", "terms": [["Спринт", "біг на короткі дистанції (до 400 м) з максимальною швидкістю."], ["Низький старт", "старт зі стартових колодок; застосовують на 100, 200, 400 м."], ["Високий старт", "старт стоячи; застосовують на 30 м у школі та на довгих дистанціях."], ["Повторний (серійний) біг", "кілька відрізків з відпочинком між ними, напр. 3×30 м."]], "th": [{"h": "Фази спринтерського бігу", "p": [], "ul": ["старт — команди «На старт!», «Увага!», постріл (або «Руш!»);", "стартовий розбіг — перші 15–30 м, корпус поступово випрямляється, кроки збільшуються;", "біг по дистанції — максимальна швидкість, активна робота рук, біг на передній частині стопи;", "фініш — кидок грудьми або плечем на фінішну лінію, після фінішу — поступове зниження швидкості."]}, {"h": "Особливості 200 м", "p": ["Частину дистанції біжать по віражу (повороту): корпус нахиляють ліворуч, права рука працює ширше. Старт ставлять ближче до зовнішнього краю доріжки, щоб бігти по дотичній."], "ul": []}, {"h": "Серійний біг", "p": ["Повторний біг (3×30 м, 2×100 м, 2×200 м) розвиває швидкість і швидкісну витривалість. Між відрізками — відпочинок ходьбою до відновлення пульсу. Кожен відрізок пробігають з однаковою якістю техніки."], "ul": []}, {"h": "Типові помилки", "p": [], "ul": ["передчасне випрямлення на старті;", "біг «на п’ятках», закріпачені плечі;", "сповільнення перед фінішною лінією."]}], "f": "Світовий рекорд у бігу на 100 м (9,58 с) встановив Усейн Болт 2009 року — його середня швидкість становила майже 37,6 км/год.", "pr": ["Опишіть фази бігу на 100 м і зазначте головне завдання кожної.", "Обчисліть середню швидкість (м/с і км/год) бігуна, який пробіг 100 м за 14 с."], "q": ["Які фази має спринтерський біг?", "Чим низький старт відрізняється від високого?", "Як бігти по віражу?", "Для чого застосовують серійний біг?", "Як правильно фінішувати?"]}, {"n": "5", "t": "Стрибки в довжину з місця", "g": "Знати техніку стрибка в довжину з місця та правила вимірювання результату.", "k": "10, 83, 84", "terms": [["Вибухова сила", "здатність розвинути максимальне зусилля за найкоротший час."], ["Мах руками", "рух рук, що допомагає поштовху."]], "th": [{"h": "Техніка", "p": [], "ul": ["вихідне положення: ноги на ширині стопи чи плечей, носки біля лінії;", "підготовка: руки відводяться назад, ноги згинаються в колінах, корпус нахилений уперед;", "поштовх: одночасне розгинання ніг і мах руками вперед-угору;", "політ: ноги підтягнуті до грудей;", "приземлення: на обидві ноги з перекатом з п’ят на носки, коліна згинаються, руки вперед, щоб не впасти назад."]}, {"h": "Вимірювання", "p": ["Результат вимірюють від лінії поштовху до найближчого сліду, залишеного будь-якою частиною тіла. Тому падати назад на руки не можна — результат зменшиться."], "ul": []}, {"h": "Контрольний норматив (довідково)", "p": ["Стрибок у довжину з місця входить до державних тестів фізичної підготовленості; нормативи для юнаків і дівчат визначає навчальна програма."], "ul": []}], "f": "", "pr": ["Опишіть фази стрибка в довжину з місця та помилки в кожній.", "Поясніть, від якої точки вимірюють результат і чому важливо не падати назад."], "q": ["Яке вихідне положення перед стрибком?", "Навіщо робити мах руками?", "Як правильно приземлятися?", "Як вимірюють результат?"]}, {"n": "6", "t": "Метання малого м’яча на дальність з розбігу", "g": "Знати техніку метання малого м’яча з розбігу та правила безпеки під час метань.", "k": "12, 13, 79, 80, 85", "terms": [["Малий м’яч", "тенісний або спеціальний м’яч масою близько 150 г."], ["Схресний крок", "крок, під час якого права нога заходить уперед перед лівою (у правші), тулуб повертається боком."], ["Фінальне зусилля", "завершальний рух тіла й руки, що надає м’ячу швидкості."]], "th": [{"h": "Фази метання", "p": [], "ul": ["розбіг — 8–12 кроків з поступовим прискоренням;", "відведення руки з м’ячем назад (за 2 кроки);", "схресний крок — тулуб повертається боком, ліве плече спрямоване в бік метання;", "фінальне зусилля — постановка лівої ноги, поворот стегон, «натягнутий лук» тіла, рух руки над плечем, кидок під кутом близько 40–45°;", "зупинка після кидка, щоб не заступити за лінію."]}, {"h": "Правила безпеки", "p": [], "ul": ["метати лише за командою вчителя, в одному напрямку;", "ніхто не повинен перебувати в секторі метання;", "збирати м’ячі — тільки за командою, коли всі завершили кидки;", "розім’яти плечовий і ліктьовий суглоби перед метанням."]}, {"h": "Контрольний норматив (довідково)", "p": ["Метання малого м’яча на дальність — результат вимірюють від лінії до місця падіння м’яча; заступ за лінію — спроба не зараховується."], "ul": []}], "f": "", "pr": ["Опишіть фази метання та помилки, що зменшують дальність.", "Поясніть, чому оптимальний кут вильоту м’яча — близько 40–45°."], "q": ["Що таке схресний крок?", "Під яким кутом краще випускати м’яч?", "Які правила безпеки діють під час метання?", "Коли спроба не зараховується?"]}, {"n": "7", "t": "Фізичні вправи як засіб підвищення працездатності. Функціональні можливості організму", "g": "Розуміти, як регулярні фізичні вправи впливають на серцево-судинну, дихальну та нервову системи, і вміти оцінити свій функціональний стан простими пробами.", "k": "14, 75", "terms": [["Працездатність", "здатність людини виконувати роботу певний час без зниження її якості."], ["Функціональні можливості", "здатність систем організму (серця, легень, м'язів) пристосовуватися до навантажень."], ["Фізкультхвилинка", "коротка серія вправ (2–3 хв) під час розумової роботи для зняття втоми."], ["Проба Руф'є", "проба для оцінювання реакції серця на навантаження за зміною пульсу після 30 присідань."]], "th": [{"h": "Як вправи підвищують можливості організму", "p": [], "ul": ["серце тренованої людини скорочується сильніше, тому в спокої пульс у неї нижчий;", "зростає життєва ємність легень, дихання стає глибшим і рідшим;", "м'язи краще постачаються киснем і швидше відновлюються;", "покращуються увага, пам'ять і настрій, знижується рівень стресу."]}, {"h": "Динаміка працездатності протягом дня чи уроку", "p": ["Спочатку триває впрацювання: організм поступово налаштовується на роботу. Далі настає період стійкої працездатності, а потім — втома. Короткі фізкультхвилинки й активні перерви відсувають втому і повертають здатність зосереджуватися."], "ul": []}, {"h": "Проба Руф'є", "p": [], "ul": ["у спокої сидячи виміряйте пульс за 15 с (П1);", "виконайте 30 присідань за 45 с;", "одразу виміряйте пульс за перші 15 с (П2) і ще раз за останні 15 с першої хвилини відновлення (П3);", "індекс = (4 × (П1 + П2 + П3) − 200) / 10; що менший індекс, то краща реакція серця на навантаження."]}, {"h": "Фізкультхвилинка під час навчання", "p": [], "ul": ["потягування вгору з глибоким вдихом;", "нахили й повороти тулуба;", "кругові рухи плечима;", "вправи для очей: погляд удалину й близько;", "кілька присідань або кроків на місці."]}], "f": "Дослідження показують: навіть коротка активність (10–15 хвилин) перед розумовою роботою покращує концентрацію уваги в учнів.", "pr": ["Проведіть пробу Руф'є та обчисліть свій індекс.", "Складіть фізкультхвилинку з 5 вправ для перерви під час онлайн-уроків."], "q": ["Як заняття фізичними вправами впливають на серце і дихання?", "Назвіть фази працездатності.", "Як виконується проба Руф'є?", "Навіщо робити фізкультхвилинки?"]}, {"n": "8", "t": "Ознаки втоми. Самоконтроль під час занять фізичними вправами", "g": "Вміти розпізнавати ознаки втоми різного ступеня та контролювати свій стан під час фізичних навантажень.", "k": "56, 59", "terms": [["Втома", "тимчасове зниження працездатності внаслідок роботи."], ["Перевтома", "накопичена втома, коли організм не відновлюється між навантаженнями."], ["ЧСС", "частота серцевих скорочень (пульс)."]], "th": [{"h": "Ступені втоми (зовнішні ознаки)", "p": [], "ul": ["незначна — легке почервоніння шкіри, помірне потовиділення, дихання прискорене, рухи чіткі, увага збережена;", "значна — сильне почервоніння, рясне потовиділення, дихання часте, ротом, рухи менш точні, людина хитається;", "надмірна — різке почервоніння або блідість, синюшність губ, дуже часте поверхневе дихання, порушена координація, скарги на запаморочення, біль у грудях, нудоту — навантаження треба негайно припинити."]}, {"h": "Самоконтроль", "p": [], "ul": ["пульс у спокої (вранці) — показник тренованості;", "пульс вимірюють на зап’ясті чи шиї за 10 с або 15 с і множать на 6 або 4;", "після навантаження пульс має відновитися за кілька хвилин;", "суб’єктивні показники: самопочуття, сон, апетит, бажання займатися;", "щоденник самоконтролю допомагає помітити перевтому."]}, {"h": "Відновлення", "p": ["Повноцінний сон (8–9 годин для підлітків), вода, збалансоване харчування, заминка й розтяжка після тренування, чергування навантажень і відпочинку."], "ul": []}], "f": "", "pr": ["Виміряйте свій пульс у спокої три дні поспіль уранці й запишіть результати.", "Складіть таблицю ознак трьох ступенів втоми."], "q": ["Назвіть ознаки незначної, значної та надмірної втоми.", "За яких ознак навантаження треба негайно припинити?", "Як виміряти пульс?", "Що допомагає відновитися після навантажень?"]}, {"n": "9", "t": "Фізична культура в сім'ї. Вплив фізичних вправ на гармонійний розвиток", "g": "Знати форми спільної рухової активності в родині, рекомендації щодо обсягу щоденної активності та роль фізичних вправ у гармонійному розвитку юнаків і дівчат.", "k": "11, 15", "terms": [["Гармонійний розвиток", "узгоджений розвиток фізичних, психічних і соціальних якостей людини."], ["Руховий режим", "розподіл рухової активності протягом дня й тижня."], ["Гіподинамія", "недостатня рухова активність, що шкодить здоров'ю."], ["Активний відпочинок", "відпочинок через зміну діяльності: прогулянки, ігри, туризм."]], "th": [{"h": "Скільки рухатися", "p": [], "ul": ["Всесвітня організація охорони здоров'я радить дітям і підліткам 5–17 років щонайменше 60 хвилин помірної або інтенсивної рухової активності щодня;", "дорослим — 150–300 хвилин помірної активності на тиждень;", "щонайменше тричі на тиждень варто виконувати вправи для зміцнення м'язів і кісток."]}, {"h": "Форми фізичної культури в сім'ї", "p": [], "ul": ["ранкова гімнастика; прогулянки й скандинавська ходьба;", "велосипедні прогулянки, походи вихідного дня;", "рухливі та спортивні ігри на подвір'ї;", "сімейні спортивні свята й участь у масових забігах."]}, {"h": "Значення для гармонійного розвитку", "p": ["Регулярні вправи формують правильну поставу, зміцнюють серце, м'язи й кістки, допомагають підтримувати здорову вагу, покращують сон і настрій. Спільні заняття зближують родину, а батьки своїм прикладом формують у дітей звичку до здорового способу життя."], "ul": []}, {"h": "Підготовка до майбутнього батьківства", "p": [], "ul": ["дівчатам корисні вправи для зміцнення м'язів спини, живота й тазу, правильної постави та загальної витривалості — це основа здоров'я жінки й майбутньої матері;", "юнакам — розвиток сили й витривалості та звичка до активного способу життя, яку вони передадуть своїм дітям;", "для всіх важливі відмова від шкідливих звичок, повноцінний сон і збалансоване харчування."]}], "f": "Діти, батьки яких регулярно займаються спортом, набагато частіше самі стають фізично активними.", "pr": ["Складіть план спільної активності для своєї родини на вихідні.", "Запишіть свій руховий режим за один день і порахуйте хвилини активності."], "q": ["Скільки часу щодня мають рухатися підлітки за рекомендацією ВООЗ?", "Назвіть форми фізичної культури в сім'ї.", "Що таке гіподинамія і чим вона шкідлива?", "Як фізичні вправи впливають на гармонійний розвиток?"]}, {"n": "10", "t": "Оздоровчі вправи: постава, профілактика плоскостопості, розслаблення, відновлення дихання, вправи для очей", "g": "Знати вправи, що зберігають здоров’я хребта, стоп, очей і допомагають відновитися після навантаження.", "k": "9, 81, 83, 85, 88, 90, 94, 96, 97, 102, 104, 105", "terms": [["Постава", "звичне положення тіла стоячи й сидячи."], ["Плоскостопість", "сплощення склепіння стопи."], ["Самомасаж", "масаж власного тіла руками."]], "th": [{"h": "Постава", "p": [], "ul": ["стіна-тест: п’яти, сідниці, лопатки й потилиця торкаються стіни;", "вправи: «кішечка», «човник», планка, ходьба з предметом на голові;", "сидіти рівно, екран — на рівні очей."]}, {"h": "Профілактика плоскостопості", "p": [], "ul": ["ходьба на носках, п’ятах, зовнішньому краї стопи;", "захоплення пальцями ніг дрібних предметів;", "катання стопою м’ячика чи палиці."]}, {"h": "Відновлення та розслаблення", "p": [], "ul": ["ходьба з вправами на відновлення дихання: вдих — руки вгору, видих — вниз;", "ходьба зі зміною ритму;", "струшування руками й ногами, самомасаж (погладжування, розтирання);", "вправи на еластичність м’язів — плавне розтягування."]}, {"h": "Вправи для очей", "p": [], "ul": ["погляд удалину і на кінчик носа по черзі;", "кругові рухи очима;", "часте кліпання протягом 10 с;", "правило 20-20-20: кожні 20 хв дивитися 20 с на об’єкт за 6 м."]}], "f": "", "pr": ["Перевірте свою поставу стіна-тестом і опишіть результат.", "Складіть комплекс із 5 вправ для очей і стоп на кожен день."], "q": ["Як перевірити поставу?", "Які вправи запобігають плоскостопості?", "Що таке правило 20-20-20?", "Як відновити дихання після навантаження?"]}, {"n": "11", "t": "Харчування спортсмена. Індивідуальний план харчування футболіста", "g": "Знати роль основних поживних речовин, правила режиму харчування й питного режиму та вміти скласти власний тижневий план харчування футболіста.", "k": "2", "terms": [["Раціон", "набір і кількість продуктів, які людина споживає за день."], ["Калорійність", "кількість енергії, яку організм отримує з їжі."], ["Вуглеводи", "основне джерело енергії для м'язів (крупи, хліб, макарони, фрукти)."], ["Білки", "будівельний матеріал для м'язів (м'ясо, риба, яйця, молочні продукти, бобові)."], ["Питний режим", "регулярне вживання води для підтримки водного балансу."]], "th": [{"h": "Поживні речовини", "p": [], "ul": ["вуглеводи дають енергію для бігу, ривків і тривалої гри, тому їх у раціоні футболіста найбільше;", "білки потрібні для відновлення й зміцнення м'язів після навантажень;", "жири — запас енергії; краще обирати рослинні олії, горіхи, рибу;", "вітаміни й мінерали (овочі, фрукти, зелень) підтримують імунітет і роботу м'язів."]}, {"h": "Режим харчування", "p": [], "ul": ["4–5 прийомів їжі на день приблизно в той самий час;", "основний прийом їжі — за 2–3 години до тренування; за годину можна легкий перекус (банан, йогурт);", "після тренування протягом приблизно години — їжа з вуглеводами та білком;", "модель тарілки: половина — овочі й фрукти, чверть — крупи чи макарони, чверть — білкові продукти."]}, {"h": "Питний режим", "p": [], "ul": ["пити воду до, під час і після тренування невеликими порціями;", "спрага — ознака того, що організм уже втрачає воду;", "енергетичні напої й солодкі газовані напої підліткам не рекомендовані."]}, {"h": "Як скласти план на тиждень", "p": [], "ul": ["запишіть розклад тренувань і ігор;", "для кожного дня розпишіть сніданок, обід, вечерю й 1–2 перекуси;", "у дні тренувань додайте більше вуглеводів, у день відпочинку — більше овочів;", "перевірте, щоб щодня були білкові продукти, овочі, фрукти й достатньо води."]}], "f": "Під час матчу футболіст пробігає приблизно 10–12 км, тому запаси вуглеводів у м'язах дуже важливі для другого тайму.", "pr": ["Складіть індивідуальний план харчування футболіста на тиждень у вигляді таблиці (день — прийоми їжі — питний режим).", "Опишіть, що варто з'їсти перед вечірнім тренуванням і після нього."], "q": ["Яка поживна речовина є основним джерелом енергії для футболіста?", "Коли краще їсти перед тренуванням?", "Чому важливо пити воду під час тренування?", "Яка модель тарілки для збалансованого харчування?"]}, {"n": "12", "t": "Надання першої допомоги при отриманні спортивних травм", "g": "Знати види спортивних травм і правила першої домедичної допомоги.", "k": "1, 79", "terms": [["Забій", "пошкодження м’яких тканин без порушення шкіри."], ["Розтягнення", "пошкодження зв’язок суглоба."], ["Вивих", "зміщення суглобових поверхонь кісток."], ["Перелом", "порушення цілісності кістки."], ["Іммобілізація", "знерухомлення пошкодженої частини тіла."]], "th": [{"h": "Загальні правила", "p": [], "ul": ["припинити заняття, повідомити вчителя, викликати допомогу — 103 або 112;", "не рухати пошкоджену кінцівку без потреби;", "заспокоїти потерпілого, стежити за його станом."]}, {"h": "Допомога при травмах", "p": [], "ul": ["забій і розтягнення — спокій, холод на 10–15 хвилин (через тканину), тугувата пов’язка, піднесене положення кінцівки;", "вивих — НЕ вправляти самостійно; знерухомити в тому положенні, яке є, холод, до лікаря;", "перелом — знерухомити (шина з підручних засобів, що захоплює два сусідні суглоби), холод, виклик швидкої; при відкритому переломі — стерильна пов’язка, при сильній кровотечі — зупинка кровотечі;", "носова кровотеча — сісти, голову трохи нахилити вперед (не закидати назад!), притиснути крила носа на 10 хвилин, холод на перенісся;", "садна й подряпини — промити чистою водою, обробити антисептиком навколо рани, накласти пов’язку;", "тепловий удар — перенести в тінь, охолодити, дати воду маленькими ковтками."]}, {"h": "Чого не можна робити", "p": [], "ul": ["гріти свіжу травму;", "вправляти вивихи й переломи;", "продовжувати тренування «через біль»."]}], "f": "", "pr": ["Складіть таблицю «Травма — ознаки — перша допомога — чого не можна робити».", "Опишіть, як виготовити шину з підручних засобів при переломі передпліччя."], "q": ["Чим вивих відрізняється від розтягнення?", "Чому не можна гріти свіжу травму?", "Як діяти при носовій кровотечі?", "Що таке іммобілізація і навіщо вона?", "За якими номерами викликати допомогу?"]}]}, {"name": "Розділ 2. Футбол", "lessons": [{"n": "13", "t": "Інструктаж з БЖД на заняттях футболом. Історія розвитку та основні правила гри", "g": "Знати правила безпеки, історію футболу та основні правила гри.", "k": "1, 101", "terms": [["Офсайд (положення «поза грою»)", "гравець ближче до лінії воріт суперника, ніж м’яч і передостанній захисник, у момент передачі йому м’яча."], ["Стандартні положення", "кутовий, штрафний, пенальті, вкидання м’яча з-за бокової лінії."], ["VAR", "система відеоперегляду спірних моментів."]], "th": [{"h": "Правила безпеки", "p": [], "ul": ["форма, бутси чи кросівки відповідно до покриття, щитки на гомілки;", "зняти прикраси; ворота мають бути надійно закріплені — не висіти на поперечині;", "не виконувати підкати ззаду та удари ногою на рівні голови суперника;", "розминка обов’язкова; при травмі — негайно зупинитися й повідомити вчителя."]}, {"h": "Історія", "p": [], "ul": ["ігри з м’ячем ногами відомі в Китаї (цуцзю), Греції, Римі;", "1863 р. — в Англії створено Футбольну асоціацію та перші єдині правила — народження сучасного футболу;", "1904 р. — заснована FIFA; 1930 р. — перший чемпіонат світу (Уругвай);", "1954 р. — створено УЄФА; чемпіонат Європи — з 1960 р."]}, {"h": "Основні правила", "p": [], "ul": ["у команді на полі 11 гравців, серед них воротар;", "матч — два тайми по 45 хвилин з перервою 15 хвилин;", "розміри поля для міжнародних матчів — 100–110 × 64–75 м; ворота 7,32 × 2,44 м;", "руками грає лише воротар у своєму штрафному майданчику;", "порушення карають штрафним або пенальті, попередженням (жовта картка) чи вилученням (червона);", "гол зараховують, коли м’яч повністю перетнув лінію воріт."]}, {"h": "Футбол в Україні", "p": [], "ul": ["київське «Динамо» двічі вигравало Кубок володарів кубків (1975, 1986) і Суперкубок УЄФА (1975);", "донецький «Шахтар» виграв Кубок УЄФА у 2009 році;", "«Золотий м’яч» здобували Олег Блохін (1975), Ігор Бєланов (1986), Андрій Шевченко (2004);", "збірна України — чвертьфіналіст чемпіонату світу 2006 і Євро-2020; Україна разом з Польщею приймала Євро-2012."]}], "f": "Андрій Шевченко виграв Лігу чемпіонів з «Міланом» (2003) і став першим володарем «Золотого м’яча» в історії незалежної України (2004).", "pr": ["Намалюйте схему футбольного поля з розмітками (центральне коло, штрафний майданчик, точка пенальті, кутові сектори).", "Поясніть своїми словами правило офсайду з прикладом-схемою."], "q": ["Коли з’явилися перші єдині правила футболу?", "Скільки триває матч?", "Які розміри футбольних воріт?", "Що таке офсайд?", "Назвіть українських володарів «Золотого м’яча»."]}, {"n": "14", "t": "Удари по м’ячу ногою", "g": "Знати способи ударів по м’ячу ногою та їхнє призначення.", "k": "16, 22, 23, 24, 81, 83, 84, 85, 86, 88, 89, 91, 99, 100, 104", "terms": [["Удар внутрішньою стороною стопи", "найточніший удар, для передач на короткі й середні відстані."], ["Удар підйомом", "удар верхньою частиною стопи (шнурівкою); сильний, для ударів по воротах і далеких передач."], ["Опорна нога", "нога, що стоїть поруч із м’ячем під час удару."]], "th": [{"h": "Способи ударів", "p": [], "ul": ["внутрішньою стороною стопи — точні передачі;", "серединою підйому — сильні прямі удари;", "внутрішньою частиною підйому — навісні передачі, «закручені» удари;", "зовнішньою частиною підйому — удари з обертанням («шведкою»);", "носком — рідко, коли немає часу на замах."]}, {"h": "Фази удару", "p": [], "ul": ["розбіг — прямолінійний або під кутом;", "постановка опорної ноги збоку від м’яча (носок у напрямку удару);", "замах ударною ногою (згинання в коліні);", "удар — ступня напружена, зафіксована;", "супровід м’яча — нога продовжує рух у напрямку удару."]}, {"h": "Поради", "p": ["Дивіться на м’яч у момент удару, корпус над м’ячем для низького удару; відхилення корпусу назад робить удар «свічкою»."], "ul": []}], "f": "", "pr": ["Складіть таблицю «Спосіб удару — коли застосовують — точність / сила».", "Опишіть фази удару серединою підйому."], "q": ["Який удар найточніший і чому?", "Куди ставлять опорну ногу?", "Чому м’яч летить угору, якщо корпус відхилено назад?", "Для чого застосовують удар внутрішньою частиною підйому?"]}, {"n": "15", "t": "Зупинки та ведення м’яча різними способами", "g": "Знати способи зупинки й ведення м’яча і розуміти, коли їх застосовують.", "k": "16, 18, 20, 23, 81, 83, 86, 87, 88, 92, 98, 100, 101, 104", "terms": [["Зупинка (прийом) м’яча", "гасіння швидкості м’яча, щоб узяти його під контроль."], ["Ведення м’яча", "переміщення з м’ячем серією легких поштовхів."]], "th": [{"h": "Способи зупинки", "p": [], "ul": ["підошвою — для м’ячів, що котяться;", "внутрішньою стороною стопи — найпоширеніша;", "стегном — для м’ячів, що летять на рівні пояса;", "грудьми — для високих м’ячів;", "головою — рідко, у складних ситуаціях.", "Принцип: частина тіла «поступається» м’ячу, гасячи його швидкість (амортизація)."]}, {"h": "Способи ведення", "p": [], "ul": ["внутрішньою стороною стопи — зручно змінювати напрямок;", "зовнішньою частиною підйому — швидке ведення по прямій;", "серединою підйому — на великій швидкості;", "голова піднята, щоб бачити поле; м’яч близько до ноги, якщо поруч суперник."]}, {"h": "Контрольні нормативи (довідково)", "p": ["Зупинка м’яча різними способами та ведення м’яча зі зміною напрямку (між стійками) на час."], "ul": []}], "f": "", "pr": ["Опишіть, якою частиною тіла краще зупинити м’яч у 5 різних ситуаціях.", "Поясніть, чому під час ведення важливо тримати голову піднятою."], "q": ["Назвіть способи зупинки м’яча.", "Що означає «амортизувати» м’яч?", "Які способи ведення м’яча ви знаєте?", "Коли м’яч ведуть близько до ноги?"]}, {"n": "16", "t": "Фінти. Відбирання м’яча в підкаті", "g": "Знати, що таке фінти, їхні види, та правила безпечного відбору м’яча.", "k": "20, 25, 26, 89, 90, 93, 94, 103", "terms": [["Фінт", "обманний рух, що змушує суперника рушити в хибному напрямку."], ["Відбір", "дії, щоб заволодіти м’ячем суперника."], ["Підкат", "відбір м’яча в ковзанні по газону."]], "th": [{"h": "Види фінтів", "p": [], "ul": ["«відходом» — показати рух в один бік і піти в інший;", "«ударом» — імітувати удар чи передачу, а потім обійти суперника;", "«зупинкою» — різко зупинитися й змінити темп;", "переступи через м’яч."]}, {"h": "Відбір м’яча", "p": [], "ul": ["стоячи — випадом, виставленою ногою;", "плечем у плече (дозволений силовий прийом);", "у підкаті — ковзаючи по газону, вибити або забрати м’яч ногою."]}, {"h": "Безпека підкату", "p": ["Підкат виконують лише збоку або спереду, граючи в м’яч, а не в ногу суперника. Підкат ззаду, двома ногами чи з шипами вперед — грубе порушення, що карається червоною карткою й може спричинити важку травму. На шкільних уроках і на твердому покритті підкати не виконують."], "ul": []}], "f": "", "pr": ["Опишіть два фінти, які ви бачили у професійних футболістів.", "Складіть правила безпечного відбору м’яча."], "q": ["Що таке фінт?", "Назвіть види фінтів.", "Які способи відбору м’яча ви знаєте?", "Коли підкат вважається грубим порушенням?"]}, {"n": "17", "t": "Удари по м’ячу головою. Техніка удару лобом", "g": "Знати техніку удару лобом і правила безпечного виконання.", "k": "17, 19, 21, 90, 92, 93, 103", "terms": [["Удар лобом", "удар серединою лоба — основний і найбезпечніший спосіб удару головою."]], "th": [{"h": "Техніка", "p": [], "ul": ["стежити за м’ячем до моменту удару, очі відкриті;", "шия напружена, підборіддя трохи притиснуте;", "удар серединою лоба (не маківкою чи скронею);", "рух іде від корпусу: прогин назад і різкий рух уперед;", "удари виконують з місця, у стрибку або в падінні."]}, {"h": "Безпека та здоров’я", "p": ["Часті удари головою можуть шкодити мозку, тому в багатьох країнах для дітей і підлітків кількість таких ударів на тренуваннях обмежують. На уроках використовують легкі м’ячі й невелику кількість повторів. При запамороченні, головному болю чи нудоті після удару — негайно припинити заняття."], "ul": []}], "f": "", "pr": ["Опишіть техніку удару лобом по етапах.", "Поясніть, чому для підлітків обмежують кількість ударів головою."], "q": ["Якою частиною голови б’ють по м’ячу?", "Чому шия має бути напруженою?", "Які симптоми після удару головою — привід припинити заняття?"]}, {"n": "18", "t": "Гра воротаря: кидки руками, вибивання м’яча ногами, гра на виходах", "g": "Знати основні технічні прийоми воротаря та правила, що стосуються його гри.", "k": "94, 95, 96, 97", "terms": [["Вихід воротаря", "рух воротаря з воріт, щоб перехопити м’яч до удару суперника."], ["Введення м’яча в гру", "кидок рукою або удар ногою воротаря після того, як він заволодів м’ячем."]], "th": [{"h": "Прийоми воротаря", "p": [], "ul": ["ловля м’яча — «чашечкою» з долонь, прижимання до грудей;", "відбивання кулаком — коли не впевнений, що спіймаєш;", "стрибок-кидок — для м’ячів у кут;", "вибір позиції — на бісектрисі кута між м’ячем і стійками воріт."]}, {"h": "Введення м’яча", "p": [], "ul": ["кидок знизу (котом) — на короткі відстані;", "кидок зверху (як гандбольний) — на середні відстані;", "вибивання з рук або з землі — на далекі відстані, для швидкої атаки."]}, {"h": "Гра на виходах", "p": ["Воротар виходить, щоб перехопити навісну передачу або скоротити кут перед ударом нападника. Потрібні рішучість, правильний вибір моменту і гучна команда захисникам («Моя!»)."], "ul": []}, {"h": "Правила для воротаря", "p": [], "ul": ["грати руками дозволено лише у своєму штрафному майданчику;", "тримати м’яч у руках — не довше 6 секунд;", "не можна брати в руки м’яч після навмисної передачі ногою від свого гравця."]}], "f": "Українець Олександр Шовковський провів понад 20 сезонів у воротах київського «Динамо» і відбив вирішальні пенальті в серії з Швейцарією на чемпіонаті світу 2006 року.", "pr": ["Намалюйте схему вибору позиції воротарем при ударі з флангу й по центру.", "Складіть таблицю «Спосіб введення м’яча — відстань — перевага»."], "q": ["Де воротар може грати руками?", "Скільки секунд воротар може тримати м’яч?", "Як обирає позицію воротар?", "Що таке гра на виходах?"]}, {"n": "19", "t": "Тактика футболу: швидкий і поступовий напад, організація оборони", "g": "Знати види нападу й оборони та принципи командної тактики у футболі.", "k": "20, 24, 27, 28, 90, 91, 95, 96, 97, 98, 104, 105", "terms": [["Швидкий напад (контратака)", "стрімка атака після відбору м’яча, поки суперник не організував оборону."], ["Поступовий (позиційний) напад", "атака з контролем м’яча, серіями передач, пошуком слабкого місця."], ["Персональна оборона", "кожен захисник опікає конкретного суперника."], ["Зонна оборона", "кожен захисник відповідає за свою зону поля."]], "th": [{"h": "Швидкий напад", "p": [], "ul": ["мінімум передач — довгі передачі вперед, ривки нападників;", "застосовують, коли суперник багатьма гравцями пішов в атаку;", "оборона проти нього — швидке повернення в оборону, страховка, перекриття зон і напрямків передач."]}, {"h": "Поступовий напад", "p": [], "ul": ["контроль м’яча, передачі в ширину й глибину;", "розтягування оборони суперника, пошук вільного простору;", "оборона проти нього — компактність, щільні лінії, пресинг."]}, {"h": "Схеми розстановки", "p": ["Розстановку позначають цифрами від захисту до атаки (без воротаря): 4-4-2, 4-3-3, 3-5-2. Вона визначає, скільки гравців у кожній лінії, але в грі гравці постійно взаємодіють і змінюють позиції."], "ul": []}, {"h": "Принципи командної гри", "p": [], "ul": ["кожен гравець атакує і обороняється;", "комунікація — голосові підказки партнерам;", "підтримка партнера з м’ячем, відкривання для передачі."]}], "f": "Тренер Валерій Лобановський одним з перших у світі застосував наукові методи (статистику, моделювання) у підготовці футбольної команди.", "pr": ["Намалюйте схему розстановки 4-4-2 або 4-3-3 і позначте зони відповідальності.", "Опишіть ситуацію, коли команді вигідно застосувати швидкий напад."], "q": ["Чим швидкий напад відрізняється від поступового?", "Що таке персональна та зонна оборона?", "Що означає розстановка 4-3-3?", "Які принципи командної гри ви знаєте?"]}, {"n": "20", "t": "Особливості підготовки дівчат у футболі", "g": "Знати історію жіночого футболу, особливості організму дівчат, які враховують під час тренувань, і способи профілактики травм.", "k": "18, 92", "terms": [["Жіночий футбол", "футбол за тими самими правилами, що й чоловічий, у жіночих командах."], ["Профілактика травм", "заходи, що зменшують ризик пошкоджень: розминка, зміцнення м'язів, правильна техніка."], ["Стабілізаційні вправи", "вправи для утримання рівноваги й контролю положення суглобів."]], "th": [{"h": "Жіночий футбол у світі та в Україні", "p": [], "ul": ["перший чемпіонат світу ФІФА серед жінок відбувся 1991 року в Китаї;", "з 1996 року жіночий футбол входить до програми Олімпійських ігор;", "жіноча збірна України 2009 року вперше вийшла до фінальної частини чемпіонату Європи;", "в Україні проводиться чемпіонат серед жіночих команд, діють жіночі футбольні школи та секції."]}, {"h": "Особливості, які враховують у тренуванні", "p": [], "ul": ["у дівчат зазвичай менша м'язова маса, тому більше уваги приділяють силовій підготовці (м'язи ніг, корпусу);", "дівчата гнучкіші, але зв'язки колінного суглоба в них більш вразливі — потрібні вправи на стабілізацію коліна й правильне приземлення;", "навантаження дозують з урахуванням самопочуття, зокрема в критичні дні;", "техніка й тактика гри однакові для всіх, тому дівчата опановують ті самі прийоми."]}, {"h": "Профілактика травм", "p": [], "ul": ["ретельна розминка з бігом, стрибками й зміною напрямку;", "приземлення на зігнуті ноги, коліна не «заходять» усередину;", "зміцнення м'язів задньої поверхні стегна й корпусу;", "якісне взуття та щитки."]}], "f": "Фінал чемпіонату світу серед жінок 2023 року, у якому перемогла збірна Іспанії, дивилися мільйони глядачів у всьому світі.", "pr": ["Складіть комплекс із 6 вправ розминки для профілактики травм коліна.", "Підготуйте коротке повідомлення про одну видатну футболістку."], "q": ["Коли відбувся перший чемпіонат світу серед жінок?", "З якого року жіночий футбол є олімпійським видом?", "Які особливості організму дівчат враховують у тренуванні?", "Як запобігти травмам колінного суглоба?"]}]}, {"name": "Розділ 3. Баскетбол", "lessons": [{"n": "21", "t": "Правила безпеки на уроках баскетболу. Історія та основні правила гри", "g": "Знати правила безпечної поведінки, історію баскетболу й основні правила гри.", "k": "29", "terms": [["Пробіжка", "порушення: гравець з м’ячем робить більше двох кроків без ведення."], ["Подвійне ведення", "порушення: повторне ведення після зупинки або ведення двома руками."], ["Фол", "порушення правил з неспортивним контактом."]], "th": [{"h": "Правила безпеки", "p": [], "ul": ["спортивна форма й кросівки зі щільною фіксацією гомілкостопа; зняти прикраси;", "підстригти нігті, щоб не травмувати пальці;", "не висіти на кошику й щиті;", "не штовхати гравців, не підставляти ніг, не ставати під гравця, що приземляється;", "м’ячі, що не використовуються, тримати в руках або в кошику;", "про травму чи погане самопочуття — одразу повідомляти вчителя."]}, {"h": "Історія", "p": [], "ul": ["1891 р. — канадець Джеймс Нейсміт, викладач у Спрингфілді (США), придумав гру з кошиками від персиків;", "1932 р. — заснована Міжнародна федерація баскетболу (FIBA);", "1936 р. — баскетбол став олімпійським видом спорту;", "з 2020 р. (Ігри в Токіо, 2021) олімпійським став і баскетбол 3×3."]}, {"h": "Основні правила", "p": [], "ul": ["у команді на майданчику 5 гравців;", "матч — 4 чверті по 10 хв (FIBA);", "кошик на висоті 3,05 м;", "влучання — 2 очки, з-за 3-очкової лінії (6,75 м) — 3 очки, штрафний — 1 очко;", "м’яч ведуть однією рукою; на атаку — 24 секунди; з зони захисту треба вивести м’яч за 8 секунд;", "5 персональних фолів — гравець залишає гру."]}, {"h": "Баскетбол в Україні", "p": ["Український центровий Олександр Волков грав у НБА; Святослав Михайлюк, Олексій Лень, Алекс Лень виступали в НБА. Жіноча та чоловіча збірні України беруть участь у чемпіонатах Європи."], "ul": []}], "f": "Перші кошики були закритими, і після кожного влучання м’яч діставали драбиною.", "pr": ["Складіть пам’ятку «Правила безпеки на уроці баскетболу».", "Намалюйте баскетбольний майданчик з основними лініями (центральна, штрафна, 3-очкова)."], "q": ["Хто і коли придумав баскетбол?", "Скільки очок дає влучання з-за 3-очкової лінії?", "Що таке пробіжка?", "На якій висоті кошик?", "Скільки фолів можна отримати до вилучення?"]}, {"n": "22", "t": "Стійки, пересування, зупинки й повороти в нападі та захисті", "g": "Знати основні елементи техніки пересування баскетболіста.", "k": "30, 34", "terms": [["Опорна (осьова) нога", "нога, яку не можна відривати від підлоги під час повороту з м’ячем."], ["Зупинка двома кроками / стрибком", "способи зупинки після бігу чи ведення."]], "th": [{"h": "Стійки", "p": [], "ul": ["стійка нападника — ноги на ширині плечей, коліна зігнуті, м’яч біля грудей;", "стійка захисника — ноги ширше плечей, низька позиція, одна рука вгорі, друга збоку, вага на передній частині стоп."]}, {"h": "Пересування", "p": [], "ul": ["ходьба, біг, біг спиною вперед;", "приставні кроки (у захисті) — ноги не схрещуються;", "стрибки, ривки, прискорення на 5–20 м з різних вихідних положень."]}, {"h": "Зупинки та повороти", "p": [], "ul": ["зупинка стрибком — приземлення на обидві ноги одночасно;", "зупинка двома кроками — «раз-два»;", "повороти вперед і назад на опорній нозі — для захисту м’яча від суперника."]}], "f": "", "pr": ["Опишіть стійку захисника та стійку нападника.", "Поясніть, що таке опорна нога і чому її не можна відривати."], "q": ["Чим відрізняється стійка захисника від стійки нападника?", "Які способи зупинки ви знаєте?", "Як пересувається захисник?"]}, {"n": "23", "t": "Ловіння і передачі м’яча", "g": "Знати способи ловіння й передач м’яча та вміти обирати передачу відповідно до ситуації.", "k": "31, 35, 39, 48", "terms": [["Передача від грудей", "основна передача двома руками."], ["Передача з відскоком", "м’яч відбивається від підлоги на шляху до партнера."], ["Передача зверху", "передача однією чи двома руками над головою, зокрема на велику відстань."]], "th": [{"h": "Ловіння", "p": [], "ul": ["руки назустріч м’ячу, пальці розслаблені й розведені;", "у момент ловлі — амортизація: руки згинаються, м’яч підтягується до грудей;", "погляд на м’яч до моменту ловлі."]}, {"h": "Способи передач", "p": [], "ul": ["двома руками від грудей — найточніша, на середні відстані;", "з відскоком від підлоги — проти високого захисника;", "двома руками зверху — через голову суперника;", "однією рукою від плеча чи зверху — на велику відстань, для швидкого прориву."]}, {"h": "Вправи", "p": ["Передачі в парах, трійках, четвірках, на місці й у русі, у зустрічних колонах, в умовах опору захисників."], "ul": []}], "f": "", "pr": ["Складіть таблицю «Спосіб передачі — коли застосовують».", "Опишіть, як правильно ловити м’яч."], "q": ["Яка передача найточніша?", "Коли застосовують передачу з відскоком?", "Що таке амортизація під час ловлі?"]}, {"n": "24", "t": "Ведення м’яча. Ведення без зорового контролю", "g": "Знати техніку ведення м’яча та способи його чергування.", "k": "31", "terms": [["Ведення", "переміщення з м’ячем ударами об підлогу однією рукою."], ["Без зорового контролю", "ведення, коли гравець не дивиться на м’яч, а стежить за грою."]], "th": [{"h": "Техніка ведення", "p": [], "ul": ["м’яч штовхають кистю й пальцями, а не б’ють долонею;", "висока стійка — ведення на швидкості, низька — під опіку захисника;", "тіло закриває м’яч від суперника;", "голова піднята, погляд на майданчик."]}, {"h": "Способи", "p": [], "ul": ["на місці й у русі;", "правою й лівою рукою;", "зі зміною висоти відскоку;", "зі зміною напрямку, переводом перед собою, за спиною, між ногами;", "чергування різних способів без зорового контролю."]}, {"h": "Кидок після ведення та подвійного кроку", "p": ["Після ведення гравець робить два кроки (перший — довгий, другий — короткий, з відштовхуванням) і кидає м’яч однією рукою зверху у кошик, часто з відскоком від щита."], "ul": []}], "f": "", "pr": ["Опишіть помилки ведення (пробіжка, подвійне ведення) і як їх уникнути.", "Поясніть, навіщо вміти вести м’яч без зорового контролю."], "q": ["Якою частиною руки ведуть м’яч?", "Чому голова має бути піднятою?", "Опишіть подвійний крок."]}, {"n": "25", "t": "Кидки м’яча в кошик з середньої та далекої відстані", "g": "Знати техніку кидка однією рукою від плеча та в стрибку, умови серійних кидків.", "k": "32, 36, 37, 38, 40, 41, 42, 46", "terms": [["Середня дистанція", "кидок з відстані приблизно 3–6 м."], ["Далекий кидок", "кидок з-за 3-очкової лінії (6,75 м)."], ["Пасивний / активний опір", "захисник лише заважає / намагається накрити чи вибити м’яч."]], "th": [{"h": "Техніка кидка однією рукою від плеча", "p": [], "ul": ["ноги на ширині плечей, коліна зігнуті;", "м’яч на кінчиках пальців кидкової руки, друга рука підтримує збоку;", "лікоть під м’ячем, спрямований у кошик;", "розгинання ніг і руки одночасно, кистю — «захльостування»;", "м’яч летить по дузі з обертанням назад."]}, {"h": "Кидок у стрибку", "p": ["Кидок виконують у найвищій точці стрибка — так його складніше заблокувати."], "ul": []}, {"h": "Серійні кидки", "p": ["Кидки з різних точок (кути, фланги, центр) на середній і далекій відстані; після ведення, фінтів, технічних прийомів; без опору, з пасивним і активним опором захисника."], "ul": []}], "f": "", "pr": ["Опишіть по етапах кидок однією рукою від плеча.", "Поясніть, чому кидок у стрибку важче заблокувати."], "q": ["Де має бути лікоть кидкової руки?", "Яка траєкторія польоту м’яча правильна?", "Скільки очок дає далекий кидок?"]}, {"n": "26", "t": "Штрафний кидок і дії гравців під час його виконання", "g": "Знати техніку штрафного кидка й правила розташування гравців.", "k": "44, 45, 46", "terms": [["Штрафний кидок", "кидок з лінії штрафного (4,6 м від щита) без опору; 1 очко."]], "th": [{"h": "Техніка", "p": [], "ul": ["стійка за лінією, ноги на ширині плечей;", "кілька ударів м’ячем об підлогу для концентрації (власний ритуал);", "погляд на передній край кошика;", "кидок однією рукою від плеча з розгинанням ніг;", "на кидок — 5 секунд, заступати на лінію не можна до торкання кошика."]}, {"h": "Дії гравців", "p": [], "ul": ["гравці займають місця вздовж зони біля кошика: ближні — захисники;", "до кидка не можна заходити в зону;", "після торкання м’ячем кошика гравці борються за відскок."]}, {"h": "Контрольний норматив (довідково)", "p": ["Кількість влучних штрафних кидків із 10 спроб."], "ul": []}], "f": "", "pr": ["Опишіть свій «ритуал» підготовки до штрафного кидка.", "Намалюйте розташування гравців під час штрафного кидка."], "q": ["З якої відстані виконують штрафний кидок?", "Скільки секунд дається на кидок?", "Коли гравці можуть заходити в зону?"]}, {"n": "27", "t": "Боротьба за м’яч, що відскочив від щита. Добивання. Накривання кидка", "g": "Знати, як діяти під щитом у нападі й захисті.", "k": "44", "terms": [["Підбирання (відскок)", "заволодіння м’ячем після невлучного кидка."], ["Добивання", "кидок одразу після відскоку, у стрибку."], ["Накривання (блок-шот)", "відбивання м’яча суперника під час кидка."]], "th": [{"h": "Боротьба за відскок", "p": [], "ul": ["відсікання: стати між суперником і кошиком, спиною до нього;", "стрибок з двох ніг, ловля м’яча двома руками в найвищій точці;", "після приземлення — захистити м’яч ліктями, передати партнеру."]}, {"h": "Добивання", "p": ["Нападник у стрибку однією або двома руками спрямовує м’яч назад у кошик, не приземляючись. Потрібні стрибучість і вибір моменту."], "ul": []}, {"h": "Накривання кидка", "p": ["Захисник вистрибує вертикально й відбиває м’яч рукою, не торкаючись руки суперника (інакше фол). Не можна торкатися м’яча на низхідній траєкторії над кошиком."], "ul": []}], "f": "", "pr": ["Опишіть техніку відсікання під щитом.", "Поясніть, коли накривання кидка є порушенням."], "q": ["Що таке відсікання?", "Чим добивання відрізняється від звичайного кидка?", "Коли накривання вважається фолом?"]}, {"n": "28", "t": "Взаємодії гравців. Вихід на вільне місце. Заслони. Фінти. Позиційний напад", "g": "Знати основні тактичні взаємодії гравців у нападі та захисті.", "k": "38", "terms": [["Заслін", "нападник закриває шлях захисникові, звільняючи партнера."], ["Фінт", "обманний рух (показ передачі, кидка, проходу)."], ["Позиційний напад", "організована атака з розстановкою гравців і комбінаціями."]], "th": [{"h": "Вихід на вільне місце", "p": ["Нападник без м’яча рухається ривками, змінює напрямок, щоб звільнитися від опіки й отримати передачу. Захисник протидіє — тримається між суперником і кошиком, бачить і м’яч, і гравця."], "ul": []}, {"h": "Заслін", "p": [], "ul": ["гравець нерухомо стає на шляху захисника партнера;", "партнер проходить впритул до заслону;", "протидія: захисники «проскакують», перемикаються (змінюються суперниками)."]}, {"h": "Фінти", "p": ["Показ кидка — захисник стрибає, нападник проходить; показ передачі — кидок; зміна швидкості та напрямку. Серійні кидки після фінтів тренують при пасивному й активному опорі."], "ul": []}, {"h": "Нападу й захист", "p": [], "ul": ["швидкий прорив — атака до повернення захисту;", "позиційний напад — розстановка, передачі, заслони;", "особистий захист — кожен опікає свого гравця;", "зонний захист — кожен відповідає за свою зону."]}], "f": "", "pr": ["Намалюйте схему заслону двох гравців.", "Опишіть два фінти та ситуації, коли їх застосовують."], "q": ["Що таке заслін і як йому протидіяти?", "Як нападник виходить на вільне місце?", "Чим особистий захист відрізняється від зонного?"]}, {"n": "29", "t": "Баскетбол: зонний захист і швидкий прорив", "g": "Розуміти принципи зонного захисту (розстановки 3–2 і 2–3) та знати фази швидкого прориву.", "k": "33, 34, 47", "terms": [["Особистий захист", "кожен захисник опікає конкретного суперника."], ["Зонний захист", "кожен захисник відповідає за свою ділянку майданчика."], ["Розстановка 3–2", "троє захисників у першій лінії ближче до центру, двоє — під кошиком."], ["Швидкий прорив", "стрімка атака після заволодіння м'ячем, поки суперник не повернувся в захист."]], "th": [{"h": "Зонний захист", "p": [], "ul": ["захисники рухаються разом із м'ячем, зберігаючи розстановку, і закривають свою зону;", "розстановка 3–2 добре протидіє кидкам із середньої та далекої відстані, але залишає вразливою зону під кошиком і кути;", "розстановка 2–3 надійніше закриває кошик, але слабша проти дальніх кидків;", "проти зонного захисту ефективні швидкі передачі, кидки з-за меж зони та перевантаження однієї сторони."]}, {"h": "Фази швидкого прориву", "p": [], "ul": ["заволодіння м'ячем: підбирання після промаху, перехоплення;", "перша передача: швидкий вихід м'яча з-під свого кошика;", "просування м'яча: передачами або веденням по трьох коридорах;", "завершення: кидок з близької відстані, часто з подвійного кроку."]}, {"h": "Як захищатися від швидкого прориву", "p": ["Після втрати м'яча всі гравці швидко повертаються в захист, найближчий захисник затримує ведучого, а решта закривають кошик і шляхи передач."], "ul": []}], "f": "Швидкий прорив вважають одним із найрезультативніших способів атаки, бо кидок виконується без активного опору захисників.", "pr": ["Намалюйте схему зонного захисту 3–2 і позначте зони відповідальності кожного гравця.", "Опишіть фази швидкого прориву на прикладі гри вашої команди."], "q": ["Чим зонний захист відрізняється від особистого?", "Які сильні та слабкі сторони розстановки 3–2?", "Назвіть фази швидкого прориву.", "Як команда має діяти після втрати м'яча?"]}, {"n": "30", "t": "Методика організації самостійних занять. Організація техніко-тактичних дій під час гри", "g": "Вміти організувати самостійне тренування з баскетболу та розуміти, як поєднувати техніку й тактику в грі.", "k": "43", "terms": [["Техніко-тактичні дії", "застосування технічних прийомів відповідно до ігрової ситуації."]], "th": [{"h": "Самостійне заняття", "p": [], "ul": ["розминка 10 хв: біг, ЗРВ, ведення на місці;", "основна частина: кидки з різних точок, ведення зі зміною рук, штрафні;", "ЗФП: стрибки, планка, віджимання;", "заминка: розтягування, відновлення дихання;", "самоконтроль: пульс, щоденник результатів (кількість влучань)."]}, {"h": "Техніко-тактичні дії", "p": ["Гравець не просто виконує прийом, а обирає його: передати чи кидати, вести чи зупинитися, поставити заслін чи вийти на вільне місце. Вчаться цього в навчальній грі, аналізуючи ситуації."], "ul": []}], "f": "", "pr": ["Складіть план самостійного тренування з баскетболу на 40 хвилин.", "Опишіть ігрову ситуацію і правильне тактичне рішення в ній."], "q": ["З яких частин складається самостійне заняття?", "Що таке техніко-тактичні дії?", "Як вести самоконтроль під час занять?"]}]}, {"name": "Розділ 4. Волейбол", "lessons": [{"n": "31", "t": "Роль спортивних ігор у вихованні морально-вольових якостей. Волейбол в олімпійському русі", "g": "Розуміти, які моральні та вольові якості виховують спортивні ігри, і знати місце волейболу в олімпійському русі.", "k": "49, 63, 66", "terms": [["Морально-вольові якості", "риси характеру: цілеспрямованість, наполегливість, сміливість, витримка, чесність, відповідальність."], ["Чесна гра (фейр-плей)", "дотримання правил і повага до суперника, суддів, партнерів."], ["Командний дух", "єдність і взаємопідтримка гравців заради спільної мети."], ["Олімпізм", "філософія олімпійського руху, що поєднує спорт, культуру й освіту."]], "th": [{"h": "Що виховують спортивні ігри", "p": [], "ul": ["відповідальність перед командою і вміння діяти разом;", "наполегливість і витримку: гра триває до останнього очка;", "сміливість і рішучість у складних ігрових ситуаціях;", "самоконтроль емоцій після помилок чи суперечливих рішень судді;", "повагу до суперника і чесність."]}, {"h": "Волейбол в олімпійському русі", "p": [], "ul": ["Міжнародну федерацію волейболу (FIVB) засновано 1947 року;", "волейбол входить до програми Олімпійських ігор з 1964 року (Токіо);", "пляжний волейбол став олімпійським видом 1996 року (Атланта);", "волейбол сидячи — паралімпійський вид спорту."]}], "f": "Волейбол придумав 1895 року американський викладач фізичного виховання Вільям Морган.", "pr": ["Опишіть ситуацію з гри, у якій вам знадобилися витримка чи сміливість.", "Складіть «кодекс чесної гри» для вашої команди з 5 правил."], "q": ["Які морально-вольові якості виховують спортивні ігри?", "Що таке фейр-плей?", "З якого року волейбол є олімпійським видом спорту?", "Коли пляжний волейбол став олімпійським?"]}, {"n": "32", "t": "Інструктаж з безпеки життєдіяльності на заняттях з волейболу. Спеціальні бігові та стрибкові вправи", "g": "Знати правила безпечної поведінки на заняттях волейболом і розуміти призначення спеціальних бігових і стрибкових вправ.", "k": "49", "terms": [["Інструктаж з БЖД", "ознайомлення з правилами безпеки перед заняттями; первинний — на початку розділу, повторний — перед кожним уроком."], ["Розминка", "комплекс вправ, що готує м’язи, суглоби, серце й дихання до навантаження."], ["Спеціальні бігові вправи", "вправи, що розвивають техніку бігу, швидкість і координацію."], ["Спеціальні стрибкові вправи", "вправи для розвитку вибухової сили ніг і стрибучості."]], "th": [{"h": "Правила безпеки на заняттях волейболом", "p": [], "ul": ["займатися лише у спортивній формі та взутті з неслизькою підошвою; зняти прикраси, годинник;", "розпочинати гру тільки після розминки та за сигналом учителя;", "не виконувати подачу, доки партнери не готові, і не подавати в бік людей;", "не висіти на сітці й не штовхати гравців біля неї;", "стежити за м’ячами, що відкотилися на майданчик, — на них можна травмувати гомілкостоп;", "під час блокування й нападу приземлятися на обидві ноги, на свою половину;", "при будь-якій травмі чи поганому самопочутті — негайно повідомити вчителя."]}, {"h": "Навіщо розминка", "p": ["Волейбол — гра з різкими стрибками, ривками й падіннями. Без розминки зростає ризик розтягнень і травм суглобів. Розминка підвищує температуру м’язів, еластичність зв’язок і частоту серцевих скорочень, налаштовує нервову систему на швидку реакцію."], "ul": []}, {"h": "Спеціальні бігові вправи", "p": [], "ul": ["біг з високим підніманням стегна — сила м’язів-згиначів стегна, частота кроків;", "біг із закиданням гомілки назад — розслаблення задньої поверхні стегна;", "семенячий біг — частота рухів і робота стопи;", "приставні кроки лівим і правим боком, біг спиною вперед — пересування волейболіста по майданчику;", "прискорення на 10–15 м зі зміною напрямку за сигналом — швидкість реакції."]}, {"h": "Спеціальні стрибкові вправи", "p": [], "ul": ["стрибки на двох ногах на місці та з просуванням;", "багатоскоки з ноги на ногу;", "стрибки вгору з імітацією нападаючого удару чи блоку;", "стрибки через скакалку — ритм і робота гомілкостопа.", "Стрибкові вправи виконують після бігової частини розминки, приземлюючись м’яко, на передню частину стопи з перекатом."]}], "f": "Волейболіст високого рівня за одну гру може виконати понад 100 стрибків.", "pr": ["Складіть пам’ятку «7 правил безпеки на уроці волейболу».", "Опишіть комплекс розминки волейболіста з 8 вправ: назва вправи, її мета, дозування (кількість повторів або час)."], "q": ["Для чого проводять первинний і повторний інструктаж з БЖД?", "Назвіть 5 правил безпеки на заняттях волейболом.", "Чому без розминки зростає ризик травм?", "Яку мету мають біг з високим підніманням стегна та приставні кроки?", "Як правильно приземлятися після стрибка?"]}, {"n": "33", "t": "Історія розвитку волейболу. Основні поняття та правила гри", "g": "Знати історію виникнення волейболу та основні правила гри.", "k": "49", "terms": [["Розіграш (раллі)", "період гри від подачі до моменту, коли м’яч поза грою; кожен розіграш приносить очко."], ["Перехід", "зміна позицій гравців за годинниковою стрілкою після отримання права подачі."], ["Ліберо", "гравець захисту в формі іншого кольору; не подає, не блокує, не атакує вище сітки."], ["Зони майданчика", "шість позицій гравців, пронумерованих від 1 до 6."]], "th": [{"h": "Історія", "p": [], "ul": ["1895 р. — Вільям Морган, викладач фізкультури з міста Голіок (США), придумав гру «мінтонет»; згодом її назвали волейболом (volley — удар з льоту, ball — м’яч);", "1947 р. — створено Міжнародну федерацію волейболу (FIVB);", "1964 р. — волейбол став олімпійським видом спорту (Токіо), з 1996 р. — також пляжний волейбол;", "в Україні волейбол поширився в 1920-х роках; сьогодні діють чоловіча й жіноча Суперліги."]}, {"h": "Майданчик і інвентар", "p": [], "ul": ["майданчик 18 × 9 м, розділений сіткою на дві половини 9 × 9 м;", "висота сітки: чоловіки — 2,43 м, жінки — 2,24 м;", "лінія атаки — за 3 м від сітки; вона відділяє передню зону від задньої;", "м’яч: обвід 65–67 см, маса 260–280 г."]}, {"h": "Основні правила", "p": [], "ul": ["у команді на майданчику 6 гравців;", "партія триває до 25 очок з перевагою щонайменше у 2 очки; вирішальна п’ята партія — до 15;", "матч — до трьох виграних партій;", "команда має право на три торкання м’яча (без урахування блоку); один гравець не може торкатися двічі поспіль;", "помилки: м’яч за межами майданчика, чотири торкання, подвійне торкання, торкання сітки, заступ за центральну лінію, неправильна розстановка;", "після виграшу права подачі гравці виконують перехід за годинниковою стрілкою."]}, {"h": "Зони майданчика", "p": ["Зона 1 — задня права (звідси подають), 2 — передня права, 3 — передня центральна, 4 — передня ліва, 5 — задня ліва, 6 — задня центральна. Гравці передньої лінії (2, 3, 4) можуть атакувати й блокувати біля сітки."], "ul": []}, {"h": "Волейбол як засіб фізичного виховання", "p": ["Волейбол розвиває швидкість реакції, стрибучість, спритність, координацію, силу рук і ніг, а також командну взаємодію, рішучість, уміння швидко ухвалювати рішення та контролювати емоції. Це безконтактна гра, тому нею можна займатися в будь-якому віці."], "ul": []}], "f": "Перший офіційний чемпіонат світу з волейболу серед чоловіків відбувся 1949 року в Празі.", "pr": ["Намалюйте схему волейбольного майданчика з розмірами, лінією атаки та зонами 1–6.", "Складіть 10 тестових запитань про правила волейболу для однокласників."], "q": ["Хто і коли винайшов волейбол?", "Які розміри майданчика та висота сітки?", "До скількох очок триває партія?", "Скільки торкань м’яча має команда?", "Які якості розвиває волейбол?"]}, {"n": "34", "t": "Стійка волейболіста, переміщення гравців по майданчику, розстановка", "g": "Знати види стійок і переміщень волейболіста та розстановку гравців.", "k": "64, 65, 67, 68", "terms": [["Стійка", "положення готовності до дії з м’ячем."], ["Розстановка", "розташування гравців по зонах перед подачею."]], "th": [{"h": "Види стійок", "p": [], "ul": ["висока — ноги злегка зігнуті, для верхніх передач;", "середня — основна, коліна зігнуті під кутом близько 120°;", "низька — для прийому сильних ударів і подач.", "У всіх стійках вага на передній частині стоп, руки перед собою, погляд на м’яч."]}, {"h": "Способи переміщення", "p": [], "ul": ["кроком і приставним кроком — на короткі відстані;", "схресним кроком — для швидкого зміщення вбік;", "бігом і стрибком — на великі відстані;", "після переміщення — зупинка в стійці, готовність до дії."]}, {"h": "Розстановка", "p": ["Перед подачею гравці займають зони 1–6: троє біля сітки (2, 3, 4) і троє позаду (1, 6, 5). Після виграшу подачі суперника команда робить перехід за годинниковою стрілкою."], "ul": []}], "f": "", "pr": ["Намалюйте розстановку гравців у зонах 1–6.", "Опишіть три види стійок і коли їх застосовують."], "q": ["Які бувають стійки волейболіста?", "Де має бути вага тіла в стійці?", "Які способи переміщення ви знаєте?", "Як відбувається перехід гравців?"]}, {"n": "35", "t": "Прийом м’яча знизу. Прийом однією рукою з падінням і перекатом", "g": "Знати техніку прийому м’яча знизу двома руками та однією рукою з падінням, розуміти, як безпечно падати.", "k": "50, 51, 58, 59, 61, 62, 70, 78", "terms": [["Прийом знизу", "приймання м’яча передпліччями з’єднаних рук; основний спосіб прийому подачі й сильних ударів."], ["Стійка волейболіста", "положення готовності: ноги зігнуті, вага на передній частині стоп, руки перед собою."], ["Самостраховка", "уміння безпечно падати й перекочуватися після прийому."]], "th": [{"h": "Прийом знизу двома руками", "p": [], "ul": ["стійка: ноги на ширині плечей, коліна зігнуті, корпус трохи нахилений уперед;", "руки випрямлені й з’єднані (одна долоня в другій, великі пальці паралельно), утворюють рівну «платформу» з передпліч;", "м’яч приймають передпліччями ближче до зап’ясть, а не кистями;", "рух виконують ногами — розгинанням колін, а не махом рук;", "«платформу» спрямовують туди, куди має полетіти м’яч (до зв’язкового гравця)."]}, {"h": "Прийом однією рукою з падінням", "p": ["Застосовують, коли до м’яча не встигнути двома руками. Гравець робить випад у бік м’яча, приймає його кистю чи передпліччям однієї руки і, щоб не травмуватися, виконує падіння з перекатом:"], "ul": ["дівчата — падіння вперед з перекатом на стегно та живіт;", "юнаки — падіння вперед з ковзанням на груди (перекатом на груди), руки амортизують;", "головне правило безпеки: не падати на випрямлені руки, коліна чи лікті; група тіла та м’які перекати."]}, {"h": "Типові помилки", "p": [], "ul": ["прийом кистями або зігнутими руками;", "мах руками замість роботи ніг;", "пізній вихід під м’яч, прийом «на прямих ногах»."]}], "f": "", "pr": ["Опишіть по етапах техніку прийому м’яча знизу.", "Поясніть, чому падіння з перекатом безпечніше, ніж падіння на руки."], "q": ["Якою частиною рук приймають м’яч знизу?", "Як з’єднують руки для прийому?", "Чому рух виконують ногами, а не руками?", "Коли застосовують прийом однією рукою з падінням?", "Які правила безпеки під час падіння?"]}, {"n": "36", "t": "Передача м’яча. Різновиди передач", "g": "Знати техніку верхньої передачі двома руками та різновиди передач, що вивчаються в старших класах.", "k": "52, 53, 55, 57, 63, 72", "terms": [["Верхня передача", "передача м’яча кінчиками пальців обох рук над головою."], ["Зв’язковий (пасуючий)", "гравець, який виконує другу передачу для нападу."], ["Зависла передача", "висока передача, після якої м’яч ніби «зависає» біля сітки для нападника."], ["Передача через зону", "передача, наприклад, із зони 2 в зону 4 через зону 3."]], "th": [{"h": "Техніка верхньої передачі", "p": [], "ul": ["вихід під м’яч так, щоб він опинився над лобом;", "ноги зігнуті, одна трохи попереду;", "руки над обличчям, пальці розведені, утворюють «ківш»; великі та вказівні пальці — «трикутник»;", "м’яча торкаються подушечками пальців, а не долонями;", "передача виконується розгинанням ніг і рук одночасно, м’яч спрямовують у потрібному напрямку."]}, {"h": "Різновиди передач", "p": [], "ul": ["багаторазові передачі в стіну зі зміною висоти й відстані — точність і контроль;", "завислі передачі в ближню зону (з 2 в 3, з 3 в 2);", "передачі через зону (з 2 в 4, з 4 у 2);", "передачі з пересуванням у парах і трійках;", "передачі в падінні та в стрибку, передача за спину — для обману блоку суперника."]}, {"h": "Контрольний норматив (довідково)", "p": ["6 передач на точність через сітку із зон 2, 3, 4 у визначену зону."], "ul": []}], "f": "", "pr": ["Намалюйте схему передач «через зону» і «в ближню зону» на майданчику.", "Опишіть типові помилки верхньої передачі та як їх виправити."], "q": ["Якими частинами пальців торкаються м’яча під час верхньої передачі?", "Що таке зависла передача?", "Навіщо зв’язковому передача за спину?", "Як потрібно вийти під м’яч перед передачею?"]}, {"n": "37", "t": "Подача м’яча. Верхня бокова подача. Подача в ліву та праву половину майданчика. Тактика подачі", "g": "Знати види подач, техніку верхньої бокової подачі та тактику вибору напрямку подачі.", "k": "50, 51, 52, 57, 63, 64, 66, 70, 71", "terms": [["Подача", "введення м’яча в гру ударом рукою із зони подачі (за лицьовою лінією)."], ["Нижня пряма подача", "найпростіша: удар знизу, м’яч летить по високій траєкторії."], ["Верхня пряма подача", "удар над головою обличчям до сітки."], ["Верхня бокова подача", "гравець стоїть боком до сітки, удар виконується над головою широким рухом руки."], ["Планер", "подача без обертання м’яча, траєкторія якої непередбачувана."]], "th": [{"h": "Правила подачі", "p": [], "ul": ["подають із зони подачі за лицьовою лінією, не заступаючи на неї;", "на подачу — 8 секунд після свистка судді;", "м’яч треба підкинути або відпустити з руки й ударити однією рукою;", "подача, що торкнулася сітки й перелетіла на бік суперника, — правильна."]}, {"h": "Техніка верхньої бокової подачі", "p": [], "ul": ["вихідне положення: стоячи лівим боком до сітки (для правші), ноги на ширині плечей, м’яч у лівій руці;", "підкидання: м’яч підкидають лівою рукою вгору над правим плечем на висоту 1–1,5 м;", "замах: праву руку відводять униз-назад, вага тіла — на правій нозі;", "удар: рука описує дугу через бік угору, тулуб повертається до сітки, удар — долонею по нижній задній частині м’яча у найвищій точці;", "після удару вага переходить на ліву ногу, гравець швидко входить у майданчик."]}, {"h": "Тактика подачі", "p": [], "ul": ["подача в ліву чи праву половину майданчика змушує суперника переміщатися;", "подача на гравця, слабшого у прийомі, або на того, хто щойно вийшов на заміну;", "подача в зону між гравцями, у зону 1 або 5 біля ліній;", "подача гравцеві, який має атакувати, — щоб ускладнити йому наступний напад;", "пріоритет — надійність: помилка на подачі дарує суперникові очко."]}, {"h": "Контрольні нормативи (довідково)", "p": ["Учні виконують серію подач на влучність у визначену зону (юнаки — верхні, дівчата — нижні прямі подачі) та подачі в ліву й праву половини майданчика. Оцінюють кількість влучних подач і правильність техніки."], "ul": []}], "f": "Швидкість подачі у стрибку в найсильніших волейболістів світу перевищ
